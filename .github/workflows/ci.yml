# clinosim CI — hard-gate on tests, informational on lint / typecheck.
#
# Hard gates (must be green to merge):
#   - unit tests on Python 3.11 and 3.12
#   - integration tests on Python 3.12 (single 3.11 skip = ~18min job, cost-vs-value)
#   - jp-clins-compliance: JP-CLINS Observation-LabResult-eCS profile for JP cohorts
#
# Informational (visible but does not block merge — pre-existing lint / mypy
# debt is tracked as follow-up cleanup, this keeps the debt VISIBLE without
# freezing the repo):
#   - ruff check + ruff format --check
#   - mypy strict
#
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (with dev extras)
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/unit -q --tb=short

  integration:
    name: Integration tests (Py 3.12, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (with dev extras)
        run: pip install -e ".[dev]"
      - name: Run integration tests (shard ${{ matrix.shard }}/3, xdist -n 2)
        run: >
          pytest tests/integration -q --tb=short
          -n 2 --dist=worksteal
          -m "not serial"
          --splits 3 --group ${{ matrix.shard }}

  integration_serial:
    name: Integration tests (serial pass)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (with dev extras)
        run: pip install -e ".[dev]"
      - name: Run serial-marked integration tests
        run: pytest tests/integration -q --tb=short -m serial || [ $? -eq 5 ]

  lint:
    name: Lint (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.3"
      - name: ruff check
        run: ruff check clinosim/ tests/
      - name: ruff format --check
        run: ruff format --check clinosim/ tests/

  typecheck:
    name: Type check (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (with dev extras)
        run: pip install -e ".[dev]"
      - name: mypy
        run: mypy clinosim/

  reproducibility:
    name: Reproducibility (Py 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (runtime deps only; dev extras not needed for the script)
        run: pip install -e "."
      - name: Run scripts/reproduce.sh
        run: bash scripts/reproduce.sh

  jp-clins-compliance:
    name: JP-CLINS lab compliance gate (Py 3.12)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (with dev extras)
        run: pip install -e ".[dev]"
      - name: Generate JP cohort (p=10, seed=42)
        run: python -m clinosim.simulator.cli generate --population 10 --seed 42 -o /tmp/jp-cohort --country JP --hospital-config clinosim/config/hospital_operations.yaml
      - name: Eval jp_clins_lab_compliance axis and gate on FAIL
        run: |
          set -euo pipefail
          python -m clinosim.simulator.cli eval --cohort-dir /tmp/jp-cohort --country JP --json /tmp/eval-report.json > /dev/null 2>&1 || true
          jp_clins_status=$(python3 -c "import json; data=json.load(open('/tmp/eval-report.json')); [print(c['outcome'], end='') for c in data.get('checks',[]) if c.get('axis')=='jp_clins_lab_compliance']" || echo "ERROR")
          echo "jp_clins_lab_compliance: $jp_clins_status"
          if [ "$jp_clins_status" = "FAIL" ]; then exit 1; fi

  packaging:
    name: Build sdist + wheel (Py 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: pip install build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: Verify PyPI-compatible metadata
        run: twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 7
