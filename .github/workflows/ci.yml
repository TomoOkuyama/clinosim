# clinosim CI — hard-gate on tests, lint, format and types.
#
# Hard gates (must be green to merge):
#   - unit tests on Python 3.12 (tests/unit + tests/modules +
#     tests/simulator; PR gate; 3.11 covered by the nightly cron)
#   - integration tests on Python 3.12 (4 shards cut by whole test file × xdist -n 4)
#   - a `CI result` job that needs every job above and fails if any of them
#     did not succeed; the master ruleset requires it (Issue #3765)
#   - fast tests (Issue #3771, one job): narrative regression goldens and
#     the fast end-to-end tests (tests/e2e/test_alpha_golden.py +
#     test_identity_jp.py, ~1 min locally; Issue #3070). The slow e2e
#     files (forced scenario ~3.5 min, US mode ~6 min, beta ~7.5 min
#     locally) run nightly, see `nightly.yml`.
#   - static checks (Issue #3771, one job): ruff check, ruff format --check,
#     mypy strict, vulture dead-code, sdist + wheel build and twine check
#
# Informational (does not block merge; master pushes only, Issue #3772):
#   - unit test coverage combine (80 % soft floor)
#
# Rate-of-change gates (moved off the PR path per session 82 CI review):
#   - reproducibility (`scripts/reproduce.sh`)  → runs nightly, see `nightly.yml`.
#     Determinism regressions are rare, the check costs ~5-6 min, and nightly
#     detection is soon enough to unwind the offending PR before it ships.
#   - Python 3.11 unit tests → run weekly (nightly.yml) and immediately before
#     any release tag. Pre-release smoke covers the 3.11 compatibility floor
#     without paying 2× cost on every PR.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # The nightly .test_durations refresh PR is opened with GITHUB_TOKEN, which
  # starts no pull_request run; the nightly job dispatches CI on the PR branch
  # instead, so the required checks report on its head commit.
  workflow_dispatch:

# Cancel an in-flight run when a newer push to the same ref arrives — on a
# PR, no point testing obsolete code; on master (Issue #3770), the newest
# run tests a tree that contains every earlier merge, so a burst of merges
# keeps only the last run. The cost: when a master run fails, the commit
# that broke it is found by bisecting between the last green master run
# and the failing one, since the runs in between were cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Py 3.12 shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # A push to master also measures coverage (COV_ARGS below), which takes
    # the shards to 10-15 min against 4-9 min on a pull request; at 15 the
    # push runs of 2026-11-28 were cut off at 90-93 % with every test passing.
    timeout-minutes: 25
    # Historical:
    #   * Single-worker serial (pre-S114):                    ~8-9 min
    #   * S115 (2026-09-14) N=3 shards × xdist -n 2:          ~3-4 min per shard
    #   * Issue #3766 (2026-11-25) N=2 shards × xdist -n 4: ~4-7 min per shard
    #
    # The layout is sized for throughput, not for one run's wall time: PRs
    # are usually open in parallel and the account runs at most 20 jobs at
    # once, so what counts is runner time and job slots per PR. The runner
    # has 4 vCPU / 15 GB (logged by the "Runner size" step). Unit tests: 3
    # shards × -n 2 summed about 1000 s of job time per run, 2 shards × -n 4
    # about 645 s.
    #
    # `scripts/ci_split_by_file.py` splits the test files of `tests/unit` +
    # `tests/modules` (Issue #2497) + `tests/simulator` into 2 groups by
    # whole file, bin-packed on the per-file sums of `.test_durations`
    # (shared with integration; see the integration job). Within each
    # shard, `pytest-xdist -n 4 --dist=worksteal` runs one worker per vCPU.
    #
    # Coverage (master pushes only, Issue #3772): each shard writes
    # `.coverage.shard-N` (isolated via `COVERAGE_FILE` env var) and
    # uploads it as an artifact. The `unit-coverage-combine` job (below)
    # downloads all shard data, runs `coverage combine`, and produces the
    # final XML — so the 80 % soft floor still reflects the full-suite
    # exercised code. Coverage is not a gate, so a PR run neither measures
    # nor uploads it; the combined report of master is the one to read.
    #
    # `.test_durations` is seeded once and refreshed alongside the
    # integration regen described below when test-suite composition
    # drifts noticeably.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"  # pinned: an unpinned "latest" lookup can fail the job; bump on purpose
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install (with dev extras)
        run: uv pip install --system -e ".[dev]"
      - name: Runner size
        # Issue #3766: the shard layout assumes this vCPU count.
        run: echo "nproc=$(nproc) mem=$(free -g | awk '/^Mem:/{print $2}')G"
      - name: Run unit tests (shard ${{ matrix.shard }}/2)
        env:
          COVERAGE_FILE: ".coverage.shard-${{ matrix.shard }}"
          COV_ARGS: ${{ github.event_name == 'push' && '--cov=clinosim --cov-report=' || '' }}
        run: >
          pytest $(python scripts/ci_split_by_file.py --splits 2 --group ${{ matrix.shard }}
          tests/unit tests/modules tests/simulator) -q --tb=short
          -n 4 --dist=worksteal
          $COV_ARGS
      - name: Upload coverage data (shard ${{ matrix.shard }})
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.shard }}
          path: .coverage.shard-${{ matrix.shard }}
          retention-days: 1
          include-hidden-files: true

  unit-coverage-combine:
    name: Unit test coverage combine (informational)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 5
    if: github.event_name == 'push'
    # Coverage combine is informational — a shard failure blocks merge
    # via the `unit` job above, so this stage only exists to produce a
    # single combined XML artifact + summary. The 80 % floor stays soft
    # (`|| [ $? -eq 2 ]`) as before.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"  # pinned: an unpinned "latest" lookup can fail the job; bump on purpose
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install coverage
        run: uv pip install --system "coverage[toml]"
      - name: Download all shard coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - name: Combine + report
        run: |
          coverage combine
          coverage xml -o coverage.xml
          coverage report --fail-under=80 || [ $? -eq 2 ]
      - name: Upload combined coverage XML
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30
      # Codecov upload — enable by adding CODECOV_TOKEN as a repo secret,
      # then uncomment the step below. Without it, coverage.xml is still
      # available as a workflow artifact.
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     files: coverage.xml
      #     fail_ci_if_error: false

  integration:
    name: Integration tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: unit
    # Historical:
    #   * Single-worker serial:  ~42-50 min on GitHub-hosted ubuntu-latest
    #   * PR #373 (session 65):  xdist -n 2 (2 vCPUs)                  ≈ 25 min
    #   * PR E   (session 65):   xdist -n 2  ×  pytest-split N=3       ≈ 8-10 min
    #   * S114 (2026-09-14):     xdist -n 2  ×  pytest-split N=5       ≈ 5-6 min
    #   * S115 (2026-09-14):     xdist -n 2  ×  pytest-split N=10      ≈ 3-4 min
    #   * Issue #3766 (2026-11-25): xdist -n 4 --dist=loadfile × N=4    ≈ 10-20 min
    #
    # Issue #3766 sizes the matrix for throughput, not one run's wall time:
    # PRs are usually open in parallel against the account's 20-job limit,
    # so runner time and job slots per PR decide how long PRs wait. Summed
    # integration job time per run: N=10 × -n 2 4063-5262 s (about 35 runs,
    # 10 jobs); N=4 × -n 4 loadfile about 3440 s (4 jobs). The tests run
    # simulations that use several cores themselves, so -n 4 makes each
    # test slower and the slowest shard longer (about 950-1170 s); the
    # saving is the per-job setup and the module-scoped fixtures, which
    # `--dist=loadfile` builds once per file instead of once per worker
    # that receives a test of the file (as `worksteal` did).
    #
    # The notes below were written for the N=10 / -n 2 layout; the
    # reasoning on bin packing and the slowest single test still applies.
    #
    # Shards are cut by whole test file (`scripts/ci_split_by_file.py`,
    # 2026-11-26): a file's weight is the sum of its tests in
    # `.test_durations`, and files are bin-packed longest first onto the
    # least-loaded shard. pytest-split cut test by test, so the tests of one
    # file could land in several shards, each of which built the file's
    # module-scoped fixture (a simulated cohort) again while
    # `.test_durations` charged that setup to one test; the shards ran
    # 684-1347 s apart. Within a shard `--dist=loadfile` keeps a file on one
    # worker, so the fixture is built once. The heaviest single file is the
    # floor of a shard's wall time.
    #
    # `.test_durations` is measured nightly on ubuntu-latest in this layout
    # (nightly.yml `test-durations-shard`, one job per shard, merged and
    # proposed as a PR by `test-durations-regen`).
    #
    # No @pytest.mark.serial pass here — local xdist verify 2026-07-22
    # confirmed 0 collisions across all 305 integration tests. If a
    # serial-marked test is ever added, either drop its marker (parallel-
    # safe) or reintroduce a `integration_serial` job at that point.
    #
    # Timeout headroom kept at 60 min so a legitimate slow-down doesn't
    # cancel a passing run.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"  # pinned: an unpinned "latest" lookup can fail the job; bump on purpose
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install (with dev extras)
        run: uv pip install --system -e ".[dev]"
      - name: Run integration tests (shard ${{ matrix.shard }}/4, xdist -n 4)
        run: >
          pytest $(python scripts/ci_split_by_file.py --splits 4 --group ${{ matrix.shard }}
          tests/integration) -q --tb=short
          -n 4 --dist=loadfile

  static-checks:
    # Issue #3771: ruff, format, mypy, vulture and the package build used to be
    # three jobs that each spent most of their run on checkout + install. One
    # job, one install; each check is its own step, and every step after the
    # install runs even when an earlier check failed (`!cancelled()`), so one
    # run reports every failing check by name.
    #
    # ruff is exact-pinned (Issue #449): CI and local envs resolve to the same
    # ruff version so lint failures reproduce byte-identically. Must equal
    # pyproject.toml's dev-extras ruff pin (a guard test checks it).
    #
    # vulture (policy §6, docs/design-guides/documentation-and-code-quality-policy.md)
    # runs at min-confidence 60 % against `.vulture-whitelist.py`; any new
    # finding not covered by the whitelist fails the step. At 80 % the tree
    # yields only 1 finding, so 60 % is the useful signal band, and the
    # categorised whitelist holds the legitimate false positives.
    name: Static checks (ruff, format, mypy, vulture, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"  # pinned: an unpinned "latest" lookup can fail the job; bump on purpose
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install (with dev extras) and pinned tools
        run: |
          uv pip install --system -e ".[dev]"
          uv pip install --system "ruff==0.17.5" "vulture==2.16" build twine
      - name: ruff check
        if: ${{ !cancelled() }}
        run: ruff check clinosim/ tests/
      - name: ruff format --check
        if: ${{ !cancelled() }}
        run: ruff format --check clinosim/ tests/
      - name: mypy
        if: ${{ !cancelled() }}
        run: mypy clinosim/
      - name: vulture (with whitelist)
        if: ${{ !cancelled() }}
        run: vulture clinosim/ .vulture-whitelist.py --min-confidence 60
      - name: Build sdist + wheel
        if: ${{ !cancelled() }}
        run: python -m build
      - name: Verify PyPI-compatible metadata
        if: ${{ !cancelled() }}
        run: twine check dist/*
      - name: Upload build artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          retention-days: 7

  fast-tests:
    # Issue #3771: the narrative goldens and the fast e2e files, one install,
    # each its own step (the second runs even when the first failed).
    #
    # Narrative goldens (tests/fixtures/patient_profiles/*.golden.json) for the
    # template and mock-LLM generators run on every PR so a narrative change
    # must regenerate the goldens in the same PR (AD-66, Issue #2442 — the
    # opt-in suite had drifted for two months).
    #
    # Issue #3070: the e2e tier was run by no workflow, so two JP identity
    # tests failed on master unnoticed. The fast files run on every PR; the
    # slow ones nightly (nightly.yml `e2e-slow`).
    name: Fast tests (narrative regression, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"  # pinned: an unpinned "latest" lookup can fail the job; bump on purpose
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install (with dev extras)
        run: uv pip install --system -e ".[dev]"
      - name: Run the narrative regression suite
        if: ${{ !cancelled() }}
        run: pytest tests/regression -m regression -q --tb=short
      - name: Run the fast e2e tests
        if: ${{ !cancelled() }}
        run: pytest tests/e2e/test_alpha_golden.py tests/e2e/test_identity_jp.py -q --tb=short

  ci-result:
    # Issue #3765: one aggregate check whose name never changes, so the master
    # ruleset can require `CI result` instead of every shard name and the shard
    # layout can change without editing the ruleset. It runs after every other
    # job of this workflow (always(), so a failure or cancellation upstream is
    # reported here as a failure rather than as a skipped check).
    name: CI result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unit, integration, static-checks, fast-tests]
    if: always()
    steps:
      - name: Fail unless every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "a needed job ended with: $r"; exit 1; fi
          done
