# clinosim CI — hard-gate on tests, informational on quality.
#
# Hard gates (must be green to merge):
#   - unit tests on Python 3.12 (PR gate; 3.11 covered by weekly cron)
#   - integration tests on Python 3.12 (3 pytest-split shards × xdist -n 2)
#
# Informational (visible but does not block merge — pre-existing lint / mypy
# debt is tracked as follow-up cleanup, this keeps the debt VISIBLE without
# freezing the repo):
#   - quality: ruff check + ruff format --check + mypy strict (combined)
#
# Rate-of-change gates (moved off the PR path per session 82 CI review):
#   - reproducibility (`scripts/reproduce.sh`)  → runs nightly, see `nightly.yml`.
#     Determinism regressions are rare, the check costs ~5-6 min, and nightly
#     detection is soon enough to unwind the offending PR before it ships.
#   - Python 3.11 unit tests → run weekly (nightly.yml) and immediately before
#     any release tag. Pre-release smoke covers the 3.11 compatibility floor
#     without paying 2× cost on every PR.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel in-flight runs for the same branch when a newer push arrives —
# no point keeping a 20-minute integration job running on obsolete code.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Py 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (with dev extras)
        run: pip install -e ".[dev]"
      - name: Run unit tests with coverage
        # Coverage report (XML + terminal summary) generated per run so the
        # % moves in-sync with the code. `--cov-fail-under` acts as a soft
        # floor: if coverage drops below 80%, the job still passes (soft
        # gate so PRs don't get blocked on a 1-line drop) but the summary
        # makes the regression visible in the CI log.
        run: >
          pytest tests/unit -q --tb=short
          --cov=clinosim
          --cov-report=xml
          --cov-report=term-missing:skip-covered
          --cov-fail-under=80 || [ $? -eq 2 ]
      - name: Upload coverage XML
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30
      # Codecov upload — enable by adding CODECOV_TOKEN as a repo secret,
      # then uncomment the step below. Without it, coverage.xml is still
      # available as a workflow artifact.
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     files: coverage.xml
      #     fail_ci_if_error: false

  integration:
    name: Integration tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    needs: unit
    # Historical:
    #   * Single-worker serial:  ~42-50 min on GitHub-hosted ubuntu-latest
    #   * PR #373 (session 65):  xdist -n 2 (2 vCPUs)                  ≈ 25 min
    #   * PR E   (session 65):   xdist -n 2  ×  pytest-split N=3       ≈ 8-10 min
    #
    # The `pytest-split` matrix splits tests[integration] into 3 groups
    # using `.test_durations` (committed at repo root) so each shard runs
    # ~1/3 of the wall-clock work. Within each shard, `pytest-xdist -n 2
    # --dist=worksteal` fills both vCPUs. Combined parallelism = 3 × 2 = 6
    # concurrent workers — theoretical ~8-10 min wall clock, verified per
    # PR by the slowest shard.
    #
    # `.test_durations` seeded from a single-shot local run and refreshed
    # by rerunning `pytest tests/integration --store-durations -n 2
    # --dist=worksteal` when the test suite composition drifts noticeably
    # (add/remove ~20% or more integration tests).
    #
    # No @pytest.mark.serial pass here — local xdist verify 2026-07-22
    # confirmed 0 collisions across all 305 integration tests. If a
    # serial-marked test is ever added, either drop its marker (parallel-
    # safe) or reintroduce a `integration_serial` job at that point.
    #
    # Timeout headroom kept at 60 min so a legitimate slow-down doesn't
    # cancel a passing run.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (with dev extras)
        run: pip install -e ".[dev]"
      - name: Run integration tests (shard ${{ matrix.shard }}/3, xdist -n 2)
        run: >
          pytest tests/integration -q --tb=short
          -n 2 --dist=worksteal
          --splits 3 --group ${{ matrix.shard }}

  ruff-dead-code:
    name: ruff dead-code (F401 / F841)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Merge-blocking dead-code guard (policy §6 — see
    # docs/design-guides/documentation-and-code-quality-policy.md).
    # Scoped narrowly to F401 (unused import) and F841 (unused local
    # variable) so this check can be `required` in the branch-protection
    # rule without inheriting the mypy + format-check debt that keeps the
    # broader `Quality (informational)` job informational-only.
    #
    # No `pip install -e ".[dev]"` step: ruff analyses source files
    # directly and does not need the project's runtime dependencies, so
    # this job finishes in well under a minute versus ~5 min for a full
    # install.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned ruff
        # Match the version pinned in the informational Quality job so
        # findings reproduce byte-identically across the two jobs.
        run: pip install "ruff==0.16.0"
      - name: ruff check --select F401,F841 clinosim/ tests/
        run: ruff check --select F401,F841 clinosim/ tests/

  vulture-dead-code:
    name: vulture dead-code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Merge-blocking semantic dead-code guard (policy §6 — see
    # docs/design-guides/documentation-and-code-quality-policy.md).
    # Runs `vulture` at min-confidence 60 % against the project's
    # `.vulture-whitelist.py`. Any new finding not covered by the
    # whitelist fails the job. When adding a new whitelist entry,
    # categorise it per the header comment inside `.vulture-whitelist.py`.
    #
    # Threshold is 60 % (not vulture's default 60 % nor a stricter 80 %):
    # at 80 % the tree yields only 1 finding, so 60 % is the useful
    # signal band for this codebase, and the categorised whitelist
    # captures the (large) legitimate false-positive population.
    #
    # No `pip install -e ".[dev]"` step: vulture analyses source files
    # directly and does not need the project's runtime dependencies.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned vulture
        run: pip install "vulture==2.16"
      - name: vulture (with whitelist)
        run: vulture clinosim/ .vulture-whitelist.py --min-confidence 60

  quality:
    name: Quality (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    # Combines the former `lint` and `typecheck` jobs into a single runner
    # since neither blocks merge. Removes one runner boot + install cycle
    # from every PR.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (with dev extras)
        run: pip install -e ".[dev]"
      - name: Install pinned ruff
        # Exact-pinned (session 73 Issue #449): CI and local envs must resolve
        # to the same ruff version so lint failures reproduce byte-identically
        # across machines. Bumping this line = intentional lint-config change.
        run: pip install "ruff==0.16.0"
      - name: ruff check
        run: ruff check clinosim/ tests/
      - name: ruff format --check
        run: ruff format --check clinosim/ tests/
      - name: mypy
        run: mypy clinosim/

  packaging:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: pip install build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: Verify PyPI-compatible metadata
        run: twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          retention-days: 7
