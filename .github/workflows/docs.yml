# Documentation site — https://tomookuyama.github.io/clinosim/
#
# Two jobs:
#   - build  (fires on PRs to master) — validates docs compile with
#            `mkdocs build --strict`: a broken link, missing page or bad
#            anchor fails the PR
#   - deploy (fires on master push)   — publishes to the gh-pages branch
#            via `mkdocs gh-deploy`, which GitHub Pages then serves.
#
# Enable Pages from Settings → Pages → "Deploy from a branch: gh-pages /
# (root)". Only needed once on the repo. This workflow does not toggle
# it via API.
name: docs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: mkdocs build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install docs extras
        # `mkdocs-include-markdown-plugin` needs to see the whole repo so
        # its transclusions (README.md, CHANGELOG.md, ...) resolve.
        run: uv pip install --system -e ".[docs]"
      - name: Build
        # Links from pages and transcluded root files (README.md,
        # MODULES.md, ...) to repository files that are not site pages are
        # rewritten to their GitHub URL by the hook in mkdocs.yml
        # (scripts/mkdocs_repo_links.py), so any remaining warning is a
        # real broken link and fails the build.
        run: mkdocs build --strict

  deploy:
    name: Deploy to gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    # Only master push deploys — PRs just build to catch errors.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write     # gh-deploy pushes the built site to gh-pages
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gh-deploy needs full history to update gh-pages
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install docs extras
        run: uv pip install --system -e ".[docs]"
      - name: Configure git identity for gh-deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy
        run: mkdocs gh-deploy --force --clean
