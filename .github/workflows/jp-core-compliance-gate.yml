# JP Core narrow-gate compliance CI gate (Issue #1418 Phase 1).
#
# Enforces the invariant that every JP Patient / Encounter /
# MedicationRequest emitted by clinosim satisfies the narrow subset
# of JP Core Patient / Encounter / MedicationRequest must-support
# elements gated at threshold=1.0 in
# `clinosim.eval.axes.jp_core_compliance`.
#
# Runs alongside — not overlapping with — the existing JP-CLINS lab
# compliance gate (`jp-clins-lab-compliance-gate.yml`). Both must
# pass for a JP PR to merge, per Issue #1418: JP output → JP Core
# + JP-CLINS準拠必須.
#
# The gate has no external pkg dependency — the checks work from
# the FHIR NDJSON alone by comparing profile URLs, extension URLs,
# and structural fields against constants defined in the axis. The
# full HL7 FHIR Validator bundle (JP Core + JP-CLINS) lives in
# `jp-validate.yml` (workflow_dispatch + `jp-validate` label).

name: JP Core narrow compliance gate

on:
  push:
    branches: [master]
    # No paths filter on push: master should always carry the last-known
    # green baseline so incoming PRs can compare against it.
  pull_request:
    branches: [master]
    # Paths filter (session 82 CI review pattern): the gate is only
    # meaningful when code, YAML, or tests that shape JP FHIR output
    # change. Docs-only / workflow / infra PRs don't affect the emitted
    # data and don't need a full JP cohort run.
    paths:
      - "clinosim/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/jp-core-compliance-gate.yml"

concurrency:
  group: jp-core-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: JP p=300 seed=300 → eval only jp_core_compliance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install clinosim
        run: |
          uv pip install --system -e .

      - name: Generate JP cohort (p=300 seed=300)
        run: |
          set -euo pipefail
          mkdir -p cohort
          # --allow-legacy: JP cohort emits non-JP-CLINS-compliant lab
          # data without a JP-CLINS pkg install, which is out of scope
          # for this JP Core gate — the JP-CLINS eCS lab surface has
          # its own dedicated gate (`jp-clins-lab-compliance-gate.yml`).
          clinosim simulate \
            --country JP \
            -p 300 \
            -s 300 \
            --format fhir-r4 \
            --allow-legacy \
            -o cohort

      - name: Run gate (clinosim eval --strict --only-axes jp_core_compliance)
        run: |
          set -euo pipefail
          # --strict promotes any FAIL check in the selected axis to exit
          # code 1. --only-axes restricts scoring to the one axis whose
          # checks all carry threshold=1.0. A drop below 100 % on any
          # single check breaks the build.
          clinosim eval \
            -d cohort \
            --country JP \
            --strict \
            --only-axes jp_core_compliance
