# clinosim nightly cron — rate-of-change gates that were too expensive
# to run on every PR.
#
# Runs jobs that PR-level CI intentionally does not carry:
#   - reproducibility: `scripts/reproduce.sh` runs `clinosim generate`
#     twice per locale and byte-diffs the output. Deterministic-output
#     regressions are rare (SemVer promise) and the check costs ~5-6 min
#     on top of an install; running it nightly instead of per-PR halves
#     the average PR runtime without meaningfully delaying regression
#     detection (worst case: a broken determinism PR is caught the next
#     morning rather than at merge time).
#   - unit tests on Python 3.11: the compatibility floor. Weekly cadence
#     covers it without paying 2× runner cost on every PR — a 3.11-only
#     break gets one workday of latency, which the maintainer can absorb.
#   - clinical-integrity audit (session 82 Tier C): `clinosim audit run`
#     on a small US + JP cohort. Surfaces silent_no_op / structural /
#     clinical / jp_language axis regressions that unit tests can't see
#     because they only fire on real cohort data. Failures here are
#     data-quality signals that should be triaged like reproducibility
#     failures — bisect the last night's merges.
#   - cohort byte-diff vs prior master (session 82 Tier C): generates a
#     small deterministic cohort at the current master HEAD, diffs it
#     against a cached baseline (previous nightly's cohort), and
#     surfaces any silent output drift. Complements the reproducibility
#     job (which proves same code → same output) by also proving
#     "unchanged code = unchanged output across master advances".
#
# Any failure here should be triaged the next morning: `git bisect` the
# last night's merges to find the offender.
#
# `workflow_dispatch` lets a maintainer trigger this manually before a
# release cut without waiting for the schedule.
name: Nightly

on:
  schedule:
    # 09:00 UTC = 18:00 JST — after the maintainer's workday, before the
    # next one. Adjust if the cadence lands on GH runner peak load.
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  reproducibility:
    name: Reproducibility (Py 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install (runtime deps only; dev extras not needed for the script)
        run: uv pip install --system -e "."
      - name: Run scripts/reproduce.sh
        run: bash scripts/reproduce.sh

  unit-py311:
    name: Unit tests (Py 3.11 — compat floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install (with dev extras)
        run: uv pip install --system -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/unit -q --tb=short

  audit:
    name: Clinical-integrity audit (US + JP p=100 seed=42)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Session 82 Tier C: the audit framework (`clinosim audit run`) checks
    # silent_no_op / structural / clinical / jp_language axes on real
    # cohort data. Runs both US and JP so JP-CLINS / JP Core axes fire.
    # p=100 is small enough for a ~5 min job total but large enough that
    # per-module gates (HAI empirical, antibiotic narrow rate, JP-CLINS
    # slice presence) have non-degenerate cohort sizes.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Generate US cohort (p=100 seed=42)
        run: |
          mkdir -p audit-cohort/us
          clinosim simulate --country US -p 100 -s 42 \
            --format fhir-r4 -o audit-cohort/us
      - name: Generate JP cohort (p=100 seed=42, --allow-legacy for CI)
        env:
          CLINOSIM_ALLOW_LEGACY_JP_CLINS_PKG: "1"
        run: |
          mkdir -p audit-cohort/jp
          clinosim simulate --country JP -p 100 -s 42 \
            --format fhir-r4 --allow-legacy -o audit-cohort/jp
      - name: Run audit on US cohort
        # `--strict` promotes any FAIL check to exit code 1. Nightly
        # cadence means a real regression gets one workday of visibility
        # before other work builds on top of it.
        run: clinosim audit run -d audit-cohort/us
      - name: Run audit on JP cohort
        run: clinosim audit run -d audit-cohort/jp
      - name: Upload audit reports (retained 30 days)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-reports
          path: audit-cohort/**/*.md
          retention-days: 30

  test-durations-regen:
    name: Regenerate .test_durations on ubuntu (Py 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    # S115: `.test_durations` recorded on a maintainer's Mac (M-series) does
    # not reflect ubuntu-latest CI runner cost for sim-heavy integration
    # tests (~2-3x slower on ubuntu). That mismatch caused post-#1428
    # integration-shard imbalance (shard 5 = 6m29s, shard 8 = 2m22s) even
    # though single-thread bin-pack was 1.01x on paper — the recorded
    # numbers under-estimated the ubuntu cost for shard 5's slow tests.
    # Regenerating on the same runner infra as the PR CI closes the gap.
    #
    # If the regenerated file differs from master's committed copy, this
    # job opens a PR ("chore: refresh .test_durations from nightly CI").
    # The PR is a routine data refresh — approve + merge without ceremony
    # unless the diff is drastic (which would signal test-suite churn
    # worth investigating).
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install (with dev extras)
        run: uv pip install --system -e ".[dev]"
      - name: Regenerate unit test durations
        run: |
          pytest tests/unit --store-durations -n 2 --dist=worksteal \
            -q --tb=no --no-cov
      - name: Regenerate integration test durations
        run: |
          pytest tests/integration --store-durations -n 2 --dist=worksteal \
            -q --tb=no --no-cov
      - name: Open PR if .test_durations changed
        id: create_pr
        # Issue #1500 governance: this step can fail with the message
        # "GitHub Actions is not permitted to create or approve pull
        # requests" when the repo setting
        # `Settings → Actions → General → Workflow permissions →
        # "Allow GitHub Actions to create and approve pull requests"`
        # is OFF. That toggle is a one-time maintainer action but only
        # the repo owner can flip it. Until then, we fall back to
        # (a) surfacing the diff as a downloadable artifact and (b)
        # emitting a WARN notice pointing at the setting — so the
        # nightly job stops going red on this expected permission gap.
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          # GITHUB_TOKEN suffices for same-repo PRs; no PAT needed.
          commit-message: |
            chore(ci): refresh .test_durations from nightly ubuntu CI

            Auto-generated by the `test-durations-regen` job in
            `.github/workflows/nightly.yml`. Uses ubuntu-latest runner
            timings so pytest-split bin-pack matches PR CI reality.
          branch: nightly/refresh-test-durations
          title: "chore(ci): refresh .test_durations from nightly ubuntu CI"
          body: |
            Auto-generated by nightly `test-durations-regen` job.

            **Purpose**: keep `pytest-split`'s bin-pack aligned with
            ubuntu-latest runner cost, not maintainer-machine cost.
            Mismatch caused the post-#1428 integration-shard imbalance
            (6m29s vs 2m22s despite 1.01x paper bin-pack) because
            sim-heavy tests run ~2-3x slower on ubuntu than on
            maintainer M-series Macs.

            Review focus: line-count delta on `.test_durations`
            should be roughly symmetric (few thousand adds/dels for
            numeric refresh). A drastic diff (e.g. new tests without
            entries, or vanished tests) signals test-suite churn to
            triage separately.
          delete-branch: true
          # Automatically add the label so `.test_durations` refresh
          # PRs are easy to filter in the PR list.
          labels: |
            ci
            test-durations
      - name: Fallback — upload .test_durations diff as artifact
        # Runs when the create-PR step failed (Issue #1500 permission gap)
        # OR when the file changed but the PR create was skipped. Gives
        # the maintainer a way to apply the refresh manually without
        # needing to re-run the whole regen locally.
        if: steps.create_pr.outcome == 'failure' || steps.create_pr.outcome == 'skipped'
        run: |
          if git diff --quiet -- .test_durations; then
            echo "::notice::.test_durations unchanged — no refresh needed."
            exit 0
          fi
          echo "::warning::Auto-PR creation failed (see Issue #1500 — repo owner needs to enable Settings → Actions → General → Workflow permissions → 'Allow GitHub Actions to create and approve pull requests'). The refreshed .test_durations is uploaded as an artifact below; maintainer can download and commit manually."
          git diff --stat -- .test_durations
      - name: Upload refreshed .test_durations
        if: steps.create_pr.outcome == 'failure' || steps.create_pr.outcome == 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: test-durations-refresh
          path: .test_durations
          retention-days: 14
  cohort-byte-diff-vs-master:
    name: Cohort byte-diff vs master (US p=100 seed=42)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Session 82 Tier C: complements the reproducibility gate.
    # Reproducibility: same code → same output (SemVer determinism).
    # This job: generates today's cohort at HEAD, restores yesterday's
    # cohort from cache, byte-diffs the NDJSON. Any drift is either
    # (a) an intentional cohort-visible change (release-notable), or
    # (b) a silent regression (fix or revert). Both need eyes on them.
    #
    # First run has no cached baseline → job PASSES trivially and
    # populates the cache for tomorrow. From day 2 onward it enforces.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: uv pip install --system -e "."
      - name: Restore prior cohort cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          # Restore any cache from the same nightly job; the exact key
          # never matches (differs by run number), forcing GitHub to
          # fall back to the `restore-keys` prefix which grabs the most
          # recent entry.
          key: cohort-baseline-${{ github.run_number }}
          restore-keys: cohort-baseline-
          path: cohort-baseline/
      - name: Generate today's cohort
        run: |
          mkdir -p cohort-today
          clinosim simulate --country US -p 100 -s 42 \
            --format fhir-r4 -o cohort-today
      - name: Byte-diff vs cached baseline
        # Cache miss on first run → skip diff, just populate.
        # Cache hit → cmp -s every ndjson and SURFACE drift as a warning
        # (does NOT fail the job).
        #
        # Rationale (Issue #1499 governance): during active refactoring
        # (i18n unification / FHIR emit adjustments) the canary trips
        # every night as a legitimate signal — the merged PRs each
        # produce cohort-visible drift, individually not release-notable
        # but collectively real. Prior severity `::error` + exit 1 caused
        # 30+ consecutive nightly-red days, which trained the maintainer
        # to ignore the alert. Downgrading to `::warning` keeps the
        # signal visible on the run summary page while restoring the
        # nightly job's ability to signal actual regressions (audit,
        # reproducibility, unit-py311 failures now stand out).
        #
        # Follow-up (Issue #1499): a per-PR opt-in acknowledgement
        # (label / CHANGELOG parse) can restore fail-on-unacknowledged
        # semantics without regressing to the previous chronic-red state.
        run: |
          set -euo pipefail
          if [ ! -d cohort-baseline/fhir_r4 ]; then
            echo "::notice::First nightly run — no baseline yet. Today's cohort becomes the baseline."
            exit 0
          fi
          diff_count=0
          for f in cohort-today/fhir_r4/*.ndjson; do
            base=$(basename "$f")
            baseline="cohort-baseline/fhir_r4/$base"
            if [ ! -f "$baseline" ]; then
              echo "::warning::new file today: $base"
              diff_count=$((diff_count + 1))
              continue
            fi
            if ! cmp -s "$f" "$baseline"; then
              lines_today=$(wc -l < "$f")
              lines_base=$(wc -l < "$baseline")
              echo "::warning::DIFF: $base (today=$lines_today, baseline=$lines_base)"
              diff_count=$((diff_count + 1))
            fi
          done
          if [ "$diff_count" -gt 0 ]; then
            echo "::warning::$diff_count NDJSON file(s) drifted since yesterday. Either the merge queue contains intentional cohort-visible changes (add to CHANGELOG under a MINOR bump) or a silent regression (fix / revert). Surfaced as a warning per Issue #1499 governance; use the run summary + drift list above to triage."
            exit 0
          fi
          echo "cohort byte-identical vs yesterday's baseline"
      - name: Rotate cache — today becomes tomorrow's baseline
        # Always rotate, even on diff-detected failure, so a legitimate
        # cohort-visible change auto-baseline updates the next night.
        if: always()
        run: |
          rm -rf cohort-baseline
          cp -r cohort-today cohort-baseline
      - name: Save updated baseline cache
        if: always()
        uses: actions/cache/save@v6
        with:
          key: cohort-baseline-${{ github.run_number }}
          path: cohort-baseline/
