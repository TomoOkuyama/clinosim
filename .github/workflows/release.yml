# Release workflow — tag-triggered.
#
# Cutting a release:
#   1. Bump `clinosim/__init__.py::__version__` (e.g. 0.2.0 → 0.3.0).
#   2. Move `[Unreleased]` content in CHANGELOG.md under a new
#      `## [X.Y.Z] - YYYY-MM-DD` heading.
#   3. Commit + push to master.
#   4. `git tag -a vX.Y.Z -m "clinosim vX.Y.Z"` and
#      `git push origin vX.Y.Z`.
#   5. This workflow fires on the tag push, builds sdist + wheel,
#      validates them with `twine check`, and publishes a GitHub
#      Release with the artifacts attached and the CHANGELOG entry
#      as release notes.
#
# PyPI publish uses Trusted Publishing / OIDC — no long-lived token
# in this repo. The trusted publisher is registered at
# https://pypi.org/manage/project/clinosim/settings/publishing/ against
# (owner: TomoOkuyama, repo: clinosim, workflow: release.yml,
# environment: release). See the `Publish to PyPI` step below.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Prevent two overlapping releases if a tag is force-pushed. In practice
# tag force-pushes should be avoided; this is defensive.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Cut GitHub Release
    runs-on: ubuntu-latest
    # PyPI Trusted Publishing binds the `release` environment name into
    # the OIDC token audience — the environment configured at
    # https://pypi.org/manage/project/clinosim/settings/publishing/
    # expects `release`, so this job must run in the matching
    # environment or PyPI will reject the token exchange.
    environment: release
    permissions:
      # Needed for `gh release create` and artifact uploads on the tag.
      contents: write
      # Needed for PyPI Trusted Publishing (OIDC token exchange).
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history helps release-notes tooling walk CHANGELOG history
          # and is cheap for a tag build.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install build tooling + clinosim
        # `clinosim dataset build` needs the CLI on PATH, and the tag-verify
        # step below needs `import clinosim`. Install once here (editable is
        # fine — this env is torn down at job end).
        run: |
          uv pip install --system build twine
          uv pip install --system -e .

      - name: Verify tag matches package version
        # Tag `vX.Y.Z` must match `clinosim.__version__` — otherwise the
        # PyPI artifact and the GitHub Release describe different things.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "import clinosim; print(clinosim.__version__)")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (parsed as ${TAG_VERSION}) does not match clinosim.__version__=${PKG_VERSION}. Refusing to release."
            exit 1
          fi
          echo "Tag/package versions agree: ${PKG_VERSION}"

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify PyPI-compatible metadata
        run: twine check dist/*

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Awk extracts the block between `## [VERSION]` and the next `## `
          # heading. `index()` is used instead of regex `~` because
          # `[X.Y.Z]` would otherwise be interpreted as a character class.
          # Preserves blank lines and Markdown formatting.
          awk -v v="[$VERSION]" '
            index($0, "## " v) == 1 { flag=1; next }
            flag && index($0, "## ") == 1 { exit }
            flag { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::warning::No CHANGELOG entry found for version ${VERSION}; using tag message as fallback."
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release_notes.md
          fi
          echo "--- release_notes.md preview ---"
          head -30 release_notes.md

      - name: Build dataset presets (P1-6)
        # Deterministic — same clinosim version + same seed = byte-identical
        # output — so every user who downloads these tarballs can rebuild
        # them locally with `clinosim dataset build <name>` and get the
        # same bytes. Total build time on ubuntu-latest ~5-8 min
        # (us-100 + jp-100 ≤ 30 s each, us-1000 + jp-1000 ~2-3 min each).
        env:
          # Issue #418 fail-loud gate: JP presets fail without a JP-CLINS
          # package present, but installing the pkg in this CI runner is
          # heavy (Java + fhir-toolkit) and the release job is
          # deliberately a pkg-less environment (same posture as
          # nightly.yml + scripts/reproduce.sh). Opt into the documented
          # env-var override so JP presets fall back to the legacy
          # 5-digit JLAC10 OIDs used by v0.6.3 and earlier release assets
          # — CI-test-harness / release-artifact use case, exactly what
          # the env var was added for.
          CLINOSIM_ALLOW_LEGACY_JP_CLINS_PKG: "1"
        run: |
          mkdir -p dataset-dist
          for name in us-100 us-1000 jp-100 jp-1000; do
            echo "== Building preset ${name} =="
            clinosim dataset build "${name}" --output "dataset-dist/${name}"
            (cd dataset-dist && \
              tar -czf "clinosim-dataset-${name}-${GITHUB_REF_NAME}.tar.gz" "${name}")
            rm -rf "dataset-dist/${name}"
          done
          ls -la dataset-dist/

      - name: Create GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "clinosim ${GITHUB_REF_NAME}" \
            --notes-file release_notes.md \
            dist/clinosim-*.tar.gz \
            dist/clinosim-*.whl \
            dataset-dist/clinosim-dataset-*.tar.gz

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        # Uploads dist/*.whl + dist/*.tar.gz to PyPI using OIDC token
        # exchange against the trusted publisher registered at
        # https://pypi.org/manage/project/clinosim/settings/publishing/
        # (owner: TomoOkuyama, repo: clinosim, workflow: release.yml,
        # environment: release). No long-lived API token is stored in
        # this repo; the job's OIDC token is exchanged for a
        # short-lived upload credential at publish time.
        #
        # `packages-dir: dist/` — only the sdist + wheel land in dist/;
        # the dataset preset tarballs live under dataset-dist/ and are
        # attached to the GitHub Release only, not published to PyPI.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Upload build artifacts to the workflow run
        # Even without a PyPI push, keep the artifacts attached to the run
        # for 90 days so they can be inspected / re-downloaded from the
        # Actions UI if the Release page misses something.
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.ref_name }}
          path: dist/*
          retention-days: 90
