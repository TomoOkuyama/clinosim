# IETF BCP 47 language tags used for FHIR Patient.communication.language.
# Authoritative source: IETF BCP 47 (https://www.rfc-editor.org/info/bcp47).
metadata:
  kind: code-system
  name: IETF BCP 47 Language Tag
  uri: "urn:ietf:bcp:47"
  source: "IETF BCP 47"
codes:
  # `en` is the IETF BCP-47 canonical display (space before the paren),
  # required by HL7's base validator + US Core v9 against the
  # `urn:ietf:bcp:47` binding. `ja` localizations are informational only —
  # the CodeSystem is English-only per both validators' loadouts.
  en-US: {en: "English (United States)", ja: "英語(米国)"}
  ja-JP: {en: "Japanese (Japan)", ja: "日本語(日本)"}

# Display variants a profile family's validator registers instead of the
# canonical display (Issue #1764): fhir-jp-validator registers the form with
# no space before the paren, verified against the v4 fullset error message
# quoting `Japanese(Japan)` for `ja-JP`. Read through
# `clinosim.codes.bcp47.bcp47_display` (Issue #2481) — not a language key.
profile_displays:
  jp-core:
    en-US: "English(US)"
    ja-JP: "Japanese(Japan)"
