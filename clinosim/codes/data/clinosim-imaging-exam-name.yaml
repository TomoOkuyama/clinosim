# clinosim Imaging Exam Name Catalog — EN ↔ JA display mapping for the
# free-text imaging exam names that CIF ImagingStudyRecord.description
# carries from disease YAMLs (e.g. `traffic_accident_severe.yaml:
# - {test: "FAST_Ultrasound"}`).
#
# Issue #862 (via META #1849 Phase 5 Step 2.e): these entries used to live
# in `clinosim/locale/shared/drug_names_ja.yaml` under the "Imaging exam
# names" comment block. They are not drugs; the mapping was tactically
# placed in that file because `_localize_drug_name` is the generic string-
# translation helper the FHIR imaging emit path (`labs/imaging_study.py`)
# falls back to when the body_sites catalog miss hits.
#
# This catalog is the semantic home for these entries. Loader unions it
# into the same `_load_narrative_display_dict()` return value so no caller changes
# are required.
#
# Scope: the free-text exam names appearing in CIF
# ImagingStudyRecord.description across disease YAMLs. 34 entries covering
# 1,060 records (22.4% of ImagingStudy) in a reference JP p=10000 s500
# cohort (session 110 verify). Keys use the exact form the CIF ships (with
# or without spaces); the emit-time normalizer at `labs/imaging_study.py`
# strips "_" → " " before lookup.
#
# Non-goals:
#   - LOINC binding. These free-text exams do not have LOINC codes assigned
#     via body_sites.yaml. If a per-exam LOINC becomes available, migrate
#     the exam into body_sites.yaml's procedure_codes[] section with LOINC
#     authority emit (precedent: META #1805 Phase B.2 Part 2).
#   - Procedure phrases (Foley catheter insertion, Suture closure, ...).
#     Those migrate separately via `clinosim-procedure-phrase.yaml`
#     (Phase 5 Step 2.d).

metadata:
  name: clinosim Imaging Exam Name Display Catalog
  description: >
    EN → JA display mapping for free-text imaging exam names used in CIF
    ImagingStudyRecord.description. Not a FHIR CodeSystem — this catalog
    exists only for display localization at FHIR emit time.

