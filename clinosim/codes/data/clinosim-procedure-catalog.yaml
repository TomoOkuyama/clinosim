# Procedure catalog: codes and names per procedure type (Issue #2263).
#
# `bedside` lists the bedside / routine inpatient procedures in dispatch order
# (moved verbatim from `_BEDSIDE_PROCEDURES` in modules/procedure/engine.py,
# which builds the same tuples from here). Surgical procedures the engine
# chooses directly (hip fracture) are coded per country in
# locale/{us,jp}/code_mapping_procedure.yaml.
#
# Code provenance: CPT from AMA CPT 2024; K-codes from the MHLW 診療報酬点数表
# (令和6年度); the JP codes were checked against the 支払基金 診療行為マスター
# on 2026-11-01 (Issue #2340). A blank code means "uncoded by design":
# oxygen administration has no CPT code of its own (it is bundled into the
# visit), and peripheral IV placement has no separate fee in the 点数表.
# `named` (end of file) names further procedure types that are not bedside
# procedures. Read through clinosim.codes.procedures.
#
# `emergent: true` (Issue #3550) marks a procedure that is a life-saving
# emergency by nature (an endotracheal intubation); its procedure note words the
# consent as emergency / implied consent. Read through
# clinosim.codes.procedures.procedure_is_emergent.
#
# `aftercare` (Issue #3257) is the category of care after the procedure; it
# selects the post-procedure plan the operative / procedure note writes (text
# per category: `procedure_aftercare.<category>` in
# locale/shared/narrative_phrases.yaml, read through
# clinosim.codes.procedures.procedure_aftercare). A type without it gets the
# `general` plan. Every procedure type that has a procedure note
# (modules/document/reference_data/bedside_procedure_codes.yaml) carries one.

metadata:
  kind: catalog
  name: clinosim-procedure-catalog
  source: clinosim

# Tissue a resection removes and sends to histopathology, per procedure type
# (Issue #3284), as `specimen_type` keys of codes/data/snomed-maps.yaml (SNOMED
# CT specimen concepts). The procedure engine copies them into the record's
# `specimens_sent`. Only the resections whose specimen is routinely submitted
# are listed: the appendix after appendectomy, the gallbladder after
# cholecystectomy and the resected colon after colectomy. Debridement, fracture
# fixation, arthroplasty and hematoma evacuation send none (a hemiarthroplasty
# femoral head is submitted by local practice only).
specimens:
  bowel_resection: [colon_segment]
  laparoscopic appendectomy: [appendix]
  laparoscopic cholecystectomy: [gallbladder]

# Device a procedure type leaves in the patient, per procedure type (Issue
# #3406), as keys of locale/shared/narrative_op_implants.yaml. The procedure
# engine copies them into the record's `implants_used`, which the operative
# note's equipment line states. A disease protocol's own `procedure.implants`
# (or the hip-fracture choice of nail / screw / prosthesis) takes precedence.
# Only procedures that by definition leave a device are listed; the size or
# model of a device is not modelled and so is not stated.
implants:
  coronary_pci: [drug-eluting stent]
  pacemaker_implant: [pacemaker generator, pacing leads]
  Total knee arthroplasty: [total knee prosthesis]
  ORIF with volar locking plate: [volar locking plate]

bedside:
  - {type: urinary_catheter, cpt: "51702", k_code: "J063", name: {en: "Urinary catheter insertion", ja: "尿道カテーテル挿入"}, anesthesia: none, aftercare: urinary_catheter}
  - {type: central_line, cpt: "36556", k_code: "G005-2", name: {en: "Central venous catheter insertion", ja: "中心静脈カテーテル挿入"}, anesthesia: local, aftercare: central_line}
  - {type: arterial_line, cpt: "36620", k_code: "D225", name: {en: "Arterial line insertion", ja: "動脈ライン挿入"}, anesthesia: local, aftercare: arterial_line}
  - {type: lumbar_puncture, cpt: "62270", k_code: "D403", name: {en: "Lumbar puncture", ja: "腰椎穿刺"}, anesthesia: local, aftercare: lumbar_puncture}
  - {type: thoracentesis, cpt: "32555", k_code: "J008", name: {en: "Thoracentesis", ja: "胸腔穿刺"}, anesthesia: local, aftercare: thoracentesis}
  - {type: paracentesis, cpt: "49083", k_code: "J010", name: {en: "Paracentesis", ja: "腹腔穿刺"}, anesthesia: local, aftercare: paracentesis}
  - {type: intubation, cpt: "31500", k_code: "J044", name: {en: "Endotracheal intubation", ja: "気管挿管"}, anesthesia: sedation, aftercare: intubation, emergent: true}
  - {type: nasogastric_tube, cpt: "43752", k_code: "J034-2", name: {en: "Nasogastric tube insertion", ja: "経鼻胃管挿入"}, anesthesia: none, aftercare: gastric_tube}
  - {type: chest_tube, cpt: "32551", k_code: "J019", name: {en: "Chest tube insertion", ja: "胸腔ドレーン挿入"}, anesthesia: local, aftercare: chest_tube}
  - {type: wound_debridement, cpt: "97597", k_code: "K002", name: {en: "Wound debridement", ja: "創傷デブリードマン"}, anesthesia: local}
  - {type: cardioversion, cpt: "92960", k_code: "J047", name: {en: "Electrical cardioversion", ja: "電気的カルジオバージョン"}, anesthesia: sedation, aftercare: cardioversion}
  - {type: blood_transfusion, cpt: "36430", k_code: "K920", name: {en: "Blood transfusion", ja: "輸血"}, anesthesia: none, aftercare: blood_transfusion}
  - {type: dialysis_acute, cpt: "90935", k_code: "J038", name: {en: "Acute hemodialysis", ja: "急性血液透析"}, anesthesia: none, aftercare: dialysis}
  - {type: bronchoscopy, cpt: "31622", k_code: "D302", name: {en: "Bronchoscopy", ja: "気管支鏡検査"}, anesthesia: sedation, aftercare: bronchoscopy}
  - {type: echocardiography, cpt: "93306", k_code: "D215", name: {en: "Transthoracic echocardiography", ja: "経胸壁心エコー"}, anesthesia: none}
  - {type: ecg_12lead, cpt: "93000", k_code: "D208", name: {en: "12-lead ECG", ja: "12誘導心電図"}, anesthesia: none}
  - {type: iv_line, cpt: "36000", k_code: "", name: {en: "IV line placement", ja: "末梢静脈路確保"}, anesthesia: local}
  - {type: wound_care, cpt: "12001", k_code: "K0004", name: {en: "Simple wound repair", ja: "創傷処理"}, anesthesia: local}
  - {type: short_arm_splint, cpt: "29125", k_code: "J122", name: {en: "Short arm splint", ja: "短腕シーネ固定"}, anesthesia: none}
  - {type: reduction_closed, cpt: "25605", k_code: "K0444", name: {en: "Closed reduction of wrist fracture", ja: "手関節骨折徒手整復"}, anesthesia: local}
  - {type: oxygen_therapy, cpt: "", k_code: "J024", name: {en: "Oxygen therapy", ja: "酸素療法"}, anesthesia: none}
  - {type: coronary_pci, cpt: "92920", k_code: "K546", name: {en: "Percutaneous coronary intervention (PCI)", ja: "経皮的冠動脈形成術"}, anesthesia: local, aftercare: vascular_access}
  - {type: pacemaker_implant, cpt: "33208", k_code: "K597", name: {en: "Permanent pacemaker implantation", ja: "ペースメーカー移植術"}, anesthesia: local, aftercare: device_pocket}
  - {type: craniotomy_hematoma_evacuation, cpt: "61313", k_code: "K1643", name: {en: "Craniotomy for intracranial hematoma evacuation", ja: "頭蓋内血腫除去術（開頭）"}, anesthesia: general, aftercare: neurosurgical}
  - {type: ileus_tube_placement, cpt: "44500", k_code: "J034", name: {en: "Long tube (ileus tube) placement for bowel obstruction", ja: "イレウス用ロングチューブ挿入法"}, anesthesia: none, aftercare: ileus_tube}
  - {type: bowel_resection, cpt: "44140", k_code: "K719", name: {en: "Colectomy (bowel resection)", ja: "結腸切除術"}, anesthesia: general, aftercare: surgical_wound}

# Procedure types the generator records outside the bedside dispatch, named
# here so Procedure.code.text reads in the output language instead of the
# humanised type key (Issue #3081). Their codes come from the record (the
# newborn screens are SNOMED CT: 413083006, 428447008), not from this file.
# JP wording follows 母子保健 practice: 新生児聴覚スクリーニング (AABR 法) and
# 新生児マススクリーニング (タンデムマス法), the national programmes' names
# (こども家庭庁 / 厚生労働省 通知). Both screens are done without anesthesia:
# AABR is recorded through skin electrodes on a sleeping newborn, and the
# metabolic screen is a heel-prick blood spot (`anesthesia: none`, Issue #3257).
#
# `cpr` (Issue #3483) is recorded by the resuscitation enricher, not the
# bedside dispatch: CPT 92950 (AMA CPT), K-code J046 非開胸的心マッサージ (the
# 点数表 item billed for a closed-chest resuscitation; checked against the
# 支払基金 診療行為マスター s_ALL20261102, 2026-11-21).
#
# `anesthesia` (bedside and named entries) is the anesthesia the procedure is
# done under; the record's estimated blood loss and ASA class stay unrecorded
# for every catalog procedure (no modelled value; the surgical path of the
# disease protocols is the only source of them).
named:
  - {type: cpr, cpt: "92950", k_code: "J046", name: {en: "Cardiopulmonary resuscitation", ja: "心肺蘇生"}, anesthesia: none}
  - {type: hearing_screen_aabr, name: {en: "Newborn hearing screening (AABR)", ja: "新生児聴覚スクリーニング（AABR）"}, anesthesia: none}
  - {type: metabolic_screen_tandem_ms, name: {en: "Newborn metabolic screening (tandem mass spectrometry)", ja: "新生児マススクリーニング（タンデムマス法）"}, anesthesia: none}
  # Surgical procedure types the procedure engine records from the disease
  # protocols' `procedure.type` (Issue #3107); JP names per 診療報酬点数表
  # wording.
  - {type: ORIF, name: {en: "Open reduction and internal fixation (ORIF)", ja: "観血的整復固定術"}, aftercare: surgical_wound}
  - {type: hemiarthroplasty, name: {en: "Hemiarthroplasty", ja: "人工骨頭置換術"}, aftercare: surgical_wound}
  - {type: laparoscopic appendectomy, name: {en: "Laparoscopic appendectomy", ja: "腹腔鏡下虫垂切除術"}, aftercare: surgical_wound}
  - {type: laparoscopic cholecystectomy, name: {en: "Laparoscopic cholecystectomy", ja: "腹腔鏡下胆嚢摘出術"}, aftercare: surgical_wound}
  - {type: complex hand surgery, name: {en: "Complex hand surgery", ja: "手の複合組織損傷手術"}, aftercare: surgical_wound}
  - {type: Total knee arthroplasty, name: {en: "Total knee arthroplasty", ja: "人工膝関節全置換術"}, aftercare: surgical_wound}
  - {type: orthopedic fracture fixation, name: {en: "Fracture fixation", ja: "骨折観血的手術"}, aftercare: surgical_wound}
  - {type: debridement and skin grafting, name: {en: "Debridement and skin grafting", ja: "デブリードマン・植皮術"}, aftercare: surgical_wound}
  - {type: Craniotomy, name: {en: "Craniotomy", ja: "開頭術"}, aftercare: neurosurgical}
  - {type: exploratory laparotomy, name: {en: "Exploratory laparotomy", ja: "試験開腹術"}, aftercare: surgical_wound}
  - {type: ORIF with volar locking plate, name: {en: "ORIF with volar locking plate", ja: "掌側ロッキングプレート固定術"}, aftercare: surgical_wound}
