# condition-lab-pairings.yaml — condition × lab clinical pairings
# consumed by the clinical eval axis's coherence check.
#
# Each pairing declares: given a patient carrying a Condition whose
# ICD-10 code matches one of `icd_prefixes`, a related lab drawn within
# the ±window of the condition onset is expected to be in
# `expected_band`. Otherwise the eval axis flags a clinical
# contradiction (sepsis without lactate lift, DKA with normal HCO3,
# etc.).
#
# Consumed by `clinosim/eval/axes/clinical.py::
# _check_condition_lab_coherence` via `_CONDITION_LAB_PAIRINGS`.
# `direction` is one of `high` / `low` / `band`:
#   * `high`: expect the value above `expected_band[0]`
#   * `low`:  expect the value below `expected_band[1]`
#   * `band`: expect the value between `expected_band[0]` and [1]
#
# Each `rationale` cites the literature source backing the band; the
# eval axis report echoes this when a pairing fails, so a reader can
# audit the clinical basis without opening the yaml.
#
# Membership policy:
#   * one row per well-sourced clinical pairing (reference literature,
#     ADA / KDIGO / Surviving Sepsis / WHO / Universal Definition of
#     MI — see docs/eval-rules.md)
#   * `icd_prefixes` match via `startswith` on
#     `Condition.code.coding[].code`; the pairing fires on any match
#   * `loinc` is a single LOINC; a condition that fires on multiple
#     labs gets one row per lab (e.g. hypothetical "DKA on BG + HCO3"
#     would be 2 rows)

metadata:
  source: >-
    clinosim/eval/axes/clinical.py (_CONDITION_LAB_PAIRINGS) prior to
    hardcoded-review Phase A13.

pairings:
  sepsis_lactate:
    icd_prefixes: [A41]
    loinc: '2524-7'    # Serum lactate (venous)
    expected_band: [2.0, 100.0]
    direction: high
    rationale: >-
      Surviving Sepsis 2021: lactate > 2 mmol/L is a defining feature of
      sepsis with tissue hypoperfusion.

  dka_hco3:
    icd_prefixes: [E10.10, E10.11, E11.10, E11.11]
    loinc: '1963-8'    # HCO3 serum
    expected_band: [0.0, 18.0]
    direction: low
    rationale: >-
      ADA severity criteria: HCO3 < 18 mEq/L on presentation defines
      mild-to-severe DKA.

  acute_mi_troponin:
    icd_prefixes: [I21, I22]
    loinc: '10839-9'   # Troponin I
    expected_band: [0.04, 100.0]
    direction: high
    rationale: >-
      Universal Definition of MI: Troponin I above 99th-percentile URL
      (0.04 ng/mL for most assays).

  ckd_stage_creatinine:
    icd_prefixes: [N18.3, N18.4, N18.5]
    loinc: '2160-0'    # Serum creatinine
    expected_band: [1.3, 20.0]
    direction: high
    rationale: >-
      KDIGO 2012: CKD stage 3+ corresponds to eGFR ≤ 60 mL/min/1.73m²,
      which typically implies Cr > 1.3 mg/dL in most adult body sizes.

  t2dm_hba1c:
    icd_prefixes: [E11.9]
    loinc: '4548-4'    # HbA1c
    expected_band: [6.5, 20.0]
    direction: high
    rationale: >-
      ADA: HbA1c ≥ 6.5% is diagnostic threshold for type-2 diabetes.

  bacterial_pneumonia_wbc:
    icd_prefixes: [J13, J14, J15]
    loinc: '6690-2'    # WBC
    expected_band: [11.0, 500.0]
    direction: high
    rationale: >-
      Infection response: WBC > 11 × 10^9/L is one of the SIRS criteria
      and typical of bacterial pneumonia.

  anemia_hgb:
    icd_prefixes: [D50, D51, D52, D53, D62, D63, D64]
    loinc: '718-7'     # Hb
    expected_band: [0.0, 12.0]
    direction: low
    rationale: >-
      WHO anemia cutoffs: Hgb < 12 g/dL (non-pregnant adult female) /
      < 13 g/dL (male). Using the more permissive cutoff to avoid false
      positives on borderline male cases.

  chf_bnp:
    icd_prefixes: [I50]
    loinc: '30934-4'   # BNP serum
    expected_band: [100.0, 5000.0]
    direction: high
    rationale: >-
      Framingham / ACC-AHA heart failure criteria: BNP > 100 pg/mL
      supports acute HF diagnosis.
