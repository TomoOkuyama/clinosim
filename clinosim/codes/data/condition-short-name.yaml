# Clinical short-name / abbreviation for diagnosis codes (FHIR
# Condition.code.text — "what clinicians type", search-friendly — and the
# name of a diagnosis in narrative prose). Distinct from the official long
# name in icd-10-cm.yaml / icd-10.yaml, which stays in coding[].display
# (e.g. text="COPD" vs display="Other chronic obstructive pulmonary
# disease"). Keyed by the 3-character ICD-10 category, shared across
# ICD-10-CM (US) and ICD-10 WHO (JP) since base categories are identical
# between the two systems (AD-30). A subcategory key (E11.3, J44.1) names a
# code more specifically than its category and also covers every longer
# code it prefixes (E11.311); it is added only where the WHO and ICD-10-CM
# subcategories mean the same thing (R65.1 / R65.2 do not, so R65 has a
# category key only). condition_short_name tries the longest key first
# (Issue #3259).
# This is clinosim's own abbreviation convention, not an external code
# system — no authoritative source beyond internal clinical-writing
# consistency (matches the project's existing _CONDITION_SHORT_NAME values
# verbatim; migrated from Python, not newly authored).
