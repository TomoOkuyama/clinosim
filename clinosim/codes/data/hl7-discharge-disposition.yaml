# HL7 FHIR discharge-disposition. Authoritative source: HL7 Terminology (THO),
# CodeSystem discharge-disposition
# (http://terminology.hl7.org/CodeSystem/discharge-disposition). Cycle-1 C1-03
# fix (session 41): clinosim currently emits "home" (routine discharge) and
# "expired" (patient died); adding more codes here should be paired with the
# emitter in simulator/inpatient.py.
metadata:
  name: HL7 FHIR Discharge Disposition
  uri: http://terminology.hl7.org/CodeSystem/discharge-disposition
  source: "HL7 Terminology (THO)"
codes:
  home:    {en: "Home", ja: "自宅退院"}
  # session 59 #299:HL7 authoritative code is "exp" (not "expired"). See
  # tx-server-build/.../CodeSystem-discharge-disposition.json 権威 concept。
  exp: {en: "Expired", ja: "死亡退院"}
  # Issue #2084: unresolved hypoxemia / consciousness / perfusion at the maximum stay.
  snf: {en: "Skilled nursing facility", ja: "介護・療養施設"}
  # Issue #2124: ED psychiatric crisis transferred to a psychiatric facility.
  psy: {en: "Psychiatric hospital", ja: "精神科病院"}
