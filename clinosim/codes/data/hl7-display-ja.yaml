---
# hl7-display-ja.yaml — Japanese display labels for HL7-adjacent
# ValueSets used in FHIR output
#
# Consolidates 11 previously-inline EN → JA dicts from
# `clinosim/modules/output/fhir_r4/lib/localization.py`. Each
# top-level section is one ValueSet (or a close synonym registry)
# with English / HL7 code keys → Japanese display. Consumed by the
# generic `_localize_display(value, country, dictionary)` lookup
# helper when `country` resolves to JP.
#
# Scope mirrors the pre-migration dicts exactly: adding a value to a
# JA display registry is now one yaml row (the row documents its
# code system — HL7 v3-ActCode / v3-ActPriority / v3-RoleCode etc. —
# via section comments where it was recorded inline).

metadata:
  source: >-
    clinosim/modules/output/fhir_r4/lib/localization.py
    (_CLASS_DISPLAY_JA, _CATEGORY_DISPLAY_JA, _SEVERITY_DISPLAY_JA,
     _INTERPRETATION_DISPLAY_JA, _RELATIONSHIP_DISPLAY_JA,
     _ORG_TYPE_DISPLAY_JA, _LOCATION_TYPE_DISPLAY_JA,
     _LOCATION_NAME_JA, _PARTICIPATION_TYPE_DISPLAY_JA,
     _ACT_PRIORITY_DISPLAY_JA, _DIAGNOSIS_ROLE_DISPLAY_JA)
    prior to hardcoded-audit Finding 6.

# Encounter.class.coding.display — v3-ActCode plus the SNOMED-ish
# ambulatory / inpatient-encounter / … synonyms seen on cross-system
# input. C5-22 adds classHistory transition labels.
class_display:
  AMB: 外来
  ambulatory: 外来
  IMP: 入院
  inpatient encounter: 入院
  EMER: 救急
  emergency: 救急
  HH: 訪問看護
  home health: 訪問看護
  FLD: 現地訪問
  field: 現地訪問
  inpatient ward: 一般病棟
  ICU: 集中治療室
  ACUTE: 集中治療室

