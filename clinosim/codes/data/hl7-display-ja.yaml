  problem-list-item: 問題リスト
  Problem List Item: 問題リスト
  imaging: 画像検査
  Imaging: 画像検査
  procedure: 処置
  Procedure: 処置

# Condition.severity.coding.display + SNOMED severity codes.
severity_display:
