# HL7 v3 ObservationInterpretation — every interpretation code clinosim emits:
# the numeric-result flags (Observation.interpretation on labs and vitals) and
# the antimicrobial susceptibility codes (S/I/R, microbiology). English
# displays verified on tx.fhir.org $lookup (THO).
metadata:
  name: HL7 v3 ObservationInterpretation
  uri: http://terminology.hl7.org/CodeSystem/v3-ObservationInterpretation
  source: "HL7 Terminology (THO)"
codes:
  N:   {en: "Normal",             ja: "正常"}
  H:   {en: "High",               ja: "高値"}
  L:   {en: "Low",                ja: "低値"}
  HH:  {en: "Critical high",      ja: "パニック高値"}
  LL:  {en: "Critical low",       ja: "パニック低値"}
  A:   {en: "Abnormal",           ja: "異常"}
  AA:  {en: "Critical abnormal",  ja: "パニック異常"}
  HU:  {en: "Significantly high", ja: "著明高値"}
  LU:  {en: "Significantly low",  ja: "著明低値"}
  POS: {en: "Positive",           ja: "陽性"}
  NEG: {en: "Negative",           ja: "陰性"}
  S:   {en: "Susceptible",        ja: "感性"}
  I:   {en: "Intermediate",       ja: "中間"}
  R:   {en: "Resistant",          ja: "耐性"}
