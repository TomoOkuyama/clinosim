# HL7 v3 RoleCode — family-member relationships used on FamilyMemberHistory
# (Issue #2764). Authoritative source: HL7 Terminology (THO), CodeSystem
# v3-RoleCode (http://terminology.hl7.org/CodeSystem/v3-RoleCode). English
# displays verified with tx.fhir.org $lookup, 2026-11-06. The code system
# publishes English only; `ja` is the clinosim label carried in `text`.
metadata:
  kind: code-system
  name: HL7 v3 RoleCode
  uri: http://terminology.hl7.org/CodeSystem/v3-RoleCode
  source: "HL7 Terminology (THO)"
codes:
  MTH: {en: "mother", ja: "母"}
  FTH: {en: "father", ja: "父"}
  NSIB: {en: "natural sibling", ja: "兄弟姉妹"}
