metadata:
  name: MEDIS HOT7 Medication Code
  uri: http://medis.or.jp/CodeSystem/master-HOT7
  version: '2024'
  source: JP Core NamingSystem JP_MEDIS_MedicationCodeHOT7_NamingSystem preferred fixedUri / MEDIS HOT-YJ master (7-digit MEDIS Hosokan-Term)
  description: 'No codes are registered (Issue #2347): the 7-digit codes formerly listed here were MHLW YJ ingredient prefixes (the first seven YJ characters), not MEDIS HOT7 numbers, and JP drug codes now come from the drug catalog as full YJ codes. The system stays registered so the JP Core HOT7 URI resolves. MEDIS HOT7 medication codes (7-digit numeric MEDIS master). Session 81 split from yj.yaml (Issue #415) — the two systems previously coexisted in yj.yaml, which was semantically incorrect (yj system URI is capstandard YJ-code). Per-code URI dispatch in _fhir_medications._resolve_jp_drug_system_uri already emits the correct URI at FHIR emit time; this split makes the source-of-truth registry match.'
