  # SSRI antidepressants (#1281 follow-up). Class prefix 1179 =
  # 精神神経用剤 / SSRI・SNRI・その他の精神神経用剤 per MHLW
  # 薬効分類. 7-digit codes are representative in-class stand-ins
  # per the pattern the rest of this file uses (12-char per-SKU
  # codes live in yj.yaml). Skips Fluoxetine + Citalopram — neither
  # is PMDA-approved in Japan.
  '1179046':  # Issue #2134: was 1179044
    en: Sertraline
    ja: セルトラリン塩酸塩
  '1179054':  # Issue #2134: was 1179052
    en: Escitalopram
    ja: エスシタロプラム シュウ酸塩
  '1179041':  # Issue #2134: was 1179040
    en: Paroxetine
    ja: パロキセチン塩酸塩水和物

  # Cesarean intraoperative bundle (#1285 sub-scope). 7-digit class
  # representatives per MHLW 薬効分類. `2414400` (オキシトシン) and
  # `1214403` (局所麻酔剤 → ブピバカイン塩酸塩; codes corrected in #2134)
  # follow the same class-stand-in convention every other 7-digit
  # entry in this file uses (12-char per-SKU codes live in yj.yaml).
  # Ondansetron (`2391003`, 制吐薬) fills the silent gap left when the JP
  # code_mapping already referenced these codes but hot7.yaml had
  # no display entry — the fallback drug-code lookup returned the
  # code itself as display, which is now the JP-standard label.
  '2414400':  # Issue #2134: was 2499401
    en: Oxytocin
    ja: オキシトシン
  '1214403':  # Issue #2134: was 1214402
    en: Bupivacaine
    ja: ブピバカイン塩酸塩水和物
  '2391003':
    en: Ondansetron
    ja: オンダンセトロン塩酸塩水和物

  # JP-approved SSRI backup (#1281 second follow-up). Class 1179
  # 精神神経用剤 product 038 = フルボキサミンマレイン酸塩
  # (widely cited MHLW 薬価基準品目; デプロメール / ルボックス).
  '1179039':  # Issue #2134: was 1179038
    en: Fluvoxamine
    ja: フルボキサミンマレイン酸塩

  # Oncology chemo drug catalog expansion (#1280 sub-C). 7-digit
  # class-representative per MHLW 薬効分類 — same convention every
  # other 7-digit entry in this file uses.
  #   4224 = 代謝拮抗剤 (Gemcitabine)
  #   4240 = その他の抗悪性腫瘍剤 (Irinotecan topoisomerase inhibitor)
  #   4291 = 抗悪性腫瘍剤 (Nab-paclitaxel taxane, Temozolomide
  #                       alkylating agent)
  #   6323 = 免疫療法用製剤 (BCG intravesical)
  '4224400':
    en: Gemcitabine
    ja: ゲムシタビン塩酸塩
