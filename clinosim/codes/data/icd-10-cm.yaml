# ICD-10-CM — International Classification of Diseases, 10th Rev, Clinical Modification (US)
#
# AUTHORITATIVE SOURCE: CMS / NCHS (cms.gov/medicare/coding-billing/icd-10-codes).
# Codes verifiable via the NLM Clinical Table Search Service ICD-10-CM API
# (https://clinicaltables.nlm.nih.gov/api/icd10cm/v3/search). Do not fabricate a code (AD-57).
#
# DIAGNOSIS CODE MAPPING (2026-06 data-quality review — see TODO.md "ICD code review"):
#  - The per-locale diagnosis translation (locale/<c>/code_mapping_diagnosis.yaml) IS now
#    wired up in the FHIR adapter (_build_conditions, both primary + chronic). Internal
#    chronic/history base codes (I50, E78, I21, M48, ...) are translated to billable
#    ICD-10-CM leaves for US output; JP maps identity (WHO ICD-10 category codes valid).
#  - The internal base codes (this table still defines them for chronic-tracking) and their
#    billable targets both live here; the mapping picks the billable target at output time.
#  - Codes are NEVER renamed in place (that would break as-is display); translation only.
#
# JAPANESE (`ja`): ICD-10-CM is published in English only. JP output uses the MHLW
# ICD-10 (icd-10.yaml), so codes shared with WHO carry no `ja` here (Issue #2360).
# The `ja` on CM-only codes is a clinosim translation, not an authority display.
