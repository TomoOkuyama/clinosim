  # clinosim/locale/shared/perinatal.yaml as the default WHO ICD-10 code
  # for uncomplicated delivery; on US emit the same value is a valid
  # billable leaf so no code_mapping_diagnosis entry is required, but the
  # display needs to be resolvable to avoid the "(display unavailable)"
  # fallback in build_diagnosis_codeable_concept.
  O80:
    en: "Encounter for full-term uncomplicated delivery"
  # Cesarean-section admission diagnosis (session 98 F7 — Incr 1.5).
