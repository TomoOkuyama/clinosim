  # Cancer category codes for family history display (WHO ICD-10 categories).
  # Issue #358 (2026-07-22 v19 → v20): JP display aligned to the MHLW
  # ICD-10 2013 registry canonical — 「および」→「及び」表記統一 + 悪性新生物
  # C-series には ＜腫瘍＞ suffix を必ず付与。同 URI は JP Core
  # jp-condition-diagnosis の required binding で strict display match が
