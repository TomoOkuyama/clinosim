# icd10-condition-display.yaml — short bilingual display labels for the
# ICD-10 codes that `clinosim/modules/patient/activator.py` activates
# as chronic / incident conditions.
#
# Consumed by:
#   * `clinosim/modules/patient/activator.py::CONDITION_NAMES`
#     (chronic activation path: diagnosis display for FHIR Condition
#      resources)
#   * `clinosim/simulator/outpatient.py` (chronic outpatient visit
#     reason composition)
#
# Why this is a separate yaml from `codes/data/icd-10.yaml`:
# the ICD-10 canonical yaml carries the full WHO heading (e.g.
# "Essential (primary) hypertension", "Other chronic obstructive
# pulmonary disease"), which is too long for simulated narratives.
# Clinosim's chronic activator uses a short conventional label
# ("Essential hypertension", "COPD") for narrative legibility. This
# yaml holds the short labels authoritatively; the ICD-10 canonical
# yaml is unchanged.
#
# Membership policy:
#   * include only codes that `activator.py` activates (the chronic +
#     incident pool authored at that layer)
#   * `en:` is the short narrative label (NOT the ICD-10 canonical
#     heading)
#   * `ja:` is the MHLW / clinical convention; see note below
#
# Why JA was EN-only before: `CONDITION_NAMES` was authored EN-only
# because no JA caller consumed it. Phase 3.γ chronic-narrative rollout
# surfaced JA chronic conditions in SOAP output; this yaml closes the
# locale gap.

metadata:
  source: >-
    clinosim/modules/patient/activator.py (CONDITION_NAMES) prior to
    hardcoded-review Phase A8. JA displays sourced from `codes/data/
    icd-10.yaml` canonical with shortening to match EN conventions.

