# JIS X 0401 — Japan Industrial Standard prefecture codes (都道府県コード)
#
# Authoritative source: JIS X 0401:2010 都道府県コード (日本工業規格,
# https://kikakurui.com/x0/X0401-2010-01.html). Codes are 2-digit zero-
# padded strings ("01" through "47"), numbered Hokkaido-first and
# proceeding south.
#
# Used by FHIR `Address.state` emit on JP output to populate the
# `state-jis-x-0401` extension (jpfhir-ext-Address-JP-Prefecture).
#
# Migrated from the inline `_PREFECTURE_CODE` dict in
# `clinosim/modules/output/fhir_r4/lib/reference_data.py` under the
# post-#1849 review (hardcoded-audit Finding 4) — JIS X 0401 is a
# standards registry; data belongs in a yaml beside the other authority-
# adjacent catalogs.
metadata:
  name: JIS X 0401 Prefecture Codes
  description: >
    47 都道府県 → 2-digit JIS X 0401 code mapping used by the JP-locale
    FHIR Address emit path.
  source: JIS X 0401:2010 都道府県コード
  version: '2010'

prefectures:
