# JP-CLINS 文書種別 CodeSystem — Composition.type 用 coding(JP-only)
#
# 一次出典:jpfhir.jp JP-CLINS v1.13.0(2026-02-16)。
# https://jpfhir.jp/fhir/clins/igv1/CodeSystem-jp-codeSystem-documentTypeCode.html
# を 2026-07-12(session 47 P2-13 PR2a)に照合。
#
# country=JP かつ JP-CLINS 対応文書種別(退院時サマリー / 診療情報提供書 /
# 健診結果報告書 / 処方箋 / 計画書)の Composition.type.coding に使用する。
# US Composition 出力は LOINC を直接使用し、本 CodeSystem は経由しない。
metadata:
  name: JP-CLINS Document Type Code
  uri: http://jpfhir.jp/fhir/Common/CodeSystem/doc-typecodes
  version: "1.13.0"
  source: "jpfhir.jp JP-CLINS v1.13.0 CodeSystem doc-typecodes"
  description: JP-CLINS document type code system for FHIR Composition.type
codes:
  "18842-5":
    en: "Discharge summary"
    ja: "退院時サマリー"
  "57133-1":
    en: "Referral note"
    ja: "診療情報提供書"
  # JP-eCheckup v1.7.0 で LOINC 53576-5 が正式 code(session 47 PR3 で確認)
  "53576-5":
    en: "Health checkup report"
    ja: "検診・健診報告書"
  "57833-6":
    en: "Prescription for medication"
    ja: "処方箋"
  "56447-6":
    en: "Plan of care note"
    ja: "計画書"
  # Issue #961: 死亡診断書 (Death certificate). JP-CLINS doc-typecodes CS does
  # not define a JP-specific code for death certificates, so we reuse the LOINC
  # canonical code 64297-5 under this CS URL (same pattern as 53576-5 for
  # JP-eCheckup, where LOINC is the authoritative code but is emitted under
  # the JP CS URL to match the profile slice discriminator). JP display uses
  # the 医師法第 20 条 official form title (see also loinc.yaml).
  "64297-5":
    en: "Death certificate"
    ja: "死亡診断書"
