# K-codes — Japanese procedure codes (診療報酬点数表)
#
# AUTHORITATIVE SOURCE: MHLW 診療報酬点数表 (厚生労働省告示; K手術・D検査・G処置・J処置).
# Updated each fee revision (隔年). Do not fabricate a code (AD-57).
# Verified 2026-11-01 against the 社会保険診療報酬支払基金 診療行為マスター
# (s_ALL20261013): every code is the master's 区分番号 (``J063``, ``G005-2``)
# or, for one item of a 区分, its 点数表区分番号 (``K0463`` = K046 item 3).
# ``ja`` is the master's name (the 区分 name for a 区分-level code); ``en`` is
# an English rendering (Issue #2340).
metadata:
  kind: code-system
  name: K-codes
  uri: urn:oid:1.2.392.200119.4.401
  version: '2024'
  source: "MHLW 診療報酬点数表 (K/D/G/J codes)"
  description: |
    Japanese procedure codes (診療報酬点数表: K手術, D検査, G処置, J処置).
    Includes surgical procedures (K-codes), diagnostic/bedside procedures
    (D/G/J codes). Each entry has both en (international) and ja (official
    Japanese) displays.
codes:
  # --- K: Surgery (手術) ---
  K0004:
    en: Wound repair, not reaching muscle or organ, under 5 cm
    ja: 創傷処理（筋肉、臓器に達しないもの（長径５センチメートル未満））
  K002:
    en: Debridement
    ja: デブリードマン
  K013:
    en: Split-thickness skin graft
    ja: 分層植皮術
  K0444:
    en: Closed reduction of forearm fracture
    ja: 骨折非観血的整復術（前腕骨骨折非観血的整復術）
  K0463:
    en: Open reduction and internal fixation of femoral fracture
    ja: 骨折観血的手術（大腿骨骨折観血的手術）
  K0464:
    en: Open reduction and internal fixation of forearm fracture
    ja: 骨折観血的手術（前腕骨骨折観血的手術）
  K0812:
    en: Hip hemiarthroplasty
    ja: 人工骨頭挿入術（股関節人工骨頭挿入術）
  K0823:
    en: Total knee arthroplasty
    ja: 人工関節置換術（人工膝関節置換術）
  K0882:
    en: Replantation of an amputated finger
    ja: 四肢切断再接合術（手指切断再接合術）
  K142:
    en: Spinal fusion, laminectomy or laminoplasty
    ja: 脊椎固定術、椎弓切除術、椎弓形成術
  K1643:
    en: Craniotomy for evacuation of intracerebral hematoma
    ja: 頭蓋内血腫除去術（開頭して行うもの）（脳内のもの）
  "K164-2":
    en: Burr-hole evacuation of chronic subdural hematoma
    ja: 慢性硬膜下血腫洗浄・除去術（穿頭による）
  K546:
    en: Percutaneous coronary intervention (PCI)
    ja: 経皮的冠動脈形成術
  K597:
    en: Permanent pacemaker implantation
    ja: ペースメーカー移植術
  K636:
    en: Exploratory laparotomy
    ja: 試験開腹術
  "K672-2":
    en: Laparoscopic cholecystectomy
    ja: 腹腔鏡下胆嚢摘出術
  "K718-2":
    en: Laparoscopic appendectomy
    ja: 腹腔鏡下虫垂切除術
  K719:
    en: Colectomy
    ja: 結腸切除術
  K898:
    en: Cesarean delivery
    ja: 帝王切開術
  K909:
    en: Surgical termination of pregnancy
    ja: 流産手術
  K920:
    en: Blood transfusion
    ja: 輸血
  # --- D: Examinations (検査) ---
  D208:
    en: Electrocardiogram
    ja: 心電図検査
  D215:
    en: Ultrasonography
    ja: 超音波検査
  D225:
    en: Invasive arterial pressure monitoring (arterial line)
    ja: 観血的動脈圧測定
  D302:
    en: Bronchoscopy (flexible)
    ja: 気管支ファイバースコピー
  D403:
    en: Lumbar puncture
    ja: 腰椎穿刺（脳脊髄圧測定を含む）
  # --- E: Imaging (画像診断) ---
  E001:
    en: Radiograph interpretation
    ja: 写真診断
  E200:
    en: Computed tomography (CT)
    ja: コンピューター断層撮影（ＣＴ撮影）
  E202:
    en: Magnetic resonance imaging (MRI)
    ja: 磁気共鳴コンピューター断層撮影（ＭＲＩ撮影）
  # --- G: Injections (注射) ---
  G004:
    en: Intravenous drip infusion
    ja: 点滴注射
  "G005-2":
    en: Central venous catheter insertion
    ja: 中心静脈注射用カテーテル挿入
  # --- J: Procedures (処置) ---
  J008:
    en: Thoracentesis
    ja: 胸腔穿刺（洗浄、注入及び排液を含む）
  J010:
    en: Paracentesis
    ja: 腹腔穿刺（人工気腹、洗浄、注入及び排液を含む）
  J019:
    en: Continuous chest tube drainage
    ja: 持続的胸腔ドレナージ
  J024:
