    ja: イレウス用ロングチューブ挿入法
  "J034-2":
    en: Nasal feeding or drug-administration tube insertion
    ja: 経鼻栄養・薬剤投与用チューブ挿入術
  J038:
    en: Hemodialysis
    ja: 人工腎臓
  J044:
    en: Endotracheal intubation for resuscitation
    ja: 救命のための気管挿管
  J047:
    en: Countershock (electrical cardioversion or defibrillation)
    ja: カウンターショック
  J063:
    en: Indwelling urinary catheter placement
    ja: 留置カテーテル設置
  J122:
    en: Limb plaster cast or splint
    ja: 四肢ギプス包帯
  # --- M: Radiation therapy (Issue #957 slice 3 — cancer treatment) ---
  # Source: MHLW 診療報酬点数表 (令和6年度) 第7部 放射線治療.
  # Cancer-follow-up patients on active radiation therapy emit these
  # procedure codes via the outpatient chronic-followup dispatch when
  # the cancer entry declares ``radiation_therapy_eligible: true``.
  # M001 covers X-ray superficial, high-energy (3D-CRT) and IMRT as
  # sub-items; M001-2 and M001-3 are the stereotactic techniques (#2200).
  M001:
    en: External beam radiation therapy
    ja: 体外照射
  M001-2:
    en: Gamma Knife stereotactic radiotherapy
    ja: ガンマナイフによる定位放射線治療
  M001-3:
    en: Linear accelerator stereotactic radiotherapy
    ja: 直線加速器による放射線治療
