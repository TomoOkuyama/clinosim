# Order → Procedure display-name → SNOMED CT crosswalk (Issue #1282 Sub-B).
#
# `simulator/emergency.py` (ED treatment orders) and
# `modules/order/engine.py` (inpatient admission supportive-care orders)
# emit `Order` records typed as `OrderType.PROCEDURE` with a free-text
# `display_name` (e.g. "血液透析 3-4h セッション, 3x/週 または 持続 (CRRT)",
# "O2: Nasal cannula SpO2 >= 94%", "Wound irrigation with normal saline").
# The Order → Procedure builder in `output/fhir_r4/lib/inline_bb.py`
# previously emitted these as `Procedure.code = {text: <display>}` with an
# EMPTY `coding` array — 36 % of all Procedure rows at p=10k s=354 (see
# Issue #1282), so any consumer filtering `Procedure.code.coding[*].code`
# missed the underlying event.
#
# This crosswalk maps a normalized substring of `display_name` (case-
# insensitive Unicode fold) to a verified SNOMED CT code. The lookup is
# first-match-wins in the order declared here — put more specific
# patterns (e.g. "CRRT") ABOVE their broader family entry (e.g.
# "hemodialysis") so the most-specific code wins.
#
# Code-only map (Issue #2363): displays come from the registry
# (`snomed-ct.yaml`, read through `clinosim.codes.snomed`). Every code must
# be registered there and its meaning checked with tx.fhir.org `$lookup`
# against `http://snomed.info/sct`. Re-verified 2026-11-01: 24 entries had
# codes whose SNOMED meaning was a different concept (e.g. 79733001
# "Amputation above-knee" for a sling, 447094002 "Alkaline chemical burn of
# cornea" for a bronchodilator) or did not exist, and were corrected.

# ---------------------------------------------------------------------------
# Entries. First-match-wins in the declared order below.
# Format: {match: <lowercase substring>, snomed: <code>}
# `match` is matched with case-insensitive substring against the trimmed
# lowercase `display_name`; Japanese pattern strings match verbatim
# (Python str.lower() is idempotent on kana/kanji).
metadata:
  kind: crosswalk
  name: procedure-phrase-to-snomed
  source: clinosim

entries:
  # Issue #2043 elective knee arthroplasty (verified tx.fhir.org $lookup 2026-10-27).
  - match: "total knee arthroplasty"
    snomed: "609588000"

  # CRRT / hemofiltration — check before generic "hemodial" match.
  - match: "crrt"
    snomed: "233581009"
  - match: "持続濾過"
    snomed: "233581009"
  - match: "持続的血液濾過"
    snomed: "233581009"

  # Hemodialysis (standard 3-4 h session).
  - match: "血液透析"
    snomed: "302497006"
  - match: "hemodial"
    snomed: "302497006"
  - match: "haemodial"
    snomed: "302497006"

  # ECMO — check before broader ventilation entries.
  - match: "ecmo"
    snomed: "233573008"
  - match: "extracorporeal membrane"
    snomed: "233573008"

  # CPAP / BiPAP non-invasive ventilation.
  - match: "cpap"
    snomed: "47545007"
  - match: "bipap"
    snomed: "47545007"
  - match: "非侵襲的換気"
    snomed: "47545007"

  # Sleep medicine — polysomnography (baseline sleep study for OSA
  # diagnosis confirmation + CPAP titration). SNOMED 60554003 verified
  # 2026-10-20 via tx.fhir.org $lookup against SCT 20250201 Intl Edition.
  - match: "polysomnography"
    snomed: "60554003"
  - match: "sleep study"
    snomed: "60554003"
  - match: "ポリソムノグラフィー"
    snomed: "60554003"

  # Oncology surveillance — mammography (NCCN v4.2024 Breast Cancer
  # survivorship, Issue #1701 Phase 4e). SNOMED 71651007 verified
  # 2026-10-21 via tx.fhir.org $lookup against SCT 20250201 Intl Edition.
  - match: "mammography"
    snomed: "71651007"
  - match: "mammogram"
    snomed: "71651007"
  - match: "マンモグラフィー"
    snomed: "71651007"
  - match: "乳房 x 線撮影"
    snomed: "71651007"

  # Oncology surveillance — colonoscopy (NCCN v3.2024 Colon §COL-E,
  # Issue #1701 Phase 4e horizontal). SNOMED 73761001 verified
  # 2026-10-21 via tx.fhir.org $lookup against SCT 20250201 Intl Edition.
  - match: "colonoscopy"
    snomed: "73761001"
  - match: "大腸内視鏡"
    snomed: "73761001"

  # Oncology surveillance — CT of chest (NCCN v3.2024 NSCLC §FOLL-A,
  # Issue #1701 Phase 4e horizontal). SNOMED 169069000 verified
  # 2026-10-21 via tx.fhir.org $lookup against SCT 20250201 Intl Edition.
  # NOTE: the "ct of chest" match goes before any broader "ct" entry
  # if one is added later — first-match-wins ordering is load-bearing.
  - match: "ct of chest"
    snomed: "169069000"
  - match: "胸部 ct"
    snomed: "169069000"

  # Oncology surveillance — esophagogastroduodenoscopy / EGD (NCCN
  # v2.2024 Gastric §GAST-D, Issue #1701 Phase 4e horizontal). SNOMED
  # 76009000 verified 2026-10-21 via tx.fhir.org $lookup against SCT
  # 20250201 Intl Edition.
  - match: "esophagogastroduodenoscopy"
    snomed: "76009000"
  - match: "egd"
    snomed: "76009000"
  - match: "上部消化管内視鏡"
    snomed: "76009000"

  # Oncology surveillance — abdominal ultrasound (NCCN v2.2024 HCC
  # §HCC-G, Issue #1701 Phase 4e horizontal). SNOMED 45036003 verified
  # 2026-10-21 via tx.fhir.org $lookup against SCT 20250201 Intl Edition.
  - match: "abdominal ultrasound"
    snomed: "45036003"
  - match: "ultrasonography of abdomen"
    snomed: "45036003"
  - match: "腹部超音波"
    snomed: "45036003"

  # Wound care / debridement.
  - match: "wound care"
    snomed: "225358003"
  - match: "wound irrigation"
    snomed: "225358003"
  - match: "創傷ケア"
    snomed: "225358003"
  - match: "創部処置"
    snomed: "225358003"

  # Foley urine output monitoring (timed urine collection).
  - match: "urine output"
    snomed: "225113003"
  - match: "尿量測定"
    snomed: "225113003"
  - match: "尿量観察"
    snomed: "225113003"

  # ED triage marker (assessment).
  - match: "triage"
    snomed: "225390008"
  - match: "トリアージ"
    snomed: "225390008"

  # Oxygen therapy (nasal cannula / face mask / venturi mask). Note the
  # dedicated `output/fhir_r4/procedures/oxygen_therapy.py` builder handles
  # session-derived oxygen Procedures already; the entry below covers
  # point-in-time ED / admission O2 orders that still hit the generic
  # Order → Procedure builder (session-derived shape is not available for
  # them).
  - match: "o2:"
    snomed: "57485005"
  - match: "oxygen therapy"
    snomed: "57485005"
  - match: "酸素投与"
    snomed: "57485005"

  # === Issue #1308: extended ED / inpatient minor-procedure crosswalk.
  # Every SNOMED code below is a verified concept in SNOMED CT
  # International Edition. Ordered specific-before-generic (first-match-
  # wins). Coverage target: the 15 largest empty-coding buckets from
  # the p=10k s=355 baseline (1275 / 4033 US Procedures = 31.6 %).

  # Nebulizer / bronchodilator therapy — SABA + anticholinergic inhalation.
  # Match specific drug tokens BEFORE the generic "nebulizer" pattern so
  # future entries (e.g. a hypertonic saline nebulizer) can still resolve.
  - match: "salbutamol"
    snomed: "127784009"
  - match: "albuterol"
    snomed: "127784009"
  - match: "ipratropium"
    snomed: "127784009"
  - match: "bronchodilator"
    snomed: "127784009"
  - match: "nebulizer"
    snomed: "1366004"
  - match: "ネブライザ"
    snomed: "1366004"

  # Wound closure — suture / staple / tissue adhesive. The generic
  # 18946005 "Skin closure" concept covers all three modalities.
  - match: "suture closure"
    snomed: "391906003"
  - match: "tissue adhesive"
    snomed: "746011009"
  - match: "skin closure"
    snomed: "746011009"

  # Issue #2627: bedside procedures that were emitted with text only
  # (tx.fhir.org $lookup 2026-11-05, all active). More specific phrases first.
  - match: "nasal packing"
    snomed: "365958005"
  - match: "skin staple"
    snomed: "50015006"
  - match: "short arm splint"
    snomed: "439535000"
  - match: "short arm cast"
    snomed: "438409006"
  - match: "posterior splint"
    snomed: "79321009"
  - match: "silver nitrate"
    snomed: "135871000"
  - match: "peripheral iv line"
    snomed: "233520008"

  # Fracture management — closed reduction (specific) and immobilization.
  - match: "closed reduction"
    snomed: "86052008"
  - match: "sling"
    snomed: "52037006"
  - match: "cervical collar"
    snomed: "49689007"

  # Dressings / bandages — generic "application of dressing to wound".
  - match: "elastic bandage"
    snomed: "9263008"
  - match: "non-adherent dressing"
    snomed: "3895009"
  - match: "dressing"
    snomed: "3895009"

  # Cold / heat / topical irrigation therapy (RICE for musculoskeletal
  # injury). Cold-pack + cool-water share the cold-application concept.
  - match: "ice pack"
    snomed: "229585002"
  - match: "cool water"
    snomed: "182661005"
  - match: "heat pack"
    snomed: "266694003"

  # Procedural sedation — moderate sedation for ED procedures.
  - match: "procedural sedation"
    snomed: "72641008"

  # DVT prophylaxis — sequential compression devices.
  - match: "sequential compression"
    snomed: "429289005"
  - match: "scd"
    snomed: "429289005"

  # Urinary bladder catheterization — Foley insertion.
  - match: "foley"
    snomed: "410024004"
  - match: "urinary catheter"
    snomed: "410024004"
  - match: "尿道カテーテル"
    snomed: "410024004"

  # Issue #2424: procedures and transfusions that disease YAMLs used to list
  # as drugs (verified tx.fhir.org $lookup 2026-11-02).
  - match: "mechanical_ventilation"
    snomed: "1258985005"
  - match: "mechanical ventilation"
    snomed: "1258985005"
  - match: "packed_rbc"
    snomed: "116863004"
  - match: "vertebroplasty"
    snomed: "401226007"
  - match: "kyphoplasty"
    snomed: "431995006"
  - match: "catheter-directed thrombolysis"
    snomed: "233428003"
