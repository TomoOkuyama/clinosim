# Small hospital / clinic with inpatient beds (~10 beds)
# Limited resources, some services (CT/MRI) referred to regional hospital.

# Staff-roster / metadata scale (Issue #2128).
hospital_scale: small

recommended_population: 12000  # 10-bed clinic, ~80% occupancy

# Imaging infrastructure (WADO base URL for Endpoint emission)
imaging:
  wado_base_url: "https://wado.clinosim.example/dicomweb"

# Tiny clinic — only 内科 + 救急 + プライマリケア.
# Surgical/orthopedic cases referred to larger hospital.
available_departments:
  - internal_medicine
  - emergency_medicine
  - primary_care
  # Issue #2641: delivery service — maternity ward + newborn nursery (wards below).
  # Listed last: its staff are generated after everyone else's.
  - obstetrics_gynecology  # 産婦人科
  # Issue #2870: radiology runs the screening mammograms. Its staff are the
  # radiologists every roster has (no physicians or wards of its own).
  - radiology              # 放射線科
  # Issue #3153: health-checkup unit (健診センター) of the opt-in
  # health_checkup module; no physicians of its own (see
  # departments_without_physicians), its checkups are done by internists.
  - health_checkup         # 健診センター

# All sub-specialties and surgical specialties fall back to internal_medicine
# (a tiny clinic doesn't have specialists)
# Departments staffed without physicians of their own (Issue #915, #2870,
# #3153): allied-health service lines (dietitians, social workers), radiology
# (the radiologists every roster has) and the health-checkup unit.
departments_without_physicians:
  - nutrition
  - medical_social_work
  - radiology
  - health_checkup

department_rollup:
  pulmonology: internal_medicine
  cardiology: internal_medicine
  gastroenterology: internal_medicine
  neurology: internal_medicine
  nephrology: internal_medicine
  endocrinology: internal_medicine
  hematology: internal_medicine
  infectious_disease: internal_medicine
  general_surgery: internal_medicine     # too small for surgery; medical management only
  orthopedics: internal_medicine
  neurosurgery: internal_medicine
  trauma_surgery: internal_medicine
  # Outpatient-only specialties → primary_care (OPD front-desk).
  # Consumed by simulator/outpatient_dept for follow-up visits (well-
  # child, immunization, mammography screening).
  pediatrics: primary_care
  dermatology: primary_care
  # Issue #1280 Sub-A: tiny clinic doesn't run oncology; cancer
  # follow-up visits fall back to internal_medicine here (real world:
  # cancer patients at a 10-bed clinic are co-managed with a tertiary
  # oncology center — the clinic's chart records generic follow-up).
  oncology: internal_medicine
  oncology_infusion: internal_medicine
  radiation_oncology: internal_medicine
  hematology_oncology: internal_medicine
  medical_oncology: internal_medicine
  # Issue #1281 sub-scope: tiny clinic doesn't run psychiatry either;
  # depression / anxiety follow-up rolls to internal_medicine.
  psychiatry: internal_medicine

wards:
  internal_medicine: ["1F"]              # single ward
  emergency_medicine: ["ER"]
  primary_care: ["OPD"]
  obstetrics_gynecology: ["2F", "NBN"]  # maternity ward (産科病棟), newborn nursery (新生児室)

ward_capacity:
  "1F": 10
  "2F": 4   # maternity beds (Issue #2641; counted in perinatal_beds)
  "NBN": 4   # nursery bassinets (Issue #2641; counted in perinatal_beds)

resource_capacity:
  lab_analyzers: 1
  ct_scanners: 0    # referred to regional hospital
  mri_scanners: 0
  xray_rooms: 1
  ultrasound_rooms: 1
  operating_rooms: 1
  ed_beds: 3
  inpatient_beds: 10
  # Issue #2641: maternity beds + nursery bassinets, outside the general-ward
  # occupancy model (deliveries never entered it).
  perinatal_beds: 8

staffing:
  day:
    hours: [8, 16]
    lab_staff: 1.0
    radiology_staff: 0.5
    nursing_staff: 1.0
    pharmacy_staff: 0.5
    or_staff: 0.5
  evening:
    hours: [16, 0]
    lab_staff: 0.3
    radiology_staff: 0.0
    nursing_staff: 0.5
    pharmacy_staff: 0.0
    or_staff: 0.0
  night:
    hours: [0, 8]
    lab_staff: 0.1
    radiology_staff: 0.0
    nursing_staff: 0.3
    pharmacy_staff: 0.0
    or_staff: 0.0
  weekend_modifier: 0.5

daily_patterns:
  morning_lab_rush:
    hours: [6, 8]
    lab_queue_delta: 0.2
  post_morning_rounds:
    hours: [9, 11]
    lab_queue_delta: 0.1
  monday_backlog:
    weekday: 0
    lab_queue_delta: 0.1

base_processing_time:
  lab_stat: 30
  lab_routine: 60
  xray: 15
  ct: 0       # no CT
  ultrasound: 30
  or_minor: 30
  or_major: 120

reporting_time:
  stat: 25
  routine: 180

# Issue #2641: wards the perinatal pathway admits to.
perinatal_wards:
  maternity: "2F"
  nursery: "NBN"
