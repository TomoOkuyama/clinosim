# Country profile defaults (Issue #3140; docs/design-guides/country-profile-spec.md §3).
#
# Every country inherits these; clinosim/locale/<cc>/country.yaml stores only
# its overrides, deep-merged over this file (maps merge key by key; lists and
# scalars replace). Loaded and validated by clinosim.country_profile
# (CountryProfile, extra="forbid"). The keys here are the full vocabulary: a
# country may not add a feature, a code-system kind or an implementation kind
# the root does not declare.
metadata:
  kind: reference
  name: country_profile
  source: clinosim

language: en
# UTC offset suffix of FHIR timestamps.
timezone: "Z"
# Code-system key per clinical data kind (clinosim.codes registry keys).
code_systems:
  lab: loinc
  diagnosis: icd-10-cm
  drug: rxnorm
  procedure: cpt
  microbiology: loinc
# FHIR profiles applied to output (us_core, jp_core, jp_clins, jp_echeckup).
fhir_profiles: []
# Country features (off unless a country switches them on).
features:
  # Issue #3192: the statutory health checkup (JP 特定健診) enricher; off unless
  # a country switches it on (it never ran for the US).
  health_checkup: false
  care_level: false
  maternal_tdap: false
formats:
  name_order: given_family
  date_format: "MM/dd/yyyy"
  time_format: "12h"
  datetime_format: "MM/dd/yyyy h:mm a"
  # Title before a physician's name (FHIR HumanName.prefix); "" = none.
  physician_name_prefix: "Dr."
# Named implementation per algorithm kind (registered with
# clinosim.country_profile.register_implementation).
implementations:
  egfr_equation: ckd_epi_2021
  pediatric_egfr_equation: bedside_schwartz
  # Issue #3144. Household insurance / resident-identifier assignment
  # (clinosim/modules/identity/providers/<name>.py).
  identity_provider: us
  # ED triage scale (clinosim/modules/triage/engine.py).
  triage_scale: esi
  # Lab result coding (clinosim/modules/output/fhir_r4/labs/coding_strategy.py):
  # "loinc" codes every analyte from the lab code mapping.
  lab_coding: loinc
  # Code system of an emitted drug code (clinosim/codes/drugs.py):
  # "profile_code_system" is the profile's code_systems.drug.
  drug_system: profile_code_system
  # Order code of a disease-YAML drug entry (clinosim/modules/order/engine.py
  # protocol_drug_order_code): "catalog_code" is the drug catalog's code in the
  # profile's drug code system.
  drug_order_code: catalog_code
  # Coverage copay percentage (clinosim/modules/output/fhir_r4/demographics/
  # patient.py): "category_rate" reads identity.yaml copay.by_category.
  copay_rule: category_rate
