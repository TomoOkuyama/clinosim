# Demographics template — same schema as clinosim/locale/us/demographics.yaml
# and clinosim/locale/jp/demographics.yaml (read by
# clinosim/locale/loaders/demographics.py). Every key below is consumed by
# the loader or the population engine; see the us/jp files for the complete,
# commented examples of each block.
#
# Sources: national census, health surveys and disease surveillance.
# All distributions must be non-negative with sum > 0 (validated at load).
# Replace every __TODO__ with data for the locale; delete optional blocks
# you cannot source (the engine then uses its documented fallbacks).

average_household_size: __TODO__            # e.g. 2.5

age_distribution:                            # population share by age band
  "0-14": __TODO__
  "15-24": __TODO__
  # ... contiguous bands up to the oldest band

sex_ratio:
  male: __TODO__                             # share of males, e.g. 0.49

blood_type:                                  # ABO phenotype shares (Rh is derived)
  O: __TODO__
  A: __TODO__
  B: __TODO__
  AB: __TODO__

physiology:                                  # anthropometrics by sex
  bmi:
    male: {mean: __TODO__, std: __TODO__}
    female: {mean: __TODO__, std: __TODO__}
  height_cm:
    male: {mean: __TODO__, std: __TODO__}
    female: {mean: __TODO__, std: __TODO__}

chronic_prevalence:                          # ICD-10 code -> {age band: prevalence}
  I10:
    "18-39": __TODO__
    "40-59": __TODO__
  # ... one entry per chronic code the locale models

disease_incidence:                           # disease id -> annual admissions per 100,000 by age
  bacterial_pneumonia:
    age_rates: {0: __TODO__, 5: __TODO__}
    sex_ratio_female: __TODO__
  # ... one entry per disease under clinosim/modules/disease/reference_data/

seasonal_modifiers:                          # optional: disease id -> {month: multiplier}
  bacterial_pneumonia: {1: __TODO__, 2: __TODO__}

disease_risk_multipliers:                    # optional: disease id -> {chronic code: multiplier}
  bacterial_pneumonia: {J44: __TODO__}

comorbidity_correlations:                    # optional: chronic code -> {chronic code: odds multiplier}
  I10: {E78: __TODO__}

lifestyle_distribution:                      # smoking / alcohol shares by sex
  smoking:
    male: {never: __TODO__, former: __TODO__, current: __TODO__}
    female: {never: __TODO__, former: __TODO__, current: __TODO__}
  alcohol:
    male: {none: __TODO__, social: __TODO__, heavy: __TODO__}
    female: {none: __TODO__, social: __TODO__, heavy: __TODO__}

lifestyle_risk_multipliers:                  # optional: see us/demographics.yaml
  smoking:
    current: {J44: __TODO__}

preventive_care:                             # optional; omitted keys keep the defaults
  annual_screening_participation: __TODO__   # share of the screening age band screened per year
  flu_vaccination_probability: __TODO__      # share of eligible adults (65+ / comorbid) vaccinated per season

care_seeking:                                # threshold for seeking care (0..1)
  threshold_mean: __TODO__
  threshold_sd: __TODO__

unknown_conditions:                          # undiagnosed-presentation admissions
  min_age: __TODO__
  base_rate: __TODO__

mixed_conditions:                            # dual pathology in multimorbid elderly
  min_age: __TODO__
  min_chronic_conditions: __TODO__
  probability: __TODO__

ed_visit_not_admitted:                       # REQUIRED for ED-only visits; 0 when missing
  rate_per_1000_person_years: __TODO__

occupation_distribution:                     # see us/demographics.yaml for the full block
  age_thresholds:
    student_max_age: __TODO__
  working_age:
    office: __TODO__

occupation_risk_multipliers:                 # optional: ED condition -> {occupation: multiplier}
  crush_injury_hand: {manufacturing: __TODO__}

insurance_distribution:                      # optional, list of age ranges with payer weights
  - age_range: "0-18"
    weights: {__TODO_payer__: __TODO__}

race_distribution:                           # optional (US-style OMB race categories)
  __TODO_category__: __TODO__

ethnicity_distribution:                      # optional
  __TODO_category__: __TODO__
