  - {city: "川口市", prefecture: "埼玉県", zips: ["332-0001", "332-0002", "332-0003", "332-0011", "332-0012", "333-0841", "333-0842"], weight: 8}
  - {city: "所沢市", prefecture: "埼玉県", zips: ["359-0001", "359-0002", "359-0003", "359-1101", "359-1102", "359-1103"], weight: 5}
