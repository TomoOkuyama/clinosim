  - {city: "川崎市", prefecture: "神奈川県", zips: ["210-0001", "210-0002", "210-0003", "211-0001", "211-0002", "212-0001", "213-0001", "214-0001", "215-0001", "216-0001"], weight: 10}
  - {city: "藤沢市", prefecture: "神奈川県", zips: ["251-0001", "251-0002", "251-0003", "251-0021", "251-0022", "251-0023"], weight: 5}
  # 千葉県
  - {city: "船橋市", prefecture: "千葉県", zips: ["273-0001", "273-0002", "273-0003", "274-0061", "274-0062", "274-0063"], weight: 8}
  - {city: "市川市", prefecture: "千葉県", zips: ["272-0001", "272-0002", "272-0003", "272-0021", "272-0022", "272-0023"], weight: 6}
