# Clinic calendar — Japan (Issue #3018).
#
# Scheduled outpatient visits (chronic follow-up, screening, vaccination,
# pediatric, post-discharge) are held on clinic days only; the ED is open
# every day. A JP clinic closes on Sundays, national holidays (国民の祝日・
# 休日, including 振替休日 and 国民の休日) and over 年末年始 (29 Dec to 3 Jan).
# Saturday clinics are open.
#
# Source of `holidays`: Cabinet Office (内閣府) 「国民の祝日」について,
# syukujitsu.csv (https://www8.cao.go.jp/chosei/shukujitsu/syukujitsu.csv),
# 2000-2027 as published. A year outside this list closes on Sundays and
# 年末年始 only.
metadata:
  kind: reference
  name: clinic_calendar
  source: "Cabinet Office (内閣府) syukujitsu.csv"

# Python weekday numbers (Monday = 0, Sunday = 6).
closed_weekdays: [6]
# Inclusive month-day range that may wrap the year end.
closed_periods:
  - {start: "12-29", end: "01-03"}
