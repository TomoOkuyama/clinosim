# JP 予防接種受診の理由コード (Issue #3008): 接種したワクチン (CVX) → WHO
# ICD-10 (厚生労働省 ICD-10 2013年版準拠) の予防接種の必要性コード。
#
# CIF は予防接種受診を ICD-10-CM の Z23 "Encounter for immunization" で記録
# するが、WHO ICD-10 の Z23 は「単独の細菌性疾患に対する予防接種の必要性」
# であり、ウイルス性疾患・混合ワクチンは Z24-Z27 に分かれる。JP 出力では受診で
# 接種したワクチンごとのコードを Encounter.reasonCode に出す (US は Z23 のまま)。
# 出典: 厚生労働省 疾病、傷害及び死因の統計分類 基本分類表 (kihon2013.xlsx)、
# WHO ICD-10 (fhir.tx.support.r4 CodeSystem-icd-10)。各コードと日本語名称は
# codes/data/icd-10.yaml と codes/authoritative の snapshot で照合する。
# COVID-19 は 2013年版に専用の予防接種コード (WHO 2019 の U11) がないため
# 「その他の明示された単独のウイルス性疾患」(Z25.8) とする。
metadata:
  kind: country-mapping
  name: code_mapping_vaccination_reason
  source: "MHLW 基本分類表 (ICD-10 2013年版準拠); WHO ICD-10"

by_cvx:
  "150": "Z25.1"   # インフルエンザ
  "208": "Z25.8"   # COVID-19 (従来型)
  "300": "Z25.8"   # COVID-19 (2価)
  "309": "Z25.8"   # COVID-19 (季節性)
  "33": "Z23.8"    # 肺炎球菌 (PPSV23) — その他の単独の細菌性疾患
  "133": "Z23.8"   # 肺炎球菌 (PCV13)
  "17": "Z23.8"    # Hib
  "19": "Z23.2"    # BCG (結核)
  "106": "Z27.3"   # 四種混合 DTaP-IPV (DTP + ポリオ)
  "04": "Z27.8"    # MR (麻疹風疹混合) — その他の混合
  "21": "Z25.8"    # 水痘
  "07": "Z25.0"    # おたふくかぜ (ムンプス)
  "129": "Z24.1"   # 日本脳炎 (節足動物媒介ウイルス脳炎)
  "08": "Z24.6"    # B型肝炎 (ウイルス性肝炎)
  "119": "Z25.8"   # ロタウイルス

# 接種記録が受診に紐づかない (または上の表にない) ワクチン
unspecified: "Z26.9"
