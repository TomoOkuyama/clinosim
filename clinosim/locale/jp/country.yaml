# Country profile — Japan (Issue #3140). Overrides of
# clinosim/locale/_root/country.yaml only.
metadata:
  kind: reference
  name: country_profile
  source: clinosim

code: JP
# Healthcare-system config: clinosim/config/japan.yaml.
healthcare_system: japan
language: ja
timezone: "+09:00"
code_systems:
  lab: jlac10
  # Issue #350: icd-10-mhlw shares the WHO ICD-10 code data but carries the
  # MHLW canonical URI that JP Core jp-condition-diagnosis binds to.
  diagnosis: icd-10-mhlw
  drug: yj
  procedure: k-codes
  microbiology: jlac10
fhir_profiles: [jp_core, jp_clins, jp_echeckup]
features:
  care_level: true
  health_checkup: true
formats:
  name_order: family_given
  date_format: "yyyy/MM/dd"
  time_format: "24h"
  datetime_format: "yyyy/MM/dd HH:mm"
  # Japanese records write no title before a physician's name.
  physician_name_prefix: ""
implementations:
  egfr_equation: jsn
  pediatric_egfr_equation: uemura
  identity_provider: jp
  # JTAS (Japan Triage and Acuity Scale).
  triage_scale: jtas
  # JP-CLINS lab coding: CoreLabo JLAC10 for the analytes JP-CLINS slices,
  # the Uncoded slice for the rest.
  lab_coding: jp_clins
  # The JP drug code family (YJ, HOT, ...) is read from the code's format.
  drug_system: jp_code_format
  # The YJ product for the drug and its route (clinosim/countries/jp).
  drug_order_code: jp_route_product
  # 一部負担金割合 by age and income (clinosim/countries/jp/copay.py).
  copay_rule: jp_age_income
