# External referring / receiving Japanese hospital catalog (Issue #924).
#
# Curated pool of plausible 診療所 / 中規模病院 / 大学病院 that the
# FHIR referral-letter (診療情報提供書, LOINC 57133-1) Composition
# builder samples from when populating the 910 (紹介先) section.
#
# Prior to this catalog the referral emit path had no external
# Organization to reference and defaulted both 920 (紹介元) and 910
# (紹介先) entries at `Organization/hospital-main`, contradicting the
# narrative text `紹介先:他院` (Issue #924). Entries below become
# `Organization.ndjson` rows at export time, but only when actually
# referenced by an emitted referral letter — orphan entries are not
# emitted.
#
# Fields per entry:
#   id            — stable FHIR Organization.id (deterministic, ext-hosp-*).
#                   Must be unique across the catalog.
#   name          — Japanese facility name (Organization.name).
#   type          — internal facility-class tag; also drives
#                   type_display when omitted below.
#   type_code     — HL7 v3 OrganizationType code (always `prov` for
#                   external independent facilities; `dept` is reserved
#                   for hospital-internal sub-organizations).
#   type_display  — 医療機関 / 診療所 / 病院 / 大学病院 label; used both
#                   for Organization.type coding.display and to render
#                   the narrative referral destination sentence.
#   address       — used for Organization.address.text (prefecture + city).
#     prefecture  — 都道府県 name (used as address text prefix).
#     city        — 市区町村 name.
#   institution_code — 10-digit MHLW medical-institution number.
#                   Placeholder values (not real assignments) but they
#                   satisfy the JP_Organization_eCS
#                   `identifier:medicalInstitutionCode` slice.
#   phone         — Organization.telecom placeholder (03/06/052 area).
#
# Design constraints:
#   * spread across facility types (clinic / community / university)
#     so referrals are not all to the same class of facility
#   * spread across prefectures typical of the JP referral network
#   * plausible Japanese naming (地名 + 内科クリニック / 病院 / 医療
#     センター / 大学病院) — no real institution names
#   * order-stable — sampling is a deterministic modulo on this list;
#     appending is safe, inserting in the middle rotates assignments

