# JP adult immunization schedule.
# Sources: MHLW 定期接種 schedule; coverage = MHLW 接種率統計 approximate estimates.
# Verified 2026-06.
#
# Semantics of `coverage_by_age_sex`:
#   annual (flu)       → per-season vaccination rate (matches MHLW 接種率 statistics,
#                        e.g. インフルエンザ 65+ ~53-58% per season).
#   once (COVID/PPSV)  → lifetime "have you ever received it" rate.
#   every_n_years      → per-scheduled-dose rate (each interval).
#
# Consequence for EHR-cumulative rates: with history_years=10 for flu, a 65+
# patient has P(≥1 flu record) = 1 - (1 - 0.55)^10 ≈ 99.97%. Combined with
# COVID (~0.90) and PPSV23 (~0.40) once-in-lifetime draws, P(≥1 immunization
# record) approaches 100% for elderly. This is by-design (matches real EHR
# behavior: a hospital-attending elderly patient typically has a multi-year
# vaccination history on file). Do NOT re-calibrate coverage_by_age_sex to
# make cumulative "≥1 record" match a per-season statistic — that would
# under-represent per-season rates and misalign with MHLW targets.
# See modules/immunization/README.md "Cumulative record vs per-season" note.
# Issue #3660: 接種の区分 `program` (Immunization.reasonCode の文言に使う)。
#   routine    定期接種 (省略時の既定)
#   voluntary  任意接種
#   routine_from_age  `voluntary` と併記: この年齢以上の接種は定期接種
# インフルエンザ・新型コロナは予防接種法のB類疾病で、定期接種の対象は65歳以上
# (厚生労働省「インフルエンザ」ページ: 65歳以上の方と、60～64歳で一定の基礎疾患が
# ある方は定期の予防接種として毎年1回接種できる。同省 新型コロナ定期接種リーフレット:
# 65歳以上を対象に10月から定期接種)。60～64歳の基礎疾患のある方は表現しない
# (基礎疾患の程度の要件をモデル化していない)。新型コロナの 2024 年度より前の
# 特例臨時接種も表現しない (65歳以上は定期、それ未満は任意として扱う)。
# おたふくかぜは任意接種。
# Issue #3005: 各ワクチンの接種経路・接種部位・接種量。`administration`:
#   route    codes/data/snomed-maps.yaml `route` のキー (IM / SC / PO / PERCUTANEOUS)
#   dose_ml  1回接種量 (添付文書に固定量がないものは省略、BCG)
#   dose_ml_by_age  年少児の接種量 [{max_age_months, ml}] (日本脳炎・B型肝炎)
# `administration_sites` は経路と接種時月齢ごとの SNOMED 接種部位 (経口は部位なし)。
# 出典: 厚生労働省 予防接種実施要領・各ワクチン添付文書 (皮下注は上腕伸側、
# BCG は経皮・管針法、ロタリックスは経口 1.5 mL)、日本小児科学会
# 「小児に対するワクチンの筋肉内接種法について」(乳幼児は大腿前外側部、
# 年長児・成人は三角筋)。
administration_sites:
  SC:
    - {site: "368208006"}                      # 左上腕 (上腕伸側)
  IM:
    - {max_age_months: 35, site: "61396006"}   # 左大腿 (大腿前外側部)
    - {site: "368208006"}                      # 左上腕 (三角筋)
  PERCUTANEOUS:
    - {site: "368208006"}                      # 左上腕 (BCG 管針法)

vaccines:
  influenza:
    cvx: "150"
    program: voluntary
    routine_from_age: 65
    min_age: 18
    min_age_days: 182   # 接種可能な下限 (生後6か月、接種日で判定、Issue #2979)
    frequency: annual
    administration: {route: SC, dose_ml: 0.5}
    season_month: 11   # legacy fallback; seasonal_distribution below takes precedence
    available_from: "2000-01-01"
    history_years: 10   # EHR retains only ~recent flu history (avoids 20+ accumulated shots)
    # Issue #921: real JP flu season spans Oct-Feb with November peak
    # (MHLW インフルエンザワクチン接種状況; JMA seasonal reports).
    # Weights are relative (normalized per-season internally); month
    # strings 10/11/12 fall in the season-start calendar year, 1/2
    # roll into the following calendar year.
    seasonal_distribution:
      "10": 0.15   # October — early adopters, 高齢者優先接種開始
      "11": 0.40   # November — peak, 公衆衛生キャンペーン
      "12": 0.30   # December — year-end boost, 学校/職域接種
      "1":  0.10   # January — late catch-up
      "2":  0.05   # February — very late
    coverage_by_age_sex:
      "18-49": {M: 0.25, F: 0.30}
      "50-64": {M: 0.40, F: 0.44}
      "65-99": {M: 0.55, F: 0.58}
  covid19:
    # 309 is the current active CVX representing a COVID-19 mRNA vaccination; availability anchors the program start.
    cvx: "309"
    program: voluntary
    routine_from_age: 65
    # Issue #3014: 接種日に国内で使われていた製剤 (Pfizer mRNA, 30 µg/0.3 mL;
    # CVX は codes/data/cvx.yaml で照合済み)。
    #   従来型 1価 (CVX 208): 2021-02-14 特例承認、初回接種・3回目・4回目
    #   オミクロン株対応 2価 (CVX 300): 令和4年秋開始接種 2022-09-20 から
    #   XBB.1.5 対応 1価 以降の季節性製剤 (CVX 309): 令和5年秋開始接種
    #     2023-09-20 から、令和6年度以降の定期接種 (B類) を含む
    # 出典: 厚生労働省「新型コロナワクチンの接種について」(令和4年秋開始接種・
    # 令和5年秋開始接種の実施要領)、PMDA 承認情報 (コミナティ筋注)。
    products:
      - {cvx: "208", until: "2022-09-19"}
      - {cvx: "300", from: "2022-09-20", until: "2023-09-19"}
      - {cvx: "309", from: "2023-09-20"}
    min_age: 18
    frequency: once
    administration: {route: IM, dose_ml: 0.3}   # 30 µg/0.3 mL (CVX 208 / 300 / 309)
    available_from: "2021-02-17"
    # Issue #921: real JP COVID-19 rollout (MHLW / VRS) has distinct
    # wave epochs — uniform month distribution is unphysical. Each
    # patient's "once" dose is assigned to an epoch weighted by
    # age_weight[band]; within the epoch, month is sampled from
    # monthly_curve and day-of-month uniformly.
    #
    # Timeline anchors:
    #   2021-02  Pfizer 特例承認
    #   2021-04  医療従事者・65歳以上 optimized start (elderly-first)
    #   2021-07  一般 18-64 broad rollout begins
    #   2022-01  3回目 (booster) rollout for elderly
    #   2022-09  Omicron 2価ワクチン (bivalent)
    #   2023-09  秋開始接種 (annual fall campaign)
    wave_epochs:
      - name: initial_rollout        # 医療従事者 + 高齢者優先接種
        start: "2021-04-01"
        end: "2021-09-30"
        age_weight:
          "18-49": 0.05
          "50-64": 0.15
          "65-99": 0.55
        monthly_curve: {"4": 0.05, "5": 0.20, "6": 0.30, "7": 0.20, "8": 0.15, "9": 0.10}
      - name: primary_series_ramp    # 一般成人 broad rollout
        start: "2021-10-01"
        end: "2022-03-31"
        age_weight:
          "18-49": 0.40
          "50-64": 0.30
          "65-99": 0.15
        monthly_curve: {"10": 0.20, "11": 0.30, "12": 0.20, "1": 0.15, "2": 0.10, "3": 0.05}
      - name: booster_wave_1         # 3回目 + Omicron 2価
        start: "2022-09-01"
        end: "2023-01-31"
        age_weight:
          "18-49": 0.20
          "50-64": 0.25
          "65-99": 0.20
        monthly_curve: {"9": 0.10, "10": 0.30, "11": 0.30, "12": 0.20, "1": 0.10}
      - name: annual_maintenance     # 秋開始接種 (fall campaign, 2023+)
        start: "2023-09-01"
        end: "2028-12-31"
        age_weight:
          "18-49": 0.10
          "50-64": 0.15
          "65-99": 0.10
        monthly_curve: {"9": 0.15, "10": 0.35, "11": 0.30, "12": 0.15, "1": 0.05}
    coverage_by_age_sex:
      "18-49": {M: 0.70, F: 0.74}
      "50-64": {M: 0.82, F: 0.84}
      "65-99": {M: 0.90, F: 0.92}
  pneumococcal_ppsv23:
    cvx: "33"
    min_age: 65
    frequency: once
    administration: {route: IM, dose_ml: 0.5}
    available_from: "2014-10-01"
    # 2026-08-30: bumped 0.40/0.42 → 0.45/0.47 so the emitted lifetime rate
    # at 65+ lands near the 40%/42% MHLW target (p=1000 seed=500 JP audit
    # baseline was 35.8%/38.2%, ~4pp under-shoot after care-seeking + min_age
    # eligibility filtering).
    coverage_by_age_sex:
      "65-99": {M: 0.45, F: 0.47}

  # === Pediatric routine schedule (定期予防接種 + 任意接種) — Issue #917 ===
  # Sources: MHLW 予防接種スケジュール (2024) / 日本小児科学会 推奨接種スケジュール.
  # Coverage reflects the program: 定期接種 (routine, 95-99% typical) vs
  # 任意接種 (voluntary, 30-60% typical), encoded in coverage_by_sex.
  # `pediatric_series` iterates per-dose age windows measured from date_of_birth.
  # Engine gates each dose against [available_from, as_of] AND against the
  # patient's birthDate → doses whose target window falls outside the sim's
  # available range (patient already past the window at sim start, or window
  # extends past as_of) are skipped without consuming RNG, so adult vaccine
  # RNG cascade is preserved (per feedback_rng_neutral_additive_field).
  # Coverage is per-dose, per-sex (routine pediatric coverage is essentially
  # sex-invariant; sex slot preserves the existing engine's dispatch shape).
  #
  # `coverage_by_sex` (Issue #3288) は各回の周辺接種率 (その回を接種した子の
  # 割合)。engine は 1..k-1 回目を接種した子にだけ k 回目を抽選し、その確率を
  # coverage_k / coverage_{k-1} とする (`engine.conditional_dose_coverage`)。
  # k 回接種した子の割合は coverage_k、シリーズ完了率は最終回の値になる
  # (修正前は各回の値を条件付き確率として掛け合わせており、四種混合 4 回完了は
  # 0.98 x 0.97 x 0.96 x 0.94 = 0.86)。シリーズの後の回の値は前の回を超えない。
  # 出典: 厚生労働省「定期の予防接種実施者数」(平成６年法律改正後 実施率の推移)
  # 令和５年度 実施率 (B)/(A): DPT-IPV 1回 103.2% / 2回 104.5% / 3回 105.6% /
  # 追加 93.7%、麻しん風しん 1期 94.9% / 2期 92.0%、日本脳炎 1期初回 101.3% /
  # 98.8% / 1期追加 99.4% / 2期 105.7%、結核 (BCG) 97.1%、Hib 96.4% / 96.7% /
  # 96.9% / 追加 94.4%、小児用肺炎球菌 96.3% / 96.7% / 96.9% / 追加 94.0%、
  # 水痘 95.4% / 88.1%、B型肝炎 95.6% / 96.0% / 95.2%、ロタ 1回 (1価 61.6% +
  # 5価 32.6%) 94.2% / 完了 (参考 ①+②) 93.6%。令和６年度は五種混合
  # (DPT-IPV-Hib) 導入の移行年で製剤ごとに分かれるため令和５年度を用いる。
  # 実施率は年度の新規対象人口に対する全年齢の接種者数のため 100% を超える
  # ことがある (同表 注8)。100% を超える回 (四種混合 1-3 回、日本脳炎) は
  # 接種率の上限を与えないので設定値を据え置く。後の回の実施率が前の回を
  # 上回る場合 (Hib・肺炎球菌・B型肝炎の 2-3 回) は前の回の値を用いる。
  # おたふくかぜ (任意接種) は同表に無いため、修正前の 2 回目の実効値
  # (0.35 x 0.28 = 0.098) を保つ。
  #
  # Verified against MHLW 予防接種法施行令 2024, revised 2024-04.
  pediatric_bcg:
    cvx: "19"
    min_age: 0
    frequency: pediatric_series
    administration: {route: PERCUTANEOUS}   # 管針法、上腕外側 (固定の接種量なし)
    available_from: "2000-01-01"
    doses:
      - dose_number: 1
        age_days_min: 152    # 生後 5 か月
        age_days_max: 213    # 生後 7 か月
        coverage_by_sex: {M: 0.971, F: 0.971}
  # `min_interval_days` (Issue #3001): 同じシリーズの前回接種からの最小間隔
  # (日)。予防接種実施規則 / 定期接種実施要領の接種間隔による。
  # `min_interval_after_dose` は前回以外の回から数える場合の起点の回
  # (B型肝炎3回目は1回目から139日以上)。`max_interval_days` (任意、
  # Issue #3006) はその起点からの最大間隔 (日本脳炎 第1期初回 2回目)。近くの受診への接種日の寄せは
  # この間隔を守り、同じシリーズの2回分を同じ受診に重ねない。
  # `catch_up_max_age_days` (Issue #3282): 接種が遅れた子にキャッチアップ受診
  # (pediatric_schedule.yaml `catch_up: true`) で次の回を接種する上限日齢。
  # 予防接種法施行令の定期接種対象年齢による (厚生科学審議会予防接種・ワクチン
  # 分科会 予防接種基本方針部会 第58回 資料1「疾病分類・定期接種の対象について」):
  # 「ジフテリア・百日せき・急性灰白髄炎（ポリオ）・破傷風 第１期：生後２月から
  # 生後90月に至るまで」「日本脳炎 第１期：生後６月から生後90月に至るまで」
  # → 2737 日 (生後90月未満)。麻しん・風しん第1期 (生後24月まで)、水痘 (生後36月
  # まで)、Hib・小児の肺炎球菌 (生後60月まで、開始が遅れると接種回数が減る)、
  # B型肝炎・BCG (1歳まで)、ロタウイルスは就学前・思春期の受診では対象外のため
  # 設定しない。
  pediatric_dtap_ipv:
    cvx: "106"
    min_age: 0
    frequency: pediatric_series
    administration: {route: SC, dose_ml: 0.5}
    available_from: "2012-11-01"    # 四種混合 (DTaP-IPV) 導入
    birth_until: "2024-01-31"    # 2024-02-01 以降出生児は五種混合 (下の pediatric_dtap_ipv_hib)
    catch_up_max_age_days: 2737
    doses:
      - dose_number: 1
        age_days_min: 90     # 生後 3 か月
        age_days_max: 120    # 生後 4 か月
        coverage_by_sex: {M: 0.98, F: 0.98}
      - dose_number: 2
        min_interval_days: 20    # 20日以上
        age_days_min: 121    # 生後 4 か月
        age_days_max: 150    # 生後 5 か月
        coverage_by_sex: {M: 0.97, F: 0.97}
      - dose_number: 3
        min_interval_days: 20    # 20日以上
        age_days_min: 151    # 生後 5 か月
        age_days_max: 210    # 生後 7 か月
        coverage_by_sex: {M: 0.96, F: 0.96}
      - dose_number: 4
        min_interval_days: 182    # 初回3回目から6か月以上
        age_days_min: 365    # 1歳
        age_days_max: 545    # 1歳半 (18か月)
        coverage_by_sex: {M: 0.937, F: 0.937}
  # Issue #3301: 五種混合 (DTaP-IPV-Hib、CVX 120 "DTaP-Hib-IPV"、CDC IIS CVX
  # 一覧で Active を確認) は 2024-04 から第1期の定期接種に使われ、四種混合 +
  # 単独 Hib に代わる。実施要領「第2 各論 1 (1)」: 初回接種は生後2月から生後7月
  # に至るまでを標準的な接種期間として 20 日以上 (標準的には 20 日から 56 日
  # まで) の間隔で3回、追加接種は初回接種終了後 6 月以上 (標準的には 6 月から
  # 18 月まで) の間隔で 1 回 (五種混合では Hib 単独のような開始月齢による回数の
  # 減少は不要)。同 第1 総論 (15): 初回接種は原則として同一種類のワクチンを
  # 必要回数接種する。そこで series は出生日で分ける: 2024-02-01 以降出生児
  # (第1回が生後2月 = 2024-04-01 以降) は五種混合、それ以前の出生児は従来の
  # 四種混合 + Hib (`birth_from` / `birth_until`)。接種率は令和5年度 実施率の
  # 四種混合と Hib の低い方 (Hib 96.4% / 追加 DPT-IPV 93.7%) を用いる。令和6年度
  # の五種混合の実施率表は確認していない。
  # 出典: 厚生労働省「5種混合ワクチン」
  # (https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/kenkou/kekkaku-kansenshou/yobou-sesshu/vaccine/dpt-ipv-hib/index.html)
  # 「2024年4月以降、1期では5種混合ワクチンを用いた接種をします」、
  # 定期接種実施要領 (令和7年9月30日改正) (https://www.mhlw.go.jp/content/001471610.pdf)。
  pediatric_dtap_ipv_hib:
    cvx: "120"
    min_age: 0
    frequency: pediatric_series
    administration: {route: SC, dose_ml: 0.5}
    available_from: "2024-04-01"    # 第1期に五種混合を使用
    birth_from: "2024-02-01"
    catch_up_max_age_days: 2737
    doses:
      - dose_number: 1
        age_days_min: 60     # 生後 2 か月
        age_days_max: 90
        coverage_by_sex: {M: 0.964, F: 0.964}
      - dose_number: 2
        min_interval_days: 20    # 20日以上
        age_days_min: 91
        age_days_max: 120
        coverage_by_sex: {M: 0.964, F: 0.964}
      - dose_number: 3
        min_interval_days: 20    # 20日以上
        age_days_min: 121
        age_days_max: 150
        coverage_by_sex: {M: 0.964, F: 0.964}
      - dose_number: 4
        min_interval_days: 182    # 初回3回目から6か月以上
        age_days_min: 365    # 1歳 (初回終了後 6 から 18 か月の間隔)
        age_days_max: 545    # 1歳半 (18か月)
        coverage_by_sex: {M: 0.937, F: 0.937}
  # Issue #3301: 第2期は第1期の接種歴によらず、小学校就学前1年間の者に1回
  # (実施要領「第2 各論 2 (1) イ」: 5歳以上7歳未満で小学校就学の始期に達する日の
  # 1年前の日から当該始期に達する日の前日までの間にある者に1回、令和7年9月30日
  # 改正)。第1期を受けなかった子も第2期の対象なので、2回目は 1回目の有無に
  # 依存しない (`independent_of_previous`)。1回目を受けた子の2回目の確率は
  # 2回目の周辺接種率 (0.92) が保たれるよう `independent_dose_coverage` で決め、
  # 第1期を受けなかった子の接種率 `coverage_if_previous_missed` は出典のない
  # 仮定値 (0.5)。dose_number は接種回数でなく期の位置 (第2期 = 2)。
  pediatric_mr:
    cvx: "04"
    min_age: 0
    frequency: pediatric_series
    administration: {route: SC, dose_ml: 0.5}
    available_from: "2000-01-01"
    doses:
      - dose_number: 1
        age_days_min: 365    # 1歳
        age_days_max: 730    # 2歳
        coverage_by_sex: {M: 0.949, F: 0.949}
      - dose_number: 2
        independent_of_previous: true
        coverage_if_previous_missed: 0.5   # 仮定値 (出典なし)、周辺接種率は 0.92 のまま
        min_interval_days: 27    # 注射生ワクチンの間隔 27日以上
        age_days_min: 1825   # 5歳 (就学前)
        age_days_max: 2555   # 7歳
        coverage_by_sex: {M: 0.92, F: 0.92}
  pediatric_varicella:
    cvx: "21"
    min_age: 0
    frequency: pediatric_series
    administration: {route: SC, dose_ml: 0.5}
    available_from: "2014-10-01"    # 定期化
    doses:
      - dose_number: 1
        age_days_min: 365    # 1歳
        age_days_max: 455    # 15か月
        coverage_by_sex: {M: 0.954, F: 0.954}
      - dose_number: 2
        min_interval_days: 90    # 1回目から3か月以上
        age_days_min: 456    # 15か月+
        age_days_max: 730    # 2歳
        coverage_by_sex: {M: 0.881, F: 0.881}
  pediatric_je:
    cvx: "129"
    min_age: 0
    frequency: pediatric_series
    administration: {route: SC, dose_ml: 0.5, dose_ml_by_age: [{max_age_months: 35, ml: 0.25}]}   # 3歳未満 0.25 mL
