# 配偶関係 (性・年齢階級別) と、それに条件付けた成人の緊急連絡先の続柄 (Issue #3189)。
#
# 配偶関係は `adult_age_min` 以上で初めて activate されたときに、性・年齢階級の
# 行から 1 回だけ選び、PersonRecord に保持する。コードは HL7 v3-MaritalStatus
# (S 未婚, M 有配偶, W 死別, D 離別)。値は人口 (重み、読み込み時に正規化)。
#
# 出典: 総務省統計局 令和2年国勢調査 人口等基本集計 第4-1表「男女，年齢(各歳)，
# 配偶関係，国籍総数か日本人別人口及び平均年齢(15歳以上)」全国・国籍総数
# (e-Stat statInfId 000032142474)。各歳の人口を年齢階級ごとに合算し、配偶関係
# 「不詳」は除く。15-17 歳は使わない。
metadata:
  kind: reference
  name: marital_status
  source: 総務省統計局 令和2年国勢調査 人口等基本集計 第4-1表
  verified: "2026-11-10"

