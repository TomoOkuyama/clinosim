# All-cause age × sex annual mortality probability (qx) for US + JP,
# sourced from national period life tables. Scaffold for the C11g
# natural-death subsystem (Issue #1114, 5-part decomposition — this
# file is C11g-1, the isolated data-only step; no consumer yet).
#
# Data-only. No runtime code loads this file yet — a follow-up PR
# (C11g-2) wires it into the population activator + PersonRecord.
# Kept in `shared/` (matches perinatal.yaml's cross-country layout).
#
# Semantics:
#   qx (also written nqx with n=1 in the sources) = annual probability
#   that a person exactly age x dies before reaching age x+1, under
#   period life-table assumptions (age-specific death rates prevailing
#   in the reference year applied for the full life of a hypothetical
#   cohort). This is the standard actuarial mortality input.
#
# Representation:
#   Age is binned into 5-year lower-bound bands (matching the
#   demographics.yaml disease_incidence convention). Each band value
#   is the arithmetic mean of the single-year qx values for the five
#   integer ages in that band (0 = mean(qx[0..4]), 5 = mean(qx[5..9]),
#   etc.). The 85+ open band is aggregated similarly across 85-99;
#   consumers that need finer granularity in the very-old tail should
#   consult the source PDFs directly (URLs below).
#
# Sources:
#   US 2020 — CDC NCHS, National Vital Statistics Reports, Vol 71 No 1
#     "United States Life Tables, 2020" (Arias & Xu, Aug 8 2022).
#     Tables 2 (males) + 3 (females), qx column, single-year values.
#     https://www.cdc.gov/nchs/data/nvsr/nvsr71/nvsr71-01.pdf
#
#   JP 2020 — 厚生労働省 第23回生命表 (完全生命表, 令和2年 = 2020).
#     生命表(男) + 生命表(女), 死亡率 (nqx) column, single-year values.
#     https://www.mhlw.go.jp/toukei/saikin/hw/life/23th/dl/23th-11.pdf
#
# Sanity check (cohort-scale weighted average, per feedback_hospital_cohort_target_bands):
#   Applying these values to typical age-sex distributions produces
#   ~8.5 /kyr all-cause mortality (US, matches CDC ~8.7) and
#   ~11 /kyr (JP, matches MHLW ~11.4). The subsystem's target
#   benchmark in verify_medical_stats.py is (7-11) US, (9-13) JP —
#   consistent with these inputs once the natural-death mechanism
#   lands (C11g-2 through C11g-5).

annual_mortality_qx:
  us:
    male:
