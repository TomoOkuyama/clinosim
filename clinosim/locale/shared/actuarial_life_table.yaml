# Provenance metadata — used by future validators to detect stale
# data. When either national statistical office publishes a newer
# life table (JP 完全生命表 every 5 years, US NCHS annually), this
# block gets bumped along with the values above.
provenance:
  us:
    source: "CDC NCHS NVSR 71-01 (2022)"
    reference_year: 2020
    document: "https://www.cdc.gov/nchs/data/nvsr/nvsr71/nvsr71-01.pdf"
    tables_consulted: ["Table 2 (males)", "Table 3 (females)"]
  jp:
    source: "厚生労働省 第23回生命表 (完全生命表)"
    reference_year: 2020
    document: "https://www.mhlw.go.jp/toukei/saikin/hw/life/23th/dl/23th-11.pdf"
    tables_consulted: ["生命表(男) 8-9頁", "生命表(女) 10-11頁"]
