# Age threshold (inclusive) below which head-circumference is routinely
# measured. WHO / AAP guidance stops routine head-circ at 3 y.
head_circumference_max_age_years: 3

# Age (inclusive lower bound) at which the adult stored-profile path
# takes over from the pediatric growth-chart lookup. Below this age,
# emit uses the pediatric_growth table; at/above this age, emit uses
# `patient.height_cm` / `patient.weight_kg` / `patient.bmi`.
adult_path_min_age_years: 18
