# Anthropometric reference values (Issue #946).
#
# Height / weight / BMI / head-circumference reference tables used by
# clinosim/modules/output/fhir_r4/labs/anthropometrics.py to emit body
# measurement Observations (LOINC 8302-2, 29463-7, 39156-5, 8287-5) on
# every encounter.
#
# Design notes:
#
# - **Adults (age >= 18)** — clinosim already samples `PatientProfile.
#   height_cm` / `.weight_kg` / `.bmi` at Layer 1 (population/engine.py
#   `_generate_household_members`), using country-specific means from
#   locale/{us,jp}/demographics.yaml `physiology:` section. The FHIR emit
#   path uses those stored per-patient values directly; the yaml below
#   only supplies **clamp bounds** (physiological plausibility) and the
#   per-encounter weight-drift standard deviation.
#
# - **Pediatric (age < 18)** — adult BMI distributions are not
#   appropriate for children; a per-age-per-sex p50 growth chart is used
#   to derive height, then weight = BMI(age) × (height / 100)^2. The
#   tables below carry median (p50) values only — synthetic patients
#   land on the population median with a small per-encounter noise
#   applied. Sources:
#     - WHO Child Growth Standards (< 5 y): median height/weight/head-
#       circumference by month-of-age × sex. clinosim buckets by whole
#       year for compactness (mid-year median).
#     - CDC Growth Charts (2-20 y, US): median stature-for-age and
#       weight-for-age.
#     - MHLW 乳幼児身体発育調査 2010 / 平成22年 学校保健統計調査 (JP):
#       per-age p50 stature, weight, head-circumference. The MHLW ranges
#       are similar to WHO ± 1-2 cm / kg through school age; a single
#       JP-specific table is provided below.
#
# - **Head circumference** — emitted only for patients aged <= 3 y
#   (WHO/AAP guidance stops routine head-circ measurement at 3 y unless
#   there is a specific indication).
#
# - **BMI derivation** — always computed at emit time from the emitted
#   height and weight (Issue #946 acceptance criterion: BMI and its
#   components must be internally consistent). The stored
#   `patient.bmi` is used to derive weight for adults so the emitted
#   triple (height, weight, BMI) remains coherent with the patient
#   profile.

metadata:
  name: anthropometric_reference
  description: Reference height / weight / BMI / head-circumference for FHIR anthropometric Observations.
  sources:
    - "WHO Child Growth Standards (0-5 y): https://www.who.int/tools/child-growth-standards"
    - "CDC Growth Charts (2-20 y, US, 2000): https://www.cdc.gov/growthcharts/cdc_charts.htm"
    - "MHLW 乳幼児身体発育調査 2010 (JP < 6 y): https://www.mhlw.go.jp/toukei/list/73-22.html"
    - "文部科学省 学校保健統計調査 令和4年度 (JP 6-17 y): https://www.mext.go.jp/b_menu/toukei/chousa05/hoken/"

# Physiological clamps applied to every emitted value (defence against
# outlier profiles / floating-point noise). Values outside these bounds
# clip to the nearest bound rather than emit an implausible datum.
clamps:
  height_cm:
    min: 40.0    # WHO 0-month p3 length
    max: 210.0   # >>99.9th percentile adult
  weight_kg:
    min: 2.0     # ≥ term-neonate low bound
    max: 200.0   # >>99.9th percentile adult
  bmi:
    min: 10.0    # severe wasting bound
    max: 60.0    # severe obesity bound
  head_circumference_cm:
    min: 30.0    # neonate low bound
    max: 60.0    # adult high bound

# Per-encounter measurement noise (kg for weight, cm for height). Height
# is fixed per adult patient (SHA256 sub-seed) — no per-encounter noise;
# weight varies encounter-to-encounter within a plausible weekly-drift
# range. Standard deviations chosen to reflect real EHR flowsheet noise
# without crossing clinical grade boundaries.
per_encounter_noise:
  weight_kg_sd: 0.6           # ± ~1.2 kg 95% interval — day-to-day fluid shift
  head_circumference_cm_sd: 0.1  # measurement-technique noise only

# Pediatric growth-chart medians (p50) by age (whole years) and sex.
# Height in cm, weight in kg, head_circumference_cm optional (present
# only for ages where the measurement is routinely captured).
