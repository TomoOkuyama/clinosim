# Chemotherapy regimen library — cycle-based scheduling (Issue #957 Tier-3-A).
#
# Purpose: real chemo regimens are cycle-based (FOLFOX q14d, CHOP q21d,
# LHRH q28d, etc.), not continuous daily therapy. Pre-#957 the simulator
# only carried chemo drugs as chronic daily MedicationRequests — the
# temporal signature was flat and any consumer computing "chemo cycles
# received in the year" got nonsense. This YAML declares real cycle
# intervals + per-cycle Day-1 drugs so the healthcare calendar can emit
# ``chemo_visit`` events at the right cadence.
#
# Slice-1 scope: schedule + Encounter + Procedure emit. Per-cycle
# MedicationRequest / MedicationAdministration remains a follow-up
# slice (kept out of this MVP to bound scope). Oral daily chemo
# (Capecitabine, Tamoxifen, Anastrozole, Bicalutamide) continues to
# flow through ``chronic_medications.yaml`` unchanged — those ARE
# daily home meds, not cycle drugs.
#
# Cadence sources: NCCN 2024 guidelines, JSCO practice guidelines,
# JCOG protocol handbooks (adjuvant colon / lung / breast / prostate).

# ---------------------------------------------------------------------------
# Regimen library. Each regimen names its cycle interval (days), the number
# of cycles in a typical course, and the drugs administered on Day 1 of the
# cycle. Drugs infused on Days 2+ of the same cycle (e.g. FOLFOX's 46-h
# 5-FU infusion) are represented as a single Day-1 entry — the MedicationAdmin
# slice will expand them into per-day records.
regimens:
  FOLFOX:                                # colorectal adjuvant
    cycle_interval_days: 14
    course_cycles: 12                    # ~6 months adjuvant
    cycle_orders:
      - {drug: "Oxaliplatin",  drug_ja: "オキサリプラチン",  dose: "85mg/m2",                        route: "IV"}
      - {drug: "Leucovorin",   drug_ja: "ロイコボリン",      dose: "400mg/m2",                       route: "IV"}
      - {drug: "5-FU",         drug_ja: "フルオロウラシル",  dose: "400mg/m2 bolus + 2400mg/m2/46h", route: "IV"}
  CarboPem:                              # lung adjuvant / advanced
    cycle_interval_days: 21
    course_cycles: 4
    cycle_orders:
      - {drug: "Carboplatin",  drug_ja: "カルボプラチン",    dose: "AUC5",     route: "IV"}
      - {drug: "Pemetrexed",   drug_ja: "ペメトレキセド",    dose: "500mg/m2", route: "IV"}
  Trastuzumab_q3w:                       # breast HER2+ maintenance
    cycle_interval_days: 21
    course_cycles: 18                    # 1 year
    cycle_orders:
      - {drug: "Trastuzumab",  drug_ja: "トラスツズマブ",    dose: "6mg/kg",   route: "IV"}
  LHRH_q28d:                             # prostate ADT depot
    cycle_interval_days: 28
    course_cycles: 24                    # 2 years continuous
    cycle_orders:
      - {drug: "Leuprorelin",  drug_ja: "リュープロレリン",  dose: "3.75mg",   route: "SC"}

  # Issue #1280 sub-D: additional regimens using the chemo drugs
  # registered by #1303 (Gemcitabine / Irinotecan / Nab-paclitaxel /
  # Temozolomide / BCG).
  GemNabP:                               # pancreatic first-line (Von Hoff protocol)
    # Real Von Hoff MPACT schedule: nab-paclitaxel 125 mg/m2 IV + gemcitabine
    # 1000 mg/m2 IV Day 1, 8, 15 of a 28-day cycle. Simplified here as one
    # Day-1 chemo_visit per cycle (same pattern FOLFOX/CarboPem use — the
    # per-day expansion is a future MedicationAdmin slice).
    cycle_interval_days: 28
    course_cycles: 6                     # ~6 months first-line palliative
    cycle_orders:
      - {drug: "Nab-paclitaxel",  drug_ja: "ナブパクリタキセル",  dose: "125mg/m2",   route: "IV"}
      - {drug: "Gemcitabine",     drug_ja: "ゲムシタビン",         dose: "1000mg/m2",  route: "IV"}
  BCG_intravesical:                      # NMIBC adjuvant induction (SWOG 8507)
    cycle_interval_days: 7               # weekly instillation
    course_cycles: 6                     # 6-week induction; maintenance q3mo is out of scope
    cycle_orders:
      - {drug: "BCG", drug_ja: "BCG", dose: "1 vial (81mg TICE / 27mg Connaught)", route: "intravesical"}
  Temozolomide_stupp:                    # glioblastoma adjuvant (Stupp EORTC 22981)
    # Adjuvant Temozolomide 150-200 mg/m2 PO daily × 5 days q28d × 6 cycles
    # after concurrent chemoradiation. Sim emits one Day-1 chemo_visit per
    # 28-day cycle (same simplification as GemNabP above).
    cycle_interval_days: 28
    course_cycles: 6
    cycle_orders:
      - {drug: "Temozolomide", drug_ja: "テモゾロミド", dose: "150mg/m2 PO daily x 5 days", route: "PO"}

# ---------------------------------------------------------------------------
# Per-cancer-code assignment table. For a chronic-carrier of a cancer code
# the scheduler picks one regimen (or none) via a per-patient sub-RNG so
# YAML edits + cohort re-runs stay deterministic and patient-scoped.
# Probabilities are the share of chronic carriers with an ACTIVE regimen
# (majority of carriers are in surveillance-only mode without active chemo).
# Sum per code must be <= 1.0; residual mass is "no active regimen this year".
by_cancer:
  C18: [{regimen: FOLFOX,           probability: 0.25}]  # adjuvant chemo ~25 % of colon-cancer chronic carriers
  C34: [{regimen: CarboPem,         probability: 0.20}]  # advanced NSCLC platinum doublet
  C50: [{regimen: Trastuzumab_q3w,  probability: 0.15}]  # HER2+ ~15 % of BC, on trastuzumab maintenance
  C61: [{regimen: LHRH_q28d,        probability: 0.35}]  # ADT majority of C61 chronic carriers

  # Issue #1280 Sub-B: expand `by_cancer` to two additional upper-GI
  # cancers whose real first-line regimen is well-established and
  # reuses drugs already in the sim's chemo catalog (Oxaliplatin +
  # Leucovorin + 5-FU). Adding these without introducing new drug
  # registrations keeps scope tight while closing the "cancer without
  # oncology footprint" gap for C15/C16 chronic carriers.
  #
  # - C15 esophageal (SCC + adenocarcinoma): FOLFOX perioperative
  #   is a JCOG-1109 arm (NExT trial DCF is more common in JP, but
  #   FOLFOX is a valid alternative and reuses existing drugs).
  #   Active-regimen prevalence ~20 % of chronic carriers.
  # - C16 gastric (adenocarcinoma): FOLFOX is a common perioperative
  #   or first-line palliative regimen (JCOG-1509 / FLOT is an
  #   alternative). Active-regimen prevalence ~20 % of chronic
  #   carriers (majority are in surveillance-only post-curative
  #   resection).
  #
  C15: [{regimen: FOLFOX,           probability: 0.20}]  # esophageal perioperative FOLFOX
  C16: [{regimen: FOLFOX,           probability: 0.20}]  # gastric adjuvant / palliative FOLFOX

  # Issue #1280 sub-D: regimen wiring for the remaining C-chapter
  # cancers, using drugs registered by #1303. Real first-line
  # protocols cited alongside probability:
  #
  # - C25 pancreatic:  GemNabP (Von Hoff MPACT protocol) — real
  #   US first-line for metastatic pancreatic ~40 %; sim's chronic
  #   carriers include both palliative and post-Whipple surveillance,
  #   so cohort-scale active-regimen prevalence is lower.
  # - C67 bladder:     BCG intravesical (SWOG 8507 induction) —
  #   ~35-40 % of NMIBC (Ta / T1 / CIS) receive BCG adjuvant post-
  #   TURBT; muscle-invasive C67 gets systemic GC (not modelled
  #   here — Cisplatin not yet registered).
  # - C71 glioma:      Temozolomide adjuvant (Stupp EORTC 22981) —
  #   ~60 % of GBM (most C71 chronic carriers post-diagnosis).
  #
  # C22 hepatocellular remains deferred: real first-line is
  # Atezolizumab + Bevacizumab (imAbev IMbrave150 trial),
  # neither yet registered. Sorafenib / Lenvatinib chronic
  # oral TKIs already flow through `chronic_medications.yaml`
  # for C22, so C22 carriers are not fully untreated in the sim.
  C25: [{regimen: GemNabP,           probability: 0.20}]  # pancreatic first-line
  C67: [{regimen: BCG_intravesical,  probability: 0.20}]  # NMIBC adjuvant induction
  C71: [{regimen: Temozolomide_stupp, probability: 0.35}]  # GBM adjuvant Stupp

# ---------------------------------------------------------------------------
# Procedure code emitted on each chemo_visit encounter. Same code for all
# regimens in slice 1 (the code identifies "chemotherapy administration",
# not the specific regimen; the specific drugs would live on the Encounter's
# MedicationAdministration slice — future work).
procedure:
  jp_code: "G003"                   # JP 医科診療報酬点数表: 抗悪性腫瘍剤局所持続注入
  jp_display: "抗悪性腫瘍剤注入"
  us_code: "96413"                  # US CPT: Chemotherapy administration, IV infusion, first hour
  us_display: "Chemotherapy administration, IV infusion, up to 1 hour"
  duration_minutes: 60              # infusion duration; encounter length includes prep/monitor

# ---------------------------------------------------------------------------
# Encounter reason strings emitted on Encounter.reasonCode / chief complaint.
encounter:
  visit_reason:
    en: "Chemotherapy infusion"
    ja: "化学療法・点滴投与"
  department: "oncology_infusion"   # falls back to internal_medicine when the hospital lacks this dept
