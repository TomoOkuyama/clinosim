# Chief-complaint EN → JA translations (Phase 3.β.1, #1809 follow-up).
#
# Pragmatic bridge table until disease YAMLs author ``chief_complaint:
# {en, ja}`` dict-form everywhere. Consulted at FHIR emit time by
# ``fhir_r4/labs/imaging_study.py::_localize_chief_complaint`` so JP
# output on EN-authored chief complaints shows the Japanese display.
#
# Design (Phase 3.β.1):
#   - Keyed by the exact EN phrase (case-sensitive); matches the
#     retired ``_CHIEF_COMPLAINT_JA`` dict verbatim.
#   - Multi-locale ready: adding a third locale (``zh``, ``ko``, …)
#     is a column add per row, no code change.
#   - JA display SoT lives here; a reviewer updating a translation
#     touches one row of one file.

