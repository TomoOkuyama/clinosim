# --- Oncology follow-up (Issue #943) --------------------------------------
# Cancer follow-up cadence per NCCN / JSCO / JCOG survivorship guidelines
# (varies by cancer type; 3 months during active surveillance is a common
# ceiling). Tumor markers listed as labs are aspirational — most are not
# yet in the reference-range dictionaries; the encounter emits regardless.

C18:  # Colon cancer
  visit_reason:
    en: "Colon cancer follow-up, tumor marker (CEA), symptom review"
    ja: "大腸がん術後・治療後フォローアップ・腫瘍マーカー（CEA）・症状評価"
  follow_up_interval_months: 3
  labs: []
  labs_annual: [CEA, CA19_9]
  vitals: [systolic_bp, diastolic_bp, heart_rate, weight]
  prescriptions_renewed: true
  radiation_therapy_eligible: true    # Issue #957 slice 3
  visit_duration_minutes: 20
  # Phase 4e horizontal — NCCN v3.2024 Colon Cancer §COL-E: colonoscopy
  # annually post-dx (CPT 45378, SNOMED 73761001 verified 2026-10-21 via
  # tx.fhir.org $lookup against SCT 20250201 Intl Edition).
  procedures:
    - {code: "45378", snomed: "73761001", name_en: "Colonoscopy", name_ja: "大腸内視鏡検査", frequency: "annual"}

C22:  # Liver cancer
  visit_reason:
    en: "Hepatocellular carcinoma follow-up, tumor markers (AFP, PIVKA-II)"
    ja: "肝細胞がんフォローアップ・腫瘍マーカー（AFP, PIVKA-II）・肝機能評価"
  follow_up_interval_months: 3
  labs: [AST, ALT]
  labs_quarterly: [AFP]
  vitals: [systolic_bp, diastolic_bp, weight]
  prescriptions_renewed: true
  radiation_therapy_eligible: true    # Issue #957 slice 3
  visit_duration_minutes: 20
  # Phase 4e horizontal — NCCN v2.2024 HCC §HCC-G: abdominal US. Phase 4e
  # shipped as `annual` with semi-annual noted as deferred; Phase 4f lands
  # the `semi_annual` frequency and this entry is upgraded. CPT 76700,
  # SNOMED 45036003 verified 2026-10-21 via tx.fhir.org $lookup against
  # SCT 20250201 Intl Edition.
  procedures:
    - {code: "76700", snomed: "45036003", name_en: "Abdominal ultrasound", name_ja: "腹部超音波検査", frequency: "semi_annual"}

C34:  # Lung cancer
  visit_reason:
    en: "Lung cancer follow-up, symptom review, imaging surveillance"
    ja: "肺がんフォローアップ・症状評価・画像経過観察"
  follow_up_interval_months: 3
  labs: []
  labs_quarterly: [CEA]
  vitals: [systolic_bp, heart_rate, spo2, respiratory_rate]
  prescriptions_renewed: true
  radiation_therapy_eligible: true    # Issue #957 slice 3
  visit_duration_minutes: 20
  # Phase 4e horizontal — NCCN v3.2024 NSCLC §FOLL-A: CT chest annually
  # post-dx. CPT 71250, SNOMED 169069000 verified 2026-10-21 via
  # tx.fhir.org $lookup against SCT 20250201 Intl Edition.
  procedures:
    - {code: "71250", snomed: "169069000", name_en: "CT of chest", name_ja: "胸部 CT", frequency: "annual"}

C50:  # Breast cancer — female-dominant but ~1% male incidence (Issue #957);
      # follow-up schedule shared (same tumor markers, same hormonal-therapy
      # cadence for the majority ER+ subtype in both sexes).
  visit_reason:
    en: "Breast cancer follow-up, tumor marker (CA15-3), hormonal therapy review"
    ja: "乳がんフォローアップ・腫瘍マーカー（CA15-3）・ホルモン療法評価"
  follow_up_interval_months: 3
  labs: []
  labs_quarterly: [CA15_3]
  vitals: [systolic_bp, diastolic_bp, weight]
  prescriptions_renewed: true
  radiation_therapy_eligible: true    # Issue #957 slice 3
  visit_duration_minutes: 20
  # Phase 4e (#1701 partial) — NCCN v4.2024 Breast Cancer survivorship:
  # mammography annually post-dx. First C50 cancer family to pilot the
  # ``annual`` frequency semantics; horizontal extension to C34 chest CT,
  # C18 colonoscopy, C16 EGD, C22 abdominal US tracked under #1701 残.
  procedures:
    # Mammography — SNOMED 71651007 (verified 2026-10-21 via tx.fhir.org
    # $lookup against SCT 20250201 Intl Edition).
    - {code: "77067", snomed: "71651007", name_en: "Mammography", name_ja: "乳房 X 線撮影（マンモグラフィー）", frequency: "annual"}

