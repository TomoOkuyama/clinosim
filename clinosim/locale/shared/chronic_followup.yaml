# --- Obstetric follow-up (Issue #943) -------------------------------------
# Prenatal visits per ACOG / JSOG guidance (monthly early, more frequent
# late trimester). We model as monthly across the sim window; a follow-up
# Issue will introduce trimester-conditional cadence + delivery event +
# newborn Patient generation.

Z34:  # Encounter for supervision of normal pregnancy (female 20-44 per age/sex gate)
  visit_reason:
    en: "Prenatal check-up, fetal wellbeing, maternal vitals"
    ja: "妊婦健診・胎児健常評価・妊婦バイタルサイン"
  follow_up_interval_months: 1
  labs: []
  labs_quarterly: [Hb, Glucose]
  vitals: [systolic_bp, diastolic_bp, heart_rate, weight]
  prescriptions_renewed: true
  visit_duration_minutes: 25

Z39:  # Encounter for maternal postpartum care (Issue #957 Tier-3-B Slice 2).
      # Scheduled ×2 by ``_perinatal_delivery_events`` at ~1 week and ~4 weeks
      # post-delivery (JSOG / ACOG standard postpartum follow-up intervals).
      # Female 20-44 by the same age/sex context that produced the Z34
      # prenatal window; no separate sex-gate needed (only Z34-carriers
      # can reach this event).
  visit_reason:
    en: "Postpartum follow-up: wound check, breastfeeding support, mood screening"
    ja: "産後フォローアップ・創部確認・授乳支援・産後うつスクリーニング"
  follow_up_interval_months: 0    # event-scheduled, not periodic
  labs: []
  labs_quarterly: [Hb]
  vitals: [systolic_bp, diastolic_bp, heart_rate, weight]
  prescriptions_renewed: false
  visit_duration_minutes: 20

# Disease-specific post-discharge follow-up
_post_discharge:
  first_visit_days: 14
  labs: [CRP, WBC, Creatinine]
  vitals: [systolic_bp, diastolic_bp, heart_rate, temperature]
  visit_duration_minutes: 20

_post_discharge_by_disease:
  bacterial_pneumonia:
    visit_reason:
      en: "Post-pneumonia follow-up, CRP check, chest X-ray review"
      ja: "肺炎退院後フォローアップ・CRP確認・胸部X線評価"
    labs: [CRP, WBC]
  heart_failure_exacerbation:
    visit_reason:
      en: "Post-HF discharge, volume status, BNP, weight check"
      ja: "心不全退院後フォローアップ・体液量評価・BNP・体重確認"
    labs: [BNP, Creatinine, K]
  hip_fracture:
    visit_reason:
      en: "Post-surgical follow-up, wound check, mobility assessment"
      ja: "術後フォローアップ・創部確認・歩行機能評価"
    labs: [CRP, Hb]
  urinary_tract_infection:
