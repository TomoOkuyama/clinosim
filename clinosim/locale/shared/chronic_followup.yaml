F20:  # Schizophrenia (Issue #2140)
  visit_reason:
    en: "Schizophrenia follow-up: symptom and adherence review, antipsychotic side-effect monitoring"
    ja: "統合失調症フォローアップ・症状と服薬アドヒアランスの確認・抗精神病薬の副作用評価"
  follow_up_interval_months: 2
  # ADA / APA consensus metabolic monitoring for second-generation
  # antipsychotics (glucose at each review; HbA1c / lipids yearly).
  labs: [Glucose]
  labs_annual: [HbA1c, TC, TG, LDL]

F31:  # Bipolar disorder (Issue #2142)
  visit_reason:
    en: "Bipolar disorder follow-up: mood episode review, mood-stabilizer management"
    ja: "双極性障害フォローアップ・気分エピソードの確認・気分安定薬の調整"
  follow_up_interval_months: 2
  # Drug-specific safety labs (lithium level / TSH / creatinine, valproate
  # liver enzymes) come from medication_monitoring.yaml.
  labs: []

F32:  # Depression — single episode (Issue #1137 cluster axis 2)
  visit_reason:
    en: "Depression symptom monitoring, PHQ-9 scoring, antidepressant management"
    ja: "うつ病症状モニタリング・PHQ-9 評価・抗うつ薬調整"
  follow_up_interval_months: 3
  labs: []
  # PHQ-9 (Patient Health Questionnaire-9, LOINC 44249-1) +
  # C-SSRS (Columbia Suicide Severity Rating Scale, LOINC
  # 93372-1) emitted every quarter for diagnosed-depression cohort.
  # - PHQ-9: integer 0-27; Kroenke 2001 severity bands.
  # - C-SSRS: integer 0-5 ideation severity (0 none / 1 passive /
  #   2 non-specific active / 3 w/ method / 4 w/ plan / 5 w/
  #   intent). Posner 2011 Am J Psychiatry. Over-emits on
  #   mild cohort for safety-first screening; a planned follow-up
  #   gates C-SSRS to PHQ-9 moderately severe / severe only.
  labs_quarterly: ["PHQ-9", "C-SSRS"]
  vitals: [systolic_bp, heart_rate]
  prescriptions_renewed: true
  visit_duration_minutes: 15

F33:  # Recurrent depressive disorder (Issue #1137 cluster axis 2)
  visit_reason:
    en: "Recurrent depression monitoring, PHQ-9 scoring, long-term antidepressant management"
    ja: "反復性うつ病性障害フォローアップ・PHQ-9 評価・長期抗うつ薬管理"
  follow_up_interval_months: 3
  labs: []
  labs_quarterly: ["PHQ-9", "C-SSRS"]
  vitals: [systolic_bp, heart_rate]
  prescriptions_renewed: true
  visit_duration_minutes: 15

F41.1:  # Generalized anxiety disorder (Issue #1137 cluster axis 3)
  visit_reason:
    en: "GAD monitoring, GAD-7 scoring, anxiolytic/SSRI management"
    ja: "全般性不安障害フォローアップ・GAD-7 評価・抗不安薬／SSRI 管理"
  follow_up_interval_months: 3
  labs: []
  # GAD-7 (Generalized Anxiety Disorder 7-item, LOINC 70274-6)
  # emitted every quarter for diagnosed-GAD cohort. Score integer
  # 0-21; severity banded 0-4 minimal / 5-9 mild / 10-14 moderate /
  # 15-21 severe (Spitzer 2006 Arch Intern Med 166:1092). Baseline
  # 8 (mild→moderate transition) with CV 0.20 — see
  # observation.engine.BASELINE_LAB_NORMALS / BIOLOGICAL_CV.
  labs_quarterly: ["GAD-7"]
  vitals: [systolic_bp, heart_rate]
  prescriptions_renewed: true
  visit_duration_minutes: 15

F00:  # Dementia
  visit_reason:
    en: "Cognitive status assessment, caregiver support"
    ja: "認知機能評価・介護者支援"
  follow_up_interval_months: 3
  labs: []
  vitals: [systolic_bp, heart_rate]
  prescriptions_renewed: true
  visit_duration_minutes: 20

G20:  # Parkinson's disease
