    en: "Hepatocellular carcinoma follow-up, tumor markers (AFP, PIVKA-II)"
    ja: "肝細胞がんフォローアップ・腫瘍マーカー（AFP, PIVKA-II）・肝機能評価"
  follow_up_interval_months: 3
  labs: [AST, ALT]
