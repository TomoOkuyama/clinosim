# Home medications by chronic condition (ICD-10 code)
# These are continued during hospitalization unless contraindicated.
# Source: Standard clinical guidelines (JCS, AHA/ACC, KDIGO, GOLD, ADA)
#
# Fields:
#   drug: Generic drug name (English, bare — no dose)
#   drug_ja: Japanese drug name (optional, bare — no dose; used when country=JP)
#   dose: Dose string (language-neutral numeric+unit, e.g. "5mg", "100/25mg", "1000IU")
#   route: PO | IV | SC | INH
#   frequency: daily | bid | tid | qid | prn | weekly | monthly
#   hold_condition: (optional) condition to hold the drug
#   monitoring_labs: (optional) additional labs to monitor
#   monitoring_frequency: (optional) frequency of monitoring labs
#
# Issue #442 (bare-name + separate dose migration): dose was formerly baked
# into `drug` / `drug_ja` strings (e.g. "Atorvastatin 10mg"). It's now a
# separate field so downstream dedup can collapse the chronic path and the
# disease-protocol `discharge_oral` path (which always used bare names +
# separate dose). The activator copies `dose` into `HomeMedication.dose`
# which flows through to `discharge_prescription.items[].dose`,
# `PrescriptionRecord.items[].dose` (OPD), and Order fields (inpatient
# home-med continue orders).
#
# Rivaroxaban entries (I26 / I82 / I63) keep the dose-embedded format
# because JP uses a different clinical dose (15mg) than US (20mg) — a
# single locale-neutral `dose` cannot represent both. Follow-up needed
# to introduce a locale-aware dose field or split entries per locale.
# The bare-name variant duplicate class targeted by #442 (atorvastatin /
# aspirin / furosemide / carvedilol / amlodipine / acetaminophen) does not
# involve Rivaroxaban, so leaving those entries unchanged does not
# reintroduce the #442 defect.

I10:  # Hypertension
  medications:
    - {drug: "Amlodipine", drug_ja: "アムロジピン", dose: "5mg", route: "PO", frequency: "daily"}
    - {drug: "Candesartan", drug_ja: "カンデサルタン", dose: "8mg", route: "PO", frequency: "daily", probability: 0.5}
  hold_conditions:
    - {drug: "Amlodipine", condition: "SBP < 90", field: "systolic_bp", threshold: 90, direction: "below"}
    - {drug: "Candesartan", condition: "SBP < 90", field: "systolic_bp", threshold: 90, direction: "below"}

E11.9:  # Type 2 Diabetes
  medications:
    - {drug: "Metformin", drug_ja: "メトホルミン", dose: "500mg", route: "PO", frequency: "bid"}
    - {drug: "Sliding scale insulin", drug_ja: "スライディングスケール インスリン", dose: "", route: "SC", frequency: "qid", probability: 0.4}
  monitoring:
    - {test: "Glucose", frequency: "qid", times: [6, 11, 17, 21], intent: "Blood glucose monitoring (DM)"}
  hold_conditions:
    - {drug: "Metformin", condition: "eGFR < 30 or acute illness", field: "renal_function", threshold: 0.3, direction: "below"}

E78:  # Dyslipidemia
  medications:
    - {drug: "Atorvastatin", drug_ja: "アトルバスタチン", dose: "10mg", route: "PO", frequency: "daily"}
  monitoring:
    - {test: "AST", frequency: "every_3_days", intent: "Statin hepatotoxicity monitoring"}
    - {test: "ALT", frequency: "every_3_days", intent: "Statin hepatotoxicity monitoring"}

J44:  # COPD
  medications:
    - {drug: "Tiotropium", drug_ja: "チオトロピウム", dose: "18mcg", route: "INH", frequency: "daily"}
    - {drug: "Salbutamol", drug_ja: "サルブタモール", dose: "100mcg", route: "INH", frequency: "prn"}
  monitoring:
    - {test: "SpO2", frequency: "tid", intent: "COPD SpO2 monitoring (target 88-92%)"}
  vital_adjustments:
    spo2_target_low: 88
    spo2_target_high: 92

N18:  # CKD
  medications:
    - {drug: "Sodium bicarbonate", drug_ja: "炭酸水素ナトリウム", dose: "500mg", route: "PO", frequency: "tid", probability: 0.3}
  monitoring:
    - {test: "Creatinine", frequency: "daily", intent: "Renal function monitoring (CKD)"}
    - {test: "K", frequency: "daily", intent: "Potassium monitoring (CKD)"}
    - {test: "Na", frequency: "daily", intent: "Sodium monitoring (CKD)"}
    - {test: "BUN", frequency: "every_3_days", intent: "BUN monitoring (CKD)"}
  dose_adjustments:
    - {pattern: "renal_clearance", note: "Adjust renally cleared drugs"}

I50:  # Heart failure
  medications:
    - {drug: "Furosemide", drug_ja: "フロセミド", dose: "20mg", route: "PO", frequency: "daily"}
    - {drug: "Carvedilol", drug_ja: "カルベジロール", dose: "2.5mg", route: "PO", frequency: "bid", probability: 0.6}
    - {drug: "Enalapril", drug_ja: "エナラプリル", dose: "5mg", route: "PO", frequency: "daily", probability: 0.5}
  monitoring:
    - {test: "BNP", frequency: "every_3_days", intent: "Heart failure monitoring"}
    - {test: "K", frequency: "daily", intent: "Electrolyte monitoring (diuretic)"}
    - {test: "Creatinine", frequency: "daily", intent: "Renal function monitoring (diuretic)"}
  hold_conditions:
    - {drug: "Furosemide", condition: "SBP < 90", field: "systolic_bp", threshold: 90, direction: "below"}
    - {drug: "Carvedilol", condition: "HR < 50", field: "heart_rate", threshold: 50, direction: "below"}
    - {drug: "Enalapril", condition: "SBP < 90 or K > 5.5", field: "systolic_bp", threshold: 90, direction: "below"}

I48:  # Atrial fibrillation
  # Anticoagulant selection is mutually exclusive (categorical): a patient
  # gets ONE agent, not both. See top-of-file rationale block on
  # `exclusive_classes` (Issue #432).
  exclusive_classes: ["anticoagulant"]
  medications:
    - {drug: "Warfarin", drug_ja: "ワルファリン", dose: "3mg", drug_class: "anticoagulant", route: "PO", frequency: "daily", probability: 0.5}
    - {drug: "Apixaban", drug_ja: "アピキサバン", dose: "5mg", drug_class: "anticoagulant", route: "PO", frequency: "bid", probability: 0.5}
  monitoring:
    - {test: "PT-INR", frequency: "daily", intent: "Anticoagulation monitoring"}
  hold_conditions:
    - {drug: "Warfarin", condition: "Pre-surgical", note: "Hold 5 days before surgery, bridge with heparin"}

I25:  # Ischemic heart disease / Coronary artery disease
  medications:
    - {drug: "Aspirin", drug_ja: "アスピリン", dose: "100mg", route: "PO", frequency: "daily"}
    - {drug: "Clopidogrel", drug_ja: "クロピドグレル", dose: "75mg", route: "PO", frequency: "daily", probability: 0.4}
  hold_conditions:
    - {drug: "Aspirin", condition: "Pre-surgical", note: "Hold pre-surgery"}
    - {drug: "Clopidogrel", condition: "Pre-surgical", note: "Hold pre-surgery"}

M81:  # Osteoporosis
  medications:
    - {drug: "Alendronate", drug_ja: "アレンドロネート", dose: "35mg", route: "PO", frequency: "weekly", probability: 0.6, note: "Empty stomach, 30min before meals"}
    - {drug: "Vitamin D", drug_ja: "ビタミンD", dose: "1000IU", route: "PO", frequency: "daily"}
  monitoring:
    - {test: "Ca", frequency: "every_3_days", intent: "Calcium monitoring (osteoporosis)"}

F00:  # Dementia / Alzheimer's
  medications:
    - {drug: "Donepezil", drug_ja: "ドネペジル", dose: "5mg", route: "PO", frequency: "daily", probability: 0.5}
  notes:
    - "Increased delirium risk during hospitalization"

# Phase 2b (2026-06-24): post-discharge anticoagulation for VTE/embolic CI.
# Drug probabilities reflect modern ACCP 2020 / ESC 2019 guideline: DOAC
# (rivaroxaban/apixaban) is first-line for non-valvular indications;
# warfarin remains for severe renal impairment, mechanical valves, cost.
#
# Issue #432 (Session 70): anticoagulant selection MUST be mutually
# exclusive (a patient gets one agent, not both). The activator now
# reads `exclusive_classes` and does a categorical draw for drugs whose
# `drug_class` is in the exclusive list; drugs without a class-tag
# remain on the independent-Bernoulli path so clinically-valid concurrent
# regimens (e.g. I50 HF triad, I25 DAPT) are unaffected.
#
# Issue #442 (bare-name migration): Rivaroxaban entries below intentionally
# keep the dose-embedded format because JP uses 15mg (VTE dose per JCS)
# while US uses 20mg. A single locale-neutral `dose` field cannot represent
# both. Follow-up work will introduce a locale-aware dose mechanism.
I26:  # Pulmonary embolism — post-discharge AC (>=3 mo, indefinite if unprovoked)
  exclusive_classes: ["anticoagulant"]
  medications:
    - {drug: "Rivaroxaban 20mg", drug_ja: "リバーロキサバン15mg", drug_class: "anticoagulant", route: "PO", frequency: "daily", probability: 0.5}
    - {drug: "Apixaban", drug_ja: "アピキサバン", dose: "5mg", drug_class: "anticoagulant", route: "PO", frequency: "bid", probability: 0.3}
    - {drug: "Warfarin", drug_ja: "ワルファリン", dose: "3mg", drug_class: "anticoagulant", route: "PO", frequency: "daily", probability: 0.2}
  monitoring:
    - {test: "PT-INR", frequency: "monthly", intent: "Warfarin therapeutic monitoring (if on warfarin)"}
    - {test: "Cr", frequency: "every_6_months", intent: "DOAC renal monitoring (if on DOAC)"}

I82:  # Deep vein thrombosis — same duration logic as I26
  exclusive_classes: ["anticoagulant"]
  medications:
    - {drug: "Rivaroxaban 20mg", drug_ja: "リバーロキサバン15mg", drug_class: "anticoagulant", route: "PO", frequency: "daily", probability: 0.5}
    - {drug: "Apixaban", drug_ja: "アピキサバン", dose: "5mg", drug_class: "anticoagulant", route: "PO", frequency: "bid", probability: 0.3}
    - {drug: "Warfarin", drug_ja: "ワルファリン", dose: "3mg", drug_class: "anticoagulant", route: "PO", frequency: "daily", probability: 0.2}
  monitoring:
    - {test: "PT-INR", frequency: "monthly", intent: "Warfarin therapeutic monitoring (if on warfarin)"}

I63:  # Cerebral infarction — embolic source (AF/cardiac) gets AC; non-embolic gets antiplatelet
  # Mixed block: anticoagulants are mutually exclusive (categorical);
  # antiplatelets stay independent (aspirin+clopidogrel dual therapy is
  # clinically valid for select stroke subtypes / early phase).
  exclusive_classes: ["anticoagulant"]
  medications:
    - {drug: "Warfarin", drug_ja: "ワルファリン", dose: "3mg", drug_class: "anticoagulant", route: "PO", frequency: "daily", probability: 0.3}
    - {drug: "Apixaban", drug_ja: "アピキサバン", dose: "5mg", drug_class: "anticoagulant", route: "PO", frequency: "bid", probability: 0.3}
    - {drug: "Aspirin", drug_ja: "アスピリン", dose: "100mg", route: "PO", frequency: "daily", probability: 0.7}
    - {drug: "Clopidogrel", drug_ja: "クロピドグレル", dose: "75mg", route: "PO", frequency: "daily", probability: 0.3}
  monitoring:
    - {test: "PT-INR", frequency: "monthly", intent: "Warfarin therapeutic monitoring (if on warfarin)"}

G20:  # Parkinson's disease
  medications:
    - {drug: "Levodopa/Carbidopa", drug_ja: "レボドパ・カルビドパ", dose: "100/25mg", route: "PO", frequency: "tid"}
  hold_conditions:
    - {drug: "Levodopa/Carbidopa", condition: "CRITICAL — must continue on schedule, never abruptly stop"}

E03:  # Hypothyroidism
  medications:
    - {drug: "Levothyroxine", drug_ja: "レボチロキシン", dose: "50mcg", route: "PO", frequency: "daily"}
  monitoring:
    - {test: "TSH", frequency: "every_3_days", intent: "Thyroid monitoring (if hospitalized >7 days)"}

K21:  # GERD
  medications:
    - {drug: "Lansoprazole", drug_ja: "ランソプラゾール", dose: "15mg", route: "PO", frequency: "daily"}

J45:  # Asthma
  medications:
    # Issue #920 defensible-dose defaults. Adoair 250 Diskus 添付文書:
    # フルチカゾンプロピオン酸エステル 250 μg / サルメテロール 50 μg 配合、
    # 1回1吸入・1日2回 (通常維持量、成人)。The 250μg fluticasone strength is
    # the reference strength that FHIR consumers use for dispensing.
    - {drug: "Fluticasone/Salmeterol", drug_ja: "フルチカゾン/サルメテロール", dose: "250mcg", route: "INH", frequency: "bid"}
    # Salbutamol pMDI (サルタノール / ベネトリン): 1 puff = 100 μg salbutamol、
    # 発作時 1-2 puff 頓用 (成人)、添付文書: サルタノールインヘラー 100μg.
    - {drug: "Salbutamol", drug_ja: "サルブタモール", dose: "100mcg", route: "INH", frequency: "prn"}
  monitoring:
    - {test: "SpO2", frequency: "tid", intent: "SpO2 monitoring if respiratory complaint"}

N40:  # BPH
  medications:
    - {drug: "Tamsulosin", drug_ja: "タムスロシン", dose: "0.2mg", route: "PO", frequency: "daily"}
  hold_conditions:
    - {drug: "Tamsulosin", condition: "Pre-surgical", note: "Hold pre-surgery (risk of floppy iris syndrome)"}

M17:  # Osteoarthritis
  medications:
    - {drug: "Acetaminophen", drug_ja: "アセトアミノフェン", dose: "500mg", route: "PO", frequency: "tid", probability: 0.7}
    - {drug: "Celecoxib", drug_ja: "セレコキシブ", dose: "200mg", route: "PO", frequency: "daily", probability: 0.3}
  monitoring:
    - {test: "Creatinine", frequency: "every_3_days", intent: "Renal function monitoring (if on NSAID)"}
  hold_conditions:
    - {drug: "Celecoxib", condition: "Renal impairment", note: "Hold if renal impairment"}
