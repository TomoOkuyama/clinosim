# Home medications by chronic condition (ICD-10 code)
# These are continued during hospitalization unless contraindicated.
# Source: Standard clinical guidelines (JCS, AHA/ACC, KDIGO, GOLD, ADA)
#
# Module-specific sections (axis-5 context lives with the module README):
#   E66.9 / E66.01 (obesity) — GLP-1 agonist pharmacotherapy ships as
#       cluster-2 axis 5 of META #1137 cluster-2 scope. See
#       clinosim/modules/metabolic/README.md "Public API" + "Output
#       surfaces" sections for the enricher chain that assigns the
#       E66.* chronic conditions these entries respond to.
#
# Fields:
#   drug: Generic drug name (English, bare — no dose)
#   drug_ja: Japanese drug name (optional, bare — no dose; used when country=JP)
#   dose: Dose string (language-neutral numeric+unit, e.g. "5mg", "100/25mg", "1000IU")
#   route: PO | IV | SC | INH
#   frequency: daily | bid | tid | qid | prn | weekly | monthly
#   hold_condition: (optional) condition to hold the drug
#   monitoring_labs: (optional) additional labs to monitor
#   monitoring_frequency: (optional) frequency of monitoring labs
#
# Issue #442 (bare-name + separate dose migration): dose was formerly baked
# into `drug` / `drug_ja` strings (e.g. "Atorvastatin 10mg"). It's now a
# separate field so downstream dedup can collapse the chronic path and the
# disease-protocol `discharge_oral` path (which always used bare names +
# separate dose). The activator copies `dose` into `HomeMedication.dose`
# which flows through to `discharge_prescription.items[].dose`,
# `PrescriptionRecord.items[].dose` (OPD), and Order fields (inpatient
# home-med continue orders).
#
# Rivaroxaban entries (I26 / I82 / I63) keep the dose-embedded format
# because JP uses a different clinical dose (15mg) than US (20mg) — a
# single locale-neutral `dose` cannot represent both. Follow-up needed
# to introduce a locale-aware dose field or split entries per locale.
# The bare-name variant duplicate class targeted by #442 (atorvastatin /
# aspirin / furosemide / carvedilol / amlodipine / acetaminophen) does not
# involve Rivaroxaban, so leaving those entries unchanged does not
# reintroduce the #442 defect.

I10:  # Hypertension
  medications:
    - {drug_id: amlodipine, dose: "5mg", route: "PO", frequency: "daily"}
    # Issue #1770 fix: ARB (ACE/ARB class) is a first-line pillar of
    # chronic HTN therapy per ACC/AHA 2017 + JNC 8 + ESC/ESH 2023. Pre-
    # fix the 50 % sampling probability left 46 % of escalated triple-
    # therapy patients without any ACE/ARB (880 / 1903 of p=10k 5y US
    # cohort). Raising to 1.0 makes ACE/ARB default; RNG-neutral because
    # Bernoulli sampler consumes the same draw regardless of the
    # probability value (per activator.py ``probability=0`` comment).
    - {drug_id: candesartan, dose: "8mg", route: "PO", frequency: "daily", probability: 1.0}
    # Phase 4b.1 (#1697) — longitudinal escalation drug. probability: 0.0
    # keeps activation sampling from picking it; only the longitudinal
    # engine's htn_escalate_third_agent_i10 event adds it via resolve_med_name.
    - {drug_id: hydrochlorothiazide, dose: "25mg", drug_class: "thiazide", route: "PO", frequency: "daily", probability: 0.0}
    # Issue #1762 — 4th-agent escalation (mineralocorticoid-receptor
    # antagonist for resistant HTN per PATHWAY-2 / ACC-AHA 2017).
    # probability: 0.0 keeps the activation sampler from ever picking it;
    # only the longitudinal engine's htn_escalate_fourth_agent_i10 event
    # adds it via resolve_med_name.
    - {drug_id: spironolactone, dose: "25mg", drug_class: "diuretic.k_sparing", route: "PO", frequency: "daily", probability: 0.0}
  hold_conditions:
    - {drug: "Amlodipine", condition: "SBP < 90", field: "systolic_bp", threshold: 90, direction: "below"}
    - {drug: "Candesartan", condition: "SBP < 90", field: "systolic_bp", threshold: 90, direction: "below"}

E11.9:  # Type 2 Diabetes
  medications:
    - {drug_id: metformin, dose: "500mg", route: "PO", frequency: "bid"}
    # Cycle 2 M3 (#1739) — Sliding scale insulin removed from the home-med
    # sampler. Sliding scale is an INPATIENT-ONLY PRN protocol (DKA / HHS /
    # peri-op hyperglycemia) per ADA Standards of Care in Diabetes 2024 §9,
    # which explicitly rejects sliding-scale for ambulatory chronic T2DM.
    # The inpatient DKA protocol
    # (`clinosim/modules/disease/reference_data/diabetic_ketoacidosis.yaml`)
    # legitimately uses sliding scale during admission; the chronic home
    # pathway below drives insulin via Phase 4a's dm_escalate_insulin_e11
    # event (basal, Insulin glargine) at HbA1c > 10 instead.
    # Phase 4a (#1697) — longitudinal escalation drugs. probability: 0.0
    # keeps the activation sampler from ever picking them; only the
    # longitudinal engine's dm_escalate_sglt2i_e11 / dm_escalate_insulin_e11
    # event yamls add these via resolve_med_name lookup on fire.
    - {drug_id: empagliflozin, dose: "10mg", drug_class: "sglt2i", route: "PO", frequency: "daily", probability: 0.0}
    - {drug_id: dapagliflozin, dose: "10mg", drug_class: "sglt2i", route: "PO", frequency: "daily", probability: 0.0}
    - {drug_id: insulin_glargine, dose: "10U", drug_class: "basal_insulin", route: "SC", frequency: "daily", probability: 0.0}
  monitoring:
    - {test: "Glucose", frequency: "qid", times: [6, 11, 17, 21], intent: "Blood glucose monitoring (DM)"}
  hold_conditions:
    - {drug: "Metformin", condition: "eGFR < 30 or acute illness", field: "renal_function", threshold: 0.3, direction: "below"}

E78:  # Dyslipidemia
  medications:
    - {drug_id: atorvastatin, dose: "10mg", route: "PO", frequency: "daily"}
    # Phase 4b.1 (#1697) — longitudinal escalation drugs. probability: 0.0
    # keeps activation sampling from picking them; only the longitudinal
    # engine's lipid_escalate_* event yamls add them via resolve_med_name.
    - {drug_id: rosuvastatin, dose: "20mg", drug_class: "high_intensity_statin", route: "PO", frequency: "daily", probability: 0.0}
    - {drug_id: ezetimibe, dose: "10mg", drug_class: "cholesterol_absorption_inhibitor", route: "PO", frequency: "daily", probability: 0.0}
  monitoring:
    - {test: "AST", frequency: "every_3_days", intent: "Statin hepatotoxicity monitoring"}
    - {test: "ALT", frequency: "every_3_days", intent: "Statin hepatotoxicity monitoring"}

J44:  # COPD
  medications:
    - {drug_id: tiotropium, dose: "18mcg", route: "INH", frequency: "daily"}
    - {drug_id: albuterol, dose: "100mcg", route: "INH", frequency: "prn"}
  monitoring:
    - {test: "SpO2", frequency: "tid", intent: "COPD SpO2 monitoring (target 88-92%)"}
  vital_adjustments:
    spo2_target_low: 88
    spo2_target_high: 92

N18:  # CKD
  medications:
    - {drug_id: sodium_bicarbonate, dose: "500mg", route: "PO", frequency: "tid", probability: 0.3}
  monitoring:
    - {test: "Creatinine", frequency: "daily", intent: "Renal function monitoring (CKD)"}
    - {test: "K", frequency: "daily", intent: "Potassium monitoring (CKD)"}
    - {test: "Na", frequency: "daily", intent: "Sodium monitoring (CKD)"}
    - {test: "BUN", frequency: "every_3_days", intent: "BUN monitoring (CKD)"}
  dose_adjustments:
    - {pattern: "renal_clearance", note: "Adjust renally cleared drugs"}

I50:  # Heart failure
  medications:
    - {drug_id: furosemide, dose: "20mg", route: "PO", frequency: "daily"}
    - {drug_id: carvedilol, dose: "2.5mg", route: "PO", frequency: "bid", probability: 0.6}
    - {drug_id: enalapril, dose: "5mg", route: "PO", frequency: "daily", probability: 0.5}
  monitoring:
    - {test: "BNP", frequency: "every_3_days", intent: "Heart failure monitoring"}
    - {test: "K", frequency: "daily", intent: "Electrolyte monitoring (diuretic)"}
    - {test: "Creatinine", frequency: "daily", intent: "Renal function monitoring (diuretic)"}
  hold_conditions:
    - {drug: "Furosemide", condition: "SBP < 90", field: "systolic_bp", threshold: 90, direction: "below"}
    - {drug: "Carvedilol", condition: "HR < 50", field: "heart_rate", threshold: 50, direction: "below"}
    - {drug: "Enalapril", condition: "SBP < 90 or K > 5.5", field: "systolic_bp", threshold: 90, direction: "below"}

I48:  # Atrial fibrillation
  # Anticoagulant selection is mutually exclusive (categorical): a patient
  # gets ONE agent, not both. See top-of-file rationale block on
  # `exclusive_classes` (Issue #432).
  exclusive_classes: ["anticoagulant"]
  medications:
    - {drug_id: warfarin, dose: "3mg", drug_class: "anticoagulant", route: "PO", frequency: "daily", probability: 0.5}
    - {drug_id: apixaban, dose: "5mg", drug_class: "anticoagulant", route: "PO", frequency: "bid", probability: 0.5}
  monitoring:
    - {test: "PT-INR", frequency: "daily", intent: "Anticoagulation monitoring"}
  hold_conditions:
    - {drug: "Warfarin", condition: "Pre-surgical", note: "Hold 5 days before surgery, bridge with heparin"}

I25:  # Ischemic heart disease / Coronary artery disease
  medications:
    - {drug_id: aspirin, dose: "100mg", route: "PO", frequency: "daily"}
    # Issue #1330: chronic Clopidogrel (as DAPT with Aspirin) is only
    # indicated within 6-12 mo of PCI / ACS per ACC/AHA + ESC + JCS 2022;
    # long-term chronic DAPT >12 mo is exceptional. The prior 0.40
    # probability activated DAPT on 40 % of every I25 patient at
    # activation time — that pre-dates any acute cardiac event in the
    # sim (I21 admissions may be MANY months later), producing the
    # anachronistic "DAPT started 5+ mo before any cardiac Dx" pattern
    # for 19 JP + 4 US patients on the p=10k baseline. Retune to 0.10
    # to represent the ~10 % of chronic-CAD patients within their
    # 6-12 mo post-PCI window; add a note as an anchor for the
    # follow-up post-PCI-driven event flag (deferred — needs a
    # ``recent_pci_within_12mo`` sim feature).
    - {drug_id: clopidogrel, dose: "75mg", route: "PO", frequency: "daily", probability: 0.10, note: "Chronic DAPT with Aspirin (assumed within 12 mo of PCI); truly chronic >12 mo is exceptional"}
    # Issue #1338: high-intensity statin for CAD secondary prevention is
    # Class-I evidence in every guideline body (ACC/AHA 2018, ESC 2019,
    # JAS 2022). Prior sim modelled statin ONLY under E78 (dyslipidemia
    # chronic block), so 39 % of CAD patients without an E78 chronic
    # diagnosis carried zero statin. probability 0.90 reflects real-world
    # adherence (~85-90 %) with headroom for statin-intolerance /
    # patient-preference exclusions. Dose is high-intensity Atorvastatin
    # 40 mg (guideline first-line for secondary prevention); patients
    # who also carry E78 will collide with the E78 block's 10 mg entry —
    # chronic-med dedup keeps a single Atorvastatin at whichever dose
    # activator picks up first, avoiding dual-emit.
    - {drug_id: atorvastatin, dose: "40mg", route: "PO", frequency: "daily", probability: 0.90, note: "CAD secondary prevention (Class I)"}
  hold_conditions:
    - {drug: "Aspirin", condition: "Pre-surgical", note: "Hold pre-surgery"}
    - {drug: "Clopidogrel", condition: "Pre-surgical", note: "Hold pre-surgery"}

M81:  # Osteoporosis
  medications:
    - {drug_id: alendronate, dose: "35mg", route: "PO", frequency: "weekly", probability: 0.6, note: "Empty stomach, 30min before meals"}
    - {drug_id: vitamin_d, dose: "1000IU", route: "PO", frequency: "daily"}
  monitoring:
    - {test: "Ca", frequency: "every_3_days", intent: "Calcium monitoring (osteoporosis)"}

F00:  # Dementia / Alzheimer's
  medications:
    - {drug_id: donepezil, dose: "5mg", route: "PO", frequency: "daily", probability: 0.5}
  notes:
    - "Increased delirium risk during hospitalization"

# Phase 2b (2026-06-24): post-discharge anticoagulation for VTE/embolic CI.
# Drug probabilities reflect modern ACCP 2020 / ESC 2019 guideline: DOAC
# (rivaroxaban/apixaban) is first-line for non-valvular indications;
# warfarin remains for severe renal impairment, mechanical valves, cost.
#
# Issue #432 (Session 70): anticoagulant selection MUST be mutually
# exclusive (a patient gets one agent, not both). The activator now
# reads `exclusive_classes` and does a categorical draw for drugs whose
# `drug_class` is in the exclusive list; drugs without a class-tag
# remain on the independent-Bernoulli path so clinically-valid concurrent
# regimens (e.g. I50 HF triad, I25 DAPT) are unaffected.
#
# Issue #442 (bare-name migration): Rivaroxaban entries below intentionally
# keep the dose-embedded format because JP uses 15mg (VTE dose per JCS)
# while US uses 20mg. A single locale-neutral `dose` field cannot represent
# both. Follow-up work will introduce a locale-aware dose mechanism.
I26:  # Pulmonary embolism — post-discharge AC (>=3 mo, indefinite if unprovoked)
  exclusive_classes: ["anticoagulant"]
  medications:
    - {drug: "Rivaroxaban 20mg", drug_ja: "リバーロキサバン15mg", drug_class: "anticoagulant", route: "PO", frequency: "daily", probability: 0.5}
    - {drug_id: apixaban, dose: "5mg", drug_class: "anticoagulant", route: "PO", frequency: "bid", probability: 0.3}
    - {drug_id: warfarin, dose: "3mg", drug_class: "anticoagulant", route: "PO", frequency: "daily", probability: 0.2}
  monitoring:
    - {test: "PT-INR", frequency: "monthly", intent: "Warfarin therapeutic monitoring (if on warfarin)"}
    - {test: "Cr", frequency: "every_6_months", intent: "DOAC renal monitoring (if on DOAC)"}

I82:  # Deep vein thrombosis — same duration logic as I26
  exclusive_classes: ["anticoagulant"]
  medications:
    - {drug: "Rivaroxaban 20mg", drug_ja: "リバーロキサバン15mg", drug_class: "anticoagulant", route: "PO", frequency: "daily", probability: 0.5}
    - {drug_id: apixaban, dose: "5mg", drug_class: "anticoagulant", route: "PO", frequency: "bid", probability: 0.3}
    - {drug_id: warfarin, dose: "3mg", drug_class: "anticoagulant", route: "PO", frequency: "daily", probability: 0.2}
  monitoring:
    - {test: "PT-INR", frequency: "monthly", intent: "Warfarin therapeutic monitoring (if on warfarin)"}

I63:  # Cerebral infarction — embolic source (AF/cardiac) gets AC; non-embolic gets antiplatelet
  # Mixed block: anticoagulants are mutually exclusive (categorical);
  # antiplatelets stay independent (aspirin+clopidogrel dual therapy is
  # clinically valid for select stroke subtypes / early phase).
  exclusive_classes: ["anticoagulant"]
  medications:
    - {drug_id: warfarin, dose: "3mg", drug_class: "anticoagulant", route: "PO", frequency: "daily", probability: 0.3}
    - {drug_id: apixaban, dose: "5mg", drug_class: "anticoagulant", route: "PO", frequency: "bid", probability: 0.3}
    - {drug_id: aspirin, dose: "100mg", route: "PO", frequency: "daily", probability: 0.7}
    - {drug_id: clopidogrel, dose: "75mg", route: "PO", frequency: "daily", probability: 0.3}
  monitoring:
    - {test: "PT-INR", frequency: "monthly", intent: "Warfarin therapeutic monitoring (if on warfarin)"}

G20:  # Parkinson's disease
  medications:
    - {drug_id: levodopa_carbidopa, dose: "100/25mg", route: "PO", frequency: "tid"}
  hold_conditions:
    - {drug: "Levodopa/Carbidopa", condition: "CRITICAL — must continue on schedule, never abruptly stop"}

E03:  # Hypothyroidism
  medications:
    - {drug_id: levothyroxine, dose: "50mcg", route: "PO", frequency: "daily"}
  monitoring:
    - {test: "TSH", frequency: "every_3_days", intent: "Thyroid monitoring (if hospitalized >7 days)"}

K21:  # GERD
  medications:
    - {drug_id: lansoprazole, dose: "15mg", route: "PO", frequency: "daily"}

J45:  # Asthma
  medications:
    # Issue #920 defensible-dose defaults. Adoair 250 Diskus 添付文書:
    # フルチカゾンプロピオン酸エステル 250 μg / サルメテロール 50 μg 配合、
    # 1回1吸入・1日2回 (通常維持量、成人)。The 250μg fluticasone strength is
    # the reference strength that FHIR consumers use for dispensing.
    - {drug_id: fluticasone_salmeterol, dose: "250mcg", route: "INH", frequency: "bid"}
    # Salbutamol pMDI (サルタノール / ベネトリン): 1 puff = 100 μg salbutamol、
    # 発作時 1-2 puff 頓用 (成人)、添付文書: サルタノールインヘラー 100μg.
    - {drug_id: albuterol, dose: "100mcg", route: "INH", frequency: "prn"}
  monitoring:
    - {test: "SpO2", frequency: "tid", intent: "SpO2 monitoring if respiratory complaint"}

N40:  # BPH
  medications:
    - {drug_id: tamsulosin, dose: "0.2mg", route: "PO", frequency: "daily"}
  hold_conditions:
    - {drug: "Tamsulosin", condition: "Pre-surgical", note: "Hold pre-surgery (risk of floppy iris syndrome)"}

M17:  # Osteoarthritis
  medications:
    - {drug_id: acetaminophen, dose: "500mg", route: "PO", frequency: "tid", probability: 0.7}
    - {drug_id: celecoxib, dose: "200mg", route: "PO", frequency: "daily", probability: 0.3}
  monitoring:
    - {test: "Creatinine", frequency: "every_3_days", intent: "Renal function monitoring (if on NSAID)"}
  hold_conditions:
    - {drug: "Celecoxib", condition: "Renal impairment", note: "Hold if renal impairment"}

# --- Oncology chronic medications (Issue #943) ----------------------------
# Sampled representative regimens per cancer type. Not exhaustive — the
# aim is closing the "0 chemotherapy MedicationRequest" gap. Follow-up
# work should introduce full protocol-driven cycle scheduling (FOLFOX
# infusion days, taxane pre-med, aromatase-inhibitor rotation, etc.).
#
# Issue #1319: This block is scoped to ORAL / SUBCUTANEOUS daily home
# chemo (Capecitabine, Osimertinib, Sorafenib, Tamoxifen, Anastrozole,
# Bicalutamide, Leuprorelin depot). IV cycle-based agents (Oxaliplatin,
# Carboplatin, Pemetrexed, Trastuzumab, 5-FU, Leucovorin) emit via
# ``chemo_regimens.yaml`` cycle scheduling instead — they were emitting
# here as monthly chronic MRs without their regimen partners, producing
# clinically-nonsensical monotherapy MedicationRequests (Oxaliplatin
# 130 mg standalone every ~34 days for C18 patients, etc.).
C16:  # Gastric cancer — oral fluoropyrimidine adjuvant (Capecitabine US / S-1 JP)
  # Issue #1701: C16 chronic patients audited at p=2000 5y had zero
  # medications. Standard adjuvant chemo for gastric cancer after
  # curative resection is oral fluoropyrimidine (Capecitabine US /
  # Tegafur-Gimeracil-Oteracil [S-1] JP) ± oxaliplatin / cisplatin
  # cycles. The IV cycle partners (oxaliplatin, cisplatin, trastuzumab
  # for HER2+) emit via chemo_regimens.yaml per Issue #1319 convention;
  # only the oral monotherapy fits chronic home-med path.
  #
  # Clinical basis: NCCN Gastric Cancer v2.2024 (US); 胃癌治療ガイドライン
  # 2021 第6版 (JP, JGCA). ToGA / ACTS-GC / CLASSIC adjuvant trials.
  # fluoropyrimidine drug_class enables the active-regimen mutex in
  # patient/activator._derive_home_medications (same guard C18 uses).
  medications:
    - {drug_id: capecitabine, dose: "1000mg/m2", drug_class: "fluoropyrimidine", route: "PO", frequency: "bid", probability: 0.35, locale_exclude: ["JP"]}
    - {drug: "Tegafur-Gimeracil-Oteracil", drug_ja: "ティーエスワン", dose: "80mg", drug_class: "fluoropyrimidine", route: "PO", frequency: "bid", probability: 0.5, locale_exclude: ["US"]}
  monitoring:
    - {test: "Creatinine", frequency: "every_3_days", intent: "Chemotherapy renal function monitoring"}

C18:  # Colon cancer — oral fluoropyrimidine (Capecitabine, XELOX/XELIRI adjuvant)
  # Issue #1329: `drug_class: fluoropyrimidine` on Capecitabine enables
  # the active-regimen mutex in `patient/activator._derive_home_medications`.
  # A C18 chronic carrier who is also on an active fluoropyrimidine-
  # containing IV regimen (FOLFOX carries 5-FU) has Capecitabine's
  # effective probability zeroed at sampling time — preventing the
  # double 5-FU exposure (oral Capecitabine + IV 5-FU) observed in
  # p=10k random-sample review.
  medications:
    - {drug_id: capecitabine, dose: "1250mg/m2", drug_class: "fluoropyrimidine", route: "PO", frequency: "bid", probability: 0.5}
    # Oxaliplatin (IV q3weeks) removed per Issue #1319 — cycle-based
    # chemo, emitted via chemo_regimens.yaml (FOLFOX) not as a daily
    # home med. Prior probability 0.3 produced ~196 excess standalone-
    # monotherapy MRs at US p=10k s356.
  monitoring:
    - {test: "Creatinine", frequency: "every_3_days", intent: "Chemotherapy renal function monitoring"}

C22:  # Liver cancer — first-line oral TKI or immunotherapy
  medications:
    - {drug_id: sorafenib, dose: "400mg", route: "PO", frequency: "bid", probability: 0.5}
    - {drug_id: lenvatinib, dose: "12mg", route: "PO", frequency: "daily", probability: 0.3}
  monitoring:
    - {test: "AST", frequency: "every_3_days", intent: "TKI hepatotoxicity monitoring"}
    - {test: "ALT", frequency: "every_3_days", intent: "TKI hepatotoxicity monitoring"}

C34:  # Lung cancer — EGFR-TKI first-line for adeno; platinum doublet otherwise
  medications:
    - {drug_id: osimertinib, dose: "80mg", route: "PO", frequency: "daily", probability: 0.4}
    # Pemetrexed + Carboplatin (both IV q3weeks) removed per Issue #1319 —
    # cycle-based chemo, emitted via chemo_regimens.yaml (CarboPem
    # regimen) not as daily home meds. Prior standalone chronic MRs
    # produced non-cycle q34d monotherapy emit patterns.
  monitoring:
    - {test: "Creatinine", frequency: "every_3_days", intent: "Platinum renal function monitoring"}

C50:  # Breast cancer — endocrine therapy (majority ER+); trastuzumab for HER2+
  # Issue #1755 fix: tamoxifen (SERM) and anastrozole (aromatase
  # inhibitor) are mutually exclusive endocrine-therapy options for ER+
  # breast cancer — NCCN / ASCO guidelines pick one, not both. Prior to
  # the ``exclusive_classes`` mutex 0.4 × 0.3 = 12 % of C50 patients
  # ended up on dual therapy (17/108 observed). Anastrozole additionally
  # carries ``age_min: 50`` because aromatase inhibitors require a
  # post-menopausal state (NCCN: contraindicated in premenopausal women
  # without ovarian suppression; the pre-fix cohort had 8 premenopausal
  # anastrozole prescriptions, youngest 36 y).
  exclusive_classes: ["breast_endocrine_therapy"]
  medications:
    - {drug_id: tamoxifen, dose: "20mg", drug_class: "breast_endocrine_therapy", route: "PO", frequency: "daily", probability: 0.4}
    - {drug_id: anastrozole, dose: "1mg", drug_class: "breast_endocrine_therapy", route: "PO", frequency: "daily", probability: 0.3, age_min: 50}
    # Trastuzumab (IV q3weeks) removed per Issue #1319 — cycle-based
    # anti-HER2 biologic, must emit via chemo_regimens.yaml as an IV
    # cycle regimen (a Trastuzumab regimen entry there would be the
    # right follow-up). Prior chronic-med emission produced standalone
    # HER2 therapy MRs on internal-medicine encounters.
  monitoring:
    - {test: "AST", frequency: "every_3_days", intent: "Endocrine therapy hepatic monitoring"}

C61:  # Prostate cancer — androgen deprivation therapy (ADT)
  medications:
    - {drug_id: bicalutamide, dose: "80mg", route: "PO", frequency: "daily", probability: 0.5}
    - {drug_id: leuprolide, dose: "3.75mg", route: "SC", frequency: "monthly", probability: 0.35}
  monitoring:
    - {test: "AST", frequency: "every_3_days", intent: "Anti-androgen hepatic monitoring"}

# --- Obstetric prenatal supplements (Issue #943, gate migrated by META #957 Incr 1) ---
# Standard prenatal supplement pair — folic acid + iron. Not exhaustive of
# pregnancy pharmacology; covers the near-universal supplement floor.
#
# Post-Incr-1 gate: Z34 no longer sits in `PersonRecord.chronic_conditions`,
# so the default activator loop over chronic_conditions never reaches this
# entry. Instead `patient/activator.py` synthesizes a virtual Z34
# `ChronicCondition` for the med-derivation input WHEN the person has a
# non-empty `state_history("pregnancy")` — so this block still fires as
# home medications for women who have (or previously had) a pregnancy in
# the sim window. Proper per-encounter MedicationRequest emission scoped
# to prenatal visits is Incr 1.5.
# ---------------------------------------------------------------------
# Mental health chronic medications — Issue #1281, aligned with META
# #1137 mental-health cluster (closed via axes 1-8; axes landed into
# aging.py / outpatient.py / activator.py rather than a dedicated
# ``modules/mental_health/`` package). First-line SSRI selection per
# APA / VA-DoD (US) and 気分障害治療ガイドライン / 日本うつ病学会 (JP).
# ---------------------------------------------------------------------
# The SSRI selection is mutually exclusive within the `ssri` class —
# a patient receives ONE first-line agent (real US SAMHSA data shows
# ~60-80 % of diagnosed F32/F33 patients on any antidepressant,
# distributed across sertraline / escitalopram / fluoxetine).
# JP first-line preference (sertraline / escitalopram / paroxetine) is
# a shared shape here; the emit path localises the drug name via
# `drug_ja`.
#
# Pre-#1281 F32/F33 patients received zero antidepressant orders
# despite the diagnosis being planted on `chronic_conditions` — every
# other chronic condition (HTN, T2DM, dyslip, COPD, GERD, …) already
# had a chronic-med generator in this file. This block closes the
# neighbouring gap.
#
# Drug catalog note: as of the fix, RxNorm / YJ codes for SSRIs are
# not yet registered in `codes/data/rxnorm.yaml` or the
# `locale/{us,jp}/code_mapping_drug.yaml` files, so the FHIR emit
# path renders `MedicationRequest.medicationCodeableConcept.text`
# only. A follow-up PR will add the codes; the emit path continues
# to work in either state.

F10:  # Alcohol use disorder — MAT (medication-assisted treatment)
  # Issue #1701: F10.2x chronic patients audited at p=2000 5y had zero
  # MAT medications. Standard-of-care for diagnosed AUD (SAMHSA TIP 49
  # 2020; APA 2017 AUD guideline) is any of three FDA-approved agents
  # — naltrexone first-line, acamprosate for maintenance, disulfiram
  # for motivated patients. Real US MAT penetration is 10-20 % of
  # diagnosed cohort (SAMHSA N-SSATS), reflecting under-prescribing.
  # Non-pharm patients route to counselling / 12-step via encounter
  # paths (deferred, tracked under #1698 specialty routing).
  #
  # JP context (Issue #2136): oral naltrexone is not marketed in Japan.
  # 新アルコール・薬物使用障害の診断治療ガイドライン (2018) lists
  # acamprosate (レグテクト), disulfiram (ノックビン), cyanamide and,
  # for drinking reduction, nalmefene (セリンクロ, PMDA-approved 2019);
  # Japan's AUD MAT prescribing rate is markedly lower than the US.
  medications:
    - {drug_id: naltrexone, dose: "50mg", route: "PO", frequency: "daily", probability: 0.15, locale_exclude: ["JP"]}
    - {drug_id: nalmefene, dose: "10mg", route: "PO", frequency: "daily", probability: 0.08, locale_exclude: ["US"]}
    - {drug_id: acamprosate, dose: "666mg", route: "PO", frequency: "tid", probability: 0.08}
    - {drug_id: disulfiram, dose: "250mg", route: "PO", frequency: "daily", probability: 0.03}
  monitoring:
    - {test: "AST", frequency: "every_3_days", intent: "AUD hepatic monitoring (hepatotoxicity + background liver injury)"}
    - {test: "ALT", frequency: "every_3_days", intent: "AUD hepatic monitoring"}

F20:  # Schizophrenia (Issue #2140)
  # Maintenance second-generation antipsychotic monotherapy (APA 2020;
  # 日本神経精神薬理学会 統合失調症薬物治療ガイドライン 2022). About 80-85 %
  # of diagnosed patients are on an antipsychotic; one agent per patient.
  exclusive_classes: ["antipsychotic"]
  medications:
    - {drug_id: aripiprazole, dose: "15mg", drug_class: "antipsychotic", route: "PO", frequency: "daily", probability: 0.30}
    - {drug_id: risperidone, dose: "4mg", drug_class: "antipsychotic", route: "PO", frequency: "daily", probability: 0.25}
    - {drug_id: olanzapine, dose: "10mg", drug_class: "antipsychotic", route: "PO", frequency: "nightly", probability: 0.20}
    - {drug_id: quetiapine, dose: "300mg", drug_class: "antipsychotic", route: "PO", frequency: "bid", probability: 0.08}

F32:  # Depressive episode (single)
  # Issue #1137 cluster axis 6 — severity-gated prescribing per
  # STAR*D / APA / VA-DoD tiered guidance:
  #   mild / moderate   → SSRI monotherapy (first-line)
  #   moderately severe → SSRI + SNRI augmentation candidate
  #   severe            → SSRI + SNRI OR SSRI + atypical
  #                        (Mirtazapine) augmentation
  # SSRI entries have no ``requires_stage_in`` — they are
  # first-line at every severity (including remitted / "none"
  # band patients on maintenance therapy). SNRI entries are
  # restricted to moderate+ (treatment escalation signal) and
  # the atypical augmentation (Mirtazapine) is restricted to the
  # top two bands. Two independent categorical classes: SSRI
  # (first-line) + SNRI (augmentation). Atypicals on a separate
  # exclusive class.
  exclusive_classes: ["ssri", "snri", "atypical_ad"]
  medications:
    - {drug_id: sertraline, dose: "50mg", drug_class: "ssri", route: "PO", frequency: "daily", probability: 0.32}
    - {drug_id: escitalopram, dose: "10mg", drug_class: "ssri", route: "PO", frequency: "daily", probability: 0.22}
    # Issue #1314: Fluoxetine is NOT PMDA-approved for Japan (0 hits
    # in the bundled JP_MedicationCodeYJ_CS_full.json master under
    # フルオキセチン / プロザック). ``locale_exclude`` filters this
    # entry out of the sampler on JP so no unfilled "標準コードなし"
    # placeholder MR emits; residual probability grows the "no ssri"
    # branch (Sertraline / Escitalopram — both PMDA-approved — remain
    # the JP first-line).
    - {drug_id: fluoxetine, dose: "20mg", drug_class: "ssri", route: "PO", frequency: "daily", probability: 0.11, locale_exclude: ["JP"]}
    # SNRI augmentation — moderate+ severity only (STAR*D step 2+).
    - {drug_id: venlafaxine, dose: "75mg", drug_class: "snri", route: "PO", frequency: "daily", probability: 0.08, requires_stage_in: ["PHQ-9 moderate", "PHQ-9 moderately severe", "PHQ-9 severe"]}
    - {drug_id: duloxetine, dose: "30mg", drug_class: "snri", route: "PO", frequency: "daily", probability: 0.07, requires_stage_in: ["PHQ-9 moderate", "PHQ-9 moderately severe", "PHQ-9 severe"]}
    # Atypical augmentation — moderately severe / severe only.
    - {drug_id: mirtazapine, dose: "15mg", drug_class: "atypical_ad", route: "PO", frequency: "nightly", probability: 0.06, requires_stage_in: ["PHQ-9 moderately severe", "PHQ-9 severe"]}

F33:  # Recurrent depressive disorder — same three-class shape + severity gates as F32
  # Recurrent-episode cohort has slightly elevated augmentation
  # probability vs single-episode (treatment-resistance signal),
  # so the Mirtazapine + SNRI probabilities are higher here. The
  # severity gating convention mirrors F32: SNRI at moderate+,
  # atypical at moderately severe+.
  exclusive_classes: ["ssri", "snri", "atypical_ad"]
  medications:
    - {drug_id: sertraline, dose: "50mg", drug_class: "ssri", route: "PO", frequency: "daily", probability: 0.35}
    - {drug_id: escitalopram, dose: "10mg", drug_class: "ssri", route: "PO", frequency: "daily", probability: 0.25}
    # Issue #1314: Fluoxetine NOT PMDA-approved (see F32 note above).
    - {drug_id: fluoxetine, dose: "20mg", drug_class: "ssri", route: "PO", frequency: "daily", probability: 0.12, locale_exclude: ["JP"]}
    - {drug_id: venlafaxine, dose: "75mg", drug_class: "snri", route: "PO", frequency: "daily", probability: 0.10, requires_stage_in: ["PHQ-9 moderate", "PHQ-9 moderately severe", "PHQ-9 severe"]}
    - {drug_id: duloxetine, dose: "30mg", drug_class: "snri", route: "PO", frequency: "daily", probability: 0.08, requires_stage_in: ["PHQ-9 moderate", "PHQ-9 moderately severe", "PHQ-9 severe"]}
    - {drug_id: mirtazapine, dose: "15mg", drug_class: "atypical_ad", route: "PO", frequency: "nightly", probability: 0.08, requires_stage_in: ["PHQ-9 moderately severe", "PHQ-9 severe"]}

F41.1:  # Generalized anxiety disorder — SSRI + SNRI both first-line
  # APA / VA-DoD GAD guidelines: SNRI (Venlafaxine / Duloxetine)
  # AND SSRI both listed as first-line. Bumped SNRI probability
  # accordingly.
  #
  # Issue #1137 cluster axis 6 — severity-gated prescribing:
  # minimal / mild → SSRI only (step 1 per APA);
  # moderate      → SSRI OR SNRI (both first-line);
  # severe        → SSRI + SNRI + optional benzodiazepine bridge.
  # SSRI entries are unconditional (first-line at every severity).
  # SNRI entries are restricted to moderate / severe where
  # augmentation / SNRI first-line is clinically indicated.
  # Benzodiazepine (axis 8) is restricted to severe only AND
  # non-geriatric (age_max 64) per Beers Criteria 2023 avoid-in-
  # elderly guidance (cognitive impairment + fall risk).
  exclusive_classes: ["ssri", "snri", "benzodiazepine"]
  medications:
    - {drug_id: escitalopram, dose: "10mg", drug_class: "ssri", route: "PO", frequency: "daily", probability: 0.28}
    - {drug_id: sertraline, dose: "50mg", drug_class: "ssri", route: "PO", frequency: "daily", probability: 0.22}
    # Issue #1325: Paroxetine is on the AGS Beers Criteria 2023 "avoid"
    # list for adults age ≥ 65 (high anticholinergic burden → cognitive
    # impairment, orthostatic hypotension → fall risk). ``age_max: 64``
    # filters this entry out of the exclusive-class sampler when the
    # patient is 65+; the residual probability mass increases the
    # "no ssri" branch for elderly cohort (Sertraline + Escitalopram
    # are the geriatric first-line, sampled unchanged).
    - {drug_id: paroxetine, dose: "20mg", drug_class: "ssri", route: "PO", frequency: "daily", probability: 0.10, age_max: 64}
    - {drug_id: venlafaxine, dose: "75mg", drug_class: "snri", route: "PO", frequency: "daily", probability: 0.15, requires_stage_in: ["GAD-7 moderate", "GAD-7 severe"]}
    - {drug_id: duloxetine, dose: "30mg", drug_class: "snri", route: "PO", frequency: "daily", probability: 0.10, requires_stage_in: ["GAD-7 moderate", "GAD-7 severe"]}
    # Issue #1137 cluster axis 8 — benzodiazepine as short-term
    # rescue therapy for GAD-7 severe. APA / VA-DoD guidance:
    # benzodiazepines are NOT first-line for GAD (dependence +
    # cognitive-impairment risk, Beers Criteria elderly caution)
    # but ARE indicated for severe acute anxiety as bridge
    # therapy while SSRI/SNRI titrate (4-6 weeks). ``exclusive_
    # classes`` already contains ssri + snri; the new benzo class
    # is a THIRD exclusive bucket (at most one benzodiazepine per
    # patient) emitted only on GAD-7 severe cohort.
    - {drug_id: lorazepam, dose: "0.5mg", drug_class: "benzodiazepine", route: "PO", frequency: "as needed", probability: 0.25, requires_stage_in: ["GAD-7 severe"], age_max: 64}
    - {drug_id: alprazolam, dose: "0.25mg", drug_class: "benzodiazepine", route: "PO", frequency: "as needed", probability: 0.20, requires_stage_in: ["GAD-7 severe"], age_max: 64}

Z34:  # Encounter for supervision of normal pregnancy
  medications:
    - {drug_id: folic_acid, dose: "0.4mg", route: "PO", frequency: "daily"}
    - {drug_id: ferrous_fumarate, dose: "50mg", route: "PO", frequency: "daily", probability: 0.6}
  monitoring:
    - {test: "Hb", frequency: "monthly", intent: "Prenatal hemoglobin monitoring"}

E66.9:  # Obesity, unspecified — BMI 30-40
  # Issue #1137 cluster 2 axis 5 — GLP-1 receptor agonist
  # pharmacotherapy for obesity. Real-world US prescribing has
  # risen sharply since 2022 (Wegovy / Mounjaro market launch) but
  # cost + prior-authorization friction keeps per-patient
  # utilization in the ~5-10 % range for the general obese cohort
  # (BMI 30-40). ``exclusive_classes: ["glp1"]`` so a patient
  # gets at most one GLP-1 agent, not multiple.
  exclusive_classes: ["glp1"]
  medications:
    - {drug_id: semaglutide, dose: "1mg", drug_class: "glp1", route: "SC", frequency: "weekly", probability: 0.05}
    - {drug_id: liraglutide, dose: "1.2mg", drug_class: "glp1", route: "SC", frequency: "daily", probability: 0.03}

E66.01:  # Morbid obesity, BMI >= 40
  # GLP-1 utilization is substantially higher in the morbid-obesity
  # cohort (payer coverage improves, cardiometabolic indication
  # weight gains outweigh friction). Bariatric surgery is a parallel
  # pathway — tracked as a follow-up for the referral-encounter
  # path, not emitted here.
  exclusive_classes: ["glp1"]
  medications:
    - {drug_id: semaglutide, dose: "2.4mg", drug_class: "glp1", route: "SC", frequency: "weekly", probability: 0.15}
    - {drug_id: tirzepatide, dose: "10mg", drug_class: "glp1", route: "SC", frequency: "weekly", probability: 0.10}
    - {drug_id: liraglutide, dose: "3mg", drug_class: "glp1", route: "SC", frequency: "daily", probability: 0.05}
