# Issue #3428: the `dose` strings of the disease protocols that carry a free-text
# annotation, condition or schedule. Each is looked up whole (as the tail of a
# "drug dose" order string, or alone as a dosage text) before any word-level
# substitution, so a Japanese record reads as a prescription, not as a mixture.
# Keyed as the CIF carries the string; matching is case-insensitive.
