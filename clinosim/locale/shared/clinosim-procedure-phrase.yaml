# clinosim Procedure Phrase Display Catalog — EN ↔ JA display mapping for
# the free-text procedure phrases that CIF Order.display_name and
# ProcedureRecord.description carry from disease YAMLs (Suture closure,
# Short arm cast, Foley catheter insertion, Observation, …).
#
# META #1849 Phase 5 Step 2.d: these entries used to live in
# `clinosim/locale/shared/drug_names_ja.yaml` under the "Non-drug orders",
# "Dialysis", "Ventilation", "Interventional procedures", "Procedures
# (ED)", "Procedures (order-derived)", and "PE/DVT treatment" comment
# blocks. They are not drugs; the mapping was tactically placed in that
# file because `_localize_drug_name` is the generic string-translation
# helper the FHIR Procedure emit path (`procedures/procedures.py`) falls
# back to when no SNOMED/CPT/K-code binding is available.
#
# This catalog is the semantic home for these entries. Loader unions it
# into the same `_load_narrative_display_dict()` return value so no caller change
# is required.
#
# Scope: the free-text procedure phrases appearing in CIF
# Order.display_name / ProcedureRecord.description across disease YAMLs
# that have no authoritative code (SNOMED / CPT / JP K-code) binding yet.
# Keys use the exact form the CIF ships; the emit-time normalizer at
# `_localize_drug_name` strips "_" → " " and a leading "key:" prefix
# before lookup.
#
# Non-goals:
#   - SNOMED / CPT / K-code binding. If an authoritative code becomes
#     available, the entry migrates to the appropriate authority yaml
#     (`snomed-ct.yaml`, `cpt.yaml`, `k-codes.yaml`) and the FHIR emit
#     path begins carrying `coding[]` instead of only `.text` fallback.
#   - Imaging exam names. Those migrate separately via
#     `clinosim-imaging-exam-name.yaml` (Phase 5 Step 2.e, PR #1863).

metadata:
  kind: translation-table
  name: clinosim Procedure Phrase Display Catalog
  description: >
    EN → JA display mapping for free-text procedure phrases used in CIF
    Order.display_name and ProcedureRecord.description. Not a FHIR
    CodeSystem — this catalog exists only for display localization at
    FHIR emit time.

procedures:
  # --- PE/DVT treatment / 血栓症治療 ---
  Sequential compression devices: {ja: "間欠的空気圧迫装置"}
  therapeutic_anticoagulation: {ja: "治療的抗凝固療法"}
  therapeutic anticoagulation: {ja: "治療的抗凝固療法"}

  # --- Non-drug orders (procedures classified as medication in CIF) ---
  Ice pack application: {ja: "氷嚢貼付"}
  Ice pack to affected area: {ja: "患部への氷嚢貼付"}
  Heat pack application: {ja: "温罨法"}
  Suture closure: {ja: "縫合閉創"}
  Skin staples: {ja: "スキンステープル"}
  Peripheral IV line: {ja: "末梢静脈ライン確保"}  # Issue #2627 (protocol "IV_access: Peripheral IV line")
  Tissue adhesive: {ja: "組織接着剤"}
  Nasal packing: {ja: "鼻腔パッキング"}
  Cervical collar application: {ja: "頸椎カラー装着"}
  Cardiac monitoring: {ja: "心電図モニタリング"}
  Closed reduction: {ja: "徒手整復"}
  Neurological observation: {ja: "神経学的観察"}
  Sling immobilization: {ja: "三角巾固定"}
  Short arm splint: {ja: "前腕シーネ固定"}
  Posterior splint: {ja: "後方シーネ固定"}
  Sugar-tong splint pending surgery: {ja: "術前シュガートングシーネ固定"}
  Short arm cast: {ja: "前腕ギプス固定"}
  Elastic bandage wrap: {ja: "弾性包帯巻"}
  Non-adherent dressing: {ja: "非固着性ドレッシング"}
  Reassurance and breathing exercises: {ja: "安心させる言葉かけと呼吸訓練"}
  Incentive spirometry instruction: {ja: "インセンティブ・スパイロメトリー指導"}
  Observation and monitoring: {ja: "経過観察"}
  Observation: {ja: "経過観察"}
  Oral fluids encouraged: {ja: "経口水分摂取励行"}
  Dark room rest: {ja: "暗室安静"}
  Cool water irrigation: {ja: "冷水洗浄"}
  Wound irrigation with normal saline: {ja: "生理食塩液による創部洗浄"}

  # --- Dialysis / 透析 ---
  Hemodialysis: {ja: "血液透析"}

  # --- Ventilation / 呼吸管理 ---
  NIV_BiPAP: {ja: "非侵襲的陽圧換気 (BiPAP)"}
  NIV BiPAP: {ja: "非侵襲的陽圧換気 (BiPAP)"}
  Intubation and mechanical ventilation: {ja: "気管挿管・人工呼吸管理"}
  # Issue #1701 Phase 4d.1 — chronic OSA follow-up (G47.30 cohort).
  CPAP therapy: {ja: "CPAP 療法"}
  Polysomnography: {ja: "ポリソムノグラフィー"}

  # --- Interventional procedures / 手技 ---
  Vertebroplasty: {ja: "椎体形成術"}
  Percutaneous vertebroplasty: {ja: "経皮的椎体形成術"}
  Silver nitrate cauterization: {ja: "硝酸銀による焼灼"}
  Procedural sedation: {ja: "手技時鎮静"}
  Catheter-directed thrombolysis: {ja: "カテーテル血栓溶解療法"}
  Foley catheter insertion: {ja: "膀胱留置カテーテル挿入"}
  # Compound-phrase entries (Phase 1d-65) — cover the high-frequency
  # procedure_orders `detail` phrases that leak partially localized
  # (`urinary カテーテル: フォーリーカテーテル の perioperative period`)
  # through the drug-name substring matcher. Adding whole-phrase entries
  # gives the matcher a longer, higher-precedence hit.
  Foley catheter for perioperative period: {ja: "周術期の膀胱留置カテーテル"}
  urinary catheter: {ja: "膀胱留置カテーテル"}
  perioperative period: {ja: "周術期"}

  # --- Procedures (ED) / 処置 ---
  Foreign body removal with 25G needle: {ja: "25G針による異物除去"}
  Rust ring removal with burr: {ja: "バーによる錆輪除去"}

  # --- Procedures (order-derived, Issue #861) / 処置(オーダー由来) ---
  # The 3 order-derived Procedure kinds whose CIF Order.display_name
  # ships as "key: description" and hit the FHIR emit site at
  # clinosim/modules/output/fhir_r4/lib/inline_bb.py:697 without any
  # JA localization prior to this addition. `_localize_drug_name` strips
  # the "key:" prefix and looks up the cleaned form here, so the entries
  # below key on the post-strip form.
  Graduated compression stocking on unaffected leg: {ja: "弾性ストッキング(患側外・段階的圧迫)"}
  Cervical collar until cleared: {ja: "頚椎固定(頚椎カラー・画像判定まで)"}
  Emergent dialysis stat: {ja: "緊急透析"}
