# Standardised Mortality Ratios (SMR) for chronic conditions.
#
# Consumed by `clinosim.modules.population.mortality` (Issue #2167). The
# forward annual community-death draw scales the life-table qx by the
# person's combined SMR divided by the mean combined SMR of living persons
# in the same 5-year band and sex, so the cohort stays at the life-table
# level while comorbid persons die earlier.
#
# `smr_table` is sparse by design: entries without an ICD listed get
# SMR = 1.0 (no mortality effect). The clinical rule of thumb used
# below is "lifestyle / early-stage" conditions sit near 1.1-1.5,
# "advanced / major-organ" conditions sit at 2.0-3.0, cancer-prefix
# and heart-failure sit at the top.
#
# References:
#   - MI/CAD SMR 2.0-2.5 — Yeh RW et al, NEJM 2010; 362:2155-65.
#   - CHF SMR 3.0-5.0 — Mozaffarian D et al, Circulation 2016; 133.
#   - COPD GOLD mean SMR 2.5 — Celli BR, AHA Scientific Stmt 2015.
#   - CKD stage 3-5 SMR 2.0-4.0 — Thompson S et al, KI 2013; 85.
#   - Type 2 DM SMR 1.5 — Rao Kondapally Seshasai S et al, Lancet 2014.
#   - Dementia SMR ~2.0 — Garcia-Ptacek S et al, J Alz Dis 2016.
#   - Nicotine dependence SMR ~1.4 — CDC MMWR 2018 smoking vs never.
#   - Current depression / recurrent SMR 1.3 — Gilman SE et al, JAMA Psy 2017.

smr_table:
  # Hypertensive disease
  "I10": 1.3     # Essential hypertension
  "I11": 1.5     # Hypertensive heart disease
  "I12": 1.5     # Hypertensive renal disease
  # Ischaemic heart disease / arrhythmia
  "I21": 2.5     # Acute MI history
  "I25": 2.0     # Chronic IHD
  "I48": 1.5     # Atrial fibrillation
  "I50": 3.0     # Heart failure (CHF)
  # Metabolic
  "E11": 1.5     # Type 2 DM
  "E11.9": 1.5   # Type 2 DM, w/o complications
  "E78": 1.1     # Dyslipidemia
  "E66": 1.2     # Obesity
  # Respiratory
  "J44": 2.5     # COPD
  "J45": 1.1     # Asthma
  # Renal
  "N18": 2.0     # CKD (any stage, pooled)
  # Mental / behavioural
  "F03": 2.0     # Dementia, unspecified
  "F11.20": 6.0  # Opioid dependence — all-cause SMR 6-10 (Larney 2020 JAMA Psychiatry; Issue #2146)
  "F17.210": 1.4 # Nicotine dependence, cigarettes
  "F20": 2.5     # Schizophrenia — all-cause SMR ~2-3 (Saha 2007 Arch Gen Psychiatry; Issue #2140)
  "F31": 2.0     # Bipolar disorder — all-cause SMR ~2 (Hayes 2015 World Psychiatry; Issue #2142)
  "F32": 1.3     # Depressive episode
  "F33": 1.3     # Recurrent depressive disorder
  "F41.1": 1.1   # Generalised anxiety

# Combine method for a person with multiple ICDs in `smr_table`.
# "geometric_mean" of the listed SMR values: a 3-condition person
# with [2.0, 2.0, 3.0] gets SMR = (2.0 * 2.0 * 3.0) ** (1/3) = 2.29,
# bounded multiplicative — avoids runaway at 5+ comorbidities while
# preserving the direction that more severe conditions → higher SMR.
combine_method: "geometric_mean"
