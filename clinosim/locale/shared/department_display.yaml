# Department display names (locale-independent key -> per-language display).
#
# Used by the FHIR adapter for Organization.name (facility bundle) and
# Encounter.serviceType (display + text). Keys are the internal department ids
# resolved by simulator.helpers.resolve_department (see hospital config
# `available_departments` / `department_rollup`).
#
# EN: standard department/specialty names. JA: 日本の標榜診療科名.
# `specialty_snomed` is the SNOMED CT specialty of the department, used for
# PractitionerRole.specialty (display from codes/data/snomed-ct.yaml), so the
# service type and the specialty of the same department agree (Issue #2270).
# Codes are SNOMED CT specialties (isa 394658006), tx.fhir.org $lookup
# 2026-11-05 (Issue #2625; #3157). trauma_surgery, medical_social_work and
# health_checkup have no specialty concept and carry none.
# Read through `department_display()`; a missing language falls back to
# English and a missing key is humanised (never title-cased).
metadata:
  kind: display-table
  name: department_display
  source: clinosim

departments:
  internal_medicine: {en: "Internal Medicine", ja: "内科", specialty_snomed: "419192003"}
  cardiology: {en: "Cardiology", ja: "循環器内科", specialty_snomed: "394579002"}
  pulmonology: {en: "Pulmonology", ja: "呼吸器内科", specialty_snomed: "418112009"}
  gastroenterology: {en: "Gastroenterology", ja: "消化器内科", specialty_snomed: "394584008"}
  nephrology: {en: "Nephrology", ja: "腎臓内科", specialty_snomed: "394589003"}
  endocrinology: {en: "Endocrinology", ja: "内分泌・代謝内科", specialty_snomed: "394583002"}
  neurology: {en: "Neurology", ja: "神経内科", specialty_snomed: "394591006"}
  general_surgery: {en: "General Surgery", ja: "外科", specialty_snomed: "394609007"}
  orthopedics: {en: "Orthopedic Surgery", ja: "整形外科", specialty_snomed: "394801008"}
  neurosurgery: {en: "Neurosurgery", ja: "脳神経外科", specialty_snomed: "394610002"}
  trauma_surgery: {en: "Trauma Surgery", ja: "外傷外科"}
  emergency_medicine: {en: "Emergency Medicine", ja: "救急科", specialty_snomed: "773568002"}
  anesthesiology: {en: "Anesthesiology", ja: "麻酔科", specialty_snomed: "394577000"}
  primary_care: {en: "Primary Care", ja: "総合診療科", specialty_snomed: "394814009"}
  obstetrics_gynecology: {en: "Obstetrics and Gynecology", ja: "産婦人科", specialty_snomed: "394585009"}
  pediatrics: {en: "Pediatrics", ja: "小児科", specialty_snomed: "394537008"}
  ophthalmology: {en: "Ophthalmology", ja: "眼科", specialty_snomed: "394594003"}
  psychiatry: {en: "Psychiatry", ja: "精神科", specialty_snomed: "394587001"}
  radiology: {en: "Radiology", ja: "放射線科", specialty_snomed: "394914008"}
  rehabilitation: {en: "Rehabilitation", ja: "リハビリテーション科", specialty_snomed: "394602003"}
  # CY6-01 (Chain-6, session 44 backfill): allied-health service lines added
  # so PractitionerRole.organization refs to allied-health staff resolve.
  nutrition: {en: "Clinical Nutrition", ja: "栄養管理科", specialty_snomed: "1256115008"}
  medical_social_work: {en: "Medical Social Work", ja: "医療社会事業科"}
  # Issue #1280 Sub-A: oncology service line (chronic cancer follow-up
  # + chemo infusion visits now route here). Sub-lines are rollup-mapped
  # to this bucket at hospitals without dedicated radiation-oncology /
  # medical-oncology facilities.
  oncology: {en: "Oncology", ja: "腫瘍内科", specialty_snomed: "394593009"}
  # Issue #2270: support departments that staff are assigned to.
  # Issue #3157: 1255736009 Clinical pathology / 1258957008 Hospital pharmacy
  # specialization (tx.fhir.org $lookup, International Edition 2025-02-01).
  laboratory: {en: "Laboratory", ja: "検査科", specialty_snomed: "1255736009"}
  pharmacy: {en: "Pharmacy", ja: "薬剤科", specialty_snomed: "1258957008"}
  # Issue #3153: the health-checkup unit (健診センター) the opt-in
  # health_checkup module's encounters belong to; its checkups are done by
  # the internal-medicine / primary-care physicians.
  health_checkup: {en: "Health Checkup Center", ja: "健診センター"}
