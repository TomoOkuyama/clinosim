# --- Bone / 骨代謝 ---
Calcium/Vitamin D: "カルシウム/ビタミンD"
Calcitonin nasal spray: "カルシトニン点鼻"
Calcium carbonate + vitamin D: "炭酸カルシウム/ビタミンD"
