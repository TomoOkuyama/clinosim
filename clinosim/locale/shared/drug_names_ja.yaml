# English drug name → Japanese drug name mapping
# Used by FHIR adapter to localize medicationCodeableConcept.text for JP output.
# Keys are matched case-insensitively against the base drug name (before dose/route).
#
# Sources: 医薬品添付文書 (PMDA), 薬価基準収載医薬品コード (YJ code)

# --- Antibiotics / 抗菌薬 ---
# Amoxicillin/Clavulanate → amoxicillin_clavulanate catalog + alias (META #1849 Phase 5 Step 2).
# Cefcapene pivoxil → cefcapene_pivoxil catalog drug_id (META #1849 Phase 5 Step 2.b; MHLW YJ 6132016F2038, フロモックス).
# Cefditoren pivoxil → clinosim-admin-form-display.yaml (META #1849 Phase 5 Step 2 admin-form; catalog cefditoren JA bare "セフジトレン" lacks pivoxil specificity).
# Trimethoprim-sulfamethoxazole (deprecated hyphen) + Trimethoprim/Sulfamethoxazole (slash)
# → trimethoprim_sulfamethoxazole catalog + aliases (META #1849 Phase 5 Step 2).
# JA display unifies to catalog "スルファメトキサゾール／トリメトプリム" (fullwidth slash) — cosmetic diff from legacy halfwidth form, no clinical difference.

# --- Antiviral / 抗ウイルス薬 ---

# --- Analgesics / 鎮痛薬 ---
# Acetaminophen/codeine → acetaminophen_codeine catalog + alias (META #1849 Phase 5 Step 2).
# NSAID → loxoprofen catalog alias (META #1849 Phase 5 Step 2;
# `locale/jp/code_mapping_drug.yaml` substitutes "NSAID" → Loxoprofen).

# --- Cardiovascular / 循環器系 ---
# Adrenaline → epinephrine catalog alias (META #1849 Phase 5 Step 2).
# JA display unifies to catalog "エピネフリン" (PMDA preferred current;
# "アドレナリン" is legacy pre-2006 公定書). MHLW YJ 2451400A1030.
# Prothrombin complex concentrate / (4F-PCC) / 4-factor PCC (Kcentra)
# → prothrombin_complex_concentrate catalog + aliases (META #1849 Phase 5 Step 2).
# Catalog JA unified to "乾燥濃縮人プロトロンビン複合体" (matches hot7.yaml).
# MHLW YJ 6343449D1024 (ケイセントラ).
# Unfractionated Heparin → clinosim-admin-form-display.yaml (META #1849 Phase 5 Step 2 admin-form; catalog heparin JA bare "ヘパリン" loses UFH/LMWH distinction).

# --- Respiratory / 呼吸器系 ---
# Ipratropium → catalog drug_id (META #1849 Phase 5 Step 2.a).
# Salbutamol → albuterol aliases (META #1849 Phase 5 Step 2.g).

# --- GI / 消化器系 ---
# Buscopan / Butylscopolamine → butylscopolamine catalog aliases (META #1849 Phase 5 Step 2).
# JA display unifies to catalog "ブチルスコポラミン臭化物" (bromide-salt-specific — chemical
# refinement over legacy generic "ブチルスコポラミン"). MHLW YJ 1242002F1330.
# Daikenchuto / Dai-kenchu-to → daikenchuto catalog drug_id + alias (META #1849 Phase 5 Step 2.b; MHLW YJ 5200092C1025, JP Kampo).
# Sodium bicarbonate oral → clinosim-admin-form-display.yaml (META #1849 Phase 5 Step 2 admin-form; oral-route specific).

# --- Endocrine / 内分泌系 ---
# Regular insulin / Regular human insulin → clinosim-admin-form-display.yaml
# (META #1849 Phase 5 Step 2 admin-form; specific formulations distinct from
# catalog insulin bare "インスリン"). MHLW YJ 2492403A4051 (ヒューマリンR).

# --- Neurology / 神経系 ---

# --- Psychotropic / 向精神薬 (SSRI / SNRI / atypical antidepressant + anxiolytic) ---
# Phase 1c-4 (2026-09-23): observed as JA ed_workup investigational-drug
# leaks (Escitalopram) and referenced by the LLM prompt Rule 2 mental-
# health cadence (see narrative_seed_bundle.yaml Issue #1405 mapping).

# --- Bone / 骨代謝 ---
# Calcium/Vitamin D + Calcium carbonate + vitamin D → calcium_carbonate_vitamin_d catalog + aliases (META #1849 Phase 5 Step 2).
# Calcitonin nasal spray → clinosim-admin-form-display.yaml (META #1849 Phase 5 Step 2 admin-form; nasal-route specific).
# Calcium gluconate → calcium_gluconate catalog drug_id (META #1849 Phase 5 Step 2.a; MHLW YJ 3213001X1010 カルチコール).
# Elcatonin → elcatonin catalog drug_id (META #1849 Phase 5 Step 2.b; MHLW YJ 3999401A1200, エルシトニン).

# --- Urology / 泌尿器系 ---

# --- Antihistamines / 抗ヒスタミン薬 ---
# Silver nitrate → silver_nitrate catalog drug_id (META #1849 Phase 5 Step 2.a).

# --- Others / その他 ---
# Albumin → clinosim-admin-form-display.yaml (META #1849 Phase 5 Step 2;
# drug-side generic "アルブミン" display intentionally distinguished from
# albumin_human catalog entry "人血清アルブミン" plasma product; lab-side
# "Albumin → アルブミン" uses the separate `_localize_lab_name` path).
Camostat mesilate: "カモスタットメシル酸塩"
# Human serum albumin → albumin_human catalog alias (META #1849 Phase 5 Step 2; MHLW YJ 6343410X1088 献血アルブミン).
# Magnesium Sulfate / Magnesium sulfate → magnesium_sulfate catalog drug_id + alias (META #1849 Phase 5 Step 2.a; MHLW YJ 2355002X1075).
# Nafamostat → nafamostat catalog drug_id (META #1849 Phase 5 Step 2.b; MHLW YJ 3999407D1181, 注射用フサン).

# --- Oncology / 抗癌剤・分子標的薬 (session 104 Issue #1168) ---
# Entries mirror the drug_ja fields already declared in
# `chronic_medications.yaml` (chronic outpatient regimens for C-code
# cancer patients) and `chemo_regimens.yaml` (inpatient chemo). Pre-104
# these katakana were only wired through the CIF `drug_ja` field but
# never registered in `drug_names_ja.yaml`, so the FHIR-adapter
# `_localize_drug_name` post-processor missed them and the LLM narrative
# leaked bare English names into JP output (Osimertinib 11× /
# Sorafenib 9× / Lenvatinib 9× observed in the session-104 H100 p=100
# verify).
BCG: "BCG（膀胱内注入療法）"                # MHLW HOT7 (BCG 膀胱内注入用、Issue #1310)
"BCG intravesical": "BCG（膀胱内注入療法）" # disease-YAML alias form
# Leuprorelin → leuprolide aliases (META #1849 Phase 5 Step 2.g).
# Nab-paclitaxel / Nab_paclitaxel / nab-Paclitaxel → nab_paclitaxel catalog drug_id + aliases
# (META #1849 Phase 5 Step 2.a; MHLW HOT7, アルブミン懸濁型 Issue #1310).

# --- IV fluids / 輸液 ---
# Normal saline / NS / IV normal saline → normal_saline catalog + aliases (META #1849 Phase 5 Step 2; RxCUI 9863 sodium chloride IN).
# Lactated Ringer / Lactated Ringers / Lactated Ringer's / Lactated Ringer's solution / LR → lactated_ringer_solution catalog + aliases (META #1849 Phase 5 Step 2).
# Ringers → ringer_solution catalog + alias (META #1849 Phase 5 Step 2; MHLW YJ 3319539A1082).
# Hypertonic Saline → clinosim-admin-form-display.yaml (META #1849 Phase 5 Step 2; 3% NaCl concentration variant).
# Crystalloid → clinosim-admin-form-display.yaml (META #1849 Phase 5 Step 2; IV fluid class label).
# KCl → potassium_chloride aliases (META #1849 Phase 5 Step 2.g).

# --- Sedation/Anesthesia / 鎮静・麻酔 ---

# --- Vaccines / ワクチン ---
# Tetanus toxoid → tetanus_toxoid catalog drug_id (META #1849 Phase 5 Step 2.a).

# --- PE/DVT treatment procedures + non-drug procedures + dialysis +
#     ventilation + interventional procedures + ED procedures +
#     order-derived procedures ---
# Migrated to `clinosim/codes/data/clinosim-procedure-phrase.yaml` under
# META #1849 Phase 5 Step 2.d. Loader `_load_drug_names_ja` unions that
# catalog into the returned dict so no caller change was needed.
# `Broad spectrum antibiotic` is a drug-class label (not a procedure);
# left here pending Phase 5 Step 2.f (drug class labels → drug_classes.yaml).
# Broad spectrum antibiotic → clinosim-admin-form-display.yaml (META #1849 Phase 5 Step 2; vague class label).

# --- Ophthalmic / 眼科用薬 ---
# Ofloxacin ophthalmic → clinosim-admin-form-display.yaml (META #1849 Phase 5 Step 2 admin-form; ophthalmic-route specific).

# --- Imaging exam names (Issue #862) / 画像検査名 ---
# Migrated to `clinosim/codes/data/clinosim-imaging-exam-name.yaml` under
# META #1849 Phase 5 Step 2.e. Loader `_load_drug_names_ja` unions that
# catalog into the returned dict so no caller change was needed.

# --- Combination inhalers / 配合吸入剤 (Issue #852) ---
# ICS/LABA inhaler + ICS/LABA → clinosim-admin-form-display.yaml
# (META #1849 Phase 5 Step 2; combo inhaler class labels used in asthma_exacerbation.yaml).

# --- Allergens / アレルゲン ---
# Migrated to `clinosim/codes/data/clinosim-allergen-substance.yaml` under
# META #1849 Phase 5 Step 2.c. Loader `_load_drug_names_ja` unions that
# catalog into the returned dict so no caller change was needed.
