# English drug name → Japanese drug name mapping
# Used by FHIR adapter to localize medicationCodeableConcept.text for JP output.
# Keys are matched case-insensitively against the base drug name (before dose/route).
#
# Sources: 医薬品添付文書 (PMDA), 薬価基準収載医薬品コード (YJ code)

# --- Antibiotics / 抗菌薬 ---
Amoxicillin/Clavulanate: "アモキシシリン/クラブラン酸"
# Cefcapene pivoxil → cefcapene_pivoxil catalog drug_id (META #1849 Phase 5 Step 2.b; MHLW YJ 6132016F2038, フロモックス).
Cefditoren pivoxil: "セフジトレンピボキシル"
# DEPRECATED 2026-06-27 — Trimethoprim-sulfamethoxazole hyphen form is legacy
# alias; use slash form Trimethoprim/Sulfamethoxazole everywhere. Remove this
# alias after one release cycle if no new callers appear.
Trimethoprim-sulfamethoxazole: "スルファメトキサゾール/トリメトプリム"
Trimethoprim/Sulfamethoxazole: "スルファメトキサゾール/トリメトプリム"

# --- Antiviral / 抗ウイルス薬 ---

# --- Analgesics / 鎮痛薬 ---
Acetaminophen/codeine: "アセトアミノフェン/コデイン"
NSAID: "ロキソプロフェン"                  # code_mapping substitutes NSAID → Loxoprofen (YJ 1149019C1149)

# --- Cardiovascular / 循環器系 ---
Adrenaline: "アドレナリン"                 # MHLW YJ 2451400A1030 (alias of Epinephrine)
Prothrombin complex concentrate: "乾燥濃縮人プロトロンビン複合体"   # MHLW YJ 6343449D1024 (ケイセントラ)
Prothrombin complex concentrate (4F-PCC): "乾燥濃縮人プロトロンビン複合体"
4-factor PCC (Kcentra): "乾燥濃縮人プロトロンビン複合体"
Unfractionated Heparin: "未分画ヘパリン"

# --- Respiratory / 呼吸器系 ---
# Ipratropium → catalog drug_id (META #1849 Phase 5 Step 2.a).
# Salbutamol → albuterol aliases (META #1849 Phase 5 Step 2.g).

# --- GI / 消化器系 ---
Buscopan: "ブチルスコポラミン"
Butylscopolamine: "ブチルスコポラミン"     # MHLW YJ 1242002F1330 (ブスコパン; 臭化物) — chemical-name alias of Buscopan
# Daikenchuto / Dai-kenchu-to → daikenchuto catalog drug_id + alias (META #1849 Phase 5 Step 2.b; MHLW YJ 5200092C1025, JP Kampo).
Sodium bicarbonate oral: "経口炭酸水素ナトリウム"

# --- Endocrine / 内分泌系 ---
Regular insulin: "レギュラーインスリン"
Regular human insulin: "ヒトインスリン"    # MHLW YJ 2492403A4051 (ヒューマリンR; 遺伝子組換え)

# --- Neurology / 神経系 ---

