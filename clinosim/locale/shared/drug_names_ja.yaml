# --- Combination inhalers / 配合吸入剤 (Issue #852) ---
# `ICS/LABA inhaler` appears verbatim in asthma_exacerbation.yaml as the
# regimen order. Map both the full multi-word form and the "ICS/LABA"
# short form so any downstream text that carries the short form still
# localizes correctly.
"ICS/LABA inhaler": "吸入ステロイド／β2刺激薬配合吸入剤"
"ICS/LABA": "吸入ステロイド／β2刺激薬配合"

