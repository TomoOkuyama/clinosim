# --- Others / その他 ---
Albumin: "アルブミン"
Camostat mesilate: "カモスタットメシル酸塩"
Human serum albumin: "人血清アルブミン"    # MHLW YJ 6343410X1088 (献血アルブミン)
# Magnesium Sulfate / Magnesium sulfate → magnesium_sulfate catalog drug_id + alias (META #1849 Phase 5 Step 2.a; MHLW YJ 2355002X1075).
# Nafamostat → nafamostat catalog drug_id (META #1849 Phase 5 Step 2.b; MHLW YJ 3999407D1181, 注射用フサン).

# --- Oncology / 抗癌剤・分子標的薬 (session 104 Issue #1168) ---
# Entries mirror the drug_ja fields already declared in
# `chronic_medications.yaml` (chronic outpatient regimens for C-code
# cancer patients) and `chemo_regimens.yaml` (inpatient chemo). Pre-104
# these katakana were only wired through the CIF `drug_ja` field but
# never registered in `drug_names_ja.yaml`, so the FHIR-adapter
# `_localize_drug_name` post-processor missed them and the LLM narrative
# leaked bare English names into JP output (Osimertinib 11× /
# Sorafenib 9× / Lenvatinib 9× observed in the session-104 H100 p=100
# verify).
BCG: "BCG（膀胱内注入療法）"                # MHLW HOT7 (BCG 膀胱内注入用、Issue #1310)
"BCG intravesical": "BCG（膀胱内注入療法）" # disease-YAML alias form
# Leuprorelin → leuprolide aliases (META #1849 Phase 5 Step 2.g).
# Nab-paclitaxel / Nab_paclitaxel / nab-Paclitaxel → nab_paclitaxel catalog drug_id + aliases
# (META #1849 Phase 5 Step 2.a; MHLW HOT7, アルブミン懸濁型 Issue #1310).

# --- IV fluids / 輸液 ---
IV normal saline: "生理食塩液"
Normal saline: "生理食塩液"
NS: "生理食塩液"
Lactated Ringer: "乳酸リンゲル液"
Lactated Ringers: "乳酸リンゲル液"          # plural alias (MHLW YJ 3319534A4046 = ラクテック注)
Lactated Ringer's: "乳酸リンゲル液"          # apostrophe alias
Lactated Ringer's solution: "乳酸リンゲル液"
Ringers: "リンゲル液"                       # MHLW YJ 3319539A1082 (リンゲル液)
LR: "乳酸リンゲル液"
Hypertonic Saline: "高張食塩液"
Crystalloid: "晶質液"
# KCl → potassium_chloride aliases (META #1849 Phase 5 Step 2.g).

