# English drug name → Japanese drug name mapping
# Used by FHIR adapter to localize medicationCodeableConcept.text for JP output.
# Keys are matched case-insensitively against the base drug name (before dose/route).
#
# Sources: 医薬品添付文書 (PMDA), 薬価基準収載医薬品コード (YJ code)

# --- Antibiotics / 抗菌薬 ---
Amoxicillin/Clavulanate: "アモキシシリン/クラブラン酸"
Cefcapene pivoxil: "セフカペンピボキシル"
Cefditoren pivoxil: "セフジトレンピボキシル"
# DEPRECATED 2026-06-27 — Trimethoprim-sulfamethoxazole hyphen form is legacy
# alias; use slash form Trimethoprim/Sulfamethoxazole everywhere. Remove this
# alias after one release cycle if no new callers appear.
Trimethoprim-sulfamethoxazole: "スルファメトキサゾール/トリメトプリム"
Trimethoprim/Sulfamethoxazole: "スルファメトキサゾール/トリメトプリム"

