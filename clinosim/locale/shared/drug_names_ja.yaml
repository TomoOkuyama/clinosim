# English drug name → Japanese drug name mapping
# Used by FHIR adapter to localize medicationCodeableConcept.text for JP output.
# Keys are matched case-insensitively against the base drug name (before dose/route).
#
# Sources: 医薬品添付文書 (PMDA), 薬価基準収載医薬品コード (YJ code)

