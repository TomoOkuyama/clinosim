# clinosim/locale/shared/drug_substitution.yaml
# Generic indication-driven alternative drug pool for drug_safety.suggest_alternative.
# Consulted after disease_ctx alternative_* blocks (see spec §4.4) and before
# returning None. Schema documented in
# clinosim/modules/drug_safety/reference_data/README.md.
#
# Every candidate is re-checked via check_pair against the caller's active_meds
# list, so an alternative that would form its own contraindication is skipped
# and the iterator moves to the next entry.
#
# Phase 2.b of META #1804: entries carry ``drug_id`` references into
# clinosim/codes/data/drugs.yaml; the engine resolves display (en + ja)
# via clinosim.codes.drugs.resolve_drug so this file no longer
# duplicates names.

indications:
  pain_management:
    description: "General analgesia when NSAID or opioid is contraindicated."
    alternatives:
      - drug_id: acetaminophen
        default_dose: "500mg"
        default_route: "PO"
        default_frequency: "q6h_prn"

  hypertension_or_rate_control:
    description: "BP or heart-rate control when a specific antihypertensive class is contraindicated."
    alternatives:
      - drug_id: amlodipine
        default_dose: "5mg"
        default_route: "PO"
        default_frequency: "daily"
      - drug_id: candesartan
        default_dose: "8mg"
        default_route: "PO"
        default_frequency: "daily"
