# Annual HbA1c trajectory for diagnosed diabetes (E11 / E10).
#
# Consumed by `clinosim.modules.population.aging._disease_progression`
# (Issue #1581 DM extension). Unlike CKD / COPD / HF / CCS / dementia
# which have discrete stage strings, diabetes glycemic control is a
# continuous axis — HbA1c is derived from this axis at encounter time
# via `physiology.engine.hba1c_from_glycemic_control`, and the sim
# tracks the axis year-indexed on `PersonRecord.glycemic_trajectory`
# so a year-1 encounter reports a different HbA1c than a year-10
# encounter.
#
# Model: `gc_next = clamp(gc_prev + rng.normal(gc_drift_mean,
# gc_drift_sd), gc_min, gc_max)` once per year. First-touch sampling
# mirrors the activator's `gc_draw = rand()^3` formula so initial-
# touch cohort distribution matches the activator-only path.
#
# Clinical basis:
#   - UKPDS 33 (Lancet 1998): HbA1c in Type 2 DM under conventional
#     care drifts up ~0.2-0.3 %/yr over 10-year follow-up.
#   - DCCT (NEJM 1993): Type 1 DM tight-control arm ~0.1 %/yr,
#     conventional arm ~0.3 %/yr.
#   - Modern GLP-1 RA / SGLT2i can hold or reverse the trend —
#     therapy-conditional refinement is a planned Phase 3 concern
#     (same framing as HF HFrEF vs HFpEF conditioning).
#
# `gc_drift_mean` is negative (worsening control over time). With
# the `HBA1C_SPAN` constant in `physiology.engine` currently 8.0 %,
# a `gc_drift_mean` of -0.025 corresponds to ~+0.2 %/yr HbA1c, i.e.
# the UKPDS natural history.

glycemic_trajectory:
  E11:
    gc_drift_mean: -0.025   # ~+0.2 %/yr HbA1c under baseline care (UKPDS)
    gc_drift_sd: 0.015      # per-year random noise
    gc_min: 0.0
    gc_max: 1.0

  E10:
    gc_drift_mean: -0.030   # Type 1 slightly faster uncontrolled decline (DCCT conventional)
    gc_drift_sd: 0.015
    gc_min: 0.0
    gc_max: 1.0
