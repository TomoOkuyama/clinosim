# Sex-locked ICD-10 codes — anatomy-appropriate diagnosis dispatch (Issue #947).
#
# Scope: every diagnosis-dispatch site in the generator (differential-final
# picker, implied-chronic table, discharge-Dx → chronic propagation, chronic
# activator, outpatient chronic-followup dispatch) MUST consult this table
# before assigning a Condition / Encounter.reasonCode to a patient.
#
# Format: base codes (no dot) OR full ICD-10 codes; matcher first tries the
# exact code, then the base (part before the first dot). Prefixes are NOT
# supported here — spell out every locked code you actually emit. That keeps
# the lock explicit (grep-able) and avoids over-locking near-neighbor codes
# outside the anatomical chapter (e.g. N39.0 acute UTI is NOT sex-locked
# even though it lives in the same block as N40).
#
# Source: ICD-10 Volume 2 (WHO) sex-specific chapter exclusions plus obvious
# anatomy locks (prostate, testis, ovary, uterus, cervix, breast — female-
# side only for the interim; the ~1% male breast cancer case is deferred
# until the generator can model it explicitly).
#
# Policy: when a dispatch site (differential, implied-chronic, chronic
# propagation) picks a code that is locked for the OPPOSITE sex:
#
#   * differential picker → walk to the next-ranked sex-compatible candidate
#     (bounded, non-RNG; the candidate order already carries the probability
#     ranking so this is a "redraw" that consumes NO fresh RNG state — safe
#     for cross-platform determinism).
#   * implied-chronic table + chronic propagation → skip the assignment
#     (there is no RNG draw at these sites; they iterate a static table).
#
# Adding a new entry: (a) put the code here, (b) add a comment naming the
# anatomy + the sex the code is locked TO (male_only means "emit for males
# only"; the enforcement point rejects opposite-sex assignment), (c) run
# the regression test `tests/unit/test_sex_gating.py`. No further code
# edits — every dispatch site funnels through
# `clinosim.simulator.sex_gating.is_sex_locked_for`.

male_only:
  # N40–N51 male-genital-organ diseases (ICD-10 chapter XIV block N40–N51)
  - "N40"    # Hyperplasia of prostate (BPH)
  - "N41"    # Inflammatory diseases of prostate (includes N41.0 急性前立腺炎)
  - "N41.0"  # Acute prostatitis — the specific record cited in Issue #947
  - "N41.1"  # Chronic prostatitis
  - "N41.2"  # Abscess of prostate
  - "N41.3"  # Prostatocystitis
  - "N41.8"  # Other inflammatory diseases of prostate
  - "N41.9"  # Inflammatory disease of prostate, unspecified
  - "N42"    # Other disorders of prostate
  - "N43"    # Hydrocele and spermatocele
  - "N44"    # Torsion of testis (ICD-10 2016+; noninflammatory disorders of testis)
  - "N45"    # Orchitis and epididymitis
  - "N46"    # Male infertility
  - "N47"    # Redundant prepuce, phimosis and paraphimosis
  - "N48"    # Other disorders of penis
  - "N49"    # Inflammatory disorders of male genital organs, NEC
  - "N50"    # Other disorders of male genital organs
  - "N51"    # Disorders of male genital organs in diseases classified elsewhere
  # C60–C63 malignant neoplasms of male genital organs
  - "C60"    # Penis
  - "C61"    # Prostate
  - "C62"    # Testis
  - "C63"    # Other and unspecified male genital organs

