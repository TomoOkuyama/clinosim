  # C50–C58 malignant neoplasms of breast + female genital organs.
  # NOTE: C50 (breast) has a ~1% male incidence in the real world. This
  # generator currently has no male-breast-cancer path, so we lock C50 as
  # female-only for the interim. Revisit when male-breast-cancer is modeled
  # explicitly (out of scope for #947).
  - "C50"    # Malignant neoplasm of breast
  - "C51"    # Malignant neoplasm of vulva
  - "C52"    # Malignant neoplasm of vagina
  - "C53"    # Malignant neoplasm of cervix uteri
  - "C54"    # Malignant neoplasm of corpus uteri
  - "C55"    # Malignant neoplasm of uterus, part unspecified
  - "C56"    # Malignant neoplasm of ovary
  - "C57"    # Malignant neoplasm of other and unspecified female genital organs
  - "C58"    # Malignant neoplasm of placenta
  # Pregnancy/newborn contact codes (Z34/Z37) and the "single liveborn"
  # mother-side birth-outcome code (Z37) — locked female-only.
  # Z38 is a NEWBORN's code (assigned to the baby, not the mother). We do
  # NOT lock Z38 here because the newborn's own sex is independent; if the
  # generator ever emits Z38 on a mother's record that's a separate bug.
  - "Z34"    # Encounter for supervision of normal pregnancy
  - "Z37"    # Outcome of delivery
