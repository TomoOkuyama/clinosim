# Lab analyte display names — the one table for every output (Issue #2267).
#
# Keyed by a lower-cased lab token: the canonical lab name the simulator
# stores (`lab_constants.yaml` units, `lab_panels.yaml` panels, lowered),
# plus the alternate spellings that protocols, narrative templates and LLM
# text use (`hgb`, `total bilirubin`, ...). Lookup lower-cases the token and
# turns whitespace into `_`.
#
# Entry: {en, ja, formal?: {<lang>: ...}}
#   en / ja  — the clinician short form used in prose: narrative lab lists,
#              LLM prompts and output, DiagnosticReport.conclusion.
#   formal   — the full analyte name, only where it differs from the short
#              form; used for FHIR Observation.code.text and the JP-CLINS
#              LocalCode display of analytes with no standard code.
# Every entry carries `en` (fallback for any other language).
# Add a language: add `<lang>: <display>` to the entries.
# Read through `clinosim.locale.loader.lab_display(name, lang, style=...)`.

