# LLM prompt-time locale labels (Phase 1d-2, 2026-09-23).
#
# Extracted from the module-level ``_XXX_JA`` / ``_XXX_LABELS`` dicts
# previously embedded in
# ``clinosim/modules/document/narrative/replacement_strategy.py``.
# Consumers: the LLM ``_build_extra_context`` pipeline uses these to
# turn CIF enum-style tokens (``inpatient`` / ``walk_in`` / ``mild`` /
# ``nasal_cannula`` / ``dependent`` / ``employer_group`` / …) into a
# clinician-natural anchor phrase before the JA prompt is rendered.
#
# Adding a new language (fr / zh / …): extend each entry with
# ``<lang>: <display>`` and update ``_localize_token`` /
# ``_lookup_ja_label`` callers to pass the new lang code. No code
# change required inside this repository beyond that.
#
# Structure: ``<section>: {<slug>: {<lang>: <display>}}``.
# Two flavours coexist:
#   - JA-only sections (encounter_type, disposition, severity, …)
#     carry only the ``ja`` slot; EN falls back to the raw slug at
#     lookup time (matches pre-refactor behaviour).
#   - Multi-lang sections (smoking, marital, occupation, insurance, …)
#     carry both ``ja`` and ``en`` slots.

