# Diabetic neuropathy onset (E11.42) — event pattern.
#
# Phase 3 of the longitudinal state-evolution subsystem (Issue #1697).
#
# Clinical basis: Dyck PJ et al, Neurology 1993;43:817 (Rochester
# Diabetic Neuropathy Study); Pop-Busui R et al, Diabetes Care
# 2017;40:136 (ADA position statement on diabetic neuropathy).
# Cumulative polyneuropathy incidence ~2 %/yr in diagnosed T2DM;
# A1c > 9.0 roughly doubles the rate. Phase 3 uses E11.42 (diabetic
# polyneuropathy); autonomic + mononeuropathy subcodes defer to Phase 4.

attribute_id: dm_neuropathy_onset_e11_42
pattern: event
depends_on: [hba1c]
clinical_scope:
  # Phase 3 ships T2DM (E11) complications only; T1DM (E10) neuropathy
  # (emits_icd would be E10.42) is deferred to Phase 4 companion yaml.
  requires_chronic_codes: ["E11"]
  requires_age_band: [18, 120]

event_name: dm_neuropathy_onset
emits_icd: E11.42
base_annual_rate: 0.020
rate_modifiers:
  - when: {attribute: hba1c, operator: ">", value: 9.0}
    factor: 2.5
  - when: {attribute: hba1c, operator: ">", value: 7.5}
    factor: 1.3
one_shot: true
narrative_label:
  en: "Diabetic neuropathy onset"
  ja: "糖尿病性神経障害発症"
source:
  - "Dyck PJ et al. Rochester Diabetic Neuropathy Study prevalence. Neurology 1993;43:817."
  - "Pop-Busui R et al. Diabetic Neuropathy: a position statement by the American Diabetes Association. Diabetes Care 2017;40:136."
