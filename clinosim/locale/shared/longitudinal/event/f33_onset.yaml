# F33 adult-chronic onset — event pattern (Phase 4b.2.β).
#
# Recurrent depressive disorder — ~30 % of F32 cohort per DSM registry.
#
# Migrated from `clinosim/modules/population/aging.py::_annual_chronic_onset`
# (retired in the same PR). Age-band rates derived via the Phase 2
# `_derive_annual_incidence_from_prevalence` band-diff formula against
# the point-prevalence rows in `clinosim/locale/us/demographics.yaml::
# chronic_prevalence.F33`. See spec §7 for migration rationale.

attribute_id: f33_onset
pattern: event
clinical_scope:
  requires_age_band: [18, 120]

event_name: f33_onset
emits_icd: F33
base_annual_rate: 0.0
base_rate_by_age_band:
  - {age_lo: 40, age_hi: 59, rate: 0.000000}
  - {age_lo: 60, age_hi: 99, rate: 0.000000}
rate_modifiers:
  - when: {has_chronic_prefix: ['E10', 'E11']}
    factor: 2.0   # diabetes_depression (R3 revisit: prefix match covers E11.9 / E10.9 sub-codes)
  - when: {has_chronic_prefix: ['I50']}
    factor: 2.0   # heart_failure_depression (R3: prefix covers I50.9 sub-codes)
  - when: {has_chronic_prefix: ['C']}
    factor: 2.5   # cancer_depression
  - when: {has_chronic: ['I69.3', 'I69.1']}
    factor: 2.0   # post_stroke_depression
one_shot: true
narrative_label: f33_onset
source: >
  Migrated 2026-10-21 from demographics.yaml::chronic_prevalence verbatim
  (band-diff λ via _derive_annual_incidence_from_prevalence). See
  Phase 4b.2.β plan docs/superpowers/plans/2026-10-21-phase-4b2b-annual-chronic-onset-migration.md.
