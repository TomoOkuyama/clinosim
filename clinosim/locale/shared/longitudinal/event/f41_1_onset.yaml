# F41.1 adult-chronic onset — event pattern (Phase 4b.2.β).
#
# Generalized anxiety disorder — NIMH ~3.1 % adult 12-mo.
#
# Migrated from `clinosim/modules/population/aging.py::_annual_chronic_onset`
# (retired in the same PR). Age-band rates derived via the Phase 2
# `_derive_annual_incidence_from_prevalence` band-diff formula against
# the point-prevalence rows in `clinosim/locale/us/demographics.yaml::
# chronic_prevalence.F41.1`. See spec §7 for migration rationale.

attribute_id: f41_1_onset
pattern: event
clinical_scope:
  requires_age_band: [18, 120]

event_name: f41_1_onset
emits_icd: F41.1
base_annual_rate: 0.0
base_rate_by_age_band:
  - {age_lo: 18, age_hi: 39, rate: 0.000000}
  - {age_lo: 40, age_hi: 59, rate: 0.000000}
  - {age_lo: 60, age_hi: 99, rate: 0.000000}
rate_modifiers:
  - when: {has_chronic_prefix: ['E10', 'E11']}
    factor: 1.5   # diabetes_anxiety (R3 revisit: prefix match covers E11.9 / E10.9 sub-codes)
  - when: {has_chronic_prefix: ['I50']}
    factor: 1.5   # heart_failure_anxiety (R3: prefix covers I50.9 sub-codes)
  - when: {has_chronic_prefix: ['C']}
    factor: 2.0   # cancer_anxiety
one_shot: true
narrative_label: f41_1_onset
source: >
