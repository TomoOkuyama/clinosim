# Lipid high-intensity statin switch — event pattern.
#
# Phase 4b.1 of the longitudinal state-evolution subsystem (Issue #1697).
# Base rate 40 %/yr under uncontrolled LDL (> 160 mg/dL), gated OUT when
# LDL ≤ 160 via a factor-zero modifier.
#
# Clinical basis: ACC-AHA 2018 Cholesterol Guideline (Grundy et al,
# Circulation 2019), Section 4.4.1 intensification pathway. Rosuvastatin
# 20mg is the representative high-intensity statin (equivalent to
# Atorvastatin 40mg per STELLAR). Real-world uptake slower than guideline
# due to statin intolerance and clinician inertia (NHANES LDL gap data).

attribute_id: lipid_escalate_high_intensity_e78
pattern: event
depends_on: [ldl]
clinical_scope:
  requires_chronic_codes: ["E78"]
  requires_age_band: [18, 120]

event_name: lipid_escalate_high_intensity_e78
emits_icd: ""
emits_meds: ["Rosuvastatin"]
# #1754 fix: statin intensification is a SUBSTITUTION, not a stack.
# ACC/AHA 2018 Cholesterol Guideline specifies switching from moderate-
# intensity (Atorvastatin 10-20 mg) to high-intensity (Rosuvastatin
# 20-40 mg or Atorvastatin 40-80 mg) — concurrent prescribing of two
# statins is a therapeutic duplication (increased myopathy /
# rhabdomyolysis risk without added LDL benefit). Pre-fix the cohort
# carried dual Atorvastatin + Rosuvastatin in 14.7 % of p=10k 5y US
# patients because this event emitted the new agent without retracting
# the baseline. ``removes_meds`` names the baseline agent carried by
# the chronic_medications.yaml E78 regimen (Atorvastatin), which the
# engine retracts from ``person.current_medications`` when the event
# fires.
removes_meds: ["Atorvastatin"]
fire_marker: lipid_escalate_high_intensity_e78
base_annual_rate: 0.40
rate_modifiers:
  - when: {attribute: ldl, operator: "<=", value: 160.0}
    factor: 0.0
one_shot: true
narrative_label:
  en: "Lipid high-intensity statin switch"
  ja: "脂質異常症 高強度スタチン 切替"
source:
  - "Grundy SM et al. 2018 ACC/AHA Cholesterol Guideline. Circulation 2019;139:e1082."
  - "STELLAR Trial — Jones PH et al. Am J Cardiol 2003;92:152 (Rosuvastatin equivalence tables)."
