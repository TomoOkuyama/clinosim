# Lipid high-intensity statin switch — retired event (Issue #2927).
#
# Phase 4b.1 of the longitudinal state-evolution subsystem (Issue #1697)
# switched a dyslipidemia patient to Rosuvastatin 20 mg at 40 %/yr while
# the `ldl` latent (labs/ldl_trajectory.yaml) was above 160 mg/dL. That
# latent is the untreated LDL (target 165) and never reflects the statin
# the patient takes, so patients whose measured on-treatment LDL was at
# goal were still moved to high intensity.
#
# A statin is now stepped up only on the measured LDL: the lipid panel at
# the chronic follow-up visit and the titration of
# simulator/statin_monitoring.py (Issue #2877; thresholds in
# simulator/reference_data/statin_monitoring.yaml — US 2018 ACC/AHA:
# LDL >= 190 mg/dL, >= 70 with clinical ASCVD; JP JAS 2022 targets), on
# the LDL the statin lowers (physiology/statin_response.py, Issue #2917).
#
# The event is kept at base_annual_rate 0.0 rather than deleted: the
# engine draws one `year_rng` number per in-scope person-year for every
# event, and the attributes after this one in the dispatch order (onset
# events, cancer / stroke stage ladders, the `sbp` latent, HTN escalation)
# draw from the same generator. Keeping the draw leaves those unchanged
# for every patient who was never switched; only patients who were (and
# so stopped drawing in later years under `one_shot`) see a later draw
# move.
#
# Clinical basis of the original switch: ACC-AHA 2018 Cholesterol
# Guideline (Grundy et al, Circulation 2019), Section 4.4.1. Rosuvastatin
# 20 mg is a high-intensity statin (equivalent to Atorvastatin 40 mg per
# STELLAR).

attribute_id: lipid_escalate_high_intensity_e78
pattern: event
depends_on: [ldl]
clinical_scope:
  requires_chronic_codes: ["E78"]
  requires_age_band: [18, 120]

event_name: lipid_escalate_high_intensity_e78
emits_icd: ""
emits_meds: ["rosuvastatin"]
# #1754 fix: statin intensification is a SUBSTITUTION, not a stack.
# ACC/AHA 2018 Cholesterol Guideline specifies switching from moderate-
# intensity (Atorvastatin 10-20 mg) to high-intensity (Rosuvastatin
# 20-40 mg or Atorvastatin 40-80 mg) — concurrent prescribing of two
# statins is a therapeutic duplication (increased myopathy /
# rhabdomyolysis risk without added LDL benefit). Pre-fix the cohort
# carried dual Atorvastatin + Rosuvastatin in 14.7 % of p=10k 5y US
# patients because this event emitted the new agent without retracting
# the baseline. ``removes_meds`` names the baseline agent carried by
# the chronic_medications.yaml E78 regimen (Atorvastatin), which the
# engine retracts from ``person.current_medications`` when the event
# fires.
removes_meds: ["atorvastatin"]
fire_marker: lipid_escalate_high_intensity_e78
# Issue #2927: retired — never fires (see the header).
base_annual_rate: 0.0
one_shot: true
narrative_label:
  en: "Lipid high-intensity statin switch"
  ja: "脂質異常症 高強度スタチン 切替"
source:
  - "Grundy SM et al. 2018 ACC/AHA Cholesterol Guideline. Circulation 2019;139:e1082."
  - "STELLAR Trial — Jones PH et al. Am J Cardiol 2003;92:152 (Rosuvastatin equivalence tables)."
