# Gastric cancer (C16) — AJCC 8 Markov stage ladder.
#
# Phase 4c of the longitudinal state-evolution subsystem (Issue #1701).
# Scoped to C16-carrying patients of any age (pediatric gastric cancer
# exists but is extremely rare; age gate stays [0, 120]).
#
# Clinical calibration (gastric cancer under adjuvant fluoropyrimidine):
#   initial — diagnostic-presentation-selected cohort (symptomatic → more
#     advanced at diagnosis); mild skew toward later stages
#   I→II:  0.15/yr   II→III: 0.10/yr   III→IV: 0.08/yr
#   IV absorbing (further mortality via the C16 SMR in population/mortality.py)

attribute_id: gastric_cancer_stage_c16
pattern: markov
depends_on: []
clinical_scope:
  requires_chronic_codes: ["C16"]
  requires_age_band: [0, 120]

state_name: gastric_cancer_stage
icd_base: C16
states: ["AJCC I", "AJCC II", "AJCC III", "AJCC IV"]
initial_distribution:
  "AJCC I": 0.15
  "AJCC II": 0.30
  "AJCC III": 0.35
  "AJCC IV": 0.20
transitions:
  "AJCC I":
    "AJCC II": 0.15
  "AJCC II":
    "AJCC III": 0.10
  "AJCC III":
    "AJCC IV": 0.08
  "AJCC IV": {}
narrative_label:
  en: "Gastric cancer stage"
  ja: "胃癌 ステージ"
source:
  - "Amin MB et al. AJCC Cancer Staging Manual 8e, Stomach Chapter 17. Springer 2017."
  - "Japanese Gastric Cancer Association. Treatment Guidelines (JGCA 2021)."
  - "Howlader N et al. SEER Cancer Statistics Review, 1975-2020. NCI 2024 (gastric 5y relative survival)."
