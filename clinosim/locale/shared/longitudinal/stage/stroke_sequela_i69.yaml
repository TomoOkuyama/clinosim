# I69 Sequelae of Cerebrovascular Disease (base-code fallback) — Markov mRS.
#
# Phase 2 of the longitudinal state-evolution subsystem (Issue #1696).
#
# Covers I69.0 (SAH sequela), I69.2 (other sequela), and bare I69 codes
# — any sub-code not explicitly broken out above. Loses to the I69.3 /
# I69.1 yamls via engine._select_markov_winners longest-prefix precedence
# when the person carries a specific sub-code.
#
# Clinical basis: inherits the I69.3 ischemic trajectory shape since
# ischemic strokes dominate incidence; a dedicated I69.0 (SAH) curve
# could be split later per Rinkel 2016 Nat Rev Neurol SAH natural history.

attribute_id: stroke_sequela_stage_i69
pattern: markov
depends_on: []
clinical_scope:
  requires_chronic_codes: ["I69"]
  requires_age_band: [0, 120]

state_name: stroke_sequela_stage
icd_base: I69
states: ["mRS 0", "mRS 1", "mRS 2", "mRS 3", "mRS 4", "mRS 5"]
initial_distribution:
  "mRS 0": 0.10
  "mRS 1": 0.20
  "mRS 2": 0.25
  "mRS 3": 0.20
  "mRS 4": 0.15
  "mRS 5": 0.10
transitions:
  "mRS 0": {"mRS 1": 0.080}
  "mRS 1": {"mRS 2": 0.070}
  "mRS 2": {"mRS 3": 0.060}
  "mRS 3": {"mRS 4": 0.050}
  "mRS 4": {"mRS 5": 0.040}
  "mRS 5": {}
narrative_label:
  en: "modified Rankin Scale"
  ja: "mRS 段階"
source:
  - "Hankey GJ et al. Long-term risk of first recurrent stroke in the Perth Community Stroke Study. Stroke 2000;31:2080."
