# Systolic BP (SBP) trajectory — AR(1) latent.
#
# Phase 4b.1 of the longitudinal state-evolution subsystem (Issue #1697).
# Scoped to adults carrying I10-I15 HTN chronic. Unlike bmi_drift, there
# is no Layer-1 BP seed on PersonRecord (BP lives on PatientProfile only),
# so the yaml initial: block is the actual base-year distribution for
# every HTN adult. A future phase that adds PersonRecord.systolic_bp can
# slot in a population/engine.py seed step mirroring the BMI pattern.
#
# Clinical calibration:
#   phi 0.80       — within-individual annual SBP tracking (Framingham + ALLHAT)
#   sigma 8 mmHg   — innovation SD (JNC 8 between-visit BP variability minus 3 mmHg measurement noise)
#   target 145     — uncontrolled HTN cohort median (JNC 8 untreated stage-1 range)
#   clamp [90,220] — hypotension floor to hypertensive-emergency ceiling

attribute_id: sbp
pattern: ar1
depends_on: []
clinical_scope:
  requires_chronic_codes: ["I1"]
  requires_age_band: [18, 120]

latent_name: sbp
ar1:
  phi: 0.80
  sigma: 8.0
  mean_reversion_target: 145.0
clamp: [90.0, 220.0]
initial:
  mu: 4.976   # exp(4.976) ≈ 145 — HTN cohort entry median (no Layer-1 anchor)
  sigma: 0.08
narrative_label:
  en: "Systolic BP trajectory"
  ja: "収縮期血圧 推移"
source:
  - "Whelton PK et al. 2017 ACC/AHA Hypertension Guideline. JACC 2018;71:e127."
  - "James PA et al. JNC 8 report. JAMA 2014;311:507."
  - "Framingham longitudinal BP tracking + ALLHAT 5y follow-up (ALLHAT Officers, JAMA 2002;288:2998)."
