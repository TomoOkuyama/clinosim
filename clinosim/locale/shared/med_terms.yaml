# Multi-language medication dosage / category / term catalog
# (Phase 1d-3, 2026-09-23).
#
# Previously ``med_terms_ja.yaml`` (JA-only flat map). Restructured to
# ``{key: {lang: display}}`` so adding a new target language (fr / zh /
# ko / …) is a data change — extend each entry with ``<lang>: <display>``.
#
# Consumers: ``clinosim.locale.free_text._localize_dosage_terms(text, lang)`` applies these as
# case-insensitive word-boundary substitutions (categories first,
# longest-key-first per section, all-uppercase keys stay case-sensitive
# to avoid tail-of-word collisions like ``po`` inside ``clopidogrel``).
#
# EN slots are omitted for ordinary English terms: the source language for
# dosage / route / category text is English, so ``lang=en`` output is a
# pass-through for them. Issue #2650: a protocol slug (``iv_fluid``,
# ``pain_management``) carries an ``en`` slot so English text names the
# treatment for a reader; ``localize_drug_name(..., "en")`` applies only the
# entries that have one.
#
# Loader: ``clinosim.locale.loader.load_med_terms``.

metadata:
  kind: translation-table
  name: med_terms
  source: clinosim

