# Medication hold reasons (clinosim/simulator/medication_pipeline.py,
# Issue #2405): the reason text authored in disease YAMLs (`reason:`) → its
# English and Japanese display. A reason not listed displays as written.
metadata:
  kind: display-table
  name: medication_hold_reasons
  source: clinosim

reasons:
  "AKI — ACE-I blocks efferent arteriolar tone, worsens renal hemodynamics (KDIGO 2012 § 3.5.2)":
    en: "acute kidney injury (ACE-I blocks efferent arteriolar tone — KDIGO 2012 § 3.5.2)"
    ja: "急性腎障害 (ACE 阻害薬 — 輸出細動脈トーン抑制、腎血行動態悪化、KDIGO 2012 § 3.5.2)"
  "AKI — ARB same efferent-arteriole mechanism as ACE-I (KDIGO 2012 § 3.5.2)":
    en: "acute kidney injury (ARB — same efferent-arteriole mechanism as ACE-I, KDIGO 2012 § 3.5.2)"
    ja: "急性腎障害 (ARB — ACE 阻害薬と同じ輸出細動脈機序、KDIGO 2012 § 3.5.2)"
  "AKI — NSAIDs contraindicated in renal impairment (afferent arteriolar vasoconstriction)":
    en: "acute kidney injury (NSAID contraindication — afferent arteriolar vasoconstriction)"
    ja: "急性腎障害 (NSAID — 輸入細動脈収縮のため腎機能低下下では禁忌)"
  "AKI — lactic acidosis risk, renal clearance impaired":
    en: "acute kidney injury (lactic acidosis + impaired renal clearance risk)"
    ja: "急性腎障害 (乳酸アシドーシス・腎排泄障害のリスクのため保留)"
  "AKI: NSAIDs held (worsen renal perfusion)":
    en: "AKI (NSAID renal-perfusion hold)"
    ja: "急性腎障害 (NSAID による腎灌流悪化)"
  "AKI: RAAS blockade held per KDIGO 2012 § 3.5.2":
    en: "AKI (KDIGO 2012 § 3.5.2 RAAS hold)"
    ja: "急性腎障害 (KDIGO 2012 § 3.5.2 RAAS 抑制保留)"
  "Active intracranial hemorrhage — anticoagulation contraindicated":
    en: "active intracranial hemorrhage (anticoagulant contraindicated)"
    ja: "頭蓋内出血の活動性 (抗凝固薬は禁忌のため保留)"
  "Active intracranial hemorrhage — antiplatelet contraindicated":
    en: "active intracranial hemorrhage (antiplatelet contraindicated)"
    ja: "頭蓋内出血の活動性 (抗血小板薬は禁忌のため保留)"
  "Acute HF exacerbation — oral diuretic replaced by IV furosemide":
    en: "acute HF exacerbation (oral diuretic held, IV furosemide substituted)"
    ja: "急性心不全増悪 (経口利尿薬を保留し静注フロセミドに切替)"
  "Acute illness with lactic acidosis risk + NPO status":
