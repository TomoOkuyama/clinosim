  CN: {en: nurse, ja: 看護師}
  DR: {en: physician, ja: 医師}
  NS: {en: nurse, ja: 看護師}
  OT: {en: occupational therapist, ja: 作業療法士}
  PH: {en: pharmacist, ja: 薬剤師}
  PT: {en: physical therapist, ja: 理学療法士}
  RT: {en: respiratory therapist, ja: 呼吸療法士}
  ST: {en: speech therapist, ja: 言語聴覚士}
