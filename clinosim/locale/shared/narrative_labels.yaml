# Narrative renderer label tables (Phase 1d-15, 2026-09-23).
#
# Extracted from the 12 module-level ``_XXX_JA`` / ``_XXX_EN`` dict
# constants previously embedded in
# ``clinosim/modules/document/narrative/template_generator.py``. Same
# ``{section: {slug: {lang: display}}}`` shape as Phase 1d-2
# ``llm_prompt_labels.yaml``.
#
# Adding a new target language (fr / zh / …) extends each entry with
# ``<lang>: <display>``. No code change needed.
#
# Loader: ``clinosim.locale.loader.load_narrative_labels()``.

