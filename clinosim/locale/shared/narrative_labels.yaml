# Narrative renderer label tables (Phase 1d-15, 2026-09-23).
#
# Extracted from the 12 module-level ``_XXX_JA`` / ``_XXX_EN`` dict
# constants previously embedded in
# ``clinosim/modules/document/narrative/template_generator.py``. Same
# ``{section: {slug: {lang: display}}}`` shape as Phase 1d-2
# ``llm_prompt_labels.yaml``.
#
# Adding a new target language (fr / zh / …) extends each entry with
# ``<lang>: <display>``. No code change needed.
#
# Loader: ``clinosim.locale.loader.load_narrative_labels()``.

metadata:
  kind: display-table
  name: narrative_labels
  source: clinosim

shift_labels:
  day: {en: day, ja: 日勤}
  evening: {en: evening, ja: 準夜}
  night: {en: night, ja: 深夜}
family_relation:
  FTH: {en: father, ja: 父}
  MTH: {en: mother, ja: 母}
  NSIB: {en: sibling, ja: 兄弟姉妹}
ed_acuity_reason:
  mild: {en: mild symptoms, ja: 症状軽度}
  moderate: {en: ongoing symptoms, ja: 症状継続}
  severe: {en: severe symptoms, ja: 症状重度}
rp_therapy_type:
  OT: {en: Occupational therapy (OT), ja: 作業療法(OT)}
  PT: {en: Physical therapy (PT), ja: 理学療法(PT)}
  ST: {en: Speech therapy (ST), ja: 言語聴覚療法(ST)}
rp_progress:
  improved: {en: improved, ja: 改善}
  stable: {en: stable, ja: 維持}
  unable_to_assess: {en: unable to assess, ja: 評価不能}
rp_participation:
  fair: {en: fair, ja: やや不良}
  good: {en: good, ja: 良好}
  refused: {en: refused, ja: 拒否}
rp_phase:
  early: {en: 'Early phase (bed exercises, sitting practice)', ja: 早期(ベッド上運動・座位保持練習)}
  late: {en: 'Late phase (independent ambulation, ADL practice)', ja: 後期(独立歩行・ADL練習)}
  mid: {en: 'Mid phase (walker ambulation, transfer training)', ja: 中期(歩行器歩行・移乗動作練習)}

# Phase 1d-16 additions (2026-09-24): newborn FHIR emit + code-system
# selector + physical-exam body-system labels. Extracted from
# ``clinosim/modules/newborn/fhir_emit.py`` (8 Pattern C sites, 2 dict
# tables) and ``clinosim/modules/document/narrative/template_generator.py``
# (ICD system, body_system dicts).

# Observation.category text for newborn FHIR resources.
newborn_category_text:
  exam: {en: Exam, ja: 身体所見}
  survey: {en: Survey, ja: 評価スコア}
  vital_signs: {en: Vital Signs, ja: バイタルサイン}
  # Issue #3031: metabolic-screen Observation / DiagnosticReport / order.
  laboratory: {en: Laboratory, ja: 検体検査}
  laboratory_procedure: {en: Laboratory procedure, ja: 臨床検査}

# Morse fall-risk band in Observation.interpretation.text (Issue #3031).
fall_risk_level:
  low: {en: low, ja: 低}
  moderate: {en: moderate, ja: 中}
  high: {en: high, ja: 高}

# Chronic-disease rating scale names for the stage-scale Observation
# code.text (Issue #3031). Japanese records write the scale abbreviation.
stage_scale:
  mrs: {en: Modified Rankin Scale, ja: 修正Rankinスケール（mRS）}
  hy: {en: Hoehn and Yahr stage, ja: Hoehn-Yahr重症度}
  edss: {en: Expanded Disability Status Scale score, ja: 総合障害度評価尺度 (EDSS)}
  cdr: {en: Clinical Dementia Rating Global score, ja: CDR全般スコア}

# Observation.code text for newborn FHIR resources.
newborn_code_text:
  transcutaneous_bilirubin: {en: Transcutaneous bilirubin, ja: 経皮ビリルビン}

# Apgar score display per minute (was ``_APGAR_MINUTE_DISPLAY_JA/EN`` in fhir_emit.py).
newborn_apgar_minute:
  '1': {en: 1 minute Apgar Score, ja: アプガースコア (1 分)}
  '5': {en: 5 minute Apgar Score, ja: アプガースコア (5 分)}

# CCHD pulse-ox site display for Observation.code.text
# (was ``_CCHD_SITE_DISPLAY_JA[site] if is_ja else f"SpO2 ({site})"``).
newborn_cchd_site:
  right_hand: {en: SpO2 (right hand), ja: SpO2 右手 (動脈管前)}
  foot: {en: SpO2 (foot), ja: SpO2 足 (動脈管後)}

# CCHD bodySite.text (was ``_CCHD_SITE_DISPLAY_JA[site] if is_ja else site_snomed[1]``).
newborn_cchd_body_site:
  right_hand: {en: Right upper arm, ja: 右手 (動脈管前)}
  foot: {en: Foot, ja: 足 (動脈管後)}

# Metabolic-screen Specimen collection text fallbacks.
newborn_specimen_body_site:
  heel: {en: Heel, ja: 踵}
newborn_specimen_method:
  heel_stick: {en: Heel-stick capillary blood collection, ja: 踵採血 (毛細血管採血)}

# Metabolic-screen outcome short text for conclusionCode.text.
newborn_screen_outcome_text:
  pass: {en: Pass, ja: 陰性 (パス)}
  refer: {en: Refer, ja: 要精査}

# ICD code-system name for the trailing ``[code]`` bracket in
# narrative Condition renders. JA locale uses the base ``icd-10``
# system; EN uses the US clinical modification ``icd-10-cm``.
code_system_icd_display:
  primary: {en: icd-10-cm, ja: icd-10}

# ICD code-system lookup key for the FHIR emit-side ``get_display``
# helper (JP uses the MHLW-augmented code system).
code_system_icd_lookup:
  primary: {en: icd-10-cm, ja: icd-10-mhlw}

# Physical-exam per-body-system labels (was ``body_system_labels_ja/en``
# in template_generator.py``_format_physical_exam``).
body_system:
  general: {en: General, ja: 一般状態}
  cardiovascular: {en: Cardiovascular, ja: 循環器}
  respiratory: {en: Respiratory, ja: 呼吸器}
  abdominal: {en: Abdomen, ja: 腹部}
  neurological: {en: Neurological, ja: 神経}
  psychiatric: {en: Mental status, ja: 精神状態}

# Sex-label vocabulary used in patient demographics prose.
# Keys mirror the values ``PatientProfile.sex`` may carry
# (``"male" / "female"`` in the demographics field, plus the
# single-letter aliases the CIF permits).
sex_label:
  male: {en: male, ja: 男性}
  female: {en: female, ja: 女性}
  m: {en: male, ja: 男性}
  f: {en: female, ja: 女性}

# Op-note anesthesia_type dictionary (Phase 1d-24). Was module-level
# ``_OP_ANESTHESIA_JA`` / ``_OP_ANESTHESIA_EN`` in template_generator.py.
op_anesthesia_type:
  general: {en: General anesthesia, ja: 全身麻酔}
  spinal: {en: Spinal anesthesia, ja: 脊髄くも膜下麻酔}
  epidural: {en: Epidural anesthesia, ja: 硬膜外麻酔}
  local: {en: Local anesthesia, ja: 局所麻酔}
  sedation: {en: IV sedation, ja: 静脈麻酔（鎮静）}
  regional: {en: Regional anesthesia, ja: 区域麻酔}

# Op-note SNOMED outcome-code dictionary (Phase 1d-24). Was
# ``_OP_OUTCOME_JA`` / ``_OP_OUTCOME_EN``.
op_outcome_code:
  '385669000': {en: successful, ja: 順調に終了}
  '385670004': {en: 'partially successful (minor intraop complications)', ja: '部分的成功（軽度合併症あり）'}
  '385671000': {en: unsuccessful, ja: 不成功}

# Procedure-note analgesia_type dictionary (Phase 1d-25).
# Was inline dict in ``build_pn_analgesia``. Fallback is
# ``local`` (bedside procedures default).
pn_analgesia_type:
  local: {en: local anesthesia, ja: 局所麻酔}
  sedation: {en: monitored intravenous sedation, ja: 静脈内鎮静（監視下）}
  spinal: {en: spinal anesthesia, ja: 脊椎麻酔}
  general: {en: general anesthesia, ja: 全身麻酔}

# Procedure-note SNOMED outcome-code narrative phrases (Phase 1d-25).
# Different wording than op_outcome_code — this is the "手技は…した"
# sentence-style narrative used inside build_pn_course. Fallback
# is 手技は概ね予定通りに完遂した / The procedure was completed as planned.
pn_outcome_code:
  '385669000': {en: The procedure was completed without issue, ja: 手技は問題なく完遂した}
  '385670004': {en: The procedure was partially completed, ja: 手技は部分的に完遂した}
  '385671000': {en: The procedure could not be completed, ja: 手技は完遂できなかった}

# DDS severity vocabulary (Phase 1d-26). Was ``_dds_severity_ja/en``
# helper methods in template_generator.py. JA locale falls back to
# ``moderate`` for unknown values; EN locale relies on
# ``.capitalize()`` in the composer for unknown values.
dds_severity:
  mild: {en: Mild, ja: 軽症}
  moderate: {en: Moderate, ja: 中等症}
  severe: {en: Severe, ja: 重症}

# Checkup questionnaire smoking / alcohol vocabulary (Phase 1d-38).
# JA renders full-word narrative labels; EN keeps the raw enum slug
# (checkup narratives cite the CIF enum verbatim per current spec).
# Unknown values fall back to per-lang formatters at call site
# (JA: ``{value}(区分未定義)``, EN: raw value).
checkup_smoking_status:
  never: {ja: 喫煙歴なし, en: never}
  former: {ja: "禁煙(過去に喫煙歴あり)", en: former}
  current: {ja: 現在喫煙中, en: current}
checkup_alcohol_use:
  none: {ja: 飲酒なし, en: none}
  occasional: {ja: 機会飲酒, en: occasional}
  regular: {ja: 習慣的飲酒, en: regular}
  heavy: {ja: 多量飲酒, en: heavy}

# Referral purpose 4-option pool (Phase 1d-28). Was inline
# ``purposes_ja/en`` lists in ``build_referral_purpose``. Selection is
# by SHA256 hash of encounter_id modulo len(keys), so key ORDER
# matters for RNG-neutral determinism — the Python side keeps a small
# tuple of ordered keys.
referral_purpose_options:
  option_1: {en: continued treatment, ja: 継続加療}
  option_2: {en: further investigation, ja: 精査依頼}
  option_3: {en: specialty consultation, ja: 他科紹介}
  option_4: {en: continued rehabilitation, ja: リハビリテーション継続}

# Discharge disposition labels (Phase 1d-32). Was ``_JA_DISPO_LABEL``
# and ``_EN_DISPO_LABEL`` module-level dicts. FHIR / eDS
# discharge_disposition slugs → per-locale narrative display.
discharge_disposition:
  home: {en: discharged home, ja: 自宅退院}
  hosp: {en: transferred to another hospital, ja: 他院転院}
  other-hcf: {en: transferred to another healthcare facility, ja: 他施設転院}
  snf: {en: discharged to skilled nursing facility, ja: 施設退院}
  exp: {en: expired, ja: 死亡退院}

# ADL Barthel-detail item labels (Phase 1d-35). Was inline
# ``[("feeding", "食事"), ...]`` tuple in ``build_adl_assessment``.
# Issue #3025: both languages name the Barthel item ("Toilet use 10",
# "トイレ動作10"), never the slug.
adl_detail_key:
  feeding: {en: Feeding, ja: 食事}
  bathing: {en: Bathing, ja: 入浴}
  mobility: {en: Mobility, ja: 移動}
  toilet_use: {en: Toilet use, ja: トイレ動作}

# SOAP progress-note section header prefixes (Phase 1d-45). Was
# `_SOAP_JA` / `_SOAP_EN` module-level tuples in
# `template_generator._render_progress_note_text`. The renderer
# looks these up by ordered slug (subjective → objective →
# assessment → plan) to prefix each SOAP block.
soap_label:
  subjective: {en: "S:", ja: "S（主観）"}
  objective: {en: "O:", ja: "O（客観）"}
  assessment: {en: "A:", ja: "A（評価）"}
  plan: {en: "P:", ja: "P（計画）"}

# Microbiology specimen container text (Phase 1d-50). Was
# `_container_text_ja` / `_container_text_en` dict pair inside
# `microbiology._bb_microbiology`. Emitted at
# `Specimen.container[0].type.text`.
mb_container_text:
  blood: {en: Blood culture bottle, ja: 血液培養ボトル}
  urine: {en: Sterile urine container, ja: 滅菌尿カップ}
  sputum: {en: Sputum container, ja: 喀痰カップ}
  wound: {en: Swab container, ja: スワブ容器}
  csf: {en: Sterile CSF tube, ja: 髄液滅菌管}
  stool: {en: Stool container, ja: 便検体容器}

# CareTeam.participant.role display per SNOMED clinical role code
# (Phase 1d-57). Was inline `ja if lang == "ja" else en` argument
# pair in `care_team._role_coding`, with each callsite passing per-
# role JA/EN literals. Keyed by the SNOMED code so the callsite
# stays code-driven (no locale-specific args) and the display map
# is a data-only concern.
# AllergyIntolerance.criticality (FHIR low / high / unable-to-assess) in the
# allergy line (Issue #3034).
allergy_criticality:
  low: {en: low, ja: 低リスク}
  high: {en: high, ja: 高リスク}
  unable-to-assess: {en: unable to assess, ja: 評価不能}

allergy_jfagy_display:
  medication: {en: Medication, ja: 医薬品}
  food: {en: Food, ja: 食品}
  environment: {en: Non-food non-medication, ja: 非食品・非医薬品}
  biologic: {en: Non-food non-medication, ja: 非食品・非医薬品}

# Lab-trend direction label (Phase 1d-62). Was `_TREND_LABEL_JA` /
# `_TREND_LABEL_EN` module-level dicts in `replacement_strategy.py`.
# Used by `_render_lab_trend_today` to annotate current-vs-prior
# arrow prose (e.g. `→ improving`).
lab_trend_direction:
  improving: {en: improving, ja: 改善}
  worsening: {en: worsening, ja: 悪化}
  stable: {en: stable, ja: 不変}
  initial: {en: initial, ja: 初回測定}

# Unknown-condition pattern labels (Phase 1d-65). From
# `_population_workflow_thresholds.UNKNOWN_CONDITION_PATTERNS_FALLBACK`.
# The population engine samples one of these slugs when an
# undifferentiated / idiopathic presentation is generated for an older
# adult; `unknown_condition.py` uses this map to populate the encounter
# `chief_complaint` (EN) + `chief_complaint_ja` (JA) slots so the JP
# narrative reads「発熱・原因不明」rather than the raw slug prose
# `elevated inflammatory markers`.
unknown_condition_pattern:
  fever_unknown: {en: "Fever of unknown origin", ja: "原因不明の発熱"}
  weight_loss_unexplained: {en: "Unexplained weight loss", ja: "原因不明の体重減少"}
  malaise_fatigue: {en: "Generalized malaise and fatigue", ja: "全身倦怠感・疲労"}
  elevated_inflammatory_markers: {en: "Elevated inflammatory markers", ja: "炎症反応上昇"}

# Encounter severity in the ClinicalImpression description (Issue #3032).
encounter_severity:
  mild: {en: mild, ja: 軽症}
  moderate: {en: moderate, ja: 中等症}
  severe: {en: severe, ja: 重症}
  critical: {en: critical, ja: 重篤}

# MedicationRequest.status in the JP effective-status note (Issue #3033).
medication_request_status:
  active: {en: active, ja: 有効}
  on-hold: {en: on hold, ja: 一時中止}
  cancelled: {en: cancelled, ja: 取消}
  completed: {en: completed, ja: 完了}
  entered-in-error: {en: entered in error, ja: 誤登録}
  stopped: {en: stopped, ja: 中止}
  draft: {en: draft, ja: 下書き}
  unknown: {en: unknown, ja: 不明}

