# FHIR emit-side per-resource text/display strings (Phase 1d-49).
# From `clinosim/modules/output/fhir_r4/procedures/immunization.py` —
# Immunization.statusReason.text / reasonCode.text / site.display /
# route.display fields. JA text is required by JP-locale narratives;
# EN fallback keeps consumer-agnostic display cleanly typed.
immunization_fhir:
  patient_refused: {ja: "患者拒否", en: "Patient refused"}
  vaccination_routine: {ja: "予防接種（定期接種）", en: "Vaccination (routine)"}
  # Issue #1766: EN displays must match SNOMED CT canonical preferred terms.
  # Verified against tx.fhir.org $lookup for SNOMED CT International
  # Edition. The validator rejected the short vernacular form
  # (``Left deltoid``) as a display mismatch against 368208006. JA
  # localizations stay as the common clinical short form — the JP
  # SNOMED fragment is lenient on display, and the short form is what
  # clinicians read in Japanese charting.

