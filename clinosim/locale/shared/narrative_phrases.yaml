    en: "Patient goal: recovery of function and return home / Family goal: early independence in activities of daily living"
  rp_movement_fallback: {en: 'Basic movement: no record', ja: 基本動作：記録なし}
  rp_policy_fallback:
    ja: "リハビリテーション治療方針：疾患特異的リハビリテーションを継続し、日常生活動作の自立度向上を図る"
