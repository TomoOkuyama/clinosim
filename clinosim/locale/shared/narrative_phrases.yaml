# Narrative phrase catalog (Phase 1d-4, 2026-09-23).
#
# Rails-i18n-style YAML tree consumed by
# ``clinosim.locale.i18n.t(key, lang, **params)``. Adding a new
# target language (fr / zh / ko / …) is a data change — extend each
# entry with ``<lang>: <template>``.
#
# Structure: nested tree with dot-notation reachable leaves. A leaf
# is a ``{lang: template}`` dict; ``{param}`` placeholders inside the
# template are interpolated by ``str.format`` at call time.
#
# Migration convention: extract each ``"X: {y}" if is_ja else "Y: {y}"``
# inline branch into a leaf here. Group leaves by document
# section / renderer (chief_complaint, progress, admission, …) so
# translators can review a coherent slice.
#
# ---------------------------------------------------------------------

metadata:
  kind: phrase-catalog
  name: narrative_phrases
  source: clinosim

chief_complaint:
  # From template_generator._render_chief_complaint (~line 5988).
  encounter_reason:
    ja: "来院理由: {cc}"
    en: "Encounter reason: {cc}"
  primary_problem:
    ja: "主な問題: {dx}"
    en: "Primary problem: {dx}"
  hpi_fallback:
    ja: "発熱・全身倦怠感"
    en: "Chief complaint not specified"

progress:
  # From template_generator._compose_progress_assessment_from_state and
  # _compose_progress_plan_from_state — inpatient progress_note fallback
  # phrasing when no complications / labs / plan detail is available.
  newborn_screening:
    ja: "新生児スクリーニング・予防投与（本記載時点まで）: {list}。"
    en: "Newborn screening and prophylaxis to date: {list}."
  # The Assessment leads with the problem of the stay (Issue #3545): the
  # admission diagnosis (and the other diagnoses known since admission) with
  # the hospital day.
  working_diagnosis:
    ja: "主病態: {dx}（入院{day}日目）。"
    en: "Problem: {dx}, hospital day {day}."
  stable_course_assessment:
    ja: "経過観察中、著変なし。"
    en: "Clinical course stable, no significant change."
  stable_course_plan:
    ja: "治療継続"
    en: "Continue current management"
  complications_noted:
    ja: "合併症 {list} を認識、対応継続中。"
    en: "Complications noted ({list}); management ongoing."
  # A complication that began since the previous day's note (Issue #3229);
  # afterwards complications_noted.
  complication_new:
    ja: "新たに {list} を合併、対応開始。"
    en: "New complication ({list}); management started."
  # The same without a management claim, when the record holds no order for it
  # (Issue #3542; progress_course.yaml complication_management).
  complication_new_unmanaged:
    ja: "新たに {list} を認める。"
    en: "New complication ({list}) recognised."
  notable_labs:
    ja: "本日の検査所見: {list}。"
    en: "Notable labs today: {list}."
  # A daily note with an authored time: the results reported in the hours
  # up to it (Issue #3241; notable_labs.yaml window_hours).
  notable_labs_recent:
    ja: "直近{hours}時間の検査所見: {list}。"
    en: "Notable labs (past {hours} h): {list}."
  # The abnormal results beyond the listed ones (Issue #3230).
  notable_labs_more:
    ja: "ほか異常値 {count} 項目"
    en: "+{count} other abnormal"
  # From template_generator._compose_progress_subjective_from_state
  # (Phase 1d-17). Per-day inpatient subjective composed from vitals
  # deltas (fever / hypothermia / spo2 trend). Each key covers one
  # abnormal-signal micro-phrase; the composer assembles them.
  hospital_day:
    ja: "入院{day}日目。"
    en: "Hospital day {day}."
  # Issue #3401: the trend phrases state the latest reading of the period;
  # ``{peak}`` is the time-qualified extreme of the period when it differs.
  fever_new_onset:
    ja: "発熱 {t:.1f}°C{peak} 出現。"
    en: "New-onset fever {t:.1f}°C{peak}."
  fever_worsening:
    ja: "発熱 {t:.1f}°C{peak} 上昇傾向。"
    en: "Fever {t:.1f}°C{peak}, worsening trend."
  fever_persistent:
    ja: "発熱 {t:.1f}°C{peak} 持続。"
    en: "Persistent fever {t:.1f}°C{peak}."
  fever_peak:
    ja: " ({when}の最高 {tmax:.1f}°C)"
    en: " (peak {tmax:.1f}°C {when})"
  fever_peak_resolved:
    ja: "{when}に最高 {tmax:.1f}°C の発熱、現在 {t:.1f}°C と発熱基準未満。"
    en: "Fever up to {tmax:.1f}°C {when}; now {t:.1f}°C, below the fever threshold."
  # Issue #3453: hypothermia (core temperature below 35.0 °C) is judged on the
  # latest reading; ``{peak}`` is the time-qualified minimum when it differs.
  hypothermia:
    ja: "低体温 {t:.1f}°C{peak} を認める。"
    en: "Hypothermia {t:.1f}°C{peak} noted."
  hypothermia_peak:
    ja: " ({when}の最低 {tmin:.1f}°C)"
    en: " (low {tmin:.1f}°C {when})"
  hypothermia_transient_low:
    ja: "{when}に最低 {tmin:.1f}°C の低体温、現在 {t:.1f}°C と低体温基準以上。"
    en: "Hypothermia down to {tmin:.1f}°C {when}; now {t:.1f}°C, above the hypothermia threshold."
  fever_resolving:
    ja: "熱型下降 (前日 {pt:.1f}°C → 本日 {t:.1f}°C)。"
    en: "Fever trending down (prev {pt:.1f}°C → today {t:.1f}°C)."
  spo2_worsening:
    ja: "SpO2 {s:.0f}%{peak} と悪化傾向。"
    en: "SpO2 {s:.0f}%{peak} (worsening)."
  spo2_desaturating:
    ja: "SpO2 {s:.0f}%{peak} と低下傾向。"
    en: "SpO2 {s:.0f}%{peak} (desaturation trend)."
  spo2_peak:
    ja: " ({when}の最低 {smin:.0f}%)"
    en: " (low {smin:.0f}% {when})"
  spo2_transient_low:
    ja: "{when}に SpO2 最低 {smin:.0f}% まで低下、現在 {s:.0f}%。"
    en: "SpO2 fell to {smin:.0f}% {when}; now {s:.0f}%."
  spo2_recovering:
    ja: "SpO2 改善 (前日 {ps:.0f}% → 本日 {s:.0f}%)。"
    en: "SpO2 recovering (prev {ps:.0f}% → today {s:.0f}%)."
  # The period the peak belongs to: the hours since the previous note, or the
  # note's own day when the note has no authored time.
  period_recent:
    ja: "直近{hours}時間"
    en: "in the past {hours} h"
  period_today:
    ja: "本日"
    en: "today"
  # Issue #2095: pain / consciousness / withdrawal trends from recorded vitals.
  # {pain} is the disease's pain (progress_vitals.yaml pain_sites), else
  # pain_generic (Issue #3235).
  # The patient cannot self-report (AVPU P / U) and no behavioural pain scale
  # is recorded, so no score is stated (Issue #3235).
  pain_not_self_reportable:
    ja: "意識レベル低下のため{pain}の自己申告は困難 (疼痛スケールの記録なし)。"
    en: "Self-report of {pain} is not possible with the reduced level of consciousness (no behavioural pain scale recorded)."
  pain_generic:
    ja: "疼痛"
    en: "pain"
  pain_improving:
    ja: "{pain}改善傾向 (NRS 前日 {p} → 本日 {q})。"
    en: "Improving {pain} (NRS {p} → {q})."
  pain_worsening:
    ja: "{pain}増強 (NRS 前日 {p} → 本日 {q})。"
    en: "Worsening {pain} (NRS {p} → {q})."
  pain_persistent:
    ja: "{pain}持続 (NRS {q})。"
    en: "Persistent {pain} (NRS {q})."
  pain_controlled:
    ja: "{pain}コントロール良好 (NRS {p} → {q})。"
    en: "Well-controlled {pain} (NRS {p} → {q})."
  # Issues #3235 / #3247: the Objective vitals of a progress note — the
  # extreme values of the note's period beyond the latest ones, oxygen
  # weaned within the period, and no reading in the period.
  vitals_extremes_recent:
    ja: "(直近{hours}時間: {list})"
    en: "(past {hours} h: {list})"
  vitals_extremes_today:
    ja: "(本日: {list})"
    en: "(today: {list})"
  vitals_o2_weaned:
    ja: "酸素投与終了"
    en: "weaned off supplemental O2"
  vitals_none_recent:
    ja: "直近{hours}時間のバイタル記録なし"
    en: "No vital signs recorded in the past {hours} h"
  vitals_none_today:
    ja: "本日のバイタル記録なし"
    en: "No vital signs recorded today"
  # Units as in the vitals line (narrative_text.vital_unit).
  vital_extreme:
    temperature_celsius_max:
      ja: "最高体温 {v:.1f}°C"
      en: "Tmax {v:.1f}°C"
    heart_rate_max:
      ja: "HR 最大 {v:.0f} 回/分"
      en: "HR max {v:.0f} bpm"
    heart_rate_min:
      ja: "HR 最小 {v:.0f} 回/分"
      en: "HR min {v:.0f} bpm"
    respiratory_rate_max:
      ja: "RR 最大 {v:.0f} 回/分"
      en: "RR max {v:.0f} /min"
    systolic_bp_min:
      ja: "収縮期血圧 最低 {v:.0f} mmHg"
      en: "SBP min {v:.0f} mmHg"
    spo2_min:
      ja: "SpO2 最低 {v:.0f}%"
      en: "SpO2 min {v:.0f}%"
  # Issue #3455: the consciousness lines state the latest AVPU of the period;
  # ``{peak}`` is the time-qualified worst level when it differs.
  confusion_new:
    ja: "意識レベル低下あり (AVPU {a}){peak}、見当識の確認を継続。"
    en: "New decrease in level of consciousness (AVPU {a}){peak}; orientation being monitored."
  confusion_persistent:
    ja: "意識レベル低下持続 (AVPU {a}){peak}。"
    en: "Level of consciousness remains decreased (AVPU {a}){peak}."
  consciousness_peak:
    ja: "、{when}の最悪 AVPU {w}"
    en: ", worst AVPU {w} {when}"
  consciousness_transient_low:
    ja: "{when}に意識レベル低下 (AVPU {w}) あり、現在は清明 (AVPU A)。"
    en: "Level of consciousness decreased (AVPU {w}) {when}; now alert (AVPU A)."
  consciousness_improved:
    ja: "意識レベル改善、清明 (前日 AVPU {a})。"
    en: "Level of consciousness improved, now alert (prev AVPU {a})."
  # Issue #3471: a level of consciousness below Alert for several days, named
  # as a problem with its cause work-up; delirium is named only when the stay
  # records it as a complication.
  consciousness_differential_workup:
    ja: "意識レベル低下が持続 (AVPU {a}、{n}日間)。せん妄を含む鑑別のため原因検索 ({causes}) を継続。"
    en: "Level of consciousness remains decreased (AVPU {a}, {n} days); work-up for the cause, including delirium, continues ({causes})."
  # Issue #3544: a coma (AVPU P or U) is worked up for its neurological and
  # structural causes, not as delirium.
  consciousness_coma_workup:
    ja: "意識レベル低下が持続 (AVPU {a}、{n}日間)。原因検索 ({causes}) を継続。"
    en: "Level of consciousness remains decreased (AVPU {a}, {n} days); work-up for the cause continues ({causes})."
  consciousness_delirium_workup:
    ja: "意識レベル低下が持続 (AVPU {a}、{n}日間)。{name}の原因検索 ({causes}) を継続。"
    en: "Level of consciousness remains decreased (AVPU {a}, {n} days); search for the cause of {name} continues ({causes})."
  withdrawal_active:
    ja: "振戦・発汗あり、離脱症状持続 (HR {hr})。"
    en: "Tremor and diaphoresis, withdrawal symptoms ongoing (HR {hr})."
  withdrawal_settling:
    ja: "振戦・発汗軽快、離脱症状は改善傾向 (HR {hr})。"
    en: "Tremor and sweating settling, withdrawal improving (HR {hr})."
  # Issue #3454: how breathing is going in a respiratory admission, from the
  # respiratory rate, SpO2 and oxygen therapy of the latest readings
  # (progress_symptoms.yaml). ``resp_dyspnea_*`` is used for a disease whose
  # chief complaint is dyspnea, ``resp_status_*`` otherwise; no cough, wheeze
  # or sputum is stated (the CIF holds none). ``{detail}`` is resp_detail.
  resp_detail:
    ja: " ({list})"
    en: " ({list})"
  resp_detail_rr:
    ja: "RR {v}"
    en: "RR {v}"
  resp_detail_spo2:
    ja: "SpO2 {v}%"
    en: "SpO2 {v}%"
  resp_status_stable:
    ja: "呼吸状態は安定{detail}。"
    en: "Respiratory status stable{detail}."
  resp_dyspnea_present:
    ja: "呼吸困難感あり{detail}。"
    en: "Dyspnea present{detail}."
  resp_dyspnea_new:
    ja: "呼吸困難感が出現{detail}。"
    en: "New dyspnea{detail}."
  resp_dyspnea_worsening:
    ja: "呼吸困難感は前日より増強{detail}。"
    en: "Dyspnea worsening since yesterday{detail}."
  resp_dyspnea_persistent:
    ja: "呼吸困難感は前日と同程度に持続{detail}。"
    en: "Dyspnea persisting, unchanged from yesterday{detail}."
  resp_dyspnea_improving:
    ja: "呼吸困難感は前日より軽減{detail}。"
    en: "Dyspnea improving since yesterday{detail}."
  resp_dyspnea_resolved:
    ja: "呼吸困難感は前日より軽減し、呼吸状態は安定{detail}。"
    en: "Dyspnea improved since yesterday, respiratory status now stable{detail}."
  resp_status_present:
    ja: "呼吸状態は不良{detail}。"
    en: "Respiratory status impaired{detail}."
  resp_status_new:
    ja: "呼吸状態が悪化{detail}。"
    en: "Respiratory status has worsened{detail}."
  resp_status_worsening:
    ja: "呼吸状態は前日より悪化{detail}。"
    en: "Respiratory status worse than yesterday{detail}."
  resp_status_persistent:
    ja: "呼吸状態は前日と同程度に不良{detail}。"
    en: "Respiratory status still impaired, unchanged from yesterday{detail}."
  resp_status_improving:
    ja: "呼吸状態は前日より改善傾向{detail}。"
    en: "Respiratory status improving since yesterday{detail}."
  resp_status_resolved:
    ja: "呼吸状態は前日より改善し、安定{detail}。"
    en: "Respiratory status improved since yesterday, now stable{detail}."
  # From template_generator._compose_progress_plan_from_state (Phase 1d-20).
  # Per-day inpatient plan lines: the drugs of the note's period by what
  # happened to them (Issue #3247: started, continued, given once by a
  # one-time order, held, stopped), today's procs, observation fallback.
  meds_started:
    ja: "開始: {list}。"
    en: "Started: {list}."
  meds_continue:
    ja: "薬物療法継続: {list}。"
    en: "Continue current medications: {list}."
  meds_given_once:
    ja: "単回投与: {list}。"
    en: "Given once: {list}."
  # Issue #3551: the first note after an intubation of a not-for-resuscitation patient.
  intubation_code_status:
    ja: "蘇生方針: DNAR（蘇生処置を行わない）の方針は継続。挿管は拒否されていないため、期間を区切った人工呼吸管理（タイムリミテッド・トライアル）として管理する。"
    en: "Code status: not for resuscitation, order unchanged. Intubation was not declined; ventilation continues as a time-limited trial."
  # Issue #2981: drugs whose doses were held today, with the hold reason.
  meds_held:
    ja: "休薬: {list}。"
    en: "Held: {list}."
  # Issue #3411: drugs held in an earlier period and given again.
  meds_resumed:
    ja: "再開: {list}。"
    en: "Resumed: {list}."
  meds_stopped:
    ja: "中止: {list}。"
    en: "Stopped: {list}."
  procs_today:
    ja: "本日の処置: {list}。"
    en: "Procedures today: {list}."
  procs_planned_later:
    ja: "本日予定の処置: {list}。"
    en: "Planned later today: {list}."
  # A body system whose exam equals the previous day's (Issue #3235).
  exam_unchanged:
    ja: "{systems}: 前日と著変なし"
    en: "{systems}: unchanged from the previous day"
  exam_all_unchanged:
    ja: "身体所見: 前日と著変なし"
    en: "Physical exam: unchanged from the previous day"
  # The post-operative day of the latest operation known at the note time
  # (Issue #3247); ``proc`` is the operation's name.
  op_day:
    ja: "手術当日 ({proc})。"
    en: "Day of surgery ({proc})."
  post_op_day:
    ja: "術後{n}日目 ({proc})。"
    en: "Post-operative day {n} ({proc})."
  # A complication with the hospital day it began on (Issue #3247).
  complication_with_onset:
    ja: "{name} (入院{day}日目発症)"
    en: "{name}, onset hospital day {day}"
  # How the abnormal vital states of the period changed against the previous
  # period (progress_exam.yaml course_items; Issue #3247).
  course_improving:
    ja: "バイタルサインは前日より改善傾向 ({list}は消失)。"
    en: "Vital signs improving compared with the previous day ({list} resolved)."
  course_worsening:
    ja: "バイタルサインは前日より増悪傾向 (新たに {list})。"
    en: "Vital signs worsening compared with the previous day (new {list})."
  course_easing:
    ja: "バイタルサインは前日より改善傾向 ({list}は改善したが持続は未確認)。"
    en: "Vital signs improving compared with the previous day ({list} improved, not yet sustained)."
  course_persisting:
    ja: "バイタルサインは{list}が持続、改善に乏しい。"
    en: "Abnormal vital signs persisting ({list}); no improvement yet."
  # The Assessment's course of the key labs of the admission problem (Issue
  # #3247) and the day after a non-operative procedure.
  course_persisting_improving:
    ja: "バイタルサインは異常が残存するが改善傾向 ({list})。"
    en: "Abnormal vital signs still present but improving ({list})."
  course_persisting_worsening:
    ja: "バイタルサインは異常が残存し増悪傾向 ({list})。"
    en: "Abnormal vital signs persisting and worsening ({list})."
  labs_course_improving:
    ja: "主要検査は改善傾向 ({list})。"
    en: "Key labs improving ({list})."
  labs_course_worsening:
    ja: "主要検査は増悪 ({list})。"
    en: "Key labs worsening ({list})."
  procedure_day:
    ja: "処置当日 ({proc})。"
    en: "Day of procedure ({proc})."
  post_procedure_day:
    ja: "処置後{n}日目 ({proc})。"
    en: "Post-procedure day {n} ({proc})."
  # Plan items beyond drugs (Issue #3247): the diet, rehabilitation and the
  # discharge arrangement.
  diet_continue:
    ja: "食事: {diet}。"
    en: "Diet: {diet}."
  diet_changed:
    ja: "食事を{diet}へ変更。"
    en: "Diet changed to {diet}."
  rehab_continue:
    ja: "リハビリテーション継続 ({types})。"
    en: "Rehabilitation continued ({types})."
  discharge_planning:
    home:
      ja: "退院に向けて調整中 (自宅退院予定)。"
      en: "Discharge planning in progress (home)."
    transfer:
      ja: "転院・施設退院に向けて調整中。"
      en: "Arranging transfer or facility discharge."
  observation_fallback:
    ja: "治療継続、経過観察。"
    en: "Continue current management, observe course."

# Admission-reason single-line composer (Phase 1d-20).
# From section_builders.jp_clins.build_admission_reason.
admission_reason:
  admitted_for:
    ja: "{subject}のため入院となった。"
    en: "Admitted for {subject}."

# ED-note fallback phrases (Phase 1d-20).
# From section_builders.ed_note.build_ed_physical_exam (vitals-derived
# fallback when the encounter template carries no physical_exam).
ed:
  on_arrival_no_findings:
    ja: "来院時所見: {vitals}。特記の身体所見なし。"
    en: "On arrival: {vitals}. No focal findings on exam."
  # Issue #3243: an admitted patient's ED note quotes the ED arrival vitals
  # without asserting a normal exam (they are often abnormal).
  on_arrival_vitals:
    ja: "来院時所見: {vitals}。"
    en: "On arrival: {vitals}."
  # Issue #3243: the arrival vitals, then the admitting disease's day-0
  # exam (per body system) for an admitted patient.
  on_arrival_exam:
    ja: "来院時所見: {vitals}。{exam}。"
    en: "On arrival: {vitals}. {exam}."
  # Issue #3242: an admitted patient's ED note with no reading taken in the
  # ED (the stay's vitals start on the ward) states that nothing was
  # recorded instead of asserting a normal exam.
  exam_not_recorded:
    ja: "来院時の身体所見: 記載なし"
    en: "Examination on arrival: not recorded"
  # Issue #2871: ED-note assessment (the encounter's diagnosis) and the
  # discharge instructions / follow-up of a patient sent home.
  assessment_diagnosis:
    ja: "救急外来診断: {dx}。主訴: {cc}。"
    en: "ED diagnosis: {dx}. Chief complaint: {cc}."
  assessment_diagnosis_only:
    ja: "救急外来診断: {dx}。"
    en: "ED diagnosis: {dx}."
  discharge_instructions:
    ja: "帰宅時指導: {list}。"
    en: " Discharge instructions: {list}."
  instruction_sep:
    ja: "。"
    en: "; "
  # Issue #3244: the take-home prescription of a patient sent home.
  discharge_prescription:
    ja: "帰宅時処方: {list}。"
    en: " Discharge prescription: {list}."
  follow_up:
    ja: "フォローアップ: {text}。"
    en: " Follow-up: {text}."

# Issue #2871: `{onset_<lang>}` placeholder of the encounter-protocol
# templates — how long before arrival the presenting problem began
# (`narrative.onset` of the protocol: unit + range).
symptom_onset:
  hours_one:
    ja: "来院約1時間前"
    en: "about 1 hour before arrival"
  hours:
    ja: "来院約{n}時間前"
    en: "about {n} hours before arrival"
  days_one:
    ja: "1日前"
    en: "1 day ago"
  days:
    ja: "{n}日前"
    en: "{n} days ago"

# Issue #2871: `{appearance_<lang>}` placeholder of the ED physical exam —
# general appearance by the triage level the note shows (ESI / JTAS 1-5):
# 1-2 distressed, 3 uncomfortable, 4-5 no acute distress.
ed_appearance:
  level_1:
    ja: "苦悶様"
