# DDS admission-state composer (Phase 1d-26).
# From template_generator._build_dds_admission_state.
dds_admission_state:
  full_line:
    ja: "患者は{when}{dx}当院に緊急入院となった。入院時の全身状態は{severity}の所見を呈していた。"
    en: "The patient was admitted urgently {when}{dx}. On admission the overall clinical status was assessed as {severity_lower}."
  when_at:
    ja: "{when}に"
    en: "on {when} "
  dx_with_code:
    ja: "{disp}（{code}）にて"
    en: "with {disp} ({code})"
  dx_no_code:
    ja: "急性増悪にて"
    en: "with an acute exacerbation"

# Death certificate fallbacks (Phase 1d-13).
death_cert:
  immediate_cause_not_documented:
    ja: "直接死因: 記録なし。"
    en: "Immediate cause of death: not documented."
  underlying_cause_not_documented:
    ja: "原死因: 記録なし。"
    en: "Underlying cause of death: not documented."
  cause_of_death_not_documented:
    ja: "死因: 記録なし。"
    en: "Cause of death: not documented."
  contributing_none:
    ja: "影響を及ぼした傷病名: 該当なし。"
    en: "Contributing conditions: none documented."
  comorbidities_none:
    ja: "合併症・併存症: 特記すべき合併症なし、既知の慢性疾患も記録なし。"
    en: "Comorbidities: no notable complications; no known chronic conditions on file."

