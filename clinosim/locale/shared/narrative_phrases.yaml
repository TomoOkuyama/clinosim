    ja: "（{criticality}）"
    en: " ({criticality})"
  avoidance_line:
    ja: "アレルギー配慮: {substance}"
    en: "Allergy avoidance: {substance}"

# ACP composite phrases.
acp:
  assigned_nurse_line:
    ja: "担当看護師：{name}"
    en: "Assigned nurse: {name}"
  test_schedule_line:
    ja: "検査項目：{joined} を実施予定"
