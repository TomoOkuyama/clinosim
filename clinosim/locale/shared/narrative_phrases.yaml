# Narrative phrase catalog (Phase 1d-4, 2026-09-23).
#
# Rails-i18n-style YAML tree consumed by
# ``clinosim.locale.i18n.t(key, lang, **params)``. Adding a new
# target language (fr / zh / ko / …) is a data change — extend each
# entry with ``<lang>: <template>``.
#
# Structure: nested tree with dot-notation reachable leaves. A leaf
# is a ``{lang: template}`` dict; ``{param}`` placeholders inside the
# template are interpolated by ``str.format`` at call time.
#
# Migration convention: extract each ``"X: {y}" if is_ja else "Y: {y}"``
# inline branch into a leaf here. Group leaves by document
# section / renderer (chief_complaint, progress, admission, …) so
# translators can review a coherent slice.
#
# ---------------------------------------------------------------------

chief_complaint:
  # From template_generator._render_chief_complaint (~line 5988).
  encounter_reason:
    ja: "来院理由: {cc}"
    en: "Encounter reason: {cc}"
  primary_problem:
    ja: "主な問題: {dx}"
    en: "Primary problem: {dx}"

progress:
  # From template_generator._compose_progress_assessment_from_state and
  # _compose_progress_plan_from_state — inpatient progress_note fallback
  # phrasing when no complications / labs / plan detail is available.
  stable_course_assessment:
    ja: "経過観察中、著変なし。"
    en: "Clinical course stable, no significant change."
  stable_course_plan:
    ja: "治療継続"
    en: "Continue current management"
  complications_noted:
    ja: "合併症 {list} を認識、対応継続中。"
    en: "Complications noted ({list}); management ongoing."
  notable_labs:
    ja: "本日の検査所見: {list}。"
    en: "Notable labs today: {list}."

# Section fallback text when the underlying CIF field is empty.
# Callers: template_generator._build_past_medical_history /
# _build_medications_at_home / _build_admission_diagnoses /
# _build_discharge_medications / _build_ncp_* / _build_pain_score /
# _build_hpi_history_of_present_illness (etc.).
section_none:
  past_medical_history:
    ja: "特記既往歴なし"
    en: "No significant past medical history"
  home_medications:
    ja: "常用薬なし"
    en: "No home medications"
  home_medications_alt:
    ja: "常用薬なし"
    en: "None taken"
  admission_diagnoses:
    ja: "特記事項なし。"
    en: "No admission diagnoses recorded."
  discharge_medications:
    ja: "退院処方なし"
    en: "No discharge medications"
  history_none_noted:
    ja: "特記事項なし"
    en: "None noted"
  nutrition_risk_no_data:
    ja: "栄養リスク：評価データなし"
    en: "Nutrition risk: no assessment data"
  nutrition_supply_no_data:
    ja: "栄養補給量：算出データなし"
    en: "Nutrition supply: no data to compute"
  pain_not_assessed:
    ja: "評価なし"
    en: "not assessed"

# Section-heading labels shared across social_history / family_history
# builders. Only the label token, not the full compound line.
section_label:
  smoking:
    ja: "喫煙歴"
    en: "Smoking"
  alcohol:
    ja: "飲酒歴"
    en: "Alcohol"
  occupation:
    ja: "職業"
    en: "Occupation"
  family_history_prefix:
    ja: "家族歴: "
    en: "Family history: "
