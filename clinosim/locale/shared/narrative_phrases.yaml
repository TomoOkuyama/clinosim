# Newborn progress-note subjective sentences (Issue #3260).
neonate_progress:
  day_of_life:
    ja: "日齢{day}。"
    en: "Day of life {day}."
  feeding_elimination:
    ja: "哺乳良好、排尿・排便あり。"
