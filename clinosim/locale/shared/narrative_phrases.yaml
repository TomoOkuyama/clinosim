# Narrative phrase catalog (Phase 1d-4, 2026-09-23).
#
# Rails-i18n-style YAML tree consumed by
# ``clinosim.locale.i18n.t(key, lang, **params)``. Adding a new
# target language (fr / zh / ko / …) is a data change — extend each
# entry with ``<lang>: <template>``.
#
# Structure: nested tree with dot-notation reachable leaves. A leaf
# is a ``{lang: template}`` dict; ``{param}`` placeholders inside the
# template are interpolated by ``str.format`` at call time.
#
# Migration convention: extract each ``"X: {y}" if is_ja else "Y: {y}"``
# inline branch into a leaf here. Group leaves by document
# section / renderer (chief_complaint, progress, admission, …) so
# translators can review a coherent slice.
#
# ---------------------------------------------------------------------

metadata:
  kind: phrase-catalog
  name: narrative_phrases
  source: clinosim

chief_complaint:
  # From template_generator._render_chief_complaint (~line 5988).
  encounter_reason:
    ja: "来院理由: {cc}"
    en: "Encounter reason: {cc}"
  primary_problem:
    ja: "主な問題: {dx}"
    en: "Primary problem: {dx}"
  hpi_fallback:
    ja: "発熱・全身倦怠感"
    en: "Chief complaint not specified"

progress:
  # From template_generator._compose_progress_assessment_from_state and
  # _compose_progress_plan_from_state — inpatient progress_note fallback
  # phrasing when no complications / labs / plan detail is available.
  stable_course_assessment:
    ja: "経過観察中、著変なし。"
    en: "Clinical course stable, no significant change."
  stable_course_plan:
    ja: "治療継続"
    en: "Continue current management"
  complications_noted:
    ja: "合併症 {list} を認識、対応継続中。"
    en: "Complications noted ({list}); management ongoing."
  notable_labs:
    ja: "本日の検査所見: {list}。"
    en: "Notable labs today: {list}."
  # From template_generator._compose_progress_subjective_from_state
  # (Phase 1d-17). Per-day inpatient subjective composed from vitals
  # deltas (fever / hypothermia / spo2 trend). Each key covers one
  # abnormal-signal micro-phrase; the composer assembles them.
  hospital_day:
    ja: "入院{day}日目。"
    en: "Hospital day {day}."
  fever_new_onset:
    ja: "発熱 {t:.1f}°C 出現。"
    en: "New-onset fever {t:.1f}°C."
  fever_worsening:
    ja: "発熱 {t:.1f}°C 上昇傾向。"
    en: "Fever {t:.1f}°C, worsening trend."
  fever_persistent:
    ja: "発熱 {t:.1f}°C 持続。"
    en: "Persistent fever {t:.1f}°C."
  hypothermia:
    ja: "低体温 {t:.1f}°C を認める。"
    en: "Hypothermia {t:.1f}°C noted."
  fever_resolving:
    ja: "熱型下降 (前日 {pt:.1f}°C → 本日 {t:.1f}°C)。"
    en: "Fever trending down (prev {pt:.1f}°C → today {t:.1f}°C)."
  spo2_worsening:
    ja: "SpO2 {s:.0f}% と悪化傾向。"
    en: "SpO2 {s:.0f}% (worsening)."
  spo2_desaturating:
    ja: "SpO2 {s:.0f}% と低下傾向。"
    en: "SpO2 {s:.0f}% (desaturation trend)."
  spo2_recovering:
    ja: "SpO2 改善 (前日 {ps:.0f}% → 本日 {s:.0f}%)。"
    en: "SpO2 recovering (prev {ps:.0f}% → today {s:.0f}%)."
  # Issue #2095: pain / consciousness / withdrawal trends from recorded vitals.
  pain_improving:
    ja: "疼痛改善傾向 (NRS 前日 {p} → 本日 {q})。"
    en: "Pain improving (NRS {p} → {q})."
  pain_worsening:
    ja: "疼痛増強 (NRS 前日 {p} → 本日 {q})。"
    en: "Pain worsening (NRS {p} → {q})."
  pain_persistent:
    ja: "疼痛持続 (NRS {q})。"
    en: "Pain persists (NRS {q})."
  pain_controlled:
    ja: "疼痛コントロール良好 (NRS {p} → {q})。"
    en: "Pain well controlled (NRS {p} → {q})."
  confusion_new:
    ja: "意識レベル低下あり (AVPU {a})、見当識の確認を継続。"
    en: "New decrease in level of consciousness (AVPU {a}); orientation being monitored."
  confusion_persistent:
    ja: "意識レベル低下持続 (AVPU {a})。"
    en: "Level of consciousness remains decreased (AVPU {a})."
  consciousness_improved:
    ja: "意識レベル改善、清明 (前日 AVPU {a})。"
    en: "Level of consciousness improved, now alert (prev AVPU {a})."
  withdrawal_active:
    ja: "振戦・発汗あり、離脱症状持続 (HR {hr})。"
    en: "Tremor and diaphoresis, withdrawal symptoms ongoing (HR {hr})."
  withdrawal_settling:
    ja: "振戦・発汗軽快、離脱症状は改善傾向 (HR {hr})。"
    en: "Tremor and sweating settling, withdrawal improving (HR {hr})."
  # From template_generator._compose_progress_plan_from_state (Phase 1d-20).
  # Per-day inpatient plan lines: continue-meds list, today's procs,
  # observation fallback.
  meds_continue:
    ja: "薬物療法継続: {list}。"
    en: "Continue current medications: {list}."
  # Issue #2981: drugs whose doses were held today, with the hold reason.
  meds_held:
    ja: "休薬: {list}。"
    en: "Held: {list}."
  procs_today:
    ja: "本日の処置: {list}。"
    en: "Procedures today: {list}."
  observation_fallback:
    ja: "治療継続、経過観察。"
    en: "Continue current management, observe course."

# Admission-reason single-line composer (Phase 1d-20).
# From section_builders.jp_clins.build_admission_reason.
admission_reason:
  admitted_for:
    ja: "{subject}のため入院となった。"
    en: "Admitted for {subject}."

# ED-note fallback phrases (Phase 1d-20).
# From section_builders.ed_note.build_ed_physical_exam (vitals-derived
# fallback when the encounter template carries no physical_exam).
ed:
  on_arrival_no_findings:
    ja: "来院時所見: {vitals}。特記の身体所見なし。"
    en: "On arrival: {vitals}. No focal findings on exam."
  # Issue #2871: ED-note assessment (the encounter's diagnosis) and the
  # discharge instructions / follow-up of a patient sent home.
  assessment_diagnosis:
    ja: "救急外来診断: {dx}。主訴: {cc}。"
    en: "ED diagnosis: {dx}. Chief complaint: {cc}."
  assessment_diagnosis_only:
    ja: "救急外来診断: {dx}。"
    en: "ED diagnosis: {dx}."
  discharge_instructions:
    ja: "帰宅時指導: {list}。"
    en: " Discharge instructions: {list}."
  instruction_sep:
    ja: "。"
    en: "; "
  follow_up:
    ja: "フォローアップ: {text}。"
    en: " Follow-up: {text}."

# Issue #2871: `{onset_<lang>}` placeholder of the encounter-protocol
# templates — how long before arrival the presenting problem began
# (`narrative.onset` of the protocol: unit + range).
symptom_onset:
  hours_one:
    ja: "来院約1時間前"
    en: "about 1 hour before arrival"
  hours:
    ja: "来院約{n}時間前"
    en: "about {n} hours before arrival"
  days_one:
    ja: "1日前"
    en: "1 day ago"
  days:
    ja: "{n}日前"
    en: "{n} days ago"

# Issue #2871: `{appearance_<lang>}` placeholder of the ED physical exam —
# general appearance by the triage level the note shows (ESI / JTAS 1-5):
# 1-2 distressed, 3 uncomfortable, 4-5 no acute distress.
ed_appearance:
  level_1:
    ja: "苦悶様"
    en: "in acute distress"
  level_2:
    ja: "苦悶様"
    en: "in acute distress"
  level_3:
    ja: "やや苦痛様"
    en: "appears uncomfortable"
  level_4:
    ja: "苦痛様顔貌なし"
    en: "in no acute distress"
  level_5:
    ja: "苦痛様顔貌なし"
    en: "in no acute distress"

# ED-note physical-exam vitals prepend (Phase 1d-37, Issue #979).
# Prepends a vitals prose line before the body-system findings; only the
# JA ED note uses it today. Every phrase carries English (Issue #2395).
ed_physical_exam:
  vitals_prepend:
    ja: "バイタルサイン: {vitals}。{text}"
    en: "Vital signs: {vitals}. {text}"

# admission_hp Assessment section composer phrases (Phase 1d-18).
# From template_generator._compose_ap_assessment_from_state.
ap_assessment:
  chief_complaint_line:
    ja: "主訴「{cc}」で入院。"
    en: "Admitted for evaluation and management of: {cc}."
  disease_severity_line:
    ja: "病態: {disease} ({severity})。"
    en: "Working diagnosis: {disease} (severity: {severity})."
  comorbidities_line:
    ja: "併存疾患: {list}。"
    en: "Comorbidities: {list}."
  acute_fallback:
    ja: "急性症状の精査・治療目的で入院。"
    en: "Admitted for acute symptom workup and management."

# admission_hp Plan section composer phrases (Phase 1d-18).
# From template_generator._compose_ap_plan_from_state.
ap_plan:
  estimated_los:
    ja: "予定入院期間: 約{los}日。"
    en: "Estimated length of stay: ~{los} days."
  initial_meds:
    ja: "薬物療法: {list}。"
    en: "Initial medications: {list}."
  workup_procedures:
    ja: "検査・処置: {list}。"
    en: "Workup / procedures: {list}."
  observation_fallback:
    ja: "経過観察・症状に応じた対応。"
    en: "Observation with symptom-directed management."

# admission_hp assessment+plan merged body (Phase A15 hardcoded-review).
# Used by `build_assessment_and_plan` to compose the final `【評価】` /
# `【方針】` block from the two sub-templates.
ap_combined:
  assessment_plan_block:
    ja: "【評価】{assessment}\n【方針】{plan}"
    en: "Assessment: {assessment}\nPlan: {plan}"

# Discharge-summary admission_summary head (Phase 1d-18).
# From section_builders.patient_history.build_admission_summary.
admission_summary:
  head_line:
    ja: "主訴: {cc}。入院日: {day} 日目現在。"
    en: "Chief complaint: {cc}. Admitted for inpatient care."

# Outpatient SOAP subjective composer phrases (Phase 1d-21) +
# outpatient Rx / workup headers (Phase 1d earlier). Merged into a
# single `outpatient:` mapping so YAML does not silently drop keys via
# the duplicate-mapping override (Phase 1d-64 fix — the second
# `outpatient:` at L779 was shadowing this block, leaking raw dot-
# notation keys `outpatient.subject_with_sex` etc. into ~24k JP
# narrative subjective fields per p=10000 cohort).
outpatient:
  # SOAP subjective composer piece-wise phrases — the composer drops
  # empty optional slots and concatenates cleanly per locale.
  subject_with_sex:
    ja: "{age}歳{sex}患者、"
    en: "{age}-year-old {sex} patient"
  subject_no_sex:
    ja: "{age}歳患者、"
    en: "{age}-year-old patient"
  visit_reason_with_cc:
    ja: "本日「{cc}」のため外来受診。"
    en: " presenting for {cc}."
  visit_reason_no_cc:
    ja: "本日外来受診。"
    en: " presenting for outpatient visit."
  chronic_followup:
    ja: "慢性疾患（{list}）のフォローアップを兼ねる。"
    en: " Follow-up of chronic conditions: {list}."
  # Outpatient Rx / workup section headers.
  today_prescription_head:
    ja: "本日処方: "
    en: "Today's prescription: "
  today_workup_head:
    ja: "本日実施: "
    en: "Today's workup: "

# ED-note assessment composer phrases (Phase 1d-21).
# From template_generator._compose_ed_assessment_from_state.
# ed.on_arrival_no_findings (Phase 1d-20) lives in the same section.
ed_assessment:
  working_dx_line:
    ja: "救急対応中の疾患: {list}"
    en: "ED working assessment: {list}"
  complications_line:
    ja: "合併症: {list}"
    en: "Complications: {list}"

# Chronic-condition follow-up short line composer (Phase 1d-21).
# From template_generator._compose_chronic_condition_line.
chronic:
  followup_head:
    ja: "既往症フォローアップ: {list}"
    en: "Chronic-condition follow-up: {list}"

