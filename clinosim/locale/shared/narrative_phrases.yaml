# "blood type"). Kept as templates so per-locale format rules stay in
# YAML data rather than in code branches.
patient_demographics:
  age_with_sex:
    ja: "{age}歳{sex_label}"
    en: "{age} y/o {sex_label}"
  age_only:
    ja: "{age}歳"
    en: "{age} y/o"
  # Short bilingual sex-code display, keyed by lowercased sex code
  # (`m`, `f`). Used by `section_builders.hpi._compose_hpi_extras_from_state` and
  # elsewhere a short JA sex label is composed inline (hardcoded-review
  # Phase A15).
  sex_display:
    m:
      ja: 男性
      en: male
    f:
      ja: 女性
      en: female
  # Phase A15: short JA patient preamble sentence used by the JA
  # patient-summary preamble (`{age}歳{sex}患者。` / `{age}歳患者。`).
  # Keeps the "歳" + "患者。" scaffolding out of Python.
  patient_preamble_with_sex:
    ja: "{age}歳{sex}患者。"
    en: "{age} y/o {sex} patient."
  patient_preamble_age_only:
    ja: "{age}歳患者。"
    en: "{age} y/o patient."

patient_biometrics:
