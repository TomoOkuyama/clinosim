    en: "In the ICU since hospital day {day}."
  course:
    ja: "入院{day}日目に集中治療室（ICU）へ転棟した。"
    en: "Transferred to the intensive care unit (ICU) on hospital day {day}."
  course_with_reason:
    ja: "{reason}を認め、入院{day}日目に集中治療室（ICU）へ転棟した。"
    en: "Transferred to the intensive care unit (ICU) on hospital day {day} in the setting of {reason}."
  course_dated:
    ja: "入院{day}日目（{date}）に集中治療室（ICU）へ転棟した。"
    en: "Transferred to the intensive care unit (ICU) on hospital day {day} ({date})."
  course_dated_with_reason:
    ja: "{reason}を認め、入院{day}日目（{date}）に集中治療室（ICU）へ転棟した。"
    en: "Transferred to the intensive care unit (ICU) on hospital day {day} ({date}) in the setting of {reason}."

# Nursing items of a shift note (Issue #3478); the ordered list and the rule of
# each item is reference_data/nursing_shift_items.yaml of the document module.
nursing_shift_items:
  icu:
    transfer:
      ja: "当シフト中にICUへ転棟。"
      en: "Transferred to the ICU during this shift."
    in_icu:
      ja: "ICU管理中（入院{day}日目にICUへ転棟）。"
      en: "In the ICU (transferred on hospital day {day})."
    step_down:
      ja: "当シフト中にICUから一般病棟へ転棟。"
      en: "Transferred back to the general ward from the ICU during this shift."
  pain:
    generic:
      ja: "疼痛"
      en: "Pain"
    observed:
      ja: "意識レベル低下のため疼痛の自己申告は得られず、表情・体動の観察で評価。"
      en: "Pain not self-reportable at the decreased level of consciousness; assessed by observation of expression and movement."
    none:
      ja: "疼痛の訴えなし (NRS 0)。"
      en: "No pain reported (NRS 0)."
    single:
      ja: "{pain}あり、NRS {q}。"
      en: "{pain} reported, NRS {q}."
    range:
      ja: "{pain}あり、NRS 最大 {peak}、最終 {last}。"
      en: "{pain} reported, NRS peak {peak}, latest {last}."
  fever:
    observed:
      ja: "{tmax}°Cの発熱あり、経過観察。"
      en: "Fever {tmax}°C; observation continued."
    given:
      ja: "{tmax}°Cの発熱あり、{drug}投与、経過観察。"
      en: "Fever {tmax}°C; {drug} given, observation continued."
    improved:
      ja: "{tmax}°Cの発熱あり、{drug}投与後 {after}°Cに解熱傾向。"
      en: "Fever {tmax}°C; {drug} given, temperature down to {after}°C afterwards."
    lower:
      ja: "{tmax}°Cの発熱あり、{drug}投与後 {after}°Cに低下、発熱は持続。"
      en: "Fever {tmax}°C; {drug} given, temperature {after}°C afterwards, fever persists."
    persisting:
      ja: "{tmax}°Cの発熱あり、{drug}投与後も {after}°Cで経過観察。"
      en: "Fever {tmax}°C; {drug} given, temperature still {after}°C afterwards, observation continued."
  desaturation:
    on_oxygen:
      ja: "{time} SpO2 {min}%に低下、{o2}投与下で管理。"
      en: "SpO2 fell to {min}% at {time}; managed on {o2}."
    on_ventilator:
      ja: "{time} SpO2 {min}%に低下、人工呼吸器管理下で経過観察。"
      en: "SpO2 fell to {min}% at {time}; on mechanical ventilation, observation continued."
    oxygen_started:
      ja: "{time} SpO2 {min}%に低下、{o2}投与後 SpO2 {after}%。"
      en: "SpO2 fell to {min}% at {time}; {o2} given, SpO2 {after}% afterwards."
    observed:
      ja: "{time} SpO2 {min}%に低下、酸素投与なしで経過観察。"
      en: "SpO2 fell to {min}% at {time}; no oxygen given, observation continued."
  consciousness:
    new:
      ja: "意識レベル低下あり (AVPU {a})、観察継続。"
      en: "Decreased level of consciousness (AVPU {a}); observation continued."
    persistent:
      ja: "意識レベル低下持続 (AVPU {a})。"
      en: "Level of consciousness remains decreased (AVPU {a})."
    transient:
      ja: "一過性の意識レベル低下 (AVPU {w}) あり、最終確認時は清明 (AVPU A)。"
      en: "Transient decrease in level of consciousness (AVPU {w}); alert (AVPU A) at the last check."
  news2:
    urgent:
      ja: "{time} NEWS2 {score}、緊急対応基準 ({threshold}点以上) に該当。"
      en: "NEWS2 {score} at {time}, at or above the urgent-response level ({threshold})."
  not_given:
    act_oral:
      ja: "内服"
      en: "oral dose"
    act_other:
      ja: "投与"
      en: "dose"
    held:
      ja: "{drug}{act}は{reason}のため保留。"
      en: "{drug} {act} held: {reason}."
    held_plain:
      ja: "{drug}{act}を保留。"
      en: "{drug} {act} held."
    refused:
      ja: "{drug}{act}を拒否。"
      en: "Patient refused {drug} {act}."
    refused_reason:
      ja: "{drug}{act}を拒否 ({reason})。"
      en: "Patient refused {drug} {act} ({reason})."
    unable_oral:
      ja: "{drug}{act}は意識レベル低下のため内服できず未実施。"
      en: "{drug} {act} not given: unable to take oral medication at the decreased level of consciousness."
    unable_other:
      ja: "{drug}{act}は意識レベル低下のため未実施。"
      en: "{drug} {act} not given at the decreased level of consciousness."
    unavailable:
      ja: "{drug}{act}は薬剤の準備ができず未実施。"
      en: "{drug} {act} not given: drug not available."
  io:
    balance:
      ja: "前日 ({date}) の水分出納: 摂取 {intake} mL、排出 {output} mL (うち尿 {urine} mL)、バランス {balance} mL。"
      en: "Previous day ({date}) fluid balance: intake {intake} mL, output {output} mL (urine {urine} mL), net {balance} mL."
    balance_drain:
      ja: "前日 ({date}) の水分出納: 摂取 {intake} mL、排出 {output} mL (うち尿 {urine} mL、ドレーン {drain} mL)、バランス {balance} mL。"
      en: "Previous day ({date}) fluid balance: intake {intake} mL, output {output} mL (urine {urine} mL, drain {drain} mL), net {balance} mL."
  devices:
    urinary_catheter:
      ja: "尿道留置カテーテル留置中。固定状況、尿の流出と性状の観察を継続。"
      en: "Indwelling urinary catheter in place; securement, urine flow and character observation continued."
    central_line:
      ja: "中心静脈カテーテル留置中。刺入部の状態と固定の観察を継続。"
      en: "Central venous catheter in place; insertion site and securement observation continued."
    oxygen:
      ja: "酸素: {o2}。装着状態の観察を継続。"
      en: "Oxygen: {o2}; device fit and observation continued."
    ventilator:
      ja: "気管挿管、人工呼吸器管理中。換気状態と気管チューブの固定の観察を継続。"
      en: "Intubated, on mechanical ventilation; ventilation and endotracheal tube securement observation continued."
  meal:
    npo:
      ja: "絶食中。"
      en: "NPO, nothing by mouth."
    npo_continued:
      ja: "絶食継続。"
      en: "NPO continued."
    npo_sips:
      ja: "内服薬は少量の水で投与。"
      en: " Oral medications given with sips of water."
    diet:
      ja: "食事: {diet}"
      en: "Diet: {diet}"
    feeding:
      ja: "摂食は{level}"
      en: "feeding {level}"
    oral_intake:
      ja: "前日の経口摂取量 {ml} mL"
      en: "oral intake the previous day {ml} mL"
  adl_level:
    independent:
      ja: "自立"
      en: "independent"
    partial:
      ja: "一部介助"
      en: "needs partial help"
    dependent:
      ja: "全介助"
      en: "dependent on help"
    assisted:
      ja: "介助歩行"
      en: "walks with help"
    wheelchair:
      ja: "車椅子"
      en: "uses a wheelchair"
    bedbound:
      ja: "臥床"
      en: "bedbound"
  skin:
    observe:
      ja: "褥瘡リスク: {band} (Braden {braden})。皮膚の観察を継続。"
      en: "Pressure-injury risk: {band} (Braden {braden}); skin inspection continued."
    prevent:
      ja: "褥瘡リスク: {band} (Braden {braden})。体位変換・除圧を実施し、皮膚の観察を継続。"
      en: "Pressure-injury risk: {band} (Braden {braden}); repositioning and pressure relief provided, skin inspection continued."
  mobility:
    mobility:
      ja: "移動は{level}"
      en: "mobility {level}"
    toilet:
      ja: "排泄は{level}"
      en: "toileting {level}"
    line:
      ja: "ADL: Barthel 指数 {score}/100 ({band})、{detail}。必要な介助を実施。"
      en: "ADL: Barthel Index {score}/100 ({band}); {detail}. Assistance provided as needed."
    impaired:
      ja: "ADL: 意識レベル低下のため移動・排泄とも全介助。"
      en: "ADL: fully dependent on help for mobility and toileting at the decreased level of consciousness."
    line_plain:
      ja: "ADL: Barthel 指数 {score}/100 ({band})。必要な介助を実施。"
      en: "ADL: Barthel Index {score}/100 ({band}). Assistance provided as needed."
  wound:
    day0:
      ja: "手術当日 ({name})。創部 (出血・滲出液・発赤・腫脹) の観察を継続。"
      en: "Day of surgery ({name}). Surgical-site observation (bleeding, drainage, redness, swelling) continued."
    pod:
      ja: "術後{n}日目 ({name})。創部 (出血・滲出液・発赤・腫脹) の観察を継続。"
      en: "Post-operative day {n} ({name}). Surgical-site observation (bleeding, drainage, redness, swelling) continued."
  site:
    access_site:
      day0:
        ja: "{name}当日。穿刺部 (出血・血腫) と末梢動脈の触知の観察を継続。"
        en: "Day of the procedure ({name}). Puncture-site observation (bleeding, hematoma) and distal pulses continued."
      pod:
        ja: "{name}から{n}日目。穿刺部 (出血・血腫) と末梢動脈の触知の観察を継続。"
        en: "Day {n} after {name}. Puncture-site observation (bleeding, hematoma) and distal pulses continued."
    pocket:
      day0:
        ja: "{name}当日。ポケット部 (血腫・発赤・腫脹) の観察を継続。"
        en: "Day of the procedure ({name}). Device-pocket observation (hematoma, redness, swelling) continued."
      pod:
        ja: "{name}から{n}日目。ポケット部 (血腫・発赤・腫脹) の観察を継続。"
        en: "Day {n} after {name}. Device-pocket observation (hematoma, redness, swelling) continued."
  fall_risk:
    with_score:
      ja: "転倒リスク: {level} (Morse {morse})、転倒予防策を継続。"
      en: "Fall risk: {level} (Morse {morse}); fall precautions continued."
    plain:
      ja: "転倒リスク: {level}、転倒予防策を継続。"
      en: "Fall risk: {level}; fall precautions continued."
  newborn:
    care:
      ja: "日齢{day}。哺乳、排尿・排便、臍帯の所見は記録なし。"
      en: "Day of life {day}. Feeding, voiding and stooling, and umbilical-cord findings not recorded."
    birth_weight:
      ja: "出生体重 {kg} kg。"
      en: "Birth weight {kg} kg."
    jaundice:
      ja: "日齢{day}の経皮ビリルビン測定値 {v} mg/dL。"
      en: "Transcutaneous bilirubin on day of life {day}: {v} mg/dL."
  hold_reason:
    sbp:
      ja: "血圧低値 (SBP {n}未満)"
      en: "low blood pressure (SBP below {n})"
    hr:
      ja: "心拍数低値 (HR {n}未満)"
      en: "low heart rate (HR below {n})"

