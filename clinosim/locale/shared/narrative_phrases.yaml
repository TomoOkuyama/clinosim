icu_stay:
  progress_step_down:
    ja: "入院{day}日目、ICUから一般病棟へ転棟。"
    en: "Transferred back to the general ward from the ICU on hospital day {day}."
  course_range:
    ja: "入院{day}日目（{date}）から{end_day}日目（{end_date}）まで集中治療室（ICU）で管理し、一般病棟へ転棟した。"
    en: "Intensive care unit (ICU) stay from {date} (hospital day {day}) to {end_date} (hospital day {end_day}), then transferred back to the general ward."
  course_range_with_reason:
    ja: "{reason}を認め、入院{day}日目（{date}）から{end_day}日目（{end_date}）まで集中治療室（ICU）で管理し、一般病棟へ転棟した。"
    en: "Intensive care unit (ICU) stay from {date} (hospital day {day}) to {end_date} (hospital day {end_day}) in the setting of {reason}, then transferred back to the general ward."
  progress_transfer:
    ja: "入院{day}日目、集中治療室（ICU）へ転棟。"
    en: "Transferred to the intensive care unit (ICU) on hospital day {day}."
  progress_transfer_with_reason:
    ja: "{reason}を認め、入院{day}日目に集中治療室（ICU）へ転棟。"
    en: "Transferred to the intensive care unit (ICU) on hospital day {day} in the setting of {reason}."
  progress_in_icu:
