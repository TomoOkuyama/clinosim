  admission_reason:
    ja: "入院目的: {cc}。"
    en: "Admission reason: {cc}. "
  allergy_first:
    ja: "アレルギー: {allergen}。"
    en: "Allergy: {allergen}. "

# Barthel functional-independence band labels (5 tiers).
barthel_band:
