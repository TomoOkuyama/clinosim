    ja: "目標 {ldl} mg/dL 未満 (一次予防・高リスク)"
    en: "target < {ldl} mg/dL (high-risk primary prevention)"
  ldl_target_primary_prevention:
    ja: "目標 {ldl} mg/dL 未満 (一次予防)"
    en: "target < {ldl} mg/dL (primary prevention)"
