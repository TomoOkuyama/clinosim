# List-formatting separators. Not per-section — used for joining
# tokens in composite phrases. Keeping them in the phrase catalog
# rather than hardcoded ternaries keeps punctuation choice per-locale
# (JA prefers ideographic comma 「、」 over ASCII comma).
list_sep:
  serial:
    ja: "、"
    en: ", "
  semicolon:
    ja: "、"
    en: "; "
  prior_word:
    ja: "前値"
    en: "prior"
  period:
    ja: "。"
    en: "."
  space:
    ja: " "
    en: "; "

