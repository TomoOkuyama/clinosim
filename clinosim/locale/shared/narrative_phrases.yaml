    en: "99% stenosis of the left anterior descending artery (#7), the culprit lesion; no significant stenosis elsewhere."
  cag_culprit_rca:
    ja: "右冠動脈 #2 に 99% 狭窄を認め、責任病変と判断。他枝に有意狭窄なし。"
    en: "99% stenosis of the right coronary artery (#2), the culprit lesion; no significant stenosis elsewhere."
  cag_culprit_lcx:
    ja: "左回旋枝 #13 に 90% 狭窄を認め、責任病変と判断。他枝に有意狭窄なし。"
    en: "90% stenosis of the left circumflex artery (#13), the culprit lesion; no significant stenosis elsewhere."
  cag_impression_culprit:
    ja: "責任病変を同定、経皮的冠動脈インターベンションの適応。"
    en: "Culprit lesion identified; indication for percutaneous coronary intervention."
  cag_residual:
    ja: "前回の責任病変部に 75% の残存狭窄を認める。"
    en: "75% residual stenosis at the previous culprit lesion."
  cag_impression_residual:
    ja: "残存狭窄あり、追加治療を検討。"
    en: "Residual stenosis; consider further intervention."
