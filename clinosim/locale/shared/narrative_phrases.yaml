# Chronic-assessment prose fragments (Phase 1d-46).
# From template_generator._compose_chronic_assessment_integrated —
# per-condition target + medication-continuation tail and the
# non-condition-specific measurement fallback.
# Placeholders: {sbp}/{dbp}/{ldl}/{med}/{joined}/{label}.
# Results and medications of the outpatient SOAP (Issues #3231, #3250, #3273):
# flagged lab results, screening scores, the plan lines they call for, the
# difference of today's prescription from the medications at the start of the
# visit, and the date of a result taken from an earlier visit.
outpatient_results:
  measured_on:
    ja: "（{date} 測定）"
    en: " (measured {date})"
  abnormal_labs:
    ja: "本日の異常値: {list}。"
    en: "Abnormal results this visit: {list}."
  plan_abnormal_labs:
    ja: "上記の異常値は再検し、原因を評価する。"
    en: "Recheck the abnormal results above and evaluate the cause."
  objective_labs:
    ja: "異常値: {list}。"
    en: "Flagged results: {list}."
  screening_scores:
    ja: "スクリーニングスコア: {list}。"
    en: "Screening scores: {list}."
  objective_pending:
    ja: "本日採血: {list} (結果待ち)。"
    en: "Drawn today, results pending: {list}."
  pending_more:
    ja: "ほか {count} 項目"
    en: "+{count} more"
  objective_scores:
    ja: "スクリーニングスコア: {list}。"
    en: "Screening scores: {list}."
  positive_screen:
    ja: "（陽性）"
    en: "(positive screen)"
  follow_up_suicide_risk:
    ja: "C-SSRS 陽性: 自殺リスクの評価と安全計画の作成を行い、危機相談窓口の情報を提供する。"
    en: "Positive C-SSRS screen: complete a suicide risk assessment and a safety plan, and provide crisis resources."
  plan_bp_above_target:
    ja: "血圧が目標を上回る: 次回受診時に血圧を再測定し、高値が続く場合は降圧薬の調整を検討する。"
    en: "Blood pressure above target: recheck at the next visit and adjust antihypertensive therapy if it stays above target."
  plan_doac_renal_check:
    ja: "DOAC 用量確認のため、血清クレアチニン・eGFR と血算を測定する。"
    en: "Check serum creatinine, eGFR and blood count for DOAC dosing."
  med_changes:
    ja: "来院時の内服との差異: {parts}。"
    en: "Compared with the medications at the start of the visit: {parts}."
  med_started:
    ja: "開始 {list}"
    en: "started {list}"
  med_changed:
    ja: "用量変更 {list}"
    en: "dose changed {list}"
  med_not_renewed:
    ja: "本日の処方なし {list}"
    en: "not on today's prescription {list}"
  # Issue #3250: a drug held for a safety reason during an earlier encounter.
  hold_resumed:
    ja: "{drug}: {date} の入院で{reason}のため保留、本日の処方で再開。"
    en: "{drug}: held on {date} for {reason}, resumed on today's prescription."
  hold_continued:
    ja: "{drug}: {date} の入院で{reason}のため保留、本日も保留を継続。"
    en: "{drug}: held on {date} for {reason}, hold continued today."
  med_unchanged:
    ja: "来院時の内服から処方の変更なし。"
    en: "Prescription unchanged from the medications at the start of the visit."

chronic_assessment:
  bp_target:
    ja: "目標 {sbp}/{dbp} mmHg 未満"
    en: "target < {sbp}/{dbp} mmHg"
  # Issue #2942: one per JAS 2022 risk tier (statin_monitoring.yaml `tier`).
  ldl_target_secondary_prevention:
    ja: "目標 {ldl} mg/dL 未満 (二次予防)"
    en: "target < {ldl} mg/dL (secondary prevention)"
  ldl_target_high_risk_primary_prevention:
    ja: "目標 {ldl} mg/dL 未満 (一次予防・高リスク)"
    en: "target < {ldl} mg/dL (high-risk primary prevention)"
  ldl_target_primary_prevention:
    ja: "目標 {ldl} mg/dL 未満 (一次予防)"
    en: "target < {ldl} mg/dL (primary prevention)"
  # Issue #3272: the LDL against the risk-based decision threshold of a
  # country whose guideline sets no LDL target (statin_monitoring.yaml `basis`).
  # Variants by the advice the visit can stand behind (Issue #3546): bare =
  # a lipid-lowering step is recorded at the visit; _review = none is, so the
  # advice is a recommendation for review; _maximal* = already on maximal
  # statin therapy, so the advice is a non-statin add-on, not intensification.
  ldl_threshold_above_clinical_ascvd:
    ja: "臨床的 ASCVD の閾値 {ldl} mg/dL 以上、スタチン強化または非スタチン併用の適応"
    en: "above the {ldl} mg/dL threshold for clinical ASCVD; statin intensification or a non-statin add-on indicated"
  ldl_threshold_above_clinical_ascvd_review:
    ja: "臨床的 ASCVD の閾値 {ldl} mg/dL 以上、スタチン強化または非スタチン併用を要検討 (本日の処方に反映なし)"
    en: "above the {ldl} mg/dL threshold for clinical ASCVD; statin intensification or a non-statin add-on recommended for review, no change on today's prescription"
  ldl_threshold_above_clinical_ascvd_maximal:
    ja: "臨床的 ASCVD の閾値 {ldl} mg/dL 以上、最大強度のスタチン投与下で非スタチン併用の適応"
    en: "above the {ldl} mg/dL threshold for clinical ASCVD on maximal statin therapy; non-statin add-on indicated"
  ldl_threshold_above_clinical_ascvd_maximal_review:
    ja: "臨床的 ASCVD の閾値 {ldl} mg/dL 以上、最大強度のスタチン投与下で非スタチン併用を要検討 (本日の処方に反映なし)"
    en: "above the {ldl} mg/dL threshold for clinical ASCVD on maximal statin therapy; non-statin add-on recommended for review, no change on today's prescription"
  ldl_threshold_above_clinical_ascvd_maximal_on_add_on:
    ja: "臨床的 ASCVD の閾値 {ldl} mg/dL 以上、最大強度のスタチンと非スタチン併用下でも未達、治療内容を要再検討"
    en: "above the {ldl} mg/dL threshold for clinical ASCVD despite maximal statin plus a non-statin add-on; therapy to be reviewed"
  ldl_threshold_below_clinical_ascvd:
    ja: "臨床的 ASCVD の閾値 {ldl} mg/dL 未満"
    en: "below the {ldl} mg/dL threshold for clinical ASCVD"
  ldl_threshold_above_severe_hypercholesterolemia:
    ja: "高度高コレステロール血症の閾値 {ldl} mg/dL 以上、高強度スタチンの適応"
    en: "above the {ldl} mg/dL threshold for severe hypercholesterolemia; high-intensity statin indicated"
  ldl_threshold_above_severe_hypercholesterolemia_review:
    ja: "高度高コレステロール血症の閾値 {ldl} mg/dL 以上、高強度スタチンを要検討 (本日の処方に反映なし)"
    en: "above the {ldl} mg/dL threshold for severe hypercholesterolemia; high-intensity statin recommended for review, no change on today's prescription"
  ldl_threshold_above_severe_hypercholesterolemia_maximal:
    ja: "高度高コレステロール血症の閾値 {ldl} mg/dL 以上、最大強度のスタチン投与下で非スタチン併用の適応"
    en: "above the {ldl} mg/dL threshold for severe hypercholesterolemia on maximal statin therapy; non-statin add-on indicated"
  ldl_threshold_above_severe_hypercholesterolemia_maximal_review:
    ja: "高度高コレステロール血症の閾値 {ldl} mg/dL 以上、最大強度のスタチン投与下で非スタチン併用を要検討 (本日の処方に反映なし)"
    en: "above the {ldl} mg/dL threshold for severe hypercholesterolemia on maximal statin therapy; non-statin add-on recommended for review, no change on today's prescription"
  ldl_threshold_above_severe_hypercholesterolemia_maximal_on_add_on:
    ja: "高度高コレステロール血症の閾値 {ldl} mg/dL 以上、最大強度のスタチンと非スタチン併用下でも未達、治療内容を要再検討"
    en: "above the {ldl} mg/dL threshold for severe hypercholesterolemia despite maximal statin plus a non-statin add-on; therapy to be reviewed"
  ldl_threshold_below_severe_hypercholesterolemia:
    ja: "高度高コレステロール血症の閾値 {ldl} mg/dL 未満"
    en: "below the {ldl} mg/dL threshold for severe hypercholesterolemia"
  inr_target_standard:
    ja: "目標 2.0-3.0"
    en: "target 2.0-3.0"
  # Issue #2993: DOAC follow-up (no INR target).
  doac_renal_bleeding_review:
    ja: "DOAC 用量に関わる腎機能・出血徴候を確認"
    en: "renal function and bleeding reviewed for DOAC dosing"
  # Issue #3231: no renal result is available, so the review is not claimed.
  doac_renal_to_check:
    ja: "DOAC 用量に関わる腎機能は未測定、測定予定"
    en: "renal function for DOAC dosing not yet measured, to be checked"
  med_continue_tail:
    ja: "、{med} 継続"
    en: "; {med} continue"
  followup_deferred:
    ja: "本日測定 ({joined}) は病態特異的モニタリング項目に該当せず、次回受診時に {label} 特化評価を追加検討。"
    en: "today's measurements ({joined}) not condition-specific; defer {label} focused review to next visit."
  # Issue #1776 — structured-data fallback. Replaces the followup_deferred
  # phrase at the per-chronic Assessment fallback site: the staged form
  # cites the condition's chronic_conditions[].stage directly instead of
  # re-quoting Objective-section vitals, and the stageless form just
  # lists the problem-list entry (Issue #3547: no claim about today's findings). Neither
  # phrase defers the clinical judgement.
  chronic_stage_stable:
    ja: "{label}（{stage}）、現行管理継続。"
    en: "{label} ({stage}); management continued."
  # Issue #3273: a stored stage that is an HbA1c above target is not "no
  # acute change".
  chronic_stage_above_target:
    ja: "{label}（{stage}）、目標を上回る、治療内容を見直す。"
    en: "{label} ({stage}); above target, treatment review planned."
  # Issue #3253: a staged condition whose follow-up names a medication class
  # (chronic_followup.yaml `medication_class`) the patient does not take.
  chronic_stage_untreated:
    ja: "{label}（{stage}）、薬物療法なし、非薬物療法と経過観察を継続。"
    en: "{label} ({stage}); no pharmacotherapy, non-drug management and monitoring continued."
  chronic_noted:
    ja: "{label}: 問題リスト登録済み。"
    en: "{label}: on the problem list."
  # The abnormal vital-sign items (tachycardia, hypoxemia, fever) and their
  # plan lines are in document/reference_data/visit_reason_soap.yaml
  # (``vital_findings``, Issue #3251).

