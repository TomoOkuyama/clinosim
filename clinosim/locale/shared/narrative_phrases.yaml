    ja: "- {code}"
    en: "- {code}"

# DC 直接死因までの期間 (duration_of_immediate_cause) composer
# (Phase 1d-36). Was _dc_duration_phrase_ja / _en helper methods with
# 5 bucket × 3 pattern × 2 lang branching. Unified via lang-agnostic
# sub-phrase catalog.
dc_duration:
  prefix:
    ja: "直接死因までの期間: "
    en: "Time from onset of immediate cause to death: "
  chronic_lead:
    ja: "既往の慢性経過に加え、"
    en: "on a background of chronic disease, "
  disease_suffix:
    ja: "（{disease}）"
    en: " from {disease}"
  body_hours:
    ja: "入院より約{hours}時間で死亡{suffix}"
    en: "died approximately {hours} h after admission{suffix}"
  body_hours_one:
    ja: "入院より約1時間で死亡{suffix}"
    en: "died approximately 1 h after admission{suffix}"
  body_same_day:
    ja: "入院同日、数時間以内に死亡{suffix}"
    en: "died the same day of admission, within hours{suffix}"
  body_days:
    ja: "入院より約{los}日の経過で死亡{suffix}"
    en: "died approximately {los} days into the admission{suffix}"
  body_days_one:
    ja: "入院より約1日の経過で死亡{suffix}"
    en: "died approximately 1 day into the admission{suffix}"
  body_long:
    ja: "入院より約{weeks}週間の長期経過で死亡{suffix}"
    en: "died after a prolonged {weeks}-week course during this admission{suffix}"
  tail:
    ja: "。発症時期は不詳。"
    en: ". Date of onset unknown."
  # Issue #3255: an immediate cause that began during the stay (an
  # in-hospital complication) is timed from its onset.
  onset_body_hours:
    ja: "{disease}の発症から死亡まで約{hours}時間"
    en: "approximately {hours} h from onset of {disease} to death"
  onset_body_days:
    ja: "{disease}の発症から死亡まで約{days}日"
    en: "approximately {days} days from onset of {disease} to death"
  onset_body_days_one:
    ja: "{disease}の発症から死亡まで約1日"
    en: "approximately 1 day from onset of {disease} to death"
  # Issue #3256: four weeks or more read in weeks; shorter in days.
  onset_body_long:
    ja: "{disease}の発症から死亡まで約{weeks}週間"
    en: "approximately {weeks} weeks from onset of {disease} to death"
  onset_tail:
    ja: "。"
    en: "."

# DC contributing conditions composer (Phase 1d-36).
# JA and EN differ in sentence structure (JA places comp_part before
# tail, EN places tail before comp_part) so compound_line has
# lang-specific slot ORDER — but every slot phrase is language-
# agnostic.
# Issue #3537: 手術 field of the death certificate, from the operative
# procedures of the stay.
death_cert_surgery:
  performed:
    ja: "手術: 有（{items}）"
    en: "Surgery: {items}."
  item:
    ja: "{name} {year}年{month}月{day}日"
    en: "{name} on {date}"
  not_performed:
    ja: "手術: 無"
    en: "Surgery: none during this admission."

dc_contributing:
  prefix:
    ja: "影響を及ぼした傷病名: "
    en: "Contributing conditions: "
  connector_chronic:
    ja: "の慢性経過が背景にあり、"
    en: " on a background of chronic disease, "
  connector_comorbid:
    ja: "を併存疾患として有し、"
    en: " as comorbid conditions, "
  comp_part:
    ja: "入院中に{comp_labels}を合併し臨床経過に影響した。"
    en: " In-hospital complication(s) — {comp_labels} — also affected the clinical course."
  # After the comorbidity list, whose tail already says the course was
  # affected (Issue #3255: JA said it twice).
  comp_part_after_list:
    ja: "入院中には{comp_labels}も合併した。"
    en: " In-hospital complication(s) — {comp_labels} — also affected the clinical course."
  tail_with_list:
    ja: "死亡に至る臨床経過に影響したと考えられる。"
    en: "which plausibly contributed to the terminal course."
  compound_line:
    ja: "{prefix}{list_part}{connector}{tail}{comp_part}"
    en: "{prefix}{list_part}{connector}{tail}{comp_part}"

# admission/discharge/triage details composers (Phase 1d-32).
# From build_admission_details / build_discharge_details /
# build_triage_details. JA vs EN sentence structures differ so each
# lang carries a complete template plus optional sub-slot phrases.
admission_details:
  full_line:
    ja: "{parts}に入院した。"
    en: "{parts}."
  fallback:
    ja: "入院した。"
    en: "Admitted for inpatient care."
  date_slot:
    ja: "{date}"
    en: "Admitted on {date}"
  via_ed_slot:
    ja: "救急外来受診後"
    en: "via the emergency department"
  ward_slot:
    ja: "{ward}病棟"
    en: "to the {ward} ward"
  # Joiner between the ordered fragments — JA uses 「、」, EN uses " ".
  fragment_sep:
    ja: "、"
    en: " "

discharge_details:
  full_line:
    ja: "{parts}となった。"
    en: "{parts}."
  fallback_ja_only:
    ja: "退院時所見の記録なし。"
    en: "Discharge summary not documented."
  date_slot:
    ja: "{date}"
    en: "Discharged on {date}"
  ward_slot:
    ja: "{ward}病棟から"
    en: "from the {ward} ward"
  dispo_slot:
    ja: "{dispo}"
    en: "{dispo}"
  disposition_default:
    ja: "退院"
    en: "discharged"

triage_details:
  line:
    ja: "トリアージレベル: {level}。来院形態: {mode}。"
    en: "Triage level: {level}. Arrival mode: {mode}."
  arrival_unknown:
    ja: "不明"
    en: "unknown"
  # Issue #3034: "JTAS レベル3" / "ESI Level 3".
  system_level:
    ja: "{system} レベル{level}"
    en: "{system} Level {level}"
  # Issue #3244: the allergies taken at triage.
  allergies:
    ja: "アレルギー: {list}。"
    en: " Allergies: {list}."

# ED_TRIAGE_NOTE free-text renderer phrases (Phase 1d-33).
# From _render_ed_triage_note_text.
triage_note:
  level_line_with_data:
    ja: "トリアージレベル: {system} レベル{level}"
    en: "Triage level: {system} Level {level}"
  level_line_none:
    ja: "トリアージレベル: 未評価"
    en: "Triage level: not assessed"
  arrival_line:
    ja: "来院形態: {mode}"
    en: "Arrival mode: {mode}"
  arrival_line_none:
    ja: "来院形態: 不明"
    en: "Arrival mode: unknown"
  cc_line:
    ja: "主訴: {cc}"
    en: "Chief complaint: {cc}"
  cc_line_none:
    ja: "主訴: 未記録"
    en: "Chief complaint: not recorded"
  # Issue #3244: the vital signs taken at triage.
  vitals_line:
    ja: "トリアージ時バイタルサイン: {vitals}"
    en: "Triage vital signs: {vitals}"
  allergies_line:
    ja: "アレルギー: {list}"
    en: "Allergies: {list}"

# Current-medications composer phrases (Phase 1d-33).
# From _compose_current_medications_line — polypharmacy Plan-section
# list with truncate suffix.
current_medications:
  line:
    ja: "継続処方: {list}"
    en: "Continue current medications: {list}"
  truncate_suffix:
    ja: "（他 {n} 剤）"
    en: " (and {n} others)"

# DDS treatment / terminal / circumstances / comorbidities / family
# communication composers (Phase 1d-31). From _build_dds_*.
# Issue #3256: the course names the drugs, procedures, ICU transfer and new
# diagnoses of the stay (no counts); a palliative death (not for
# resuscitation, no life support at death) does not say treatment was
# continued.
dds_treatment_course:
  los_part_with_days:
    ja: "入院期間{los}日間。"
    en: "Length of stay: {los} days."
  los_part_with_days_one:
    ja: "入院期間1日間。"
    en: "Length of stay: 1 day."
  # Issue #3537: a stay shorter than the hours window of death_course.yaml.
  los_part_hours:
    ja: "入院から死亡まで約{hours}時間。"
    en: "Length of stay: about {hours} hours."
  los_part_hours_one:
    ja: "入院から死亡まで約1時間。"
    en: "Length of stay: about 1 hour."
  los_part_admission:
    ja: "入院当日の経過。"
    en: "Course on the day of admission."
  med_part:
    ja: "投与薬剤は{list}であった。"
    en: " Drugs given included {list}."
  proc_part:
    ja: "{list}を実施した。"
    en: " Procedures: {list}."
  icu_part:
    ja: "入院{day}日目に集中治療室（ICU）に入室した。"
    en: " Transferred to the intensive care unit on hospital day {day}."
  wk_part:
    ja: "入院中に新たに{list}を認めた。"
    en: " New diagnoses during the stay: {list}."
  wk_item:
    ja: "{display}（入院{day}日目）"
    en: "{display} (hospital day {day})"
  list_with_more:
    ja: "{list}ほか{count}件"
    en: "{list} and {count} others"
  tail:
    ja: "集学的治療を継続したが救命に至らなかった。"
    en: " Multidisciplinary treatment was continued, but the patient could not be saved."
  tail_palliative:
    ja: "治療にもかかわらず病状は進行した。"
    en: " Despite treatment, the condition progressed."

dds_terminal_course:
  full_line:
    ja: "死亡直前の数時間、{phrase}{dx_part}{when}死亡確認となった。"
    en: "In the final hours the patient {phrase}{dx_part} and death was confirmed {when}."
  phrase_acute:
    ja: "急速な循環動態悪化を呈し、"
    en: "developed acute hemodynamic deterioration"
  phrase_chronic:
    ja: "慢性経過の緩徐な悪化から終末期に至り、"
    en: "progressed slowly toward end-stage decompensation"
  phrase_unknown:
    ja: "臨床状態の増悪を認め、"
    en: "showed clinical deterioration"
  # Issue #2985: phrases chosen from the last recorded vitals, now only for a
  # record with no cause chain (Issue #3470).
  phrase_respiratory:
    ja: "呼吸不全が進行し、"
    en: "developed progressive respiratory failure"
  phrase_consciousness:
    ja: "意識レベルが低下し、"
    en: "became progressively less responsive"
  # Issue #3470: phrases chosen from the immediate cause of the certificate's
  # cause chain (death_cause_chain.yaml terminal_mechanisms).
  phrase_cardiac:
    ja: "心機能が悪化し、"
    en: "developed progressive cardiac deterioration"
  phrase_septic:
    ja: "敗血症に伴う全身状態の悪化が進行し、"
    en: "developed progressive deterioration with sepsis"
  phrase_renal:
    ja: "腎機能が悪化し、"
    en: "developed progressive renal deterioration"
  phrase_pneumonia:
    ja: "肺炎が増悪し、"
    en: "deteriorated as pneumonia progressed"
  phrase_pulmonary_embolism:
    ja: "肺塞栓症により状態が悪化し、"
    en: "deteriorated with pulmonary embolism"
  phrase_neurological:
    ja: "神経学的状態が悪化し、"
    en: "developed progressive neurological deterioration"
  phrase_coagulopathy:
    ja: "凝固異常が進行し、"
    en: "developed progressive coagulopathy"
  chain_due_to:
    ja: "、その原因の{cause}"
    en: ", due to {cause}"
  last_vitals:
    ja: "最終観察 ({ts}) は{values}であった。"
    en: "The last recorded observations ({ts}) were {values}."
  hr:
    ja: "心拍数 {hr}/分"
    en: "HR {hr}/min"
  bp:
    ja: "血圧 {sbp}/{dbp} mmHg"
    en: "BP {sbp}/{dbp} mmHg"
  rr:
    ja: "呼吸数 {rr}/分"
    en: "RR {rr}/min"
  spo2:
    ja: "SpO2 {spo2}%{o2}"
    en: "SpO2 {spo2}%{o2}"
  on_oxygen:
    ja: " (酸素投与下)"
    en: " on oxygen"
  dx_part:
    ja: "{display}を主因として"
    en: ", attributed to {display},"
  when_at:
    ja: "{ts}に"
    en: "at {ts}"
  when_eventually:
    ja: "最終的に"
    en: "eventually"

# Issue #3256: place (ICU / ward) x code status x life support in the
# final hours x recorded CPR. Palliative / 看取り wording only for a
# not-for-resuscitation death without life support.
dds_circumstances_of_death:
  place_icu:
    ja: "集中治療室（ICU）にて"
    en: "In the intensive care unit"
  place_ward:
    ja: "病棟にて"
    en: "On the ward"
  code_status:
    ja: "蘇生方針: {status}。"
    en: "Code status: {status}. "
  resuscitation:
    ja: "{place}、心肺停止に対し担当医立会いのもと心肺蘇生術を施行するも反応なく、死亡確認となった。"
    en: "{place}, cardiopulmonary resuscitation was performed by the attending physician for cardiopulmonary arrest; the patient did not respond and death was confirmed."
  support_cpr_withheld:
    ja: "{place}、{support}継続中に心肺停止に至った。蘇生方針に従い心肺蘇生術は行わず、死亡確認となった。"
    en: "{place}, the patient had a cardiopulmonary arrest while on {support}; in accordance with the code status, cardiopulmonary resuscitation was not performed, and death was confirmed."
  palliative:
    ja: "{place}、蘇生方針に従い心肺蘇生術は行わず、担当医の看取りのもと死亡確認となった。"
    en: "{place}, in accordance with the code status, cardiopulmonary resuscitation was not attempted; the patient died under the attending physician's palliative bedside care, and death was confirmed."
  # Issue #3470: the record holds no code event, so a death without a CPR
  # record is not described as an arrest. A full-code patient's summary says
  # that no resuscitation is documented; an unknown code status says only
  # that death was confirmed.
  full_code_no_cpr:
    ja: "{place}、死亡確認となった。蘇生処置の記録はない。"
    en: "{place}, death was confirmed. No resuscitation measures are documented."
  support_full_code_no_cpr:
    ja: "{place}、{support}を行っていたが、死亡確認となった。蘇生処置の記録はない。"
    en: "{place}, the patient was on {support}, and death was confirmed. No resuscitation measures are documented."
  death_confirmed:
    ja: "{place}、死亡確認となった。"
    en: "{place}, death was confirmed."
  support_death_confirmed:
    ja: "{place}、{support}を行っていたが、死亡確認となった。"
    en: "{place}, the patient was on {support}, and death was confirmed."
  support_vasopressor:
    ja: "昇圧薬（{drugs}）"
    en: "vasopressor support ({drugs})"
  support_inotrope:
    ja: "強心薬（{drugs}）"
    en: "inotropic support ({drugs})"
  support_ventilation:
    ja: "人工呼吸管理"
    en: "mechanical ventilation"
  support_and:
    ja: "・"
    en: " and "

dds_complications_and_comorbidities:
  chronic_part:
    ja: "既往の慢性疾患として{list}を有していた"
    en: "The patient had a chronic-disease history including {list}"
  in_hospital_part:
    ja: "入院中に{list}の合併を認めた"
    en: "During admission the following complication(s) developed: {list}"
  # Issue #3537: the secondary diagnoses recorded for the stay.
  secondary_part:
    ja: "入院中の診断として{list}があった"
    en: "Other diagnoses recorded for the stay: {list}"
  head:
    ja: "合併症・併存症: {body}"
    en: "Complications and comorbidities: {body}"

dds_family_communication:
  lead_short:
    ja: "入院時より病状の重篤性について家族に説明を行った。"
    en: "The severity of the patient's condition was explained to the family on admission."
  lead_med:
    ja: "入院早期より病状進行の可能性について家族に説明し、経過に応じて随時追加説明を行った。"
    en: "The family was informed early in the admission about the possibility of clinical deterioration, and updated as the course evolved."
  lead_long:
    ja: "入院経過中、病状悪化の節目ごとに複数回にわたり家族に説明を行った。"
    en: "The family was updated on multiple occasions at key inflection points during the admission."
  head_with_tail:
    ja: "家族への説明経過: {lead}"
    en: "Family communication: {lead}"

# Death-certificate + DDS single-line composers (Phase 1d-26).
# From section_builders.mortality.build_dc_immediate_cause /
# build_dc_underlying_cause / build_dc_manner_of_death /
# build_dds_cause_of_death.
# Issue #3255: {cause} is a cause with its code (coded_cause) or, for a
# complication without one, its name alone. due_to is the line between the
# immediate and the underlying cause (MHLW 「（イ）（ア）の原因」; NCHS
# "due to (or as a consequence of)").
death_cert_line:
  coded_cause:
    ja: "{display}（{code}）"
    en: "{display} ({code})"
  immediate_cause:
    ja: "直接死因: {cause}。"
    en: "Immediate cause of death: {cause}."
  due_to:
    ja: "（ア）の原因: {cause}。"
    en: " Due to (or as a consequence of): {cause}."
  underlying_cause:
    ja: "原死因: {cause}。"
    en: "Underlying cause of death: {cause}."
  underlying_same_as_immediate:
    ja: "原死因: （ア）の疾患に同じ。"
    en: "Underlying cause of death: the disease on the immediate cause line."
  time_of_death:
    ja: "死亡年月日時刻: {year}年{month}月{day}日 {hour:02d}時{minute:02d}分。"
    en: "Date and time of death: {year}-{month:02d}-{day:02d} {hour:02d}:{minute:02d}."
  manner_natural:
    ja: "死因の種類: 病死及び自然死。"
    en: "Manner of death: natural / disease-related."
  cause_of_death:
    ja: "死因: {cause}。"
    en: "Cause of death: {cause}."

# DDS admission-state composer (Phase 1d-26).
# From section_builders.mortality.build_dds_admission_state.
dds_admission_state:
  full_line:
    ja: "患者は{when}{dx}当院に緊急入院となった。入院時の全身状態は{severity}の所見を呈していた。"
    en: "The patient was admitted urgently {when}{dx}. On admission the overall clinical status was assessed as {severity_lower}."
  when_at:
    ja: "{when}に"
    en: "on {when} "
  dx_with_code:
    ja: "{disp}（{code}）にて"
    en: "with {disp} ({code})"
  dx_no_code:
    ja: "急性増悪にて"
    en: "with an acute exacerbation"

# Death certificate fallbacks (Phase 1d-13).
death_cert:
  immediate_cause_not_documented:
    ja: "直接死因: 記録なし。"
    en: "Immediate cause of death: not documented."
  time_of_death_not_documented:
    ja: "死亡年月日時刻: 記録なし。"
    en: "Date and time of death: not documented."
  underlying_cause_not_documented:
    ja: "原死因: 記録なし。"
    en: "Underlying cause of death: not documented."
  cause_of_death_not_documented:
    ja: "死因: 記録なし。"
    en: "Cause of death: not documented."
  contributing_none:
    ja: "影響を及ぼした傷病名: 該当なし。"
    en: "Contributing conditions: none documented."
  comorbidities_none:
    ja: "合併症・併存症: 特記すべき合併症なし、既知の慢性疾患も記録なし。"
    en: "Comorbidities: no notable complications; no known chronic conditions on file."

# ------------------------------------------------------------
# Fallback texts (Phase 1d-7): migrated from module-level
# ``_XXX_FALLBACK_JA`` / ``_XXX_FALLBACK_EN`` string constants that
# were previously duplicated at ``template_generator.py:330-620``.
# Every entry is a single-line empty-CIF fallback that renders when
# the underlying section has no data.
# ------------------------------------------------------------

fallback:
  acp_nutrition_no: {en: 'Special nutritional management required: No', ja: 特別な栄養管理の必要性：無}
  acp_other_plans: {en: 'Other: see nursing documentation for the nursing care plan and rehabilitation plan.', ja: その他：看護計画・リハビリテーション等の計画については看護記録を参照。}
  acp_other_staff_fallback: {en: No additional staff assigned, ja: 担当なし}
  acp_surgery_none: {en: 'Surgery: none planned', ja: 手術：予定なし}
  acp_test_schedule_fallback: {en: 'Tests: to be determined by the attending physician', ja: 検査：担当医の判断により決定}
  acp_ward_room_fallback: {en: 'Ward/Room: not yet assigned', ja: 病棟・病室：未定}
  adl_fallback: {en: 'ADL: independent (no issues noted)', ja: ADL：自立（問題なし）}
  care_plan_fallback: {en: 'Care plan: continue standard nursing care', ja: 看護計画：標準的ケア継続}
  discharge_readiness_fallback: {en: 'Discharge readiness: criteria met', ja: 退院準備：退院基準を満たす}
  disposition_fallback: {en: 'Disposition: to be determined', ja: 帰宅または入院加療}
  ed_disposition_admission: {en: 'Admitted ({reason})', ja: '入院適応（{reason}）'}
  ed_disposition_expired: {en: Died in the ED (family informed), ja: 救急室内死亡（家族への説明済み）}
  # Locale-appropriate triage scale label — JA uses JTAS (Japan
  # Triage and Acuity Scale); EN uses ESI (Emergency Severity Index,
  # the US ED standard). Both use integer 1-5 so the ``{level}`` slot
  # is scale-agnostic; only the label differs.
  ed_disposition_home: {en: 'Discharged home (ESI level {level}, {reason})', ja: '帰宅（JTAS レベル {level}、{reason}）'}
  ed_disposition_transfer: {en: 'Transferred to another facility ({reason})', ja: '他院転送（{reason}）'}
  ed_disposition_psychiatric_transfer: {en: 'Transferred to a psychiatric facility for inpatient care ({reason})', ja: '精神科病院へ転院（{reason}）'}
  ed_workup_fallback: {en: 'ED workup: no significant findings', ja: 検査・処置：特記事項なし}
  family_history_deceased_suffix: {en: ' (deceased)', ja: （故人）}
  family_history_fallback: {en: No significant family history, ja: 特記家族歴なし}
  generic_assessment: {en: Clinical assessment ongoing, ja: 経過観察中}
