  # Procedure-name composer sub-parts (Phase 1d-25).
  procedure_head:
    ja: "処置名: {display}"
    en: "Procedure: {display}"
  procedure_code_paren:
    ja: "（{code}）"
    en: " ({code})"
  procedure_type_suffix:
    ja: "／術式区分: {ptype}"
    en: " / type: {ptype}"
  # Consent boilerplate (Phase 1d-25). Static text; no interpolation.
  consent_line:
    ja: "インフォームド・コンセント: 患者本人（または家族）に手技の目的・方法・予想される合併症について文書で説明し、同意を得た。"
    en: "Informed consent: risks, benefits, and alternatives were explained to the patient (or surrogate) and written consent was obtained prior to the procedure."
  # Performer + assistants + anesthesiologist compound line (Phase 1d-25).
  # build_pn_performer localises staff-ids with the ", MD" / 医師 role suffix
  # inline, then joins per-role lines with "。" / ". " (locale-specific glue).
  performer_role_suffix:
    ja: "{name}医師"
    en: "{name}, MD"
  performer_head:
    ja: "実施者: {performer}"
    en: "Operator: {performer}"
  performer_none:
    ja: "実施者: 記録なし"
    en: "Operator: not documented"
  performer_assistants:
    ja: "介助: {list}"
    en: "Assistants: {list}"
  performer_anesth:
    ja: "麻酔科医: {name}"
    en: "Anesthesiologist: {name}"
  # Analgesia composer (Phase 1d-25).
  analgesia_line:
    ja: "麻酔・鎮静: {method}下に施行。"
    en: "Analgesia: procedure performed under {method}."
  # Course composer (Phase 1d-25).
  course_duration_head:
    ja: "処置経過: 所要時間{duration}分にて実施。"
    en: "Course: procedure took {duration} minutes."
  course_approach_part:
    ja: "アプローチは{approach}。"
    en: " Approach: {approach}."
  course_outcome_suffix:
    ja: "{outcome}。"
    en: " {outcome}."
  course_outcome_default:
    ja: "手技は概ね予定通りに完遂した"
    en: "The procedure was completed as planned"

# Autopsy status + findings (Phase 1d-22).
# From section_builders.mortality.build_dc_autopsy_status +
# build_dds_autopsy_status_and_findings.
autopsy:
  status_yes:
    ja: "解剖の有無: 有（病理解剖）。"
    en: "Autopsy performed: yes (pathological autopsy)."
  status_no:
    ja: "解剖の有無: 無。"
    en: "Autopsy performed: no."
  findings_yes:
    ja: "剖検の有無・所見: 病理解剖を施行。臨床診断と主要臓器の病理所見に大きな乖離は認めなかった。"
    en: "Autopsy status and findings: pathological autopsy performed. Major-organ pathological findings were consistent with the clinical diagnosis."
  findings_no:
    ja: "剖検の有無・所見: 剖検は施行せず（家族同意得られず）。"
    en: "Autopsy status and findings: autopsy not performed (no family consent)."

# Family-history entry format (Phase 1d-30).
# From build_family_history — per-relative line assembled from
# relationship label + deceased suffix + condition list.
family_history:
  entry_line:
    ja: "{label}{suffix} – {conditions}"
    en: "{label}{suffix}: {conditions}"

# Nursing discharge-summary admission-status composer (Phase 1d-30).
# From section_builders.nursing.build_nursing_admission_status. Sub-lines concatenate.
nursing_admission_status:
  stay_head:
    ja: "入院期間: {los}日間。"
    en: "Hospital stay: {los} days. "
  admission_reason_line:
    ja: "入院理由: {cc}。"
    en: "Admission reason: {cc}. "
  complications_line:
    ja: "経過中の合併症: {list}。"
    en: "Complications: {list}. "
  discharge_met_line:
    ja: "退院基準を満たし退院となった。"
    en: "Discharge criteria met."
  # Issue #2875: a stay that ended in death (discharge disposition exp)
  # records the death instead of discharge criteria.
  died_line_at:
    ja: "{ts} 死亡確認、死亡退院となった。"
    en: "Patient died in hospital; death pronounced {ts}."
  died_line:
    ja: "入院中に死亡、死亡退院となった。"
    en: "Patient died in hospital."

# Nursing interventions in/out line (Phase 1d-30).
nursing_interventions:
  io_line:
    ja: "入院期間合計 IN {in_ml} mL / OUT {out_ml} mL (差 {net:+} mL)"
    en: "Cumulative IN {in_ml} mL / OUT {out_ml} mL (net {net:+} mL)"

# HPI-core fallback phrase (Phase 1d-29). From _build_hpi_core.
# Same 'admission_with_severity' shape as build_present_illness but a
# shorter no-severity variant.
hpi_core:
  fallback_with_severity:
    ja: "{sev}の症状で受診。"
    en: "Patient presented with {sev} symptoms."
  fallback_no_severity:
    ja: "受診となった。"
    en: "Patient presented for evaluation."

# NCP composite lines (Phase 1d-29).
ncp:
  ward_and_physician_line:
    ja: "病棟：{ward}　担当医師：{physician}"
    en: "Ward: {ward}, Attending physician: {physician}"
  nutrition_supply_line:
    ja: "エネルギー：{energy}kcal／日　たんぱく質：{protein}g／日　補給方法：経口"
    en: "Energy: {energy} kcal/day, Protein: {protein} g/day, Route: oral"
  nutrition_low_risk_line:
    ja: "低栄養リスク：低（BMI {bmi}、リスクなし）"
    en: "Malnutrition risk: low (BMI {bmi}, no risk identified)"

# JP-CLINS REFERRAL section-builder line templates (Phase 1d-28).
# From section_builders.jp_clins.build_referring_institution /
# build_referral_destination / build_referral_purpose /
# build_present_illness / build_present_illness_ref.
referral:
  referring_institution_line:
    ja: "紹介元:当院(急性期一般病棟)。担当医師の署名により発行。"
    en: "Referring institution: this hospital (acute-care general ward)."
  referral_destination_line:
    ja: "紹介先:他院。当該患者の継続加療を目的として本情報提供書を作成する。"
    en: "Referral destination: unspecified other institution (continued care)."
  referral_purpose_line:
    ja: "紹介目的:{purpose}のため。"
    en: "Referral purpose: {purpose}."

# HPI-fallback phrase pair used by build_present_illness (with
# admission clause) and build_present_illness_ref (without).
hpi:
  admission_with_severity:
    ja: "{sev}の症状で受診し入院となった。"
    en: "Patient presented with {sev} symptoms leading to admission."
  admission_no_severity:
    ja: "受診し入院となった。"
    en: "Patient presented for evaluation and admission."
  ref_with_severity:
    ja: "{sev}の症状で受診し入院となった。"
    en: "Patient presented with {sev} symptoms."
  ref_no_severity:
    ja: "受診となった。"
    en: "Patient presented for evaluation."
  # Generic onset templates by severity (hardcoded-audit Finding 17).
  # Used by `template_generator._render_hpi_onset` when `lang != "ja"`
  # and the disease YAML has no `onset_pattern` override. Per-disease
  # English wording quality is deferred to the LLM narrative pass;
  # these generic phrases are clinically neutral and locale-appropriate.
  onset:
    mild:
      en: "Patient reports gradual onset of symptoms over the preceding days."
    moderate:
      en: "Patient reports symptoms developing over several days with progressive worsening."
    severe:
      en: "Patient reports rapid symptom worsening prompting today's presentation."

# Diagnoses + chief-complaint compound section (JP-CLINS referral 340).
# From section_builders.jp_clins.build_diagnoses_and_complaint.
diagnoses_and_complaint:
  section:
    ja: "【傷病名】\n{dx_lines}\n\n【主訴】\n{cc_text}"
    en: "Diagnoses:\n{dx_lines}\n\nChief complaint: {cc_text}"
  no_diagnoses:
    ja: "特記事項なし。"
    en: "None recorded."

# REHAB_PLAN (RP) section-builder line templates (Phase 1d-27).
# From section_builders.care_plans.build_rp_rehab_team /
# build_rp_functional_status / build_rp_session_frequency /
# build_rp_discharge_estimate.
rp_note:
  rehab_team_line:
    ja: "担当リハビリ職種：{disciplines}／{therapist_note}"
    en: "Rehab discipline(s): {disciplines} / {therapist_note}"
  functional_status_line:
    ja: "機能的改善度：{progress}／リハビリへの参加度：{participation}／疼痛スコア：{pain}"
    en: "Functional progress: {progress} / Participation: {participation} / Pain score: {pain}"
  session_frequency_line:
    ja: "実施回数：{count}回（{first}〜{last}）、1回あたり{duration}分"
    en: "Sessions: {count} ({first} to {last}), {duration} min each"
  discharge_estimate_line:
    ja: "リハビリテーション終了の目安：入院後約{days}日"
    en: "Estimated rehabilitation completion: approximately {days} days post-admission"

# Drug-safety event narrative line templates (Phase 1d-39).
# From _render_safety_skips_line — one line per skip/hold/substitute/
# switch/deescalate/avoid event with {considered}, {conflict},
# {substituted}, {day_phrase} placeholders.
safety_skips:
  hold:
    ja: "・{considered}：{conflict}のため今回入院中は保留。"
    en: "- {considered} was held during this admission because of {conflict}."
  substitute_with_sub:
    ja: "・{considered} を {substituted} に切替（理由：{conflict}）。"
    en: "- {considered} was substituted with {substituted} (rationale: {conflict})."
  substitute_no_sub:
    ja: "・{considered} を切替（理由：{conflict}）。"
    en: "- {considered} was substituted (rationale: {conflict})."
  switch_with_sub:
    ja: "・{considered} を{day_phrase}で中止し {substituted} に切替（{conflict}）。"
    en: "- {considered} was discontinued {day_phrase}; {substituted} started ({conflict})."
  switch_no_sub:
    ja: "・{considered} を{day_phrase}で中止（{conflict}）。"
    en: "- {considered} was discontinued {day_phrase} ({conflict})."
  deescalate_with_sub:
    ja: "・{considered} を{day_phrase}で中止し {substituted} へ de-escalate（{conflict}）。"
    en: "- {considered} was discontinued {day_phrase} and narrowed to {substituted} ({conflict})."
  deescalate_no_sub:
    ja: "・{considered} を{day_phrase}で中止し de-escalate（{conflict}）。"
    en: "- {considered} was discontinued {day_phrase} and de-escalated ({conflict})."
  avoid_with_sub:
    ja: "・{considered} は {conflict} との併用禁忌のため回避し、{substituted} を処方。"
    en: "- {considered} avoided due to concurrent {conflict}; {substituted} prescribed instead."
  avoid_no_sub:
    ja: "・{considered} は {conflict} との併用禁忌のため処方せず。"
    en: "- {considered} avoided due to concurrent {conflict}; no alternative selected."
  # Issue #2930: drug skipped for the patient's recorded allergy ({conflict}
  # is the allergy, e.g. "Penicillin allergy" / 「ペニシリンアレルギー」).
  avoid_allergy_with_sub:
    ja: "・{conflict}のため{considered}は投与せず、{substituted}を処方。"
    en: "- {considered} not given: {conflict}; {substituted} prescribed instead."
  avoid_allergy_no_sub:
    ja: "・{conflict}のため{considered}は投与せず。"
    en: "- {considered} not given: {conflict}; no alternative selected."
  day_phrase_specific:
    ja: "第{day}病日"
    en: "on day {day}"
  day_phrase_default:
    ja: "経過中"
    en: "during the stay"

# Drug-safety event LLM-prompt context line templates (Phase 1d-41).
# From _build_extra_context (Layer 3 — the prompt-context bullet list
# handed to the production LLM). Distinct from safety_skips: (Layer 2 —
# deterministic template narrator) because the LLM prompt bullets carry
# a leading `- <event>: ` dispatch marker so the LLM can dispatch to
# the matching clinical phrasing per prompt Rule 2 (v17). Reuses
# safety_skips.day_phrase_specific / day_phrase_default for the
# time-of-event phrase.
safety_skips_prompt:
  hold:
    ja: "- hold: {considered} ({conflict} のため今回入院中は保留)"
    en: "- hold: {considered} was held during this admission because of {conflict}"
  substitute_with_sub:
    ja: "- substitute: {considered} を {substituted} に切替 (理由: {conflict})"
    en: "- substitute: {considered} substituted with {substituted} (rationale: {conflict})"
  substitute_no_sub:
    ja: "- substitute: {considered} を切替 (理由: {conflict})"
    en: "- substitute: {considered} substituted (rationale: {conflict})"
  switch_with_sub:
    ja: "- switch: {considered} を {day_phrase}で中止し {substituted} に切替 ({conflict})"
    en: "- switch: {considered} discontinued {day_phrase}; {substituted} started ({conflict})"
  switch_no_sub:
    ja: "- switch: {considered} を {day_phrase}で中止 ({conflict})"
    en: "- switch: {considered} discontinued {day_phrase} ({conflict})"
  deescalate_with_sub:
    ja: "- deescalate: {considered} を {day_phrase}で中止し {substituted} へ de-escalate ({conflict})"
    en: "- deescalate: {considered} discontinued {day_phrase} and narrowed to {substituted} ({conflict})"
  deescalate_no_sub:
    ja: "- deescalate: {considered} を {day_phrase}で中止 ({conflict})"
    en: "- deescalate: {considered} discontinued {day_phrase} ({conflict})"
  avoid_with_sub:
    ja: "- avoid: {considered} ({conflict} との併用のため回避); 代替として {substituted} を処方"
    en: "- avoid: {considered} (avoided due to concurrent {conflict}); substituted with {substituted}"
  avoid_no_sub:
    ja: "- avoid: {considered} ({conflict} との併用のため回避、代替薬は選択せず)"
    en: "- avoid: {considered} (avoided due to concurrent {conflict}); no alternative selected"
  avoid_allergy_with_sub:
    ja: "- avoid: {considered} ({conflict}のため投与せず); 代替として {substituted} を処方"
    en: "- avoid: {considered} (not given: {conflict}); substituted with {substituted}"
  avoid_allergy_no_sub:
    ja: "- avoid: {considered} ({conflict}のため投与せず、代替薬は選択せず)"
    en: "- avoid: {considered} (not given: {conflict}); no alternative selected"

# Checkup lab-results section (Phase 1d-47). From
# _build_checkup_lab_results — 4 measured items (BMI / BP / HbA1c /
# LDL) each classified as unmeasured / normal / borderline / elevated
# / severe, plus an overall A-D grade note. JP-only document today,
# so the EN slot is a functional placeholder — but the shape stays
# uniform so adding a new locale is a data-only change.
checkup_lab_results:
  bmi_unmeasured: {ja: "未測定", en: "not measured"}
  bmi_underweight:
    ja: "{v:.1f}(低体重)"
    en: "{v:.1f} (underweight)"
  bmi_normal:
    ja: "{v:.1f}(標準)"
    en: "{v:.1f} (normal)"
  bmi_obesity_1:
    ja: "{v:.1f}(肥満 1 度)"
    en: "{v:.1f} (mild obesity)"
  bmi_obesity_2plus:
    ja: "{v:.1f}(肥満 2 度以上)"
    en: "{v:.1f} (moderate-to-severe obesity)"
  bp_unmeasured: {ja: "未測定", en: "not measured"}
  bp_hypertension:
    ja: "{sbp:.0f}/{dbp:.0f} mmHg(高血圧)"
    en: "{sbp:.0f}/{dbp:.0f} mmHg (hypertension)"
  bp_high_normal:
    ja: "{sbp:.0f}/{dbp:.0f} mmHg(高値注意)"
    en: "{sbp:.0f}/{dbp:.0f} mmHg (high-normal)"
  bp_reference:
    ja: "{sbp:.0f}/{dbp:.0f} mmHg(基準内)"
    en: "{sbp:.0f}/{dbp:.0f} mmHg (within reference)"
  hba1c_unmeasured: {ja: "未測定", en: "not measured"}
  hba1c_diabetic:
    ja: "{v:.1f}%(糖尿病型)"
    en: "{v:.1f}% (diabetic pattern)"
  hba1c_borderline:
    ja: "{v:.1f}%(境界)"
    en: "{v:.1f}% (borderline)"
  hba1c_reference:
    ja: "{v:.1f}%(基準内)"
    en: "{v:.1f}% (within reference)"
  ldl_unmeasured: {ja: "未測定", en: "not measured"}
  ldl_high:
    ja: "{v:.0f} mg/dL(高 LDL 血症)"
    en: "{v:.0f} mg/dL (high LDL)"
  ldl_borderline:
    ja: "{v:.0f} mg/dL(境界域)"
    en: "{v:.0f} mg/dL (borderline)"
  ldl_elevated:
    ja: "{v:.0f} mg/dL(高値注意)"
    en: "{v:.0f} mg/dL (elevated)"
  ldl_reference:
    ja: "{v:.0f} mg/dL(基準内)"
    en: "{v:.0f} mg/dL (within reference)"
  overall_A: {ja: "異常なし", en: "no abnormalities"}
  overall_B: {ja: "軽度異常、生活指導", en: "mild abnormalities, lifestyle guidance"}
  overall_C: {ja: "要指導", en: "guidance recommended"}
  overall_D: {ja: "要精査・要治療", en: "further evaluation and treatment recommended"}
  body_measurements_line:
    ja: "【身体計測】BMI:{bmi}。"
    en: "Body measurements: BMI {bmi}."
  blood_pressure_line:
    ja: "【血圧】{bp}。"
    en: "Blood pressure: {bp}."
  hba1c_line:
    ja: "【血糖・HbA1c】HbA1c:{hba1c}。"
    en: "HbA1c: {hba1c}."
  ldl_line:
    ja: "【脂質】LDL:{ldl}。"
    en: "LDL: {ldl}."
  overall_line:
    ja: "総合判定:{overall}({overall_note})。"
    en: "Overall assessment: {overall} ({overall_note})."

# Checkup questionnaire full-page composer (Phase 1d-38).
# From build_checkup_questionnaire. JA renders 【…】-marked
# section headers; EN renders comma-separated labelled fields.
checkup_questionnaire:
  full_line:
    ja: "【既往歴】\n{history}\n【自覚症状】特記事項なし。\n【服薬】{meds}。\n【生活習慣】{smoking}、{alcohol}。\n【判定】{assessment}"
    en: "History: {history}\nSymptoms: none noted.\nMedications: {meds}.\nLifestyle: smoking={smoking}, alcohol={alcohol}.\nAssessment: {assessment}"
  assessment_followup_needed:
    ja: "既往に慢性疾患あり、かかりつけ医での継続経過観察を要す。"
    en: "Chronic condition(s) present; continued follow-up with primary care recommended."
  assessment_no_followup:
    ja: "経過観察不要。"
    en: "No follow-up required."
  history_raw_line:
    ja: "- {code}"
    en: "- {code}"

# DC 直接死因までの期間 (duration_of_immediate_cause) composer
# (Phase 1d-36). Was _dc_duration_phrase_ja / _en helper methods with
# 5 bucket × 3 pattern × 2 lang branching. Unified via lang-agnostic
# sub-phrase catalog.
dc_duration:
  prefix:
    ja: "直接死因までの期間: "
    en: "Time from onset of immediate cause to death: "
  chronic_lead:
    ja: "既往の慢性経過に加え、"
    en: "on a background of chronic disease, "
  disease_suffix:
    ja: "（{disease}）"
    en: " from {disease}"
  body_hours:
    ja: "入院より約{hours}時間で死亡{suffix}"
    en: "died approximately {hours} h after admission{suffix}"
  body_same_day:
    ja: "入院同日、数時間以内に死亡{suffix}"
    en: "died the same day of admission, within hours{suffix}"
  body_days:
    ja: "入院より約{los}日の経過で死亡{suffix}"
    en: "died approximately {los} days into the admission{suffix}"
  body_weeks:
    ja: "入院より約{weeks}週間（{los}日）の経過で死亡{suffix}"
    en: "died approximately {weeks} week(s) ({los} d) into the admission{suffix}"
  body_long:
    ja: "入院より約{weeks}週間の長期経過で死亡{suffix}"
    en: "died after a prolonged {weeks}-week course during this admission{suffix}"
  tail:
    ja: "。入院前の経過は本記録範囲外。"
    en: ". Pre-admission course not captured in this record."

# DC contributing conditions composer (Phase 1d-36).
# JA and EN differ in sentence structure (JA places comp_part before
# tail, EN places tail before comp_part) so compound_line has
# lang-specific slot ORDER — but every slot phrase is language-
# agnostic.
dc_contributing:
  prefix:
    ja: "影響を及ぼした傷病名: "
    en: "Contributing conditions: "
  connector_chronic:
    ja: "の慢性経過が背景にあり、"
    en: " on a background of chronic disease, "
  connector_comorbid:
    ja: "を併存疾患として有し、"
    en: " as comorbid conditions, "
  comp_part:
    ja: "入院中に{comp_labels}を合併し臨床経過に影響した。"
    en: " In-hospital complication(s) — {comp_labels} — also affected the clinical course."
  tail_with_list:
    ja: "死亡に至る臨床経過に影響したと考えられる。"
    en: "which plausibly contributed to the terminal course."
  compound_line:
    ja: "{prefix}{list_part}{connector}{comp_part}{tail}"
    en: "{prefix}{list_part}{connector}{tail}{comp_part}"

# admission/discharge/triage details composers (Phase 1d-32).
# From build_admission_details / build_discharge_details /
# build_triage_details. JA vs EN sentence structures differ so each
# lang carries a complete template plus optional sub-slot phrases.
admission_details:
  full_line:
    ja: "{parts}に入院した。"
    en: "{parts}."
  fallback:
    ja: "入院した。"
    en: "Admitted for inpatient care."
  date_slot:
    ja: "{date}"
    en: "Admitted on {date}"
  via_ed_slot:
    ja: "救急外来受診後"
    en: "via the emergency department"
  ward_slot:
    ja: "{ward}病棟"
    en: "to the {ward} ward"
  # Joiner between the ordered fragments — JA uses 「、」, EN uses " ".
  fragment_sep:
    ja: "、"
    en: " "

discharge_details:
  full_line:
    ja: "{parts}となった。"
    en: "{parts}."
  fallback_ja_only:
    ja: "退院時所見の記録なし。"
    en: "Discharge summary not documented."
  date_slot:
    ja: "{date}"
    en: "Discharged on {date}"
  ward_slot:
    ja: "{ward}病棟から"
    en: "from the {ward} ward"
  dispo_slot:
    ja: "{dispo}"
    en: "{dispo}"
  disposition_default:
    ja: "退院"
    en: "discharged"

triage_details:
  line:
    ja: "トリアージレベル: {level}。来院形態: {mode}。"
    en: "Triage level: {level}. Arrival mode: {mode}."
  arrival_unknown:
    ja: "不明"
