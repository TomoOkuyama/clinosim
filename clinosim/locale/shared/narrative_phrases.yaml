  postop_dest_ward:
    ja: "病棟にて経過観察"
    en: "ward-level monitoring"
  # Op-note procedure_name + anesthesia + surgeon + findings + course
  # + specimens + blood_loss composers (Phase 1d-24). Each key covers
  # a headed line whose sub-parts (approach / code / duration paren,
  # etc.) are concatenated to the head string by the composer.
  procedure_head:
    ja: "術式：{name}"
    en: "Procedure: {name}"
  procedure_approach_paren:
    ja: "（{approach}）"
    en: " ({approach})"
  procedure_code_paren:
    ja: "（コード {code}）"
    en: " (code {code})"
  procedure_duration_suffix:
    ja: "、手術時間 {duration} 分"
    en: "; operative time {duration} min"
  anesthesia_head:
    ja: "麻酔法：{label}"
    en: "Anesthesia: {label}"
  anesthesia_asa_suffix:
    ja: "、ASA分類 {asa}"
    en: ", ASA class {asa}"
  anesthesia_anesthesiologist_suffix:
    ja: "、麻酔科医 {name}"
    en: ", anesthesiologist {name}"
  surgeon_line:
    ja: "執刀医：{surgeon}"
    en: "Primary surgeon: {surgeon}"
  surgeon_none:
    ja: "執刀医：情報なし"
    en: "Primary surgeon: not documented"
  assistants_suffix:
    ja: "／助手：{list}"
    en: " / Assistants: {list}"
  findings_line:
    ja: "手術部位：{body_site}"
    en: "Body site: {body_site}"
  # Issue #3549: side, target vessel and access site, from the procedure record.
  findings_laterality:
    ja: "側：{side}"
    en: "Side: {side}"
  findings_target_vessel:
    ja: "治療対象血管：{vessel}"
    en: "Target vessel: {vessel}"
  findings_access_site:
    ja: "アクセス部位：{access}"
    en: "Access site: {access}"
  findings_preop:
    ja: "術前診断・適応：{dx}"
    en: "Pre-operative diagnosis / indication: {dx}"
  findings_postop:
    ja: "術後診断：{dx}"
    en: "Post-operative diagnosis: {dx}"
  indication_not_documented:
    ja: "適応：記載なし"
    en: "Indication: not documented"
  findings_intraop:
    ja: "術中合併症：{list}"
    en: "Intraop complications: {list}"
  findings_intraop_none:
    ja: "術中合併症：認めず"
    en: "No intraoperative complications"
  findings_none_default:
    ja: "術中所見：特記すべき所見なし"
    en: "No significant intraoperative findings"
  course_head:
    ja: "手術経過：{approach_part}{urgency_part}術式を施行{time_part}{duration_part}{outcome_part}"
    en: "Operative course: {urgency_part}procedure performed{approach_part}{time_part}{duration_part}{outcome_part}"
  # Issue #3549: the urgency of the operation, from Encounter.priority
  # (EM / UR / EL); no phrase when the encounter records none.
  course_urgency_emergency:
    ja: "緊急"
    en: "emergency "
  course_urgency_urgent:
    ja: "準緊急"
    en: "urgent "
  course_urgency_elective:
    ja: "予定"
    en: "elective "
  # Issue #3549: an earlier procedure of the same type in the patient's record.
  findings_prior_implant:
    ja: "前回（{date}）に{implant}を留置済み"
    en: "Prior implant placed on {date}: {implant}"
  findings_prior_procedure:
    ja: "前回（{date}）に{name}を施行済み"
    en: "Prior procedure: {name} on {date}"
  course_approach_part:
    ja: "{approach}アプローチにて"
    en: " via a {approach} approach"
  # Bare variant used when the localized ``approach`` string already
  # ends with "アプローチ" (JA) / "approach" (EN) — appending the suffix
  # again produces "…アプローチアプローチにて" / "…approach approach".
  # Selected by ``build_op_course`` on a suffix check.
  course_approach_part_bare:
    ja: "{approach}にて"
    en: " via {approach}"
  course_time_part:
    ja: "（{start} 開始／{end} 終了）"
    en: " ({start} start / {end} end)"
  course_duration_part:
    ja: "、手術時間 {duration} 分"
    en: ", operative time {duration} min"
  course_outcome_part:
    ja: "。転帰：{outcome}"
    en: ". Outcome: {outcome}"
  specimens_line:
    ja: "摘出臓器・組織：{list}（病理検査へ提出）"
    en: "Specimens sent to pathology: {list}"
  blood_loss_line:
    ja: "推定出血量：{ebl} mL{transfusion_part}"
    en: "Estimated blood loss: {ebl} mL{transfusion_part}"
  # Issue #3257: a procedure whose record has no estimated blood loss.
  blood_loss_not_recorded_line:
    ja: "推定出血量：記録なし{transfusion_part}"
    en: "Estimated blood loss: not recorded{transfusion_part}"
  blood_loss_transfusion_yes:
    ja: "、術中輸血あり"
    en: "; intraoperative transfusion given"
  blood_loss_transfusion_no:
    ja: "、術中輸血なし"
    en: "; no intraoperative transfusion"

# Care after a procedure, by the catalog's ``aftercare`` category
# (codes/data/clinosim-procedure-catalog.yaml; Issue #3257). The procedure
# note writes it as the post-procedure plan; the operative note writes it after
# the recovery destination. ``general`` is the plan of a procedure type the
# catalog gives no category.
procedure_aftercare:
  general:
    ja: "バイタルサインを観察し、手技に伴う合併症の早期発見に努める。"
    en: "Vital signs will be monitored for early detection of procedure-related complications."
  surgical_wound:
    ja: "バイタルサイン・尿量・創部所見を頻回に観察し、術後合併症の早期発見に努める。"
    en: "Vital signs, urine output, and wound assessment will be checked at frequent intervals to detect postoperative complications early."
  neurosurgical:
    ja: "意識レベル・瞳孔所見・四肢の動きとバイタルサイン、創部を頻回に観察し、再出血などの術後合併症の早期発見に努める。"
    en: "Level of consciousness, pupils, limb movement, vital signs, and the wound will be checked at frequent intervals to detect rebleeding and other postoperative complications early."
  vascular_access:
    ja: "穿刺部の止血と末梢動脈の触知を確認し、心電図モニターで胸部症状・ST変化を観察する。"
    en: "Access-site hemostasis and distal pulses will be checked, and the ECG and chest symptoms monitored for recurrent ischemia."
  device_pocket:
    ja: "創部（ジェネレーター植込み部）の血腫・感染徴候を観察し、心電図モニターでペーシング・センシング不全の有無を確認する。"
    en: "The generator pocket will be checked for hematoma and signs of infection, and pacing and sensing confirmed on ECG monitoring."
  urinary_catheter:
    ja: "尿量・尿の性状を観察し、カテーテルの屈曲・閉塞や尿路感染徴候に注意する。不要となれば速やかに抜去する。"
    en: "Urine output and appearance will be monitored, the catheter checked for kinking or blockage, and signs of urinary tract infection watched for. The catheter will be removed as soon as it is no longer needed."
  gastric_tube:
    ja: "使用前にチューブ先端の位置を確認し、排液量・性状と鼻腔の皮膚トラブルを観察する。"
    en: "Tube position will be confirmed before use, and drainage volume and character and the nasal skin monitored."
  ileus_tube:
    ja: "排液量・性状と腹部症状を観察し、腹部X線でチューブの進み具合を確認する。"
    en: "Drainage volume and character and abdominal symptoms will be monitored, and tube advancement checked on abdominal X-ray."
  central_line:
    ja: "胸部X線でカテーテル先端位置と気胸の有無を確認し、刺入部の出血・感染徴候を観察する。"
    en: "Catheter tip position will be confirmed and pneumothorax excluded on chest X-ray, and the insertion site monitored for bleeding and signs of infection."
  arterial_line:
    ja: "動脈圧波形を確認し、刺入部の出血・血腫と末梢循環を観察する。"
    en: "The arterial waveform will be checked, and the insertion site monitored for bleeding or hematoma and distal perfusion."
  lumbar_puncture:
    ja: "穿刺部の出血・髄液漏出と穿刺後頭痛の有無を観察する。"
    en: "The puncture site will be monitored for bleeding or leakage, and post-dural puncture headache watched for."
  thoracentesis:
    ja: "呼吸状態・SpO2を観察し、胸部X線で気胸の有無を確認する。"
    en: "Breathing and SpO2 will be monitored, and pneumothorax excluded on chest X-ray."
  chest_tube:
    ja: "排液量・性状とエアリークの有無、呼吸状態を観察し、胸部X線でドレーン位置と肺の再膨張を確認する。"
    en: "Drainage volume and character, air leak, and breathing will be monitored, and tube position and lung re-expansion checked on chest X-ray."
  paracentesis:
    ja: "血圧の変動と穿刺部からの腹水漏出を観察する。"
    en: "Blood pressure and the puncture site for ascitic fluid leakage will be monitored."
  intubation:
    ja: "カプノメトリと胸部X線で気管チューブの位置を確認し、カフ圧を管理しつつ人工呼吸管理を継続する。"
    en: "Endotracheal tube position will be confirmed by capnography and chest X-ray, and mechanical ventilation continued with cuff pressure management."
  cardioversion:
    ja: "鎮静から覚醒するまで意識レベル・呼吸状態を観察し、心電図モニターで調律を確認する。"
    en: "Level of consciousness and breathing will be observed until recovery from sedation, and the rhythm monitored on ECG."
  blood_transfusion:
    ja: "輸血副反応の有無をバイタルサインとともに観察し、輸血後にヘモグロビン値を再検する。"
    en: "Vital signs will be monitored for transfusion reactions, and hemoglobin rechecked after the transfusion."
  dialysis:
    ja: "透析後の血圧・体液バランスと電解質を確認し、バスキュラーアクセス部の出血を観察する。"
    en: "Blood pressure, fluid balance, and electrolytes will be checked after the session, and the vascular access site monitored for bleeding."
  bronchoscopy:
    ja: "咽頭麻酔が切れるまで絶飲食とし、SpO2と血痰の有無を観察する。"
    en: "Nothing by mouth until the topical throat anesthesia wears off; SpO2 and hemoptysis will be monitored."

# Procedure note (処置記録) fallbacks — separate from op_note.
proc_note:
  procedure_not_documented:
    ja: "処置名: 記録なし。"
    en: "Procedure: not documented."
  operator_not_documented:
    ja: "実施者: 記録なし。"
    en: "Operator: not documented."
  analgesia_not_documented:
    ja: "麻酔・鎮静: 記録なし。"
    en: "Analgesia: not documented."
  # Issue #3257: a procedure the catalog does without anesthesia.
  analgesia_none:
    ja: "麻酔・鎮静: なし（麻酔なしで施行）。"
    en: "Analgesia: none; procedure performed without anesthesia."
  course_not_documented:
    ja: "処置経過: 記録なし。"
    en: "Course: not documented."
  complications_not_documented:
    ja: "合併症の有無: 記録なし。"
    en: "Complications: not documented."
  specimens_not_documented:
    ja: "検体の有無: 記録なし。"
    en: "Specimens: not documented."
  postop_plan_not_documented:
    ja: "術後方針: 記録なし。"
    en: "Post-procedure plan: not documented."
  # Procedure-note complications / specimens / plan (Phase 1d-22).
  complications_present:
    ja: "合併症の有無: あり — {list}。"
    en: "Complications: present — {list}."
  complications_none:
    ja: "合併症の有無: 特記すべき手技合併症なし。"
    en: "Complications: none noted during the procedure."
  specimens_present:
    ja: "検体の有無: {list}を採取し病理・微生物検査に提出。"
    en: "Specimens: {list} obtained and sent for pathology/microbiology."
  specimens_none:
    ja: "検体の有無: 検体採取なし。"
    en: "Specimens: none obtained."
  postop_unsuccessful:
    ja: "術後方針: 手技目的を達成できなかったため、代替治療（外科的介入 または内視鏡的再アプローチ）を検討する。バイタル・症状の変化を厳重に監視する。"
    en: "Post-procedure plan: because the intended goal was not achieved, alternative therapy (surgical or repeat endoscopic approach) will be considered. Continue close monitoring of vitals and symptoms."
  # Issue #3257: the plan is the procedure's aftercare
  # (``procedure_aftercare.<category>``, category from the procedure catalog).
  postop_plan_line:
    ja: "術後方針: {plan}"
    en: "Post-procedure plan: {plan}"
  # Procedure-name composer sub-parts (Phase 1d-25).
  procedure_head:
    ja: "処置名: {display}"
    en: "Procedure: {display}"
  procedure_code_paren:
    ja: "（{code}）"
    en: " ({code})"
  procedure_type_suffix:
    ja: "／術式区分: {ptype}"
    en: " / type: {ptype}"
  # Consent boilerplate (Phase 1d-25). Static text; no interpolation.
  consent_line:
    ja: "インフォームド・コンセント: 患者本人（または家族）に手技の目的・方法・予想される合併症について文書で説明し、同意を得た。"
    en: "Informed consent: risks, benefits, and alternatives were explained to the patient (or surrogate) and written consent was obtained prior to the procedure."
  # Issue #3550: consent worded from urgency and the patient's consciousness at
  # the procedure time (the standard line above applies to an alert patient in a
  # non-emergency procedure).
  consent_emergency_reduced:
    ja: "インフォームド・コンセント: 緊急処置であり、意識レベルが低下していたため本人から同意を得ることができず、推定同意（緊急避難）のもとに施行した。"
    en: "Consent: emergency procedure; the patient's level of consciousness was reduced and consent could not be obtained from the patient, so the procedure was performed under implied consent."
  consent_emergency:
    ja: "インフォームド・コンセント: 緊急処置のため、同意書の取得に先立ち推定同意（緊急避難）のもとに施行した。"
    en: "Consent: emergency procedure, performed under implied consent before written consent could be obtained."
  consent_reduced:
    ja: "インフォームド・コンセント: 意識レベルが低下していたため、本人から同意を得ることができなかった。"
    en: "Consent: the patient's level of consciousness was reduced and consent could not be obtained from the patient."
  # Issue #3551: an intubation of a patient whose resuscitation status is "not for
  # resuscitation" (the status does not decline intubation).
  consent_code_status:
    ja: "蘇生方針: DNAR（蘇生処置を行わない）の方針は継続とした。挿管は拒否されていないため、期間を区切った人工呼吸管理（タイムリミテッド・トライアル）として実施した。"
    en: " Code status: the not-for-resuscitation order remains in place; intubation and ventilation were undertaken as a time-limited trial, as the patient has not declined intubation."
  # Insertion site, named only when the record has one (Issue #3550).
  site_suffix:
    ja: "／穿刺部位: {site}"
    en: " / site: {site}"
  # The insertion vein with its side (Issue #3549).
  site_with_side:
    ja: "{site}（{side}）"
    en: "{side} {site}"
  # Performer + assistants + anesthesiologist compound line (Phase 1d-25).
  # build_pn_performer localises staff-ids with the ", MD" / 医師 role suffix
  # inline, then joins per-role lines with "。" / ". " (locale-specific glue).
  performer_role_suffix:
    ja: "{name}医師"
    en: "{name}, MD"
  performer_head:
    ja: "実施者: {performer}"
    en: "Operator: {performer}"
  performer_none:
    ja: "実施者: 記録なし"
    en: "Operator: not documented"
  performer_assistants:
    ja: "介助: {list}"
    en: "Assistants: {list}"
  performer_anesth:
    ja: "麻酔科医: {name}"
    en: "Anesthesiologist: {name}"
  # Analgesia composer (Phase 1d-25).
  analgesia_line:
    ja: "麻酔・鎮静: {method}下に施行。"
    en: "Analgesia: procedure performed under {method}."
  # Course composer (Phase 1d-25).
  course_duration_head:
    ja: "処置経過: 所要時間{duration}分にて実施。"
    en: "Course: procedure took {duration} minutes."
  course_approach_part:
    ja: "アプローチは{approach}。"
    en: " Approach: {approach}."
  course_outcome_suffix:
    ja: "{outcome}。"
    en: " {outcome}."

# Autopsy status + findings (Phase 1d-22).
# From section_builders.mortality.build_dc_autopsy_status +
# build_dds_autopsy_status_and_findings.
autopsy:
  status_yes:
    ja: "解剖の有無: 有（病理解剖を予定、遺族の承諾あり）。"
    en: "Autopsy performed: yes (pathological autopsy planned with family consent)."
  status_no:
    ja: "解剖の有無: 無。"
    en: "Autopsy performed: no."
  findings_yes:
    ja: "剖検の有無・所見: 病理解剖を予定（遺族の承諾あり）。所見は後日報告する。"
    en: "Autopsy status and findings: pathological autopsy planned with family consent; findings to follow."
  findings_no:
    ja: "剖検の有無・所見: 剖検は施行せず（家族同意得られず）。"
    en: "Autopsy status and findings: autopsy not performed (no family consent)."

# Family-history entry format (Phase 1d-30).
# From build_family_history — per-relative line assembled from
# relationship label + deceased suffix + condition list.
family_history:
  entry_line:
    ja: "{label}{suffix} – {conditions}"
    en: "{label}{suffix}: {conditions}"

# Nursing discharge-summary admission-status composer (Phase 1d-30).
# From section_builders.nursing.build_nursing_admission_status. Sub-lines concatenate.
nursing_admission_status:
  stay_head:
    ja: "入院期間: {los}日間。"
    en: "Hospital stay: {los} days. "
  admission_reason_line:
    ja: "入院理由: {cc}。"
    en: "Admission reason: {cc}. "
  complications_line:
    ja: "経過中の合併症: {list}。"
    en: "Complications: {list}. "
  discharge_met_line:
    ja: "退院基準を満たし退院となった。"
    en: "Discharge criteria met."
  # Issue #3281: a stay discharged home at the deferral cap (the discharge gate
  # of simulator/aki_response.py not met): AKI not recovering, or a fever.
  discharge_at_cap_aki_line:
    ja: "腎機能の改善は十分でないが、退院後のクレアチニンの再検査を手配のうえ退院となった。"
    en: "Kidney function not yet recovered; discharged with a creatinine recheck arranged. "
  discharge_at_cap_fever_line:
    ja: "発熱が続いていたが、外来での経過観察を予定のうえ退院となった。"
    en: "Fever had not resolved; discharged with outpatient follow-up arranged. "
  # Issue #3270: a stay that ends in a facility (disposition snf), not home:
  # the patient was not safe for home at the end of the stay.
  continued_care_line:
    ja: "自宅退院の基準は満たさず、継続加療目的に{disposition}となった。"
    en: "Not yet safe for home; {disposition} for continued care."
  # Issue #2875: a stay that ended in death (discharge disposition exp)
  # records the death instead of discharge criteria.
  died_line_at:
    ja: "{ts} 死亡確認、死亡退院となった。"
    en: "Patient died in hospital; death pronounced {ts}."
  died_line:
    ja: "入院中に死亡、死亡退院となった。"
    en: "Patient died in hospital."

# Nursing interventions in/out line (Phase 1d-30).
nursing_interventions:
  # Issue #3267: the care the record shows, one clause per kind.
  medications:
    ja: "与薬 {n} 回 (薬剤 {k} 種類)"
    en: "Medication administration: {n} doses ({k} drugs)"
  neonatal_drugs:
    ja: "新生児への投与: {list}"
    en: "Newborn prophylaxis given: {list}"
  monitoring:
    ja: "バイタルサイン測定 {n} 回"
    en: "Vital-sign monitoring: {n} sets"
  oxygen:
    ja: "酸素投与下の観察 {n} 回"
    en: "Oxygen therapy: observed on {n} sets of vital signs"
  rehab:
    ja: "リハビリテーション {n} 回"
    en: "Rehabilitation: {n} sessions"
  fall_precautions:
    ja: "転倒予防策の実施"
    en: "Fall precautions"
  pu_prevention:
    ja: "褥瘡予防ケアの実施"
    en: "Pressure-injury prevention care"
  education:
    ja: "指導: {items}"
    en: "Education: {items}"
  io_line:
    ja: "入院期間合計 IN {in_ml} mL / OUT {out_ml} mL (差 {net:+} mL)"
    en: "Cumulative IN {in_ml} mL / OUT {out_ml} mL (net {net:+} mL)"

# HPI-core fallback phrase (Phase 1d-29). From _build_hpi_core.
# Same 'admission_with_severity' shape as build_present_illness but a
# shorter no-severity variant.
hpi_core:
  fallback_with_severity:
    ja: "{sev}の症状で受診。"
    en: "Patient presented with {sev} symptoms."
  fallback_no_severity:
    ja: "受診となった。"
    en: "Patient presented for evaluation."

# NCP composite lines (Phase 1d-29).
ncp:
  special_reason_high_risk:
    ja: 低栄養リスク高
    en: high malnutrition risk
  special_reason_npo:
    ja: 絶食中
    en: nil by mouth
  special_reason_dysphagia:
    ja: 嚥下機能の評価が必要
    en: swallowing evaluation needed
  goal_high_risk:
    ja: "栄養管理計画の目標：低栄養状態の改善に向けた栄養補給"
    en: "Nutrition management goal: nutrition support to correct the malnutrition risk"
  goal_npo:
    ja: "栄養管理計画の目標：絶食中の栄養状態の維持と、経口摂取再開時の食上げ"
    en: "Nutrition management goal: maintain nutritional status while fasting and advance the diet when oral intake resumes"
  goal_restriction:
    ja: "栄養管理計画の目標：{conditions}を行いながら現在の栄養状態を維持"
    en: "Nutrition management goal: maintain current nutritional status with {conditions}"
  goal_overnutrition:
