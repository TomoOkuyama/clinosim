# ------------------------------------------------------------
# Fallback texts (Phase 1d-7): migrated from module-level
# ``_XXX_FALLBACK_JA`` / ``_XXX_FALLBACK_EN`` string constants that
# were previously duplicated at ``template_generator.py:330-620``.
# Every entry is a single-line empty-CIF fallback that renders when
# the underlying section has no data.
# ------------------------------------------------------------

fallback:
  acp_nutrition_no: {en: 'Special nutritional management required: No', ja: 特別な栄養管理の必要性：無}
  acp_other_plans: {en: 'Other: see nursing documentation for the nursing care plan and rehabilitation plan.', ja: その他：看護計画・リハビリテーション等の計画については看護記録を参照。}
  acp_other_staff_fallback: {en: No additional staff assigned, ja: 担当なし}
  acp_surgery_none: {en: 'Surgery: none planned', ja: 手術：予定なし}
  acp_test_schedule_fallback: {en: 'Tests: to be determined by the attending physician', ja: 検査：担当医の判断により決定}
  acp_ward_room_fallback: {en: 'Ward/Room: not yet assigned', ja: 病棟・病室：未定}
  adl_fallback: {en: 'ADL: independent (no issues noted)', ja: ADL：自立（問題なし）}
