    en: "Newborn: adult fall and pressure-injury scales not applicable; fall prevention and thermal care in place"

# List-formatting separators. Not per-section — used for joining
# tokens in composite phrases. Keeping them in the phrase catalog
# rather than hardcoded ternaries keeps punctuation choice per-locale
# (JA prefers ideographic comma 「、」 over ASCII comma).
list_sep:
  serial:
    ja: "、"
    en: ", "
  semicolon:
    ja: "、"
    en: "; "
  prior_word:
    ja: "前値"
    en: "prior"
  period:
    ja: "。"
    en: "."
  # Space between two sentences (none after a Japanese full stop).
  sentence_gap:
    ja: ""
    en: " "
  space:
    ja: " "
    en: "; "
  chunk:
    ja: ""
    en: " "
  period_space:
    ja: "。"
    en: ". "
  slash:
    ja: "／"
    en: " / "

