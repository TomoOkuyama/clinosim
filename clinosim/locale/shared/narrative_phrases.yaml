    ja: "自立"
    en: "independent"
  minimal_assist:
    ja: "軽度介助"
    en: "minimal assistance"
  moderate_assist:
    ja: "中等度介助"
    en: "moderate assistance"
  severe_dependence:
    ja: "重度介助"
    en: "severe dependence"
  total_care:
    ja: "全介助"
    en: "total care"

# Morse fall-risk band labels (5 tiers) + composite risk section label.
morse_band:
  low:
    ja: "低リスク"
    en: "low"
  mild:
    ja: "軽度リスク"
    en: "mild"
  moderate:
    ja: "中等度リスク"
    en: "moderate"
  high:
    ja: "高リスク"
    en: "high"
  severe:
    ja: "重度リスク"
    en: "severe"

fall_risk:
  morse_score_line:
    ja: "転倒リスク (Morse {morse}): {level}"
    en: "Fall (Morse {morse}): {level}"
  short_label:
    ja: "転倒リスク"
    en: "fall risk"

# Pressure-ulcer / Braden risk phrase (Phase 1d-34).
# From build_risk_assessments.
risk:
  braden_line:
    ja: "褥瘡リスク (Braden {braden}/23): {band}"
    en: "Pressure-ulcer (Braden {braden}/23): {band}"

# Prescription / medication line formatters.
prescription:
  days_supply_suffix:
    ja: "x{days}日分"
    en: "x{days}d"
  next_visit:
    ja: "次回外来: {days}日後を予定。"
    en: "Next visit: in {days} days (planned)."
  # Issue #2287: the chronic follow-up schedule's interval.
  next_visit_month:
    ja: "次回外来: {months}か月後を予定。"
    en: "Next visit: in {months} month (planned)."
  next_visit_months:
    ja: "次回外来: {months}か月後を予定。"
    en: "Next visit: in {months} months (planned)."
  medication_continue:
    ja: "{med} 継続"
    en: "{med} continue"
  medication_inhalation_continue:
    ja: "{med} 吸入継続"
    en: "{med} inhalation continue"
  # Issue #2877: a statin stepped up on the last lipid panel's LDL.
  statin_titrated:
    ja: "{med} を {from_dose} から {to_dose} に増量 (LDL {ldl} mg/dL、{date})。"
    en: "{med} increased from {from_dose} to {to_dose} (LDL {ldl} mg/dL on {date})."

# O2 / oxygen device narrative fragments.
oxygen:
  device_line:
    ja: "酸素投与: {device}"
    en: "O2: {device}"

# Allergy / criticality parens (JA uses full-width parens).
allergy:
