# Drug-safety event narrative line templates (Phase 1d-39).
# From _render_safety_skips_line — one line per skip/hold/substitute/
# switch/deescalate/avoid event with {considered}, {conflict},
# {substituted}, {day_phrase} placeholders.
safety_skips:
  # Issue #3411: the reason sits in parentheses, so a reason that is itself a
  # parenthesised phrase does not end in ")のため".
  hold:
    ja: "・{considered}：今回入院中は保留（{conflict}）。"
    en: "- {considered} was held during this admission because of {conflict}."
  hold_no_reason:
    ja: "・{considered}：今回入院中は保留。"
    en: "- {considered} was held during this admission."
  # A hold-table entry that records a change, not a hold (the home oral
  # diuretic replaced by IV furosemide).
  change:
    ja: "・{considered}：{change}（{conflict}）。"
    en: "- {considered} was {change} ({conflict})."
  substitute_with_sub:
    ja: "・{considered} を {substituted} に切替（理由：{conflict}）。"
    en: "- {considered} was substituted with {substituted} (rationale: {conflict})."
  substitute_no_sub:
    ja: "・{considered} を切替（理由：{conflict}）。"
    en: "- {considered} was substituted (rationale: {conflict})."
  switch_with_sub:
    ja: "・{considered} を{day_phrase}で中止し {substituted} に切替（{conflict}）。"
    en: "- {considered} was discontinued {day_phrase}; {substituted} started ({conflict})."
  switch_no_sub:
    ja: "・{considered} を{day_phrase}で中止（{conflict}）。"
    en: "- {considered} was discontinued {day_phrase} ({conflict})."
  deescalate_with_sub:
    ja: "・{considered} を{day_phrase}で中止し {substituted} へ狭域化（{conflict}）。"
    en: "- {considered} was discontinued {day_phrase} and narrowed to {substituted} ({conflict})."
  deescalate_no_sub:
    ja: "・{considered} を{day_phrase}で中止し狭域化（{conflict}）。"
    en: "- {considered} was discontinued {day_phrase} and de-escalated ({conflict})."
  avoid_with_sub:
    ja: "・{considered} は {conflict} との併用禁忌のため回避し、{substituted} を処方。"
    en: "- {considered} avoided due to concurrent {conflict}; {substituted} prescribed instead."
  avoid_no_sub:
    ja: "・{considered} は {conflict} との併用禁忌のため処方せず。"
    en: "- {considered} avoided due to concurrent {conflict}; no alternative selected."
  # Issue #3458: a drug-drug avoidance below the contraindicated severity
  # (major / moderate interaction) is an interaction risk, not a contraindication.
  avoid_interaction_with_sub:
    ja: "・{considered} は {conflict} との相互作用リスクのため回避し、{substituted} を処方。"
    en: "- {considered} avoided because of the interaction risk with concurrent {conflict}; {substituted} prescribed instead."
  avoid_interaction_no_sub:
    ja: "・{considered} は {conflict} との相互作用リスクのため処方せず。"
    en: "- {considered} avoided because of the interaction risk with concurrent {conflict}; no alternative selected."
  # Issue #2930: drug skipped for the patient's recorded allergy ({conflict}
  # is the allergy, e.g. "Penicillin allergy" / 「ペニシリンアレルギー」).
  avoid_allergy_with_sub:
    ja: "・{conflict}のため{considered}は投与せず、{substituted}を処方。"
    en: "- {considered} not given: {conflict}; {substituted} prescribed instead."
  avoid_allergy_no_sub:
    ja: "・{conflict}のため{considered}は投与せず。"
    en: "- {considered} not given: {conflict}; no alternative selected."
  # Issue #3283: drug avoided for a condition of the patient ({conflict} is
  # the condition, e.g. "heart failure" / 「心不全」).
  avoid_condition_with_sub:
    ja: "・{conflict}のため{considered}は回避し、{substituted}を処方。"
    en: "- {considered} avoided because of {conflict}; {substituted} prescribed instead."
  avoid_condition_no_sub:
    ja: "・{conflict}のため{considered}は投与せず。"
    en: "- {considered} avoided because of {conflict}; no alternative selected."
  day_phrase_specific:
    ja: "第{day}病日"
    en: "on day {day}"
  day_phrase_default:
    ja: "経過中"
    en: "during the stay"

# Drug-safety event LLM-prompt context line templates (Phase 1d-41).
# From _build_extra_context (Layer 3 — the prompt-context bullet list
# handed to the production LLM). Distinct from safety_skips: (Layer 2 —
# deterministic template narrator) because the LLM prompt bullets carry
# a leading `- <event>: ` dispatch marker so the LLM can dispatch to
# the matching clinical phrasing per prompt Rule 2 (v17). Reuses
# safety_skips.day_phrase_specific / day_phrase_default for the
# time-of-event phrase.
safety_skips_prompt:
  hold:
    ja: "- 保留: {considered} ({conflict} のため今回入院中は保留)"
    en: "- hold: {considered} was held during this admission because of {conflict}"
  substitute_with_sub:
    ja: "- 代替: {considered} を {substituted} に切替 (理由: {conflict})"
    en: "- substitute: {considered} substituted with {substituted} (rationale: {conflict})"
  substitute_no_sub:
    ja: "- 代替: {considered} を切替 (理由: {conflict})"
    en: "- substitute: {considered} substituted (rationale: {conflict})"
  switch_with_sub:
    ja: "- 切替: {considered} を {day_phrase}で中止し {substituted} に切替 ({conflict})"
    en: "- switch: {considered} discontinued {day_phrase}; {substituted} started ({conflict})"
  switch_no_sub:
    ja: "- 切替: {considered} を {day_phrase}で中止 ({conflict})"
    en: "- switch: {considered} discontinued {day_phrase} ({conflict})"
  deescalate_with_sub:
    ja: "- 狭域化: {considered} を {day_phrase}で中止し {substituted} へ狭域化 ({conflict})"
    en: "- deescalate: {considered} discontinued {day_phrase} and narrowed to {substituted} ({conflict})"
  deescalate_no_sub:
    ja: "- 狭域化: {considered} を {day_phrase}で中止 ({conflict})"
    en: "- deescalate: {considered} discontinued {day_phrase} ({conflict})"
  avoid_with_sub:
    ja: "- 回避: {considered} ({conflict} との併用のため回避); 代替として {substituted} を処方"
    en: "- avoid: {considered} (avoided due to concurrent {conflict}); substituted with {substituted}"
  avoid_no_sub:
    ja: "- 回避: {considered} ({conflict} との併用のため回避、代替薬は選択せず)"
    en: "- avoid: {considered} (avoided due to concurrent {conflict}); no alternative selected"
  avoid_interaction_with_sub:
    ja: "- 回避: {considered} ({conflict} との相互作用リスクのため回避); 代替として {substituted} を処方"
    en: "- avoid: {considered} (avoided because of the interaction risk with concurrent {conflict}); substituted with {substituted}"
  avoid_interaction_no_sub:
    ja: "- 回避: {considered} ({conflict} との相互作用リスクのため回避、代替薬は選択せず)"
    en: "- avoid: {considered} (avoided because of the interaction risk with concurrent {conflict}); no alternative selected"
  avoid_allergy_with_sub:
    ja: "- 回避: {considered} ({conflict}のため投与せず); 代替として {substituted} を処方"
    en: "- avoid: {considered} (not given: {conflict}); substituted with {substituted}"
  avoid_allergy_no_sub:
    ja: "- 回避: {considered} ({conflict}のため投与せず、代替薬は選択せず)"
    en: "- avoid: {considered} (not given: {conflict}); no alternative selected"
  avoid_condition_with_sub:
    ja: "- 回避: {considered} ({conflict}のため回避); 代替として {substituted} を処方"
    en: "- avoid: {considered} (avoided because of {conflict}); substituted with {substituted}"
  avoid_condition_no_sub:
    ja: "- 回避: {considered} ({conflict}のため投与せず、代替薬は選択せず)"
    en: "- avoid: {considered} (avoided because of {conflict}); no alternative selected"

