  ed_disposition_psychiatric_transfer: {en: 'Transferred to a psychiatric facility for inpatient care ({reason})', ja: '精神科病院へ転院（{reason}）'}
  ed_workup_fallback: {en: 'ED workup: no significant findings', ja: 検査・処置：特記事項なし}
  family_history_deceased_suffix: {en: ' (deceased)', ja: （故人）}
  family_history_fallback: {en: No significant family history, ja: 特記家族歴なし}
  generic_assessment: {en: Clinical assessment ongoing, ja: 経過観察中}
  generic_fallback: {en: No special findings, ja: 特記事項なし}
  generic_plan: {en: Continue current management, ja: 治療継続}
  interventions_fallback: {en: 'Nursing interventions provided: no significant findings', ja: 実施した看護介入：特記事項なし}
  ncp_assessment_fallback: {en: 'Nutrition status assessment: no significant findings', ja: 栄養状態の評価と課題：特記事項なし}
  ncp_counseling_fallback: {en: 'Nutrition counseling: to be provided as needed', ja: 栄養食事相談：必要に応じて実施}
  ncp_dietary_content_fallback: {en: 'Dietary content: regular diet', ja: 食事内容：常食}
  ncp_dietitian_fallback: {en: No dietitian assigned, ja: 担当なし}
  ncp_discharge_eval_fallback: {en: 'Comprehensive evaluation at discharge: pending, to be assessed at discharge', ja: 退院時及び終了時の総合的評価：退院時に評価予定}
  ncp_dysphagia_none: {en: 'Dysphagia diet required: No', ja: 嚥下調整食の必要性：なし}
  ncp_goals_fallback: {en: 'Nutrition management goal: maintain current nutritional status', ja: 栄養管理計画の目標：現在の栄養状態を維持}
  ncp_other_issues_fallback: {en: 'Other nutrition management issues: none noted', ja: その他栄養管理上の課題：特記事項なし}
  ncp_reassessment_fallback: {en: 'Nutrition status reassessment: planned approximately 1 week after admission', ja: 栄養状態の再評価：入院後1週間を目安に実施}
