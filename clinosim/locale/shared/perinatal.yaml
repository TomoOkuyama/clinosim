# Perinatal delivery configuration (Issue #957 Tier-3-B slice 1).
#
# MVP scope: mother-side delivery Encounter emission for Z34-carrying
# pregnant women during the sim window. Newborn Patient generation +
# postpartum Z38 birth-outcome + puerperium visits remain a follow-up
# slice (multi-patient linked-encounter architecture is deferred).
#
# Cadence source: MHLW 人口動態統計 出生率 + JSOG 分娩管理指針 2020
# (spontaneous vaginal delivery LOS ~4-5 days in JP; ~2 days in US).

# ---------------------------------------------------------------------------
# Encounter shape. Delivery is emitted as one inpatient encounter with
# admission diagnosis = O80 (single spontaneous delivery, most common
# uncomplicated delivery code) and discharge diagnosis = Z37.0 (single
# liveborn — mother-side birth outcome code, sex-locked female-only via
# icd10_sex_restrictions.yaml).
encounter:
  visit_reason:
    en: "Delivery (spontaneous vaginal delivery)"
    ja: "分娩 (自然分娩)"
  admission_diagnosis_code: "O80"       # WHO ICD-10: Single spontaneous delivery
  discharge_diagnosis_code: "Z37.0"     # Single liveborn (mother-side outcome)
  length_of_stay_days:
    jp: 5                               # JSOG normal delivery LOS ~4-5 days
    us: 2                               # US Medicare/HEDIS ~2 days (48h stay)
  department: "obgyn"                   # falls back to internal_medicine when hospital lacks obgyn

# ---------------------------------------------------------------------------
# Delivery Procedure — emitted on the encounter with the JP/US billing code.
procedure:
  jp_code: "K894"                       # JP 医科診療報酬点数表: 分娩介助
  jp_display: "分娩介助"
  us_code: "59400"                      # US CPT: Routine obstetric care including antepartum, vaginal delivery, and postpartum care
  us_display: "Routine obstetric care, vaginal delivery"
  duration_minutes: 90                  # active labor + delivery interval on the day of birth

# ---------------------------------------------------------------------------
# Scheduling: for Z34-carrying women within the sim window, the
# scheduler emits one delivery event per year (Z34 in this generator
# represents "actively pregnant during the window"; a real pregnancy
# is 40 weeks and would span two calendar years for many patients —
# the MVP folds this into one delivery per Z34-year at a scheduled
# month range, deterministic per patient via sub-RNG).
#
# NOTE: ``scheduling`` is retained for backward compatibility with the
# pre-#957-Incr-1 delivery-only scheduler (still consumed by the abortion
# outcome branch's date placement). The Incr-1 pregnancy-lifecycle
# generator uses the ``lifecycle`` block below instead — annual
# conception Bernoulli with a proper LMP → EDD gestation cycle.
scheduling:
  delivery_month_range: [4, 10]         # broad window covering common delivery months

# ---------------------------------------------------------------------------
# Pregnancy lifecycle (META #957 Incr 1 — time-boxed pregnancy state).
#
# Replaces the "Z34 as chronic condition -> one delivery per year"
# model with a real biological lifecycle:
#
#   * Per-year conception Bernoulli against ``annual_conception_rate``
#     (age-banded, locale-specific; drawn from a per-(person, year)
#     sub-RNG so master rng cursor is untouched).
#   * On conception, open a ``TemporalStatePeriod(state_type="pregnancy")``
#     with metadata ``{lmp, edd}`` (LMP uniform-day-in-year,
#     EDD = LMP + ``gestation_days``).
#   * During the active period, emit ``prenatal_visit`` events at the
#     scheduled gestational ages that fall inside the sim year.
#   * On the year containing EDD, emit ``delivery`` (± jitter) + two
#     ``postpartum_visit`` events and close the period with
#     ``outcome="delivered"``.
#
# Rates (per-woman per-year Bernoulli — CONCEPTION rate, before
# abortion-outcome resolution by the ``abortion.probability_by_age``
# block below).
#
# Ages outside 15-49 do not conceive (sex_restriction Z34 gate is 15-49).
#
# Semantic note (session 103, Issue #1116):
#   Older revisions of this file described these as DELIVERY rates
#   (CDC birth rate / MHLW 出生率 verbatim), but the pipeline actually
#   applies the abortion filter downstream (``resolve_pregnancy_outcome``
#   in ``clinosim/simulator/perinatal.py``), so with birth-rate inputs
#   the emitted delivery count sat at ~2.9 %/fertile-female-year vs
#   the target ~5.5 %/yr (see #1116 instrumentation PR #1146). Values
#   are now calibrated as CONCEPTION rate ≈ birth rate × 1.4, so:
#     emitted_delivery = conception_rate × (1 − abortion_prob_by_age)
#                       ≈ conception_rate × 0.81 ≈ birth-rate target
#   The 1.4× multiplier is uniform across age bands (approximation —
#   real per-age pregnancy-loss ratios vary from ~1.9× at 15-19 to
#   ~2.3× at 40-44; sim's ``abortion.probability_by_age`` averages
#   ~20 % so a uniform 1.4× scales conception → delivery to the
#   right ballpark without a per-age lookup).
# Sources for the birth-rate base (pre-multiplication):
#   JP: MHLW 人口動態統計 出生率 2022 by 5-year maternal-age band —
#       crude age-specific birth rates rounded to 3 decimals.
#   US: CDC NVSR fertility rates 2022 by 5-year maternal-age band.
lifecycle:
  annual_conception_rate:
    jp:
      "15-19": 0.004    # birth 0.003 × 1.4 (session 103 #1116)
      "20-24": 0.032    # birth 0.023
      "25-29": 0.105    # birth 0.075
      "30-34": 0.139    # birth 0.099
      "35-39": 0.071    # birth 0.051
      "40-44": 0.011    # birth 0.008
      "45-49": 0.0003   # birth 0.0002
    us:
      "15-19": 0.020    # birth 0.014 × 1.4 (session 103 #1116)
      "20-24": 0.083    # birth 0.059
      "25-29": 0.134    # birth 0.096
      "30-34": 0.136    # birth 0.097
      "35-39": 0.078    # birth 0.056
      "40-44": 0.017    # birth 0.012
      "45-49": 0.001    # birth 0.001 (unchanged — below rounding threshold)
  # Full-term pregnancy length used to derive EDD from LMP.
  # 280 days = 40 weeks (Naegele's rule).
  gestation_days: 280
  # Jitter applied to the delivery date around EDD (uniform integer days).
  delivery_jitter_days: [-7, 7]
  # Prenatal visit schedule (simplified to 3 anchor visits at 12/24/36
  # gestational weeks; full q4w/q2w/q1w cadence deferred to Incr 1.5).
  prenatal_visit_gestational_weeks: [12, 24, 36]
  # Postpartum visits fired at these day offsets after the delivery date.
  postpartum_visit_offsets_days: [7, 28]

# ---------------------------------------------------------------------------
# Pregnancy complications sampler — Issue #1285. Bernoulli draws per
# complication at conception (per-pregnancy, per-mother sub-RNG derived
# from `perinatal_delivery_seed`), stored on the pregnancy
# TemporalStatePeriod's metadata as `complications: [<ICD>, ...]`. At
# delivery the encounter's `ClinicalDiagnosis.working_diagnoses` inherits
# these codes so FHIR emit renders them as secondary Conditions attached
# to the delivery encounter, matching the O10-O99 shape real EHRs carry.
#
# Prevalence figures reflect real-world US / CDC statistics (single
# probability applied to both locales for MVP; locale-specific rates
# can be added if the delta materially matters). Sources:
#   - GDM O24: 5-10 % of pregnancies (CDC / ADA — 6 % chosen as
#     an all-comers mid-band; higher in BMI-30+ cohort but the
#     current sampler is not BMI-conditional).
#   - Preeclampsia / eclampsia O14: 5-8 % (ACOG Task Force 2013).
#   - PROM O42: 3-8 % of term pregnancies (ACOG PB 217).
#   - Preterm labor O60: 10-12 % of pregnancies (CDC 2022 preterm
#     birth = 10.4 %).
#   - Malposition / malpresentation O64: 3-5 % (breech ~3 %).
#
# Draws are independent Bernoulli — a pregnancy may carry multiple
# complications. Aborted pregnancies (outcome="aborted") skip sampling
# entirely (the abortion path returns before reaching the delivery
# encounter, so no O-chapter code lands anywhere).
complications:
  # ICD-10 code, human-readable name (JA/EN), Bernoulli probability.
  # Each row is one complication.
  bernoulli_draws:
    - code: "O24.9"     # Diabetes mellitus in pregnancy, unspecified
      display_en: "Gestational diabetes mellitus"
      display_ja: "妊娠糖尿病"
      probability: 0.06
    - code: "O14.9"     # Pre-eclampsia, unspecified
      display_en: "Pre-eclampsia"
      display_ja: "妊娠高血圧腎症"
      probability: 0.05
    - code: "O42.9"     # Premature rupture of membranes, unspecified
      display_en: "Premature rupture of membranes"
      display_ja: "前期破水"
      probability: 0.05
    - code: "O60.1"     # Preterm labor with preterm delivery
      display_en: "Preterm labor with preterm delivery"
      display_ja: "早産（早産分娩を伴う）"
      probability: 0.10
    - code: "O64.9"     # Obstructed labor due to malposition, unspecified
      display_en: "Obstructed labor due to malposition or malpresentation"
      display_ja: "胎位異常による分娩停止"
      probability: 0.04

# ---------------------------------------------------------------------------
# Cesarean-section share (session 98 F7 fix — Incr 1.5 clinical realism).
# Real-world: US CDC 2022 = 32.1 %, JP MHLW 2020 = ~20 %. Pre-fix all
# deliveries emitted as O80 (single spontaneous vaginal delivery) which
# is clinically unrealistic — ~1/5 to ~1/3 of real deliveries are
# cesarean sections with different admission code, procedure code, and
# a longer LOS. Roll happens per-mother via the perinatal sub-RNG so
# activation is byte-neutral against non-perinatal patients.
#
# Emitted shape (when the C-section roll succeeds):
#   * admission_diagnosis_code = "O82" (WHO ICD-10 Single delivery by
#     cesarean section)
#   * discharge_diagnosis_code stays "Z37.0" (single liveborn — outcome
#     code, applies to both vaginal and cesarean)
#   * procedure code switches to the C-section CPT / MHLW code
#   * length_of_stay_days uses cesarean-specific values (higher: post-op
#     recovery adds 2-3 days)
cesarean:
  probability:
    us: 0.321                             # CDC NVSS 2022: 32.1 % cesarean rate
    jp: 0.204                             # MHLW 医療施設調査 2020: 20.4 % cesarean rate
  admission_diagnosis_code: "O82"         # WHO ICD-10: Single delivery by cesarean section
  procedure:
    jp_code: "K898"                       # JP 医科診療報酬点数表: 帝王切開術
    jp_display: "帝王切開術"
    us_code: "59510"                      # US CPT: Routine obstetric care incl. cesarean delivery and postpartum
    us_display: "Routine obstetric care, cesarean delivery"
    duration_minutes: 60                  # active cesarean surgery ~45-60 min (JSOG 2020)
  length_of_stay_days:
    jp: 8                                 # JSOG post-C-section LOS ~7-9 days
    us: 4                                 # US Medicare/HEDIS post-C-section ~3-4 days

# ---------------------------------------------------------------------------
# Abortion outcome for Z34 pregnancies (Issue #957 Tier-3-B slice 3).
# For a Z34-carrying woman, the per-mother sub-RNG rolls this table
# BEFORE the delivery event fires — if the roll succeeds the pregnancy
# ends in abortion (spontaneous O03.9 or induced O04.5) instead of
# progressing to delivery, and no newborn Patient chain is emitted.
#
# Rates: MHLW 母体保護統計 2020 + JSOG 2019 (JP-authoritative for age
# skew; US CDC WISQARS abortion surveillance for the US split).
# Split: within the pregnant cohort, ~1/3 of terminations at age 15-19
# are spontaneous (miscarriage) and ~2/3 are induced; the ratio flips
# past age 35 (higher spontaneous, lower induced). Encoded as two
# separate probability curves so both codes emit at realistic rates.
abortion:
  encounter:
    visit_reason:
      en: "Pregnancy termination"
      ja: "妊娠中絶"
    department: "obgyn"
    length_of_stay_days: 0                # outpatient day-surgery (AMB encounter)
    duration_minutes: 90
  procedure:
    jp_code: "K909"                       # JP: 子宮内容除去術
    us_code: "59840"                      # US CPT: Induced abortion, by D&C
  # Total abortion probability by mother's age at delivery draw time.
  # The remaining mass (1 - probability) proceeds to delivery.
  probability_by_age:
    "15-19": 0.40                         # ~40 % of adolescent pregnancies end in abortion (JP MHLW)
    "20-24": 0.25
    "25-29": 0.15
    "30-34": 0.10
    "35-44": 0.07
  # Split within an abortion event between spontaneous (O03.9) and
  # induced (O04.5). Younger cohorts skew toward induced; older skew
  # toward spontaneous miscarriage.
  induced_share_by_age:
    "15-19": 0.85
    "20-24": 0.70
    "25-29": 0.50
    "30-34": 0.35
    "35-44": 0.20

# ---------------------------------------------------------------------------
# Newborn-specific conditions sampled at the delivery encounter (Issue #957
# Tier-3-B Slice 3). Emitted on the newborn's chronic_conditions +
# birth-encounter clinical_diagnosis (in addition to the mandatory Z38.0
# single-liveborn code). Every entry uses a per-mother sub-RNG so the
# activation is byte-neutral against unrelated newborns.
#
# Sources: WHO / MHLW infant morbidity 2020, JSN / AAP guidelines.
# Only codes with a non-negligible incidence in the general term-birth
# population are listed here; NICU-specific conditions (P22.0 RDS at
# ~1 % in term neonates but ~50 % in <32-wk preterm, P29 cardiovascular
# disorders, etc.) are gated behind the P07.3 preterm-birth flag so
# they only fire on preterm-flagged newborns.
newborn_conditions:
  # Very common transient conditions — most resolve within days-weeks
  # of birth but appear on the delivery-encounter Condition list.
  - code: P59.9                         # Neonatal jaundice, unspecified
    probability: 0.20                   # ~20 % require documentation (transient physiological jaundice, higher in Asian populations)
    display_en: "Neonatal jaundice, unspecified"
    display_ja: "新生児黄疸、詳細不明"

  - code: P07.3                         # Preterm newborn (28-<37 wk)
    probability: 0.07                   # ~7 % of live births per MHLW / CDC natality
    display_en: "Preterm newborn (28 completed weeks to less than 37 completed weeks)"
    display_ja: "在胎 28-37 週の早産児"
    triggers:                           # conditions gated on this flag
      - code: P22.0                     # RDS — only meaningful on preterm
        conditional_probability: 0.35   # ~35 % of preterm 28-37wk newborns develop RDS
        display_en: "Respiratory distress syndrome of newborn"
        display_ja: "新生児呼吸窮迫症候群"

  # First-year chronic conditions the newborn carries onto the problem
  # list (persist beyond the birth encounter). Diaper dermatitis is
  # near-universal at some point but the "carries" rate is lower.
  - code: L22                           # Diaper dermatitis
    probability: 0.30                   # per-newborn carrier rate; on-and-off through infancy
    display_en: "Diaper dermatitis"
    display_ja: "おむつ皮膚炎"

  - code: L20.9                         # Atopic dermatitis, unspecified
    probability: 0.15                   # ~10-20 % of infants per MHLW allergy survey (JP higher than US)
    display_en: "Atopic dermatitis, unspecified"
    display_ja: "アトピー性皮膚炎、詳細不明"

# ---------------------------------------------------------------------------
# Newborn Patient construction defaults (#1252 N1).
#
# Previously `_build_newborn_patient` inherited the PatientProfile
# defaults for `baseline_vitals` (adult HR 72 / BP 120-75 / RR 16),
# which produced clinically implausible reference vitals on every
# baby and would cascade into any downstream vitals engine that
# perturbs `baseline_vitals` for a neonatal cohort. Neonatal medians
# below are drawn from AHA / Nelson Pediatrics 21st ed. term-newborn
# reference ranges + JP MHLW 母子保健統計. All are population medians
# for a healthy term newborn (0-28 days).
newborn:
  baseline_vitals:
    temperature: 36.7                   # °C — neutral thermal environment target
    heart_rate: 130                     # bpm — awake term median (100-160 range)
    systolic_bp: 68                     # mmHg — term day 1-3 median (55-80 range)
    diastolic_bp: 40                    # mmHg — term day 1-3 median (30-45 range)
    respiratory_rate: 40                # /min — term median (30-60 range)
    spo2: 97                            # % — post-transitional (day > 1, room air)
  # Occupation label. `PatientProfile.occupation` defaults to "other",
  # which surfaces on the FHIR US Core Patient Occupation observation as
  # "その他 / Other occupation" for every newborn — nonsensical for a
  # 0-day-old. Align with the framework's Issue #360 G7 developmental-
  # stage labels: age < 3 → "infant" (乳児 / Infant).
  occupation: "infant"
