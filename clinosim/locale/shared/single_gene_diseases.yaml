# Single-gene disease catalog + inheritance patterns (Issue #1581
# Phase C.3). Carrier status is sampled at initial cohort generation
# via a stable SHA-based quantile per (person_id, disease_code) so
# this layer is RNG-neutral (no master-stream shift). At newborn
# registration, child carrier/affected is computed from the parent
# phenotypes via Mendelian Punnett rules.
#
# Phenotype values stored on ``PersonRecord.carrier_status[icd]``:
#   "normal"   — no disease allele (homozygous reference for
#                autosomal; XX normal + male XY normal for X-linked)
#   "carrier"  — heterozygous (one disease allele; asymptomatic for
#                recessive conditions)
#   "affected" — homozygous (two disease alleles for autosomal) OR
#                hemizygous male / homozygous female for X-linked.
#                Affected individuals also get the ICD code appended
#                to ``chronic_conditions`` so the condition emits
#                through the standard FHIR disease pipeline.
#
# `carrier_frequency_by_race` meaning depends on inheritance_pattern:
#   autosomal_recessive  — P(≥ 1 disease allele) = 2pq + q². The
#                          allele frequency q = 1 - sqrt(1 - carrier_
#                          freq) is derived via Hardy-Weinberg.
#   x_linked_recessive   — the X-chromosome mutant-allele frequency q
#                          directly (= P(affected male)).
#   autosomal_dominant   — P(affected) directly (no asymptomatic
#                          carrier state; both Dd and DD show
#                          phenotype, but we assume all affected are
#                          Dd since DD is typically embryonic-lethal).
# The initial-cohort sampler derives the per-person phenotype from a
# race-conditional draw against this value.
#
# Race keys match the OMB categories in demographics.yaml:race_
# distribution ("white", "black", "asian", "native_american",
# "other"). Unknown race or empty-race locales (JP) fall through to
# the ``default`` entry.

single_gene_diseases:
  # Cystic fibrosis (CFTR). Clinical basis: Watts 2015 (Lancet
  # Respir Med) carrier-frequency survey; CDC newborn screening
  # 2022 US affected incidence ~1/3500 whites, lower in other
  # racial groups.
  E84:
    display: "Cystic fibrosis"
    inheritance_pattern: autosomal_recessive
    carrier_frequency_by_race:
      white:           0.040   # ~1/25 — classic European CF carrier rate
      black:           0.016   # ~1/60
      asian:           0.011   # ~1/90
      native_american: 0.016
      other:           0.020
      default:         0.015

  # Sickle cell disease (HBB). Clinical basis: CDC sickle cell
  # trait surveillance; 2010 Pediatrics review. Affected rate
  # ~1/400 African-American newborns, carrier (sickle cell trait)
  # ~8-10 %. Mediterranean + South Asian populations also carry
  # at non-trivial rates.
  D57.1:
    display: "Sickle-cell disease without crisis"
    inheritance_pattern: autosomal_recessive
    carrier_frequency_by_race:
      white:           0.001
      black:           0.080   # ~1/13 African-American
      asian:           0.003   # Alpha-thal / HbE more prevalent, but SCD rare
      native_american: 0.002
      other:           0.015   # Hispanic / Mediterranean captured in "other"
      default:         0.005

  # G6PD deficiency (G6PD gene, Xq28). Clinical basis: WHO 1989
  # G6PD review; Nkhoma 2009 (Blood Cells, Molecules, and Diseases)
  # worldwide prevalence survey. X-linked recessive — male carriers
  # ARE affected (hemizygous), female carriers are usually
  # asymptomatic but mild haemolysis under triggers (favism etc.) is
  # possible. ``carrier_frequency_by_race`` here is the X-chromosome
  # mutant-allele frequency q (not the female-carrier rate), which
  # equals P(affected male) directly. Female homozygous-affected
  # rate ≈ q² is small.
  D55.0:
    display: "Anaemia due to glucose-6-phosphate dehydrogenase deficiency"
    inheritance_pattern: x_linked_recessive
    carrier_frequency_by_race:
      white:           0.005   # ~0.5 % Northern European males affected
      black:           0.120   # ~12 % African-American males affected
      asian:           0.040   # Southeast Asia 2-6 % typical
      native_american: 0.015
      other:           0.080   # Mediterranean / Middle Eastern bulk
      default:         0.030

  # Hemophilia A (F8, Xq28). Clinical basis: WFH 2024 Annual Global
  # Survey + CDC Universal Data Collection program. X-linked
  # recessive, male incidence ~1/5000 live births globally with
  # minimal race variation (unlike G6PD) — the clotting-factor
  # mutations are not under the same regional selection pressure.
  # Severe disease is lifelong and requires factor replacement; the
  # yaml value is the X-chromosome mutant-allele frequency, equal
  # to P(affected male) ≈ 0.0002.
  D66:
    display: "Hereditary factor VIII deficiency"
    inheritance_pattern: x_linked_recessive
    carrier_frequency_by_race:
      white:           0.0002
      black:           0.0002
      asian:           0.0002
      native_american: 0.0002
      other:           0.0002
      default:         0.0002

  # Hemophilia B (F9, Xq27.1 — Christmas disease). Clinical basis:
  # WFH 2024 Annual Global Survey. Male incidence ~1/25000 live
  # births, ~4-5x rarer than hemophilia A (D66) but same X-linked
  # recessive inheritance. Clinically similar presentation
  # (bleeding diathesis), different clotting factor (IX vs VIII).
  # No significant race variation reported.
  D67:
    display: "Hereditary factor IX deficiency"
    inheritance_pattern: x_linked_recessive
    carrier_frequency_by_race:
      white:           0.00004
      black:           0.00004
      asian:           0.00004
      native_american: 0.00004
      other:           0.00004
      default:         0.00004

  # Huntington's disease (HTT, 4p16.3). Clinical basis: Fisher 2014
  # (Mov Disord) worldwide prevalence meta-analysis; ~5-10/100,000
  # Western populations with striking regional variation (lower in
  # East Asia at ~0.4/100,000). Autosomal dominant — a single
  # expanded CAG allele produces the phenotype, no asymptomatic
  # carrier state. Age of onset is typically 30-50 so sim-period
  # prevalence is close to population prevalence. The yaml value is
  # P(affected) = 1 - (1-q)² where q is the disease-allele frequency.
  G10:
    display: "Huntington's disease"
    inheritance_pattern: autosomal_dominant
    carrier_frequency_by_race:
      white:           0.00007
      black:           0.00007
      asian:           0.000005   # ~0.4/100k East Asian
      native_american: 0.00007
      other:           0.00007
      default:         0.00005

  # Marfan syndrome (FBN1, 15q21.1). Clinical basis: Pyeritz 2000
  # (Lancet) and Dietz GeneReviews — autosomal dominant connective-
  # tissue disorder, ~1/5000 globally with minimal race variation,
  # ~25% de novo mutations (not inherited). The catalog value is
  # the inherited component; de novo cases are not modeled at this
  # layer (would need a separate mutation-rate yaml). Phenotypically
  # affected individuals are heterozygous (Mm); homozygous MM is
  # embryonic-lethal.
  Q87.4:
    display: "Marfan syndrome"
    inheritance_pattern: autosomal_dominant
    carrier_frequency_by_race:
      white:           0.0002
      black:           0.0002
      asian:           0.0002
      native_american: 0.0002
      other:           0.0002
      default:         0.0002
