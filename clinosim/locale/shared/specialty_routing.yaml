# Specialty routing (Phase 1 — US, Issue #1698).
#
# Chronic condition → clinical specialty + guideline-based visit cadence.
# The outpatient dispatcher reads this table on each chronic_followup
# iteration and synthesises one additional per-(specialty, cadence period)
# encounter per patient-year, additively on top of the primary care /
# internal medicine chronic_followup stream.
#
# Phase 1 ships cadence-driven fan-out only. Phase 2 adds:
#   - stage gating (CCS I → PCP only vs CCS III → cardio every 6 mo)
#   - per-specialty chief-complaint catalog
#   - JP locale split (JP 診療科 differ from US names)
#   - ServiceRequest / Encounter.referralRequest emit
# Phase 2 is tracked under META #1694.
#
# Cadence values match the Phase 4e / 4f tracker shape in
# clinosim/simulator/outpatient.py:
#   annual       — once per calendar year
#   semi_annual  — once per calendar half (H1 Jan-Jun, H2 Jul-Dec)
#   quarterly    — once per calendar quarter (Q1-Q4)

routes:
  # Oncology — every cancer (the `malignancy` value set in
  # codes/data/valuesets.yaml, also used by outpatient department routing;
  # Issue #2290), annual survivorship surveillance.
  # Multi-cancer-family patients (e.g. C50 + C18) see ONE oncology visit per
  # calendar year, deduped at specialty level in the dispatcher tracker.
  - requires_concept_group: malignancy
    specialty: oncology
    visit_reason: {en: "Oncology survivorship follow-up", ja: "腫瘍内科 サバイバーシップ外来"}
    cadence: annual
    clinical_basis: "NCCN survivorship guidelines (per cancer family — generic annual Phase 1 proxy; Phase 2 may add family-specific cadence overrides)"

  # Cardiology — AFib, chronic HF, chronic IHD. Semi-annual stable follow-up.
  - requires_chronic: ["I48", "I50", "I25"]
    specialty: cardiology
    visit_reason: {en: "Cardiology stable follow-up", ja: "循環器内科 定期外来"}
    cadence: semi_annual
    clinical_basis: "ACC/AHA 2019 Chronic HF Guideline (I50) + 2019 Chronic Coronary Syndromes (I25) + ACC/AHA 2023 AFib Guideline (I48) — stable chronic cardiology follow-up"

  # Psychiatry — depressive and anxiety disorders. Quarterly treatment-phase
  # follow-up. Phase 1 fires regardless of severity; Phase 2 will stage-gate
  # on PHQ-9 / GAD-7 bands.
  - requires_chronic: ["F32", "F33", "F41.1"]
    specialty: psychiatry
    visit_reason: {en: "Psychiatry treatment-phase follow-up", ja: "精神科 治療期外来"}
    cadence: quarterly
    clinical_basis: "APA 2010 Practice Guideline for the Treatment of Depressive Disorder + VA/DoD 2022 Clinical Practice Guideline for the Management of MDD — treatment-phase quarterly follow-up"

  # Psychiatry — schizophrenia (Issue #2140). Maintenance antipsychotic
  # treatment with regular psychiatric review.
  - requires_chronic: ["F20"]
    specialty: psychiatry
    visit_reason: {en: "Psychiatry treatment-phase follow-up", ja: "精神科 治療期外来"}
    cadence: quarterly
    clinical_basis: "APA 2020 Practice Guideline for the Treatment of Patients With Schizophrenia — ongoing assessment of symptoms, adherence and antipsychotic side effects"

  # Psychiatry — bipolar disorder (Issue #2142). Maintenance mood-stabilizer
  # treatment with mood-episode and drug-level review.
  - requires_chronic: ["F31"]
    specialty: psychiatry
    visit_reason: {en: "Psychiatry treatment-phase follow-up", ja: "精神科 治療期外来"}
    cadence: quarterly
    clinical_basis: "CANMAT / ISBD 2018 Guidelines for the Management of Patients With Bipolar Disorder — maintenance-phase monitoring of mood, adherence and mood-stabilizer safety labs"

  # Pulmonology — COPD. Annual stable follow-up.
  - requires_chronic: ["J44"]
    specialty: pulmonology
    visit_reason: {en: "Pulmonology stable COPD follow-up", ja: "呼吸器内科 COPD 定期外来"}
    cadence: annual
    clinical_basis: "GOLD 2024 — stable COPD maintenance follow-up (q6-12mo per GOLD stage; Phase 1 picks the annual lower bound)"
