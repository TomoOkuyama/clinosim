# Annual stage-transition probabilities for progressive chronic diseases.
#
# Consumed by `clinosim.modules.population.aging._disease_progression`
# (Issue #1572 Phase 2.5 body PR, follow-up). The pass reads
# ``person.disease_stages[icd_prefix]`` (populated by
# ``activate_patient`` since the prep PR), draws a per-year
# Bernoulli at ``annual_advance_probability[current_stage]``, and on
# a hit advances to the next stage in ``stages``. Stays at terminal
# stage (probability 0.0) — further mortality is a Phase 2 concern
# handled by ``_condition_reactive_mortality``.
#
# Stage strings match the format already stored in
# ``person.disease_stages`` (and in Layer-2
# ``PatientProfile.chronic_conditions[].stage``) so no string
# translation is needed on the hot path. For CKD, that is
# ``"CKD G*"``; for COPD, ``"GOLD *"`` (no prefix); for heart
# failure, ``"NYHA I/II/III/IV"`` (NYHA Roman numeral form); for
# ischemic heart disease, ``"CCS I/II/III"`` (CCS angina class);
# for dementia, ``"CDR 0.5/1/2/3"`` (Clinical Dementia Rating).
#
# Scope: CKD + COPD + heart failure (NYHA) + ischemic heart disease
# (CCS) + dementia (CDR). Diabetes glycemic trajectory requires a
# continuous HbA1c trajectory model (not a discrete stage), tracked
# as a separate follow-up (Phase 2.5 extension).

stage_transitions:
  # ------------------------------------------------------------------
  # N18 Chronic kidney disease (KDIGO stages G1-G5)
  # ------------------------------------------------------------------
  # Clinical basis: Thompson S et al, Kidney Int 2013; CRIC cohort
  # (Grams ME et al, JASN 2013); NEPTUNE natural-history data.
  # Progression accelerates with stage; G4 → G5 is the fastest
  # single-year transition in the natural history. G5 is terminal
  # here — further mortality is driven by condition-reactive qx in
  # Issue #1564 Phase 2 (`_condition_reactive_mortality`).
  N18:
    stages: ["CKD G1", "CKD G2", "CKD G3a", "CKD G3b", "CKD G4", "CKD G5"]
    annual_advance_probability:
      "CKD G1": 0.015    # G1 → G2: ~1.5 %/yr (slowly progressive)
      "CKD G2": 0.025    # G2 → G3a
      "CKD G3a": 0.050   # G3a → G3b
      "CKD G3b": 0.080   # G3b → G4
      "CKD G4": 0.120    # G4 → G5: fastest single-step
      "CKD G5": 0.0      # terminal (handled by reactive mortality)

  # ------------------------------------------------------------------
  # J44 Chronic obstructive pulmonary disease (GOLD 1-4)
  # ------------------------------------------------------------------
  # Clinical basis: GOLD 2023 report; Casanova C et al, AJRCCM 2011
  # (BODE index longitudinal); Vestbo J et al, NEJM 2011 (ECLIPSE).
  # Progression is slower and more variable than CKD; smoking status
  # and exacerbation frequency are the dominant per-patient
  # modifiers, which Phase 2.5 does not yet condition on — the
  # per-stage rate here reflects an all-cohort average. Smoking-
  # status-conditional refinement is left as a Phase 3 concern.
  J44:
    stages: ["GOLD 1", "GOLD 2", "GOLD 3", "GOLD 4"]
    annual_advance_probability:
      "GOLD 1": 0.080    # mild → moderate
      "GOLD 2": 0.120    # moderate → severe
      "GOLD 3": 0.150    # severe → very severe
      "GOLD 4": 0.0      # terminal (handled by reactive mortality)

  # ------------------------------------------------------------------
  # I50 Heart failure (NYHA functional classification I-IV)
  # ------------------------------------------------------------------
  # Clinical basis: Ponikowski P et al, 2016 ESC HF guidelines (Eur
  # Heart J 37:2129); MERIT-HF natural-history data; SOLVD and
  # V-HeFT progression cohorts. Progression is driven by cardiac
  # remodelling + diuretic responsiveness; rates below reflect an
  # all-cohort average without conditioning on LVEF phenotype
  # (HFrEF vs HFpEF) or guideline-directed therapy adherence —
  # phenotype- and therapy-conditional refinement is a planned
  # Phase 3 concern. NYHA IV is terminal here; further mortality
  # is driven by condition-reactive qx in `_condition_reactive_
  # mortality` (Issue #1564 Phase 2).
  I50:
    stages: ["NYHA I", "NYHA II", "NYHA III", "NYHA IV"]
    annual_advance_probability:
      "NYHA I": 0.050     # I → II: ~5 %/yr (slow at compensated phase)
      "NYHA II": 0.080    # II → III
      "NYHA III": 0.120   # III → IV: accelerates with decompensation
      "NYHA IV": 0.0      # terminal (handled by reactive mortality)

  # ------------------------------------------------------------------
  # I25 Ischemic heart disease (CCS angina classification I-III)
  # ------------------------------------------------------------------
  # Clinical basis: COURAGE optimal medical arm long-term follow-up
  # (Boden WE et al, NEJM 2007 and Sedlis SP et al, NEJM 2015);
  # SOLVD stable-angina natural history. CCS class reflects
  # functional limitation and worsens with CAD progression +
  # suboptimal secondary prevention. Rates below reflect an
  # all-cohort average without conditioning on revascularisation
  # status, LVEF, or guideline-directed therapy adherence —
  # treatment-conditional refinement is a planned Phase 3 concern.
  # CCS IV (angina at rest) is intentionally omitted here per the
  # existing design in ``_severity_activation.I25_STAGES`` comment
  # (CCS IV arrives via the disease-YAML encounter path as an
  # active acute-coronary scenario, not a chronic stage). CCS III
  # is terminal in this progression table; further mortality is
  # driven by condition-reactive qx (I25 SMR 2.0 already in
  # ``condition_mortality_smr.yaml``).
  I25:
    stages: ["CCS I", "CCS II", "CCS III"]
    annual_advance_probability:
      "CCS I": 0.050     # I → II: ~5 %/yr (effort-angina stable)
      "CCS II": 0.080    # II → III: accelerating limitation
      "CCS III": 0.0     # terminal (handled by reactive mortality)

  # ------------------------------------------------------------------
  # F00 Dementia (Clinical Dementia Rating, CDR 0.5-3)
  # ------------------------------------------------------------------
  # Clinical basis: Morris JC 1993 (Neurology 43:2412); Hughes 1982
  # (Br J Psychiatry 140:566); Mitchell SL 2009 NEJM (natural history
  # of advanced dementia); Dubois B 2016 Lancet Neurol (preclinical AD).
  # Progression is monotonic in the natural history under baseline
  # care. Annual advance rates reflect the diagnosed-F00 population
  # (not preclinical). Cholinesterase-inhibitor / memantine effect
  # is NOT modelled as a per-patient modifier here — therapy-
  # conditional refinement is a planned Phase 3 concern. CDR 3 is
  # terminal in this progression table; further mortality is driven
  # by condition-reactive qx (F00 / F03 SMR 2.0 already in
  # ``condition_mortality_smr.yaml``).
  F00:
    stages: ["CDR 0.5", "CDR 1", "CDR 2", "CDR 3"]
    annual_advance_probability:
      "CDR 0.5": 0.120   # MCI → mild AD conversion: ~12 %/yr (Petersen 2001)
      "CDR 1": 0.180     # mild → moderate: ~18 %/yr
      "CDR 2": 0.200     # moderate → severe: ~20 %/yr (fastest step)
      "CDR 3": 0.0       # terminal (handled by reactive mortality)

  # ------------------------------------------------------------------
  # K70 Alcoholic liver disease / cirrhosis (Child-Pugh A/B/C)
  # ------------------------------------------------------------------
  # Clinical basis: D'Amico 2006 (J Hepatol) natural-history
  # meta-analysis of compensated → decompensated progression;
  # Pugh 1973 (Br J Surg) original Child-Pugh scoring. 1-year
  # mortality in untreated cohorts tracks ~5 % (A) / ~20 % (B) /
  # ~55 % (C), so decompensation is the dominant time-driven
  # process. Rates below reflect an all-cohort baseline without
  # conditioning on continued alcohol use, HCC surveillance, or
  # transplant availability — treatment- and lifestyle-conditional
  # refinement is a planned Phase 3 concern. Child-Pugh C is
  # terminal here; further mortality is driven by condition-
  # reactive qx in ``condition_mortality_smr.yaml``.
  K70:
    stages: ["Child-Pugh A", "Child-Pugh B", "Child-Pugh C"]
    annual_advance_probability:
      "Child-Pugh A": 0.070   # A → B: ~7 %/yr (D'Amico ~5-10 %)
      "Child-Pugh B": 0.120   # B → C: faster decline
      "Child-Pugh C": 0.0     # terminal (handled by reactive mortality)

  # ------------------------------------------------------------------
  # K74 Fibrosis & cirrhosis of liver (non-alcoholic etiology)
  # ------------------------------------------------------------------
  # Clinical basis: same D'Amico 2006 natural-history data applies;
  # the non-alcoholic (NAFLD / NASH / viral / autoimmune) etiologies
  # follow the same Child-Pugh scoring and have similar decompensation
  # rates once cirrhosis is established, though mean time to
  # cirrhosis from fibrosis is slower than alcoholic. The progression
  # table encodes the post-cirrhosis trajectory, which is etiology-
  # agnostic. Terminal and reactive-mortality follow the same
  # pattern as K70.
  K74:
    stages: ["Child-Pugh A", "Child-Pugh B", "Child-Pugh C"]
    annual_advance_probability:
      "Child-Pugh A": 0.060   # A → B: slightly slower than alcoholic
      "Child-Pugh B": 0.110
      "Child-Pugh C": 0.0     # terminal (handled by reactive mortality)

  # ------------------------------------------------------------------
  # G20 Parkinson's disease (Hoehn & Yahr 1-5)
  # ------------------------------------------------------------------
  # Clinical basis: Hoehn & Yahr 1967 (Neurology 17:427) original
  # scale; Zhao 2010 (Mov Disord) outpatient cohort progression
  # data; Jankovic 2008 (JNNP) natural history under modern
  # levodopa therapy. Mean time per stage in the Jankovic review is
  # ~2-3 years for stages 1-3 and lengthens at stage 4 as patients
  # plateau on levodopa response plus wheelchair use. These rates
  # reflect the all-cohort average without conditioning on age at
  # onset or levodopa-responder phenotype — therapy-conditional
  # refinement is a planned Phase 3 concern. H&Y 5 is terminal
  # here; further mortality is driven by condition-reactive qx
  # (G20 falls / aspiration pneumonia already in demographics
  # risk_multipliers table).
  G20:
    stages: ["H&Y 1", "H&Y 2", "H&Y 3", "H&Y 4", "H&Y 5"]
    annual_advance_probability:
      "H&Y 1": 0.350   # ~3 years per stage → ~0.33 /yr Bernoulli
      "H&Y 2": 0.300
      "H&Y 3": 0.250   # slows as balance plateau sets in
      "H&Y 4": 0.180
      "H&Y 5": 0.0     # terminal (handled by reactive mortality)

  # ------------------------------------------------------------------
  # I48 Atrial fibrillation (AHA/ACC/HRS 2024 classification)
  # ------------------------------------------------------------------
  # Clinical basis: de Vos 2010 (Circulation 121:1-9) prospective
  # cohort progression of paroxysmal → persistent → permanent AF;
  # AFNET registry; 2024 AHA/ACC/HRS AF Guideline. Rate-control vs
  # rhythm-control therapy is NOT conditioned on at the aging-pass
  # layer (de Vos data pre-dates widespread catheter ablation);
  # therapy-conditional refinement is a planned Phase 3 concern.
  # Permanent AF is terminal in this progression table; further
  # mortality is driven by condition-reactive qx (I48 already in
  # the stroke / HF / sepsis risk_multipliers table).
  I48:
    stages: ["Paroxysmal", "Persistent", "Long-standing persistent", "Permanent"]
    annual_advance_probability:
      "Paroxysmal": 0.150              # ~10-25 %/yr paroxysmal → persistent (de Vos 2010)
      "Persistent": 0.120              # ~10-15 %/yr persistent → long-standing persistent
      "Long-standing persistent": 0.150 # ~10-20 %/yr long-standing → permanent
      "Permanent": 0.0                 # terminal
