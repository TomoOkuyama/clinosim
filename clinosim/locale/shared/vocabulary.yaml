# Social-history and encounter vocabularies — one display table per
# vocabulary (Issue #2269).
#
# FHIR (Patient occupation extension), narrative templates and LLM prompts all
# read these sections: `load_narrative_labels()` and `load_llm_prompt_labels()`
# take these sections from here, and `load_occupation_display()` returns
# `occupation`. New code calls `clinosim.locale.loader.vocab_display(vocab,
# slug, lang)`. Missing language → English (the shared fallback policy).
#
# Format: <slug>: {en: <English>, ja: <日本語>}. Alias slugs that other
# producers emit (never_smoker, walk_in, ems, ...) are listed as their own
# rows with the same display.
#
# Merged from locale/shared/occupation_display.yaml (FHIR) and the
# occupation / smoking / alcohol / arrival_mode sections of
# narrative_labels.yaml and llm_prompt_labels.yaml, which had diverged
# (office: 事務・専門職 vs 事務職, walk-in: 自来院（Walk-in） vs 独歩来院, ...).

occupation:
  # Sampled by modules/population/_identity.py::_sample_occupation.
  agriculture: {en: Agricultural worker, ja: 農業従事者}
  construction: {en: Construction worker, ja: 建設業}
  disabled: {en: Unable to work, ja: 就労困難}
  education: {en: Educator, ja: 教育関係者}
  finance: {en: Finance professional, ja: 金融業}
  government: {en: Government employee, ja: 公務員}
  healthcare: {en: Healthcare worker, ja: 医療従事者}
  homemaker: {en: Homemaker, ja: 主婦・主夫}
  hospitality: {en: Hospitality worker, ja: 接客業}
  it: {en: IT professional, ja: IT 関係者}
  management: {en: Manager, ja: 管理職}
  manufacturing: {en: Manufacturing worker, ja: 製造業}
  office: {en: Office worker, ja: 事務職}
  other: {en: Other, ja: その他}
  professional: {en: Professional, ja: 専門職}
  retail: {en: Retail worker, ja: 小売業}
  retired: {en: Retired, ja: 退職}
  sales: {en: Sales worker, ja: 販売職}
  self_employed: {en: Self-employed, ja: 自営業}
  service: {en: Service industry worker, ja: サービス業}
  transportation: {en: Transportation worker, ja: 運輸業}
  unemployed: {en: Unemployed, ja: 無職}
  # Developmental stages for minors (Issue #360 G7).
  infant: {en: Infant, ja: 乳幼児}
  preschool: {en: Preschool child, ja: 未就学児}
  elementary_student: {en: Elementary school student, ja: 小学生}
  middle_school_student: {en: Middle school student, ja: 中学生}
  middle_student: {en: Middle school student, ja: 中学生}
  high_school_student: {en: High school student, ja: 高校生}
  high_student: {en: High school student, ja: 高校生}
  university_student: {en: University student, ja: 大学生}
  student: {en: Student, ja: 学生}

smoking:
