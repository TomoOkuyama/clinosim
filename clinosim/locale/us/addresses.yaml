# US address data — Massachusetts area (northeastern US)
# Source: US Census Bureau, USPS ZIP code database

state: "MA"
country: "US"

# Cities/towns with ZIP codes (weighted by population)
cities:
  - {city: "Boston", zips: ["02101", "02108", "02109", "02110", "02111", "02113", "02114", "02115", "02116", "02118", "02119", "02120", "02121", "02122", "02124", "02125", "02126", "02127", "02128", "02129", "02130", "02131", "02132", "02134", "02135", "02136"], weight: 30}
  - {city: "Worcester", zips: ["01601", "01602", "01603", "01604", "01605", "01606", "01607", "01608", "01609", "01610"], weight: 10}
  - {city: "Springfield", zips: ["01101", "01103", "01104", "01105", "01107", "01108", "01109"], weight: 8}
  - {city: "Cambridge", zips: ["02138", "02139", "02140", "02141", "02142"], weight: 7}
  - {city: "Lowell", zips: ["01850", "01851", "01852", "01853", "01854"], weight: 6}
  - {city: "Brockton", zips: ["02301", "02302", "02303"], weight: 5}
  - {city: "Quincy", zips: ["02169", "02170", "02171"], weight: 5}
  - {city: "Lynn", zips: ["01901", "01902", "01903", "01904", "01905"], weight: 5}
  - {city: "Newton", zips: ["02458", "02459", "02460", "02461", "02462", "02464", "02465", "02466", "02467", "02468"], weight: 5}
  - {city: "Somerville", zips: ["02143", "02144", "02145"], weight: 4}
  - {city: "Framingham", zips: ["01701", "01702"], weight: 4}
  - {city: "Brookline", zips: ["02445", "02446", "02447"], weight: 3}
  - {city: "Medford", zips: ["02155"], weight: 3}
  - {city: "Waltham", zips: ["02451", "02452", "02453"], weight: 3}
  - {city: "Arlington", zips: ["02474", "02476"], weight: 2}

# Street name patterns
street_names:
  - "Main St"
  - "Oak St"
  - "Maple Ave"
  - "Washington St"
  - "Commonwealth Ave"
  - "Beacon St"
  - "Harvard St"
  - "Elm St"
  - "Park Ave"
  - "Highland Ave"
  - "Summer St"
  - "Winter St"
  - "Spring St"
  - "Church St"
  - "School St"
  - "Center St"
  - "Pine St"
  - "Cedar St"
  - "Pleasant St"
  - "Franklin St"

# Street line (clinosim/locale/patterns.py draw_pattern; fields drawn in
# order): "123 Main St". House numbers 1-499.
street_line:
  fields:
    - {name: street, choice: street_names}
    - {name: number, integer: [1, 500]}
  format: "{number} {street}"

# Apartment probability (35% in MA urban area); the unit is appended to the
# street line: "123 Main St, Apt 7" (units 1-12).
apartment_probability: 0.35
apartment_line:
  fields:
    - {name: number, integer: [1, 13]}
  format: ", Apt {number}"

# Phone patterns
phone:
  area_codes: ["617", "508", "781", "978", "413", "857", "339", "351"]
  mobile_prefix: ["617", "508", "781"]  # same area codes for mobile
  # NANP number: exchange 200-998 (no leading 0/1), line 1000-9998.
  # clinosim/locale/patterns.py draw_pattern; `choice` names a list above.
  mobile:
    fields:
      - {name: area, choice: mobile_prefix}
      - {name: exchange, integer: [200, 999]}
      - {name: number, integer: [1000, 9999]}
    format: "({area}) {exchange:03d}-{number:04d}"  # (617) 555-1234
  landline:
    fields:
      - {name: area, choice: area_codes}
      - {name: exchange, integer: [200, 999]}
      - {name: number, integer: [1000, 9999]}
    format: "({area}) {exchange:03d}-{number:04d}"
  # Hospital staff work phone (staff roster): any NANP area code.
  staff_work:
    fields:
      - {name: area, integer: [200, 999]}
      - {name: exchange, integer: [200, 999]}
      - {name: number, integer: [1000, 9999]}
    format: "({area}) {exchange}-{number}"
  # Ward phone on the encounter CareTeam: derived from a hash of the
  # encounter and ward (format_hash_pattern), in the 555 area code reserved
  # for fiction.
  ward:
    format: "(555) {high:03d}-{low:04d}"
    low_modulus: 10000
    high_modulus: 1000

# Contact patterns (US)
contact_rules:
  adult_male_mobile_probability: 0.85    # 85% use mobile as primary
  adult_female_mobile_probability: 0.70  # 70% use mobile
  child_uses_parent_phone: true
  household_has_landline_probability: 0.40  # declining in US

# FHIR Address shape (Issue #3141; read by
# clinosim/modules/output/fhir_r4/lib/common.py build_address). line_template
# fields: state, city, line1. state: "name" (as written) or "jis_x0401".
fhir_address:
  line_template: "{line1}"
  state: name
