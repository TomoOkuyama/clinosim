# US demographic data for population generation
# Source: US Census Bureau (2020), CDC NHANES, AHA statistics

average_household_size: 2.5

# Age distribution (proportional, sums to 1.0)
# Source: US Census Bureau 2020 — general-population Census.
#
# NOTE ON OUTPUT COHORT SKEW:
# This is the input sampling target for the SYNTHETIC POPULATION, not the
# emitted patient cohort. Downstream care-seeking + encounter-emission
# filters drop non-visiting persons, so the observed cohort skews
# elderly-heavy vs the general Census. This mirrors real hospital
# catchment (Medicare-user cohort). Do NOT reweight this table to make
# the emitted cohort match Census — the general-population sampling
# contract is depended on by demographics-conditional risk calculations.
# See modules/population/README.md "Cohort skew vs sampled population" note.
age_distribution:
  "0-14": 0.18
  "15-24": 0.13
  "25-34": 0.14
  "35-44": 0.13
  "45-54": 0.13
  "55-64": 0.13
  "65-74": 0.09
  "75-84": 0.05
  "85-99": 0.02

# Blood type distribution
# Source: American Red Cross
blood_type:
  O: 0.44
  A: 0.42
  B: 0.10
  AB: 0.04

# Chronic disease prevalence by age range
# Format: ICD-10 code -> {age_range: prevalence}
# Source: CDC, AHA, NHANES
#
# Semantics (B-3, marginal-preserving engine — 2026-08-28):
# Each value below is the TARGET MARGINAL PREVALENCE for that code in that
# age band in the SAMPLED SYNTHETIC POPULATION (the input to the pipeline,
# matching US general-population + Medicare-user epi statistics as cited
# inline per code). The engine rescales per-patient probability by the
# population-expected compound (comorbidity + lifestyle) multiplier so
# multipliers still shape WHICH patients get the condition without pushing
# the sampled-population marginal above target.
#
# The EMITTED patient cohort (after care-seeking + encounter-emission
# filters) skews sicker than the sampled population — patients with more
# chronic conditions are more likely to seek care. That downstream skew is
# by design (mirrors real hospital catchment / Medicare-user cohort) and
# is NOT compensated for here. See
# clinosim/modules/population/README.md "Marginal-preserving prevalence"
# and "Cohort skew vs sampled population".
chronic_prevalence:
  I10:      # Hypertension — NHANES 2017-18 adult 18+ ≈ 47.3% (age-stratified:
    # 18-39 ≈ 22%, 40-59 ≈ 54%, 60+ ≈ 74%). Cohort target hits the middle
    # of ``hypertension_adult_prev_pct: (40, 50)`` in scripts/verify_medical_stats.py.
    # Issue #1108 (C11a, 2026-09-05): age-band recalibration replaces the
    # single "40-99": 0.22 band (observed cohort ~25 %, below the 40-50 band)
    # with three 40+ bands that hit ~41 % cohort adult prev — in target.
    # The prior single-band was itself Issue #943's rebalance (0.33 → 0.22)
    # against I10 encounter reasonCode dominance; the paired
    # chronic_followup 1→4 mo interval remains in place. Age-band values
    # sit ~30-40 % below NHANES age-band %s to leave headroom for the
    # care-seeker skew (empirically ~1.1-1.5× depending on band) that
    # lifts emitted cohort prev above sampled marginal.
    # RNG-neutral: bands are non-overlapping and each patient age ≥ 40
    # matches exactly one band, so ``rng.random()`` call count per
    # patient stays identical to the single-band shape (18-39 skipped
    # both before and after this change). See
    # ``feedback_rng_shift_patient_cache_cascade`` in maintainer memory.
    "40-59": 0.30
    "60-79": 0.50
    "80-99": 0.65
  # NOTE (B-3 phase 2, Issue #919): E11.9 / E78 / J44 / N18 restored to
  # Medicare-user cohort targets under the marginal-preserving engine
  # (v0.5.0 / PR #902); the old Issue #739 ~0.5× downscale is no longer
  # needed and was double-compensating. I10 kept at 0.33 (already on target).
  E11.9:    # Type 2 DM — CDC general 14%; cohort target ~20% (Medicare-user)
    "40-99": 0.16
  E78:      # Dyslipidemia — CDC high cholesterol ~40%; cohort target ~55% (Medicare)
    "40-99": 0.44
  J44:      # COPD — CDC ~6% general; cohort target ~12% (Medicare-user)
    "40-99": 0.10
  N18:      # CKD — CDC ~14% of adults; cohort target ~17% (Medicare-user).
    # Issue #1113 (C11f, 2026-09-05): band raised 0.14 → 0.28 to land the
    # emitted cohort in the (10, 20) benchmark band in verify_medical_stats.py
    # (pre-fix observed 7.19 % on US p=10k s=321). Same age band structure so
    # ``rng.random()`` call count per patient is byte-identical to the
    # pre-fix shape — 60+ patients still hit exactly one draw for N18.
    "60-99": 0.28
  I50:      # Heart failure — cohort target ~2.4 % (US CHF prev).
    # Issue #1113 (C11f, 2026-09-05): band raised 0.04 → 0.08 to land the
    # emitted cohort in the (1.5, 3.5) benchmark band in
    # verify_medical_stats.py (pre-fix observed 1.42 % on US p=10k s=321).
    # RNG-neutral, same "65-99" band shape.
    "65-99": 0.08
  I48:      # Atrial fibrillation — ~2% age 50+, ~10% age 75+
    "50-74": 0.02
    "75-99": 0.10
  I25:      # Ischemic heart disease — ~5% age 50+, ~15% age 70+
    "50-69": 0.05
    "70-99": 0.15
  M81:      # Osteoporosis — NHANES 2017-18 age-adj 50+ ≈ 12.6 %; women 27.1 % vs
    # men 4-5 % at 65+ (marked female skew per NCHS Data Brief 405).
    # Issue #1136 (2026-09-05, partial): single-band value bump 0.12 → 0.20
    # to close the overall gap. Sex-asymmetry (by_sex conversion) DEFERRED —
    # augment_sex_bands migration from a sex-neutral single-band code shifts
    # the master rng cursor for the previously-covered opposite sex (males
    # in this case). See META #1137 — needs an ``augment_age_bands`` /
    # ``augment_sex_from_neutral`` mechanism as a follow-up architectural
    # improvement before by_sex on M81 can land byte-neutral.
    "60-99": 0.20
  F00:      # Dementia/Alzheimer — Alz Association 2024 F&F: 5.0 % (65-74),
    # 13.2 % (75-84), 33.4 % (85+) — average ~11 % of 65+.
    # Issue #1131 (2026-09-05): raised ``65-84`` value 0.03 → 0.07 to reach
    # averaged Alz Assoc target. RNG-neutral (single-band value bump, same
    # age-band structure, no new draws). Split into (65-74) + (75-84) bands
    # was rejected as it would add rng.random() draws for 65-74 patients.
    # See META #1137 for design authority.
    "65-84": 0.07
    "85-99": 0.30
  G20:      # Parkinson's disease — ~0.5% age 60+, ~2% age 80+
    "60-79": 0.005
    "80-99": 0.02
  E03:      # Hypothyroidism — ~5% age 50+
    "50-99": 0.05
  K21:      # GERD — ~15% age 40+
    "40-99": 0.15
  J45:      # Asthma — ~8% all ages
    "0-99": 0.08
  N40:      # BPH (benign prostatic hyperplasia) — male only ~8% age 50+
    sex: M
    "50-99": 0.08
  M17:      # Osteoarthritis — ~15% age 50+, ~30% age 70+
    "50-69": 0.15
    "70-99": 0.30

  # --- Oncology (Issue #943) ------------------------------------------------
  # Target marginal prevalence for active cancer + on-treatment survivors on
  # the problem list. Sources: SEER Cancer Statistics 2020 (5yr survivor
  # prevalence rates), CDC Cancer Registries. C61 (prostate) is male-only
  # via clinosim/locale/shared/icd10_sex_restrictions.yaml; C50 (breast)
  # uses ``by_sex`` because it emits at meaningfully different rates for
  # females vs males (Issue #957).
  # "Chronic" here means persistent problem-list entry with follow-up; true
  # initial-onset (dx week, first chemo cycle) is out of scope for this pass.
  # --- Cancer 60+ under-emit fix (Issue #1130, 2026-09-05) ---
  # 5-year US p=10k cohort measured 60-74 = 6.72 % / 75+ = 8.67 %, against
  # SEER 2023 15-18 % (60-74) / 18-22 % (75+). Bands raised ~1.6-1.8× on
  # 70-99 (elderly) bands to close the gap. RNG-neutral (existing bands,
  # value bumps only — no new age band). Per META #1137 decision (Option A).
  C18:      # Colon cancer — SEER incidence 40 per 100k, survivor ~2%
    "50-69": 0.014
    "70-99": 0.035
  C22:      # Liver cancer — SEER lower than JP, but rising with NAFLD/HCV
    "50-69": 0.006
    "70-99": 0.016
  C34:      # Lung cancer — SEER top cause of cancer death; survivor ~1.5%
    "50-69": 0.012
    "70-99": 0.030
  C50:      # Breast cancer — SEER incidence ~130 per 100k (female), survivor ~3%.
            # Male BC is ~1% of C50 total (SEER 2020 male breast-cancer
            # incidence ~1.3 per 100k, primarily age 60+; carrier prevalence
            # ~0.02% of the male 60+ cohort). Female age profile peaks 40-60,
            # male profile shifts later (60+), so bands are declared per
            # sex rather than sharing a single set with a scalar rescale.
            # Billable ICD-10-CM leaf resolves per-sex at FHIR emit time
            # (C50.919 female / C50.929 male) via ``map_diagnosis_code``.
            # Issue #1130: F 60-99 raised 0.035 → 0.055 for SEER-target survivor prev.
    by_sex:
      F:
        "40-59": 0.020
        "60-99": 0.055
      M:
        "60-99": 0.0002
  C61:      # Prostate cancer — male only; SEER indolent survivor cohort large.
    # Issue #1130: 70-99 raised 0.060 → 0.100 (SEER prostate survivor ~11 % of men 70+).
    sex: M
    "60-69": 0.045
    "70-99": 0.100

  # --- Obstetrics (Issue #943, migrated by META #957 Incr 1) ---------------
  # META #957 Incr 1: Z34 / Z37 no-op-consumed here — see the JP mirror
  # (`locale/jp/demographics.yaml`) for the full rationale. The values
  # below are frozen at pre-Incr-1 numbers as RNG-cursor anchors and are
  # NO LONGER SEMANTICALLY MEANINGFUL as prevalences. Obstetric emit
  # tuning goes to `locale/shared/perinatal.yaml::lifecycle.annual_conception_rate.us`;
  # editing these bands changes the rng cursor for codes iterated after
  # them, which is why they are pinned.
  Z34:
    sex: F
    "20-34": 0.190   # frozen; obstetric emit tuning goes to perinatal.yaml
    "35-44": 0.085   # frozen
  Z37:
    sex: F
    "25-44": 0.130   # frozen
    "45-64": 0.170   # frozen

# Disease incidence rates per 100,000/year by age group
# Source: CDC, AHA, AAOS statistics
disease_incidence:
  bacterial_pneumonia:
    age_rates: {0: 500, 5: 100, 15: 30, 25: 40, 35: 60, 45: 100, 55: 180, 65: 450, 75: 1000, 85: 2000}
    sex_ratio_female: 0.70
    event_type: acute_disease_onset
  heart_failure_exacerbation:
    age_rates: {0: 5000, 45: 18000, 65: 22000, 75: 28000, 85: 35000}
    sex_ratio_female: 1.0
    event_type: chronic_exacerbation
    prerequisite_condition: I50  # requires prior HF diagnosis
    hospitalization_threshold_modifier: 0.8  # lower threshold → easier to hospitalize
  hip_fracture:
    age_rates: {0: 2, 45: 5, 55: 20, 65: 70, 75: 250, 85: 600}
    sex_ratio_female: 2.5
    event_type: trauma
    always_hospitalize: true
  urinary_tract_infection:
    age_rates: {0: 30, 15: 50, 25: 80, 35: 100, 45: 120, 55: 200, 65: 400, 75: 800, 85: 1500}
    sex_ratio_female: 3.0
    event_type: acute_disease_onset
    hospitalization_threshold_modifier_by_age:
      65: 0.5
      0: 0.7
  copd_exacerbation:
    # Exacerbation rate among COPD patients. Source: GOLD report, CDC
    age_rates: {0: 3000, 45: 12000, 55: 18000, 65: 22000, 75: 28000, 85: 32000}
    sex_ratio_female: 0.9
    event_type: chronic_exacerbation
    prerequisite_condition: J44  # requires prior COPD diagnosis
    hospitalization_threshold_modifier: 0.7
  sepsis:
    age_rates: {0: 5, 15: 8, 25: 10, 35: 15, 45: 30, 55: 80, 65: 200, 75: 500, 85: 1000}
    sex_ratio_female: 0.85
    event_type: acute_disease_onset
    always_hospitalize: true
  cerebral_infarction:
    # US: ~800/100k age 65+. Source: AHA Heart Disease & Stroke Statistics
    # Issue #1133 (2026-09-05): age_rates 45+ reduced ~35 % to bring emitted
    # cohort stroke rate into AHA general-population benchmark (200-300 /
    # 100k/yr) after comorbidity multiplier stacking (I48 × 5.0, I10 × 2.5,
    # E11.9 × 2.0 ≈ 25× on triple-comorbid patients). Pre-fix 5-year cohort
    # observed 452 /100k/yr overall (2× AHA). Base-rate trim keeps
    # ``rng.random()`` draw count identical (RNG-neutral, per-patient).
    age_rates: {0: 1, 25: 3, 35: 8, 45: 16, 55: 52, 65: 165, 75: 400, 85: 800}
    sex_ratio_female: 0.8
    event_type: acute_disease_onset
    always_hospitalize: true
  acute_mi:
    # US: ~400/100k age 65+. Source: AHA, NRMI registry
    # Issue #1133 (2026-09-05): age_rates 45+ reduced ~35 % to bring emitted
    # cohort MI rate into AHA benchmark (~200-300 /100k/yr) after comorbidity
    # multiplier stacking (HTN × 2.0, DM × 2.5, Dyslip × 2.0 ≈ 10× on triple-
    # comorbid patients). Pre-fix 5-year cohort observed 500 /100k/yr overall.
    # Base-rate trim is RNG-neutral (same draws per patient, lower threshold).
    age_rates: {0: 0, 25: 1, 35: 5, 45: 13, 55: 40, 65: 100, 75: 235, 85: 400}
    sex_ratio_female: 0.55  # MI much more common in men
    event_type: acute_disease_onset
    always_hospitalize: true
  gi_bleeding:
    # US: ~300/100k age 65+. Source: NHDS, ACG guidelines
    age_rates: {0: 2, 25: 5, 35: 10, 45: 25, 55: 60, 65: 150, 75: 350, 85: 600}
    sex_ratio_female: 0.7
    event_type: acute_disease_onset
    always_hospitalize: true
  diabetic_ketoacidosis:
