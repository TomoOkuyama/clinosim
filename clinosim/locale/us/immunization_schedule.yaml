      "50-64": {M: 0.28, F: 0.32}
      "65-99": {M: 0.24, F: 0.26}
  zoster_rzv:
    cvx: "187"
    min_age: 50
    frequency: once
    administration: {route: IM, dose_ml: 0.5}
    available_from: "2017-10-20"
    coverage_by_age_sex:
      "50-64": {M: 0.30, F: 0.35}
      "65-99": {M: 0.45, F: 0.50}

  # ==================================================================
  # US ACIP pediatric primary series — Issue #1279.
  #
  # `coverage_by_sex` (Issue #3288) is the MARGINAL coverage of each dose:
  # the share of children who receive that dose. The engine gives dose k
  # only after doses 1..k-1 and draws it with coverage_k / coverage_{k-1}
  # (`engine.conditional_dose_coverage`), so the share of children with k
  # doses is coverage_k and the share completing the series is the last
  # dose's value (before, the values were applied as conditional
  # probabilities: DTaP 0.95 x 0.93 x 0.92 x 0.86 x 0.85 = 0.59 completed
  # five doses). The values never rise along a series. Sources:
  # - NIS-Child: Hill HA et al., "Vaccination Coverage by Age 24 Months
  #   Among Children Born in 2021 and 2022", MMWR 2026;75:146-155,
  #   Table 1 (children born 2021-2022): DTaP >=3 92.7 %, >=4 80.7 %;
  #   poliovirus >=3 92.1 %; MMR >=1 90.8 %; Hib primary series 91.9 %,
  #   full series 77.6 %; HepB >=3 91.6 %; varicella >=1 90.0 %; PCV >=3
  #   91.4 %, >=4 80.5 %; HepA >=1 87.1 %, >=2 by 35 months 78.7 %;
  #   rotavirus (by 8 months) 74.2 %.
  # - Kindergarten (SchoolVaxView): "Coverage with
  #   Selected Vaccines and Exemption Rates Among Children in Kindergarten
  #   — United States, 2023-24 School Year", MMWR 2024;73(41), national
  #   estimates: DTaP 92.3 % (5 doses, or 4 if the fourth was given at
  #   >= 4 years), poliovirus 92.6 % (4 doses), MMR 92.7 % (2 doses),
  #   varicella 92.4 % (2 doses). (2025-26 SchoolVaxView: DTaP 92.0 %,
  #   MMR and polio 92.4 %.)
  # - NIS-Teen: "Vaccination Coverage Among Adolescents Aged 13-17 Years —
  #   National Immunization Survey-Teen, United States, 2024", MMWR
  #   2025;74(30), Table 1: Tdap >=1 91.3 %; MenACWY >=1 90.1 %, >=2
  #   (age 17) 61.1 %; HPV >=1 boys 77.4 % / girls 79.1 %, up to date boys
  #   61.6 % / girls 64.3 %.
  # The last dose a child gets by kindergarten (DTaP 5, IPV 4, MMR 2,
  # varicella 2) takes the kindergarten estimate; an earlier dose whose
  # 24-month estimate is lower takes the kindergarten value too, because
  # the engine has no late (after-window) dose: a child who misses a dose
  # in its window never completes the series (DTaP dose 4 by 24 months is
  # 80.7 %, most of the rest is given late). The first doses, which the
  # tables do not report (DTaP 1-2, IPV 1, Hib 1-2, PCV 1-2, rotavirus
  # 1-2; HepB 1, whose 79.3 % birth-dose estimate counts doses within 3
  # days of birth while dose 1 here is by 1 month), keep their configured
  # values (>= the reported doses).
  #
  # dose_number semantics + [age_days_min, age_days_max] windows follow
  # the same shape as the JP pediatric_series block. The engine
  # (`_generate_from_schedule`) is locale-agnostic; the fix is
  # entirely at the schedule-config layer.
  #
  # Not modelled here (deferred to a follow-up in the pediatric care
  # module, Issue #1137 architectural cluster):
  #   - HPV @ 11-12y  (CVX 165) — needs CVX register + config
  #   - MenACWY @ 11-12y + 16y booster (CVX 147) — needs CVX register
  #   - Hep A @ 12-23m + booster (CVX 85 adult / 83 ped) — needs CVX 83
  #   - Meningococcal B teen (CVX 162 / 163) — needs CVX register
  # ==================================================================

  # `min_interval_days` (Issue #3001): the minimum interval between a dose
  # and the previous dose of the series, from the CDC General Best Practice
  # Guidelines for Immunization, Table 3-1 (recommended and minimum ages
  # and intervals between vaccine doses). Aligning a dose to a nearby visit
  # never breaks it, nor puts two doses of a series on one visit.
  #
  # `catch_up_max_age_days` (Issue #3282): the oldest age (days) at which a
  # child behind on the series is caught up at a catch-up vaccination visit
  # (pediatric_schedule.yaml `catch_up: true`) with the series' next dose.
  # Source: CDC Child and Adolescent Catch-up Immunization Schedule (Table 2,
  # ages 4 months-18 years) and its Notes. DTaP: the 4 months-6 years table
  # (from 7 years Tdap/Td is used) -> 2555 days (< 7 y). IPV, MMR, varicella,
  # HepB, HepA: catch-up through age 18 years -> 6938 days (< 19 y). No limit
  # (no catch-up) where a late start changes the number of doses: Hib
  # ("Unvaccinated at age 15-59 months: Administer 1 dose"), PCV ("Healthy
  # children ages 2-4 years with any incomplete PCV series: 1 dose PCV"),
  # rotavirus ("maximum age for the final dose is 8 months, 0 days").
  pediatric_hepb:
    cvx: "08"
    min_age: 0
    frequency: pediatric_series
    administration: {route: IM, dose_ml: 0.5}
    available_from: "1991-11-01"
    catch_up_max_age_days: 6938
    doses:
      - dose_number: 1
        age_days_min: 0       # birth dose
        age_days_max: 30
        coverage_by_sex: {M: 0.92, F: 0.92}
      - dose_number: 2
        min_interval_days: 28    # 4 weeks
        age_days_min: 30      # 1 month
        age_days_max: 90
        coverage_by_sex: {M: 0.916, F: 0.916}
      - dose_number: 3
        min_interval_days: 56    # 8 weeks
        age_days_min: 180     # 6 months
        age_days_max: 545     # up to 18 months
        coverage_by_sex: {M: 0.916, F: 0.916}

