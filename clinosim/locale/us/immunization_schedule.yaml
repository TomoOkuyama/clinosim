# US adult immunization schedule.
# Sources: CDC ACIP adult immunization schedule; coverage = CDC FluVaxView / MMWR
# approximate population estimates (modeling parameters, not codes). Verified 2026-06.
#
# Semantics of `coverage_by_age_sex`:
#   annual (flu)        → per-season vaccination rate (matches CDC FluVaxView
#                         per-season rates, e.g. 65+ ~68-70%).
#   once (COVID/PPSV23/RZV) → lifetime "have you ever received it" rate.
#   every_n_years (Tdap 10y) → per-scheduled-dose rate.
#
# Consequence for EHR-cumulative rates: with history_years=10 for flu, an
# elderly patient's P(≥1 flu record) approaches 1.0 even at moderate
# per-season rates. Combined with the once-in-lifetime draws, P(≥1
# immunization record) for 65+ approaches 100%. This matches real EHR
# behavior for hospital-attending elderly patients. Do NOT calibrate
# coverage to match cumulative "≥1 record" targets — per-season vs
# cumulative are different measurements.
# See modules/immunization/README.md "Cumulative record vs per-season" note.
vaccines:
  influenza:
    cvx: "150"
    min_age: 18
    frequency: annual
    season_month: 10   # legacy fallback; seasonal_distribution below takes precedence
    available_from: "2000-01-01"
    history_years: 10   # EHR retains only ~recent flu history (avoids 20+ accumulated shots)
    # Issue #921: US flu season peaks in Oct-Nov (CDC FluVaxView).
    # Month strings 9/10/11/12 fall in season-start year, 1/2 roll to next year.
    seasonal_distribution:
      "9":  0.10   # September — early campaign start
      "10": 0.35   # October — peak
      "11": 0.30   # November — peak continues
      "12": 0.15   # December — year-end catchup
      "1":  0.07   # January — late
      "2":  0.03   # February — very late
    coverage_by_age_sex:
      "18-49": {M: 0.32, F: 0.38}
      "50-64": {M: 0.45, F: 0.50}
      "65-99": {M: 0.68, F: 0.70}
  covid19:
    # 309 is the current active CVX representing a COVID-19 mRNA vaccination; availability anchors the program start.
    cvx: "309"
    min_age: 18
    frequency: once
    available_from: "2020-12-14"
    # Issue #921: US COVID-19 wave epochs (CDC / VAERS).
    # See JP schedule for detailed algorithm notes.
    #   2020-12  Pfizer/Moderna EUA
    #   2021-01  Priority: HCW, LTC residents
    #   2021-04  All 16+ eligible
    #   2021-09  Boosters authorized (elderly first)
    #   2022-09  Bivalent booster (Omicron BA.4/5)
    #   2023-09  Annual fall vaccine
    wave_epochs:
      - name: initial_rollout      # HCW + elderly priority
        start: "2020-12-14"
        end: "2021-03-31"
        age_weight:
          "18-49": 0.05
          "50-64": 0.10
          "65-99": 0.35
        monthly_curve: {"12": 0.10, "1": 0.25, "2": 0.35, "3": 0.30}
      - name: broad_primary_series   # All 16+ eligible
        start: "2021-04-01"
        end: "2021-09-30"
        age_weight:
          "18-49": 0.40
          "50-64": 0.35
          "65-99": 0.35
        monthly_curve: {"4": 0.25, "5": 0.30, "6": 0.20, "7": 0.10, "8": 0.10, "9": 0.05}
      - name: booster_wave_1         # 3rd dose + bivalent (Omicron)
        start: "2021-10-01"
        end: "2023-01-31"
        age_weight:
          "18-49": 0.20
          "50-64": 0.30
          "65-99": 0.20
        monthly_curve: {"10": 0.12, "11": 0.14, "12": 0.10, "1": 0.10, "9": 0.20, "2": 0.05, "3": 0.05, "8": 0.05}
      - name: annual_maintenance     # Annual fall vaccine, 2023+
        start: "2023-09-01"
        end: "2028-12-31"
        age_weight:
          "18-49": 0.10
          "50-64": 0.15
          "65-99": 0.10
        monthly_curve: {"9": 0.20, "10": 0.35, "11": 0.25, "12": 0.15, "1": 0.05}
    coverage_by_age_sex:
      "18-49": {M: 0.62, F: 0.66}
      "50-64": {M: 0.78, F: 0.80}
      "65-99": {M: 0.90, F: 0.91}
  pneumococcal_ppsv23:
    cvx: "33"
    min_age: 65
    frequency: once
    available_from: "2000-01-01"
    coverage_by_age_sex:
      "65-99": {M: 0.65, F: 0.68}
  tdap:
    cvx: "115"
    min_age: 18
    frequency: every_n_years
    interval_years: 10
    available_from: "2005-06-01"
    coverage_by_age_sex:
      "18-49": {M: 0.30, F: 0.34}
      "50-64": {M: 0.28, F: 0.32}
      "65-99": {M: 0.24, F: 0.26}
  zoster_rzv:
    cvx: "187"
    min_age: 50
    frequency: once
    available_from: "2017-10-20"
    coverage_by_age_sex:
      "50-64": {M: 0.30, F: 0.35}
      "65-99": {M: 0.45, F: 0.50}

  # ==================================================================
  # US ACIP pediatric primary series — Issue #1279.
  # Coverage figures target the National Immunization Survey NIS-Child
  # 2023 mid-band point estimates (see cdc.gov/vaccines/imz-managers/
  # coverage/childvaxview/data-reports/). Real US coverage is high but
  # not universal — the ~90 % floor here reflects NIS-Child completion
  # rates for the 19-35-month cohort.
  #
  # dose_number semantics + [age_days_min, age_days_max] windows follow
  # the same shape as the JP pediatric_series block. The engine
  # (`_generate_from_schedule`) is locale-agnostic; the fix is
  # entirely at the schedule-config layer.
  #
  # Not modelled here (deferred to a follow-up in the pediatric care
  # module, Issue #1137 architectural cluster):
  #   - HPV @ 11-12y  (CVX 165) — needs CVX register + config
  #   - MenACWY @ 11-12y + 16y booster (CVX 147) — needs CVX register
  #   - Hep A @ 12-23m + booster (CVX 85 adult / 83 ped) — needs CVX 83
  #   - Meningococcal B teen (CVX 162 / 163) — needs CVX register
  # ==================================================================

  pediatric_hepb:
    cvx: "08"
    min_age: 0
    frequency: pediatric_series
    program_type: mandatory
    available_from: "1991-11-01"
    doses:
      - dose_number: 1
        age_days_min: 0       # birth dose
        age_days_max: 30
        coverage_by_sex: {M: 0.92, F: 0.92}
      - dose_number: 2
        age_days_min: 30      # 1 month
        age_days_max: 90
        coverage_by_sex: {M: 0.90, F: 0.90}
      - dose_number: 3
        age_days_min: 180     # 6 months
        age_days_max: 545     # up to 18 months
        coverage_by_sex: {M: 0.90, F: 0.90}

  pediatric_dtap:
    cvx: "20"
    min_age: 0
    frequency: pediatric_series
    program_type: mandatory
    available_from: "1997-01-01"
    doses:
      - dose_number: 1
        age_days_min: 60      # 2 months
        age_days_max: 90
        coverage_by_sex: {M: 0.95, F: 0.95}
      - dose_number: 2
        age_days_min: 120     # 4 months
        age_days_max: 150
        coverage_by_sex: {M: 0.93, F: 0.93}
      - dose_number: 3
        age_days_min: 180     # 6 months
        age_days_max: 210
        coverage_by_sex: {M: 0.92, F: 0.92}
      - dose_number: 4
        age_days_min: 455     # 15 months
        age_days_max: 545     # 18 months
        coverage_by_sex: {M: 0.86, F: 0.86}
      - dose_number: 5
        age_days_min: 1460    # 4 years
        age_days_max: 2190    # 6 years
        coverage_by_sex: {M: 0.85, F: 0.85}

  pediatric_ipv:
    cvx: "10"
    min_age: 0
    frequency: pediatric_series
    program_type: mandatory
    available_from: "2000-01-01"    # US switched fully to IPV
    doses:
      - dose_number: 1
        age_days_min: 60      # 2 months
        age_days_max: 90
        coverage_by_sex: {M: 0.93, F: 0.93}
      - dose_number: 2
        age_days_min: 120     # 4 months
        age_days_max: 150
        coverage_by_sex: {M: 0.92, F: 0.92}
      - dose_number: 3
        age_days_min: 180     # 6 months
        age_days_max: 545     # 6-18 months window
        coverage_by_sex: {M: 0.91, F: 0.91}
      - dose_number: 4
        age_days_min: 1460    # 4 years
        age_days_max: 2190    # 6 years
        coverage_by_sex: {M: 0.86, F: 0.86}

  pediatric_hib:
    cvx: "17"
    min_age: 0
    frequency: pediatric_series
    program_type: mandatory
    available_from: "2000-01-01"
    doses:
      - dose_number: 1
        age_days_min: 60      # 2 months
        age_days_max: 90
        coverage_by_sex: {M: 0.93, F: 0.93}
      - dose_number: 2
        age_days_min: 120     # 4 months
        age_days_max: 150
        coverage_by_sex: {M: 0.92, F: 0.92}
      - dose_number: 3
        age_days_min: 180     # 6 months (some Hib products need only 2+booster)
        age_days_max: 210
        coverage_by_sex: {M: 0.90, F: 0.90}
      - dose_number: 4
        age_days_min: 365     # 12 months
        age_days_max: 455     # 15 months
        coverage_by_sex: {M: 0.88, F: 0.88}

  pediatric_pcv13:
    cvx: "133"
    min_age: 0
    frequency: pediatric_series
    program_type: mandatory
    available_from: "2010-04-01"    # PCV13 FDA approval, replacing PCV7
    doses:
      - dose_number: 1
        age_days_min: 60      # 2 months
        age_days_max: 90
        coverage_by_sex: {M: 0.93, F: 0.93}
      - dose_number: 2
        age_days_min: 120     # 4 months
        age_days_max: 150
        coverage_by_sex: {M: 0.92, F: 0.92}
      - dose_number: 3
        age_days_min: 180     # 6 months
        age_days_max: 210
        coverage_by_sex: {M: 0.90, F: 0.90}
      - dose_number: 4
        age_days_min: 365     # 12 months
        age_days_max: 455     # 15 months
        coverage_by_sex: {M: 0.87, F: 0.87}

  pediatric_rotavirus:
    cvx: "116"
    min_age: 0
    frequency: pediatric_series
    program_type: mandatory
    available_from: "2006-02-01"    # RotaTeq (5-valent, 3 doses)
    doses:
      - dose_number: 1
        age_days_min: 60      # 2 months (must start by 15 weeks / ≈105 d)
        age_days_max: 90
        coverage_by_sex: {M: 0.82, F: 0.82}
      - dose_number: 2
        age_days_min: 120     # 4 months
        age_days_max: 150
        coverage_by_sex: {M: 0.80, F: 0.80}
      - dose_number: 3
        age_days_min: 180     # 6 months (must complete by 32 weeks / 8 mo)
        age_days_max: 240
        coverage_by_sex: {M: 0.78, F: 0.78}

  pediatric_mmr:
    cvx: "03"
    min_age: 0
    frequency: pediatric_series
    program_type: mandatory
    available_from: "1971-01-01"    # MMR combined licensure
    doses:
      - dose_number: 1
        age_days_min: 365     # 12 months
        age_days_max: 455     # 15 months
        coverage_by_sex: {M: 0.91, F: 0.91}
      - dose_number: 2
        age_days_min: 1460    # 4 years
        age_days_max: 2190    # 6 years
        coverage_by_sex: {M: 0.90, F: 0.90}

  pediatric_varicella:
    cvx: "21"
    min_age: 0
    frequency: pediatric_series
    program_type: mandatory
    available_from: "1995-03-01"    # US Varicella vaccine licensure
    doses:
      - dose_number: 1
        age_days_min: 365     # 12 months
        age_days_max: 455     # 15 months
        coverage_by_sex: {M: 0.90, F: 0.90}
      - dose_number: 2
        age_days_min: 1460    # 4 years
        age_days_max: 2190    # 6 years
        coverage_by_sex: {M: 0.89, F: 0.89}

  # Pediatric annual influenza — every year from 6 months.
  # Modelled with the same `annual` frequency the adult path uses;
  # the engine gates emission on `min_age` (in years) so setting
  # min_age: 0 with a floor via history_years reasonably approximates
  # the "starts at 6 months" reality (small pre-6mo sliver of eligible
  # infants is a minor over-approximation, acceptable for realism).
  pediatric_influenza:
    cvx: "158"
    min_age: 0
    frequency: annual
    season_month: 10
    available_from: "2010-08-01"    # universal ≥ 6 mo recommendation
    history_years: 5
    seasonal_distribution:
      "9":  0.10
      "10": 0.35
      "11": 0.30
      "12": 0.15
      "1":  0.07
      "2":  0.03
    # Coverage figures: NIS-Child pediatric flu vaccination ~55-60 %.
    coverage_by_age_sex:
      "0-4":  {M: 0.60, F: 0.62}
      "5-12": {M: 0.55, F: 0.58}
      "13-17": {M: 0.50, F: 0.53}

  # Adolescent Tdap booster at age 11-12 (single dose distinct from
  # the every-10-year adult Tdap above; ACIP recommends one Tdap
  # dose at 11-12 then Td/Tdap every 10 years thereafter).
  pediatric_tdap_booster:
    cvx: "115"
    min_age: 0
    frequency: pediatric_series
    program_type: recommended
    available_from: "2005-06-10"
    doses:
      - dose_number: 1
        age_days_min: 4015    # 11 years
        age_days_max: 4745    # 13 years
        coverage_by_sex: {M: 0.87, F: 0.90}

  # ==================================================================
  # US ACIP adolescent / early-childhood catch-up series — Issue #1279
  # second follow-up. HPV / MenACWY / Hep A were explicitly deferred
  # from the first pass pending CVX registration; codes verified
  # 2026-09-12 via tx.fhir.org $lookup. NIS-Teen 2023 coverage
  # midpoints used for `coverage_by_sex`.
  # ==================================================================

  pediatric_hepa:
    cvx: "83"
    min_age: 0
    frequency: pediatric_series
    program_type: mandatory
    available_from: "2006-10-01"       # ACIP universal 12-23 mo recommendation
    doses:
      - dose_number: 1
        age_days_min: 365    # 12 months
        age_days_max: 545    # 18 months
        coverage_by_sex: {M: 0.86, F: 0.87}
      - dose_number: 2
        age_days_min: 730    # 24 months (≥6 mo after dose 1)
        age_days_max: 1095   # 36 months
        coverage_by_sex: {M: 0.82, F: 0.83}

  pediatric_hpv:
    cvx: "165"
    min_age: 0
    frequency: pediatric_series
    program_type: recommended
    # HPV9 licensure late-2014; universal ACIP recommendation now
    # 9-valent (Gardasil-9). 2-dose schedule when initiated before
    # age 15; 3-dose otherwise (this generator models the 2-dose path
    # which covers the majority — ~78 % initiate before 15).
    available_from: "2015-01-01"
    doses:
      - dose_number: 1
        age_days_min: 4015    # 11 years
        age_days_max: 4745    # 13 years
        coverage_by_sex: {M: 0.76, F: 0.79}
      - dose_number: 2
        age_days_min: 4195    # 6 mo after dose 1 (11.5 y)
        age_days_max: 5110    # 14 years
        coverage_by_sex: {M: 0.68, F: 0.72}

  pediatric_menacwy:
    cvx: "147"
    min_age: 0
    frequency: pediatric_series
    program_type: recommended
    available_from: "2005-01-14"       # Menactra licensure
    doses:
      - dose_number: 1
        age_days_min: 4015    # 11 years
        age_days_max: 4745    # 13 years
        coverage_by_sex: {M: 0.88, F: 0.90}
      - dose_number: 2
        age_days_min: 5840    # 16 years
        age_days_max: 6570    # 18 years
        coverage_by_sex: {M: 0.60, F: 0.62}
