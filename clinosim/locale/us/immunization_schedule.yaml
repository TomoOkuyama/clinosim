# US adult immunization schedule.
# Sources: CDC ACIP adult immunization schedule; coverage = CDC FluVaxView / MMWR
# approximate population estimates (modeling parameters, not codes). Verified 2026-06.
#
# Semantics of `coverage_by_age_sex`:
#   annual (flu)        → per-season vaccination rate (matches CDC FluVaxView
#                         per-season rates, e.g. 65+ ~68-70%).
#   once (COVID/PPSV23/RZV) → lifetime "have you ever received it" rate.
#   every_n_years (Tdap 10y) → per-scheduled-dose rate.
#
# Consequence for EHR-cumulative rates: with history_years=10 for flu, an
# elderly patient's P(≥1 flu record) approaches 1.0 even at moderate
# per-season rates. Combined with the once-in-lifetime draws, P(≥1
# immunization record) for 65+ approaches 100%. This matches real EHR
# behavior for hospital-attending elderly patients. Do NOT calibrate
# coverage to match cumulative "≥1 record" targets — per-season vs
# cumulative are different measurements.
# See modules/immunization/README.md "Cumulative record vs per-season" note.
# Issue #3005: how each vaccine is given. `administration` on a vaccine:
#   route    key of codes/data/snomed-maps.yaml `route` (IM / SC / PO / PERCUTANEOUS)
#   dose_ml  volume per dose (omitted when the label states no fixed volume)
#   dose_ml_by_age  optional [{max_age_months, ml}] overriding dose_ml for a young child
# `administration_sites` gives the SNOMED body site per route and age (first
# band whose max_age_months covers the age at the dose; an oral dose has no
# site). Sources: CDC General Best Practice Guidelines for Immunization,
# "Vaccine Administration" (IM in the anterolateral thigh for infants and
# toddlers under 3 years, deltoid from 3 years; SC in the thigh under 12 months,
# upper-outer triceps from 12 months); route and volume per the package
# inserts (MMR / varicella SC, rotavirus oral, COVID-19 mRNA 0.3 mL).
administration_sites:
  IM:
    - {max_age_months: 35, site: "61396006"}   # left thigh (anterolateral thigh)
    - {site: "368208006"}                      # left upper arm (deltoid)
  SC:
    - {max_age_months: 11, site: "61396006"}   # left thigh
    - {site: "368208006"}                      # left upper arm (upper-outer triceps)

vaccines:
  influenza:
    cvx: "150"
    # Issue #2629: the product in use on the dose date (US influenza vaccines
    # were trivalent before the 2013-14 season, quadrivalent through 2023-24,
    # and trivalent again from 2024-25). `cvx` is the fallback.
    products:
      - {cvx: "140", until: "2013-06-30"}
      - {cvx: "150", from: "2013-07-01", until: "2024-06-30"}
      - {cvx: "140", from: "2024-07-01"}
    min_age: 18
    min_age_days: 182   # licensure floor checked on the dose date: 6 months (Issue #2979)
    frequency: annual
    administration: {route: IM, dose_ml: 0.5}
    season_month: 10   # legacy fallback; seasonal_distribution below takes precedence
    available_from: "2000-01-01"
    history_years: 10   # EHR retains only ~recent flu history (avoids 20+ accumulated shots)
    # Issue #921: US flu season peaks in Oct-Nov (CDC FluVaxView).
    # Month strings 9/10/11/12 fall in season-start year, 1/2 roll to next year.
    seasonal_distribution:
      "9":  0.10   # September — early campaign start
      "10": 0.35   # October — peak
      "11": 0.30   # November — peak continues
      "12": 0.15   # December — year-end catchup
      "1":  0.07   # January — late
      "2":  0.03   # February — very late
    coverage_by_age_sex:
      "18-49": {M: 0.32, F: 0.38}
      "50-64": {M: 0.45, F: 0.50}
      "65-99": {M: 0.68, F: 0.70}
  covid19:
    # 309 is the current active CVX representing a COVID-19 mRNA vaccination; availability anchors the program start.
    cvx: "309"
    # Issue #2629: the mRNA product in use on the dose date: original
    # monovalent (EUA 2020-12-11), bivalent (authorized 2022-08-31), 2023-2024
    # formula onward (approved 2023-09-11).
    products:
      - {cvx: "208", until: "2022-08-30"}
      - {cvx: "300", from: "2022-08-31", until: "2023-09-10"}
      - {cvx: "309", from: "2023-09-11"}
    min_age: 18
    frequency: once
    administration: {route: IM, dose_ml: 0.3}   # 30 mcg/0.3 mL products (CVX 208 / 300 / 309)
    available_from: "2020-12-14"
    # Issue #921: US COVID-19 wave epochs (CDC / VAERS).
    # See JP schedule for detailed algorithm notes.
    #   2020-12  Pfizer/Moderna EUA
    #   2021-01  Priority: HCW, LTC residents
    #   2021-04  All 16+ eligible
    #   2021-09  Boosters authorized (elderly first)
    #   2022-09  Bivalent booster (Omicron BA.4/5)
    #   2023-09  Annual fall vaccine
    wave_epochs:
      - name: initial_rollout      # HCW + elderly priority
        start: "2020-12-14"
        end: "2021-03-31"
        age_weight:
          "18-49": 0.05
          "50-64": 0.10
          "65-99": 0.35
        monthly_curve: {"12": 0.10, "1": 0.25, "2": 0.35, "3": 0.30}
      - name: broad_primary_series   # All 16+ eligible
        start: "2021-04-01"
        end: "2021-09-30"
        age_weight:
          "18-49": 0.40
          "50-64": 0.35
          "65-99": 0.35
        monthly_curve: {"4": 0.25, "5": 0.30, "6": 0.20, "7": 0.10, "8": 0.10, "9": 0.05}
      - name: booster_wave_1         # 3rd dose + bivalent (Omicron)
        start: "2021-10-01"
        end: "2023-01-31"
        age_weight:
          "18-49": 0.20
          "50-64": 0.30
          "65-99": 0.20
        monthly_curve: {"10": 0.12, "11": 0.14, "12": 0.10, "1": 0.10, "9": 0.20, "2": 0.05, "3": 0.05, "8": 0.05}
      - name: annual_maintenance     # Annual fall vaccine, 2023+
        start: "2023-09-01"
        end: "2028-12-31"
        age_weight:
          "18-49": 0.10
          "50-64": 0.15
          "65-99": 0.10
        monthly_curve: {"9": 0.20, "10": 0.35, "11": 0.25, "12": 0.15, "1": 0.05}
    coverage_by_age_sex:
      "18-49": {M: 0.62, F: 0.66}
      "50-64": {M: 0.78, F: 0.80}
      "65-99": {M: 0.90, F: 0.91}
  pneumococcal_ppsv23:
    cvx: "33"
    min_age: 65
    frequency: once
    administration: {route: IM, dose_ml: 0.5}
    available_from: "2000-01-01"
    coverage_by_age_sex:
      "65-99": {M: 0.65, F: 0.68}
