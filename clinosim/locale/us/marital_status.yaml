# Marital status by sex and age (US) and the adult emergency-contact
# relationship conditional on it (Issue #3189).
#
# Marital status is drawn once per person, at the first activation at or above
# `adult_age_min`, from the row of the person's sex and age band, and kept on
# the PersonRecord. Codes are HL7 v3-MaritalStatus: S never married, M married,
# W widowed, D divorced. Values are population counts (weights, normalised at
# load).
#
# Source: U.S. Census Bureau, American Community Survey 2023 1-year estimates,
# table B12002 "Sex by Marital Status by Age for the Population 15 Years and
# Over", United States (data.census.gov, ACSDT1Y2023.B12002). M is "Now
# married" (spouse present + separated + other spouse absent); the 15-17 band
# is not used.
metadata:
  kind: reference
  name: marital_status
  source: U.S. Census Bureau, ACS 2023 1-year, table B12002
  verified: "2026-11-10"

adult_age_min: 18
minor_code: S
