# Adult emergency-contact relationship, by the person's marital status and age
# band (weights, normalised at load). The weights for a married person are the
# relationship mix the activator used before these tables existed (no
# published distribution of named emergency contacts was found); the rows for
# the other statuses are the same weights with the relationships that cannot
# apply removed: no spouse for a never-married, divorced or widowed person,
# and a widowed person names a child or a sibling. Order within a row is
# load-bearing (it is the order of the weighted draw).
emergency_contact:
  relationships:
    M:
      "18-74": {spouse: 0.55, parent: 0.20, sibling: 0.15, child: 0.10}
      "75+": {child: 0.60, spouse: 0.25, sibling: 0.15}
    S:
      "18-74": {parent: 0.20, sibling: 0.15, child: 0.10}
      "75+": {child: 0.60, sibling: 0.15}
    D:
      "18-74": {parent: 0.20, sibling: 0.15, child: 0.10}
      "75+": {child: 0.60, sibling: 0.15}
    W:
      "18-74": {sibling: 0.15, child: 0.10}
      "75+": {child: 0.60, sibling: 0.15}
  # The table whose draw the per-activation stream still makes (and discards)
  # so every later draw of that stream keeps its position (Issue #3186/#3189).
  activation_stream_status: M
