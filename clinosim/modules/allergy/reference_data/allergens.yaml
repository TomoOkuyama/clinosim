# Allergen catalog (PR1 scope = medication + food + environment 3 category)
# Each entry: allergen_code (SNOMED CT) + display + prevalence (age-group reference)
#             + criticality + common_reactions
# Sampling: 15% patient overall_prob gate → category-weighted single allergy
# 6-layer validator is applied in engine.py (_validate_allergens)
#
# SCOPE (B-4 2026-08-28): the 15% overall_prob reflects the fraction of
# patients with a CLINICALLY DOCUMENTED AllergyIntolerance record in an
# EHR — medication (Penicillin/Aspirin/Sulfa/etc.), severe food (peanut,
# shellfish, egg), or environmental substance (latex). This is NOT the
# fraction of the population with ANY allergic disease.
#
# Real-world benchmarks:
#   * MHLW アレルギー疾患実態調査 2011: 30-40% 一般人口が「何らかの
#     アレルギー疾患」を持つ。この統計は花粉症 (J30) や食物不耐 (K90.4)
#     を含み、それらは FHIR 上 Condition として emit されるので
#     AllergyIntolerance の指標としては使えない (apples-to-oranges)。
#   * 薬物アレルギー documented rate: 5-10% (single item).
#   * Combined clinically documented AllergyIntolerance in real hospital
#     EHR: typically 10-20% depending on documentation practice.
#
# 15% is a defensible middle ground for "AllergyIntolerance documented".
# Comparing the emitted rate against the 30-40% ANY-allergy statistic is
# a scope mismatch — see scripts/audit_realworld_stats_jp.py notes and
# modules/allergy/README.md "Scope: AllergyIntolerance ≠ any allergic disease".
#
# SNOMED CT codes verified via SNOMED International browser
# (https://browser.ihtsdotools.org/) and tx.fhir.org $lookup, 2026-07-01.
# Allergen substance codes: SNOMED CT International edition.
# Reaction manifestation codes: SNOMED CT findings / disorders.

allergens:
  medication:
    # Session 57 v3 fix: 387207008 is Ibuprofen in SNOMED CT International
    # 2026-06-01 — swap to 373270004 (Substance with penicillin structure).
    - allergen_code: "373270004"
      allergen_display_en: "Penicillin"
      allergen_display_ja: "ペニシリン"
      prevalence:
        adult: 0.08              # 8% population
      criticality: high
      common_reactions:
        # Session 57 v3 fix: 247472004 is Weal in SNOMED CT International
        # 2026-06-01 — swap to 271807003 (Eruption of skin) for "Rash".
        - manifestation_snomed: "271807003"
          manifestation_display_en: "Rash"
          manifestation_display_ja: "発疹"
          severity: mild
        - manifestation_snomed: "39579001"
          manifestation_display_en: "Anaphylaxis"
          manifestation_display_ja: "アナフィラキシー"
          severity: severe
    # Session 57 v3 fix: 372687004 is Amoxicillin in SNOMED CT International
    # 2026-06-01 — swap to 387458008 (Aspirin, substance).
    - allergen_code: "387458008"
      allergen_display_en: "Aspirin"
      allergen_display_ja: "アスピリン"
      prevalence:
        adult: 0.03
      criticality: low
      common_reactions:
        - manifestation_snomed: "271807003"
          manifestation_display_en: "Rash"
          manifestation_display_ja: "発疹"
          severity: mild
    # Session 57 v3 fix: 303408005 is not present in SNOMED CT International
    # 2026-06-01 — swap to 115556009 (Sulfonamide, substance).
    - allergen_code: "115556009"
      allergen_display_en: "Sulfa drugs"
      allergen_display_ja: "サルファ剤"
      prevalence:
        adult: 0.03
      criticality: high
      common_reactions:
        - manifestation_snomed: "271807003"
          manifestation_display_en: "Rash"
          manifestation_display_ja: "発疹"
          severity: moderate

  food:
    # feedback FB-F8 (session 48 cycle 8): SNOMED CT 227037002 は inactive、
    # active substance code 735038006 "Egg protein (substance)" に更新。
    - allergen_code: "735038006"
      allergen_display_en: "Egg protein"
      allergen_display_ja: "卵タンパク"
      prevalence:
        adult: 0.02
      criticality: low
      common_reactions:
        - manifestation_snomed: "271807003"
          manifestation_display_en: "Rash"
          manifestation_display_ja: "発疹"
          severity: mild
    # feedback FB-F8: SNOMED CT 256349002 は inactive、
    # active substance code 735029006 "Wheat (substance)" に更新。
    - allergen_code: "735029006"
      allergen_display_en: "Wheat"
      allergen_display_ja: "小麦"
      prevalence:
        adult: 0.01
      criticality: low
      common_reactions:
        - manifestation_snomed: "21522001"
          manifestation_display_en: "Abdominal pain"
          manifestation_display_ja: "腹痛"
          severity: mild

  environment:
    - allergen_code: "256262001"
      allergen_display_en: "Pollen"
      allergen_display_ja: "花粉"
      prevalence:
        adult: 0.20              # 20% — 高頻度
      criticality: low
      common_reactions:
        # Session 57 v3 fix: 21719001 is Pollinosis in SNOMED CT International
        # 2026-06-01 — swap to 61582004 (Allergic rhinitis, disorder).
        - manifestation_snomed: "61582004"
          manifestation_display_en: "Allergic rhinitis"
          manifestation_display_ja: "アレルギー性鼻炎"
          severity: mild
    - allergen_code: "260219005"
      allergen_display_en: "House dust mite"
      allergen_display_ja: "ハウスダスト・ダニ"
      prevalence:
        adult: 0.15
      criticality: low
      common_reactions:
        # Session 57 v3 fix: 21719001 is Pollinosis in SNOMED CT International
        # 2026-06-01 — swap to 61582004 (Allergic rhinitis, disorder).
        - manifestation_snomed: "61582004"
          manifestation_display_en: "Allergic rhinitis"
          manifestation_display_ja: "アレルギー性鼻炎"
          severity: mild

# ---------------------------------------------------------------------------
# Issue #942: NKA (No Known Allergies) positive-assertion representation.
#
# Every patient in a JP EHR has an allergy-status field (mandatory bedside
# safety). Patients without documented allergies MUST be emitted with a
# positive "No Known Allergies" AllergyIntolerance record, not left silent.
#
# SNOMED 716186003 "No known allergy" is the standard code per HL7 Argonaut /
# US Core / JP Core guidance. See feedback_empty_vs_wrong_assertion.md —
# absence-of-record and positive-NKA-assertion carry different clinical
# meanings and must not collapse into the same signal.
# ---------------------------------------------------------------------------
nka:
  allergen_code: "716186003"    # SNOMED CT: No known allergy
  code_text_ja: "アレルギー歴なし"
  code_text_en: "No known allergies"
  clinical_status: "resolved"    # per Issue #942 spec (NKA is not an active problem)
  verification_status: "confirmed"

# ---------------------------------------------------------------------------
# Issue #942: Polyallergy sampling (5-10% of adults, higher in elderly).
#
# `probability_given_any_allergy` is the CONDITIONAL probability that a
# patient with ≥1 real allergen carries an additional (2nd/3rd/4th) allergen.
# Absolute polyallergy rate in the total cohort = overall_allergy_gate (15%)
# × probability_given_any_allergy × age-share weighting. Target absolute
# polyallergy rate: 3-5% of all patients (per pharmacy-survey benchmarks
# cited in Issue #942).
#
# Elderly and chronically-ill patients accumulate more allergens over their
# lifetime; the age-conditional multipliers reflect that shape.
# ---------------------------------------------------------------------------
polyallergy:
  # Base conditional probability that a patient with ≥1 allergen has ≥1 more.
  # Bucketed by age at simulation time.
  probability_given_any_allergy:
    child: 0.10        # < 18
    adult: 0.25        # 18-64
    elderly: 0.55      # >= 65
  # Additive multiplier if the patient carries chronic illness that pushes
  # them into cancer / immunocompromised territory (many drug exposures →
  # more sensitizations). Applied on top of the age bucket, capped at 0.85.
  chronic_ill_bonus: 0.15
  chronic_ill_conditions:      # ICD-10 prefixes that count as chronic-ill
    - "C"                      # C00-C99 malignant neoplasms
    - "N18"                    # CKD (repeat drug exposure)
    - "D80"                    # immunodeficiency
    - "D81"
    - "D82"
    - "D83"
    - "D84"
  # Additional allergen count for polyallergic patients (2/3/4 records total).
  # Weights sampled discretely; first entry = 1 additional (2 total), etc.
  additional_count_weights:
    "1": 0.60   # 2 total records
    "2": 0.30   # 3 total records
    "3": 0.10   # 4 total records

# ---------------------------------------------------------------------------
# Issue #942: Cross-reactivity awareness.
#
# When the primary allergen is in `trigger_allergen_codes`, boost the
# probability of adding another allergen from `co_category` in the polyallergy
# sampling pass. Real-world example: penicillin → cephalosporin
# cross-reactivity ~10-20 %. Since clinosim's allergen catalog does not
# currently list cephalosporin, the boost is applied as a category weight
# shift (bias next sample toward the same drug class), which mirrors the
# clinical intuition that a penicillin-allergic patient is more likely to
# document additional medication allergies than food/environment ones.
# ---------------------------------------------------------------------------
cross_reactivity:
  - trigger_allergen_codes: ["373270004"]   # Penicillin
    boost_category: "medication"
    boost_weight_bonus: 0.20                # +20% conditional boost on medication category
