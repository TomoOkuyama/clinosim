# AD-55 Module: device — SNOMED CT codes + placement criteria.
# All three SNOMED codes verified via tx.fhir.org $expand text-search
# against SNOMED CT International edition at PR-A Task 1
# (see clinosim/codes/data/snomed-ct.yaml for the authoritative entries).
devices:
  cvc:
    snomed_code: "52124006"
    placement_criteria:
      - any: ["severity_moderate_plus"]
  indwelling_catheter:
    snomed_code: "23973005"
    placement_criteria:
      - any: ["severity_moderate_plus", "altered_consciousness"]
  mechanical_ventilator:
    snomed_code: "706172005"
    # Issue #2091: only intubated patients are ventilated (intubation follows
    # the consciousness / oxygenation state in the daily loop).
    placement_criteria:
      - any: ["intubated"]
