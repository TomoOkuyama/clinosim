# Per-disease chief-complaint variants (Issue #983).
#
# Each disease lists 3-5 JP-only variants selected deterministically at
# narrative-build time via a SHA256 sub-seed on (patient_id + encounter_id)
# — RNG-neutral (no master-RNG consumption; see feedback_rng_neutral_additive_field).
#
# Design principles (issue #983 acceptance):
#   * First variant in each pool is the historical disease_protocol.chief_complaint.ja
#     value (preserves the pre-fix top pattern; regression-safe on encounters that
#     match the pool head).
#   * Later variants introduce naturalistic diversity: atypical presentations,
#     duration prefixes (「3日前より…」), single-symptom leads (元気消失など),
#     and colloquial ordering — patterns actually seen in Japanese chart CCs.
#   * JP-only. EN CCs go through the existing disease_protocol chain (no US
#     equivalent needed — US narrative uses the encounter.chief_complaint EN
#     string set at simulator time).
#   * disease_id keys mirror clinosim/modules/disease/reference_data/*.yaml so a
#     future audit can `set(disease_id_files) == set(variant_keys)` — extension
#     coverage is by-design.

