# bedside_procedure_codes.yaml — dispatch registry for #991/#992
# ================================================================
# Maps every ProcedureRecord.procedure_code (K/D/G/J code or CPT) to the
# document type the narrative pass should emit for that procedure:
#
#   procedure_note_codes:  # #992 — invasive bedside procedures
#     - LOINC 28570-0 (procedure_note) is emitted per Procedure whose
#       ``procedure_code`` appears in this list.
#
#   operative_note_codes:  # #991 — surgical procedures
#     - LOINC 11504-8 (operative_note) is emitted per Procedure whose
#       ``procedure_code`` appears in this list. Listed here as the
#       partner set so a single audit sweep confirms every code the
#       simulator can emit for a Procedure resolves to exactly one
#       document type.
#
# AUTHORITATIVE SOURCE for code labels: clinosim/codes/data/k-codes.yaml
# (MHLW 診療報酬点数表 K/D/G/J codes). CPT codes for the US locale are
# resolved via clinosim/codes/data/cpt.yaml.
#
# Codes NOT listed in either bucket receive no per-procedure document
# (a small `K002 wound debridement` bedside cleanup is not a formal
# note-worthy procedure, e.g.).
#
# ADD-A-CODE checklist
# --------------------
# 1. Add the code to k-codes.yaml (or cpt.yaml) so ``code_lookup`` can
#    resolve its display.
# 2. Add it here under ``procedure_note_codes`` (bedside) or
#    ``operative_note_codes`` (surgical).
# 3. Ensure the disease YAML that emits a ProcedureRecord with that
#    code is actually reachable from the corresponding archetype —
#    otherwise the dispatch never fires.

metadata:
  kind: reference
  name: bedside_procedure_codes
  source: clinosim

procedure_note_codes:
  # === D: Diagnostic bedside procedures (検査) ===
  - D225    # 観血的動脈圧測定 / Arterial line
  - D302    # 気管支ファイバースコピー / Bronchoscopy
  - D403    # 腰椎穿刺 / Lumbar puncture
  # === G: General bedside procedures (処置) ===
  - "G005-2"  # 中心静脈カテーテル挿入 / Central venous catheter insertion
  # === J: Invasive bedside procedures (処置) ===
  - J008      # 胸腔穿刺 / Thoracentesis
  - J010      # 腹腔穿刺 / Paracentesis
  - J019      # 持続的胸腔ドレナージ / Chest tube insertion
  - J034      # イレウス用ロングチューブ挿入法 / Long tube for bowel obstruction
  - "J034-2"  # 経鼻栄養・薬剤投与用チューブ挿入術 / Nasogastric tube insertion
  - J038      # 人工腎臓 / Acute hemodialysis
  - J044      # 救命のための気管挿管 / Endotracheal intubation
  - J047      # カウンターショック / Electrical cardioversion
  - J063      # 留置カテーテル設置 / Urinary catheter insertion
  # === K: Codes that are technically K-series but clinically bedside
  #        interventional procedures rather than OR surgeries. These
  #        emit a procedure_note (not operative_note) because they
  #        happen at bedside / cath lab / EP suite without a formal
  #        surgical opening.
  - K546      # 経皮的冠動脈形成術 / PCI
  - K597      # ペースメーカー移植術 / Pacemaker implantation
  - K920      # 輸血 / Blood transfusion (bedside procedure)

operative_note_codes:
  # === K: Surgical (手術) — OR procedures with anesthesia + incision ===
  - K002      # 創傷デブリードマン / Wound debridement (OR)
  - K013      # 分層植皮術 / Split-thickness skin graft
  - K142      # 脊椎固定術 / Spinal fracture fixation
  - K0882     # 手指切断再接合術 / Finger replantation
  - K1643     # 頭蓋内血腫除去術（開頭・脳内） / Craniotomy for ICH
  - "K164-2"  # 慢性硬膜下血腫洗浄・除去術 / Burr hole (chronic SDH)
  - K0463     # 骨折観血的手術（大腿骨） / ORIF femur
  - K0464     # 骨折観血的手術（前腕骨） / ORIF forearm
  - K0812     # 人工骨頭挿入術（股関節） / Hemiarthroplasty
  - K636      # 試験開腹術 / Exploratory laparotomy
  - "K672-2"  # 腹腔鏡下胆嚢摘出術 / Laparoscopic cholecystectomy
  - K719      # 結腸切除術 / Colectomy
  - "K718-2"  # 腹腔鏡下虫垂切除術 / Laparoscopic appendectomy
  # CPT for US locale — mirror the K-code surgical set above.
  - "15100"   # Split-thickness autograft
  - "25607"   # ORIF distal radius
  - "27236"   # Open treatment femoral fracture
  - "47562"   # Laparoscopic cholecystectomy
  - "61312"   # Craniotomy for subdural hematoma
  - "61313"   # Craniotomy for intracerebral hematoma
  - "20816"   # Finger replantation
