# Chronic-disease outpatient SOAP template registry (v9, 2026-08-17).
#
# Purpose: chronic conditions in this simulator are represented as ICD-10
# codes on ``patient.chronic_conditions`` — they do NOT have per-disease
# YAML files under ``modules/disease/reference_data/`` (which are only for
# acute inpatient conditions). The v10 density audit found 132/375
# outpatient encounters were chronic follow-ups ("血圧管理・処方薬の
# 見直し", "脂質管理・スタチン療法のモニタリング" etc.) with no
# matching encounter YAML or disease YAML, falling through to the raw
# patient-state fallback engine.
#
# This registry closes the gap: template_generator's
# ``_get_soap_template()`` consults this file after encounter_protocol
# and disease_protocol lookups, keyed by the patient's primary chronic
# ICD prefix. Each entry provides the same OutpatientSoapTemplate
# shape (subjective_ja / objective_ja / assessment_ja / plan_ja) that
# the encounter-side YAMLs use, so the downstream template engine
# handles them uniformly.
#
# Design notes:
#   - Content is a SEED — Template engine still composes CIF-derived
#     content (vitals, labs, meds) as a wrapper. The seed provides
#     disease-specific phrasing that would otherwise require LLM.
#   - Placeholders , {chronic_labels}, {continue_meds},
#     {today_finding} are substituted by the template engine at render
#     time. Unknown placeholders are left in the text (defensive default).
#   - Issue #3021: a seed states no number the engine composes itself —
#     no BP target (the assessment states the patient's one target) and no
#     return interval (the plan's follow-up line states the scheduled one).
#   - Selection (Issue #3249): the entry of the visit's diagnosis code — the
#     chronic condition the follow-up is for. A visit made for another
#     reason (chemotherapy, post-discharge, screening, ...) uses
#     ``visit_reason_soap.yaml`` instead.
#   - Text records what was found or done, never an instruction to the
#     reader (Issue #3251): no 「…を確認。」「…を聴取。」「…を評価。」「…評価要」.
#   - Each text is one line (Issue #3248): a line break inside a value
#     would reach the note in the middle of a sentence.
#   - Additional chronic ICDs beyond the ones listed here fall through
#     to the engine fallback (still adequate post-v9 P1b).
#   - A seed asserts only what the record holds (Issue #3547). The record has
#     no home blood-pressure or self-monitored glucose log, no symptom history
#     and no examination findings for these visits, so a seed carries no
#     「記録を持参」「訴えなし」「所見なし」「コントロール良好」 text. A section with
#     nothing the record backs is omitted; the visit's vitals, labs and
#     medications supply the rest.

# ── I10: Essential hypertension ───────────────────────────────────
metadata:
  kind: reference
  name: chronic_soap_templates
  source: clinosim

I10:
  assessment:
    ja: "本態性高血圧のフォローアップ。"
  plan:
    ja: "降圧薬継続、家庭血圧測定を指導。減塩・適度な運動・体重管理を再指導。"

# ── E11: Type 2 diabetes mellitus ─────────────────────────────────
E11:
  assessment:
    ja: "2 型糖尿病のフォローアップ (HbA1c 目標 7.0% 未満)。合併症 (網膜症・腎症・神経障害) のスクリーニングを継続。"
  plan:
    ja: "経口血糖降下薬継続。食事・運動療法を再指導。眼科受診と腎機能検査は年 1 回。"

# ── E78: Dyslipidemia ─────────────────────────────────────────────
E78:
  assessment:
    ja: "脂質異常症のフォローアップ (LDL 目標は心血管リスク層別による)。"
  plan:
    ja: "スタチン継続。食事療法 (飽和脂肪酸・糖質制限) と運動療法を再指導。次回外来時に AST・ALT・CK・脂質パネルを採血。"

# ── N18: Chronic kidney disease ───────────────────────────────────
N18:
  assessment:
    ja: "慢性腎臓病のフォローアップ。腎機能の推移と合併症 (貧血・電解質異常・二次性副甲状腺機能亢進症) を継続観察。"
  plan:
    ja: "RAS 阻害薬継続、腎機能に応じて用量調整。蛋白制限 (0.6-0.8 g/kg/日)・塩分制限 (6 g/日未満) を再指導。次回外来時に Cr・eGFR・尿蛋白・電解質を採血。"

# ── I50 / I11.0: Chronic heart failure ────────────────────────────
I50:
  assessment:
    ja: "慢性心不全のフォローアップ。"
  plan:
    ja: "利尿薬・β遮断薬・RAS 阻害薬継続。塩分制限 (6 g/日未満)・水分制限・毎日の体重測定を再指導。"

# ── I25: Chronic ischemic heart disease ───────────────────────────
I25:
  assessment:
    ja: "慢性虚血性心疾患のフォローアップ。"
  plan:
    ja: "アスピリン・スタチン継続。過度な労作を避けるよう生活指導。次回外来時に脂質パネル・心電図を予定。"

# ── J44: COPD ─────────────────────────────────────────────────────
J44:
  # Stated only when no admission or emergency visit lies between the previous
  # visit and this one (Issue #3407): the encounter record backs it.
  no_interval_event:
    ja: "前回受診以降の増悪エピソードなし。"
  assessment:
    ja: "COPD のフォローアップ。"
  plan:
    ja: "現行治療を継続。増悪時 (喀痰の増加・膿性化、息切れの増悪) は早期受診するよう説明。インフルエンザ・肺炎球菌ワクチンを勧奨。スパイロメトリは年 1 回。"

# ── J45: Asthma ───────────────────────────────────────────────────
J45:
  assessment:
    ja: "気管支喘息のフォローアップ。"
  plan:
    ja: "長期管理薬を継続。アレルゲン回避の生活指導。"

# ── K21: GERD / functional GI disorders ───────────────────────────
K21:
  assessment:
    ja: "GERD のフォローアップ。"
  plan:
    ja: "PPI 継続、症状増悪時は用量調整。生活指導 (少量頻回の食事、就寝 2 時間前までに食事を終える、頭部挙上)。"
