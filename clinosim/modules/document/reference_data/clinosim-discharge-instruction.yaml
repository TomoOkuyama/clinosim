# Discharge instructions catalog.
#
# baseline       = disease-agnostic fallback instructions
# disease_specific = per-disease override / supplement instructions
#
# Each entry must have BOTH 'en' (English) and 'ja' (Japanese) fields.
# Required baseline keys: hydrate, rest, follow_up
#
# TemplateNarrativeGenerator merges baseline + disease_specific + the disease
# protocol's narrative.discharge_instructions, a later layer taking
# precedence for shared keys (renderers/_resolvers.py
# resolve_discharge_instructions).
#
# Issue #3254: an entry may carry an `applies_when` gate; an entry whose gate
# does not hold for the patient is skipped (it neither shows nor replaces the
# layer below). Keys (all optional, all must hold):
#   sex / smoking_status / alcohol_use: patient values the entry is for
#     (an unrecorded value keeps the entry)
#   age_min / age_max: inclusive age in years at the encounter (Issue #3264;
#     an unknown age keeps the entry)
#   conditions / exclude_conditions: codes/data/valuesets.yaml groups, matched
#     against chronic conditions and the encounter's diagnoses
#   vitamin_k_given: true (newborn set) - the newborn's medication record has a
#     vitamin K dose
#   discharge_drugs: catalog drug ids or classes (codes/data/drugs.yaml); at
#     least one must be on the discharge prescription. `{drugs}` in the text
#     names the prescribed drugs that matched.
#   aki_at_discharge: true — the stay's final creatinine still meets the KDIGO
#     AKI definition (simulator/aki_response.py; Issue #3281).
#   fever_at_discharge: true — a temperature at or above the discharge gate's
#     fever threshold was recorded in the last day of the stay, i.e. the stay
#     reached its extension cap still febrile (Issue #3637).
#   metabolic_at_discharge: true — the stay's final potassium or total CO2 is
#     still that of unrecovered kidney failure (simulator/aki_response.py
#     `metabolic_findings_unresolved`; Issue #3830).
#   setting: home | facility - where the patient goes (Issue #3554); a facility
#     discharge is one whose disposition is in `facility_dispositions`. An
#     unrecorded disposition counts as home.
#   drug_course: chronic - only discharge drugs on a continuing prescription
#     match (Issue #3554); a prescription of at most `fixed_course_max_days`
#     days is a fixed course ("do not stop" does not fit it).
# Write one patient-specific statement per entry (smoking, alcohol, sex-
# specific care, a named drug) so each can be gated on its own.
#
# Issue #986: expanded from 2 disease entries → 30 entries covering every
# disease in modules/disease/reference_data/. Each entry carries at least
# daily_care / warning_signs / follow_up so the discharge summary reads
# as a genuine per-diagnosis instruction sheet, not a generic template.

metadata:
  kind: reference
  name: clinosim-discharge-instruction
  source: clinosim

# Issue #3554: the HL7 discharge dispositions (types.encounter
# discharge_disposition) after which the patient is not at home.
facility_dispositions: [snf, other-hcf, hosp]

# A discharge prescription of at most this many days is a fixed course, not a
# drug taken indefinitely. Same bound as the simulator's acute course
# (simulator/_stay_thresholds.py ACUTE_COURSE_MAX_DAYS); a clinosim modelling
# choice, not a guideline figure.
fixed_course_max_days: 14

# Issue #3554: slots filled by one entry. The disease-specific layer and the
# disease protocol each carry an emergency and a diet sentence under different
# keys (warning_signs / emergency, diet / diet_lifestyle), which both showed.
# The resolver shows the first entry of `precedence` that applies. The disease
# entry comes before the protocol's, whose emergency text is often the generic
# "return if symptoms worsen". `home_only` entries address a patient at home
# (call 911, resume a normal diet) and are replaced by the facility-addressed
# entries for a facility discharge.
slots:
  emergency:
    precedence:
      - baseline.emergency_facility
      - disease_specific.warning_signs
      - protocol.emergency
      - baseline.emergency
    home_only:
      - disease_specific.warning_signs
      - protocol.emergency
      - baseline.emergency
  diet:
    precedence:
      - disease_specific.diet
      - protocol.diet_lifestyle
      - baseline.diet_facility
      - baseline.diet
    home_only:
      - baseline.diet

baseline:
  hydrate:
    en: "Drink plenty of fluids."
    ja: "十分な水分摂取を心がけてください。"
    # No "drink plenty" for a condition whose care limits or does not call for
    # extra fluid: heart failure (below), acute myocardial infarction and
    # decompensated cirrhosis (sodium and water retention).
    applies_when: {exclude_conditions: [heart_failure, acute_myocardial_infarction, liver_cirrhosis]}
  # Heart failure: no "drink plenty"; daily weights and the fluid / salt
  # limits the physician sets. 2022 AHA/ACC/HFSA Guideline for the
  # Management of Heart Failure (Circulation 2022;145:e895-e1032): §9.6,
  # written discharge instructions address diet and weight monitoring;
  # §7.1.2, avoid excessive sodium; §8.2, the benefit of fluid restriction
  # is uncertain, so the limit is the physician's.
  heart_failure_self_care:
    en: "Weigh yourself every morning and keep a record. Do not drink extra fluids; follow the fluid and salt limits your doctor gives you."
    ja: "毎朝体重を測定して記録してください。水分を多めに摂る必要はなく、水分・塩分は主治医の指示量を守ってください。"
    applies_when: {conditions: [heart_failure]}
  rest:
    en: "Get adequate rest and avoid overexertion."
    ja: "十分な休息をとり、無理な活動は控えてください。"
  follow_up:
    en: "Follow up with your primary care provider within 7-10 days."
    ja: "退院後 1-2 週間以内にかかりつけ医を受診してください。"
  # Issue #3281: discharged with the creatinine still meeting the AKI
  # definition. KDIGO Clinical Practice Guideline for Acute Kidney Injury
  # (2012) Recommendation 2.3.4: "Evaluate patients 3 months after AKI for
  # resolution, new onset, or worsening of pre-existing CKD." The guideline
  # gives no interval for an earlier recheck; the one-week creatinine recheck
  # at the follow-up visit and the restart of the held drugs after it are
  # clinosim modelling choices. The drugs held at discharge are those of
  # simulator/reference_data/aki_response.yaml.
  aki_recheck:
    en: "Your kidney function was reduced during this stay. Have your blood creatinine rechecked at your follow-up visit about 1 week after discharge, and have your kidney function evaluated again about 3 months after this illness. Any medicines that were stopped because of the kidney injury (such as anti-inflammatory pain relievers, blood pressure medicines of the ACE inhibitor or ARB type, water pills and metformin) should not be restarted until your doctor has reviewed the recheck result."
    ja: "今回の入院中に腎機能が低下しました。退院後 1 週間ほどを目安に外来で血清クレアチニンを再検査し、この病気から約 3 か月後にも腎機能を再評価してください。腎機能低下のため中止した薬(消炎鎮痛薬、ACE 阻害薬・ARB などの降圧薬、利尿薬、メトホルミンなど)がある場合は、再検査の結果を主治医が確認するまで再開しないでください。"
    applies_when: {aki_at_discharge: true}
  # Issue #3830: discharged (to a facility) with the potassium still at or above the
  # hyperkalemia treatment threshold or the total CO2 still very low. A clinosim
  # modelling choice: the recheck interval is not taken from a guideline.
  metabolic_followup:
    en: "Your blood potassium or bicarbonate level was still abnormal when you left the hospital. Have your blood potassium, bicarbonate and creatinine rechecked within a few days, avoid potassium supplements and salt substitutes, and tell your doctor or the facility physician promptly if you feel weak, have palpitations, or pass much less urine."
    ja: "退院時にも血清カリウム値または重炭酸(総 CO2)値の異常が残っていました。数日以内に血清カリウム・重炭酸・クレアチニンを再検査し、カリウム補充薬やカリウム含有の減塩代替品は避け、脱力感・動悸・尿量の著しい減少がある場合は速やかに主治医または施設の医師に連絡してください。"
    applies_when: {metabolic_at_discharge: true}
  fever_followup:
    en: "You still had a fever when you left the hospital. Check your temperature at least twice a day, and tell your doctor or the facility physician promptly if it stays at 38°C or above, or if your breathing, alertness or urine output worsens."
    ja: "退院時にもまだ発熱が続いていました。1 日 2 回以上体温を測り、38℃ 以上の発熱が続く場合や、息苦しさ・意識の変化・尿量の減少がある場合は、速やかに主治医または施設の医師に連絡してください。"
    applies_when: {fever_at_discharge: true}
  medications:
    en: "Take all prescribed medications as directed. Do not stop early without consulting your doctor."
    ja: "処方された薬はすべて指示通りに内服してください。医師に相談なく中止しないでください。"
  emergency:
    en: "Return to the emergency department if symptoms worsen significantly."
    ja: "症状が著しく悪化した場合は速やかに救急受診してください。"
  # Facility discharge: the instruction is for the facility staff.
  emergency_facility:
    en: "Facility staff: contact the physician or call emergency services if the patient's symptoms worsen significantly."
    ja: "施設スタッフへ: 症状が著しく悪化した場合は、速やかに医師へ連絡するか救急要請してください。"
    applies_when: {setting: facility}
  diet:
    en: "Resume a normal diet gradually as tolerated."
    ja: "食事は体調に合わせて徐々に通常食に戻してください。"
  diet_facility:
    en: "Facility staff: provide the diet ordered in the discharge orders."
    ja: "施設スタッフへ: 退院時指示の食事内容で提供してください。"
    applies_when: {setting: facility}

# Newborn set (Issue #3260): replaces `baseline` for a patient in the neonatal
# period (renderers/_resolvers.baseline_instruction_set), written to the parents.
# The adult baseline (drink plenty of fluids, take all medications by mouth)
# does not apply to a newborn. The statements are general newborn-care guidance
# without numeric thresholds; the AAP policy statement "Hospital Stay for
# Healthy Term Newborn Infants" (Pediatrics 2015) could not be read in this
# change (publisher returned 403), so none of its figures is quoted.
neonatal:
  feeding:
    en: "Feed your baby breast milk or formula whenever he or she shows hunger cues, and keep a record of feeds."
    ja: "赤ちゃんがほしがるサインを見せたら、母乳または育児用ミルクを与え、授乳の回数を記録してください。"
  voiding_stooling:
    en: "Count wet and dirty diapers each day; call your pediatrician if there are fewer than usual."
    ja: "毎日の排尿・排便 (おむつの濡れ・汚れ) の回数を数え、普段より少ないときは小児科に連絡してください。"
  jaundice:
    en: "Check your baby's skin and eyes for yellowing in good light; call your pediatrician if the yellow color spreads, or if your baby is very sleepy or feeds poorly."
    ja: "明るい場所で皮膚や白目の黄色みを確認し、黄色みが広がる、または眠りがちで哺乳が弱いときは小児科に連絡してください。"
  # Only when vitamin K is on the medication administration record. The record
  # shows one dose in hospital; no further dose or schedule is stated.
  vitamin_k:
    en: "Your baby was given vitamin K in the hospital to prevent bleeding; ask your pediatrician whether any further dose is planned."
    ja: "入院中にビタミン K2 シロップを投与しました。追加の投与の時期 (退院時・1 か月健診時など) は、小児科医の指示に従ってください。"
    applies_when: {vitamin_k_given: true}
  weight:
    en: "Your baby's weight is checked at the follow-up visit to confirm that feeding is adequate."
    ja: "授乳が足りているかを確認するため、受診時に赤ちゃんの体重を測定します。"
  safe_sleep:
    en: "Place your baby on his or her back to sleep on a firm, flat surface in a separate sleep space, with no soft bedding."
    ja: "寝かせるときはあおむけにし、硬く平らな寝具の上で、柔らかい布団やぬいぐるみを置かないでください。"
  cord_care:
    en: "Keep the umbilical cord stump clean and dry until it falls off."
    ja: "へその緒の部分は清潔にして乾かし、自然に取れるまで見守ってください。"
  warning_signs:
    en: "Call your pediatrician or return to the emergency department right away if your baby has a fever, breathes with difficulty, is hard to wake, or refuses to feed."
    ja: "発熱、呼吸が苦しそう、起こしても起きにくい、ミルクを飲まないといった様子があれば、すぐに小児科へ連絡するか救急外来を受診してください。"
  follow_up:
    en: "Take your baby to the pediatrician for the follow-up visit arranged at discharge."
    ja: "退院時に案内した時期に、小児科で赤ちゃんの診察 (1か月健診を含む) を受けてください。"

# Obstetric set (Issue #3663): replaces `baseline` for the mother of a
# delivery stay (renderers/_resolvers.baseline_instruction_set). The adult
# baseline sends her to a primary care physician within 7-10 days and tells her
# to drink plenty of fluids. Warning signs: CDC "Urgent Maternal Warning Signs
# and Symptoms" (https://www.cdc.gov/hearher/maternal-warning-signs/index.html,
# page dated 2024-05-15, read 2026-11-24), which lists them for pregnancy and
# the year after delivery; the fever threshold is the page's 100.4 F (38.0 C).
# The Japanese text is a translation of the same list. Wound and perineal care
# and the rest advice are general postpartum guidance with no numeric
# threshold. `{postpartum_days}`: the first scheduled postpartum visit
# (perinatal.yaml lifecycle.postpartum_visit_offsets_days). No statement of
# breastfeeding or contraception: the record holds neither.
obstetric:
  recovery:
    en: "Rest when you can and increase your activity gradually as you feel able."
    ja: "休める時には休み、体調に合わせて徐々に活動量を増やしてください。"
  perineal_care:
    en: "Keep the perineal area clean and dry."
    ja: "会陰部は清潔にして乾いた状態を保ってください。"
    applies_when: {delivery_mode: [vaginal]}
  incision_care:
    en: "Keep the abdominal incision clean and dry."
    ja: "腹部の手術創は清潔にして乾いた状態を保ってください。"
    applies_when: {delivery_mode: [cesarean]}
  medications:
    en: "Take all prescribed medications as directed. Do not stop early without consulting your doctor."
    ja: "処方された薬はすべて指示通りに内服してください。医師に相談なく中止しないでください。"
  warning_signs:
    en: "Call your doctor or go to the emergency department right away for heavy vaginal bleeding or discharge, a fever of 100.4°F (38.0°C) or higher, a headache that will not go away or changes in your vision, dizziness or fainting, trouble breathing, chest pain or a fast heartbeat, severe belly pain, severe swelling, redness or pain of a leg or arm, or thoughts about harming yourself or your baby."
    ja: "多量の出血やおりもの、38.0°C 以上の発熱、続く頭痛や視覚の変化、めまいや失神、息苦しさ、胸の痛みや動悸、強い腹痛、足や腕の強い腫れ・赤み・痛み、自分や赤ちゃんを傷つけたい気持ちがあるときは、すぐに医師へ連絡するか救急外来を受診してください。"
  follow_up:
    en: "Attend your postpartum visit about {postpartum_days} days after the birth."
    ja: "産後{postpartum_days}日ごろの産後健診を受けてください。"

# Per-disease overrides — supplement or replace baseline entries.

disease_specific:
  bacterial_pneumonia:
    follow_up:
      en: "Follow up in 7-10 days for chest X-ray reassessment; return sooner if febrile."
      ja: "退院後 1-2 週間以内に外来受診し、胸部 X-P 再検をお願いします。発熱再燃時はすぐ受診。"
    daily_care:
      en: "Do deep breathing and coughing exercises every hour while awake."
      ja: "覚醒時は 1 時間ごとに深呼吸・咳嗽訓練を実施してください。"
    activity:
      en: "Gradual return to normal activity; avoid strenuous exercise for 2 weeks."
      ja: "徐々に通常活動に戻してください。激しい運動は 2 週間控えてください。"
    medications:
      en: "Complete the full prescribed antibiotic course even if you feel better."
      ja: "症状が改善しても処方された抗菌薬を最後まで内服してください。"
    warning_signs:
      # Fills the `emergency` slot alone (Issue #3554), so it carries the
      # protocol's fever and dyspnea precautions too, with its one fever threshold.
      en: "Return to ER if fever >38.5C persists, shortness of breath worsens, SpO2 drops, chest pain develops, or purulent sputum increases."
      ja: "発熱（38.5℃超）の持続、呼吸困難の増悪、SpO2 低下、胸痛、膿性痰の増加があれば速やかに救急受診してください。"
    smoking:
      en: "Smoking significantly delays recovery. Strongly consider cessation."
      ja: "喫煙は回復を著しく遅らせます。禁煙を強くお勧めします。"
      applies_when: {smoking_status: [current]}

  aspiration_pneumonia:
    follow_up:
      en: "Follow up in 1 week; swallowing evaluation (VF/VE) may be recommended."
      ja: "1 週間以内に外来受診をお願いします。嚥下造影・嚥下内視鏡検査を勧める場合があります。"
    diet:
      en: "Follow the thickened liquid or pureed diet as instructed to reduce aspiration risk."
      ja: "誤嚥リスク軽減のため、指示されたとろみ食・ペースト食を守ってください。"
    daily_care:
      en: "Sit upright at 60-90 degrees during meals and for 30 minutes after; brush teeth after each meal."
      ja: "食事中・食後 30 分は 60-90 度で座位を保ち、毎食後の口腔ケア (歯磨き) を徹底してください。"
    warning_signs:
      en: "Return to ER for fever, cough during meals, choking episodes, or inability to swallow."
      ja: "発熱、食事中の咳嗽、むせ込み、嚥下困難時は救急受診してください。"

  heart_failure_exacerbation:
    heart_failure_self_care:
      en: "Weigh yourself every morning at the same time; contact us if weight rises >2 kg in 3 days."
      ja: "毎朝同じ条件 (起床後・排尿後・朝食前) で体重測定。3 日で 2 kg 以上増加時はすぐに連絡してください。"
    # No `diet` entry: salt and fluid advice is the disease protocol's
    # `diet_lifestyle`. The former entry gave a second, conflicting figure
    # ("sodium <6 g/day" is a salt amount, not sodium; JCS/JHFS 2025 §11
    # 2.4.3 sets no numeric salt target).
    medications:
      en: "Take diuretics and heart failure medications daily; do not skip doses. Monitor for dizziness."
      ja: "利尿薬・心不全治療薬は毎日欠かさず内服してください。めまい・ふらつきに注意。"
    warning_signs:
      en: "Return to ER for worsening dyspnea, orthopnea, leg edema, palpitations, or fatigue."
      ja: "呼吸困難増悪、起坐呼吸、下肢浮腫、動悸、易疲労時は循環器科へ連絡・受診してください。"
    follow_up:
      en: "Cardiology follow-up in 7-14 days with weight log and home BP record."
      ja: "退院後 7-14 日以内に循環器科外来受診。体重ノート・家庭血圧手帳を持参してください。"

  acute_mi:
    # Names the cardiac drugs actually prescribed at discharge; with none of
    # them, the baseline medication instruction applies.
    medications:
      en: "Take your heart medications ({drugs}) every day as prescribed. Do NOT stop them without consulting your cardiologist."
      ja: "心臓の薬 ({drugs}) は毎日指示通りに内服し、循環器科医に相談せずに中断しないでください。"
      applies_when: {discharge_drugs: [antiplatelet, anticoagulant, statin, beta_blocker, acei, arb, nitrate], drug_course: chronic}
    smoking:
      en: "Smoking cessation is mandatory."
      ja: "禁煙は必須です。"
      applies_when: {smoking_status: [current]}
    alcohol:
      en: "Limit alcohol."
      ja: "飲酒を控えてください。"
      applies_when: {alcohol_use: [social, heavy]}
    activity:
      en: "Gradual activity resumption per cardiac rehab plan; avoid heavy lifting >5 kg for 4-6 weeks."
      ja: "心臓リハビリ計画に沿って徐々に活動再開。4-6 週間は 5 kg 以上の重い荷物を持たないでください。"
    warning_signs:
      en: "Call ambulance immediately for chest pain lasting >15 min, dyspnea, syncope, or cold sweats."
      ja: "15 分以上続く胸痛、呼吸困難、失神、冷汗出現時は直ちに救急要請してください。"
    follow_up:
      en: "Cardiology follow-up in 1-2 weeks; lipid panel and echocardiogram at 4-6 weeks."
      ja: "1-2 週後に循環器科外来受診。4-6 週後に脂質パネル・心エコー再検を予定します。"

  atrial_fibrillation_rvr:
    medications:
      en: "Take anticoagulant (DOAC or warfarin) daily without missing doses. Rate control meds as prescribed."
      ja: "抗凝固薬 (DOAC またはワルファリン) を毎日欠かさず内服してください。心拍数コントロール薬も指示通り継続。"
    daily_care:
      en: "Check pulse daily; log rate and rhythm. Avoid excessive alcohol and caffeine."
      ja: "毎日脈拍を確認して記録してください。過度の飲酒・カフェインは避けてください。"
    warning_signs:
      en: "Return to ER for palpitations >120 bpm, chest pain, sudden weakness/speech difficulty (stroke), or unusual bleeding."
      ja: "動悸 (脈拍 120/分以上)、胸痛、突然の脱力・呂律不良 (脳梗塞徴候)、異常出血時は救急受診してください。"
    follow_up:
      en: "Cardiology follow-up in 2 weeks with ECG; INR check if on warfarin."
      ja: "2 週後に循環器科外来受診・心電図施行。ワルファリン内服中は INR 採血を行います。"

  copd_exacerbation:
    daily_care:
      en: "Practice pursed-lip breathing during exertion. Use your inhaler with the correct technique."
      ja: "労作時は口すぼめ呼吸を実施してください。吸入器は正しい手技で使用してください。"
    medications:
      en: "Continue LABA/LAMA (with or without ICS) inhaler as prescribed. Complete steroid taper as instructed."
      ja: "LABA/LAMA (± ICS) 吸入を指示通り継続。ステロイド漸減は指示通り最後まで実施してください。"
    warning_signs:
      en: "Return to ER for increased dyspnea, sputum volume/purulence increase, fever, or SpO2 <90%."
      ja: "呼吸困難増悪、痰量・膿性度増加、発熱、SpO2 90% 未満時は救急受診してください。"
    smoking:
      en: "Smoking cessation is the single most important intervention. Nicotine replacement is available."
      ja: "禁煙が最も重要な治療です。ニコチン置換療法の相談も受け付けています。"
      applies_when: {smoking_status: [current]}
    follow_up:
      en: "Pulmonology follow-up in 2-4 weeks; annual influenza and pneumococcal vaccination recommended."
      ja: "2-4 週後に呼吸器科外来受診。毎年インフルエンザ・肺炎球菌ワクチン接種を推奨します。"

  # Issue #3264: asthma self-monitoring follows age. GINA 2024: the written
  # action plan is based on symptoms or, only in adults, peak expiratory flow
  # (chapter 11, children 5 years and younger), and long-term PEF monitoring is
  # generally recommended only for severe asthma or poor perception of airflow
  # limitation (chapter 3). Peak flow is therefore taught from age 12; younger
  # children follow symptoms. Control is reviewed with the ACT from 12, the
  # Childhood ACT for 4-11 and a caregiver symptom review below 4. The
  # controller named is the one on the discharge prescription ({drugs}).
  asthma_exacerbation:
    daily_care:
      en: "Use peak flow meter daily; record morning and evening readings. Avoid known triggers."
      ja: "毎日朝夕にピークフローメーターで測定し記録してください。既知のトリガー曝露は避けてください。"
      applies_when: {age_min: 12}
    daily_care_child:
      en: "Avoid known triggers (smoke, dust, pets, colds). Keep a diary of cough, wheeze and night waking and bring it to the follow-up visit."
      ja: "既知の誘因 (たばこの煙・ほこり・ペット・風邪) を避けてください。咳・喘鳴・夜間覚醒の様子を記録し、次回受診時に持参してください。"
      applies_when: {age_max: 11}
    controller:
      en: "Continue {drugs} every day as the controller, even when symptoms improve."
      ja: "長期管理薬 ({drugs}) は症状が改善しても毎日続けてください。"
      applies_when: {discharge_drugs: [budesonide, fluticasone_propionate, fluticasone_salmeterol]}
    reliever:
      en: "Use the short-acting reliever (SABA) when symptoms occur, up to every 4 hours."
      ja: "症状が出たときは短時間作用型β2刺激薬 (SABA) を 4 時間おきまで使用できます。"
    warning_signs:
      en: "Return to ER for peak flow <50% personal best, SABA needed >q4h, difficulty speaking, or blue lips."
      ja: "ピークフロー個人ベスト値の 50% 未満、SABA を 4 時間より頻回使用、会話困難、チアノーゼ時は救急受診。"
      applies_when: {age_min: 12}
    warning_signs_child:
      en: "Return to ER if the reliever is needed more often than every 4 hours, breathing is fast or labored with the chest pulling in, speech or feeding is difficult, or the lips turn blue."
      ja: "発作治療薬を 4 時間より頻回に使う、呼吸が速い・陥没呼吸がある、話す・飲むことが困難、唇が青くなる場合は救急受診してください。"
      applies_when: {age_max: 11}
    control_review:
      en: "Pulmonology follow-up in 2-4 weeks; ACT questionnaire review."
      ja: "2-4 週後に呼吸器科外来受診。ACT 質問票でコントロール状況を再評価します。"
      applies_when: {age_min: 12}
    control_review_child:
      en: "Pediatric follow-up in 2-4 weeks; review control with the Childhood ACT."
      ja: "2-4 週後に小児科外来受診。小児喘息コントロールテスト (C-ACT) でコントロール状況を再評価します。"
      applies_when: {age_min: 4, age_max: 11}
    control_review_toddler:
      en: "Pediatric follow-up in 2-4 weeks; control is reviewed with the caregiver (daytime symptoms, night waking, reliever use)."
      ja: "2-4 週後に小児科外来受診。保護者から症状・夜間覚醒・発作治療薬の使用頻度を聴取して再評価します。"
      applies_when: {age_max: 3}

  diabetic_ketoacidosis:
    daily_care:
      en: "Check blood glucose 4-6 times daily; check urine or blood ketones if BG >250 mg/dL."
      ja: "血糖を 1 日 4-6 回測定。血糖 250 mg/dL 超過時は尿ケトンまたは血中ケトンを測定してください。"
    medications:
      en: "Take insulin exactly as prescribed. Never skip doses even when sick; adjust per sick-day rules provided."
      ja: "インスリンは処方通りに投与。体調不良時も欠かさず、指示された sick day rule に従って調整してください。"
    warning_signs:
      en: "Return to ER for BG >300 mg/dL with ketones, persistent vomiting, deep breathing, or altered mental status."
      ja: "血糖 300 mg/dL 超過かつケトン陽性、頻回嘔吐、深く速い呼吸、意識レベル低下時は救急受診してください。"
    diet:
      en: "Follow diabetic diet plan; maintain hydration especially during illness (small sips frequently)."
      ja: "糖尿病食事療法を遵守してください。特に体調不良時は少量頻回の水分摂取を心がけてください。"
    follow_up:
      en: "Endocrinology follow-up within 1 week; HbA1c check at 4 weeks."
      ja: "1 週間以内に内分泌代謝科外来受診。4 週後に HbA1c 再検を行います。"

  sepsis:
    daily_care:
      en: "Monitor temperature twice daily; rest and eat as tolerated."
      ja: "1 日 2 回体温測定。体調に合わせた休息・食事を心がけてください。"
    antibiotics:
      en: "Complete the full course of {drugs}."
      ja: "{drugs}は最後まで内服してください。"
      applies_when: {discharge_drugs: [antibiotic]}
    warning_signs:
      en: "Return to ER for fever >38C, chills, confusion, rapid heart rate, decreased urine output, or new pain."
      ja: "発熱 38℃ 以上、悪寒、意識障害、頻脈、尿量減少、新たな疼痛出現時は救急受診してください。"
    follow_up:
      en: "Primary care follow-up in 1 week; specialty follow-up per source of infection."
      ja: "1 週間以内にかかりつけ医受診。感染源に応じて専門科外来もフォローしてください。"

  urinary_tract_infection:
    hydrate:
      en: "Drink 1.5-2 L of water daily."
      ja: "1 日 1.5-2 L を目安に水分を摂ってください。"
      applies_when: {exclude_conditions: [heart_failure]}
    daily_care:
      en: "Urinate frequently; do not hold urine."
      ja: "排尿を我慢せず、こまめに排尿してください。"
    hygiene:
      en: "Wipe from front to back after using the toilet."
      ja: "排便後は前から後ろへ拭いてください。"
      applies_when: {sex: [F]}
    medications:
      en: "Complete the full antibiotic course even if symptoms resolve."
      ja: "症状消失後も処方された抗菌薬は最後まで内服してください。"
    warning_signs:
      en: "Return to ER for fever >38C with flank pain (pyelonephritis suspicion), hematuria, or symptom recurrence."
      ja: "発熱 38℃ 以上・側腹部痛 (腎盂腎炎疑い)、血尿、症状再燃時は救急受診してください。"
    follow_up:
      en: "Follow-up urinalysis in 2 weeks. Recurrent UTI evaluation if >2 episodes in 6 months."
      ja: "2 週後に尿検査再検。半年間に 2 回以上の再発時は精査を検討してください。"

  cellulitis:
    daily_care:
      en: "Elevate affected limb when resting. Mark the erythema border daily to track progression."
      ja: "患肢を安静時は挙上してください。発赤の境界を毎日マーキングし進行を確認してください。"
    medications:
      en: "Complete the full antibiotic course. Take pain relievers as needed."
      ja: "抗菌薬は最後まで内服してください。疼痛時は指示された鎮痛薬を使用可。"
    warning_signs:
      en: "Return to ER if erythema expands past marked border, fever recurs, purulent drainage, or streaking appears."
      ja: "発赤境界を超える拡大、発熱再燃、膿性排液、線状の紅斑出現時は救急受診してください。"
    follow_up:
      en: "Follow-up in 5-7 days to confirm resolution. Foot care if diabetic."
      ja: "5-7 日後に外来受診し治癒確認。糖尿病患者はフットケアを継続してください。"

  cerebral_infarction:
    daily_care:
      en: "Continue rehabilitation exercises as instructed."
      ja: "指示されたリハビリを継続してください。"
    antithrombotic:
      en: "Take {drugs} every day; do not stop without your doctor's approval."
      ja: "{drugs}は毎日内服し、医師の指示なく中止しないでください。"
      applies_when: {discharge_drugs: [antiplatelet, anticoagulant]}
    medications:
      en: "Do not stop antiplatelet or anticoagulant without physician approval. Statin as prescribed."
      ja: "抗血小板薬・抗凝固薬は医師の指示なく中止しないでください。スタチンも指示通り継続。"
    warning_signs:
      en: "Call ambulance immediately for sudden weakness, speech difficulty, facial droop, or vision changes (FAST)."
      ja: "突然の脱力・呂律不良・顔面麻痺・視野障害出現時は直ちに救急要請 (FAST 徴候)。"
    follow_up:
      en: "Neurology follow-up in 2 weeks; carotid US and echocardiogram as scheduled."
      ja: "2 週後に神経内科外来受診。頚動脈エコー・心エコーはスケジュール通り施行してください。"

  hemorrhagic_stroke:
    daily_care:
      en: "Strict blood pressure control (BP <140/90 target). Continue rehabilitation."
      ja: "厳格な血圧管理 (目標 140/90 mmHg 未満) を継続してください。リハビリテーションも継続。"
    warning_signs:
      en: "Call ambulance immediately for severe headache, vomiting, weakness recurrence, or consciousness change."
      ja: "激しい頭痛、嘔吐、麻痺再燃、意識レベル変化時は直ちに救急要請してください。"
    follow_up:
      en: "Neurosurgery follow-up in 2 weeks; head CT/MRI as scheduled."
      ja: "2 週後に脳神経外科外来受診。頭部 CT/MRI はスケジュール通り施行します。"

  subdural_hematoma:
    daily_care:
      en: "Avoid activities with head injury risk (contact sports, ladders). Monitor for headache changes."
      ja: "頭部外傷リスクのある活動 (コンタクトスポーツ・脚立作業) は避けてください。頭痛の変化に注意。"
    warning_signs:
      en: "Return to ER immediately for worsening headache, vomiting, weakness, seizure, or consciousness change."
      ja: "頭痛増悪、嘔吐、脱力、痙攣、意識レベル低下時は直ちに救急受診してください。"
    follow_up:
      en: "Neurosurgery follow-up in 2-4 weeks with head CT to assess resolution."
      ja: "2-4 週後に脳神経外科外来受診・頭部 CT で吸収確認。"

  gi_bleeding:
    daily_care:
      en: "Avoid NSAIDs and alcohol."
      ja: "NSAIDs・アルコールは避けてください。"
    acid_suppression:
      en: "Take {drugs} every day."
      ja: "{drugs}を毎日内服してください。"
      applies_when: {discharge_drugs: [ppi, h2_blocker]}
    iron:
      en: "Take {drugs} for anemia as prescribed."
      ja: "貧血に対して{drugs}を指示通り内服してください。"
      applies_when: {discharge_drugs: [iron_supplement]}
    diet:
      en: "Soft diet for first week; avoid spicy/acidic foods and hot beverages."
      ja: "退院後 1 週間は消化のよい食事。刺激物・酸味の強い食品・熱い飲料は控えてください。"
    warning_signs:
      en: "Return to ER for hematemesis, melena (black tarry stools), hematochezia, dizziness, or syncope."
      ja: "吐血、黒色便 (タール便)、血便、めまい、失神時は救急受診してください。"
    follow_up:
      en: "GI follow-up in 2-4 weeks; repeat endoscopy per plan; CBC to confirm hemoglobin recovery."
      ja: "2-4 週後に消化器内科外来受診。計画に基づく内視鏡再検、血算で Hb 回復確認を行います。"

  acute_appendicitis:
    daily_care:
      en: "Keep surgical wound clean and dry. Gradual diet advancement as tolerated."
      ja: "手術創部を清潔・乾燥に保ってください。食事は消化のよい物から徐々にステップアップ。"
    activity:
      en: "No heavy lifting >5 kg for 2 weeks. Avoid strenuous exercise for 4 weeks."
      ja: "2 週間は 5 kg 以上の重い物を持たないでください。激しい運動は 4 週間控えてください。"
    warning_signs:
      en: "Return to ER for wound redness/discharge, fever, severe abdominal pain, or persistent vomiting."
      ja: "創部発赤・排液、発熱、強い腹痛、頻回嘔吐時は救急受診してください。"
    follow_up:
      en: "Surgery follow-up in 1-2 weeks for wound check and suture removal."
      ja: "1-2 週後に外科外来受診・創部確認および抜糸。"

  acute_cholecystitis:
    diet:
      en: "Low-fat diet for 4 weeks post-op; avoid fried and fatty foods."
      ja: "術後 4 週間は低脂肪食を継続。揚げ物・脂質の多い食品は避けてください。"
    warning_signs:
      en: "Return to ER for right upper quadrant pain recurrence, jaundice, fever, or clay-colored stool."
      ja: "右上腹部痛再燃、黄疸、発熱、白色便時は救急受診してください。"
    follow_up:
      en: "Surgery follow-up in 2 weeks; liver function tests."
      ja: "2 週後に外科外来受診。肝機能検査を実施します。"

  acute_pancreatitis:
    diet:
      en: "Strict alcohol abstinence. Low-fat diet, small frequent meals. Avoid overeating."
      ja: "完全禁酒を厳守してください。低脂肪食・少量頻回食で管理し、過食を避けてください。"
    warning_signs:
      en: "Return to ER for epigastric/back pain recurrence, persistent vomiting, or jaundice."
      ja: "心窩部痛・背部痛再燃、頻回嘔吐、黄疸出現時は救急受診してください。"
    follow_up:
      en: "GI follow-up in 2-4 weeks; amylase/lipase and abdominal US."
      ja: "2-4 週後に消化器内科外来受診。アミラーゼ・リパーゼ採血と腹部エコーを施行します。"

  acute_kidney_injury:
    daily_care:
      en: "Daily weight and urine output monitoring. Avoid NSAIDs and IV contrast."
      ja: "毎日体重・尿量を記録してください。NSAIDs・造影剤は避けてください。"
    medications:
      en: "Review all medications with pharmacist for renal dose adjustment. Continue prescribed regimen."
      ja: "全ての内服薬を薬剤師と再確認し腎機能に応じた用量調整を確認。処方通り継続してください。"
    warning_signs:
      en: "Return to ER for decreased urine output <400 mL/day, edema worsening, dyspnea, or confusion."
      ja: "尿量 400 mL/日 未満への減少、浮腫増悪、呼吸困難、意識障害時は救急受診してください。"
    follow_up:
      en: "Nephrology follow-up in 1-2 weeks; Cr, eGFR, electrolyte recheck."
      ja: "1-2 週後に腎臓内科外来受診。Cr・eGFR・電解質再検を行います。"

  liver_cirrhosis_decompensated:
    diet:
      en: "Sodium restriction <5 g/day; adequate protein 1.0-1.2 g/kg/day. Avoid alcohol strictly."
      ja: "塩分 5 g/日 未満・蛋白 1.0-1.2 g/kg/日 を目安に管理してください。完全禁酒を厳守。"
    medications:
      en: "Continue diuretics and lactulose. Beta-blocker for varices as prescribed."
      ja: "利尿薬・ラクツロースを継続。静脈瘤に対するβ遮断薬は指示通り内服してください。"
    warning_signs:
      en: "Return to ER for hematemesis, melena, confusion (encephalopathy), fever, or abdominal distension."
      ja: "吐血、黒色便、意識障害 (肝性脳症)、発熱、腹部膨満増悪時は救急受診してください。"
    follow_up:
      en: "GI/hepatology follow-up in 2 weeks. HCC screening (US + AFP) every 6 months."
      ja: "2 週後に消化器内科・肝臓内科外来受診。肝癌スクリーニング (エコー + AFP) を半年ごとに施行。"

  pulmonary_embolism:
    medications:
      en: "Anticoagulation (DOAC or warfarin) for minimum 3 months without missing doses."
      ja: "抗凝固薬 (DOAC またはワルファリン) を最低 3 か月間欠かさず内服してください。"
    daily_care:
      en: "Compression stockings if prescribed. Ambulate regularly; avoid prolonged immobility."
      ja: "弾性ストッキング処方時は着用。定期的に歩行し、長時間の同一姿勢は避けてください。"
    warning_signs:
      en: "Return to ER for sudden dyspnea, chest pain, hemoptysis, leg swelling, or bleeding."
      ja: "突然の呼吸困難、胸痛、喀血、下肢腫脹、出血傾向時は救急受診してください。"
    follow_up:
      en: "Pulmonology/hematology follow-up in 2 weeks; d-dimer and CTPA per plan."
      ja: "2 週後に呼吸器科・血液内科外来受診。計画に基づく D-dimer・造影 CT フォロー。"

  deep_vein_thrombosis:
    medications:
      en: "Anticoagulation for minimum 3 months. INR check weekly if on warfarin."
      ja: "抗凝固薬を最低 3 か月間内服。ワルファリン内服中は週 1 回 INR 採血。"
    daily_care:
      en: "Elevate affected leg when resting. Wear compression stocking if prescribed. Ambulate regularly."
      ja: "患肢を安静時は挙上。弾性ストッキング処方時は着用してください。定期的な歩行を継続。"
    warning_signs:
      en: "Return to ER for sudden dyspnea/chest pain (PE), leg pain worsening, or unusual bleeding."
      ja: "突然の呼吸困難・胸痛 (PE 徴候)、下肢痛増悪、異常出血時は救急受診してください。"
    follow_up:
      en: "Follow-up in 2 weeks with lower extremity duplex US."
      ja: "2 週後に外来受診・下肢静脈エコー再検を予定します。"

  ileus:
    diet:
      en: "Gradual diet advancement: clear liquids → full liquids → soft → regular over 3-5 days."
      ja: "3-5 日かけて食事を段階的にステップアップ (清澄流動 → 流動食 → 軟菜 → 常菜)。"
    daily_care:
      en: "Track bowel movements and flatus. Walking encourages GI motility."
      ja: "排便・排ガスを記録してください。歩行は消化管運動を促進します。"
    warning_signs:
      en: "Return to ER for abdominal distension recurrence, vomiting, absent flatus/stool >48h, or fever."
      ja: "腹部膨満再燃、嘔吐、排ガス・排便 48 時間以上停止、発熱時は救急受診してください。"
    follow_up:
      en: "Surgery or GI follow-up in 2 weeks; abdominal imaging if symptoms recur."
      ja: "2 週後に外科または消化器内科外来受診。症状再燃時は腹部画像検査を行います。"

  hip_fracture:
    activity:
      en: "Follow physiotherapy weight-bearing protocol strictly. Use walker or crutches as instructed."
      ja: "理学療法士の指示する荷重プロトコルを厳守してください。歩行器・松葉杖を指示通り使用。"
    daily_care:
      en: "Wound care as instructed. Do calf exercises every day to prevent blood clots."
      ja: "創部ケアは指示通り実施してください。血栓予防のため下腿運動を毎日継続してください。"
    anticoagulation:
      en: "Take {drugs} as prescribed to prevent blood clots."
      ja: "血栓予防のため{drugs}を指示通り使用してください。"
      applies_when: {discharge_drugs: [anticoagulant]}
    warning_signs:
      en: "Return to ER for wound infection signs, calf swelling/pain (DVT), sudden dyspnea (PE), or fall."
      ja: "創部感染徴候、下腿腫脹・疼痛 (DVT)、突然の呼吸困難 (PE)、転倒時は救急受診してください。"
    follow_up:
      en: "Orthopedic follow-up in 2 weeks; X-ray at 6 weeks. Osteoporosis workup recommended."
      ja: "2 週後に整形外科外来受診。6 週後に X 線再検。骨粗鬆症検査を推奨します。"

  vertebral_compression_fracture:
    activity:
      en: "Wear back brace as prescribed. Avoid heavy lifting, bending, and twisting for 6-12 weeks."
      ja: "処方されたコルセットを装着。6-12 週間は重い物を持つ・前屈・捻り動作を避けてください。"
    daily_care:
      en: "Take your osteoporosis medication ({drugs}) as prescribed."
      ja: "骨粗鬆症の薬 ({drugs}) を指示通り継続してください。"
      applies_when: {discharge_drugs: [osteoporosis, alendronate, vitamin_d, calcium_carbonate]}
    warning_signs:
      en: "Return to ER for new severe back pain, leg weakness/numbness, or bladder/bowel changes."
      ja: "新規強い背部痛、下肢筋力低下・しびれ、膀胱直腸障害出現時は救急受診してください。"
    follow_up:
      en: "Orthopedic follow-up in 4 weeks; bone density (DXA) if not recently performed."
      ja: "4 週後に整形外科外来受診。最近未施行なら骨密度 (DXA) を測定します。"

  wrist_fracture_surgical:
    activity:
      en: "Keep cast/splint dry. Elevate hand above heart level for first 48 hours."
      ja: "ギプス・シーネは濡らさないでください。術後 48 時間は心臓より高い位置に挙上。"
    daily_care:
      en: "Finger exercises daily to prevent stiffness. Shoulder ROM exercises."
      ja: "拘縮予防のため毎日手指運動を実施。肩関節可動域訓練も継続してください。"
    warning_signs:
      en: "Return to ER for finger numbness, blue coloration, severe pain, or cast damage."
      ja: "手指しびれ、チアノーゼ、強い疼痛、ギプス破損時は救急受診してください。"
    follow_up:
      en: "Orthopedic follow-up in 1-2 weeks with X-ray."
      ja: "1-2 週後に整形外科外来受診・X 線再検。"

  crush_injury_hand:
    daily_care:
      en: "Wound dressing changes as instructed. Occupational therapy for hand function recovery."
      ja: "指示通り創部処置を実施してください。手指機能回復のため作業療法を継続。"
    warning_signs:
      en: "Return to ER for finger numbness/color change, severe pain, fever, or wound discharge."
      ja: "手指しびれ・色調変化、強い疼痛、発熱、創部排液時は救急受診してください。"
    follow_up:
      en: "Hand surgery follow-up in 1 week; suture removal and OT plan."
      ja: "1 週後に手外科外来受診。抜糸・作業療法プラン決定。"

  industrial_burn_severe:
    daily_care:
      en: "Wound care per burn clinic protocol. High-protein high-calorie diet for wound healing."
      ja: "熱傷外来のプロトコルに従い創部処置を実施。創傷治癒促進のため高蛋白・高カロリー食を継続。"
    warning_signs:
      en: "Return to ER for wound infection (redness, purulent discharge, fever), pain worsening, or fluid loss signs."
      ja: "創部感染徴候 (発赤・膿性排液・発熱)、疼痛増悪、脱水徴候出現時は救急受診してください。"
    follow_up:
      en: "Burn clinic follow-up in 3-7 days; long-term scar and function evaluation."
      ja: "3-7 日後に熱傷外来受診。長期的に瘢痕・機能評価を継続します。"

  electrical_injury:
    daily_care:
      en: "Cardiac monitoring per instructions. Wound care for entry/exit sites."
      ja: "指示に従い心電図モニタリング。電流入口・出口部位の創部ケアを継続してください。"
    warning_signs:
      en: "Return to ER for palpitations, chest pain, muscle weakness, dark urine (rhabdomyolysis), or numbness."
      ja: "動悸、胸痛、筋力低下、褐色尿 (横紋筋融解)、しびれ出現時は救急受診してください。"
    follow_up:
      en: "Follow-up in 1 week with ECG and CK; neurology referral if symptoms persist."
      ja: "1 週後に外来受診・心電図と CK 採血。症状持続時は神経内科紹介を検討。"

  traffic_accident_severe:
    daily_care:
      en: "Wound and orthopedic care per instructions. Physical/occupational therapy for functional recovery."
      ja: "創部・整形外科処置は指示通り実施。機能回復のため理学療法・作業療法を継続してください。"
    warning_signs:
      en: "Return to ER for new pain, wound infection, neurological changes, or abdominal/chest symptoms."
      ja: "新規疼痛、創部感染、神経学的変化、腹部・胸部症状出現時は救急受診してください。"
    follow_up:
      en: "Multi-specialty follow-up per injury pattern; trauma clinic in 1-2 weeks."
      ja: "外傷パターンに応じて多科フォロー。1-2 週後に外傷外来受診を予定します。"

  fall_from_height:
    daily_care:
      en: "Wound and fracture care per instructions. Fall prevention: home safety review."
      ja: "創部・骨折処置は指示通り実施。転倒予防のため自宅環境の安全確認を実施してください。"
    warning_signs:
      en: "Return to ER for new pain, headache/vomiting (head injury), neurological changes, or wound infection."
      ja: "新規疼痛、頭痛・嘔吐 (頭部外傷疑い)、神経学的変化、創部感染時は救急受診してください。"
    follow_up:
      en: "Multi-specialty follow-up per injury pattern in 1-2 weeks; consider fall risk assessment for elderly."
      ja: "1-2 週後に外傷パターンに応じた多科フォロー。高齢者は転倒リスク評価を推奨します。"

  influenza:
    daily_care:
      en: "Rest at home for 5-7 days from symptom onset. Isolate from vulnerable family members."
      ja: "症状出現から 5-7 日は自宅安静。ハイリスクの同居家族との接触は控えてください。"
    diet:
      en: "Frequent small sips of water/electrolyte solution; light diet as tolerated."
      ja: "少量頻回の水分・電解質補給。体調に合わせた消化のよい食事。"
    warning_signs:
      en: "Return to ER for dyspnea, chest pain, persistent fever >4 days, or confusion."
      ja: "呼吸困難、胸痛、4 日を超える発熱持続、意識障害時は救急受診してください。"
    follow_up:
      en: "Follow-up only if symptoms persist beyond 7 days or worsen."
      ja: "7 日を超えて症状持続または悪化時のみ外来受診してください。"
