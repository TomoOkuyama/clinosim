# Admission physical examination of the admitting disease (Issues #3245,
# #3227).
#
# The admission H&P (and the ED note of a patient admitted through the ED)
# writes the examination of the problem that brought the patient in: the
# findings of the systems the disease affects, in English and Japanese, after
# the vital signs and a general-appearance clause. A system the disease does
# not touch is left unwritten (no "normal" assertion is invented for it).
#
# ``diseases.<disease_id>.systems.<body system>`` is one language map
# (``{en: ..., ja: ...}``, English required) or a per-severity map
# (``{mild: {en, ja}, moderate: {en, ja}, severe: {en, ja}}``). A clause that
# states a vital sign ("tachycardia", "hypotension", "tachypnea",
# "hypoxemia"; ed_note_admitted.yaml::exam_vital_terms) is left out when the
# reading the note quotes contradicts it, and the findings are separated by
# ", " (English) or "、" (Japanese) so the clauses can be told apart.
#
# The findings are the textbook examination findings of each condition. They
# are the clinosim author's description of a typical presentation, not
# measurements: nothing here is a CIF value or a threshold, and a CIF value
# that disagrees (the vitals) wins by the clause filter above.

metadata:
  kind: reference
  name: disease_exam
  source: clinosim

# The consciousness clause, from the AVPU level of the quoted reading. A note
# without a reading states no level.
consciousness:
  A: {en: "alert", ja: "意識清明"}
  V: {en: "drowsy, responds to voice", ja: "傾眠、呼びかけに反応する"}
  P: {en: "responds only to painful stimulus", ja: "痛み刺激にのみ反応する"}
  U: {en: "unresponsive", ja: "刺激に反応しない"}

# The general appearance of the admitted patient when the disease has no
# ``general`` entry of its own.
general:
  mild: {en: "mildly ill-appearing", ja: "軽度の苦痛様"}
  moderate: {en: "ill-appearing, in moderate distress", ja: "中等度の苦痛様"}
  severe: {en: "acutely ill-appearing, in marked distress", ja: "強い苦痛様、重篤感あり"}

# Atrial fibrillation (Issue #3227): a patient in AF has an irregularly
# irregular pulse. The rhythm clause of the cardiovascular finding ("regular
# rhythm", 「整」) is replaced by the AF rhythm, or the AF rhythm is written
# alone when the disease has no cardiovascular finding. Applies to the
# admission for AF itself and to a patient whose chronic atrial fibrillation
# (ICD-10 I48) is not in the paroxysmal stage (a paroxysmal AF patient may be
# in sinus rhythm between episodes, so the regular rhythm stays).
atrial_fibrillation:
  disease_ids: [atrial_fibrillation_rvr]
  condition_code_prefixes: ["I48"]
  irregular_stages: ["Persistent", "Long-standing persistent", "Permanent"]
  irregular: {en: "irregularly irregular rhythm", ja: "脈は不整（絶対性不整脈）"}
  regular_clauses:
    en: ["regular rhythm", "regular rate and rhythm", "regular"]
    ja: ["整"]

# Acute stroke (Issue #3227): the focal deficit that brought the patient in,
# never "no paralysis". The CIF records the stroke and its severity but not
# which hemisphere, so the side of the weakness is drawn per encounter from a
# hash of the encounter id (the same in every document of the stay) and the
# deficit follows from it: weakness of the right side comes from the dominant
# (left) hemisphere with aphasia and gaze deviation to the left, weakness of
# the left side from the right hemisphere with hemispatial neglect and gaze
# deviation to the right. ``nihss`` is the NIH Stroke Scale band of each
# severity, the bands of cerebral_infarction.yaml (moderate 5-15, severe > 15)
# with 1-4 for mild; the score of the admission exam is drawn inside the band
# from a hash of the encounter id. It is written on the admission day only.
stroke:
  disease_ids: [cerebral_infarction, hemorrhagic_stroke]
  nihss: {mild: [1, 4], moderate: [5, 15], severe: [16, 25]}
  # weakness of the right side (dominant-hemisphere lesion)
  right:
    mild:
      en: "mild right arm weakness with drift, mild right facial droop, mild dysarthria"
      ja: "右上肢の軽度麻痺（バレー徴候陽性）、右顔面の軽度麻痺、軽度の構音障害"
    moderate:
      en: "right hemiparesis (MMT 3/5, arm weaker than leg), right facial palsy, dysarthria, non-fluent aphasia, gaze deviated to the left"
      ja: "右片麻痺（MMT 3/5、上肢＞下肢）、右顔面麻痺、構音障害、運動性失語、左方への共同偏視"
    severe:
      en: "dense right hemiplegia (MMT 0-1/5), right facial palsy, global aphasia, forced gaze deviation to the left"
      ja: "右完全片麻痺（MMT 0-1/5）、右顔面麻痺、全失語、左方への共同偏視"
  # weakness of the left side (non-dominant-hemisphere lesion)
  left:
    mild:
      en: "mild left arm weakness with drift, mild left facial droop, mild dysarthria"
      ja: "左上肢の軽度麻痺（バレー徴候陽性）、左顔面の軽度麻痺、軽度の構音障害"
    moderate:
      en: "left hemiparesis (MMT 3/5, arm weaker than leg), left facial palsy, dysarthria, left hemispatial neglect, gaze deviated to the right"
      ja: "左片麻痺（MMT 3/5、上肢＞下肢）、左顔面麻痺、構音障害、左半側空間無視、右方への共同偏視"
    severe:
      en: "dense left hemiplegia (MMT 0-1/5), left facial palsy, dysarthria, left hemispatial neglect, forced gaze deviation to the right"
      ja: "左完全片麻痺（MMT 0-1/5）、左顔面麻痺、構音障害、左半側空間無視、右方への共同偏視"
  # how the deficit and the score are written together
  nihss_format: {en: "{deficit}; NIHSS {score}", ja: "{deficit}（NIHSS {score}点）"}

# Delivery admission (Issue #3245): a mother's delivery stay has no disease
# protocol, so its exam is the obstetric exam of the mode of delivery the
# admission diagnosis gives (ICD-10 O80 single spontaneous delivery, O82
# delivery by caesarean section) with the gestational age the pregnancy
# period's LMP gives at the admission. ``obstetric`` is the text with
# ``{weeks}`` / ``{days}``; ``obstetric_no_age`` the one for a record without
# an LMP. Contractions are written only for the spontaneous delivery.
delivery:
  admission_codes: {O80: vaginal, O82: cesarean}
  # ICD-10 prefixes of the birth outcome (Z37 outcome of delivery): recorded
  # with the delivery, not a working diagnosis of the admission (Issue #3671).
  outcome_prefixes: [Z37]
  modes:
    vaginal:
      general:
        en: "uncomfortable during contractions"
        ja: "陣痛時に苦痛様"
      obstetric:
        en: "gravid uterus, fundal height consistent with {weeks}w{days}d gestation, uterine contractions palpable"
        ja: "妊娠子宮を触知し、子宮底長は在胎 {weeks} 週 {days} 日相当、子宮収縮を触知する"
      obstetric_no_age:
        en: "gravid uterus, uterine contractions palpable"
        ja: "妊娠子宮を触知し、子宮収縮を触知する"
      # A note written after the birth (Issue #3403): the postpartum exam.
      general_postpartum:
        en: "comfortable, in no acute distress"
        ja: "著明な苦痛なし"
      obstetric_postpartum:
        en: "fundus firm at or below the umbilicus, lochia rubra moderate, perineum without hematoma"
        ja: "子宮底は臍高以下で硬く収縮良好、悪露は赤色で中等量、会陰に血腫なし"
    cesarean:
      general:
        en: "in no acute distress"
        ja: "著明な苦痛なし"
      obstetric:
        en: "gravid uterus, fundal height consistent with {weeks}w{days}d gestation"
        ja: "妊娠子宮を触知し、子宮底長は在胎 {weeks} 週 {days} 日相当"
      obstetric_no_age:
        en: "gravid uterus"
        ja: "妊娠子宮を触知する"
      general_postpartum:
        en: "in no acute distress"
        ja: "著明な苦痛なし"
      obstetric_postpartum:
        en: "fundus firm at or below the umbilicus, lochia scant to moderate, abdominal incision dressing clean, dry and intact"
        ja: "子宮底は臍高以下で硬く収縮良好、悪露は少量から中等量、腹部の創部ドレッシングは清潔乾燥で滲出なし"

