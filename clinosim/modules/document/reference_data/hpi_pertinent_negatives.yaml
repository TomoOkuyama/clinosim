# Per-disease pertinent-negative pool for HPI enrichment (Issue #984).
#
# The HPI section historically emitted only "急性発症 80歳女性患者。主訴: ...。
# 既往: ...。" (median 23 chars). Real EHR HPI narratives include ROS
# pertinent negatives ("発熱なし・下痢なし" for DKA, "胸痛なし・片麻痺なし"
# for PE) that document what was actively asked and ruled out — clinically
# essential for disposition reasoning.
#
# Each disease_id maps to a list of JP negative phrases. The template
# generator joins the first 2-3 as a "ROS: ..." tail on the HPI. Fallback
# (missing disease_id) omits the ROS tail rather than fabricating.
#
# Design notes:
#   - Content is disease-specific mnemonics for "what an admitting physician
#     would explicitly note as negative when working up this diagnosis"
#   - Kept short so total HPI length stays realistic (target 100-150 chars)
#   - JP-only. EN locale HPI density is deferred (US locale already emits
#     locale-neutral English phrases and does not read this file).
#   - Empty list = no per-disease negatives; template emits nothing.

