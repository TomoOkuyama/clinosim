# Per-disease pertinent-negative pool for HPI enrichment (Issue #984).
#
# Real EHR HPI narratives include ROS pertinent negatives ("発熱なし・下痢なし"
# for DKA, "胸痛なし・片麻痺なし" for PE) that document what was actively
# asked and ruled out — clinically essential for disposition reasoning.
#
# Each disease_id maps to an ordered list of negatives. An entry has:
#   text:     the negative phrase per language (``ja``, ``en``; English is
#             required and is the fallback language, Issue #3206)
#   symptoms: (optional) per language, the symptom terms the negative denies.
#             When one of them is present (not itself negated) in the chief
#             complaint or the onset text of the encounter, the negative would
#             deny the patient's own complaint and is skipped (Issue #3228).
#             Entries without ``symptoms`` (e.g. "外傷の既往確認",
#             "他部位外傷精査中") deny nothing the patient presents with and are
#             never filtered. Matching ignores letter case.
# The HPI writes the first 2 entries left after filtering as a "ROS: ..." tail
# in the document language (``narrative_text.hpi.ros`` / ``list_sep``).
# Missing disease_id → no ROS tail rather than a fabricated one.
#
# Design notes:
#   - Content is disease-specific mnemonics for "what an admitting physician
#     would explicitly note as negative when working up this diagnosis"
#   - Kept short so total HPI length stays realistic (target 100-150 chars)
#   - The HPI extras are written only for languages with authored narrative
#     content (``authored_narrative_languages``); the US locale emits its
#     own generic onset phrase and does not read this file today.
#   - Empty list = no per-disease negatives; template emits nothing.

