# How an inpatient note picks and interprets the day's abnormal lab results
# (Issue #3230). Read by
# narrative/_narrative_interpretation_thresholds.py::notable_lab_rules and
# applied by narrative/lab_timeseries.py::select_notable_labs.
#
# window_hours: a daily note with an authored time cites the results reported
#   in this many hours up to that time (since the previous day's note), so a
#   result reported after one note is cited by the next one; without an
#   authored time, the results of the note's hospital day. A complication
#   that began within the same window is worded as new
#   (renderers/_composers.py::_complications_known_on_day).
# draw_window_minutes: results of one analyte whose reported times lie within
#   this many minutes of the first of them are ONE draw (the record carries
#   separate rows for one blood draw, up to about an hour apart): a note and
#   the lab trend show one value per draw, and the "previous value" is the
#   last result of an earlier draw, never a sibling row of the same draw.
#   A model choice (the spread seen in generated records is up to ~61 min); no
#   clinical source was read for it.
# max_items: how many analytes each surface lists; the rest are counted
#   ("+k other abnormal results").
# relevance: the clinical class of an analyte, in the order a note names them
#   (Issue #3545): an acute-phase / perfusion marker (inflammation, infection,
#   hypoperfusion) first, then an organ-injury marker (kidney, heart, liver,
#   electrolyte), then any analyte not listed, then chronic markers (lipids,
#   glycaemia) last. A panic result always leads; within a class the tier
#   order below applies, then first report time. So a chronic marker never
#   takes the place of an acute or organ marker in the capped list. The
#   grouping is a clinosim convention (acute-phase versus chronic-disease
#   markers); no cut-off is involved and no source was needed for it.
# findings: the abnormality a flagged result of an analyte names, by the side
#   of the reference range it is on (high / low; the panic flag "critical" is
#   placed on its side by the panic thresholds of
#   observation/reference_data/lab_constants.yaml). By default only a panic
#   result names it (a value merely outside a country's reference interval,
#   e.g. JCCLS K > 4.8, is not yet "hyperkalemia"); `beyond` names it for a
#   flagged value strictly beyond that cut-off; `any_flag` for every flagged
#   value on that side. A hemolysed specimen (flag H*) names "hemolyzed"
#   instead. Display text: locale/shared/narrative_phrases.yaml
#   lab_finding.<slug>.
#   Na low beyond 135 mmol/L: hyponatraemia is "a serum sodium concentration
#     < 135 mmol/l" (Spasovski G et al. Clinical practice guideline on
#     diagnosis and treatment of hyponatraemia. Eur J Endocrinol
#     2014;170(3):G1-47).
#   K high beyond 5.5 mmol/L: hyperkalaemia is a serum potassium >= 5.5
#     mmol/l, mild 5.5-5.9, moderate 6.0-6.4, severe >= 6.5 (UK Kidney
#     Association, Clinical Practice Guidelines: Treatment of Acute
#     Hyperkalaemia in Adults, final version October 2023, Background; the
#     rule names a value above the 5.5 boundary, so K 5.5 itself stays
#     unnamed). The flag assignment (engine.determine_flag) marks K >= 6.5
#     critical, the guideline's "severe".
#   K low beyond 3.5 mmol/L and Na high beyond 145 mmol/L: "Hypokalemia is
#     serum potassium concentration < 3.5 mEq/L (< 3.5 mmol/L)";
#     "Hypernatremia is a serum sodium concentration > 145 mEq/L (> 145
#     mmol/L)" (MSD Manual Professional Version, Electrolyte Disorders:
#     Hypokalemia / Hypernatremia, consulted November 2026).
#   Glucose is not named: no cited threshold was read for it.
#   Troponin any_flag: the flag H is a value above the reference upper limit
#     (the 99th-percentile URL), which is what "troponin elevation" states.
# aki: KDIGO 2012 Clinical Practice Guideline for Acute Kidney Injury,
#   Recommendation 2.1.1 (Kidney Int Suppl 2012;2:19-36): AKI is an increase
#   in serum creatinine by >= 0.3 mg/dL within 48 hours, or to >= 1.5 times
#   baseline within the prior 7 days. Baseline = the lowest creatinine of the
#   prior 7 days; the absolute rise applies only to results in mg/dL.
metadata:
  kind: reference
  name: notable_labs
  source: clinosim

window_hours: 24

draw_window_minutes: 120

max_items:
  note: 6
  llm_context: 8

relevance:
  acute_phase: [Lactate, PCT, CRP, WBC, ESR, pH, D_dimer]
  organ_injury: [Troponin_I, Troponin, CK_MB, BNP, Creatinine, BUN, eGFR, K, Na, ALT, AST, T_Bil, Plt, Hb]
  chronic: [Glucose, HbA1c, LDL, HDL, TG, TC]

findings:
  K:
    high: {finding: hyperkalemia, beyond: 5.5}
    low: {finding: hypokalemia, beyond: 3.5}
  Na:
    high: {finding: hypernatremia, beyond: 145}
    low: {finding: hyponatremia, beyond: 135}
  Troponin_I:
    high: {finding: troponin_elevation, any_flag: true}
  Troponin:
    high: {finding: troponin_elevation, any_flag: true}

aki:
  analyte: Creatinine
  absolute_rise: 0.3
  absolute_rise_unit: mg/dL
  absolute_window_hours: 48
  relative_rise: 1.5
  relative_window_days: 7
