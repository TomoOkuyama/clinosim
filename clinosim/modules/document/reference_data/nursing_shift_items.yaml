# The nursing items of a shift note beyond its fixed lines (Issue #3478, child
# of #3476). Read by narrative/_nursing_shift_items.py::nursing_shift_items_config
# and applied by narrative/renderers/nursing_shift_note.py: each item is
# written only when the record of the shift shows it, in this order, after the
# status and medication lines and before the fall-risk item (the last of the list). The phrases of an
# item are the ``nursing_shift_items.<id>`` block of
# locale/shared/narrative_phrases.yaml (ja and en).
#
#   id:        the item (a function of the same name in _nursing_shift_items.py)
#   source:    the CIF field(s) the item reads (documentation; the function is
#              the reader)
#   rule:      when the item is written
#   fact:      the facts_used tag the item adds (allowed prefix ``ctx.``)
#   skip_neonate: the item is not written for a patient in the neonatal period
#              (no self-reported pain score for a newborn)
#   only_neonate: the item is written only for a patient in the neonatal period
#              (the newborn set replaces the adult assessments; default false)
#   only_postpartum: the item is written only for a delivery stay (default false)
#
# Thresholds are not repeated here: fever is the ``trend.fever_c`` of
# progress_vitals.yaml, the SpO2 floor is the ``limits.spo2`` of
# progress_exam.yaml (a COPD patient's own floor replacing it), the NEWS2
# urgent-response level is observation/reference_data scores ``news2``.
# Nothing is written for a reading the shift does not have; no response to an
# abnormal vital is stated beyond what the record shows (a dose on the MAR, the
# oxygen of a reading).

metadata:
  kind: reference
  name: nursing_shift_items
  source: clinosim

items:
  - id: icu
    source: encounter.admission_datetime; icu_transferred, icu_transferred_day, icu_discharge_day
    rule: the stay was transferred to the ICU, at the admission time plus the transfer day (the time of the Encounter classHistory ICU segment); the shift of the transfer says so, the shifts after it name the unit with the transfer day until the step-down; the shift of the step-down (admission time plus icu_discharge_day, when recorded) says the patient returned to the ward and the shifts after it name no unit (Issue #3555)
    fact: ctx.icu_transferred_day
    skip_neonate: false
  - id: pain
    source: vital_signs[].pain_score
    rule: a pain score (NRS 0-10) is recorded in the shift; the highest and the latest score, the pain named by the disease's pain site
    fact: ctx.vitals.shift.pain
    skip_neonate: true
  - id: fever
    source: vital_signs[].temperature_celsius; medication_administrations[]
    rule: the shift's highest temperature is at or above the fever threshold; the response is the antipyretic given in the shift (MAR) and the first temperature after it, else observation
    fact: ctx.vitals.shift.fever
    skip_neonate: false
  - id: desaturation
    source: vital_signs[].spo2, on_supplemental_oxygen, oxygen_delivery_device, oxygen_flow_rate_lpm
    rule: the shift's lowest SpO2 is below the patient's SpO2 floor; the response is the oxygen of that reading or the oxygen started after it, else observation
    fact: ctx.vitals.shift.desaturation
    skip_neonate: false
  - id: consciousness
    source: vital_signs[].consciousness_level
    rule: an AVPU level other than Alert is recorded in the shift; new, persisting (the reading before the shift was not Alert) or transient (the shift's last level is Alert)
    fact: ctx.vitals.shift.consciousness
    skip_neonate: false
  - id: news2
    source: vital_signs[].news2_score
    rule: the latest NEWS2 of the shift is at or above the urgent-response level (an earlier unstable episode is the status line's)
    fact: ctx.vitals.shift.news2
    skip_neonate: false
  - id: doses_not_given
    source: medication_administrations[].status, hold_reason, refusal_reason, route
    rule: a MAR row scheduled in the shift (and before the authored time) has status held, refused or not_available; one sentence per drug and status, with the recorded reason where present
    fact: ctx.medications.shift.not_given
    skip_neonate: false
  - id: intake_output
    source: intake_output_records[] (one record per calendar day)
    rule: the record of the calendar day before the shift's day has an intake or an output; the whole day's intake, output (urine, drain) and balance, labelled as the previous day (the record has no shift split, so no shift-level figure is ever written)
    fact: ctx.intake_output_records.previous_day
    skip_neonate: true
  - id: devices
    source: ctx.devices (device records, insertion procedures and catheter orders of the stay); vital_signs[].on_supplemental_oxygen, oxygen_delivery_device, oxygen_flow_rate_lpm
    rule: a urinary catheter or central venous catheter in place during the shift (inserted before the shift's end, not yet removed), and the oxygen device of the shift's last reading when it is on oxygen; one sentence per device with its routine care
    fact: ctx.devices.shift
    skip_neonate: false
  - id: meal
    source: orders[] (diet orders); adl_assessments[].feeding; intake_output_records[].intake_oral_ml
    rule: the diet order in force at the shift's end; nil by mouth (continuing when the order was placed on an earlier day) or the diet taken orally, with the feeding help level of the assessment in force and the previous completed day's oral intake when recorded (no intake percentage is ever written)
    fact: ctx.orders.diet.shift
    skip_neonate: true
  - id: skin
    source: nursing_risk_assessments[].braden_total
    rule: the Braden total in force is at or below the reporting level; the risk band, with skin observation, and repositioning and pressure relief when at or below the prevention level
    fact: ctx.nursing_risk_assessments.braden
    skip_neonate: true
  - id: mobility
    source: adl_assessments[] (Barthel total, mobility, transfers, toilet_use)
    rule: an ADL assessment is in force at the shift's end; the Barthel total with its band and the help level of mobility, transfer and toileting
    fact: ctx.adl_assessments.shift
    skip_neonate: true
  - id: wound
    source: procedures[] (surgical procedures of the encounter)
    rule: a surgical procedure of the encounter started before the shift's end, within the site-observation window of `site_observation` below; the post-operative day and the routine surgical-site observation, or the access-site / pocket observation for a catheter procedure or device implant (no finding is stated)
    fact: ctx.procedures.surgical_site
    skip_neonate: true
  - id: postpartum
    source: extensions.delivery.mode; procedures[] (the delivery procedure); disease_exam.yaml delivery.modes.<mode>.obstetric_postpartum
    rule: a delivery stay, in a shift that ends after the delivery procedure ended; the postpartum day, the obstetric finding of the delivery exam block (the text of the H&P and the progress note), and that breastfeeding and voiding are not recorded (the record holds none; no pain or mobility is stated here, the pain and mobility items state them from the record)
    fact: ctx.delivery.postpartum
    skip_neonate: true
    only_postpartum: true
  - id: fall_risk
    source: nursing_risk_assessments[].fall_risk_level, morse_total
    rule: the fall-risk level in force at the shift's end is moderate or high; the level with the Morse total
    fact: ctx.nursing_risk_assessments@authored
    skip_neonate: true
  - id: newborn_care
    source: patient.date_of_birth
    rule: a newborn; the day of life, and that the feeding, voiding / stooling and umbilical-cord findings are not recorded (the record holds none; no intake, count or finding is stated)
    fact: ctx.newborn.care
    skip_neonate: false
    only_neonate: true
  - id: newborn_weight
    source: patient.weight_kg
    rule: a newborn; the birth weight of the newborn's profile (no later weight is recorded)
    fact: ctx.newborn.birth_weight
    skip_neonate: false
    only_neonate: true
  - id: newborn_jaundice
    source: extensions.newborn.bilirubin[]
    rule: a transcutaneous bilirubin was measured within the shift; that value with its day of life, stated once (a later shift with no new reading says nothing)
    fact: ctx.newborn.bilirubin
    skip_neonate: false
    only_neonate: true

# Barthel Index total -> band (phrase barthel_band.<band>); the lowest total
# of each band, highest band first.
barthel_bands:
  - [91, independent]
  - [61, minimal_assist]
  - [41, moderate_assist]
  - [21, severe_dependence]
  - [0, total_care]

# Braden total -> risk band (phrase morse_band.<band>, which names the risk
# bands of both scales); the lowest total of each band, highest first. The
# same bands are used by the nursing diagnosis and care plan builders.
braden_bands:
  - [19, low]
  - [15, mild]
  - [13, moderate]
  - [10, high]
  - [0, severe]
# The skin item is written at or below this Braden total (the lowest band
# above ``low``), and states repositioning and pressure relief at or below
# the prevention level (the same level as the care plan's pressure-injury
# prevention).
braden_report_at_or_below: 18
braden_prevention_at_or_below: 14

# Barthel item score -> help level (phrase ``nursing_shift_items.adl_level.<level>``)
# of the items the mobility and meal items state. The scores are those of
# types/encounter.py::ADLAssessment (feeding / toilet_use 0-5-10, mobility 0-5-10-15).
adl_levels:
  feeding: {10: independent, 5: partial, 0: dependent}
  mobility: {15: independent, 10: assisted, 5: wheelchair, 0: bedbound}
  toilet_use: {10: independent, 5: partial, 0: dependent}

# Site observation of a procedure of the surgical category, by the procedure
# catalog's `aftercare` category (clinosim/codes/data/clinosim-procedure-catalog.yaml;
# an aftercare not listed takes `surgical_wound`). `kind` selects the wording
# (wound: post-operative day and surgical-site observation; access_site:
# puncture-site bleeding / haematoma and distal pulses; pocket: generator-pocket
# haematoma and infection signs, as in `procedure_aftercare.<category>`).
# `max_days` is the last day (the day of the procedure is day 0) on which it is
# written. All limits are modelling choices for the notes, not guideline values:
# a catheter puncture is checked for a day or two (Issue #3556), a device pocket
# for a few days, an open wound for two weeks.
site_observation:
  surgical_wound: {kind: wound, max_days: 14}
  vascular_access: {kind: access_site, max_days: 1}
  device_pocket: {kind: pocket, max_days: 3}

# MAR routes written as an oral dose (内服); any other route is a plain dose.
oral_routes:
  - PO

# A stored hold reason that is a measured value, as a phrase of
# ``nursing_shift_items.hold_reason.<phrase>`` (n = the number captured). Any
# other reason is shown through hold_reason_display (the shared table, else as
# stored).
hold_reason_patterns:
  - pattern: '^SBP < (?P<n>[0-9.]+)$'
    phrase: sbp
  - pattern: '^HR < (?P<n>[0-9.]+)$'
    phrase: hr

# Drugs (drug_key of the bare drug name) counted as the antipyretic response
# to a fever when given in the shift.
antipyretic_drug_keys:
  - acetaminophen
  - ibuprofen
  - loxoprofen

# The devices of a stay that ``narrative/_devices.py::build_devices`` gathers
# for ``NarrativeContext.devices``. A device is in place from its insertion
# until its removal. The insertion is the stay's insertion procedure (start
# time), else the placing order's time, else the device record's placement
# date; the removal is the device record's removal date (no procedure or
# order records a removal). A device with no removal date is in place until
# discharge: the record cannot show an earlier removal.
#
#   kind:            the device as the note names it (phrase
#                    ``nursing_shift_items.devices.<kind>``)
#   device_types:    ``extensions["device"][].device_type`` values of the kind
#   procedure_types: ``procedures[].procedure_type`` values of the insertion
#   order_patterns:  case-insensitive regexes matched at the start of an
#                    order's ``display_name`` / ``order_code`` (a cancelled
#                    order places nothing)
# The mechanical ventilator of a device record is not listed: its record spans
# the whole stay although intubation is a part of it.
device_kinds:
  - kind: urinary_catheter
    device_types: [indwelling_catheter]
    procedure_types: [urinary_catheter]
    order_patterns: ['^(foley|urinary)[ _]catheter']
  - kind: central_line
    device_types: [cvc]
    procedure_types: [central_line]
    order_patterns: []
