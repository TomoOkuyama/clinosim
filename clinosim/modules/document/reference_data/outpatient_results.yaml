# How an outpatient note states the results behind a chronic problem
# (Issues #3231, #3273). Read by narrative/_outpatient_results.py.
#
# prior_lab_analytes: canonical analytes whose latest result before the note
#   (a lab of an earlier encounter of the patient, with its date) is cited when
#   the visit has none of its own, instead of the stage stored on the problem
#   list (which longitudinal/stage_refresh.py restates from the labs of the
#   same record).
# hold_followup_days: a drug held during an earlier encounter (a safety hold
#   logged in `patient.safety_skip_log`, event type `hold`) is stated in the
#   Plan of an outpatient visit within this many days of the hold: resumed on
#   today's prescription, or still on hold (Issue #3250).
# pending_lab_limit: at most this many tests are named in the "drawn today,
#   results pending" sentence of a note authored before its labs were reported
#   (Issue #3396); the rest are counted.
# screening_scores: scores reported as "<name> <value>" in the Assessment.
#   positive_from: a score at or above it is a positive screen, followed by the
#   plan line `follow_up` (locale/shared/narrative_phrases.yaml
#   outpatient_results.follow_up_<follow_up>). The simulator records the C-SSRS
#   as the ideation severity 0-5 (observation/reference_data/lab_constants.yaml),
#   so any value >= 1 is a positive screen.
metadata:
  kind: reference
  name: outpatient_results
  source: clinosim

prior_lab_analytes: [HbA1c, LDL, eGFR, Creatinine, Hb]

hold_followup_days: 90

pending_lab_limit: 6

screening_scores:
  PHQ-9: {}
  GAD-7: {}
  C-SSRS: {positive_from: 1, follow_up: suicide_risk}
