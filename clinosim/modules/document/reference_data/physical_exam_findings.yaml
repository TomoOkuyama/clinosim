# Physical exam findings catalog (Tier 1 #3 α-min-1 PR1 Task 5)
#
# baseline  = disease-agnostic fallback used when per-disease override absent
# findings  = per-disease per-archetype per-day per-system per-severity entries
#
# System keys (required ≥1 per day_N entry):
#   general | cardiovascular | respiratory | abdominal | neurological
#
# Severity keys per system: mild | moderate | severe | all
#   Use "all" when severity does not differentiate the finding.
#   Use a plain string (not a dict) when a single value applies regardless of severity.
#
# Day keys: day_0 (admission), day_3 (early recovery), day_7 (late recovery)
#   Task 6 TemplateNarrativeGenerator picks nearest earlier day ≤ current_day.
#
# Structure is intentionally human-readable; Task 6 is the consumer.

metadata:
  kind: reference
  name: physical_exam_findings
  source: clinosim

baseline:
  uncomplicated_improvement:
    day_0:
      general:
        mild: "意識清明、軽度全身倦怠感"
        moderate: "意識清明、苦痛様"
        severe: "意識やや低下、苦痛強い"
      cardiovascular:
        all: "整、心雑音なし"
      respiratory:
        mild: "呼吸音清明"
        moderate: "呼吸音清明、呼吸数軽度上昇"
        severe: "呼吸促迫、補助呼吸筋使用"
      abdominal: "平坦、軟、圧痛なし"
      neurological: "麻痺なし、項部硬直なし"
    day_3:
      general:
        all: "意識清明、症状改善傾向"
      cardiovascular:
        all: "整、心雑音なし"
      respiratory:
        all: "呼吸音清明、呼吸数正常"
      abdominal: "平坦、軟、圧痛なし"
      neurological: "麻痺なし"
    day_7:
      general:
        all: "意識清明、全身状態良好"
      cardiovascular:
        all: "整、心雑音なし"
      respiratory:
        all: "呼吸音清明"
      abdominal: "平坦、軟"
      neurological: "神経学的異常なし"

  complicated_deterioration:
    day_0:
      general:
        mild: "意識清明、全身倦怠感"
        moderate: "意識清明、苦痛様"
        severe: "JCS I-1〜2、苦痛強い"
      cardiovascular:
        mild: "整、心雑音なし"
        moderate: "頻脈傾向"
        severe: "頻脈、血圧低下傾向"
      respiratory:
        mild: "呼吸音清明"
        moderate: "呼吸促迫傾向"
        severe: "呼吸促迫、SpO₂低下"
      abdominal: "平坦、軟、圧痛なし"
      neurological: "麻痺なし"
    day_3:
      general:
        all: "症状遷延中"
      cardiovascular:
        all: "バイタル経過観察中"
      respiratory:
        all: "呼吸状態経過観察中"
      abdominal: "平坦、軟"
      neurological: "麻痺なし"

# Newborn exam set (Issue #3260). Used instead of ``baseline`` for a patient
# in the neonatal period (``narrative._narrative_utils.is_neonate``) when the
# disease authors no exam of its own, in every output language. Elements and
# normal findings follow Lewis ML, "A Comprehensive Newborn Examination:
# Part I. General, Head and Neck, Cardiopulmonary" and "Part II. Skin, Trunk,
# Extremities, Neurologic", Am Fam Physician 2014;90(5):289-296 and 297-302
# (pink skin, flexed posture, vigorous cry, equal movement of the extremities;
# anterior fontanelle; equal breath sounds, no retractions / grunting / nasal
# flaring; benign vs pathologic murmurs; cord checked for bleeding and
# infection; Barlow and Ortolani maneuvers; tone and the suck, root, grasp
# and Moro reflexes).
#
# ``jaundice`` is the skin finding, chosen by the latest total bilirubin
# measured by the note's time (none measured: the first band). Each band is
# the lowest value (mg/dL) at which it applies. The extent follows the Kramer
# dermal zones (1 head and neck, 2 trunk to the umbilicus, 3 groin and upper
# thighs, 4 knees / elbows to ankles / wrists, 5 hands and feet) with Kramer's
# finding that zone 2 corresponds to bilirubin below 12 mg/dL and zone 3
# below 15 mg/dL, as summarised in Sampurna MTA et al., "Kramer Score, an
# Evidence of Its Use in Accordance with Indonesian Hyperbilirubinemia
# Published Guideline", Int J Environ Res Public Health 2021;18:6173. Below
# 5 mg/dL is reported as no jaundice: total bilirubin >= 5 mg/dL is the
# jaundice threshold of "The Effect of Maternal Diet on Neonatal Jaundice: A
# Case-Control Study", Sultan Qaboos Univ Med J 2025.
neonatal:
  systems:
    general:
      en: "Active, vigorous cry, pink skin, moves all extremities equally"
      ja: "活気良好、啼泣良好、皮膚色良好、四肢の動きに左右差なし"
    head:
      en: "Anterior fontanelle soft and flat"
      ja: "大泉門平坦・軟"
    cardiovascular:
      en: "Regular rhythm, no murmur"
      ja: "整、心雑音なし"
    respiratory:
      en: "Breath sounds clear and equal; no retractions, grunting or nasal flaring"
      ja: "呼吸音清・左右差なし、陥没呼吸・呻吟・鼻翼呼吸なし"
    abdominal:
      en: "Soft, not distended"
      ja: "平坦、軟、膨満なし"
    umbilicus:
      en: "Cord stump without bleeding or signs of infection"
      ja: "臍帯断端に出血・発赤なし"
    hips:
      en: "Barlow and Ortolani negative"
      ja: "開排制限なし、Barlow・Ortolani テスト陰性"
    neurological:
      en: "Normal tone; suck, rooting, grasp and Moro reflexes present"
      ja: "筋緊張良好、吸啜反射・探索反射・把握反射・モロー反射あり"
  jaundice:
    - min_mg_dl: 0
      text: {en: "No jaundice", ja: "黄疸なし"}
    - min_mg_dl: 5
      text: {en: "Mild jaundice of the face and upper trunk", ja: "顔面から体幹上部に軽度の黄疸"}
    - min_mg_dl: 12
      text: {en: "Jaundice extending to the lower trunk and thighs", ja: "下腹部から大腿まで黄疸あり"}
    - min_mg_dl: 15
      text: {en: "Jaundice extending to the arms and legs", ja: "四肢まで黄疸あり"}

# Per-disease overrides (supplement or replace baseline when present)
# Only bacterial_pneumonia is populated in Task 5 as structural demonstration.
# Other priority diseases (aspiration_pneumonia, hemorrhagic_stroke,
# acute_MI, heart_failure) carry their findings in narrative.physical_exam_findings
# within their disease YAML (Task 4). Task 6 merges both sources.

findings:
  bacterial_pneumonia:
    uncomplicated_improvement:
      day_0:
        general:
          mild: "意識清明、軽度倦怠感"
          moderate: "意識清明、倦怠感"
          severe: "JCS I-1、呼吸促迫"
        respiratory:
          mild: "右下肺野に軽度水泡音"
          moderate: "両下肺野に水泡音"
          severe: "両肺に水泡音、補助呼吸筋使用"
        cardiovascular:
          all: "整、心雑音なし"
        abdominal: "平坦、軟、圧痛なし"
        neurological: "麻痺なし、項部硬直なし"
      day_3:
        general:
          all: "改善傾向、解熱"
        respiratory:
          all: "右下肺野水泡音残存するも減少"
        cardiovascular:
          all: "整、心雑音なし"
        abdominal: "平坦、軟、圧痛なし"
        neurological: "麻痺なし"
      day_7:
        general:
          all: "全身状態良好、解熱"
        respiratory:
          all: "呼吸音ほぼ清明"
        cardiovascular:
          all: "整、心雑音なし"
        abdominal: "平坦、軟"
        neurological: "神経学的異常なし"
    complicated_deterioration:
      day_0:
        general:
          mild: "意識清明、倦怠感"
          moderate: "JCS I-1、苦痛様"
          severe: "JCS I-2、高度苦痛"
        respiratory:
          mild: "右下肺野に水泡音"
          moderate: "両下肺野に著明な水泡音"
          severe: "両肺に水泡音、呼吸促迫著明"
        cardiovascular:
          mild: "整、心雑音なし"
          moderate: "頻脈"
          severe: "頻脈、血圧低下"
        abdominal: "平坦、軟、圧痛なし"
        neurological: "麻痺なし"
