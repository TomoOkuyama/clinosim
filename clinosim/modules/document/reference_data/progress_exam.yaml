# How a daily progress note's physical exam and general state follow the
# vital signs of the note's period (Issue #3235). Read by
# narrative/_progress_exam.py and applied by narrative/renderers/progress_note.py
# (the H&P exam is the admission-day exam and is not judged here).
#
# The progress-note exam is the disease's authored exam of the nearest earlier
# day, written per severity and not from the patient's readings. A statement
# of that text a reading of the note's period contradicts ("全身状態良好" on a
# febrile day, "呼吸数正常" at RR 28, "頻脈" at HR 80) is left out, and an
# abnormal reading the exam does not state is added to the matching system
# ("発熱あり", "頻脈", "SpO2 低下、酸素投与下"). The same vocabulary of vital-
# stating terms as the ED note of an admitted patient
# (ed_note_admitted.yaml exam_vital_terms) is read, plus ``extra_terms``.

metadata:
  kind: reference
  name: progress_exam
  source: clinosim

# A reading of the period is abnormal when it is below ``low`` or above
# ``high`` (at ``high`` too with ``high_inclusive``); the period's state of a
# vital is that of its most abnormal reading (high / low, else normal).
#   temperature_celsius high 38.0 inclusive: fever (progress_vitals.yaml
#     trend.fever_c).
#   heart_rate 60-100 /min: AHA/ACC adult resting definition of brady- /
#     tachycardia.
#   respiratory_rate high 20 /min: adult reference 12-20 /min.
#   spo2 low 94 %: below the BTS 2017 target range of 94-98 % for adults not
#     at risk of hypercapnia (O'Driscoll BR et al., Thorax 2017;72:i1-i90).
#   systolic_bp low 90 mmHg: hypotension (shock work-up cut-off). For a
#     child the low limit is the age band's ``critical_low`` (``child_low:
#     critical_low``), the PALS 2020 hypotension threshold documented in
#     pediatric_reference_ranges.yaml, not the band's normal-range ``low``
#     (a newborn baseline of 68 mmHg lies just above the 0-0 band's low of 67,
#     so ordinary readings would otherwise be called hypotension; Issue #3402).
#   pain_score high 3 (0-10 NRS): a score of 4 or more is notable pain
#     (the Subjective's pain threshold, composers._SUBJ_PAIN_NOTABLE).
# A child is judged against the age-banded range of
# observation/reference_data/pediatric_reference_ranges.yaml where it lists
# the vital (not temperature, pain).
#
# ``exit_margin`` (Issue #3964): hysteresis of the course statements. A finding
# is entered at the limit above and left only once the value is ``exit_margin``
# (the vital's unit) inside it: heart rate 100 -> exit below 95, respiratory
# rate 20 -> below 18, temperature 38.0 -> below 37.7, SpO2 94 -> above 95
# (the low edge of the heart rate, 60, is left above 65). A value between
# the two is borderline: the Assessment states neither "new" nor "resolved"
# for it, so a heart rate of 98-104 over several days is not reported as
# tachycardia appearing and disappearing on alternate days. The margins are
# clinosim modelling choices (about half of the vital's ``min_change`` in
# ``course_items``); no clinical source gives such a number and none was
# verified. A vital without a margin (blood pressure, pain) keeps the single
# limit. A margin is relative to the limit, so it follows the child's age band
# and a patient's own SpO2 target.
#
# Statements about how the patient is NOW (an added exam finding, the
# Assessment's course line) are judged on the latest reading of each vital,
# the value the Objective prints (``current_states``); a clause of the
# authored exam is left out when any reading of the period contradicts it
# (``period_states``). A peak earlier in the period is stated only
# time-qualified (Issue #3401).
limits:
  temperature_celsius: {high: 38.0, high_inclusive: true, exit_margin: 0.3}
  heart_rate: {low: 60, high: 100, exit_margin: 5}
  respiratory_rate: {low: 12, high: 20, exit_margin: 2}
  spo2: {low: 94, exit_margin: 1}
  systolic_bp: {low: 90, child_low: critical_low}
  pain_score: {high: 3}

# A low reading of a newborn is stated (an added exam finding, the course line)
# only when it is sustained (Issue #3563). A newborn's baseline systolic
# pressure (about 68 mmHg) lies a few mmHg above the PALS hypotension cut-off
# (60 mmHg), so one reading of 56-59 is an ordinary fluctuation, not a new
# hypotension or a deterioration. For a patient up to ``max_age_months`` old, a
# low reading of the vital counts when it is part of a run of ``min_readings``
# consecutive readings of the vital below the limit (the readings before the
# note's period included), or when another vital of ``accompanying_vitals`` is
# abnormal at the same reading. The persistence rule is a clinosim modelling
# choice (not a guideline criterion; none was verified against a source).
# Adults and older children are judged on a single reading as before.
sustained_low:
  systolic_bp:
    max_age_months: 0
    min_readings: 2
    accompanying_vitals: [heart_rate, respiratory_rate, spo2, temperature_celsius]

# A patient's own target range replaces the adult ``low`` of the vital
# (Issue #3401): a patient with COPD is titrated to an SpO2 of 88-92 % to
# avoid hypercapnia (GOLD / BTS, as cited by the oxygen-start target of
# simulator/_oxygen_therapy_thresholds.py SPO2_TARGET_COPD and the
# ``spo2_target_low`` of locale/shared/chronic_medications.yaml J44), so an
# SpO2 of 90 % is not low for them. Applies to the patients of ``disease_ids``
# and to those with a chronic or encounter diagnosis starting with one of
# ``chronic_code_prefixes`` (J44: COPD). The Subjective's SpO2 trend
# (narrative/renderers/_composers.py) reads the same floor.
limit_overrides:
  - vital: spo2
    low: 88
    disease_ids: [copd_exacerbation]
    chronic_code_prefixes: [J44]

# Exam clauses are split at these separators (outermost first); a clause is
# kept or left out as a whole.
clause_separators:
  ja: ["。", "、", "・"]
  en: [". ", ", ", "; "]

# A sentence that lost its trailing clause ends in the connective form of its
# last verb ("脱水を認め、苦痛様" without the distress clause is "脱水を認め");
# the connective ending is replaced by the sentence-final form (Issue #3456).
terminal_forms:
  ja:
    認め: 認める
    伴い: 伴う
    示し: 示す
    呈し: 呈する

# Terms that state more than one vital or a patient state, in addition to the
# single-vital terms of ed_note_admitted.yaml.
#   vitals: the vitals the term speaks for; ``agree: all`` keeps the clause
#     only when every listed vital is in ``states`` (a statement of general
#     well-being), ``agree: any`` when at least one is (a statement of
#     illness or distress).
#   states: low / normal / high; ``pain_score`` high is notable pain.
extra_terms:
  - vitals: [temperature_celsius]
    agree: any
    states: [high]
    terms:
      ja: ["発熱", "熱感", "高熱"]
      en: ["febrile", "fever"]
  - vitals: [temperature_celsius]
    agree: all
    states: [normal, low]
    terms:
      ja: ["発熱なし", "解熱"]
      en: ["afebrile"]
  - vitals: [temperature_celsius, heart_rate, respiratory_rate, spo2, systolic_bp]
    agree: all
    states: [normal]
    terms:
      ja: ["全身状態良好", "症状改善傾向", "全身状態安定", "状態安定", "呼吸状態安定", "バイタル安定", "苦痛なし"]
      en: ["general condition good", "symptoms improving", "condition stable", "no distress"]
  - vitals: [temperature_celsius, heart_rate, respiratory_rate, spo2, systolic_bp, pain_score]
    agree: any
    states: [low, high]
    terms:
      ja: ["苦痛様", "苦痛強い", "苦悶様"]
      en: ["in distress", "appears distressed"]

# Findings added when the period's state of a vital is abnormal and the
# system's exam does not already state it. ``system`` is the exam body
# system (physical_exam_findings.yaml); a vital named "on_oxygen" is the oxygen therapy itself (state high when the latest
# reading of the period is on supplemental oxygen).
state_findings:
  - {vital: temperature_celsius, state: high, system: general, text: {ja: 発熱あり, en: febrile}}
  - {vital: heart_rate, state: high, system: cardiovascular, text: {ja: 頻脈, en: tachycardia}}
  - {vital: heart_rate, state: low, system: cardiovascular, text: {ja: 徐脈, en: bradycardia}}
  - {vital: systolic_bp, state: low, system: cardiovascular, text: {ja: 血圧低下, en: hypotension}}
  - {vital: respiratory_rate, state: high, system: respiratory, text: {ja: 頻呼吸, en: tachypnea}}
  - {vital: spo2, state: low, system: respiratory, text: {ja: SpO2 低下, en: hypoxemia}}
  - {vital: on_oxygen, state: high, system: respiratory, text: {ja: 酸素投与下, en: on supplemental oxygen}}

# The abnormal states of the period named when a note's Assessment says how
# the course changed (fewer / more abnormal states than the previous period).
# "consciousness" high is an AVPU level other than Alert; "on_oxygen" high is
# supplemental oxygen.
# ``min_change`` (Issue #3455): a state present in both periods is "improving"
# or "worsening" only when the vital's latest value moved at least this far
# (in the vital's unit) between the two periods' latest readings; a smaller
# move stays "persisting". The values are clinosim conventions for a change
# worth a course statement (not guideline cut-offs; none was verified against
# a source); the pseudo-vitals have no value and need none.
course_items:
  - {vital: temperature_celsius, state: high, min_change: 0.5, name: {ja: 発熱, en: fever}}
  - {vital: heart_rate, state: high, min_change: 10, name: {ja: 頻脈, en: tachycardia}}
  - {vital: heart_rate, state: low, min_change: 10, name: {ja: 徐脈, en: bradycardia}}
  - {vital: respiratory_rate, state: high, min_change: 3, name: {ja: 頻呼吸, en: tachypnea}}
  - {vital: spo2, state: low, min_change: 2, name: {ja: SpO2 低下, en: low SpO2}}
  - {vital: systolic_bp, state: low, min_change: 10, name: {ja: 血圧低下, en: hypotension}}
  - {vital: consciousness, state: high, name: {ja: 意識レベル低下, en: reduced consciousness}}
  - {vital: on_oxygen, state: high, name: {ja: 酸素投与, en: oxygen therapy}}

# The state of each course item at the note's time (Issue #3541), computed once
# per note and used by the Subjective sentences and the Assessment course line:
# new (present now, absent over the previous period), persisting (present now
# and in the previous period), improving (absent now but present in the
# previous period, not yet sustained), resolved (absent over
# the sustained window), judged only on the readings up to the note's authored
# time (a note cannot see later readings).
#   resolved_window_hours: the window before the note in which no reading may
#     be abnormal for "resolved"; a clinosim modelling choice (not a guideline
#     cut-off; none was verified against a source).
#   resolved_min_readings: the readings of the item's vital the window must
#     hold, so one normal reading is never "resolved"; likewise a modelling
#     choice.
course_state:
  resolved_window_hours: 24
  resolved_min_readings: 2

# The Assessment of a note names the problem when the level of consciousness
# stays below Alert (Issue #3471). AVPU comes from the physiology, not from a
# diagnosis, so a persistent decrease is stated as a problem with its cause
# work-up and delirium as one differential, not as a delirium diagnosis;
# delirium is named as such only for a stay whose complications record it
# (``delirium_complications``, complication tokens).
#   min_days: the consecutive hospital days up to the note (a day counts when
#     the latest AVPU of its readings is below Alert) from which the
#     persistence is stated; a clinosim convention (not a guideline cut-off;
#     none was verified against a source).
#   work_up: the causes the work-up looks for, the usual reversible causes of
#     delirium and acute confusion.
consciousness_course:
  min_days: 2
  delirium_complications: [delirium, postoperative_delirium, icu_delirium, delirium_tremens]
  work_up:
    ja: [薬剤, 感染, 電解質, 低酸素]
    en: [medication, infection, electrolyte disturbance, hypoxia]
  # A level of consciousness of Pain or Unresponsive (Issue #3544) is a coma
  # state, not delirium: its cause work-up lists the neurological and
  # structural causes first, and the neurological exam states the response of
  # the level instead of "unchanged from the previous day". The keys of
  # ``neurological`` are the AVPU levels that count as coma. The causes and the
  # wording are clinosim conventions (the usual differential of a reduced
  # level of consciousness, and the AVPU definitions of the response); no
  # guideline text was verified against a source.
  coma:
    work_up:
      ja: [頭蓋内病変, 低血糖, 痙攣, 薬剤, 感染, 電解質, 低酸素]
      en: [intracranial lesion, hypoglycemia, seizure, medication, infection, electrolyte disturbance, hypoxia]
    neurological:
      P:
        ja: 痛み刺激でのみ反応、従命不可
        en: responds to pain only, does not follow commands
      U:
        ja: 刺激に覚醒せず、従命不可
        en: does not rouse to stimulation, does not follow commands
