# Document section catalog — single source of truth for section slug metadata.
#
# Introduced by META #957 close-out session 97 (2026-09-02): before this file,
# section metadata (JA title / EN title / LOINC coding) was authored across
# three parallel dicts in
# `clinosim/modules/output/fhir_r4/documents/composition.py` (`_SECTION_TITLE_JA`,
# `_SECTION_TITLE_EN`, `_SECTION_LOINC`). PRs adding a new section type (e.g. #991
# OPERATIVE_NOTE, #992 PROCEDURE_NOTE, #961 death certificate) had to update all
# three tables plus the section builder in `template_generator.py` — asymmetric
# updates produced silent drift (raw machine slug leaking as
# `Composition.section.title` in JP output; 36 hits in a p=500 JP verify sim
# were caused by PR #991 forgetting the JA-side dict, patched by PR #1055).
#
# This file is the single SoT. Every section slug authored in
# `document_type_specs.yaml` MUST have an entry here (fail-loud at import time
# in `_validate_section_catalog_coverage`). Adding a new slug is one edit:
# add an entry here and reference it from `document_type_specs.yaml`.
#
# Schema (validated by Pydantic in `clinosim/locale/loader.py::load_section_catalog`):
#
#   <slug>:
#     title_ja: <str>      # Japanese display title for JP output
#     title_en: <str>      # English display title for US output
#     loinc: <str>         # LOINC section code (see clinosim/codes/data/loinc.yaml)
#     description: <str>   # (optional) one-line maintainer note — clinical scope
#
# Naming conventions:
#   * `subjective` / `objective` / `assessment` / `plan` — SOAP outpatient / progress notes
#   * `admission_*` / `hospital_course` / `discharge_*` — inpatient course docs
#   * `nursing_*` / `care_plan` / `adl_assessment` — nursing note sections
#   * `op_*` — operative note (surgical) sections (Issue #991)
#   * `pn_*` — procedure note (non-surgical procedure) sections (Issue #992)
#   * `dds_*` — death discharge summary sections (Issue #961)
#   * `nutrition_*` — dietitian / nutrition management plan sections
#
# LOINC selection guidance:
#   * Match the section's clinical scope against the LOINC 2.82 catalog
#     (mirror cached under fhir-jp-validator + iris4h-ai).
#   * When no exact match exists, use one of the established catch-alls:
#       18776-5 "Plan of care note"       — plan / policy / goals / follow_up
#       51852-2 "Provider unspecified Progress note" — misc narrative catch-all
#       29554-3 "Procedure narrative"     — surgical / procedural body text
#       51897-7 "Care team member"        — performer / operator sections
#       61144-2 "Diet and nutrition Narrative" — dietitian / nutrition family
#   * Death-certificate legal fields (immediate_cause_of_death /
#     underlying_cause_of_death / manner_of_death) use 69453-9
#     "Cause of death [US Standard Certificate of Death]" family.
#
# JA translation guidance:
#   * Follow JSOG / MHLW 標準診療録記載要領 conventions when the section is
#     clinically established.
#   * Match existing `_SECTION_TITLE_JA` values verbatim (behavior-preserving
#     migration); only novel entries use fresh translations.

