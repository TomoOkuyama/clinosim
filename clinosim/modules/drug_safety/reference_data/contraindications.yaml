# clinosim/modules/drug_safety/reference_data/contraindications.yaml
# Class × class contraindication rules. Schema documented in ./README.md.
# - Match is order-independent (check_pair(A, B) == check_pair(B, A)).
# - When multiple rules hit the same drug pair, the highest-severity rule wins.
# - `substitution_hint` names the indication tag suggest_alternative should use
#   as a prior; leave null when no natural substitute exists.

metadata:
  kind: reference
  name: contraindications
  source: clinosim

rules:
  - id: vka-plus-antiplatelet
    lhs: anticoagulant.vka
    rhs: antiplatelet
    severity: contraindicated
    rationale:
      en: "VKA + antiplatelet substantially raises major bleeding risk. Allowed only under specific indications (recent PCI + AF ≤12mo, mechanical valve + secondary prevention) with GI protection."
      ja: "ワルファリン (VKA) と抗血小板薬の併用は重大出血リスクを大幅に上昇。特定の適応 (PCI 後 12 か月以内かつ AF、機械弁 + 二次予防) 下でのみ、消化管保護と併用。"
    substitution_hint: pain_management
    source: "CHEST 2016 antithrombotic guidelines; JCS 2020 抗血栓療法"

  # Issue #1334 part 2 (META #1392 Cluster A): DOAC + P2Y12-inhibitor
  # antiplatelet is the missing peer of vka-plus-antiplatelet — post-CVA
  # discharge Rx pattern review found DOAC + Aspirin + Clopidogrel triple
  # therapy emitted on encounters without a documented PCI. DOAC + P2Y12
  # is contraindicated outside of the post-PCI+AF ≤6-week window; DOAC +
  # Aspirin is already caught by ``anticoagulant-plus-nsaid`` below
  # (Aspirin dual-classed as antiplatelet.cox_inhibitor + nsaid). This
  # rule closes the third leg of the triple.
  - id: doac-plus-p2y12
    lhs: anticoagulant.doac
    rhs: antiplatelet.p2y12
    severity: contraindicated
    rationale:
      en: "DOAC + P2Y12 inhibitor (Clopidogrel/Prasugrel/Ticagrelor) raises major bleeding risk. Reserved to a brief post-PCI window in AF patients (≤6 weeks); long-term double therapy is not indicated."
      ja: "DOAC と P2Y12 阻害薬 (クロピドグレル/プラスグレル/チカグレロル) の併用は重大出血リスクを大幅に上昇。AF での PCI 直後 6 週以内に限定される二剤併用、長期併用は原則禁忌。"
    substitution_hint: pain_management
    source: "AUGUSTUS 2019, ENTRUST-AF-PCI 2019, JCS 2020 抗血栓療法"

  - id: anticoagulant-plus-nsaid
    lhs: anticoagulant
    rhs: nsaid
    severity: contraindicated
    rationale:
      en: "Anticoagulant + NSAID raises GI bleeding risk ~3-4x. Use acetaminophen instead."
      ja: "抗凝固薬と NSAID の併用は消化管出血リスクを 3-4 倍に上昇。アセトアミノフェン等の代替を選択。"
    substitution_hint: pain_management
    source: "BMJ 2011;343:d4094"
    # Issue #3003: heparin (unfractionated or low-molecular-weight) with
    # low-dose antiplatelet aspirin is the standard regimen of acute coronary
    # syndrome and PCI; the bleeding caution concerns analgesic NSAIDs.
    # Aspirin with an oral anticoagulant stays caught (this rule for DOACs,
    # vka-plus-antiplatelet for warfarin).
    exempt:
      - lhs: anticoagulant.heparin
        rhs: antiplatelet
        source: "2025 ACC/AHA/ACEP/NAEMSP/SCAI ACS guideline; JCS 2018 急性冠症候群ガイドライン"

  - id: bb-plus-non-dhp-ccb
    lhs: beta_blocker
    rhs: ccb.non_dhp
    severity: major
    rationale:
      en: "β-blocker + non-DHP CCB (verapamil / diltiazem) risks bradycardia, AV block, heart failure exacerbation."
      ja: "β遮断薬と非 DHP CCB (ベラパミル/ジルチアゼム) の併用は徐脈・房室ブロック・心不全増悪リスク。"
    substitution_hint: hypertension_or_rate_control
    source: "ACC/AHA 2019 chronic coronary disease; JCS 2018 心不全"

  # Issue #2713: two drugs of a class given as one agent.
  - id: p2y12-plus-p2y12
    lhs: antiplatelet.p2y12
    rhs: antiplatelet.p2y12
    severity: contraindicated
    rationale:
      en: "Two P2Y12 inhibitors are never combined; switching (e.g. clopidogrel to ticagrelor) replaces the first."
      ja: "P2Y12 阻害薬の二剤併用は行わない。切替 (クロピドグレル→チカグレロル等) は前剤を置き換える。"
    substitution_hint: null
    source: "ACC/AHA 2016 DAPT focused update; ESC 2023 ACS guidelines"

  - id: statin-plus-statin
    lhs: statin
    rhs: statin
    severity: contraindicated
    rationale:
      en: "Two statins are a therapeutic duplication (more myopathy risk, no added LDL lowering); intensification switches the agent or the dose."
      ja: "スタチン二剤は治療重複 (筋障害リスク増、LDL 低下の上乗せなし)。強化は薬剤変更または増量で行う。"
    substitution_hint: null
    source: "ACC/AHA 2018 Cholesterol Guideline (statin intensity); JAS 2022 動脈硬化性疾患予防ガイドライン"

  - id: doac-plus-vka
    lhs: anticoagulant.doac
    rhs: anticoagulant.vka
    severity: contraindicated
    rationale:
      en: "A DOAC and warfarin are not given together; a switch stops one when the other starts (per INR)."
      ja: "DOAC とワルファリンは併用しない。切替時は INR を見て一方を中止してから他方を開始する。"
    substitution_hint: null
    source: "EHRA 2021 practical guide on NOAC use in AF"

  # Issue #3003: with heparin no longer avoided beside aspirin, an ACS
  # patient on therapeutic unfractionated heparin must not also get
  # prophylactic enoxaparin: two heparins are one anticoagulant given twice.
  - id: heparin-plus-heparin
    lhs: anticoagulant.heparin
    rhs: anticoagulant.heparin
    severity: contraindicated
    rationale:
      en: "Unfractionated heparin and a low-molecular-weight heparin are not given together; a patient on therapeutic heparin needs no prophylactic dose, and a switch stops one before the other starts."
      ja: "未分画ヘパリンと低分子ヘパリンは併用しない。治療量のヘパリン投与中は予防投与を行わず、切替時は一方を中止してから他方を開始する。"
    substitution_hint: null
    source: "ACCP CHEST 2012 antithrombotic therapy (VTE prevention, parenteral anticoagulants); enoxaparin prescribing information"

  # Issue #2707: dual RAAS blockade.
  - id: acei-plus-arb
    lhs: acei
    rhs: arb
    severity: contraindicated
    rationale:
      en: "ACE inhibitor + ARB (dual RAAS blockade) adds hyperkalemia, hypotension and acute kidney injury without cardiovascular or renal benefit; use one agent."
      ja: "ACE 阻害薬と ARB の併用 (RAS 二重阻害) は心血管・腎保護の上乗せなく高 K 血症・低血圧・急性腎障害を増やす。いずれか一剤とする。"
    substitution_hint: null
    source: "ONTARGET (NEJM 2008;358:1547); VA NEPHRON-D (NEJM 2013;369:1892); KDIGO 2021 BP in CKD"

  - id: acei-arb-plus-potassium
    lhs: acei_arb
    rhs: potassium_supplement
    severity: major
    rationale:
      en: "ACEi/ARB + K supplementation risks hyperkalemia; monitor K+ closely if combined."
      ja: "ACEi/ARB と K 補充の併用は高 K 血症リスク。併用時は K+ モニタリング必須。"
    substitution_hint: null
    source: "KDIGO 2024 CKD management"

  - id: acei-arb-plus-k-sparing-diuretic
    lhs: acei_arb
    rhs: diuretic.k_sparing
    severity: moderate
    rationale:
      en: "ACEi/ARB + K-sparing diuretic (spironolactone) raises hyperkalemia risk. Combination is sometimes indicated in heart failure — monitor K+."
      ja: "ACEi/ARB と K 保持性利尿薬 (スピロノラクトン) の併用は高 K 血症リスク。心不全では併用適応もあるが K+ モニタリング必須。"
    substitution_hint: null
    source: "ESC 2021 heart failure guidelines"

  - id: statin-plus-cyp3a4-strong-inhibitor
    # CYP3A4-metabolised statins only (simvastatin, atorvastatin); rosuvastatin
    # and pravastatin are not, so the rule keys on cyp3a4_substrate (Issue #2298).
    lhs: cyp3a4_substrate
    rhs: cyp3a4_inhibitor_strong
    severity: major
    rationale:
      en: "Simvastatin/atorvastatin + strong CYP3A4 inhibitor (clarithromycin, itraconazole) raises rhabdomyolysis risk. Consider holding statin during antibiotic course."
      ja: "シンバスタチン/アトルバスタチンと強力な CYP3A4 阻害薬 (クラリスロマイシン、イトラコナゾール) の併用は横紋筋融解症リスク。抗菌薬投与中はスタチン休薬を検討。"
    substitution_hint: null
    source: "FDA drug safety communication 2011"

  - id: allopurinol-plus-thiopurine
    lhs: xanthine_oxidase_inhibitor
    rhs: thiopurine
    severity: contraindicated
    rationale:
      en: "Allopurinol + azathioprine causes life-threatening bone marrow suppression via blocked thiopurine metabolism. Avoid; if unavoidable, reduce azathioprine to 25% of usual dose."
      ja: "アロプリノールとアザチオプリンの併用は代謝阻害により致死的骨髄抑制を引き起こす。原則併用禁忌。やむを得ず併用する場合はアザチオプリンを通常量の 25% に減量。"
    substitution_hint: null
    source: "UpToDate 2024 immunosuppressant drug interactions"

  - id: ssri-plus-maoi
    lhs: ssri
    rhs: maoi
    severity: contraindicated
    rationale:
      en: "SSRI + MAOI risks fatal serotonin syndrome. Requires ≥14-day washout between the two."
      ja: "SSRI と MAOI の併用は致死的セロトニン症候群のリスク。切替時は 14 日以上の休薬期間が必要。"
    substitution_hint: null
    source: "APA 2010 major depressive disorder practice guideline"

  # Audit s103 (p=2000 US 5y seed=42): POP-000601 (21M, GAD-7 severe)
  # home_meds carried Sertraline (SSRI) + Duloxetine (SNRI) + Alprazolam
  # concurrently. Chronic SSRI + SNRI co-prescription is not standard
  # of care — both mechanisms raise 5-HT availability, so the pair
  # multiplies serotonin-syndrome risk without evidence of additive
  # efficacy. APA/VA-DoD depression guidelines recommend switching
  # between SSRI and SNRI (with washout) rather than combining; the
  # augmentation path at specialist clinics typically uses an atypical
  # (Mirtazapine, Bupropion) on top of the primary serotonergic agent,
  # not a second serotonergic agent. Mapped `major` so the activator
  # CPOE-gate drops the second serotonergic candidate (SSRI stays as
  # first-line; SNRI is skipped). Mirtazapine, Bupropion and other
  # non-SSRI/SNRI antidepressants carry only the "antidepressant" tag
  # and are therefore unaffected.
  - id: ssri-plus-snri
    lhs: ssri
    rhs: snri
    severity: major
    rationale:
      en: "SSRI + SNRI concurrent raises 5-HT at both the reuptake and additional norepinephrine axes without added efficacy, multiplying serotonin-syndrome risk. Guideline practice is switching with washout, not combining. Augmentation of a serotonergic agent should use an atypical (Mirtazapine, Bupropion) or a non-serotonergic adjunct."
      ja: "SSRI と SNRI の併用は 5-HT 再取り込み阻害が重なり、追加の効果上積みなくセロトニン症候群リスクを多重化する。ガイドライン実務は休薬期間を置いた切替であり、両剤同時併用は推奨されない。セロトニン作動薬の増強には非定型抗うつ薬 (ミルタザピン等) あるいは非セロトニン作動系の併用が標準。"
    substitution_hint: null
    source: "APA 2010 major depressive disorder practice guideline; VA/DoD 2022 MDD guideline"

  # Issue #1347 (META #1392 Cluster A part 4): same-class NSAID stacking
  # mutex. Multiple NSAIDs concurrently provide NO additional analgesia
  # (single receptor family, ceiling effect) but multiply GI bleed, renal
  # injury and cardiac risk. Random-sample review flagged 3-NSAID
  # stacking on an ED low-back-pain visit (Ketorolac IV + Ibuprofen PO
  # + chronic Celecoxib PO). This rule fires on any nsaid × nsaid pair;
  # the activator dedup and ED-order gate treat it as skip. Aspirin
  # baby-dose (81 mg) for cardio-protection with a topical NSAID is a
  # documented exception in some guidelines but is not modeled here as
  # a whitelist — clinical impact of dropping the second NSAID is
  # minimal (patient still has the first one plus acetaminophen/etc.).
  - id: nsaid-stacking
    lhs: nsaid
    rhs: nsaid
    severity: contraindicated
    rationale:
      en: "Multiple NSAIDs concurrent give no added analgesia (single receptor family, ceiling effect) but multiply GI bleed / renal / cardiac risk. Pick one NSAID or switch to acetaminophen."
      ja: "NSAID の重複投与は鎮痛効果を上乗せせず (受容体飽和)、消化管出血・腎障害・心血管イベントリスクを多重化。単剤またはアセトアミノフェン等に切替。"
    substitution_hint: pain_management
    source: "ACR 2020 knee OA guideline; JOA 変形性膝関節症診療ガイドライン 2023"

  # Issue #2253: drugs that raise serum lithium. The FDA lithium label
  # (section 7) recommends more frequent serum-lithium monitoring and dose
  # adjustment rather than avoidance, so these are emitted with a caution
  # note. Aspirin is dual-classed as an NSAID and is caught by the NSAID
  # rule too.
  - id: lithium-plus-diuretic
    lhs: lithium
    rhs: diuretic
    severity: moderate
    rationale:
      en: "Diuretics (thiazides in particular) reduce renal lithium clearance and raise serum lithium. Monitor serum lithium more often and adjust the dose."
      ja: "利尿薬 (特にサイアザイド系) はリチウムの腎クリアランスを低下させ血中濃度を上昇させる。血中リチウム濃度を頻回に測定し用量を調整する。"
    substitution_hint: null
    source: "FDA lithium carbonate label, section 7 Drug Interactions"

  - id: lithium-plus-acei-arb
    lhs: lithium
    rhs: acei_arb
    severity: moderate
    rationale:
      en: "Renin-angiotensin system antagonists raise steady-state serum lithium. Monitor serum lithium more often and adjust the dose."
      ja: "ACE 阻害薬・ARB はリチウムの定常状態血中濃度を上昇させる。血中リチウム濃度を頻回に測定し用量を調整する。"
    substitution_hint: null
    source: "FDA lithium carbonate label, section 7 Drug Interactions"

  - id: lithium-plus-nsaid
    lhs: lithium
    rhs: nsaid
    severity: moderate
    rationale:
      en: "NSAIDs reduce renal blood flow and lithium clearance, raising serum lithium. Monitor serum lithium more often and adjust the dose, or use acetaminophen."
      ja: "NSAID は腎血流とリチウムクリアランスを低下させ血中濃度を上昇させる。血中リチウム濃度を頻回に測定し用量を調整するか、アセトアミノフェンを選択する。"
    substitution_hint: pain_management
    source: "FDA lithium carbonate label, section 7 Drug Interactions"

# Issue #2713: rules that the discharge prescription reconciles against the
# items already on it (the earlier item — the stay's new regimen — is kept,
# the later one is dropped and logged). Unambiguous class duplications only;
# combinations whose appropriateness depends on the indication (e.g. warfarin
# with an antiplatelet after PCI in AF) are not reconciled here.
discharge_reconciliation_rules:
  - acei-plus-arb
  - p2y12-plus-p2y12
  - doac-plus-vka
  - statin-plus-statin

# Issue #2717: antithrombotic plan when an anticoagulated patient (DOAC /
# warfarin) leaves on dual antiplatelet therapy after an ACS / PCI. Aspirin
# for at most a week, then the anticoagulant plus clopidogrel (the P2Y12
# inhibitor studied with OAC; ticagrelor / prasugrel are switched).
# AUGUSTUS (NEJM 2019;380:1509); ACC 2020 expert consensus; ESC 2023 ACS.
triple_therapy_after_acs:
  aspirin_days: 7
  p2y12_with_oac: clopidogrel
  p2y12_dose: "75mg PO daily"

