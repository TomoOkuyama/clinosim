# clinosim/modules/drug_safety/reference_data/disease_contraindications.yaml
#
# Drug-class × active-disease-state contraindication rules — the drug-vs-
# disease-state companion to ``contraindications.yaml`` (drug-vs-drug rules).
# Consumed by ``clinosim.modules.drug_safety.engine.check_candidate_against_disease_state``.
#
# When a candidate drug's ``drug_class`` (from ``drug_classes.yaml``) matches
# a rule AND the patient carries a chronic ICD code whose base or full form
# matches the rule's ``disease_predicate.icd_prefix`` (and, when the rule
# sets ``disease_predicate.stage_in``, the condition's stage is in that
# list), the rule fires with the declared ``severity``.
# ``check_candidate_against_disease_state`` returns every matched verdict;
# its caller (the activator's chronic-med sampler,
# ``modules/patient/activator.py``) picks the highest severity and applies
# the default action derived from it by
# ``verdict.SafetyVerdict.default_action``.
#
# Match semantics:
#   - ``drug_class``: a class in the candidate's expanded class list.
#   - ``disease_predicate.icd_prefix``: any of the strings match a chronic
#     condition's code by prefix. E.g. ``["I50"]`` matches ``I50``, ``I50.9``,
#     ``I50.32``, …
#   - ``disease_predicate.stage_in`` (optional, Issue #1769): the matched
#     condition must also carry one of these stage strings.
#
# Rules: NSAID vs HF / cirrhosis / CKD stage 4-5 (Cluster A of Issue #1392,
# from the Issue #1350 random-sample review) and Metformin vs CKD G3b-G5
# (Issue #1769). Wire-up covers chronic-med sampling; acute-illness
# gates (ACE-I in AKI, Alendronate PO in dysphagic stroke — Issue #1335)
# require order/discharge_rx path integration and are deferred to a
# follow-up PR in the same Cluster A family.
#
# Severity taxonomy is shared with ``contraindications.yaml``:
#   contraindicated > major > moderate > minor > allowed
# The default action mapping in ``verdict.py`` treats
# ``contraindicated / major`` as "skip", ``moderate / minor`` as "warn".

rules:
  - id: nsaid-in-heart-failure
    drug_class: nsaid
    disease_predicate: {icd_prefix: ["I50"]}
    severity: major
    substitution_hint: pain_management
    rationale_en: "NSAIDs precipitate HF exacerbation via renal Na+/water retention and prostaglandin-mediated vasoconstriction. Substitute with acetaminophen or topical NSAID."
    rationale_ja: "NSAID は腎 Na+/水貯留とプロスタグランジン阻害による血管収縮により心不全増悪を惹起。アセトアミノフェンまたは外用 NSAID に切替。"
    source: "AHA/ACC/HFSA 2022 Heart Failure Guideline; JCS 2021 急性・慢性心不全診療ガイドライン"

  - id: nsaid-in-cirrhosis
    drug_class: nsaid
    disease_predicate: {icd_prefix: ["K74", "K70.3"]}
    severity: contraindicated
    substitution_hint: pain_management
    rationale_en: "NSAIDs risk hepatorenal syndrome, variceal bleeding, and acute kidney injury in cirrhosis. Acetaminophen at reduced dose (≤2 g/day) is safer; opioids with caution."
    rationale_ja: "NSAID は肝硬変で肝腎症候群・食道静脈瘤出血・急性腎障害リスクを増悪。アセトアミノフェン減量 (2 g/日以下) が安全、オピオイドは慎重投与。"
    source: "AASLD Practice Guidance 2021 (cirrhosis complications); 日本消化器病学会 肝硬変診療ガイドライン 2020"

  - id: nsaid-in-ckd-stage-4-5
    drug_class: nsaid
    disease_predicate: {icd_prefix: ["N18.4", "N18.5", "N18.6"]}
    severity: contraindicated
    substitution_hint: pain_management
    rationale_en: "NSAIDs cause afferent arteriolar vasoconstriction and are contraindicated at eGFR < 30 mL/min/1.73m2 (KDIGO CKD stage 4-5). Substitute with acetaminophen or topical NSAID; opioids with dose reduction."
    rationale_ja: "NSAID は腎輸入細動脈収縮により eGFR < 30 (CKD ステージ 4-5) では禁忌。アセトアミノフェンまたは外用 NSAID に切替、オピオイドは減量投与。"
    source: "KDIGO 2024 CKD Guideline; 日本腎臓学会 CKD 診療ガイドライン 2023"

  # Issue #2282: the activator stores chronic CKD as the base code N18 with
  # the stage next to it (see the metformin rule below), so the code-based
  # rule above never fired for simulated patients. This twin matches the
  # stage; the rule above still covers an explicitly staged code.
  - id: nsaid-in-ckd-stage-4-5-by-stage
    drug_class: nsaid
    disease_predicate:
      icd_prefix: ["N18"]
      stage_in: ["CKD G4", "CKD G5"]
    severity: contraindicated
    substitution_hint: pain_management
    rationale_en: "NSAIDs cause afferent arteriolar vasoconstriction and are contraindicated at eGFR < 30 mL/min/1.73m2 (KDIGO CKD stage 4-5). Substitute with acetaminophen or topical NSAID; opioids with dose reduction."
    rationale_ja: "NSAID は腎輸入細動脈収縮により eGFR < 30 (CKD ステージ 4-5) では禁忌。アセトアミノフェンまたは外用 NSAID に切替、オピオイドは減量投与。"
    source: "KDIGO 2024 CKD Guideline; 日本腎臓学会 CKD 診療ガイドライン 2023"

  # Issue #1769 — Metformin at advanced CKD. The predicate uses the
  # stage_in field (introduced in this PR) because the simulator carries
  # CKD severity in the chronic condition's ``stage`` string
  # ("CKD G3b" / "G4" / "G5"), not in the ICD code subcode. The N18
  # chronic row is often stored as the base code with the stage next to
  # it, so prefix-only matching against ``N18.4/5/6`` would miss these
  # patients. FDA labelling contraindicates Metformin at eGFR < 30
  # (G4-G5) and advises caution / dose-reduce at eGFR 30-45 (G3b);
  # KDIGO 2024 preferred strategy at G3b-G5 is to discontinue and
  # substitute (DPP-4 like linagliptin, basal insulin, repaglinide).
  - id: metformin-in-ckd-stage-3b-5
    drug_class: biguanide
    disease_predicate:
      icd_prefix: ["N18"]
      stage_in: ["CKD G3b", "CKD G4", "CKD G5"]
    severity: contraindicated
    substitution_hint: null
    rationale_en: "Metformin is contraindicated at eGFR < 30 (CKD stage 4-5) per the FDA label (lactic acidosis risk) and discouraged at CKD stage 3b (eGFR 30-44); KDIGO 2024 preferred strategy is to substitute with a renal-safe DM agent (DPP-4 inhibitor like linagliptin, basal insulin, or repaglinide)."
    rationale_ja: "メトホルミンは eGFR < 30 (CKD ステージ 4-5) で禁忌 (FDA 添付文書、乳酸アシドーシスリスク)。eGFR 30-44 (CKD ステージ 3b) でも推奨されない (KDIGO 2024)。腎機能障害時は DPP-4 阻害薬 (リナグリプチン等)・基礎インスリン・レパグリニドへの切替を推奨。"
    source: "FDA Metformin label (contraindication at eGFR < 30); KDIGO 2024 Diabetes Management in CKD; 日本糖尿病学会 糖尿病診療ガイドライン 2024"
