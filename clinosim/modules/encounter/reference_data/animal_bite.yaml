# Animal Bite — ED visit protocol
# Wound management, infection prevention, tetanus assessment.

metadata:
  kind: protocol
  name: animal_bite
  source: clinosim

condition_id: animal_bite
icd10_code: "W54.0XXA"
chief_complaint:
  en: "Dog bite to hand/leg, wound requiring treatment"
  ja: "犬咬傷（手/下肢）"
encounter_type: emergency
department: emergency_medicine
disposition: discharge_home

severity_distribution:
  mild: 0.40
  moderate: 0.45
  severe: 0.15    # deep puncture, tendon/nerve concern

ed_stay_hours:
  mild: {mean: 1.5, sd: 0.5}
  moderate: {mean: 2.5, sd: 1}
  severe: {mean: 4, sd: 1.5}

# Acute physiological signature (AD-57): a fresh bite is a local wound (no systemic
# response); deeper/infected presentations add modest inflammation.
initial_state_impact:
  mild: {pain_level: 0.3}
  moderate: {inflammation_level: 0.08, pain_level: 0.4}
  severe: {inflammation_level: 0.18, pain_level: 0.55}

workup:
  vitals: true
  labs:
    - {test: "WBC", probability: 0.2}

treatment:
  - {name: "Wound irrigation with normal saline", probability: 0.95, route: "topical", intent: "infection prevention"}
  - {name: "Tetanus toxoid 0.5mL", probability: 0.5, route: "IM", intent: "tetanus prophylaxis"}
  - {name: "Amoxicillin/clavulanate 875/125mg", probability: 0.7, route: "PO", intent: "prophylactic antibiotic"}
  - {name: "Lidocaine 1% local", probability: 0.6, route: "infiltration", intent: "local anesthesia for wound care"}

discharge_instructions:
  - {en: "Wound irrigated and cleaned; no signs of deep structure injury", ja: "創は洗浄済み、深部組織損傷の所見なし"}
  - {en: "Complete antibiotic course as prescribed", ja: "処方された抗菌薬を最後まで内服"}
  - {en: "Keep wound clean and dry; change dressing daily", ja: "創部を清潔・乾燥に保ち、ガーゼは毎日交換"}
  - {en: "Return if increasing redness, swelling, warmth, drainage, or fever", ja: "発赤・腫脹・熱感・排膿の増強、発熱があれば再受診"}
  - {en: "Report bite to local animal control", ja: "咬傷を保健所に届け出る"}
follow_up: {en: "wound check with primary care physician in 2 days", ja: "2日後にかかりつけ医で創部を確認"}

discharge_prescriptions:
  - {drug: "Amoxicillin/clavulanate 875/125mg", route: "PO", frequency: "BID", duration_days: 7, probability: 0.7}
  - {drug: "Ibuprofen 400mg", locale_name: {jp: "Ibuprofen 200mg"}, locale_frequency: {jp: "tid PRN"}, route: "PO", frequency: "Q6H PRN", duration_days: 5, probability: 0.5}

incidence_modifier: 1.0
probability: 0.03
age_distribution: all_ages
sex_ratio_female: 0.45
seasonal: {1: 0.8, 2: 0.8, 3: 0.9, 4: 1.0, 5: 1.1, 6: 1.2, 7: 1.3, 8: 1.3, 9: 1.1, 10: 1.0, 11: 0.9, 12: 0.8}

narrative:
  onset: {unit: hours, range: [1, 6]}
  ed_note_template:
    chief_complaint:
      en: '{chief_complaint_en} complaint'
      ja: '{chief_complaint_ja}の訴え'
    hpi:
      en: "Bitten by a dog {onset_en}, with a wound to the hand or leg. Animal ownership, rabies vaccination status of the dog, and tetanus history reviewed."
      ja: "{onset_ja}に犬に咬まれ、手または下肢に創を受傷。飼い主の有無、犬の狂犬病予防接種歴、破傷風予防接種歴を確認。"
    physical_exam:
      en:
        general: 'Alert and oriented, {appearance_en}'
      ja:
        general: '意識清明、{appearance_ja}'
    ed_workup_summary:
      en: '{lab_summary_en}, {imaging_summary_en}'
      ja: '{lab_summary_ja}、{imaging_summary_ja}'
    disposition:
      en: '{disposition_display_en}'
      ja: '{disposition_display_ja}'
  ed_triage_template:
    common_triage_levels:
    - '3'
    - '4'
