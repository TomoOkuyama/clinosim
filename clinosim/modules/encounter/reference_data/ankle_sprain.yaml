# Ankle Sprain — ED visit protocol
# Common injury. X-ray to rule out fracture, RICE, discharge.

metadata:
  kind: protocol
  name: ankle_sprain
  source: clinosim

condition_id: ankle_sprain
icd10_code: "S93.40"
chief_complaint:
  en: "Ankle injury after fall, pain, swelling"
  ja: "足関節捻挫（転倒後）"
encounter_type: emergency
min_age: 5  # Issue #2174: presentation not drawn for younger children
department: emergency_medicine
disposition: discharge_home

severity_distribution:
  mild: 0.50    # Grade I, no imaging needed
  moderate: 0.40 # Grade II, X-ray, short splint
  severe: 0.10   # Grade III, X-ray, posterior splint, orthopedic follow-up

ed_stay_hours:
  mild: {mean: 1.5, sd: 0.5}
  moderate: {mean: 2.5, sd: 0.8}
  severe: {mean: 3.5, sd: 1}

initial_state_impact:
  mild: {pain_level: 0.4}
  moderate: {pain_level: 0.55}
  severe: {pain_level: 0.65}

workup:
  vitals: true
  labs: []  # no labs for isolated ankle sprain
  imaging:
    - {test: "Ankle_Xray", probability: 0.7}  # Ottawa ankle rules

treatment:
  - {name: "Ice pack application", probability: 0.9, route: "topical"}
  - {name: "Elastic bandage wrap", probability: 0.8, route: "topical"}
  - {name: "Posterior splint", probability: 0.15, route: "topical", intent: "immobilization for severe"}
  - {name: "Acetaminophen 500mg", probability: 0.5, route: "PO"}
  - {name: "Ibuprofen 400mg", locale_name: {jp: "Ibuprofen 200mg"}, probability: 0.6, route: "PO", intent: "anti-inflammatory"}

discharge_instructions:
  - {en: "RICE: Rest, Ice, Compression, Elevation", ja: "RICE（安静・冷却・圧迫・挙上）"}
  - {en: "Weight bearing as tolerated with crutches if needed", ja: "痛みに応じて荷重、必要時は松葉杖を使用"}
  - {en: "Return if unable to bear weight or significant swelling increase", ja: "荷重不能、腫脹の著明な増強があれば再受診"}
follow_up: {en: "orthopedics in 1 week if not improving", ja: "改善がなければ1週間後に整形外科を受診"}

discharge_prescriptions:
  - {drug: "Ibuprofen 400mg", locale_name: {jp: "Ibuprofen 200mg"}, route: "PO", frequency: "tid", duration_days: 7, probability: 0.7}
  - {drug: "Acetaminophen 500mg", route: "PO", frequency: "tid PRN", duration_days: 7, probability: 0.5}

incidence_modifier: 1.0
probability: 0.10  # relative frequency among ED visits
age_distribution: all
sex_ratio_female: 1.1
seasonal: {1: 1.1, 2: 1.0, 3: 0.9, 4: 1.0, 5: 1.1, 6: 1.2, 7: 1.2, 8: 1.1, 9: 1.1, 10: 1.0, 11: 1.0, 12: 1.1}

narrative:
  onset: {unit: hours, range: [1, 12]}
  ed_note_template:
    chief_complaint:
      en: Ankle sprain (after fall)
      ja: 足関節捻挫（転倒後）
    hpi:
      en: "Twisted the ankle in a fall {onset_en}. Pain and swelling began immediately, with variable ability to bear weight. No open wound or numbness."
      ja: "{onset_ja}に転倒し足関節を捻挫。直後より疼痛・腫脹が出現し、荷重は困難〜可能。開放創・しびれなし。"
    physical_exam:
      en:
        general: 'Alert and oriented, {appearance_en}'
        cardiovascular: Heart rate normal
        respiratory: Respiratory rate normal
        abdominal: 'Abdomen: assessment not indicated'
        musculoskeletal: 'Right/left ankle: swelling (+), ecchymosis ({ecchymosis_en}), tenderness over anterior talofibular ligament (+), malleolar/calcaneal tenderness ({bone_pain_en}). Limited ROM. Neurovascularly intact.'
        neurological: Distal neurovascular status intact
      ja:
        general: '意識清明、{appearance_ja}'
        cardiovascular: 心拍数正常
        respiratory: 呼吸数正常
        abdominal: 腹部：評価不要
        musculoskeletal: 右/左足関節：腫脹（+）、皮下出血（{ecchymosis_ja}）、前距腓靭帯部圧痛（+）、踵骨・内外くるぶし圧痛（{bone_pain_ja}）。ROM制限あり。神経血管正常。
        neurological: 遠位神経・血管正常
    ed_workup_summary:
      en: 'Ankle X-ray ({xray_views_en}): {xray_result_en}. No fracture identified / fracture confirmed.'
      ja: 足関節X線（{xray_views_ja}）：{xray_result_ja}。骨折なし/骨折確認。
    disposition:
      en: "{disposition_display_en}"
      ja: "{disposition_display_ja}"
  ed_triage_template:
    common_triage_levels:
    - '4'
    - '5'
