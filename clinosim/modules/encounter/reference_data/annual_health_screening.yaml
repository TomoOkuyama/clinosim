# Annual Health Screening — Outpatient visit protocol
# Routine annual checkup. Japan: 特定健診 (Tokutei Kenshin). US: Annual physical.

metadata:
  kind: protocol
  name: annual_health_screening
  source: clinosim

condition_id: annual_health_screening
icd10_code: "Z00.00"
chief_complaint:
  en: "Annual health screening / preventive checkup"
  ja: "定期健康診断（特定健診）"
encounter_type: outpatient
department: primary_care
disposition: discharge_home

severity_distribution:
  mild: 1.0

ed_stay_hours:
  mild: {mean: 0.5, sd: 0.2}  # 30 min visit

workup:
  vitals: true
  labs:
    - {test: "WBC", probability: 0.9}
    - {test: "Hb", probability: 0.9}
    - {test: "Plt", probability: 0.8}
    - {test: "Glucose", probability: 0.9}
    - {test: "HbA1c", probability: 0.5}
    - {test: "Creatinine", probability: 0.9}
    - {test: "AST", probability: 0.9}
    - {test: "ALT", probability: 0.9}
    - {test: "GGT", probability: 0.7}
    - {test: "T_Bil", probability: 0.6}
    - {test: "Albumin", probability: 0.7}
    - {test: "Na", probability: 0.5}
    - {test: "K", probability: 0.5}
    - {test: "CRP", probability: 0.5}
  # JP periodic health examinations (労働安全衛生規則 第44条) include a chest
  # X-ray and an ECG; USPSTF recommends against screening ECGs in low-risk
  # adults and a routine chest X-ray is not part of a US annual exam.
  imaging:
    - {test: "Chest_Xray", probability: 0.8, countries: [JP]}
    - {test: "ECG", probability: 0.6, countries: [JP]}

# Tests added for the persons they are recommended for (Issue #2870).
# US: USPSTF 2022 statin primary prevention (lipid panel for the CVD risk
# estimate, adults 40-75) and USPSTF 2021 prediabetes / type 2 diabetes
# screening (adults 35-70 with overweight or obesity, BMI >= 25).
# JP: 特定健康診査 (ages 40-74) always measures lipids and HbA1c.
screening_labs:
  - {test: "Lipid", age: "40-75", countries: [US]}
  - {test: "HbA1c", age: "35-70", min_bmi: 25, countries: [US]}
  - {test: "Glucose", age: "35-70", min_bmi: 25, countries: [US]}
  - {test: "Lipid", age: "40-74", countries: [JP]}
  - {test: "HbA1c", age: "40-74", countries: [JP]}

treatment: []

discharge_instructions:
  - "Results will be mailed within 2 weeks"
  - "Follow up if any abnormalities detected"

discharge_prescriptions: []

incidence_modifier: 1.0
age_distribution: adults_40plus
sex_ratio_female: 1.1
seasonal: {1: 0.5, 2: 0.6, 3: 0.7, 4: 1.0, 5: 1.2, 6: 1.3, 7: 1.2, 8: 1.1, 9: 1.1, 10: 1.0, 11: 0.8, 12: 0.5}

narrative:
  outpatient_soap_template:
    subjective:
      en: '{chief_complaint_en} complaint, onset {onset_days} day(s) ago'
      ja: '{chief_complaint_ja}の訴え、{onset_days}日前より'
    objective:
      en: Vital signs stable; physical exam unremarkable
      ja: バイタル安定、身体所見特記事項なし
    assessment:
      en: '{primary_dx_display_en}'
      ja: '{primary_dx_display_ja}'
    plan:
      en: '{workup_summary_en}, {follow_up_en}'
      ja: '{workup_summary_ja}、{follow_up_ja}'
