# Anxiety / Panic Attack — ED visit protocol
# Often presents mimicking cardiac or respiratory emergency.

metadata:
  kind: protocol
  name: anxiety_panic_attack
  source: clinosim

condition_id: anxiety_panic_attack
icd10_code: "F41.0"
chief_complaint:
  en: "Palpitations, dyspnea, chest tightness, anxiety"
  ja: "動悸・呼吸困難・胸部圧迫感・不安"
encounter_type: emergency
department: emergency_medicine
disposition: discharge_home
# Issue #1760: adult panic phenomenology. Pediatric chest-tightness /
# anxiety presentations route to a different diagnostic pathway
# (growing pains, foreign body, viral myocarditis workup, …) and
# F41.0 Panic disorder is clinically rare in children. Age-gated at
# the sampler per the same RNG-neutral pattern as chest_pain_noncardiac.
min_age: 15

severity_distribution:
  mild: 0.40
  moderate: 0.50
  severe: 0.10

ed_stay_hours:
  mild: {mean: 2, sd: 0.5}
  moderate: {mean: 3, sd: 1}
  severe: {mean: 5, sd: 1.5}

# Acute physiological signature (AD-57): hyperventilation → respiratory alkalosis
# (low pCO2, high pH) — the classic panic-attack blood gas. No inflammation.
acid_base_type: respiratory
initial_state_impact:
  mild: {ph_status: 0.08, sympathetic_activation: 0.3}
  moderate: {ph_status: 0.15, sympathetic_activation: 0.45}
  severe: {ph_status: 0.22, sympathetic_activation: 0.6}

workup:
  vitals: true
  labs:
    - {test: "Troponin", probability: 0.4}
    - {test: "Glucose", probability: 0.3}
    - {test: "TSH", probability: 0.2}
  imaging:
    - {test: "ECG", probability: 0.7}
    - {test: "Chest_Xray", probability: 0.3}

treatment:
  - {name: "Lorazepam 0.5mg", probability: 0.4, route: "PO", intent: "anxiolytic"}
  - {name: "Reassurance and breathing exercises", probability: 0.9, route: "non-pharmacologic"}
  - {name: "IV normal saline 500mL", probability: 0.2, route: "IV"}

discharge_instructions:
  - {en: "Cardiac workup negative; symptoms consistent with panic attack", ja: "心精査で異常なく、パニック発作として矛盾しない"}
  - {en: "Consider cognitive behavioral therapy referral", ja: "認知行動療法の紹介を検討"}
  - {en: "Return if chest pain recurs with exertion or new symptoms", ja: "労作時の胸痛再発や新たな症状があれば再受診"}
follow_up: {en: "primary care physician for anxiety management", ja: "不安症状の管理のためかかりつけ医を受診"}

discharge_prescriptions:
  - {drug: "Hydroxyzine 25mg", route: "PO", frequency: "q8h PRN", duration_days: 7, probability: 0.3}

incidence_modifier: 1.0
probability: 0.05  # relative frequency among ED visits
age_distribution: adults
sex_ratio_female: 1.5
seasonal: {1: 1.0, 2: 1.0, 3: 1.0, 4: 1.0, 5: 1.0, 6: 1.0, 7: 1.0, 8: 1.0, 9: 1.0, 10: 1.0, 11: 1.0, 12: 1.0}

narrative:
  onset: {unit: hours, range: [1, 3]}
  ed_note_template:
    chief_complaint:
      en: '{chief_complaint_en} complaint'
      ja: '{chief_complaint_ja}の訴え'
    hpi:
      en: "Sudden palpitations, shortness of breath, chest tightness, and intense fear began {onset_en} at rest and peaked within minutes. No exertional chest pain or syncope."
      ja: "{onset_ja}より安静時に突然の動悸・呼吸困難・胸部圧迫感と強い不安が出現し、数分でピークに達した。労作時胸痛・失神なし。"
    physical_exam:
      en:
        general: 'Alert and oriented, {appearance_en}'
      ja:
        general: '意識清明、{appearance_ja}'
    ed_workup_summary:
      en: '{lab_summary_en}, {imaging_summary_en}'
      ja: '{lab_summary_ja}、{imaging_summary_ja}'
    disposition:
      en: '{disposition_display_en}'
      ja: '{disposition_display_ja}'
  ed_triage_template:
    common_triage_levels:
    - '3'
    - '4'
