# Mild Asthma Attack — ED visit protocol
# Bronchospasm management. Nebulized bronchodilator and steroid.

metadata:
  kind: protocol
  name: asthma_attack_mild
  source: clinosim

condition_id: asthma_attack_mild
icd10_code: "J45.901"
chief_complaint:
  en: "Wheezing, dyspnea, chest tightness"
  ja: "喘鳴・呼吸困難・胸部絞扼感"
encounter_type: emergency
department: emergency_medicine
disposition: discharge_home

severity_distribution:
  mild: 0.50
  moderate: 0.40
  severe: 0.10    # incomplete response, extended observation

ed_stay_hours:
  mild: {mean: 2, sd: 0.5}
  moderate: {mean: 3, sd: 1}
  severe: {mean: 5, sd: 1.5}

# Acute physiological signature (AD-57): a mild attack drives tachypnea → respiratory
# alkalosis (low pCO2, high pH). The respiratory axis routes the disturbance to pCO2.
acid_base_type: respiratory
initial_state_impact:
  mild: {ph_status: 0.04, oxygenation_impairment: 0.12}
  moderate: {ph_status: 0.08, inflammation_level: 0.03, oxygenation_impairment: 0.2}
  severe: {ph_status: 0.12, inflammation_level: 0.05, oxygenation_impairment: 0.3}

workup:
  vitals: true
  labs: []
  imaging: []

treatment:
  - {name: "Nebulized salbutamol 2.5mg", probability: 0.95, route: "INH", intent: "bronchodilation"}
  - {name: "Ipratropium bromide 0.5mg nebulized", probability: 0.4, route: "INH", intent: "bronchodilation"}
  # Issue #1323: locale-aware corticosteroid emit. JP uses Prednisolone,
  # US uses Prednisone (the prodrug) — sim previously emitted the JP name
  # on both locales, and downstream chronic/discharge paths emitted the
  # US-form separately, producing duplicate-steroid MedicationAdministration
  # pairs on US asthma outpatient encounters.
  - name: "Prednisolone 40mg"
    locale_name:
      jp: "Prednisolone 40mg"
      us: "Prednisone 40mg"
    probability: 0.7
    route: "PO"
    intent: "anti-inflammatory"

discharge_instructions:
  - {en: "Good response to bronchodilator therapy", ja: "気管支拡張薬に良好に反応"}
  - {en: "Continue rescue inhaler as needed", ja: "発作時は発作治療薬の吸入を継続"}
  - {en: "Complete steroid course as prescribed", ja: "処方されたステロイドを最後まで内服"}
  - {en: "Return if worsening dyspnea, inability to speak in full sentences, or no relief from inhaler", ja: "呼吸困難の増悪、会話困難、吸入で改善しない場合は再受診"}
follow_up: {en: "primary care physician or pulmonologist within 1 week", ja: "1週間以内にかかりつけ医または呼吸器内科を受診"}

discharge_prescriptions:
  - {drug: "Prednisone 40mg", locale_name: {jp: "Prednisolone 30mg"}, route: "PO", frequency: "daily", duration_days: 5, probability: 0.7}
  - {drug: "Albuterol MDI", route: "INH", frequency: "Q4-6H PRN", duration_days: 30, probability: 0.5}

incidence_modifier: 1.0
# Exacerbation of a chronic disease: only drawn for residents with an asthma
# diagnosis. The weight is divided by the asthma share at runtime; 0.035
# puts asthma at ~1.1-1.3% of non-admitted ED visits (US p=5000 2-year run
# at 0.025 gave 0.82%; CDC NHAMCS: 1.32% of ED visits 2010-2015, ~1.2% of
# adult visits 2016-2019).
requires_chronic_prefix: ["J45"]
probability: 0.035
age_distribution: adults
sex_ratio_female: 0.55
seasonal: {1: 1.3, 2: 1.2, 3: 1.0, 4: 0.9, 5: 0.8, 6: 0.8, 7: 0.8, 8: 0.9, 9: 1.0, 10: 1.1, 11: 1.2, 12: 1.3}

narrative:
  onset: {unit: days, range: [1, 2]}
  ed_note_template:
    chief_complaint:
      en: '{chief_complaint_en} complaint'
      ja: '{chief_complaint_ja}の訴え'
    hpi:
      en: "Wheezing, shortness of breath, and chest tightness began {onset_en}, with incomplete relief from the rescue inhaler. Known asthma."
      ja: "{onset_ja}より喘鳴・呼吸困難・胸部絞扼感が出現し、発作治療薬の吸入で改善不十分。気管支喘息の既往あり。"
    physical_exam:
      en:
        general: 'Alert and oriented, {appearance_en}'
      ja:
        general: '意識清明、{appearance_ja}'
    ed_workup_summary:
      en: '{lab_summary_en}, {imaging_summary_en}'
      ja: '{lab_summary_ja}、{imaging_summary_ja}'
    disposition:
      en: '{disposition_display_en}'
      ja: '{disposition_display_ja}'
  ed_triage_template:
    common_triage_levels:
    - '3'
    - '4'
