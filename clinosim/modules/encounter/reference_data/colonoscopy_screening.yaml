# Colonoscopy Screening — Outpatient visit protocol
# Screening colonoscopy for colorectal cancer prevention and polyp detection.

metadata:
  kind: protocol
  name: colonoscopy_screening
  source: clinosim

condition_id: colonoscopy_screening
icd10_code: "Z12.11"
chief_complaint:
  en: "Screening colonoscopy for colorectal cancer"
  ja: "大腸癌スクリーニング大腸内視鏡"
encounter_type: outpatient
department: gastroenterology
disposition: discharge_home

severity_distribution:
  mild: 1.0

ed_stay_hours:
  mild: {mean: 2.0, sd: 0.5}  # 2 hours including recovery

workup:
  vitals: true
  labs:
    - {test: "WBC", probability: 0.5}
    - {test: "Hb", probability: 0.8}
    - {test: "Plt", probability: 0.5}
  imaging: []

# Moderate sedation for the procedure. ``drug_id`` + ``dose`` make the
# scheduled visit order and administer the drug (Issue #2870).
treatment:
  - {name: "Midazolam", drug_id: midazolam, dose: "2 mg", route: "IV", probability: 0.95}
  - {name: "Fentanyl", drug_id: fentanyl, dose: "50 mcg", route: "IV", probability: 0.95}

# Performed at every scheduled visit (Issue #2870). CPT 45378 (diagnostic
# colonoscopy); SNOMED 73761001 Colonoscopy (tx.fhir.org $lookup
# 2026-11-08). No JP 診療行為 code until one is registered in k-codes.yaml
# against the 支払基金 master; JP output codes it with CPT + SNOMED.
procedures:
  - code: "45378"
    snomed: "73761001"
    name: {en: "Colonoscopy", ja: "大腸内視鏡検査"}
    duration_minutes: 30

# USPSTF 2021: colorectal cancer screening at 45-75; after a normal
# colonoscopy the next one is due in 10 years. Polyp surveillance (shorter
# intervals after an adenoma) is not modelled. ``annual_uptake`` is the
# probability of attending in a year the colonoscopy is due (~65% of
# eligible US adults are up to date with colonoscopy screening; NHIS 2021).
screening_schedule:
  eligible_age: "45-75"
  interval_years: 10
  annual_uptake: 0.65

discharge_instructions:
  - "No driving for 24 hours after sedation"
  - "Clear liquids initially, advance diet as tolerated"
  - "If polyps removed: avoid aspirin/NSAIDs for 1 week"
  - "Return to ED for significant rectal bleeding, fever, or abdominal pain"
  - "Pathology results in 1-2 weeks if biopsy performed"

discharge_prescriptions: []

incidence_modifier: 1.0
age_distribution: adults_50plus
sex_ratio_female: 1.0
seasonal: {1: 1.0, 2: 1.0, 3: 1.1, 4: 1.1, 5: 1.0, 6: 1.0, 7: 0.9, 8: 0.9, 9: 1.0, 10: 1.0, 11: 1.0, 12: 0.9}

narrative:
  outpatient_soap_template:
    subjective:
      en: '{chief_complaint_en} complaint, onset {onset_days} day(s) ago'
      ja: '{chief_complaint_ja}の訴え、{onset_days}日前より'
    objective:
      en: Vital signs stable; physical exam unremarkable
      ja: バイタル安定、身体所見特記事項なし
    assessment:
      en: '{primary_dx_display_en}'
      ja: '{primary_dx_display_ja}'
    plan:
      en: '{workup_summary_en}, {follow_up_en}'
      ja: '{workup_summary_ja}、{follow_up_ja}'
