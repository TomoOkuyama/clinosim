# Elderly Fall — ED visit protocol
# Fall evaluation. Rule out fracture, head injury, and underlying cause.

metadata:
  kind: protocol
  name: elderly_fall
  source: clinosim

condition_id: elderly_fall
icd10_code: "W19.XXXA"
chief_complaint:
  en: "Fall at home, no loss of consciousness"
  ja: "自宅での転倒（意識消失なし）"
encounter_type: emergency
min_age: 65  # Issue #2174: presentation not drawn for younger children
department: emergency_medicine
disposition: discharge_home

severity_distribution:
  mild: 0.35
  moderate: 0.45
  severe: 0.20    # suspected fracture or head injury

ed_stay_hours:
  mild: {mean: 3, sd: 1}
  moderate: {mean: 4, sd: 1.5}
  severe: {mean: 6, sd: 2}

initial_state_impact:
  mild: {pain_level: 0.3}
  moderate: {pain_level: 0.45}
  severe: {pain_level: 0.6}

workup:
  vitals: true
  labs:
    - {test: "WBC", probability: 0.3}
    - {test: "Creatinine", probability: 0.3}
  imaging:
    - {test: "Hip_Xray_AP_Lateral", probability: 0.7}  # Issue #2699: the hip, the injury an older adult's fall most often needs imaged
    - {test: "CT_Head", probability: 0.3}

treatment:
  - {name: "Acetaminophen 1000mg", probability: 0.6, route: "PO", intent: "pain management"}
  - {name: "IV normal saline", probability: 0.3, route: "IV", intent: "hydration"}
  - {name: "Ice pack to affected area", probability: 0.4, route: "topical", intent: "swelling reduction"}

discharge_instructions:
  - {en: "No fracture identified on imaging; soft tissue injury", ja: "画像検査で骨折なし、軟部組織損傷"}
  - {en: "Return if worsening pain, inability to bear weight, confusion, or persistent headache", ja: "疼痛の増悪、荷重不能、意識の混乱、持続する頭痛があれば再受診"}
  - {en: "Home safety assessment recommended; remove tripping hazards", ja: "住環境を見直し、つまずきの原因を取り除く"}
  - {en: "Review medications that may contribute to falls (sedatives, antihypertensives)", ja: "転倒の一因となりうる薬剤（鎮静薬・降圧薬）を見直す"}
follow_up: {en: "primary care physician within 1 week", ja: "1週間以内にかかりつけ医を受診"}

discharge_prescriptions:
  - {drug: "Acetaminophen 500mg", route: "PO", frequency: "Q6H PRN", duration_days: 7, probability: 0.5}

scenarios:
  no_injury:
    probability: 0.40
    description: "Normal exam, no imaging needed, fall prevention counseling"
    additional_labs: []
    additional_imaging: []
    additional_treatment: []
    duration_modifier: 0.5
    discharge_note: "No acute injury, fall prevention counseling"
  soft_tissue:
    probability: 0.35
    description: "Bruising and pain, X-ray negative for fracture"
    additional_labs: []
    additional_imaging: []
    additional_treatment: []
    duration_modifier: 1.0
    discharge_note: "Contusion, no fracture. RICE"
  occult_fracture:
    probability: 0.25
    description: "X-ray shows fracture or CT needed for further evaluation"
    additional_labs: []
    additional_imaging: [CT_affected_area]
    additional_treatment: [Orthopedic consult, Splint]
    duration_modifier: 1.8
    discharge_note: "Fracture identified, orthopedic follow-up"

incidence_modifier: 1.0
probability: 0.06
age_distribution: elderly  # predominantly 65+
sex_ratio_female: 0.6
seasonal: {1: 1.1, 2: 1.1, 3: 1.0, 4: 1.0, 5: 1.0, 6: 1.0, 7: 1.0, 8: 1.0, 9: 1.0, 10: 1.0, 11: 1.1, 12: 1.1}

narrative:
  onset: {unit: hours, range: [1, 12]}
  ed_note_template:
    chief_complaint:
      en: '{chief_complaint_en} complaint'
      ja: '{chief_complaint_ja}の訴え'
    hpi:
      en: "Fell at home {onset_en} without loss of consciousness. Mechanism, head strike, and anticoagulant use reviewed."
      ja: "{onset_ja}に自宅で転倒、意識消失なし。受傷機転・頭部打撲の有無・抗凝固薬内服を確認。"
    physical_exam:
      en:
        general: 'Alert and oriented, {appearance_en}'
      ja:
        general: '意識清明、{appearance_ja}'
    ed_workup_summary:
      en: '{lab_summary_en}, {imaging_summary_en}'
      ja: '{lab_summary_ja}、{imaging_summary_ja}'
    disposition:
      en: '{disposition_display_en}'
      ja: '{disposition_display_ja}'
  ed_triage_template:
    common_triage_levels:
    - '3'
    - '4'
