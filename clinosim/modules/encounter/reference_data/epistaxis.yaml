# Epistaxis — ED visit protocol
# Nosebleed management. Assess coagulopathy, nasal packing if needed.

metadata:
  kind: protocol
  name: epistaxis
  source: clinosim

condition_id: epistaxis
icd10_code: "R04.0"
chief_complaint:
  en: "Nosebleed, unable to stop with pressure"
  ja: "鼻出血（圧迫止血困難）"
encounter_type: emergency
min_age: 2  # Issue #2174: presentation not drawn for younger children
department: emergency_medicine
disposition: discharge_home

severity_distribution:
  mild: 0.40
  moderate: 0.45
  severe: 0.15    # posterior bleed, requires packing or ENT consult

ed_stay_hours:
  mild: {mean: 1.5, sd: 0.5}
  moderate: {mean: 3, sd: 1}
  severe: {mean: 5, sd: 1.5}

workup:
  vitals: true
  labs:
    - {test: "PT_INR", probability: 0.5}
    - {test: "Hb", probability: 0.4}

# Issue #2136: drugs not marketed in Japan carry a JP alternative
# (locale_name) or are not given on JP (locale_exclude).
treatment:
  - {name: "Nasal packing (anterior)", probability: 0.5, route: "topical", intent: "hemostasis"}
  - {name: "Silver nitrate cauterization", probability: 0.3, route: "topical", intent: "hemostasis"}
  - {name: "Oxymetazoline nasal spray", locale_name: {jp: "Naphazoline nasal drops", us: "Oxymetazoline nasal spray"}, probability: 0.4, route: "nasal", intent: "vasoconstriction"}

discharge_instructions:
  - {en: "Bleeding controlled with packing/cauterization", ja: "タンポン挿入／焼灼で止血"}
  - {en: "Keep head elevated, avoid nose blowing for 48 hours", ja: "頭部を高くし、48時間は鼻をかまない"}
  - {en: "Return if bleeding recurs and cannot be controlled with 15 minutes of direct pressure", ja: "再出血し15分の圧迫で止まらなければ再受診"}
follow_up: {en: "ENT if episodes recur", ja: "繰り返す場合は耳鼻咽喉科を受診"}

discharge_prescriptions: []

incidence_modifier: 1.0
probability: 0.04
age_distribution: adults
sex_ratio_female: 0.45
seasonal: {1: 1.2, 2: 1.2, 3: 1.0, 4: 1.0, 5: 1.0, 6: 0.9, 7: 0.9, 8: 0.9, 9: 1.0, 10: 1.0, 11: 1.1, 12: 1.2}

narrative:
  onset: {unit: hours, range: [1, 3]}
  ed_note_template:
    chief_complaint:
      en: '{chief_complaint_en} complaint'
      ja: '{chief_complaint_ja}の訴え'
    hpi:
      en: "Nosebleed began {onset_en} and did not stop with direct pressure at home. Anticoagulant use and bleeding history reviewed."
      ja: "{onset_ja}より鼻出血が出現し、自宅での圧迫で止血しなかった。抗凝固薬内服・出血傾向を確認。"
    physical_exam:
      en:
        general: 'Alert and oriented, {appearance_en}'
      ja:
        general: '意識清明、{appearance_ja}'
    ed_workup_summary:
      en: '{lab_summary_en}, {imaging_summary_en}'
      ja: '{lab_summary_ja}、{imaging_summary_ja}'
    disposition:
      en: '{disposition_display_en}'
      ja: '{disposition_display_ja}'
  ed_triage_template:
    common_triage_levels:
    - '3'
    - '4'
