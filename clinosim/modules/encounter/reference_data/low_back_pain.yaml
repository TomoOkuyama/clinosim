# Low Back Pain — ED visit protocol
# Acute mechanical low back pain. Rule out red flags, symptomatic treatment, discharge.

metadata:
  kind: protocol
  name: low_back_pain
  source: clinosim

condition_id: low_back_pain
icd10_code: "M54.50"
chief_complaint:
  en: "Acute low back pain, onset after lifting"
  ja: "急性腰痛（挙上時発症）"
encounter_type: emergency
min_age: 16  # Issue #2174: presentation not drawn for younger children
department: emergency_medicine
disposition: discharge_home

severity_distribution:
  mild: 0.40     # muscle strain, no imaging
  moderate: 0.45  # significant pain, X-ray considered
  severe: 0.15    # concern for radiculopathy, advanced imaging considered

ed_stay_hours:
  mild: {mean: 2, sd: 0.5}
  moderate: {mean: 3, sd: 1}
  severe: {mean: 4, sd: 1.5}

initial_state_impact:
  mild: {pain_level: 0.45}
  moderate: {pain_level: 0.6}
  severe: {pain_level: 0.75}

workup:
  vitals: true
  labs:
    - {test: "WBC", probability: 0.15}  # if infection concern
    - {test: "ESR", probability: 0.1}   # if infection/inflammation concern
  imaging:
    - {test: "Lumbar_Xray", probability: 0.3}
    - {test: "MRI_Lumbar", probability: 0.05}  # red flags: saddle anesthesia, weakness, bladder dysfunction

# Issue #2134: ketorolac is not marketed in Japan; JP ED analgesia is IV
# acetaminophen (アセリオ).
# Issue #2136: other drugs not marketed in Japan carry a JP alternative
# (locale_name) or are not given on JP (locale_exclude).
treatment:
  - {name: "Ketorolac 30mg", locale_name: {jp: "Acetaminophen 1000mg", us: "Ketorolac 30mg"}, probability: 0.6, route: "IV", intent: "analgesic"}
  - {name: "Ibuprofen 600mg", probability: 0.4, route: "PO", intent: "anti-inflammatory"}
  - {name: "Cyclobenzaprine 10mg", locale_name: {jp: "Eperisone 50mg", us: "Cyclobenzaprine 10mg"}, probability: 0.4, route: "PO", intent: "muscle relaxant"}
  - {name: "Acetaminophen 1000mg", probability: 0.3, route: "PO", intent: "analgesic"}
  - {name: "Heat pack application", probability: 0.5, route: "topical", intent: "muscle relaxation"}

discharge_instructions:
  - {en: "Continue activity as tolerated; bed rest not recommended", ja: "痛みに応じて活動を続け、安静臥床は勧めない"}
  - {en: "Apply heat or ice for comfort", ja: "温罨法または冷罨法で疼痛を緩和"}
  - {en: "Expected improvement within 2-4 weeks", ja: "2〜4週間で改善する見込み"}
  - {en: "Return if leg weakness, numbness, difficulty urinating, or worsening pain", ja: "下肢の脱力・しびれ、排尿困難、疼痛の増悪があれば再受診"}
follow_up: {en: "physical therapy referral for strengthening", ja: "筋力強化のため理学療法へ紹介"}

discharge_prescriptions:
  - {drug: "Ibuprofen 600mg", route: "PO", frequency: "tid", duration_days: 10, probability: 0.7}
  - {drug: "Cyclobenzaprine 10mg", locale_name: {jp: "Eperisone 50mg"}, route: "PO", frequency: "tid PRN", duration_days: 7, probability: 0.5}
  - {drug: "Acetaminophen 500mg", route: "PO", frequency: "q6h PRN", duration_days: 10, probability: 0.4}

scenarios:
  musculoskeletal:
    probability: 0.60
    description: "No red flags, mechanical back pain, no imaging needed"
    additional_labs: []
    additional_imaging: []
    additional_treatment: []
    duration_modifier: 0.7
    discharge_note: "Mechanical back pain, PT referral"
  with_imaging:
    probability: 0.30
    description: "Older patient or concerning features, imaging obtained"
    additional_labs: []
    additional_imaging: [Lumbar_Xray]
    additional_treatment: []
    duration_modifier: 1.2
    discharge_note: "Degenerative changes, no acute pathology"
  red_flags:
    probability: 0.10
    description: "Neurological symptoms present, urgent advanced imaging"
    additional_labs: [CRP, ESR]
    additional_imaging: [Lumbar_Xray, MRI_lumbar]
    additional_treatment: []
    duration_modifier: 2.0
    discharge_note: "MRI pending, urgent neurosurgery referral"

incidence_modifier: 1.0
probability: 0.08  # relative frequency among ED visits
age_distribution: adults  # predominantly 25-65
sex_ratio_female: 0.9  # slightly more men
seasonal: {1: 1.0, 2: 1.0, 3: 1.0, 4: 1.0, 5: 1.1, 6: 1.0, 7: 1.0, 8: 1.0, 9: 1.0, 10: 1.0, 11: 1.0, 12: 1.0}

narrative:
  onset: {unit: days, range: [1, 3]}
  ed_note_template:
    chief_complaint:
      en: '{chief_complaint_en} complaint'
      ja: '{chief_complaint_ja}の訴え'
    hpi:
      en: "Acute low back pain began {onset_en} after lifting. No leg weakness, numbness, or urinary difficulty."
      ja: "{onset_ja}、物を持ち上げた際に急性腰痛が出現。下肢筋力低下・しびれ・排尿障害なし。"
    physical_exam:
      en:
        general: 'Alert and oriented, {appearance_en}'
      ja:
        general: '意識清明、{appearance_ja}'
    ed_workup_summary:
      en: '{lab_summary_en}, {imaging_summary_en}'
      ja: '{lab_summary_ja}、{imaging_summary_ja}'
    disposition:
      en: '{disposition_display_en}'
      ja: '{disposition_display_ja}'
  ed_triage_template:
    common_triage_levels:
    - '3'
    - '4'
