# Migraine — ED visit protocol
# Severe headache presentation. Rule out secondary causes, abortive therapy, discharge.

metadata:
  kind: protocol
  name: migraine
  source: clinosim

condition_id: migraine
icd10_code: "G43.909"
chief_complaint:
  en: "Severe headache, nausea, photophobia"
  ja: "激しい頭痛・嘔気・光過敏"
encounter_type: emergency
min_age: 6  # Issue #2174: presentation not drawn for younger children
department: emergency_medicine
disposition: discharge_home

severity_distribution:
  mild: 0.30     # responds quickly to medication
  moderate: 0.50  # requires IV therapy, observation
  severe: 0.20    # prolonged, refractory, needs imaging

ed_stay_hours:
  mild: {mean: 2, sd: 0.5}
  moderate: {mean: 3.5, sd: 1}
  severe: {mean: 5, sd: 1.5}

initial_state_impact:
  mild: {pain_level: 0.5}
  moderate: {pain_level: 0.65}
  severe: {pain_level: 0.8}

workup:
  vitals: true
  labs:
    - {test: "WBC", probability: 0.2}
    - {test: "CRP", probability: 0.15}
  imaging:
    - {test: "CT_Head", probability: 0.3}  # rule out SAH if worst headache, first episode, or atypical features

# Issue #2134: ketorolac is not marketed in Japan; JP ED analgesia is IV
# acetaminophen (アセリオ).
treatment:
  - {name: "Ketorolac 30mg", locale_name: {jp: "Acetaminophen 1000mg", us: "Ketorolac 30mg"}, probability: 0.7, route: "IV", intent: "analgesic"}
  - {name: "Metoclopramide 10mg", probability: 0.6, route: "IV", intent: "antiemetic/migraine adjunct"}
  - {name: "Ondansetron 4mg", probability: 0.3, route: "IV", intent: "antiemetic"}
  - {name: "IV normal saline 1000mL", probability: 0.5, route: "IV", intent: "rehydration"}
  - {name: "Diphenhydramine 25mg", probability: 0.3, route: "IV", intent: "adjunct/akathisia prevention"}
  - {name: "Dark room rest", probability: 0.8, route: "non-pharmacologic", intent: "photophobia relief"}

discharge_instructions:
  - {en: "Migraine aborted with IV therapy", ja: "点滴治療で頭痛発作は頓挫"}
  - {en: "Avoid known triggers (bright lights, certain foods, stress)", ja: "誘因（強い光、特定の食品、ストレス）を避ける"}
  - {en: "Return if headache recurs and is unresponsive to prescribed medication", ja: "頭痛が再発し処方薬が効かなければ再受診"}
  - {en: "Return immediately if sudden worst headache of life, neck stiffness, or fever", ja: "突然の人生最悪の頭痛、項部硬直、発熱があれば直ちに受診"}
follow_up: {en: "primary care physician or neurology for preventive therapy if frequent", ja: "頻回であれば予防治療のためかかりつけ医または脳神経内科を受診"}

discharge_prescriptions:
  - {drug: "Sumatriptan 50mg", route: "PO", frequency: "PRN (max 2/day)", duration_days: 30, probability: 0.6}
  - {drug: "Naproxen 500mg", route: "PO", frequency: "bid PRN", duration_days: 7, probability: 0.5}
  - {drug: "Ondansetron 4mg", route: "PO", frequency: "q8h PRN", duration_days: 5, probability: 0.3}

incidence_modifier: 1.0
probability: 0.08  # relative frequency among ED visits
age_distribution: adults  # predominantly 20-50
sex_ratio_female: 1.8  # much more common in women
seasonal: {1: 1.0, 2: 1.0, 3: 1.1, 4: 1.1, 5: 1.1, 6: 1.0, 7: 1.0, 8: 1.0, 9: 1.0, 10: 1.0, 11: 0.9, 12: 0.9}

narrative:
  onset: {unit: hours, range: [4, 24]}
  ed_note_template:
    chief_complaint:
      en: '{chief_complaint_en} complaint'
      ja: '{chief_complaint_ja}の訴え'
    hpi:
      en: "Severe throbbing headache with nausea and photophobia began {onset_en}, unrelieved by oral analgesics. No thunderclap onset, fever, or neck stiffness."
      ja: "{onset_ja}より拍動性の激しい頭痛が出現し、嘔気・光過敏を伴う。内服鎮痛薬で改善せず。雷鳴様の突然発症・発熱・項部硬直なし。"
    physical_exam:
      en:
        general: 'Alert and oriented, {appearance_en}'
      ja:
        general: '意識清明、{appearance_ja}'
    ed_workup_summary:
      en: '{lab_summary_en}, {imaging_summary_en}'
      ja: '{lab_summary_ja}、{imaging_summary_ja}'
    disposition:
      en: '{disposition_display_en}'
      ja: '{disposition_display_ja}'
  ed_triage_template:
    common_triage_levels:
    - '3'
    - '4'
