# Minor Burn — ED visit protocol
# Partial thickness burn management. Wound care and pain control.

metadata:
  kind: protocol
  name: minor_burn
  source: clinosim

condition_id: minor_burn
icd10_code: "T30.0"
chief_complaint:
  en: "Burn to hand/arm, partial thickness"
  ja: "手/腕の熱傷（部分層）"
encounter_type: emergency
department: emergency_medicine
disposition: discharge_home

severity_distribution:
  mild: 0.45
  moderate: 0.40
  severe: 0.15    # larger area or deeper burn concern

ed_stay_hours:
  mild: {mean: 1.5, sd: 0.5}
  moderate: {mean: 2.5, sd: 1}
  severe: {mean: 4, sd: 1.5}

# Acute physiological signature (AD-57): a small superficial burn is local; larger/deeper
# burns drive an inflammatory response and (severe) early fluid shift.
initial_state_impact:
  mild: {pain_level: 0.35}
  moderate: {inflammation_level: 0.08, pain_level: 0.5}
  severe: {inflammation_level: 0.15, volume_status: -0.08, pain_level: 0.65}

workup:
  vitals: true
  labs: []
  imaging: []

treatment:
  - {name: "Cool water irrigation", probability: 0.8, route: "topical", intent: "initial burn care"}
  - {name: "Silver sulfadiazine cream", probability: 0.6, route: "topical", intent: "antimicrobial wound care"}
  - {name: "Non-adherent dressing", probability: 0.9, route: "topical", intent: "wound protection"}
  - {name: "Ibuprofen 400mg", locale_name: {jp: "Ibuprofen 200mg"}, probability: 0.6, route: "PO", intent: "pain management"}
  - {name: "Acetaminophen/codeine", probability: 0.2, route: "PO", intent: "pain management for moderate burns"}

discharge_instructions:
  - {en: "Partial thickness burn; expected to heal in 10-14 days", ja: "部分層熱傷で10〜14日で治癒する見込み"}
  - {en: "Change dressing daily; reapply topical cream", ja: "被覆材を毎日交換し、外用薬を塗布"}
  - {en: "Keep wound clean and covered", ja: "創部を清潔に保ち、覆っておく"}
  - {en: "Return if increasing redness beyond burn margin, fever, or foul-smelling drainage", ja: "熱傷範囲を越える発赤、発熱、悪臭のある滲出液があれば再受診"}
follow_up: {en: "primary care physician or burn clinic in 2-3 days", ja: "2〜3日後にかかりつけ医または熱傷外来を受診"}

discharge_prescriptions:
  - {drug: "Silver sulfadiazine 1% cream", route: "topical", frequency: "BID", duration_days: 14, probability: 0.6}
  - {drug: "Ibuprofen 400mg", locale_name: {jp: "Ibuprofen 200mg"}, locale_frequency: {jp: "tid PRN"}, route: "PO", frequency: "Q6H PRN", duration_days: 7, probability: 0.5}

incidence_modifier: 1.0
probability: 0.03
age_distribution: all_ages
sex_ratio_female: 0.4
seasonal: {1: 1.0, 2: 1.0, 3: 1.0, 4: 1.0, 5: 1.0, 6: 1.1, 7: 1.2, 8: 1.1, 9: 1.0, 10: 1.0, 11: 1.0, 12: 1.0}

narrative:
  onset: {unit: hours, range: [1, 6]}
  ed_note_template:
    chief_complaint:
      en: '{chief_complaint_en} complaint'
      ja: '{chief_complaint_ja}の訴え'
    hpi:
      en: "Sustained a burn to the hand or arm {onset_en}. Mechanism (scald, contact, or flame) and first aid reviewed."
      ja: "{onset_ja}に手または腕に熱傷を受傷。受傷機転（熱湯・接触・火炎）と応急処置の内容を確認。"
    physical_exam:
      en:
        general: 'Alert and oriented, {appearance_en}'
      ja:
        general: '意識清明、{appearance_ja}'
    ed_workup_summary:
      en: '{lab_summary_en}, {imaging_summary_en}'
      ja: '{lab_summary_ja}、{imaging_summary_ja}'
    disposition:
      en: '{disposition_display_en}'
      ja: '{disposition_display_ja}'
  ed_triage_template:
    common_triage_levels:
    - '3'
    - '4'
