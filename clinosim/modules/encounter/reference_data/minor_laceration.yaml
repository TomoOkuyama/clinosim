# Minor Laceration — ED visit protocol
# Common ED presentation. Wound closure with sutures/staples/glue, discharge with wound care.

metadata:
  kind: protocol
  name: minor_laceration
  source: clinosim

condition_id: minor_laceration
# Issue #3680: a laceration has a site. Each visit draws one variant from a SHA
# of its encounter id; ``codes`` holds the code in each country's diagnosis
# system (us: ICD-10-CM FY2027 laceration without foreign body, initial
# encounter "A"; jp: MHLW ICD-10 2013 open wound of the site), ``site`` the site
# group the workup is gated on and ``body_site_snomed`` the SNOMED CT body
# structure of the wound (the Procedure bodySite). Every variant has its own JP
# code, so the site is recoverable from the diagnosis code. Index i of the
# ``wound__*`` lists in the ED note template is variant i. The weights are
# clinosim estimates (no published site shares for ED lacerations were found);
# the codes, the SNOMED concepts and the JP titles were each checked against
# NLM Clinical Tables (ICD-10-CM), tx.fhir.org $lookup (WHO ICD-10, SNOMED CT)
# and the MHLW 内容例示表 chapter XIX. Left/right is not modelled for the
# paired sites: the US code is the right side, the note says "right".
diagnosis_variants:
  - {weight: 0.10, site: scalp, body_site_snomed: "41695006", codes: {us: "S01.01XA", jp: "S01.0"}}      # scalp
  - {weight: 0.12, site: face, body_site_snomed: "52795006", codes: {us: "S01.81XA", jp: "S01.8"}}       # forehead (other part of head)
  - {weight: 0.06, site: face, body_site_snomed: "60819002", codes: {us: "S01.411A", jp: "S01.4"}}       # right cheek
  - {weight: 0.04, site: face, body_site_snomed: "48477009", codes: {us: "S01.511A", jp: "S01.5"}}       # lip
  - {weight: 0.12, site: forearm, body_site_snomed: "14975008", codes: {us: "S51.811A", jp: "S51.8"}}    # right forearm
  - {weight: 0.20, site: hand, body_site_snomed: "85562004", codes: {us: "S61.411A", jp: "S61.8"}}       # right hand
  - {weight: 0.26, site: finger, body_site_snomed: "7569003", codes: {us: "S61.210A", jp: "S61.0"}}      # right index finger
  - {weight: 0.10, site: leg, body_site_snomed: "30021000", codes: {us: "S81.811A", jp: "S81.8"}}        # right lower leg
chief_complaint:
  en: "Laceration requiring sutures"
  ja: "裂傷（縫合が必要）"
encounter_type: emergency
department: emergency_medicine
disposition: discharge_home

severity_distribution:
  mild: 0.55     # small, clean laceration, tissue glue
  moderate: 0.35  # moderate depth, sutures needed
  severe: 0.10    # deep, contaminated, or complex closure

ed_stay_hours:
  mild: {mean: 1.5, sd: 0.5}
  moderate: {mean: 2.5, sd: 0.8}
  severe: {mean: 3.5, sd: 1}

initial_state_impact:
  mild: {pain_level: 0.2}
  moderate: {pain_level: 0.3}
  severe: {pain_level: 0.4}

workup:
  vitals: true
  labs:
    - {test: "Tetanus_status", probability: 0.6}
  imaging:
    # Issue #2699 / #3680: a hand or finger wound (foreign body or fracture
    # concern); the draw is made for every visit, the study is ordered only
    # for these sites (about 14% of visits, as before).
    - {test: "Hand_Xray", probability: 0.30, sites: [hand, finger]}

treatment:
  - {name: "Lidocaine 1% local infiltration", probability: 0.9, route: "infiltration", intent: "local anesthesia"}
  - {name: "Wound irrigation with normal saline", probability: 0.95, route: "topical", intent: "wound cleaning"}
  - {name: "Suture closure", probability: 0.6, route: "topical", intent: "wound closure"}
  - {name: "Skin staples", probability: 0.15, route: "topical", intent: "wound closure"}
  - {name: "Tissue adhesive (glue)", probability: 0.25, route: "topical", intent: "wound closure"}
  - {name: "Tetanus toxoid booster", probability: 0.3, route: "IM", intent: "prophylaxis"}
  - {name: "Acetaminophen 500mg", probability: 0.4, route: "PO", intent: "analgesic"}

discharge_instructions:
  - {en: "Keep wound clean and dry for 24 hours", ja: "24時間は創部を清潔・乾燥に保つ"}
  - {en: "Watch for signs of infection: increasing redness, swelling, warmth, drainage", ja: "発赤・腫脹・熱感・排膿の増強など感染徴候に注意"}
  - {en: "Return if fever or red streaking from wound", ja: "発熱や創部から広がる赤い線状の発赤があれば再受診"}
follow_up: {en: "suture removal in 7-10 days (face 5 days)", ja: "7〜10日後に抜糸（顔面は5日後）"}

discharge_prescriptions:
  - {drug: "Ibuprofen 400mg", locale_name: {jp: "Ibuprofen 200mg"}, route: "PO", frequency: "tid PRN", duration_days: 5, probability: 0.6}
  - {drug: "Cephalexin 500mg", route: "PO", frequency: "qid", duration_days: 7, probability: 0.15}

incidence_modifier: 1.0
probability: 0.12  # relative frequency among ED visits
age_distribution: all
sex_ratio_female: 0.7  # more men (occupational / recreational injuries)
seasonal: {1: 0.9, 2: 0.9, 3: 1.0, 4: 1.0, 5: 1.1, 6: 1.2, 7: 1.2, 8: 1.2, 9: 1.1, 10: 1.0, 11: 0.9, 12: 0.9}

narrative:
  onset: {unit: hours, range: [1, 4]}
  ed_note_template:
    chief_complaint:
      en: '{chief_complaint_en} complaint'
      ja: '{chief_complaint_ja}の訴え'
    hpi:
      en: "Sustained a laceration of the {wound__site_en} {onset_en}; bleeding controlled with direct pressure."
      ja: "{onset_ja}に{wound__site_ja}に裂傷を受傷し、圧迫で止血。"
    physical_exam:
      en:
        general: 'Alert and oriented, {appearance_en}'
        skin: "Laceration of the {wound__site_en} with clean edges, no active bleeding after pressure; no foreign body or tendon exposure seen; sensation and capillary refill distal to the wound intact"
      ja:
        general: '意識清明、{appearance_ja}'
        skin: "{wound__site_ja}に辺縁の整った裂創、圧迫後の活動性出血なし、異物・腱露出なし、創より末梢の感覚・毛細血管再充満は正常"
    # Index i of the wound__site lists is diagnosis_variants[i]: the site the
    # note states is the site of the coded diagnosis (Issue #3680).
    variants_by_diagnosis: [wound]
    variants:
      wound__site:
        en: ["scalp", "forehead", "right cheek", "lip", "right forearm", "right hand", "right index finger", "right lower leg"]
        ja: ["頭皮", "前額部", "右頬部", "口唇", "右前腕", "右手", "右示指", "右下腿"]
    ed_workup_summary:
      en: '{lab_summary_en}, {imaging_summary_en}'
      ja: '{lab_summary_ja}、{imaging_summary_ja}'
    disposition:
      en: '{disposition_display_en}'
      ja: '{disposition_display_ja}'
  ed_triage_template:
    common_triage_levels:
    - '3'
    - '4'
