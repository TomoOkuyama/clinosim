# Rib Fracture — ED visit protocol
# Chest wall trauma. Pain management is key. Rule out pneumothorax/hemothorax.

metadata:
  kind: protocol
  name: rib_fracture
  source: clinosim

condition_id: rib_fracture
icd10_code: "S22.39XA"
chief_complaint:
  en: "Chest wall pain after fall/trauma, worse with breathing"
  ja: "外傷後の胸壁痛（呼吸時増悪）"
encounter_type: emergency
min_age: 12  # Issue #2174: presentation not drawn for younger children
department: emergency_medicine
disposition: discharge_home

severity_distribution:
  mild: 0.45    # 1-2 ribs, no complications
  moderate: 0.40 # 2-3 ribs, significant pain, chest X-ray
  severe: 0.15   # Multiple ribs, possible pneumothorax, may need admission

ed_stay_hours:
  mild: {mean: 2.5, sd: 0.8}
  moderate: {mean: 3.5, sd: 1.0}
  severe: {mean: 5.0, sd: 1.5}

initial_state_impact:
  mild: {pain_level: 0.5}
  moderate: {pain_level: 0.6}
  severe: {pain_level: 0.7}

workup:
  vitals: true
  labs:
    - {test: "Hb", probability: 0.3, note: "rule out significant hemorrhage"}
  imaging:
    - {test: "Chest_Xray", probability: 0.9}
    - {test: "CT_Chest", probability: 0.2, note: "multiple fractures or suspected pneumothorax"}

treatment:
  - {name: "Ibuprofen 400mg", locale_name: {jp: "Ibuprofen 200mg"}, probability: 0.7, route: "PO", intent: "anti-inflammatory"}
  - {name: "Acetaminophen 1000mg", probability: 0.6, route: "PO"}
  - {name: "Oxycodone 5mg", probability: 0.3, route: "PO", intent: "severe pain PRN"}
  - {name: "Lidocaine patch 5%", probability: 0.2, route: "topical", intent: "local pain relief"}
  - {name: "Incentive spirometry instruction", probability: 0.8, route: "other", intent: "prevent atelectasis/pneumonia"}
  - {name: "Ice pack application", probability: 0.7, route: "topical"}

discharge_instructions:
  - {en: "Use incentive spirometer 10 times every hour while awake", ja: "起きている間は1時間ごとに10回インセンティブスパイロメトリーを行う"}
  - {en: "Take deep breaths regularly; splinting leads to pneumonia", ja: "肺炎予防のため定期的に深呼吸する"}
  - {en: "Take pain medication on schedule, not just as needed, for the first 3-5 days", ja: "最初の3〜5日は頓用ではなく定時で鎮痛薬を服用"}
  - {en: "Sleep semi-upright or on the injured side for comfort", ja: "半座位または受傷側を下にして休む"}
  - {en: "Return if increasing shortness of breath, fever, or coughing blood", ja: "息切れの増悪、発熱、喀血があれば再受診"}
follow_up: {en: "primary care physician in 1-2 weeks", ja: "1〜2週間後にかかりつけ医を受診"}

discharge_prescriptions:
  - {drug: "Ibuprofen 400mg", locale_name: {jp: "Ibuprofen 200mg"}, route: "PO", frequency: "tid", duration_days: 10, probability: 0.7}
  - {drug: "Acetaminophen 500mg", route: "PO", frequency: "tid", duration_days: 10, probability: 0.5}
  - {drug: "Oxycodone 5mg", locale_exclude: [JP], route: "PO", frequency: "q6h PRN", duration_days: 5, probability: 0.3}

# NOTE (FP-YAML-KEY-COVERAGE, session 40): admission_criteria was authored as
# {probability: 0.10, criteria: "Flail chest, pneumothorax, ..."} but no simulator
# consumer reads this key — silent-drop of admission-routing intent. Removed to
# fail-loud on future typos; wiring severe rib-fracture ED-to-inpatient routing
# is deferred to a proper encounter escalation feature.

incidence_modifier: 1.0
probability: 0.04  # relative frequency among ED visits
age_distribution: all
sex_ratio_female: 0.8
seasonal: {1: 1.2, 2: 1.1, 3: 1.0, 4: 0.9, 5: 0.9, 6: 1.0, 7: 1.0, 8: 1.0, 9: 1.0, 10: 1.0, 11: 1.1, 12: 1.2}

narrative:
  onset: {unit: hours, range: [2, 24]}
  ed_note_template:
    chief_complaint:
      en: '{chief_complaint_en} complaint'
      ja: '{chief_complaint_ja}の訴え'
    hpi:
      en: "Injured the chest wall in a fall or blunt trauma {onset_en}; pain is worse with deep breathing and coughing. No hemoptysis."
      ja: "{onset_ja}に転倒または打撲により胸壁を受傷。深呼吸・咳嗽で疼痛増悪。喀血なし。"
    physical_exam:
      en:
        general: 'Alert and oriented, {appearance_en}'
      ja:
        general: '意識清明、{appearance_ja}'
    ed_workup_summary:
      en: '{lab_summary_en}, {imaging_summary_en}'
      ja: '{lab_summary_ja}、{imaging_summary_ja}'
    disposition:
      en: '{disposition_display_en}'
      ja: '{disposition_display_ja}'
  ed_triage_template:
    common_triage_levels:
    - '3'
    - '4'
