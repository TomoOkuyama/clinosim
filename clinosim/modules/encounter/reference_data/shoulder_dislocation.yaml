# Shoulder Dislocation (Anterior) — ED visit protocol
# Traumatic anterior dislocation. X-ray, procedural sedation, closed reduction, sling.

metadata:
  kind: protocol
  name: shoulder_dislocation
  source: clinosim

condition_id: shoulder_dislocation
icd10_code: "S43.006A"
chief_complaint:
  en: "Shoulder injury after fall, unable to move arm"
  ja: "転倒後の肩関節損傷（上肢挙上不能）"
encounter_type: emergency
min_age: 12  # Issue #2174: presentation not drawn for younger children
department: orthopedics
disposition: discharge_home

severity_distribution:
  mild: 0.30    # First-time, uncomplicated, quick reduction
  moderate: 0.50 # Standard reduction under sedation
  severe: 0.20   # Associated fracture (Hill-Sachs/Bankart), difficult reduction

ed_stay_hours:
  mild: {mean: 2.5, sd: 0.8}
  moderate: {mean: 3.5, sd: 1.0}
  severe: {mean: 4.5, sd: 1.0}

initial_state_impact:
  mild: {pain_level: 0.65}
  moderate: {pain_level: 0.75}
  severe: {pain_level: 0.85}

workup:
  vitals: true
  labs: []  # no routine labs unless sedation planned
  imaging:
    - {test: "Shoulder_Xray_AP_Lateral", probability: 0.95, note: "pre-reduction"}
    - {test: "Shoulder_Xray_Post_Reduction", probability: 0.95, note: "confirm relocation"}

treatment:
  - {name: "Procedural sedation (Propofol/Midazolam)", probability: 0.7, route: "IV", intent: "facilitate closed reduction"}
  - {name: "Closed reduction", probability: 1.0, route: "other", intent: "relocate glenohumeral joint"}
  - {name: "Sling immobilization", probability: 1.0, route: "topical", intent: "post-reduction support"}
  - {name: "Ice pack application", probability: 0.8, route: "topical"}
  - {name: "Morphine 4mg IV", probability: 0.5, route: "IV", intent: "pre-reduction analgesia"}
  - {name: "Ibuprofen 400mg", locale_name: {jp: "Ibuprofen 200mg"}, probability: 0.5, route: "PO", intent: "post-reduction pain"}

discharge_instructions:
  - {en: "Wear sling at all times for 2-3 weeks", ja: "2〜3週間は常に三角巾で固定"}
  - {en: "Remove sling only for gentle elbow/wrist exercises", ja: "三角巾は肘・手関節の軽い運動時のみ外す"}
  - {en: "Apply ice for 20 minutes every 2-3 hours for the first 48 hours", ja: "最初の48時間は2〜3時間ごとに20分間冷却"}
  - {en: "Return if arm becomes numb or cold, or if shoulder slips out again", ja: "腕のしびれ・冷感、再脱臼があれば再受診"}
  - {en: "No overhead activities or heavy lifting for 6 weeks", ja: "6週間は腕を挙げる動作や重い物の持ち上げを避ける"}
follow_up: {en: "orthopedics in 1-2 weeks", ja: "1〜2週間後に整形外科を受診"}

discharge_prescriptions:
  - {drug: "Ibuprofen 400mg", locale_name: {jp: "Ibuprofen 200mg"}, route: "PO", frequency: "tid", duration_days: 7, probability: 0.7}
  - {drug: "Acetaminophen 500mg", route: "PO", frequency: "tid PRN", duration_days: 7, probability: 0.5}
  - {drug: "Oxycodone 5mg", locale_exclude: [JP], route: "PO", frequency: "q6h PRN", duration_days: 3, probability: 0.2}

incidence_modifier: 1.0
probability: 0.03  # relative frequency among ED visits
age_distribution: all
sex_ratio_female: 0.5  # 2:1 male predominance
seasonal: {1: 1.1, 2: 1.0, 3: 1.0, 4: 1.0, 5: 1.1, 6: 1.2, 7: 1.3, 8: 1.3, 9: 1.1, 10: 1.0, 11: 1.0, 12: 1.1}

narrative:
  onset: {unit: hours, range: [1, 4]}
  ed_note_template:
    chief_complaint:
      en: '{chief_complaint_en} complaint'
      ja: '{chief_complaint_ja}の訴え'
    hpi:
      en: "Fell onto the arm {onset_en}, with immediate shoulder pain and inability to move the arm. Numbness of the arm reviewed."
      ja: "{onset_ja}に転倒し肩を受傷。直後より肩関節痛があり上肢を動かせない。上肢のしびれの有無を確認。"
    physical_exam:
      en:
        general: 'Alert and oriented, {appearance_en}'
      ja:
        general: '意識清明、{appearance_ja}'
    ed_workup_summary:
      en: '{lab_summary_en}, {imaging_summary_en}'
      ja: '{lab_summary_ja}、{imaging_summary_ja}'
    disposition:
      en: '{disposition_display_en}'
      ja: '{disposition_display_ja}'
  ed_triage_template:
    common_triage_levels:
    - '3'
    - '4'
