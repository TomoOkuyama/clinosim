# Uncomplicated UTI — ED visit protocol
# Lower urinary tract infection. Urinalysis, antibiotics, discharge.

metadata:
  kind: protocol
  name: uti_uncomplicated
  source: clinosim

condition_id: uti_uncomplicated
icd10_code: "N39.0"
chief_complaint:
  en: "Dysuria, urinary frequency, suprapubic discomfort"
  ja: "排尿時痛・頻尿・恥骨上部不快感"
encounter_type: emergency  # also outpatient_urgent
department: primary_care
disposition: discharge_home

severity_distribution:
  mild: 0.50     # classic symptoms, minimal workup
  moderate: 0.40  # labs, brief observation
  severe: 0.10    # concern for early pyelonephritis, IV fluids

ed_stay_hours:
  mild: {mean: 2, sd: 0.5}
  moderate: {mean: 3, sd: 1}
  severe: {mean: 4.5, sd: 1.5}

# Acute physiological signature (AD-57): drives true labs/vitals via the physiology engine.
# UTI → systemic inflammation (WBC/CRP/temp); early pyelonephritis adds mild dehydration.
initial_state_impact:
  mild: {inflammation_level: 0.12, pain_level: 0.2}
  moderate: {inflammation_level: 0.22, pain_level: 0.3}
  severe: {inflammation_level: 0.32, volume_status: -0.05, pain_level: 0.4}

workup:
  vitals: true
  labs:
    # Issue #2138: cystitis results — pyuria / nitrite in nearly all
    # dipsticks; uropathogen growth in most cultures (E. coli ~75-80%).
    - test: "Urinalysis"
      probability: 0.9
      result_distribution:
        options: ["2+ leukocytes, nitrite positive", "3+ leukocytes, nitrite positive", "2+ leukocytes, trace blood", "1+ leukocytes"]
        weights: [0.35, 0.25, 0.25, 0.15]
    # Issue #2640: the culture result is a microbiology result drawn from
    # microbiology.yaml (diseases.uti_uncomplicated).
    - {test: "Urine_culture", probability: 0.5}
    - {test: "WBC", probability: 0.3}
    - {test: "Creatinine", probability: 0.2}
  imaging:
    - {test: "CT_Abdomen_Pelvis", probability: 0.05}  # only if complicated UTI suspected

# Issue #2136: drugs not marketed in Japan carry a JP alternative
# (locale_name) or are not given on JP (locale_exclude).
treatment:
  - {name: "Trimethoprim/Sulfamethoxazole 160/800mg", probability: 0.4, route: "PO", intent: "antibiotic"}
  - {name: "Nitrofurantoin 100mg", locale_name: {jp: "Cefcapene pivoxil 100mg", us: "Nitrofurantoin 100mg"}, probability: 0.35, route: "PO", intent: "antibiotic"}
  - {name: "Ciprofloxacin 500mg", probability: 0.15, route: "PO", intent: "antibiotic (if resistance concern)"}
  - {name: "Phenazopyridine 200mg", locale_exclude: ["JP"], probability: 0.3, route: "PO", intent: "urinary analgesic"}
  - {name: "IV normal saline 500mL", probability: 0.15, route: "IV", intent: "hydration"}

discharge_instructions:
  - {en: "Complete full course of prescribed antibiotics", ja: "処方された抗菌薬を最後まで内服"}
  - {en: "Increase fluid intake", ja: "水分摂取を増やす"}
  - {en: "Symptoms should improve within 24-48 hours of starting antibiotics", ja: "抗菌薬開始後24〜48時間で症状は改善する見込み"}
  - {en: "Return if fever, flank pain, vomiting, or symptoms not improving after 48 hours", ja: "発熱、側腹部痛、嘔吐、48時間で改善しない場合は再受診"}
follow_up: {en: "primary care physician if symptoms persist", ja: "症状が続く場合はかかりつけ医を受診"}

discharge_prescriptions:
  # Exactly one antibiotic (choose_one: probability = relative weight among
  # the marketed alternatives; IDSA 2011 first-line agents first).
  - {drug: "Trimethoprim/Sulfamethoxazole 160/800mg", choose_one: uti_antibiotic, route: "PO", frequency: "bid", duration_days: 3, probability: 0.4}
  - {drug: "Nitrofurantoin 100mg", choose_one: uti_antibiotic, locale_exclude: [JP], route: "PO", frequency: "bid", duration_days: 5, probability: 0.35}
  - {drug: "Ciprofloxacin 500mg", choose_one: uti_antibiotic, route: "PO", frequency: "bid", duration_days: 3, probability: 0.15}
  - {drug: "Phenazopyridine 200mg", locale_exclude: [JP], route: "PO", frequency: "tid", duration_days: 2, probability: 0.3}

incidence_modifier: 1.0
probability: 0.05  # relative frequency among ED visits
age_distribution: adults  # predominantly women 18-65
sex_ratio_female: 4.0  # much more common in women
seasonal: {1: 1.0, 2: 1.0, 3: 1.0, 4: 1.0, 5: 1.0, 6: 1.1, 7: 1.2, 8: 1.2, 9: 1.1, 10: 1.0, 11: 1.0, 12: 1.0}

narrative:
  onset: {unit: days, range: [1, 4]}
  ed_note_template:
    chief_complaint:
      en: '{chief_complaint_en} complaint'
      ja: '{chief_complaint_ja}の訴え'
    hpi:
      en: "Dysuria, urinary frequency, and suprapubic discomfort began {onset_en}. No fever, flank pain, or vomiting."
      ja: "{onset_ja}より排尿時痛・頻尿・恥骨上部不快感が出現。発熱・側腹部痛・嘔吐なし。"
    physical_exam:
      en:
        general: 'Alert and oriented, {appearance_en}'
      ja:
        general: '意識清明、{appearance_ja}'
    ed_workup_summary:
      en: '{lab_summary_en}, {imaging_summary_en}'
      ja: '{lab_summary_ja}、{imaging_summary_ja}'
    disposition:
      en: '{disposition_display_en}'
      ja: '{disposition_display_ja}'
  ed_triage_template:
    common_triage_levels:
    - '3'
    - '4'
