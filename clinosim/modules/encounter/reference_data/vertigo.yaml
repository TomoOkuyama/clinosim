# Vertigo — ED visit protocol
# Peripheral vs central vertigo evaluation. Symptomatic treatment.

metadata:
  kind: protocol
  name: vertigo
  source: clinosim

condition_id: vertigo
icd10_code: "R42"
chief_complaint:
  en: "Dizziness, room spinning, nausea"
  ja: "めまい・回転性めまい・嘔気"
encounter_type: emergency
min_age: 12  # Issue #2174: presentation not drawn for younger children
department: emergency_medicine
disposition: discharge_home

severity_distribution:
  mild: 0.35
  moderate: 0.50
  severe: 0.15    # central vertigo concern, requires imaging

ed_stay_hours:
  mild: {mean: 2, sd: 0.5}
  moderate: {mean: 3, sd: 1}
  severe: {mean: 5, sd: 1.5}

workup:
  vitals: true
  labs:
    - {test: "Glucose", probability: 0.3}
  imaging:
    - {test: "CT_Head", probability: 0.2}

# Issue #2136: drugs not marketed in Japan carry a JP alternative
# (locale_name) or are not given on JP (locale_exclude).
treatment:
  - {name: "Meclizine 25mg", locale_name: {jp: "Betahistine 12mg", us: "Meclizine 25mg"}, probability: 0.7, route: "PO", intent: "antivertiginous"}
  - {name: "Ondansetron 4mg", probability: 0.5, route: "IV", intent: "antiemetic"}
  - {name: "IV normal saline", probability: 0.3, route: "IV", intent: "hydration"}

discharge_instructions:
  - {en: "Symptoms consistent with peripheral vertigo (likely BPPV)", ja: "末梢性めまい（良性発作性頭位めまい症の疑い）として矛盾しない"}
  - {en: "Perform Epley maneuver at home as instructed", ja: "指導どおり自宅でエプリー法を行う"}
  - {en: "Return if severe headache, weakness, vision changes, or difficulty walking", ja: "激しい頭痛、脱力、視覚異常、歩行困難があれば再受診"}
follow_up: {en: "primary care physician within 1 week; ENT referral if persistent", ja: "1週間以内にかかりつけ医を受診、持続すれば耳鼻咽喉科へ紹介"}

discharge_prescriptions:
  - {drug: "Meclizine 25mg", locale_name: {jp: "Betahistine 6mg"}, route: "PO", frequency: "TID PRN", duration_days: 7, probability: 0.6}
  - {drug: "Ondansetron 4mg ODT", route: "PO", frequency: "Q8H PRN", duration_days: 5, probability: 0.3}

incidence_modifier: 1.0
probability: 0.05
age_distribution: adults
sex_ratio_female: 0.6
seasonal: {1: 1.0, 2: 1.0, 3: 1.0, 4: 1.0, 5: 1.0, 6: 1.0, 7: 1.0, 8: 1.0, 9: 1.0, 10: 1.0, 11: 1.0, 12: 1.0}

narrative:
  onset: {unit: hours, range: [2, 12]}
  ed_note_template:
    chief_complaint:
      en: '{chief_complaint_en} complaint'
      ja: '{chief_complaint_ja}の訴え'
    hpi:
      en: "Room-spinning dizziness with nausea began {onset_en}, worse with head movement. No headache, weakness, speech, or vision change."
      ja: "{onset_ja}より頭位変換で増悪する回転性めまいが出現し、嘔気を伴う。頭痛・脱力・構音障害・視覚異常なし。"
    physical_exam:
      en:
        general: 'Alert and oriented, {appearance_en}'
      ja:
        general: '意識清明、{appearance_ja}'
    ed_workup_summary:
      en: '{lab_summary_en}, {imaging_summary_en}'
      ja: '{lab_summary_ja}、{imaging_summary_ja}'
    disposition:
      en: '{disposition_display_en}'
      ja: '{disposition_display_ja}'
  ed_triage_template:
    common_triage_levels:
    - '3'
    - '4'
