# Wrist Fracture (Distal Radius) — ED visit protocol
# FOOSH injury. X-ray confirms. Splint/cast if non-displaced, refer ortho if displaced.

metadata:
  kind: protocol
  name: wrist_fracture
  source: clinosim

condition_id: wrist_fracture
icd10_code: "S62.90XA"
chief_complaint:
  en: "Fall on outstretched hand, wrist pain and swelling"
  ja: "転倒後の手関節痛・腫脹"
encounter_type: emergency
min_age: 4  # Issue #2174: presentation not drawn for younger children
department: orthopedics
disposition: discharge_home

severity_distribution:
  mild: 0.40    # Non-displaced, buddy splint or short arm cast
  moderate: 0.40 # Minimally displaced, closed reduction + cast
  severe: 0.20   # Displaced/comminuted, needs surgical referral

ed_stay_hours:
  mild: {mean: 2.0, sd: 0.5}
  moderate: {mean: 3.0, sd: 0.8}
  severe: {mean: 3.5, sd: 1.0}

initial_state_impact:
  mild: {pain_level: 0.5}
  moderate: {pain_level: 0.6}
  severe: {pain_level: 0.7}

workup:
  vitals: true
  labs: []  # no labs for isolated wrist fracture
  imaging:
    - {test: "Wrist_Xray_AP_Lateral", probability: 0.95}

treatment:
  - {name: "Ice pack application", probability: 0.9, route: "topical"}
  - {name: "Short arm splint", probability: 0.6, route: "topical", intent: "immobilization non-displaced"}
  - {name: "Short arm cast", probability: 0.3, route: "topical", intent: "immobilization after reduction"}
  - {name: "Closed reduction", probability: 0.25, route: "other", intent: "realign displaced fracture"}
  - {name: "Acetaminophen 500mg", probability: 0.5, route: "PO"}
  - {name: "Ibuprofen 400mg", locale_name: {jp: "Ibuprofen 200mg"}, probability: 0.6, route: "PO", intent: "anti-inflammatory"}
  - {name: "Morphine 4mg IV", probability: 0.2, route: "IV", intent: "severe pain or pre-reduction"}

discharge_instructions:
  - {en: "Keep splint/cast dry and elevated above heart level", ja: "副子／ギプスを濡らさず、心臓より高く挙上"}
  - {en: "Wiggle fingers frequently to maintain circulation", ja: "血流を保つため手指をこまめに動かす"}
  - {en: "Return if fingers become numb, blue, or very swollen", ja: "手指のしびれ・チアノーゼ・強い腫脹があれば再受診"}
  - {en: "Ice over splint for 20 minutes every 2-3 hours for the first 48 hours", ja: "最初の48時間は2〜3時間ごとに20分間、副子の上から冷却"}
follow_up: {en: "orthopedics in 5-7 days for repeat X-ray", ja: "5〜7日後に整形外科で再度X線撮影"}

discharge_prescriptions:
  - {drug: "Ibuprofen 400mg", locale_name: {jp: "Ibuprofen 200mg"}, route: "PO", frequency: "tid", duration_days: 7, probability: 0.7}
  - {drug: "Acetaminophen 500mg", route: "PO", frequency: "tid PRN", duration_days: 7, probability: 0.5}
  - {drug: "Oxycodone 5mg", locale_exclude: [JP], route: "PO", frequency: "q6h PRN", duration_days: 3, probability: 0.2}

# NOTE (FP-YAML-KEY-COVERAGE, session 40): surgical_referral was authored as
# {probability: 0.20, criteria: "...", referral_to: "wrist_fracture_surgical"}
# but no simulator consumer reads this key — silent-drop of referral-routing
# intent. Removed to fail-loud on future typos; wiring ED-to-elective-surgical
# escalation is deferred. wrist_fracture_surgical.yaml still exists as an
# independent inpatient scenario.

incidence_modifier: 1.0
probability: 0.04  # relative frequency among ED visits
age_distribution: all
sex_ratio_female: 1.3  # higher in postmenopausal women (osteoporosis)
seasonal: {1: 1.3, 2: 1.2, 3: 1.0, 4: 0.9, 5: 0.9, 6: 1.0, 7: 1.1, 8: 1.1, 9: 1.0, 10: 1.0, 11: 1.1, 12: 1.3}

narrative:
  onset: {unit: hours, range: [1, 6]}
  ed_note_template:
    chief_complaint:
      en: '{chief_complaint_en} complaint'
      ja: '{chief_complaint_ja}の訴え'
    hpi:
      en: "Fell on an outstretched hand {onset_en}, with immediate wrist pain and swelling. No numbness of the fingers."
      ja: "{onset_ja}に転倒して手をつき受傷、直後より手関節痛・腫脹が出現。手指のしびれなし。"
    physical_exam:
      en:
        general: 'Alert and oriented, {appearance_en}'
      ja:
        general: '意識清明、{appearance_ja}'
    ed_workup_summary:
      en: '{lab_summary_en}, {imaging_summary_en}'
      ja: '{lab_summary_ja}、{imaging_summary_ja}'
    disposition:
      en: '{disposition_display_en}'
      ja: '{disposition_display_ja}'
  ed_triage_template:
    common_triage_levels:
    - '3'
    - '4'
