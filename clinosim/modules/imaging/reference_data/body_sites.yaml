        loinc: "59281-6"                         # US Heart Transthoracic
        cpt: "93306"
        jp_k_code: "D215"                        # 超音波検査 (心臓超音波)
  coronary_artery:
    snomed: "41801008"                           # Coronary artery structure
    procedure_codes:
