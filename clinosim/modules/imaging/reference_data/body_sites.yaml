      US:                                        # carotid duplex
        loinc: "24616-5"                         # US Carotid arteries
        cpt: "93880"
        jp_k_code: "D215"
  biliary_tract:
    snomed: "34707002"                           # Biliary tract structure
    procedure_codes:
      MR_non_contrast:                           # MRCP
        loinc: "58740-2"                         # MRCP Abdomen WO contrast
        cpt: "74181"
        jp_k_code: "E202"
  urinary_bladder:
