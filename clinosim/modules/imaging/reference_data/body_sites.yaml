# Body site reference + procedure code lookup.
# procedure_codes keyed by "{modality_dicom_code}_{variant}" — e.g. CR_PA_Lateral,
# CT_non_contrast — and carry LOINC + CPT + JP K-code for billing/interop.
#
# SNOMED body site concepts verified via SNOMED CT International browser.
# LOINC procedure codes verified via NLM Clinical Table Search Service
# (clinicaltables.nlm.nih.gov/api/loinc_items/v3/search) — see CO-1 continuation
# session 43 for the individual query URLs.
# CPT codes from AMA CPT 2024. JP K-code from 診療報酬点数表 令和6年.

body_sites:
  chest:
    snomed: "51185008"
    procedure_codes:
      CR_PA_Lateral:                             # 2-view chest X-ray (standing PA + lateral)
        # #1851 split from 36572-6 (XR Chest AP, portable supine) to the
        # 2-view LOINC 42272-5 (XR Chest PA and Lateral) which matches
        # the standing-exam clinical variant.
        loinc: "42272-5"
        cpt: "71046"                             # AMA verified
        jp_k_code: "E001"                        # MHLW 単純撮影
      CR_PA:                                     # 1-view chest X-ray (portable / bed-side AP)
        loinc: "36572-6"                         # XR Chest AP — portable supine, NLM verified
        cpt: "71045"
        jp_k_code: "E001"
      CT_non_contrast:
        # session 58 Issue #264: 30794-3 was retired from LOINC. Real active
        # LOINCs for chest CT are 29252-4 (WO contrast) + 24628-0 (W contrast IV).
        loinc: "29252-4"                         # CT Chest WO contrast (LOINC 2.82 ACTIVE)
        cpt: "71250"
        jp_k_code: "E200"                        # MHLW CT 単純
      CT_contrast:
        loinc: "24628-0"                         # CT Chest W contrast IV (LOINC 2.82 ACTIVE)
        cpt: "71260"
        jp_k_code: "E200"

  head:
    snomed: "69536005"
    procedure_codes:
      CT_non_contrast:
        loinc: "30799-1"
        cpt: "70450"
        jp_k_code: "E200"
      CT:
        loinc: "24725-4"                         # "CT Head" — NLM verified
        cpt: "70450"
        jp_k_code: "E200"
      MR_non_contrast:
        loinc: "30657-1"                         # "MR Brain WO contrast" — NLM verified
        cpt: "70551"
        jp_k_code: "E202"                        # MHLW MRI撮影

  # === CO-1 continuation (session 43) — new body sites ===

  abdomen:
    snomed: "818983003"                          # Abdomen (structure) — SNOMED CT
    procedure_codes:
      CR_AP:                                     # KUB / X-ray abdomen
        loinc: "24799-9"                         # XR Abdomen AP — NLM verified
        cpt: "74018"                             # X-ray abdomen 1 view — AMA CPT 2024
        jp_k_code: "E001"
      CR_Supine_Upright:                         # 2-view (supine + upright)
        loinc: "37636-8"                         # XR Abdomen Views — NLM verified
        cpt: "74022"                             # X-ray abdomen with chest — AMA
        jp_k_code: "E001"
      CT_non_contrast:
        # #1851 abdomen CT contrast-state split (mirrors chest 29252-4/
        # 24628-0 pattern). Previously both variants used 41806-1
        # (CT Abdomen generic). 36424-0 is `CT Abdomen WO contrast`.
        loinc: "36424-0"
        cpt: "74150"                             # CT abdomen WO contrast — AMA
        jp_k_code: "E200"
      CT_contrast:
        # 79103-8 is `CT Abdomen W contrast IV` (NLM verified).
        loinc: "79103-8"
        cpt: "74160"                             # CT abdomen W contrast — AMA
        jp_k_code: "E200"
      US:                                        # US abdomen (complete)
        loinc: "24558-9"                         # US Abdomen — NLM verified
        cpt: "76700"                             # US abdomen complete — AMA
        jp_k_code: "D215"                        # 超音波検査

  kidney:
    snomed: "64033007"                           # Kidney (structure)
    procedure_codes:
      US:
        loinc: "38036-0"                         # US Kidney — NLM verified
        cpt: "76770"                             # US renal complete — AMA
        jp_k_code: "D215"

  leg:
    snomed: "61685007"                           # Lower extremity
    procedure_codes:
      US_Doppler:                                # US doppler leg (DVT workup)
        loinc: "99607-4"                         # US Doppler Lower extremity vein bilateral — NLM verified
        cpt: "93970"                             # US extremity venous complete bilateral — AMA
        jp_k_code: "D215"

  skin:
    snomed: "39937001"                           # Skin structure
    procedure_codes:
      US:                                        # US soft tissue (skin/subcutaneous)
        loinc: "80861-8"                         # US Lower extremity soft tissue — NLM verified (used as proxy for skin/soft tissue US)
        cpt: "76881"                             # US extremity non-vascular complete — AMA
        jp_k_code: "D215"

  hand:
    snomed: "85562004"                           # Hand
    procedure_codes:
      CR_PA_Oblique_Lateral:                     # 3-view hand
        loinc: "24722-1"                         # XR Hand 3 Views — NLM verified
        cpt: "73140"                             # X-ray hand 3 views — AMA
        jp_k_code: "E001"

  hip:
    snomed: "29836001"                           # Hip region
    procedure_codes:
      CR_AP_Lateral:                             # 2-view hip
        loinc: "36663-3"                         # XR Hip 2 Views — NLM verified
        cpt: "73510"                             # X-ray hip complete 2 views — AMA
        jp_k_code: "E001"
      CT_non_contrast:
        # #1851 modality correction: previously 36663-3 (XR Hip 2 Views)
        # was reused for the CT variant — XR LOINC on a CT procedure.
        # 36484-4 is `CT Hip WO contrast` (Multisection^WO contrast)
        # verified via NLM Clinical Table Search Service.
        loinc: "36484-4"
        cpt: "73700"                             # CT lower extremity — AMA
        jp_k_code: "E200"

  knee:
    snomed: "72696002"                           # Knee region structure — tx.fhir.org verified
    procedure_codes:
      CR_AP_Lateral:                             # 2-view knee (post-arthroplasty check)
        loinc: "44198-0"                         # XR Knee 1 or 2 Views — NLM verified
        cpt: "73560"                             # X-ray knee 1 or 2 views — AMA
        jp_k_code: "E001"

  spine:
    snomed: "421060004"                          # Vertebral column
    procedure_codes:
      CR_AP_Lateral:                             # 2-view spine (typical trauma workup)
        loinc: "44203-8"                         # Portable XR Cervical/Thoracic/Lumbar spine — NLM verified
        cpt: "72110"                             # X-ray lumbar spine complete 4 views — AMA
        jp_k_code: "E001"
      CT_non_contrast:                           # CT spine (trauma / fracture assessment)
        loinc: "24932-6"                         # CT Cervical spine — NLM verified (spine family)
        cpt: "72131"                             # CT lumbar spine WO contrast — AMA
        jp_k_code: "E200"
      MR_non_contrast:
        loinc: "24968-0"                         # MR Lumbar spine — NLM verified
        cpt: "72148"                             # MR lumbar spine WO contrast — AMA
        jp_k_code: "E202"

  wrist:
    snomed: "8205005"                            # Wrist region
    procedure_codes:
      CR_PA_Lateral_Oblique:                     # 3-view wrist
        # #1851 split from the generic 24619-9 (XR Wrist Views) to the
        # view-count-specific LOINCs. 37926-3 is `XR Wrist 3 Views`.
        loinc: "37926-3"
        cpt: "73110"                             # X-ray wrist complete 3 views — AMA
        jp_k_code: "E001"
      CR_PA_Lateral:                             # 2-view wrist (post-op check)
        # 37925-5 is `XR Wrist 2 Views` (NLM verified).
        loinc: "37925-5"
        cpt: "73100"                             # X-ray wrist 2 views — AMA
        jp_k_code: "E001"
