# DICOM modality reference.
# Each entry: dicom_code, localized display, typical instance count range,
# default views per body site. Validated at load time by the ImagingModalities model in engine.py.
#
# CO-1 continuation (session 43): MR + US modalities added along with the
# 8-body-site expansion (see body_sites.yaml + SUPPORTED_BODY_SITES).
# Session 52 fix 4: XA + ECG modalities added, plus CT+kidney / MR+abdomen /
# US+chest (echocardiography) / US+spine (carotid) combos — all of these had
# whitelisted inference patterns that stub-fell at _expand_views_to_series.

metadata:
  kind: reference
  name: modalities
  source: clinosim

# Issue #2999: report read time — minutes from the study start to the signed
# radiology report (DiagnosticReport.issued), uniform in [low, high] per study
# (sha-derived from the order, no RNG draw). Typical report turnaround: plain
# radiographs about 30-60 min, CT about 1 h, MRI 1-3 h (ACR practice parameter
# for communication of diagnostic imaging findings; ED turnaround benchmarks).
# Studies whose modality could not be inferred use stub_report_read_minutes.
stub_report_read_minutes: [30, 90]

modalities:
  CR:                                            # Computed Radiography (plain X-ray)
    dicom_code: "CR"
    report_read_minutes: [20, 60]                # plain radiograph
    typical_instances_per_view_range: [1, 1]     # 1 view = 1 instance
    default_views_by_body_site:
      chest: ["PA", "Lateral"]
      abdomen: ["AP"]
      hand: ["PA", "Oblique", "Lateral"]
      hip: ["AP", "Lateral"]
      knee: ["AP", "Lateral"]
      spine: ["AP", "Lateral"]
      wrist: ["PA", "Lateral"]
      ankle: ["AP", "Mortise", "Lateral"]        # Issue #2655
      foot: ["AP", "Oblique", "Lateral"]         # Issue #2655
      shoulder: ["AP", "Lateral"]                # Issue #2655 (incl. post-reduction)
      cervical_spine: ["AP", "Lateral"]          # Issue #2657
      lumbar_spine: ["AP", "Lateral"]            # Issue #2657
      pelvis: ["AP"]                             # Issue #3113: trauma pelvis film

  CT:                                            # Computed Tomography
    dicom_code: "CT"
    report_read_minutes: [30, 90]
    typical_instances_per_series_range:
      head: [180, 280]                           # axial 5mm ≈ ~200 slices
      chest: [220, 340]                          # axial 1mm ≈ ~280 slices
      abdomen: [280, 420]                        # thin section abdomen
      abdomen_pelvis: [380, 560]                 # Issue #2654: abdomen + pelvis coverage
      hip: [180, 260]
      spine: [220, 320]
      kidney: [280, 420]                         # CT urography ≈ abdomen coverage
      leg: [180, 320]                            # session-103: soft-tissue CT for cellulitis workup
      # Issue #3113: cervical spine (trauma), hand / wrist (fracture
      # planning), whole body (trauma pan-scan, head to pelvis).
      cervical_spine: [150, 260]
      hand: [120, 240]
      wrist: [120, 240]
      whole_body: [1200, 2000]
      chest_abdomen_pelvis: [600, 900]           # Issue #3113: staging CT
    default_views_by_body_site:
      head: ["axial"]
      chest: ["axial"]
      abdomen: ["axial"]
      abdomen_pelvis: ["axial"]
      hip: ["axial"]
      spine: ["axial"]
      kidney: ["axial"]
      leg: ["axial"]                             # session-103: CT_soft_tissue_with_contrast
      cervical_spine: ["axial", "sagittal"]      # Issue #3113
      hand: ["axial", "coronal"]                 # Issue #3113
      wrist: ["axial", "coronal"]                # Issue #3113
      whole_body: ["axial"]                      # Issue #3113
      chest_abdomen_pelvis: ["axial"]            # Issue #3113

  MR:                                            # Magnetic Resonance
    dicom_code: "MR"
    report_read_minutes: [60, 180]
    typical_instances_per_series_range:
      head: [140, 220]                           # DWI/FLAIR/T1/T2 typical
      spine: [120, 200]
      abdomen: [150, 280]                        # T1/T2/DWI abdomen protocol
      biliary_tract: [40, 120]                   # Issue #2655: MRCP 3D + thick-slab series
      lumbar_spine: [120, 200]                   # Issue #2657
    default_views_by_body_site:
      head: ["axial", "sagittal"]
      spine: ["sagittal", "axial"]
      abdomen: ["axial", "coronal"]
      biliary_tract: ["coronal", "axial"]        # Issue #2655: MRCP (thick-slab coronal + axial)
      lumbar_spine: ["sagittal", "axial"]        # Issue #2657

  US:                                            # Ultrasound
    dicom_code: "US"
    report_read_minutes: [20, 90]
    typical_instances_per_series_range:
      abdomen: [12, 30]                          # ~20 static frames
      kidney: [8, 20]
      leg: [8, 20]
      skin: [6, 15]
      chest: [30, 90]                            # echocardiography (TTE) clip frames
      spine: [15, 40]                            # carotid duplex (頸部; spine 集約 per session 48)
      heart: [30, 90]                            # Issue #2655: echocardiography (TTE) clip frames
      carotid_artery: [15, 40]                   # Issue #2655: carotid duplex
      urinary_bladder: [6, 15]                   # Issue #2655
    default_views_by_body_site:
      abdomen: ["longitudinal", "transverse"]
      kidney: ["longitudinal", "transverse"]
      leg: ["longitudinal", "transverse", "doppler"]
      skin: ["longitudinal"]
      chest: ["parasternal_long_axis", "apical_4_chamber"]
      spine: ["longitudinal", "transverse", "doppler"]
      heart: ["parasternal_long_axis", "apical_4_chamber"]   # Issue #2655
      carotid_artery: ["longitudinal", "transverse", "doppler"]  # Issue #2655
      urinary_bladder: ["longitudinal", "transverse"]        # Issue #2655

  XA:                                            # X-Ray Angiography (coronary angiography)
    dicom_code: "XA"
    report_read_minutes: [30, 120]               # catheterisation report after the procedure
    typical_instances_per_series_range:
      chest: [300, 800]                          # cine runs, multiple projections
      coronary_artery: [300, 800]                # Issue #2655
    default_views_by_body_site:
      chest: ["LAO", "RAO"]
      coronary_artery: ["LAO", "RAO"]            # Issue #2655

  RF:                                            # Radiofluoroscopy (Issue #3113)
    dicom_code: "RF"
    report_read_minutes: [30, 120]               # videofluoroscopic swallow, read with the speech therapist
    typical_instances_per_series_range:
      hypopharynx: [2, 6]                        # cine loops per projection (several boluses)
    default_views_by_body_site:
      hypopharynx: ["Lateral", "AP"]             # lateral then frontal swallow projections

  ECG:                                           # Electrocardiography (DICOM waveform)
    dicom_code: "ECG"
    report_read_minutes: [10, 30]                # cardiologist over-read
    typical_instances_per_view_range: [1, 1]     # 1 waveform object
    default_views_by_body_site:
      chest: ["12-lead"]

  MG:                                            # Mammography (Issue #2870)
    dicom_code: "MG"
    report_read_minutes: [240, 2880]             # screening mammograms are batch-read within 1-2 days
    typical_instances_per_view_range: [1, 1]     # 1 image per view
    default_views_by_body_site:
      # Screening mammogram: craniocaudal + mediolateral oblique of each breast.
      breast: ["RCC", "LCC", "RMLO", "LMLO"]
