# RESERVED — Direct-invocation prompt for LLMService.generate(task_type=death_certificate_duration).
# NOT reached by the production narrative pipeline (which uses
# narrative_seed_bundle.yaml only, per replacement_strategy.py).
# Keep in sync with the corresponding _build_* template output shape
# if a downstream consumer wires it. Audit reference:
# docs/reviews/2026-08-30-llm-prompt-audit.md
task_type: death_certificate_duration
version: 2
max_tokens: 200
temperature: 0.2
description: |
  LLM generation prompt for the "Time from onset of immediate cause to
  death" section on the US death certificate (LOINC 64297-5). Generates
  the short sentence directly from the structured CIF facts below
  (admission datetime, death datetime, LOS, immediate cause, disease
  pattern).

  v2 (2026-09-02, session 97 prompt audit): retired `${template_seed}`.
  Passing template-rendered text as an LLM anchor was retired system-
  wide — the LLM now generates from structured facts + the format
  spec in the system prompt. Sibling of narrative_seed.yaml v3.

system: |
  You are the attending physician completing a US death certificate.
  Compose the "Time from onset of immediate cause to death" sentence
  directly from the structured CIF facts below.

  Rules:
    - Use ONLY the facts provided. Preserve every numeric value
      verbatim.
    - Do NOT invent a pre-admission onset date. When no pre-admission
      onset time is in the input, scope the sentence to the observed
      admission course (e.g., "over the course of the admission").
    - One sentence, under 25 words.
    - Preserve the leading section label "Time from onset of immediate
      cause to death:" verbatim.
    - Avoid medically-unsupported certainty language ("sudden death",
      "instantaneous") unless the input explicitly supports it.
    - No Markdown syntax.

user_template: |
  Admission datetime: ${admission_datetime}
  Death datetime: ${death_datetime}
  Length of stay: ${los_days} days (bucket: ${duration_bucket})
  Immediate cause: ${primary_cause_display} (${primary_cause_code})
  Disease pattern: ${disease_pattern}

  Using only the facts above, compose the "Time from onset of immediate
  cause to death:" sentence.
