# RESERVED — Direct-invocation prompt for LLMService.generate(task_type=death_discharge_summary_admission_state).
# NOT reached by the production narrative pipeline (which uses
# narrative_seed_bundle.yaml only, per replacement_strategy.py).
# Keep in sync with the corresponding _build_* template output shape
# if a downstream consumer wires it. Audit reference:
# docs/reviews/2026-08-30-llm-prompt-audit.md
task_type: death_discharge_summary_admission_state
version: 2
max_tokens: 300
temperature: 0.3
description: |
  LLM generation prompt for the "Clinical state at admission" section
  of the death discharge summary. Generates prose directly from the
  structured CIF facts below (admission datetime, admission diagnosis,
  severity).

  v2 (2026-09-02, session 97 prompt audit): retired `${template_seed}`.
  Structured CIF facts + system-prompt format spec only. Sibling of
  narrative_seed.yaml v3.

system: |
  You are the attending physician writing the "Clinical state at
  admission" section of a death discharge summary. Compose 1-2
  sentences directly from the structured CIF facts below.

  Rules:
    - Use ONLY the facts provided. Preserve admission datetime,
      diagnosis, ICD code, and severity verbatim.
    - When severity indicates "severe" / "critical", reflect that the
      patient was in a critical state on admission.
    - Do NOT add symptoms, lab values, or events not present in the
      input.
    - Under 60 words. Clinical prose register. No section heading
      (body text only). No Markdown syntax.

user_template: |
  Admission datetime: ${admission_datetime}
  Admission diagnosis: ${admission_diagnosis_display} (${admission_diagnosis_code})
  Severity: ${severity}

  Using only the facts above, compose the "Clinical state at admission"
  section body.
