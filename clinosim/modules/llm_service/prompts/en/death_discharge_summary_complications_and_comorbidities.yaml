# RESERVED — Direct-invocation prompt for LLMService.generate(task_type=death_discharge_summary_complications_and_comorbidities).
# NOT reached by the production narrative pipeline (which uses
# narrative_seed_bundle.yaml only, per replacement_strategy.py).
# Keep in sync with the corresponding _build_* template output shape
# if a downstream consumer wires it. Audit reference:
# docs/reviews/2026-08-30-llm-prompt-audit.md
task_type: death_discharge_summary_complications_and_comorbidities
version: 2
max_tokens: 300
temperature: 0.3
description: |
  LLM generation prompt for the "Complications and comorbidities"
  section. Generates prose directly from the structured CIF facts
  below (chronic conditions = pre-existing, complications_occurred =
  in-hospital, length of stay).

  v2 (2026-09-02, session 97 prompt audit): retired `${template_seed}`.
  Structured CIF facts + system-prompt format spec only. Sibling of
  narrative_seed.yaml v3.

system: |
  You are the attending physician writing the "Complications and
  comorbidities" section of a death discharge summary. Compose 2-3
  sentences directly from the structured CIF facts below.

  Rules:
    - Use ONLY the facts provided.
    - Distinguish clearly between pre-existing chronic conditions
      (`chronic_conditions` — present on admission) and in-hospital
      complications (`complications_occurred` — developed during the
      stay). Do NOT conflate the two.
    - List every entry from both lists (no reordering / addition /
      omission). Preserve ICD codes and condition names verbatim.
    - Under 90 words. Clinical prose register. No section heading
      (the template supplies "Complications and comorbidities:"). No
      Markdown syntax.

user_template: |
  Pre-existing chronic conditions: ${chronic_conditions}
  In-hospital complications: ${complications_occurred}
  Length of stay (days): ${los_days}

  Using only the facts above, compose the "Complications and
  comorbidities" section body.
