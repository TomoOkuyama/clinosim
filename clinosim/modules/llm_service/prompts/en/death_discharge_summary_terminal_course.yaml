# RESERVED — Direct-invocation prompt for LLMService.generate(task_type=death_discharge_summary_terminal_course).
# NOT reached by the production narrative pipeline (which uses
# narrative_seed_bundle.yaml only, per replacement_strategy.py).
# Keep in sync with the corresponding _build_* template output shape
# if a downstream consumer wires it. Audit reference:
# docs/reviews/2026-08-30-llm-prompt-audit.md
task_type: death_discharge_summary_terminal_course
version: 2
max_tokens: 300
temperature: 0.3
description: |
  LLM generation prompt for the "Terminal course" section (final
  24-72 h) of the death discharge summary. Generates the prose
  directly from the structured CIF facts below (death datetime,
  immediate cause, disease pattern).

  v2 (2026-09-02, session 97 prompt audit): retired `${template_seed}`.
  Structured CIF facts + system-prompt format spec only. Sibling of
  narrative_seed.yaml v3.

system: |
  You are the attending physician writing the "Terminal course"
  section (final 24-72 h) of a death discharge summary. Compose 2-3
  sentences directly from the structured CIF facts below.

  Rules:
    - Use ONLY the facts provided. Do NOT invent numeric vital signs,
      lab values, or specific hemodynamic thresholds. Qualitative
      descriptors only ("declining vitals", "diminished
      responsiveness", "escalating pressor requirement").
    - Preserve death datetime, immediate cause, and ICD code verbatim.
    - Reflect `disease_pattern` in the arc: acute → abrupt progression,
      chronic → gradual decline, unknown → observed findings only.
    - Under 90 words. Clinical prose register. No section heading.
      No Markdown syntax.

user_template: |
  Death datetime: ${death_datetime}
  Immediate cause: ${primary_cause_display} (${primary_cause_code})
  Disease pattern: ${disease_pattern}

  Using only the facts above, compose the "Terminal course" section
  body.
