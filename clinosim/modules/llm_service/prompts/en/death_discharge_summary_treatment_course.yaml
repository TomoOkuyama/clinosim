# RESERVED — Direct-invocation prompt for LLMService.generate(task_type=death_discharge_summary_treatment_course).
# NOT reached by the production narrative pipeline (which uses
# narrative_seed_bundle.yaml only, per replacement_strategy.py).
# Keep in sync with the corresponding _build_* template output shape
# if a downstream consumer wires it. Audit reference:
# docs/reviews/2026-08-30-llm-prompt-audit.md
task_type: death_discharge_summary_treatment_course
version: 2
max_tokens: 400
temperature: 0.3
description: |
  LLM generation prompt for the "Treatment course" section of the death
  discharge summary. Generates the summary directly from the structured
  CIF aggregate counts below (LOS, medication count, procedure count,
  working diagnoses, complications).

  v2 (2026-09-02, session 97 prompt audit): retired `${template_seed}`.
  Structured CIF facts + system-prompt format spec only. Sibling of
  narrative_seed.yaml v3.

system: |
  You are the attending physician writing the "Treatment course"
  section of a death discharge summary. Compose 1-3 sentences directly
  from the structured CIF aggregate facts below.

  Rules:
    - Use ONLY the facts provided. Do NOT invent specific drug or
      procedure names — the input carries counts, not names. Summarize
      as "multiple medications administered" / "several procedures
      performed" when only counts are available.
    - Preserve LOS and every count verbatim.
    - Mention every entry in `complications_occurred` (no reordering /
      addition / omission).
    - Under 100 words. Clinical prose register. No section heading.
      No Markdown syntax.

user_template: |
  Length of stay: ${los_days} days
  Medication orders administered: ${medication_count}
  Procedures performed: ${procedure_count}
  In-hospital working diagnoses: ${working_diagnosis_count}
  Complications: ${complications_occurred}

  Using only the facts above, compose the "Treatment course" section
  body.
