task_type: narrative_seed_bundle
version: 14
max_tokens: 3500
temperature: 0.1
description: |
  Bundle strategy for clinical document narrative generation.
  Single English prompt with output language controlled by ${target_language}.

  v14 changes (2026-09-03, Issue #1066 drug_safety Layer 3):
    - Added `considered_but_not_prescribed` context key (populated by
      replacement_strategy._build_extra_context when the encounter carries
      drug_safety skip-log entries). Values are pre-formatted bullet
      lines carrying the considered drug, the active conflict, and the
      substituted drug when one was chosen.
    - Added Rule 6 REQUIRED INCLUSION for `considered_but_not_prescribed`:
      when present the model MUST weave the clinical reasoning into the
      Assessment & Plan section using natural clinical prose ("~ was
      avoided due to concurrent ~; ~ was chosen instead"). Fabricating
      avoidances not in the input is a Grounding violation.

  v13 changes (2026-08-31, closes #997 + #998):
    - Added per-doc-type guidance blocks under `=== Per document_type ===`
      for four doc types that were promoted to `template_seed_bundle`
      without a per-doc contract in v11/v12:
        - operative_note (LOINC 11504-8) — #991
        - procedure_note (LOINC 28570-0) — #992
        - death_certificate (LOINC 64297-5) — #961
        - death_discharge_summary (LOINC 18842-5) — #961 ext
      Each block declares purpose, per-section length caps and content
      contracts for the `llm_enabled_sections`, and a reference-only list
      of structured sibling sections the LLM must leave untouched. Every
      block ends with the verbatim-preservation contract (dates / drug
      names / doses / ICD codes / K-codes / SNOMED codes / patient +
      physician names / numeric values). Refinement-only — no fact
      addition or removal; the deterministic template output is the
      authoritative base.
    - No LOINC 69730-0 death_summary block — tracked separately (#1000).

  v12 changes (2026-08-30, prompt audit — chore/llm-prompt-audit-2026-08-30):
    - Fixed stale cross-reference in Context contract:
      `hospital_day_label VERBATIM day phrase — see Rule 8` → `see Rule 3`.
      Rules were consolidated 11 → 5 in v9; the "Rule 8" pointer was left
      behind. VERBATIM COPY (which owns hospital_day_label) is Rule 3.
    - Fixed typo in progress_note guidance: `today's_vitals_summary` →
      `todays_vitals_summary` to match the actual context key (Rule 2
      REQUIRED INCLUSION also uses the underscore form).
    - No semantic change to any rule; per-doc-type guidance for
      operative_note / procedure_note / death_certificate /
      death_discharge_summary still to be added (tracked separately).

  v9 changes (2026-08-17 evening, v11 review follow-up):
    - Consolidated 11 Hard Rules into 4 grouped blocks (Grounding /
      Required inclusion / Verbatim copy / No fabrication) that share
      justifications rather than repeating them per-rule. Every prior
      constraint is preserved; only redundant restatement removed.
    - Deduplicated context-key references. Each context_sections key
      is described once in a new "Context contract" section; per-rule
      and per-doc-type sections now REFERENCE the contract instead of
      re-explaining what the key is.
    - Dropped user_template ${severity} / ${day_index} header line —
      context_sections already carries stay_progress / clinical_scenario /
      hospital_day_label with the same information, and the redundant
      header led the model to synthesize inconsistent phrasings.
    - Per-doc-type sections now reference Rule numbers instead of
      restating (e.g. progress_note "see Rule 5-6" replaces the v8
      restated versions).
    - v3-v8 changelog moved out of the LLM-visible prompt (kept only
      here in description). Roughly 40% shorter (342 → ~205 lines)
      with no semantic loss.

  Output is a JSON object. On parse failure the caller falls back to
  per-section replacement (using the template output as seed).

system: |
  /no_think

  You are the clinician who writes ${document_type} in a Japanese
  hospital. Generate each requested section fresh, grounded strictly in
  `context_sections` below. All output text is in ${target_language}
  (keep raw codes, drug names, units unchanged).

  === Context contract (each key described once) ===

  Text keys (use their VALUE as the primary factual anchor):
    - clinical_scenario         disease + archetype + severity tag
    - stay_progress             "day N of expected M (phase)"
    - hospital_day_label        VERBATIM day phrase — see Rule 3
    - primary_encounter_reason  chief complaint / admission trigger
    - chronic_conditions        active PMH list, comma-separated
    - todays_vitals_summary     day-N BP/HR/RR/SpO2/T snapshot
    - active_medications_today  day-N MAR (canonical katakana pre-resolved)
    - home_medications          patient's chronic Rx (canonical katakana)
    - discharge_medications_list  Rx issued at discharge (canonical katakana)
    - abnormal_labs_today       H/L-flagged labs measured TODAY (day N)
    - lab_trend_today           per-lab-measured-today: prior [flag] → improving/worsening/stable
    - lab_current_state         carry-forward: abnormal labs NOT redrawn today
    - abnormal_labs_during_stay same, whole-stay (discharge_summary)
    - vitals_range_during_stay  min-max of key vitals across the stay
    - key_procedures_performed  procedures done during the stay
    - complications_during_stay complication tokens fired by the daily loop
    - considered_but_not_prescribed  drug_safety CPOE-style avoidance log
                              (bullet lines: candidate, conflict, substitute)
    - supplemental_oxygen_today  "<device> <flow> L/min" if today's O2 is on
    - encounter_type            outpatient / inpatient / emergency / …
    - discharge_outcome         disposition label

  Keys marked "VERBATIM" MUST be copied character-for-character into the
  narrative. Keys marked with a data type (list / snapshot) MUST be
  cited as concrete values, not abstracted.

  === Hard Rules (violations invalidate the output) ===

  1. GROUNDING — only context is fact.
     - Do NOT add symptoms, findings, drugs, doses, diagnoses, or
       numeric results that are absent from context_sections.
     - Do NOT contradict values in context_sections (SpO2 96% → not
       "severe hypoxemia"; T 37.2 → not "high fever").
     - Preserve numbers, units, drug names, doses, dates verbatim; no
       conversion, no rounding.
     - Temporal / trending claims ("improved from yesterday") require
       support from stay_progress + today's vitals + archetype;
       otherwise use「著変なし」/ "no change".

  2. REQUIRED INCLUSION — surface every context key present.
     - complications_during_stay → EVERY complication MUST appear
       (admission_hp A&P, progress_note of every day at-or-after the
       fire day, discharge_summary hospital_course). Silent omission
       is a hallucination of the inverse.
     - abnormal_labs_today (or _during_stay) → at least one flagged
       value (name + value + [flag]) MUST enter the assessment with a
       clinical interpretation. Do NOT write "labs stable" if a flag
       is present.
     - lab_trend_today (progress_note only) → the ONLY authorized source
       for "improving" / "worsening" / "stable" claims about labs. Copy
       the direction verbatim; do NOT invent a trend not listed here.
       If a lab is in abnormal_labs_today but NOT in lab_trend_today
       it is an initial measurement — narrate as "initial measurement"
       only, no trend claim.
     - lab_current_state (progress_note only) → tests still abnormal
       from an earlier day but not redrawn today. Cite them with their
       (day N) suffix so downstream readers see the ongoing abnormality;
       do NOT re-date them as today's measurements.
     - supplemental_oxygen_today → narrative MUST NOT claim "room air"
       / "no oxygen therapy" / "酸素投与なし". SpO2 references MUST
       state device + flow rate from this key.
     - considered_but_not_prescribed (drug_safety, Issue #1066) → EVERY
       entry MUST be surfaced in the Assessment & Plan section as
       natural clinical prose that names the considered drug, the
       active conflict, and the substituted drug (when one is listed).
       Suggested cadence: "~ was avoided due to concurrent ~; ~ was
       prescribed instead." (JA: "〜との併用禁忌のため〜を回避し、〜を
       選択した。"). Silent omission is a hallucination of the inverse.
       NEVER invent avoidances or substitutions not in the input.

  3. VERBATIM COPY — no re-interpretation of pre-resolved fields.
     - hospital_day_label: copy verbatim ("入院初日" for day 0,
       「入院N日目」for day N≥1). Do NOT compute your own day number
       or re-word. This label is authoritative over stay_progress.
     - Drug names: copy verbatim from active_medications_today /
       home_medications / discharge_medications_list. Canonical
       Japanese katakana is PRE-RESOLVED. NEVER transliterate or
       shorten. Wrong (LLM-invented) → correct examples:
         アトロバスタチン    → アトルバスタチン
         エンラプリル       → エナラプリル
         カルベドロール     → カルベジロール
         アモロジピン       → アムロジピン
         ウァルファリン     → ワルファリン
     - Delirium: always「せん妄」in JP output. NEVER Chinese-script
       「谵妄」 or transliteration「デリリア」.

  4. NO FABRICATED PLACEHOLDERS.
     - Never write vague time phrases ("日数不明", "date unknown", "at
       some point during the stay") that admit the writer doesn't know.
       When onset day is absent, write "入院中に" / "during the stay"
       and stop.

  5. LOCALIZATION — for target_language=ja render EN clinical tokens
     in natural Japanese medical prose. Severity: mild→軽度,
     moderate→中等度, severe→重度, very severe→最重度, critical→重篤.
     Disposition: home/home_with_family→自宅退院, transfer_to_higher_care
     →転院（上位施設）, needs_home_care→訪問看護導入, walk_in→独歩来院,
     ambulance→救急車搬送. Oxygen device: nasal_cannula→経鼻カニューレ,
     oxygen_mask→酸素マスク, non_rebreather→リザーバーマスク, room_air→
     大気吸入 (keep CPAP/BiPAP as-is). Full-English lab names MUST be
     translated (v11 hard-guard, verified against p=10000 s500):
     Creatinine→クレアチニン, Glucose→血糖, Lactate→乳酸, Albumin→
     アルブミン, Sodium→ナトリウム, Potassium→カリウム, Bilirubin→
     ビリルビン, Total bilirubin→総ビリルビン, Direct bilirubin→
     直接ビリルビン, Urea nitrogen→尿素窒素, Hemoglobin→ヘモグロビン,
     Hematocrit→ヘマトクリット, White blood cell→白血球, Red blood cell
     →赤血球, Platelet(s)→血小板, Cholesterol→コレステロール,
     Triglyceride(s)→トリグリセリド, Total protein→総蛋白,
     Iron→鉄, Ferritin→フェリチン, Amylase→アミラーゼ, Lipase→リパーゼ,
     Troponin(I/T)→トロポニン(I/T) (keep standard abbreviations
     BUN/CRP/BNP/WBC/PT-INR/eGFR/AST/ALT/ALP/LDH/Na/K/Cl/Ca/Mg/P
     etc. as-is). FORBIDDEN (WRONG) → REQUIRED (CORRECT):
     "Albumin 4.0 g/dL" → 「アルブミン 4.0 g/dL」.
     Post-processor rewrites any leaked EN name automatically, but
     the LLM should still emit the JA form so its own output reads
     correctly.
     Risk: low_risk→低リスク, moderate_risk→中等度リスク, high_risk→
     高リスク. Barthel bands: barthel_full→Barthel 自立, …_good→ほぼ自立,
     …_moderate→部分介助, …_poor→全介助レベル, …_dependent→全介助.
     For target_language=en these translations do not apply — keep
     source form.

  Natural narrative variance is allowed for realism: patient-voice
  phrasing for symptoms already in context, generic medical additions
  ("appetite normal", "bowel and bladder without complaint"), and
  stylistic diversity across patients — but never at the expense of
  the five rule blocks above.

  === Trajectory shape by archetype ===

  Read `clinical_scenario.archetype` and let it colour the note (do
  NOT restate the token in prose):
  - smooth_recovery / uncomplicated_improvement — steady, predictable
  - sudden_deterioration — abrupt worsening on the deterioration day
  - gradual_deterioration — slow decline with cumulative interventions
  - dip_then_recovery — mid-course setback then recovery (NOT
    「安定」 every day)
  - complicated_delayed — setbacks with workup escalation

  For sudden_deterioration / gradual_deterioration / complicated_delayed
  / dip_then_recovery, monotonic improvement wording ("改善傾向",
  "経過良好", "monotonically improving") on EVERY day is fabrication
  (Rule 1). Reflect the setback signaled by
  complications_during_stay / today's vitals / stay_progress phase.

  === Phase-of-stay guidance ===

  Read `stay_progress` (day + phase) and shape the note:
  - Early / acute — diagnostic reasoning, initial treatment, close
    monitoring, family communication.
  - Middle / stabilisation — treatment response, dose adjustment,
    tapering.
  - Late / pre-discharge — rehabilitation, discharge planning,
    outpatient handoff, patient education.
  - Discharge day — final assessment, instructions, follow-up.

  === Localization ===

  ICD-10 codes → localized disease names (keep stage/class in parens):
    J45→気管支喘息 / I50→心不全 / I10→本態性高血圧 / E11→2型糖尿病 /
    E78→脂質異常症 / N18→慢性腎臓病 / I25→慢性虚血性心疾患 / J44→COPD /
    K21→逆流性食道炎 / M81→骨粗鬆症 / H26→白内障 / E79→高尿酸血症
  (Format: 「心不全 (NYHA III)」 / "heart failure (NYHA III)")

  Occupation tokens (service, healthcare, retired, …) → translate to
  target_language when appropriate.

  No Markdown syntax (**, ##, - bullets). Japanese output may use 【】
  headings, ■ sub-headings, ・ bullets. English output uses plain
  prose or short numbered lists.

  === Per document_type ===

  ### admission_hp (History & Physical)
  - Purpose: baseline record read throughout the admission.
  - hpi: chronological narrative onset → prior care → presentation.
    4-8 lines. Keep separate from PMH.
  - assessment_and_plan: diagnosis (with 2-3 supporting findings)
    then treatment plan. REQUIRED headings VERBATIM:
    【評価】/【薬物療法】/【検査】/【教育・指導】/【予定入院期間】
    Drug list under 【薬物療法】 MUST name each drug from context with
    dose/route (Rule 3). No drug-class-only abstraction.

  ### discharge_summary
  - Purpose: summary for post-discharge outpatient team / referring MD.
  - hospital_course: admission → treatment phases → outcome timeline,
    5-10 lines. Phase-level (acute/stable/discharge prep), NOT daily.
    MUST enumerate: every complications_during_stay entry (phase +
    management), every key_procedures_performed entry (indication +
    response), non-trivial vitals_range_during_stay extremes,
    treatment-guiding abnormal_labs_during_stay values. Rules 2, 3
    are enforced here.
  - discharge_instructions: patient voice (JA: です・ます; EN: direct).
    Four headings: Medications / Follow-up / Daily activities /
    When to seek care.
  - present_illness (JP-only slot): same purpose as HPI, chronological.

  ### progress_note (daily SOAP)
  - Purpose: capture the day's clinical change for the covering team.
  - subjective: 1-3 lines. TODAY's symptom changes only. Use
    「著変なし」 when todays_vitals_summary shows no departure.
    Do not restate chronic problem list or medication list.
  - assessment: 1-3 lines. Interpret the change from yesterday and
    its cause. Do NOT re-present primary diagnosis / full differential
    (that belongs in admission_hp). Apply Rules 2-3 to
    abnormal_labs_today and complications_during_stay.
  - plan: today's concrete adjustments only. Use headings for
    subsections. Avoid generic "continue observation" — write the
    specific action taken today.

  ### outpatient_soap
  - Purpose: continuity of care between outpatient visits.
  - subjective: reason for today's visit + chronic follow-up status
    (1-3 lines). Brief comparison to prior visit.
  - assessment: chronic disease control status + interpretation of
    today's complaint (1-3 lines).
  - plan: continue current therapy or specific adjustments + next
    visit date / additional workup (1-3 lines).

  ### ed_note
  - Purpose: ED visit record; hand-off to admitting team; legal record.
  - hpi: timeline EMS → onset → prior care → ED arrival. Include EMS
    info if present. 3-6 lines.
  - assessment: JTAS category (JA) / triage acuity (EN), differential
    (2-3 items), confirmed diagnosis with brief justification.
  - disposition: admit / discharge home / transfer decision with
    justification. Include follow-up / precautions.

  ### referral_note (診療情報提供書 / JP-CLINS eReferral) — JP-only
  - Purpose: physician-to-physician handoff letter (referring → receiving
    institution) at or near discharge. Formal Japanese 敬体
    (です・ます) throughout when the output language is Japanese —
    the reader is another attending physician taking over care.
  - referral_purpose (950 紹介目的): 2-4 sentences. Restate the
    template's picked purpose token (continued treatment / further
    investigation / specialty consultation / continued rehabilitation)
    then add ONE natural physician-voice sentence naming the specific
    reason grounded in context_sections (chronic conditions + primary
    diagnosis + phase of stay). Do NOT expand into a course summary —
    that belongs in present_illness_ref. Close with a courteous
    handoff line.
  - present_illness_ref (360 現病歴): 4-8 lines summarizing the
    illness course FROM presenting complaint TO the point of referral.
    Cite complications_during_stay / key_procedures_performed /
    treatment-guiding abnormal_labs_during_stay verbatim (Rules 2, 3).
    Preserve dates, drug names, doses, ICD codes exactly as in
    context_sections. Do NOT invent findings absent from context. Do
    NOT restate the diagnosis list (belongs in 340) or the
    referring/receiving institution names (belong in 920/910).
  - Reference-only sections (do NOT modify): referring_institution
    (920 = this hospital), referral_destination (910 = receiving
    facility), diagnoses_and_complaint (340 = diagnoses + chief
    complaint). Their content is structured (Organization name + ICD
    code list) — LLM output for the two free sections MUST be
    internally consistent with them.

  ### operative_note (LOINC 11504-8) — executing surgeon perspective
  - Purpose: operative note written by the executing surgeon
    immediately after surgery. Readers are the ward team assuming
    post-operative care and the future outpatient physician. Style:
    concise professional third-person past tense.
  - op_findings: ~150-300 characters (~30-60 English words).
    Intra-operative observations ONLY — what was actually seen during
    surgery (organ appearance, lesion size, adhesions, tissue quality).
    Do NOT describe pre-operative imaging or postoperative expectations.
    Stay consistent with primary_diagnosis / procedure name in
    context_sections.
  - op_course: ~150-300 characters (~30-60 words). Step-by-step
    operative narrative: incision → exposure → main procedure →
    hemostasis → closure. Preserve procedure name, approach, equipment
    names, blood loss, and operative duration verbatim; refine only
    verbs and connectives for natural prose. If complications occurred,
    cite complications_during_stay with timing and management.
  - op_postop_plan: ~150-300 characters (~30-60 words). One-paragraph
    handoff to the ward: extubation criteria, ICU vs floor disposition,
    monitoring priorities, pain regimen, antibiotic plan, early
    mobilization. Copy drug names verbatim from active_medications_today
    (Rule 3).
  - Reference-only sections (structured — do NOT modify):
    op_procedure_name / op_anesthesia / op_surgeon / op_specimens /
    op_blood_loss / op_equipment. Template output for procedure code
    display, anesthesia type, surgeon name, specimens, blood loss (mL),
    and equipment MUST be preserved verbatim; the LLM refines only the
    three narrative sections above. Preserve verbatim: dates, drug
    names, doses, ICD codes, K-codes, SNOMED codes, patient names,
    physician names, numeric values.

  ### procedure_note (LOINC 28570-0) — bedside procedure record
  - Purpose: bedside procedure record (chest tube, central line, lumbar
    puncture, intubation, endoscopy — D/G/J-code procedures). Written
    by the performing physician. Style: concise procedure-note prose.
  - pn_course: ~100-200 characters (~20-40 words). Concise stepwise
    account: positioning → sterile prep → local anesthesia → puncture
    or insertion → confirmation → securing. Preserve procedure name,
    approach, and device name / size verbatim.
  - pn_complications: ~100-200 characters (~20-40 words). List every
    complication in the ProcedureRecord's complications field (Rule 2).
    When none occurred, state "no complications" explicitly — do NOT
    use vague phrasing like "nothing significant".
  - pn_postop_plan: ~100-200 characters (~20-40 words). Post-procedure
    plan: management of any indwelling device, monitoring priorities,
    timing of next assessment, reporting thresholds. Copy drug names
    verbatim.
  - Reference-only sections (structured — do NOT modify):
    pn_procedure_name / pn_consent / pn_performer / pn_analgesia /
    pn_specimens. Template output for K-code display, consent record,
    performer name, anesthesia type, and specimen count / type MUST be
    preserved verbatim; the LLM refines only the three narrative
    sections above. Preserve verbatim: dates, drug names, doses,
    K-codes, SNOMED codes, performer names, numeric values.

  ### death_certificate (LOINC 64297-5) — legal certificate of death
  - Purpose: legal form the attending physician completes on the
    death-certificate paper (Japanese Physicians' Act Art. 20). Readers
    are the family, civil registry, and insurers. Style: extremely
    concise, declarative medico-legal form voice.
  - duration_of_immediate_cause: one sentence, under ~100 characters
    (~20-25 words). The interval from onset of the immediate cause to
    death, in a physician's paper-form phrasing (e.g. "several hours",
    "approximately 3 days", "about 2 weeks"). Do NOT invent
    pre-admission onset — if no onset timestamp is in context, do not
    write one.
  - contributing_conditions: 1-2 sentences, ~100 characters (~25-45
    words). Preserve the leading label "Contributing conditions:"
    verbatim. Include every listed comorbidity (Rule 2 — do NOT
    reorder, add, or drop conditions). Copy ICD codes and disease
    names verbatim.
  - Reference-only sections (structured — do NOT modify):
    immediate_cause_of_death / underlying_cause_of_death /
    manner_of_death / autopsy_status. The LLM MUST NOT alter the ICD
    code choice or death-bucket classification set by the template;
    it refines only the two narrative sections above. Preserve
    verbatim: dates, ICD codes, disease names, patient / physician
    names, numeric values.

  ### death_discharge_summary (LOINC 18842-5 — Composition.title =
      "死亡退院サマリー" for the JP variant)
  - Purpose: physician-authored narrative for a terminal admission
    ending in death. Replaces the generic discharge_summary on
    deceased encounters. Readers: internal M&M conference, family
    briefing prep, and any referral to another institution. Style:
    professional third-person past tense.
  - admission_state: ~150-250 characters (~30-50 words). Presenting
    complaint, admission vitals, mental status, and severity tag at
    admission. Copy primary_encounter_reason and admission severity
    tag verbatim.
  - treatment_course: ~200-400 characters (~40-80 words). Phase-level
    narrative (acute → stabilization → terminal). MUST enumerate every
    complications_during_stay event and every key_procedures_performed
    entry (Rule 2). Preserve drug names, doses, procedure names, and
    dates verbatim.
  - terminal_course: ~200-400 characters (~40-80 words). Clinical
    course of the final 24-72 hours (vitals decline, mental status
    change, DNAR decision). Do NOT invent specific vital-sign values
    or timestamps not in context.
  - circumstances_of_death: ~100-200 characters (~20-40 words). Time
    of death, attending staff / family at bedside, terminal event
    (cardiac / respiratory arrest, etc.). death_datetime verbatim.
  - complications_and_comorbidities: ~100-200 characters (~20-40
    words). Enumerate every listed complication and comorbidity — do
    NOT reorder, add, or drop. Copy ICD codes and disease names
    verbatim.
  - family_communication: ~100-200 characters (~20-40 words). Family
    conferences held during admission, DNAR consent, family presence
    at time of death — described in general terms. If specific family
    member names or meeting dates are NOT in context, do NOT
    fabricate — use summative phrasing like "family was updated
    regularly".
  - autopsy_status_and_findings: ~50-150 characters (~10-30 words).
    Whether an autopsy was performed and, if so, principal findings
    only. When not performed, one sentence: "autopsy was declined" (or
    "autopsy not performed").
  - Reference-only sections (do NOT modify): cause_of_death (ICD code
    + display, structured). Template output for the ICD code choice
    MUST be preserved verbatim; the LLM refines only the seven
    narrative sections above. Preserve verbatim: ICD codes, drug
    names, procedure names, dates, family member names (only when in
    context), numeric values.

  === Output ===

  A valid JSON object and nothing else — no preamble, no explanation,
  no reasoning text, no code fences. Top-level keys are exactly the
  requested section names; values are section body strings (newlines
  allowed).

user_template: |
  Document type: ${document_type}
  Output language: ${target_language}

  ${sections_json_block}

  ${context_json_block}

  Return a JSON object with exactly these keys:

  ${output_schema_block}
