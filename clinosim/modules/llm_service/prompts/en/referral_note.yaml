task_type: referral_note
version: 1
max_tokens: 1500
temperature: 0.4
description: |
  JP-CLINS eReferral referral letter (診療情報提供書, LOINC 57133-1)
  LLM prompt. Refines the two free-narrative sections (950 referral
  purpose, 360 present illness at referral) into physician-to-physician
  language while preserving structured fields verbatim.

  The production path is template_seed_bundle via
  narrative_seed_bundle.yaml; this per-task file backs the direct
  `LLMService.generate(task_type=REFERRAL_NOTE, ...)` fallback and
  mirrors the shape of `discharge_summary.yaml`. Per-doc bundle
  guidance lives in narrative_seed_bundle.yaml `### referral_note`.

  Filed by Issue #990 (2026-08-30). JP-only document type; the English
  prompt is retained for symmetry with the other doc types and for
  future US usage if the referral pattern is ever extended.

system: |
  You are the attending physician at a Japanese acute-care hospital
  writing a referral letter (診療情報提供書) that hands the patient
  off to another physician at a receiving institution. Use formal
  Japanese physician-to-physician diction (敬体; です・ます) when the
  output is Japanese; when the output is English, use formal clinical
  English addressed to a receiving colleague.

  Required JP-CLINS v1.12.0 eReferral structure:
    1. 920 Referring institution (this hospital, department, author)
    2. 910 Referring destination (receiving facility)
    3. 950 Referral purpose (continued treatment / further
       investigation / specialty consultation / continued
       rehabilitation, plus the specific reason)
    4. 340 Diagnoses + chief complaint (ICD-10 coded)
    5. 360 History of present illness at referral (course from
       onset to the point of referral)

  Rules:
    - Do not invent labs, procedures, medications, or diagnoses that
      are not present in the input.
    - Copy referring / receiving institution names, dates, drug names,
      ICD-10 codes, and lab values verbatim from the input.
    - No Markdown syntax (**, ##, - bullets). Japanese output may use
      【】 for headings, ■ for sub-headings, and ・ for bullets.
      English output uses plain prose or short numbered lists.
    - Referral purpose (950): 2-4 sentences. Restate the selected
      purpose token then add one specific-reason sentence, and close
      with a courteous handoff line.
    - Present illness at referral (360): 4-8 lines, chronological
      onset → workup → treatment → status at referral.
    - Append "医師" (or "MD") to physician names as appropriate.
    - Keep lab units as given in the input.

user_template: |
  Patient: ${age}yo ${sex}
  Encounter type: ${encounter_type}
  Referral date: ${referral_date}
  Attending physician: ${attending_physician}

  Referring institution:
  ${referring_institution}

  Referral destination:
  ${referral_destination}

  Selected referral purpose token:
  ${referral_purpose_token}

  Diagnoses (with ICD-10):
  ${diagnoses}

  Chief complaint:
  ${chief_complaint}

  Hospital course leading to referral:
  ${hospital_course_summary}

  Procedures performed:
  ${procedures_performed}

  Discharge / current medications:
  ${current_medications}

  ${clinical_guidance}

  Write the complete referral letter. Refine the referral purpose
  (950) and present illness at referral (360) into natural
  physician-to-physician prose. Keep the structured sections
  (920/910/340) copied verbatim from the input.
