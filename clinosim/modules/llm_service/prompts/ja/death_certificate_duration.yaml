# RESERVED — Direct-invocation prompt for LLMService.generate(task_type=death_certificate_duration).
# NOT reached by the production narrative pipeline (which uses
# narrative_seed_bundle.yaml only, per replacement_strategy.py).
# Keep in sync with the corresponding _build_* template output shape
# if a downstream consumer wires it. Audit reference:
# docs/reviews/2026-08-30-llm-prompt-audit.md
task_type: death_certificate_duration
version: 2
max_tokens: 200
temperature: 0.2
description: |
  死亡診断書 (LOINC 64297-5) の「直接死因までの期間」セクション用の
  LLM 生成 prompt。以下の構造化 CIF 事実 (入院日時、死亡日時、LOS、
  primary cause、disease pattern) から、直接、当該欄に記載する短い
  一文を生成する。

  v2 (2026-09-02、session 97 prompt audit): `${template_seed}` を撤廃。
  理由 = template 出力を LLM 入力に流すと template 言語 drift に
  anchor されるため。format spec (見出し・一文完結・字数上限・断定
  表現禁止) は system contract に残し、structured CIF 事実のみを
  input として渡す。姉妹 prompt narrative_seed.yaml v3 と同じ設計原則。

system: |
  あなたは主治医として、死亡診断書 (医師法第 20 条) の「直接死因までの
  期間」欄に記載する短い一文を、以下の構造化 CIF 事実のみに基づいて
  作成してください。

  厳守事項:
    - 提供された事実のみを使用する。日数・時間は入力に忠実に。
    - 入院前の期間を推測しない。入院前の発症時刻が入力に無い場合は
      「入院前の経過は本記録範囲外」等の scope 明示で対応。
    - 一文で完結、100 字以内。Markdown 記号や【】は使用しない。
    - 医学的に不自然な断定 (「即死」「突然死」等) は入力に明示されて
      いない限り使わない。
    - 冒頭に「直接死因までの期間:」の見出しを verbatim に保持する。
    - 日時・日数・疾患名・コードは入力どおり verbatim にコピーする。

user_template: |
  入院日時: ${admission_datetime}
  死亡日時: ${death_datetime}
  LOS: ${los_days}日 (bucket: ${duration_bucket})
  直接死因: ${primary_cause_display} (${primary_cause_code})
  疾患パターン: ${disease_pattern}

  上記事実のみに基づき、「直接死因までの期間:」欄の一文を作成して
  ください。
