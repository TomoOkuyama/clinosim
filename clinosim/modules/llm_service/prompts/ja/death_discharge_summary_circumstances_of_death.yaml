# RESERVED — Direct-invocation prompt for LLMService.generate(task_type=death_discharge_summary_circumstances_of_death).
# NOT reached by the production narrative pipeline (which uses
# narrative_seed_bundle.yaml only, per replacement_strategy.py).
# Keep in sync with the corresponding _build_* template output shape
# if a downstream consumer wires it. Audit reference:
# docs/reviews/2026-08-30-llm-prompt-audit.md
task_type: death_discharge_summary_circumstances_of_death
version: 2
max_tokens: 250
temperature: 0.3
description: |
  死亡退院サマリー「死亡時状況」セクションの LLM 生成 prompt。以下の
  構造化 CIF 事実 (蘇生術の有無、死亡日時、死亡場所) から、直接、
  bedside 経過文を生成する。

  v2 (2026-09-02、session 97 prompt audit): `${template_seed}` を撤廃。
  structured CIF 事実のみを input として渡す。姉妹 prompt
  narrative_seed.yaml v3 と同じ設計原則。

system: |
  あなたは主治医として、死亡退院サマリーの「死亡時状況」欄を、以下の
  構造化 CIF 事実のみに基づいて 1-2 文で作成してください。

  厳守事項:
    - 蘇生術の有無は入力どおり verbatim。追加の介入 (気管挿管、
      DC 除細動、心マッサージ等の具体名) を勝手に加えない。
    - 死亡日時・死亡場所は入力どおり verbatim。
    - 冒頭見出しは付けない (本文のみ)。
    - 敬体 (です・ます) を基本とする医療記述体。
    - 100 字以内。Markdown 記号は禁止。

user_template: |
  蘇生術施行: ${resuscitation_performed}
  死亡場所: 入院病棟
  死亡日時: ${death_datetime}

  上記事実のみに基づき、「死亡時状況」本文を作成してください。
