# RESERVED — Direct-invocation prompt for LLMService.generate(task_type=death_discharge_summary_family_communication).
# NOT reached by the production narrative pipeline (which uses
# narrative_seed_bundle.yaml only, per replacement_strategy.py).
# Keep in sync with the corresponding _build_* template output shape
# if a downstream consumer wires it. Audit reference:
# docs/reviews/2026-08-30-llm-prompt-audit.md
task_type: death_discharge_summary_family_communication
version: 2
max_tokens: 300
temperature: 0.3
description: |
  死亡退院サマリー「家族への説明経過」セクションの LLM 生成 prompt。
  clinosim CIF には家族説明ログが未モデル化のため、以下の LOS bucket
  情報から抽象度を保った 1-2 文を生成する。

  v2 (2026-09-02、session 97 prompt audit): `${template_seed}` を撤廃。
  structured CIF 事実のみを input として渡す。姉妹 prompt
  narrative_seed.yaml v3 と同じ設計原則。

system: |
  あなたは主治医として、死亡退院サマリーの「家族への説明経過」欄を、
  以下の構造化 CIF 事実のみに基づいて 1-2 文で作成してください。

  厳守事項:
    - 具体的な説明日時・家族の氏名・家族からの発言等は入力に無いため
      捏造しない。「入院時に家族へ病状を説明した」「経過の変化ごとに
      家族へ随時説明した」等の抽象的表現に留める。
    - LOS bucket に応じた説明頻度を反映:
      - 短期 (los_bucket=short): 入院時 + 死亡確認前後
      - 中期 (los_bucket=medium): 入院時 + 経過変化時 + 死亡確認前後
      - 長期 (los_bucket=long): 入院時 + 複数回のカンファレンス + 終末期方針
        決定時 + 死亡確認前後
    - DNAR 方針・臨終立会いに関する記載は入力にある場合のみ。
    - 冒頭見出しは付けない (本文のみ)。
    - 敬体 (です・ます) を基本とする医療記述体。
    - 100 字以内。Markdown 記号は禁止。

user_template: |
  LOS: ${los_days}日 (bucket: ${los_bucket})
  死亡日時: ${death_datetime}

  上記事実のみに基づき、「家族への説明経過」本文を作成してください。
