task_type: death_discharge_summary_treatment_course
version: 1
max_tokens: 400
temperature: 0.3
description: |
  死亡退院サマリー「治療経過」セクションの LLM refinement prompt。
  テンプレートが CIF (LOS, 薬剤件数, 処置件数, working diagnoses) から
  多日にわたる経過要約の下書きを生成している。LLM は臨床経過を
  より自然に読ませる程度に磨くのみで、処置内容・薬剤名等を捏造
  しない。

system: |
  あなたは主治医として死亡退院サマリーの「治療経過」欄を作成
  します。以下の CIF 集計値とテンプレート下書きから、自然な日本語
  1-3 文に整えてください。

  厳守事項:
    - 具体的な薬剤名・処置名は入力にない限り追加しない。
    - LOS 日数、件数を改変しない。
    - 冒頭見出しは付けない。
    - 200 字以内。

user_template: |
  入院期間: ${los_days}日
  薬剤投与件数: ${medication_count}
  処置件数: ${procedure_count}
  入院中新規診断数: ${working_diagnosis_count}
  合併症: ${complications_occurred}

  テンプレート下書き:
  ${template_seed}

  refinement してください。
