task_type: narrative_seed
version: 3
max_tokens: 1500
temperature: 0.1
description: |
  Per-section narrative generation fallback prompt (Idea D lineage、
  Tier 1 #3 master plan §3)。`apply_replacement_strategy` が
  `_apply_template_seed_bundle_strategy` の bundle LLM response が
  JSON parse 失敗した際の FALLBACK path として使用する — bundle 1 call
  → per-section N calls。`DocumentTypeSpec.stage2_strategy=template_seed`
  も同じ path に dispatch されるが、`document_type_specs.yaml` の各
  doc type は現在いずれも primary strategy として使用していない。

  v3 (2026-09-02、session 97 prompt double-check):
  `${template_text}` seed 変数を撤廃。理由 = template 出力は JP で
  言語 drift が起きうる (p=10000 JP verify で 34,908 の template
  生成 sections が英語 emit、JA 期待場所)。この drift を LLM prompt
  に `TEMPLATE SEED` として渡すと、system instruction の言語再指示
  にも関わらず LLM が wrong-language phrasing に anchor される。
  v3 では `narrative_seed_bundle.yaml` の「context_sections から
  fresh generation」contract を per-section に mirror — caller は
  bundle prompt に渡す structured `context_sections` bundle と
  同じものをこの per-section fallback にも渡し、対象 section 名を
  1 つ指定する。この修正で fallback path も
  `_apply_template_seed_bundle_strategy` docstring 記載の設計原則
  「the template output for LLM-eligible sections is no longer
  passed as a rewrite seed」と整合する。

  v2 (β-JP-1 chain 1b T5): contract 強化 — 事実・数値・薬剤名の
  保持と出力形式の規約を明文化。違反は
  `clinosim check-narratives` (semantic_check.py) が検出・FAIL する。

system: |
  あなたは提供された構造化患者情報のみから臨床文書の 1 セクションを
  記載する医師です。セクション本文を新規に記述してください — テンプ
  レートの言い回しを引き写さず、caller が明示的に許可していない文字列
  を貼り付けないでください。

  契約事項(違反した出力は使用不能となります):
    - caller が送信した `context_sections` payload に含まれる事実
      のみを使用してください。同 payload に無い所見・数値・薬剤・
      イベント・日付を創作しないでください。
    - `context_sections` 中の数値(バイタル・検査値・用量・日数)は
      一字一句そのまま保持し、単位変換をしないでください。薬剤名・
      疾患コードも表記どおり保持してください。薬剤名を音写・省略
      しないでください。
    - `context_sections` の値と矛盾する記述を書かないでください
      (SpO2 96% → 「重度低酸素血症」等は違反、T 37.2 → 「高熱」等は違反)。
    - 診療記録としての文体を保ち、簡潔に記述してください。患者向け
      説明文(退院指導等)は敬体(です・ます調)で記述してください。
    - 生成後のセクション本文のみを返してください。前置き・説明・
      メタ発言(AI であることへの言及等)・見出し・Markdown 記号
      (**、##、-等)・code fence は禁止です。日本の電子カルテ形式に
      従い、見出しが必要な場合のみ【】を、小見出しは■を、箇条書き
      は「・」を使用してください。
    - 日本語で記載してください。

user_template: |
  Section: ${section}
  Patient severity: ${severity}. Day of care: ${day_index}.

  ${context_json_block}

  上記の事実のみに基づいて、指定されたセクションの本文を新規に
  記述してください:
