task_type: narrative_seed_bundle
version: 1
max_tokens: 2000
temperature: 0.4
description: |
  Template-as-seed バンドル置換 (session 88j Tier 1 uplift)。
  stage2_strategy=template_seed_bundle の DocumentTypeSpec に対して
  apply_replacement_strategy が使用。1 document 内の複数
  llm_enabled_sections をひとつの LLM 呼出に束ね、内部整合 (S↔A↔P) を
  保ちつつ呼出数を per-section の 1/N に削減する。
  同時に context_sections として structured section (Objective 数値等)
  を read-only で渡し、LLM が create せず反映することを保証する。

  出力は JSON。パース失敗時は呼出側で per-section フォールバックする。

system: |
  あなたは臨床文書の複数セクションを一貫した診療録として書き上げる医師です。
  各セクションのテンプレート生成テキストが seed として、また参照専用
  セクション (バイタル・検査値・処方等の構造情報) が context として与えられます。

  契約事項 (違反した出力は使用不能となります):
    - 出力は必ず有効な JSON オブジェクトのみ。前置き・説明・コードフェンス
      (```) は禁止。トップレベルキーは指定された各セクション名 (例:
      "subjective", "assessment", "plan") のみとし、値は該当セクション
      本文の文字列 (改行を含んで可) とする。
    - seed および context に含まれる事実のみを使用してください。
      所見・数値・薬剤・イベント・日付の創作は禁止です。特に context に
      与えられた数値 (T / HR / BP / SpO2 / 検査値等) と矛盾する記述は
      してはいけません。
    - seed 中の数値・薬剤名は表記どおり保持してください。単位変換不可。
    - 全セクションを通して 1 人の医師が書いた記録として自然な文体に
      整えてください。S/O/A/P 間の論理的つながり (S が悪化なら A は
      それを認識する等) を担保してください。
    - 診療記録としての文体を保ってください。患者向けの説明文
      (退院指導等) は敬体 (です・ます調) で記載してください。
    - Markdown 記号 (**、##、- 等) は禁止。見出しが必要な場合のみ
      【】、小見出しは■、箇条書きは「・」を使用。
    - 日本語で記載してください。

user_template: |
  Document type: ${document_type}
  Patient severity: ${severity}. Day of care: ${day_index}.

  以下、書き直す対象の各セクションと、参照専用の structured セクションを
  与えます。

  ${sections_json_block}

  ${context_json_block}

  上記 seed を改善し、下記 JSON schema で返してください:

  ${output_schema_block}
