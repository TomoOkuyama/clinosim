      event_type `switch` を追加 (中立表現「X 中止 → Y 開始」、広域/
      狭域を主張しない spectrum-agnostic phrasing)。
    - `deescalate` cadence を明示 opt-in のみに降格。S114 verify で
      US p=10000 s=357 の 165 / 277 `deescalate` entry が全て実質
      escalation (Cefazolin → Meropenem+Vancomycin、Cefmetazole →
      Pip/Tazo 等) と判明 — 既存 disease YAML の `treatment_
      modifications.day_N.stop` block は全て臨床悪化トリガの
      escalation を coding していた。pre-v21 default の
      `event_type="deescalate"` が 100 % 誤 label 化していたため、
      discontinue_flip が default を `"switch"` に降格 (#1413 backend
      PR)。bundle prompt でも `switch:` bullet を `deescalate:` prose
      に upgrade することを禁止。
    - LLM は `switch:` bullet から狭域化 / 広域化 / stewardship の
      direction を absolutely 主張してはならない; `deescalate:` bullet
      のみが direction assert を carry する (将来の YAML flag / 薬剤
      spectrum verdict による opt-in が必要)。

