  Bundle strategy for clinical document narrative generation.
  Locale-authored prompt — `prompt_registry.get("narrative_seed_bundle", language)`
  selects `prompts/{en,ja}/narrative_seed_bundle.yaml`. The `${target_language}`
  header echoes the caller's language for the LLM's JSON parser; per-locale
  rule tables and per-doc-type blocks are authored in the locale-specific
  file (this JA file is canonical for JP output; EN file for US output).
  The stale pre-v17 doc-string that claimed a "Single English prompt with
  output language controlled by ${target_language}" was accurate only
  through session-88j v9; the JA file has been the canonical JP source
  since v11 (Rule 5 D lab hard-guard onward).

  v21 changes (2026-09-14, session S114 verify follow-up, Issue #1413):
