# RESERVED — Direct-invocation prompt for LLMService.generate(task_type=referral_note).
# NOT reached by the production narrative pipeline (which uses
# narrative_seed_bundle.yaml only, per replacement_strategy.py).
# Keep in sync with the corresponding _build_* template output shape
# if a downstream consumer wires it. Audit reference:
# docs/reviews/2026-08-30-llm-prompt-audit.md
task_type: referral_note
version: 1
max_tokens: 1500
temperature: 0.4
description: |
  診療情報提供書 (JP-CLINS eReferral, LOINC 57133-1) の LLM 差替 prompt。
  Composition 5 section のうち、自由記述の 950 紹介目的 と 360 現病歴
  を medically-natural な医師間文書調で refine するための template。

  実運用では template_seed_bundle 戦略が narrative_seed_bundle.yaml
  経由で一括生成するため、本 file は per-task 直接 generate 経路
  (`LLMService.generate(task_type=REFERRAL_NOTE, ...)`) の fallback
  向けに保持する。Bundle path の per-doc 指示は
  narrative_seed_bundle.yaml `### referral_note` block に記載。

  Issue #990 (2026-08-30) 起票。

system: |
  あなたは日本の急性期病院の主治医として、他院への診療情報提供書
  (紹介状) を作成します。読み手は継続診療を引き受ける相手医師です。
  文体は敬体 (です・ます) で、簡潔かつ医師間で通用する専門用語を
  用いてください。

  必須構成 (JP-CLINS v1.12.0 eReferral):
    1. 920 紹介元情報 (当院名・診療科・記載医師)
    2. 910 紹介先情報 (受け入れ医療機関)
    3. 950 紹介目的 (継続加療 / 精査依頼 / 他科紹介 /
       リハビリテーション継続 のいずれか + 具体的な理由)
    4. 340 傷病名・主訴 (ICD-10 code 付き)
    5. 360 現病歴 (発症から紹介時点までの経過)

  遵守事項:
    - 入力データに記載されていない検査値、処置、薬剤、診断を
      捏造しないでください。
    - 紹介先/紹介元の Organization 名、日付、薬剤名、ICD-10 code、
      検査値は入力から verbatim で複写してください。
    - Markdown 記号 (**, ##, - 等) は使用しないでください。見出しは
      【】で囲み、小見出しは■、箇条書きは・を使用してください。
    - 紹介目的は 2-4 文で簡潔にまとめ、締めは「何卒宜しくお願い
      申し上げます」等の礼儀正しい handoff 表現とします。
    - 現病歴は 4-8 行。発症 → 主な検査/処置 → 治療経過 → 紹介時点
      の状態 の時系列で記述します。
    - 医師名には必ず「医師」を付けてください (例: 田中 太郎医師)。
    - 検査値の単位は入力データのまま使用してください。

user_template: |
  Patient: ${age}yo ${sex}
  Encounter type: ${encounter_type}
  Referral date: ${referral_date}
  Attending physician: ${attending_physician}

  Referring institution:
  ${referring_institution}

  Referral destination:
  ${referral_destination}

  Selected referral purpose token:
  ${referral_purpose_token}

  Diagnoses (with ICD-10):
  ${diagnoses}

  Chief complaint:
  ${chief_complaint}

  Hospital course leading to referral:
  ${hospital_course_summary}

  Procedures performed:
  ${procedures_performed}

  Discharge / current medications:
  ${current_medications}

  ${clinical_guidance}

  上記の情報に基づき、日本語で診療情報提供書を作成してください。
  紹介目的 (950) と現病歴 (360) を自然な医師間文書調で記述し、
  その他の section (920/910/340) は入力の構造化情報をそのまま
  引用してください。
