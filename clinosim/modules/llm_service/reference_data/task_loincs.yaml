# task_loincs.yaml — LLMTaskType → LOINC document type code.
#
# Consumed by `clinosim/modules/llm_service/engine.py` (`DOCUMENT_LOINC`).
# The emit site resolves each narrative task to its LOINC document
# code, which later lands on `Composition.type.coding[]` or
# `DocumentReference.type.coding[]` on the generated FHIR resource.
#
# Document types are not listed: `DOCUMENT_LOINC` takes their codes from
# `document_type_specs.yaml`, their one definition (Issue #2344), and the
# loader rejects a document type repeated here. Only tasks outside the
# document pipeline appear (`DEATH_SUMMARY` is a template-only task fired
# inside `_death_summary_template`).
#
# LOINC codes sourced from Regenstrief LOINC Reference
# (https://loinc.org/); α-min-2 additions NLM-verified 2026-07.
#
# Membership policy:
#   * one row per LLMTaskType that has a LOINC document code
#   * TASK types that are judgment (DIAGNOSTIC_REASONING, etc.) or
#     non-document narrative (CHIEF_COMPLAINT, ED_TRIAGE_NOTE's
#     siblings) MUST NOT appear here — the sync test enforces that
#     every DOCUMENT_LOINC key is a NARRATIVE task

metadata:
  kind: reference
  source: >-
    clinosim/modules/llm_service/engine.py (DOCUMENT_LOINC) prior to
    hardcoded-review Phase A10. Document-pipeline types come from
    document_type_specs.yaml (Issue #2344).

loincs:
  # Document types take their code from document_type_specs.yaml (Issue
  # #2344); only tasks outside the document pipeline are listed here.
  death_summary: '47046-8'                # Summary of Death Note (template-only, Issue #2807)
