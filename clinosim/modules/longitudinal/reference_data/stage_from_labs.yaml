# Chronic stages the latest simulated lab result states (Issue #3273).
# Read by modules/longitudinal/stage_refresh.py, which rewrites
# `chronic_conditions[].stage` of each record from the latest result (up to the
# end of the record) of the stage's lab, so the stored stage and the labs of
# the same record agree.
#
# ckd: the KDIGO CKD G category of the latest eGFR (mL/min/1.73 m2), for an
#   N18 problem. Source: KDIGO 2024 Clinical Practice Guideline for the
#   Evaluation and Management of CKD, Kidney Int 2024;105(4S), Table 2 "GFR
#   categories in CKD" (read in the guideline PDF): G1 >= 90, G2 60-89,
#   G3a 45-59, G3b 30-44, G4 15-29, G5 < 15. `min_egfr` is the lower bound of
#   each category, descending. `format` writes the stored label ("CKD G3a").
#   When a patient has no eGFR result, the eGFR is calculated from the serum
#   creatinine result (`creatinine_lab`, in `creatinine_unit`) with the
#   country's equation (modules/physiology/egfr.py, locale/<cc>/egfr_equation.yaml),
#   as a laboratory reports it (Issue #3466); an eGFR result measured at the
#   same time as a creatinine is the one used.
# hba1c: a diabetes problem whose stored stage is an HbA1c ("HbA1c 7.2%";
#   `prefix`) is restated from the latest HbA1c result, at `decimals`.
metadata:
  kind: reference
  name: stage_from_labs
  source: clinosim

ckd:
  icd_base: N18
  lab: eGFR
  creatinine_lab: Creatinine
  creatinine_unit: mg/dL
  format: "CKD {stage}"
  stages:
    - {min_egfr: 90, stage: G1}
    - {min_egfr: 60, stage: G2}
    - {min_egfr: 45, stage: G3a}
    - {min_egfr: 30, stage: G3b}
    - {min_egfr: 15, stage: G4}
    - {min_egfr: 0, stage: G5}

hba1c:
  lab: HbA1c
  prefix: "HbA1c"
  decimals: 1
