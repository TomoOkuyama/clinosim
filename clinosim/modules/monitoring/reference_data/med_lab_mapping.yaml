# Chronic-medication-driven monitoring lab mapping (Issue #757).
#
# For each mapping entry:
#   ``drugs`` / ``classes`` — catalog drug ids and / or catalog drug classes
#                   (codes/data/drugs.yaml). A medication matches by its
#                   drug_id (or the drug its name resolves to); brand and
#                   Japanese names are catalog aliases (Issue #2371).
#   ``labs``     — canonical clinosim lab-analyte names appended to the
#                   visit's ``visit_labs`` list when the patient carries a
#                   matching medication. Names must exist in
#                   ``BASELINE_LAB_NORMALS`` or be modelled in
#                   ``derive_lab_values`` so the outpatient emit loop does
#                   not silent-drop them (feedback_semantic_correctness_over_coverage).
#   ``per_visit_probability`` — fraction of chronic-followup visits at which
#                   the monitoring lab fires. 1.0 = every visit; use lower
#                   values for labs whose real cadence is longer than the
#                   patient's typical follow-up interval (e.g. HbA1c q3-6mo
#                   on a q2mo INR schedule).
#
# Priority-ordered per Issue #757's clinical-importance × prevalence table.

medication_lab_mapping:
  # Warfarin — every-visit INR is the maintenance standard-of-care (2-4 wk
  # cadence for stable patients, more frequent during dose titration).
  # Closes #736 (US warfarin PT-INR 0-observation gap).
  warfarin:
    drugs: [warfarin]
    labs: [PT_INR]
    per_visit_probability: 1.0

  # Levothyroxine — TSH 6-8 weeks after dose change, then annual. Approximated
  # here as ~50 % of chronic-followup visits since most clinics group with
  # the primary condition follow-up rather than a dedicated thyroid visit.
  levothyroxine:
    drugs: [levothyroxine]
    labs: [TSH]
    per_visit_probability: 0.5

  # Diabetes oral (metformin as sentinel) + insulin — HbA1c q3-6mo. Standard
  # ADA / JDS diabetes-monitoring cadence.
  metformin:
    drugs: [metformin]
    labs: [HbA1c]
    per_visit_probability: 0.5

  insulin:
    drugs: [insulin, insulin_aspart, insulin_glargine, insulin_lispro, insulin_regular_human, sliding_scale_insulin]
    labs: [HbA1c]
    per_visit_probability: 0.5

  # Digoxin — Digoxin level q1-2wk after dose change, then q6-12mo. Also
  # requires K+ and Cr monitoring (both physiology-modeled → they emit
  # via the existing chronic-followup labs, but we add here explicitly
  # so digoxin patients get the pair even at non-cardiac visits).
  digoxin:
    drugs: [digoxin]
    labs: [Digoxin, K, Creatinine]
    per_visit_probability: 0.5

  # Statin — LFTs (ALT/AST) baseline + as clinically indicated. Real
  # cadence is once at start + q6-12mo; approximate as ~25% of visits.
  statin:
    classes: [statin]
    labs: [ALT, AST]
    per_visit_probability: 0.25

  # ACE-i / ARB / diuretic — K+ and Cr 1-2wk after start, then q6-12mo.
  # Cadence is longer than typical HTN follow-up (q2-3mo), so probability
  # weighted below 1.0.
  ace_arb_diuretic:
    classes: [acei_arb, diuretic]
    labs: [K, Creatinine]
    per_visit_probability: 0.4

  # Lithium — Li level + TSH + Cr every 6-12mo. Toxic window is narrow;
  # missed monitoring is a real prescribing-safety concern.
  lithium:
    drugs: [lithium_carbonate]
    labs: [Lithium, TSH, Creatinine]
    per_visit_probability: 0.35

  # Immunosuppressant — drug trough level per-visit. Post-transplant care
  # requires trough monitoring at every clinic visit while active.
  tacrolimus:
    drugs: [tacrolimus]
    labs: [Tacrolimus, Creatinine, K]
    per_visit_probability: 1.0

  ciclosporin:
    drugs: [ciclosporin]
    labs: [Ciclosporin, Creatinine, K]
    per_visit_probability: 1.0
