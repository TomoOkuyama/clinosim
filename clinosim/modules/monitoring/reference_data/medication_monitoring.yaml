# Chronic-medication → standard-of-care monitoring lab mapping (Issue #757).
#
# Schema (per drug entry):
#   <Drug canonical name>:
#     aliases:        [<optional additional names, case-insensitive substring match>]
#     monitoring:
#       - lab:        <internal analyte name — matches clinosim/modules/observation/engine.py>
#         loinc:      "<LOINC code — emitted as Order.display and Observation.code.coding>"
#         rationale:  "<one-sentence clinical justification>"
#
# The enricher (`clinosim/modules/monitoring/enricher.py`) matches the drug name
# and every alias against each entry in `patient.current_medications` via
# case-insensitive substring — the same pattern used by
# `physiology.engine._WARFARIN_NAMES` — so "Warfarin 3mg PO" and "ワルファリン"
# both match the Warfarin entry.
#
# Adding a new drug → labs pair is a pure YAML edit; no code change required.
# Frequency / scheduling knobs (daily vs monthly, induction vs maintenance)
# are NOT in the schema yet — pass 2 of Issue #757 ships one injection per
# eligible encounter. Follow-up PRs will introduce `frequency:` handling.

mappings:
  Warfarin:
    aliases: ["ワルファリン", "coumadin"]
    monitoring:
      - lab: PT_INR
        loinc: "6301-6"
        rationale: "Anticoagulation therapeutic monitoring — INR target 2.0-3.0 (or 2.5-3.5 for mechanical valves)."

  Levothyroxine:
    aliases: ["レボチロキシン", "synthroid", "levoxyl", "レボチロキシンナトリウム"]
    monitoring:
      - lab: TSH
        loinc: "3016-3"
        rationale: "Thyroid replacement titration — TSH target 0.5-4.0 mIU/L (broader in older adults). ATA / JES guideline: 6-8 weeks after any dose change, then every 6-12 months once stable."

  # DM oral hypoglycemics + insulins — both trigger the same HbA1c monitoring.
  # Kept as two separate entries (not merged as aliases) because they are
  # semantically distinct drug classes with their own aliases; a future PR that
  # introduces a `drug_class:` bundling schema can collapse them if the pattern
  # scales beyond DM. Note: HbA1c is physiology-modeled and derived from
  # glycemic_control when has_diabetes=True (see physiology/engine.py:895), so
  # DM patients emit realistic values (6-10% range typical); non-DM patients
  # accidentally on a DM drug would emit the ~5.5% age-adjusted non-DM baseline.
  Metformin:
    aliases: ["メトホルミン"]
    monitoring:
      - lab: HbA1c
        loinc: "4548-4"
        rationale: "Chronic glycemic control monitoring — HbA1c target <7% (ADA/JDS individualized). Guideline: every 3-6 months on stable therapy, every 3 months during titration."

  Insulin:
    aliases: ["インスリン", "sliding scale insulin", "insulin glargine", "insulin lispro", "insulin aspart", "regular insulin", "スライディングスケール インスリン"]
    monitoring:
      - lab: HbA1c
        loinc: "4548-4"
        rationale: "Chronic glycemic control monitoring on insulin — HbA1c target <7% (ADA/JDS individualized). Guideline: every 3-6 months on stable therapy, every 3 months during titration."

  # Statin hepatotoxicity monitoring (Issue #757 pass 5). AST + ALT baseline
  # + as-clinically-indicated per ACC/AHA/JAS lipid guidelines — routine
  # frequency is on the low side of the META scope, but baseline coverage
  # analysis showed only 58-60% of statin patients emit LFTs today (via
  # incidental disease-YAML fires), so the enricher closes the remaining
  # gap. AST + ALT are both physiology-modeled in
  # observation/engine.py (BIOLOGICAL_CV 0.120 / 0.195 respectively).
  Atorvastatin:
    aliases: ["アトルバスタチン", "lipitor", "simvastatin", "rosuvastatin", "pravastatin", "シンバスタチン", "ロスバスタチン", "プラバスタチン"]
    monitoring:
      - lab: AST
        loinc: "1920-8"
        rationale: "Statin hepatotoxicity monitoring — AST/ALT baseline + as clinically indicated (myalgia, muscle-weakness). ACC/AHA 2018 + JAS 2022 guideline."
      - lab: ALT
        loinc: "1742-6"
        rationale: "Statin hepatotoxicity monitoring — companion to AST. Discontinue if AST/ALT > 3× upper limit of normal."

  # ACE-i / ARB / thiazide diuretic renal-safety monitoring (Issue #757 pass 6).
  # K + Creatinine 1-2 weeks after start, then every 6-12 months on stable
  # therapy. Baseline coverage analysis: 50-74% of ARB patients emit K/Cr
  # today (via HF/AKI/sepsis disease-YAML incidental fires); enricher closes
  # the remainder. Both physiology-modeled — Creatinine tracks renal_function,
  # K tracks renal_function + acidosis (see physiology/engine.py:673-678).
  # `Cr` alias covered because the mapping enricher matches on Order's
  # display_name (which we emit as the YAML `lab` value, `Creatinine`).
  Candesartan:
    aliases: ["カンデサルタン", "losartan", "valsartan", "olmesartan", "telmisartan", "ロサルタン", "バルサルタン", "オルメサルタン"]
    monitoring:
      - lab: K
        loinc: "2823-3"
        rationale: "ARB/ACE-i renal-safety monitoring — K rise reflects RAAS blockade + reduced aldosterone-driven K excretion. Hold if K > 5.5 mmol/L or Cr rises > 30% baseline."
      - lab: Creatinine
        loinc: "2160-0"
        rationale: "ARB/ACE-i renal-safety monitoring — companion to K. Expected 10-20% Cr rise at start (efferent arteriolar vasodilation); > 30% requires dose reduction."
