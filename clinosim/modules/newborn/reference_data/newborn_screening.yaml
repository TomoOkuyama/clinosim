# Newborn birth-admission clinical workup schedule (#1252).
#
# Locale-specific protocol config for the clinosim.modules.newborn
# enricher. Every value is a real clinical-guideline parameter — the
# engine reads from here, never from hardcoded defaults.
#
# References
#   * JP: 日本小児科学会・厚生労働省「新生児医療の水準に関する調査」;
#     MHLW 新生児医療 資料 (Vitamin K prophylaxis 3-dose oral schedule
#     since 2011); 予防接種法施行令 (Hep B universal since 2016 — owned
#     by the immunization module, referenced here only).
#   * US: AAP Guidelines for Perinatal Care 8th ed. (Vitamin K 1 mg IM
#     within 6 h of birth; erythromycin ophthalmic prophylaxis at
#     birth; hearing screen before discharge; CCHD SpO2 screen at
#     ≥ 24 h; state-varying metabolic panel at day 2-3).
#
# Scope of this file
#   * Vitamin K prophylaxis — implemented.
#   * Apgar, hearing screen, metabolic screen, bilirubin, CCHD SpO2,
#     ophthalmic prophylaxis — reserved slots for follow-up PRs.

# Transcutaneous bilirubin (TcB) monitoring during birth admission
# (#1252 N7). Standard practice — bilirubinometer reading every day
# 1-3 to catch hyperbilirubinemia (physiological jaundice peaks
# day 3-5, most needs no treatment). LOINC 58941-6 (Bilirubin
# transcutaneous). Values mg/dL — normal well-newborn range 4-14 by
# day 3; higher on Asian populations.
bilirubin:
  # Days after birth admission to record TcB reading. day 0 (birth
  # day) is typically outside cadence; day 1-3 are the ones that
  # matter. Skipped if past discharge.
  schedule_days: [1, 2, 3]
  hour_of_day: 10           # morning nursing round
  # Normal (physiological) range mg/dL for term newborn — median 7,
  # bounded 4-14. Yaml carries a normal-cohort mean/std; engine
  # samples via sub-seed. Peak day 3, so day 3 value skewed higher.
  mean_by_day: {1: 6.0, 2: 8.0, 3: 10.0}
  std_by_day: {1: 2.0, 2: 2.5, 3: 3.0}
  clamp_min: 2.0
  clamp_max: 20.0
  loinc: "58941-6"

# CCHD (Critical Congenital Heart Disease) pulse-oximetry screening
# (#1252 N7). US-mandated per state since 2011; JP AAP-recommended
# since 2018. Screens right hand + one foot at ≥ 24 h age.
# Pass: SpO2 ≥ 95 % in both AND ≤ 3 % pre/post-ductal difference.
# Real cohort ~99.9 % pass; true CCHD prevalence ~1/1000. LOINC
# 59408-5 (Oxygen saturation in arterial blood by pulse oximetry).
cchd_pulse_ox:
  hours_after_admission: 24
  # Values by body site — well-newborn median 97 %, tight range.
  right_hand_spo2_mean: 97
  right_hand_spo2_std: 1
  foot_spo2_mean: 97
  foot_spo2_std: 1
  clamp_min: 90
  clamp_max: 100
  loinc: "59408-5"

# US ophthalmic prophylaxis at birth — erythromycin ophthalmic
# ointment 0.5 % applied within 1 h of birth to both eyes,
# CDC-recommended prophylaxis against neonatal gonococcal
# ophthalmia. Not standard in JP (declining gonorrhea rates + higher
# antibiotic-stewardship threshold — MHLW does not mandate).
ophthalmic_prophylaxis:
  us:
    drug_name: "Erythromycin 0.5% ophthalmic ointment (Ilotycin)"
    dose: "1 cm ribbon each eye"
    route: "OPH"                # ophthalmic
    within_hours_of_birth: 1
    # RxNorm SCD 310149 = "erythromycin 0.005 MG/MG Ophthalmic Ointment"
    # (= 5 mg/g = 0.5 %). NLM-verified 2026-09-11 via
    # /REST/rxcui/310149.json (#1264). Replaces the fabricated 313418
    # declared at #1262 (never resolved through emit prior to #1264;
    # the FHIR MedicationAdministration builder reads the US drug
    # catalog directly, not this field, so the bad code was silently
    # dead — but it's now the authoritative single source of truth
    # any future emit path can key on).
    rxnorm_code: "310149"
  jp:                            # not administered in JP standard care
    drug_name: ""

# Tandem-mass-spectrometry newborn metabolic screening (新生児マス・
# スクリーニング) — heel-stick capillary blood sample drawn day 4-6
# of birth admission, tested for a panel of 20+ inborn errors of
# metabolism (PKU, homocystinuria, MSUD, galactosemia, CAH,
# congenital hypothyroidism, MCAD, etc.). Universal in JP since 2014
# (厚生労働省 タンデムマス・スクリーニング事業) and US state-level
# since 2005 (Wilson & Junger criteria expansion). Detection rate
# ~0.1-0.3 % of newborns; 99 %+ pass. This PR (N6) emits only the
# Procedure event for the collection; ServiceRequest + Specimen +
# DiagnosticReport for the full workflow is a follow-up scope.
metabolic_screen:
  # Days after birth admission start for the heel-stick collection.
  # Per-locale — different birth-admission LOS forces different
  # scheduling to keep the screen inside the admission window:
  #   * JP — heel-stick day 4-6 (before typical 5-day discharge);
  #     the median lands at day 4 (厚生労働省 タンデムマス・スクリーニング事業).
  #   * US — heel-stick day 1 (24 h post-birth) before typical 2-day
  #     discharge, per US EHDI Act universal-screening cohort
  #     (AAP Guidelines for Perinatal Care 8th ed. — most states
  #     collect between 24 h and discharge).
  # Skipped if the target day falls past discharge (LOS < schedule_day).
  schedule_day:
    jp: 4
    us: 1
  # Result distribution — weighted sample keyed on baby_id (fresh
  # sub-seed). ~99.7 % pass in real cohorts (locale-invariant).
  result_weights: {pass: 0.997, refer: 0.003}
  # SNOMED procedure code for neonatal metabolic screening (405058008
  # = "Neonatal screening test"). Category 103693007 (diagnostic).
  # Locale-invariant — the same tandem-MS panel is emitted under both
  # 新生児マス・スクリーニング (JP) and state EHDI programs (US).
  procedure_code: "405058008"
  category_code: "103693007"
  # Outcome codes (same SNOMED slots as hearing screen).
  outcome_pass: "385669000"
  outcome_refer: "385671000"

# Automated Auditory Brainstem Response (AABR) hearing screen
# (#1252 N5). Universal newborn hearing screening — JP has ~95 %
# coverage since 2000 (厚生労働省 新生児聴覚検査事業), US ~98 %
# coverage since 2000 (EHDI Act). Screen fires during the birth
# admission on day 1-3 (before discharge). Result is pass/refer;
# ~97 % pass rate on first screen in well-newborn cohorts (AAP JCIH
# 2019 Position Statement — first-screen refer rate 2-4 %; true
# congenital hearing loss ~0.1-0.3 %).
hearing_screen:
  # Timing: hours after birth admission start. Real hospitals run
  # AABR during the 2nd half of the birth admission; day 1 evening
  # is the median.
  hours_after_admission: 24
  # Result distribution (weighted sample; sub-seed keyed on baby_id).
  result_weights: {pass: 0.97, refer: 0.03}
  # SNOMED procedure code for AABR screening (232717001 =
  # "Auditory brainstem response, screening test"). Category
  # 103693007 = "Diagnostic procedure".
  procedure_code: "232717001"
  category_code: "103693007"
  # SNOMED outcome codes (Procedure.outcome).
  outcome_pass: "385669000"       # Successful — no refer
  outcome_refer: "385671000"      # Unsuccessful — needs follow-up test

# Apgar score at 1 min + 5 min (#1252 N4). Standard neonatal
# resuscitation assessment (Virginia Apgar, 1953). Each of the five
# components (color / heart rate / reflex / muscle tone / respiration)
# scores 0-2 → total 0-10. Real Z38.0 well-newborn population
# distribution — 1-min median 8, 5-min median 9.
#
# LOINC 9271-8 (1 min) / 9274-2 (5 min) are the FHIR-standard codes
# consumers key on; the FHIR emit layer resolves those from
# `minute` at build time.
apgar:
  # Score distribution per minute. Values are (score, weight) pairs
  # — deterministic weighted sample keyed on the newborn's patient id
  # (fresh sub-seed; no coupling to caller RNG). Distribution matches
  # real-world well-newborn cohort: ~85 % score ≥ 8 at 1 min,
  # ~97 % score ≥ 8 at 5 min (AAP / MHLW 出生調査).
  minute_1_score_weights: {8: 0.55, 9: 0.25, 7: 0.10, 6: 0.05, 10: 0.03, 5: 0.02}
  minute_5_score_weights: {9: 0.55, 10: 0.30, 8: 0.12, 7: 0.02, 6: 0.01}

# Shift-cadence vital signs (#1252 N3). Newborn birth admissions are
# not driven by the disease-anchored physiology engine (a healthy
# Z38.0 birth has no pathology to perturb), so `observation` module's
# vitals emit stays silent. This block declares a static shift cadence
# for the birth admission so downstream consumers see the T / HR / RR /
# SpO2 series every real neonatal chart carries. Values are drawn from
# the term-newborn `baseline_vitals` seeded on the Patient by N1;
# jitter is intentionally omitted here (added in a follow-up once the
# neonatal physiology model lands).
shift_vitals:
  # Hours-of-day for each nursing shift. Matches the existing
  # daily_3shift note cadence used elsewhere (night → day → evening).
  shift_hours: [0, 8, 16]
  # First recorded vital set lands at the encounter admission time (t=0),
  # subsequent sets follow the shift cadence above. Skipped if past
  # discharge. The birth-encounter LOS defaults are already captured in
  # `perinatal.yaml::encounter.length_of_stay_days` (JP 5 / US 2), so
  # this section only carries the cadence — the total dose count is a
  # pure LOS × cadence derivative.

# Sub-scope PR N2 (this file's first slice): Vitamin K prophylaxis only.
vitamin_k:
  jp:
    # Konakion Syrup (K2, phytomenadione syrup 0.2 %). MHLW 新生児
    # ビタミン K 欠乏性出血症予防 (2011 改訂) — 3 oral doses at
    # (birth-day, day 7 before discharge, 1-month checkup). Only the
    # first two land inside the birth admission (LOS 3-7 d in JP), the
    # third is a post-discharge outpatient event owned by the
    # outpatient / calendar layer (out of scope for this PR).
    drug_name: "ケイツーシロップ (フィトナジオン 2 mg 経口)"
    dose: "2 mg"
    route: "PO"
    schedule_days: [0, 7]   # days after birth; skipped if past discharge
    within_hours_of_birth: 24   # dose 1 must land inside the first 24 h
    # YJ code — MEDIS-registered oral vitamin K2 (phytomenadione)
    # syrup 0.2 %. Not read by the engine at this scope; downstream
    # FHIR MedicationAdministration.medicationCodeableConcept catalog
    # will resolve the display via the existing drug_names_ja.yaml.
    yj_code: "3160009S1024"
  us:
    drug_name: "Vitamin K1 (phytonadione) 1 mg IM"
    dose: "1 mg"
    route: "IM"
    schedule_days: [0]
    within_hours_of_birth: 6
    # RxNorm SCD 312424 = "0.5 ML vitamin K1 2 MG/ML Injection"
    # (2 mg/mL × 0.5 mL ampoule = 1 mg total, matching the AAP newborn
    # IM dose). NLM-verified 2026-09-11 via /REST/rxcui/312424.json
    # (#1264). Replaces the fabricated 977786 declared at #1256 (never
    # resolved through emit prior to #1264; see the ophthalmic block
    # above for the same rationale).
    rxnorm_code: "312424"
