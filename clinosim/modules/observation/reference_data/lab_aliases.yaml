# Lab order-name aliases → canonical analyte (AD-55).
#
# Disease/encounter protocols order labs under several names (stat/serial/repeat
# variants, or a generic name). They all resolve to the canonical analyte whose true
# value is derived by physiology. Data-driven: add an entry here, no code changes.
metadata:
  kind: reference
  name: lab_aliases
  source: clinosim

Troponin: Troponin_I
Troponin_I_stat: Troponin_I
Troponin_I_serial_6h: Troponin_I
Troponin_I_serial_3h: Troponin_I
Troponin_repeat: Troponin_I
# CK_MB is already canonical (derived directly).
# Blood gas repeat → the "ABG" panel (expanded into pH/pCO2/pO2/HCO3 components).
ABG_repeat_1h: ABG
ABG_repeat: ABG
# C4 / Issue #1090: LFT panel semantic aliases. Disease YAMLs (liver
# cirrhosis, cholecystitis, appendicitis, pancreatitis, GI bleed, …)
# order labs under the human-readable name ``Total_bilirubin`` but
# ``derive_lab_values`` keys the derived value under ``T_Bil``. Pre-C4
# the alias table had no entry, so 7+ diseases silently dropped the
# order — resulting in zero Bilirubin.total emit across a p=10k cohort.
# Symmetrical ``Total_protein → TP`` alias is included so any future
# author who writes the human form lands on the physiology key.
Total_bilirubin: T_Bil
Total_protein: TP
# Issue #2299: spellings disease YAMLs and the US code mapping used besides the
# canonical names (APTT, T_Bil, Mg).
aPTT: APTT
T_Bilirubin: T_Bil
Magnesium: Mg
# Issue #2583: every other name the protocols order under. `_stat` names keep
# their urgency on the order; `_repeat` / `_set_N` names are the same test again.
ABG_or_VBG: ABG
Albumin_post_paracentesis: Albumin
BNP_repeat: BNP
Basic_metabolic_panel: BMP
Blood_culture_repeat: Blood_culture
Blood_culture_repeat_x2: Blood_culture_x2
Blood_culture_set_1: Blood_culture
Blood_culture_set_2: Blood_culture
Cr: Creatinine
Glucose_stat: Glucose
Hb_stat: Hb
K_stat: K
PT-INR: PT_INR
PT_INR_stat: PT_INR
aPTT_stat: APTT
Lipid_panel: Lipid
Liver_function: LFT
P: Phosphate
Procalcitonin: PCT
Repeat_coagulation_panel: Coag
Total_cholesterol: TC
Triglycerides: TG
Urinalysis_microscopy: UA
Direct_bilirubin: D_Bil
Eosinophil_count: Eosinophils
Osmolality: Serum_osmolality
Pregnancy_test: hCG_urine
Rapid_Influenza_Antigen: Rapid_influenza_Ag
Rapid_Strep: Rapid_strep_Ag
Reticulocyte_count: Reticulocytes
TRACP-5b: TRACP_5b
Theophylline_level: Theophylline
Anti_Xa_level: Anti_Xa
H_pylori: H_pylori_urease
anti_GBM: Anti_GBM
protein_electrophoresis: SPEP
complement_C3_C4: Complement_C3_C4
Sputum_culture_repeat: Sputum_culture
Urine_culture_repeat: Urine_culture
Urine_culture_sensitivity: Urine_culture
Type_and_Screen: Type_and_screen
Blood_type_and_screen: Type_and_screen
Type_and_Crossmatch: Type_and_crossmatch
Blood_type_crossmatch: Type_and_crossmatch
Blood_Type_Crossmatch: Type_and_crossmatch
