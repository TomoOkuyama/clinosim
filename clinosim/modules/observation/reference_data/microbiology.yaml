# Microbiology culture & antibiotic susceptibility reference data (AD-55 Base).
#
# ALL codes live here (data-driven, never hardcoded in Python). Display text for these
# codes is resolved at output time via clinosim.codes (snomed-ct.yaml / loinc.yaml).
#
# SNOMED organism codes / LOINC susceptibility codes are representative and marked
# `# TODO: verify` against authoritative registries (SNOMED CT, Regenstrief LOINC).
# Antibiogram S/I/R probabilities are approximate (CLSI-style); refine per locale later.

# Specimen types: key -> { snomed (specimen type), test_loinc (culture test) }.
metadata:
  kind: reference
  name: microbiology
  source: clinosim

# culture_orders (Issue #2585): canonical names of the lab orders that request
# a bacterial culture of this specimen. A culture result is linked to (and
# completes) the order(s) of its specimen drawn nearest its collection time,
# within culture_order_match_window_hours. A fungal culture is a different
# test and is not matched.
specimens:
  blood:  { snomed: "119297000", test_loinc: "600-7", culture_orders: [Blood_culture_x2, Blood_culture] }   # Blood specimen / Bacteria id'd in Blood by Culture
  urine:  { snomed: "122575003", test_loinc: "630-4", culture_orders: [Urine_culture] }   # Urine specimen / Bacteria id'd in Urine by Culture
  sputum: { snomed: "119334006", test_loinc: "619-7", culture_orders: [Sputum_culture] }   # Sputum specimen / Bacteria id'd in Sputum by Culture
  # Issue #2640: a fungal blood culture is its own test; with no fungal
  # profile it reports no growth.
  blood_fungal: { snomed: "119297000", test_loinc: "601-5", culture_orders: [Fungal_culture] }   # Blood specimen / Fungus identified in Blood by Culture (tx.fhir.org 2026-11-06)
  wound:  { snomed: "257261003", test_loinc: "634-6", culture_orders: [Wound_culture, wound_culture, order_wound_culture] }   # Swab / Bacteria id'd in Wound by Culture

culture_order_match_window_hours: 6

# Issue #2640: culture results come from culture orders, one per draw. A
# later draw of a specimen that grew (a repeat blood culture after 48-72 h of
# active therapy) grows the same organism again with this probability;
# repeat draws after a negative culture are no growth. Persistent
# bacteraemia at 48-72 h: ~10-20% of positive blood cultures (S. aureus
# higher), e.g. Canzoneri, Clin Infect Dis 2017;65:1776.
repeat_culture_persistence_prob: 0.15

# Issue #2640: a profile culture the protocol did not order is placed by the
# admission workup within this many hours of admission (the first order name
# of the specimen's culture_orders).
workup_culture_window_hours: 24

# Antibiotics: key -> LOINC "<drug> [Susceptibility]" test code.
# All LOINCs verified at NLM clinicaltables.nlm.nih.gov/api/loinc_items/v3/search
# and tx.fhir.org $lookup (Task 0 §6.1, 2026-06-26).
antibiotics:
  ampicillin: "18864-9"  # Issue #2658: was 18862-3 (Amoxicillin+Clavulanate)
  cefazolin: "18878-9"  # Issue #2658: was 18866-4 (Azithromycin)
  ceftriaxone: "18895-3"
  cefepime: "18879-7"  # Verified NLM + tx.fhir.org $lookup 2026-06-26 (Task 0 §6.1)
  ciprofloxacin: "18906-8"  # Verified NLM + tx.fhir.org 2026-06-26 (was incorrectly 18879-7 = Cefepime)
  gentamicin: "18928-2"  # Issue #2658: was 18908-4 (Clindamycin)
  # session 58 Issue #264: 18943-3 / 18949-0 / 18991-2 / 18996-1 were retired
  # from LOINC. Substitutes are real active LOINCs verified against LOINC 2.82:
  #   meropenem            18943-3 → 18943-1 (Meropenem Susc Isolate)
  #   piperacillin_tazo    18949-0 → 18970-4 (Piperacillin+Tazobactam Susc Isolate)
  #   vancomycin           18991-2 → 19000-9 (Vancomycin Susc Isolate)
  #   trimethoprim_sulfa   18996-1 → 18998-5 (Trimethoprim+Sulfamethoxazole Susc Isolate)
  vancomycin: "19000-9"
  piperacillin_tazobactam: "18970-4"
  meropenem: "18943-1"
  trimethoprim_sulfamethoxazole: "18998-5"

# Organisms: id -> snomed code + antibiogram (antibiotic_key -> [P(S), P(I), P(R)]).  # TODO: verify
organisms:
  streptococcus_pneumoniae:
    snomed: "9861002"
    antibiogram:
      ampicillin: [0.75, 0.10, 0.15]
      ceftriaxone: [0.90, 0.07, 0.03]
      vancomycin: [1.00, 0.00, 0.00]
      trimethoprim_sulfamethoxazole: [0.70, 0.05, 0.25]
  haemophilus_influenzae:
    snomed: "44470000"
    antibiogram:
      ampicillin: [0.65, 0.05, 0.30]
      ceftriaxone: [0.98, 0.01, 0.01]
      ciprofloxacin: [0.97, 0.01, 0.02]
  staphylococcus_aureus:
    snomed: "3092008"
    antibiogram:
      cefazolin: [0.70, 0.00, 0.30]          # ~30% MRSA → cefazolin R
      vancomycin: [1.00, 0.00, 0.00]
      trimethoprim_sulfamethoxazole: [0.90, 0.02, 0.08]
      ciprofloxacin: [0.70, 0.05, 0.25]
  streptococcus_pyogenes:
    snomed: "80166006"
    antibiogram:
      ampicillin: [1.00, 0.00, 0.00]
      ceftriaxone: [1.00, 0.00, 0.00]
      vancomycin: [1.00, 0.00, 0.00]
  escherichia_coli:
    snomed: "112283007"
    antibiogram:
      ampicillin: [0.45, 0.05, 0.50]
      ceftriaxone: [0.85, 0.03, 0.12]
      ciprofloxacin: [0.75, 0.05, 0.20]
      gentamicin: [0.90, 0.02, 0.08]
      piperacillin_tazobactam: [0.92, 0.04, 0.04]
      meropenem: [0.99, 0.00, 0.01]
      trimethoprim_sulfamethoxazole: [0.70, 0.02, 0.28]
  klebsiella_pneumoniae:
    snomed: "56415008"
    antibiogram:
      ampicillin: [0.00, 0.00, 1.00]          # intrinsic resistance
      ceftriaxone: [0.85, 0.03, 0.12]
      ciprofloxacin: [0.85, 0.05, 0.10]
      gentamicin: [0.90, 0.02, 0.08]
      piperacillin_tazobactam: [0.88, 0.06, 0.06]
      meropenem: [0.98, 0.01, 0.01]
  pseudomonas_aeruginosa:
    snomed: "52499004"
    antibiogram:
      ciprofloxacin: [0.80, 0.05, 0.15]
      gentamicin: [0.85, 0.05, 0.10]
      piperacillin_tazobactam: [0.88, 0.05, 0.07]
      meropenem: [0.90, 0.04, 0.06]
  proteus_mirabilis:
    snomed: "73457008"
    antibiogram:
      ampicillin: [0.70, 0.05, 0.25]
      ceftriaxone: [0.92, 0.03, 0.05]
      ciprofloxacin: [0.85, 0.05, 0.10]
      gentamicin: [0.88, 0.04, 0.08]
  enterococcus_faecalis:
    snomed: "78065002"
    antibiogram:
      ampicillin: [0.92, 0.02, 0.06]
      vancomycin: [0.90, 0.02, 0.08]          # ~8% VRE

# Disease profiles: which cultures are taken, growth likelihood, and the organism
# distribution conditional on growth.
diseases:
  bacterial_pneumonia:
    cultures:
      - { specimen: blood,  order_prob: 1.0, growth_prob: 0.15 }
      - { specimen: sputum, order_prob: 0.6, growth_prob: 0.50 }
    organisms:
      streptococcus_pneumoniae: 0.40
      haemophilus_influenzae: 0.18
      klebsiella_pneumoniae: 0.15
      staphylococcus_aureus: 0.12
      escherichia_coli: 0.15
  aspiration_pneumonia:
    cultures:
      - { specimen: blood,  order_prob: 1.0, growth_prob: 0.15 }
      - { specimen: sputum, order_prob: 0.7, growth_prob: 0.55 }
    organisms:
      klebsiella_pneumoniae: 0.30
      staphylococcus_aureus: 0.25
      escherichia_coli: 0.20
      pseudomonas_aeruginosa: 0.15
      streptococcus_pneumoniae: 0.10
  sepsis:
    cultures:
      - { specimen: blood, order_prob: 1.0, growth_prob: 0.60 }
    organisms:
      escherichia_coli: 0.30
      staphylococcus_aureus: 0.22
      klebsiella_pneumoniae: 0.16
      streptococcus_pneumoniae: 0.10
      pseudomonas_aeruginosa: 0.12
      enterococcus_faecalis: 0.10
  urinary_tract_infection:
    cultures:
      - { specimen: urine, order_prob: 1.0, growth_prob: 0.80, quantitation: ">100,000 CFU/mL" }
    organisms:
      escherichia_coli: 0.70
      klebsiella_pneumoniae: 0.12
      proteus_mirabilis: 0.10
      enterococcus_faecalis: 0.08
  # Issue #2640: ED / clinic uncomplicated cystitis (encounter condition
  # uti_uncomplicated). Was a categorical lab value: E. coli 65%, Klebsiella
  # 10%, mixed flora 15%, no growth 10%. A mixed-flora (contaminated) culture
  # is reported without an identified pathogen (no growth here).
  uti_uncomplicated:
    cultures:
      - { specimen: urine, order_prob: 1.0, growth_prob: 0.75, quantitation: ">100,000 CFU/mL" }
    organisms:
      escherichia_coli: 0.87
      klebsiella_pneumoniae: 0.13
  cellulitis:
    cultures:
      - { specimen: wound, order_prob: 0.5, growth_prob: 0.45 }
    organisms:
      staphylococcus_aureus: 0.55
      streptococcus_pyogenes: 0.45
