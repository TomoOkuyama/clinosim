# Nursing score thresholds. Sources (authoritative, published instruments):
#   NEWS2: Royal College of Physicians, National Early Warning Score 2 (2017).
#   GCS: Teasdale & Jennett 1974. Braden: Bergstrom et al. 1987. Morse: Morse 1989.
# Aggregation tables are the published scoring rules; not fabricated.
metadata:
  kind: reference
  name: nursing_scores
  source: clinosim

news2:
  # Each band: [low_inclusive, high_inclusive, points]. Use null for open bounds.
  respiratory_rate:
    - [null, 8, 3]
    - [9, 11, 1]
    - [12, 20, 0]
    - [21, 24, 2]
    - [25, null, 3]
  spo2_scale1:
    - [null, 91, 3]
    - [92, 93, 2]
    - [94, 95, 1]
    - [96, null, 0]
  on_supplemental_oxygen: 2   # +2 if on supplemental O2
  temperature_celsius:
    - [null, 35.0, 3]
    - [35.0, 36.0, 1]
    - [36.0, 38.0, 0]
    - [38.0, 39.0, 1]
    - [39.0, null, 2]
  systolic_bp:
    - [null, 90, 3]
    - [91, 100, 2]
    - [101, 110, 1]
    - [111, 219, 0]
    - [220, null, 3]
  heart_rate:
    - [null, 40, 3]
    - [41, 50, 1]
    - [51, 90, 0]
    - [91, 110, 1]
    - [111, 130, 2]
    - [131, null, 3]
  consciousness:        # AVPU: A=0; V/P/U=3 (new confusion or below)
    A: 0
    V: 3
    P: 3
    U: 3
gcs:
  # AVPU → GCS total base band; perfusion/encephalopathy applies a small decrement.
  avpu_base:
    A: 15
    V: 13
    P: 9
    U: 5
  min: 3
  max: 15
  # Issue #2646: eye (1-4) / verbal (1-5) / motor (1-6) components of each
  # total, following the usual order of decline (verbal and eye responses fall
  # first; the motor response is preserved longest). Each row sums to its total.
  components:
    15: [4, 5, 6]
    14: [4, 4, 6]
    13: [3, 4, 6]
    12: [3, 3, 6]
    11: [3, 3, 5]
    10: [2, 3, 5]
    9: [2, 2, 5]
    8: [2, 2, 4]
    7: [2, 1, 4]
    6: [1, 1, 4]
    5: [1, 1, 3]
    4: [1, 1, 2]
    3: [1, 1, 1]
braden:
  # Subscale ranges 1-4 (friction 1-3). Mapped from ADL/consciousness/volume.
  # Barthel (0-100) → activity/mobility subscale via thresholds.
  barthel_to_subscale:   # [barthel_low_inclusive, subscale_value]
    - [0, 1]
    - [25, 2]
    - [60, 3]
    - [90, 4]
morse:
  # Morse Fall Scale item weights (published).
  history_of_falling: 25
  iv_access: 20
  gait_impaired: 20
  gait_weak: 10
  mental_status_forgets_limits: 15
  # Issue #2692: share of inpatients with a fall in the 3 months before the
  # stay, by age (lower bound inclusive). Calibration choice: CDC reports
  # about 1 in 4 adults aged 65+ fall each year, and admitted older adults
  # are enriched for recent falls. Drawn once per stay from a hash (no RNG).
  fall_history_probability_by_age:
    - [0, 0.08]
    - [65, 0.18]
    - [75, 0.30]
  # Issue #2692: the two items not scored before.
  secondary_diagnosis: 15          # more than one medical diagnosis
  # Ambulatory aid from the Barthel mobility item: independent walking needs
  # none (0); walking with help or a walking aid = crutches / cane / walker
  # (15); wheelchair-level mobility clutches furniture to move (30); immobile
  # (bed rest, nurse assist) = 0.
  ambulatory_aid_by_barthel_mobility: {15: 0, 10: 15, 5: 30, 0: 0}
  risk_levels:           # [score_low_inclusive, level]
    - [0, "low"]
    - [25, "moderate"]
    - [45, "high"]

# Issue #2693: the ten Barthel Index items as LOINC panel 96762-0 records them
# (item code, and the LOINC answer for each item score). Codes from the LOINC
# answer lists LL5766-2 ... LL5790-2 (answers-for), checked with tx.fhir.org;
# scores per Mahoney & Barthel 1965. Keys are the CIF ADLAssessment fields.
barthel_items:
  - {field: feeding, loinc: "83184-2", answers: {0: "LA24937-7", 5: "LA31630-9", 10: "LA12302-8"}}
  - {field: bathing, loinc: "83181-8", answers: {0: "LA12304-4", 5: "LA31636-6"}}
  - {field: grooming, loinc: "96767-9", answers: {0: "LA31643-2", 5: "LA31644-0"}}
  - {field: dressing, loinc: "83182-6", answers: {0: "LA12304-4", 5: "LA31637-4", 10: "LA31638-2"}}
  - {field: bowel_control, loinc: "96759-6", answers: {0: "LA31627-5", 5: "LA31626-7", 10: "LA31625-9"}}
  - {field: bladder_control, loinc: "96760-4", answers: {0: "LA31628-3", 5: "LA31626-7", 10: "LA31625-9"}}
  - {field: toilet_use, loinc: "83183-4", answers: {0: "LA12304-4", 5: "LA31631-7", 10: "LA31632-5"}}
  - {field: transfers, loinc: "83185-9", answers: {0: "LA31633-3", 5: "LA31634-1", 10: "LA31635-8", 15: "LA12302-8"}}
  - {field: mobility, loinc: "83186-7", answers: {0: "LA31639-0", 5: "LA31640-8", 10: "LA31641-6", 15: "LA31642-4"}}
  - {field: stairs, loinc: "96758-8", answers: {0: "LA24937-7", 5: "LA31629-1", 10: "LA12302-8"}}
