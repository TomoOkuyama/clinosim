---
# dose_range_resolution.yaml — which end of a protocol dose range an order or
# prescription states (Issue #3265).
#
# Disease protocols write a dose as a range ("25-100mg PO daily", "NS 80-125
# mL/h"). A prescription, an infusion order or a MAR line states ONE dose, so
# every range is resolved once, when the protocol is loaded, by the rule of
# the range's unit:
#
#   start   the lower bound. A range written for a titrated drug is the
#           starting dose and the dose the titration may raise it to; an
#           order is placed at the starting dose (initial dosing in the
#           prescribing information of the titrated drugs, e.g. metoprolol
#           succinate 25-100 mg daily, sertraline 50-100 mg daily, olanzapine
#           10-20 mg daily, fentanyl 25-100 mcg IV PRN). The default.
#   upper   the upper bound. Used only for a maintenance-fluid rate (mL/h),
#           which is not titrated: the order keeps the rate the administration
#           record already gave (the upper bound), which is also the written
#           adult rate that the pediatric Holliday-Segar re-dosing caps.
#
# The written range is kept beside the resolved value as ``titration_range``
# on the protocol entry (metadata for the titration, never printed).
#
# The unit of the range decides; a range with no dose unit ("target INR
# 1.5-2.5", "q6-8h", "x5-7 days") and one that follows "target" or a
# comparison sign ("target UOP > 1-1.5 mL/kg/h") is not a dose and is left.
metadata:
  kind: reference
  name: dose_range_resolution
  source: clinosim

default_rule: start
rules_by_unit:
  mL/h: upper
