# Weight-based single doses for patients under 18 (Issue #2857).
#
# ED in-department doses and ED take-home prescriptions written with an adult
# fixed strength ("Acetaminophen 500mg") are re-dosed for a child from the
# patient's weight: dose = min(mg_per_kg x weight, max_mg), rounded. A drug is
# not given below min_age_months. Drugs not listed keep their written dose.
# Sources: Lexicomp Pediatric & Neonatal Dosage Handbook (single-dose mg/kg and
# maximum), AAP Clinical Report "Fever and Antipyretic Use in Children" (2011,
# reaffirmed 2016) for acetaminophen / ibuprofen; FDA labels for age limits.
#
# Fluids (Issue #2977): an IV isotonic crystalloid bolus written as an adult
# volume ("IV normal saline 1000mL") is ml_per_kg x weight for a child, rounded
# to whole mL and never more than the written adult volume. Source: AHA PALS
# 2020 / AAP — isotonic crystalloid bolus 10-20 mL/kg (20 mL/kg for
# dehydration with poor perfusion).
#
# Inpatient (Issue #3004): inpatient medication orders, maintenance fluids and
# discharge prescriptions of a minor are re-dosed from the weight charted at
# admission with the same drug table — never more than the written adult
# dose. A maintenance fluid's hourly rate is the Holliday-Segar rate
# (maintenance_fluid_bands: 4 mL/kg/h for the first 10 kg, 2 mL/kg/h for the
# next 10 kg, 1 mL/kg/h for each further kg; Holliday & Segar, Pediatrics
# 1957;19:823; AAP Clinical Practice Guideline "Maintenance Intravenous
# Fluids in Children", Pediatrics 2018;142:e20183083), never more than the
# written adult rate.
metadata:
  kind: reference
  name: pediatric_dosing
  source: clinosim

adult_age_years: 18

drugs:
  acetaminophen: {mg_per_kg: 15, max_mg: 1000, min_age_months: 0}
  ibuprofen: {mg_per_kg: 10, max_mg: 400, min_age_months: 6}
  ondansetron: {mg_per_kg: 0.15, max_mg: 4, min_age_months: 1}
  ketorolac: {mg_per_kg: 0.5, max_mg: 30, min_age_months: 6}
  metoclopramide: {mg_per_kg: 0.1, max_mg: 10, min_age_months: 12}
  diphenhydramine: {mg_per_kg: 1, max_mg: 50, min_age_months: 24}
  famotidine: {mg_per_kg: 0.5, max_mg: 20, min_age_months: 3}
  prednisone: {mg_per_kg: 1, max_mg: 40, min_age_months: 0}
  prednisolone: {mg_per_kg: 1, max_mg: 40, min_age_months: 0}
  # Oseltamivir: 2 mg/kg twice daily, max 75 mg (タミフル添付文書 幼小児用量;
  # Japanese Society of Pediatrics influenza guidance; CDC weight bands give
  # 30-75 mg). Cetirizine: 0.25 mg/kg, max 10 mg, from 6 months (FDA label;
  # Lexicomp). Epinephrine: 0.01 mg/kg IM for anaphylaxis (AAP Clinical
  # Report, Pediatrics 2017;139:e20164006) and IV in PALS, max 0.5 mg; the
  # written adult dose (0.3 mg IM) caps it further.
  oseltamivir: {mg_per_kg: 2, max_mg: 75, min_age_months: 0}
  cetirizine: {mg_per_kg: 0.25, max_mg: 10, min_age_months: 6}
  epinephrine: {mg_per_kg: 0.01, max_mg: 0.5, min_age_months: 0}

  # --- Antibiotics (Issue #3082) ---------------------------------------
  # Inpatient intravenous antibiotics, per dose, at the interval the order
  # already carries; the written adult dose remains the ceiling. Sources:
  # The Harriet Lane Handbook (23rd ed., 2023), Formulary; AAP Red Book
  # 2024-2027, "Antibacterial drugs for pediatric patients beyond the
  # newborn period"; cefmetazole: セフメタゾン package insert (小児 1 日
  # 25-100 mg/kg を 2-4 回に分割). min_age_months is 0: a labelled lower age
  # does not withhold an antibiotic here, the dose is weight-based at any age.
  #   ceftriaxone 50 mg/kg q24h (non-CNS), max 2 g
  #   cefotaxime 50 mg/kg q8h, max 2 g
  #   cefepime 50 mg/kg q8-12h, max 2 g
  #   cefazolin 25 mg/kg q8h, max 2 g
  #   cefmetazole 25 mg/kg q6-12h, max 2 g
  #   meropenem 20 mg/kg q8h (non-CNS), max 1 g
  #   piperacillin/tazobactam 100 mg/kg piperacillin q6-8h, max 4 g
  #     piperacillin — dosed as the combined product (3.375 / 4.5 g), so
  #     112.5 mg/kg and 4.5 g of the combination
  #   ampicillin/sulbactam 50 mg/kg ampicillin q6h, max 2 g ampicillin —
  #     as the combined product 75 mg/kg and 3 g
  #   ampicillin 50 mg/kg q6h, max 2 g
  #   vancomycin 15 mg/kg q6h (then adjusted to levels), max 2 g
  #   gentamicin 2.5 mg/kg q8h (traditional dosing; adjusted to levels)
  #   clindamycin IV 10 mg/kg q8h, max 900 mg
  #   metronidazole IV 10 mg/kg q8h, max 500 mg
  #   ciprofloxacin IV 10 mg/kg q12h, max 400 mg
  #   trimethoprim/sulfamethoxazole 5 mg/kg trimethoprim q12h, max 160 mg
  #     trimethoprim
  ceftriaxone: {mg_per_kg: 50, max_mg: 2000, min_age_months: 0}
  cefotaxime: {mg_per_kg: 50, max_mg: 2000, min_age_months: 0}
  cefepime: {mg_per_kg: 50, max_mg: 2000, min_age_months: 0}
  cefazolin: {mg_per_kg: 25, max_mg: 2000, min_age_months: 0}
  cefmetazole: {mg_per_kg: 25, max_mg: 2000, min_age_months: 0}
  meropenem: {mg_per_kg: 20, max_mg: 1000, min_age_months: 0}
  piperacillin_tazobactam: {mg_per_kg: 112.5, max_mg: 4500, min_age_months: 0}
  ampicillin_sulbactam: {mg_per_kg: 75, max_mg: 3000, min_age_months: 0}
  ampicillin: {mg_per_kg: 50, max_mg: 2000, min_age_months: 0}
  vancomycin: {mg_per_kg: 15, max_mg: 2000, min_age_months: 0}
  gentamicin: {mg_per_kg: 2.5, max_mg: 120, min_age_months: 0}
  clindamycin: {mg_per_kg: 10, max_mg: 900, min_age_months: 0}
  metronidazole: {mg_per_kg: 10, max_mg: 500, min_age_months: 0}
  ciprofloxacin: {mg_per_kg: 10, max_mg: 400, min_age_months: 0}
  trimethoprim_sulfamethoxazole: {mg_per_kg: 5, max_mg: 160, min_age_months: 0}

fluids:
  normal_saline: {ml_per_kg: 20}
  lactated_ringer_solution: {ml_per_kg: 20}

# Per-country rules replacing the ones above (Issue #3012). Keys: upper-case
# country code -> drug.
# JP ibuprofen: the ブルフェン package insert doses children from 5 years
# (5-7 y 200-300 mg/day, 8-10 y 300-400 mg/day, 11-15 y 400-600 mg/day, in
# three doses); 4 mg/kg per dose (12 mg/kg/day) falls in those bands at the
# usual weights of each age, and a dose never exceeds the adult 200 mg.
country_overrides:
  JP:
    ibuprofen: {mg_per_kg: 4, max_mg: 200, min_age_months: 60}

maintenance_fluid_bands:
  - {up_to_kg: 10, ml_per_kg_per_h: 4}
  - {up_to_kg: 20, ml_per_kg_per_h: 2}
  - {ml_per_kg_per_h: 1}

# Neonates (Issue #3063): for an infant of at most max_postnatal_age_days days
# of life (the first band that covers the age), a listed drug is dosed
# mg_per_kg x weight with no adult cap, every interval_hours hours. These
# replace the rules above in the neonatal period. Doses for a term or
# late-preterm infant (gestational age above 34 weeks; gestational age is
# not modelled):
# - ampicillin: 150 mg/kg/day divided every 8 hours (50 mg/kg every 8 h) up
#   to 28 days of life - FDA label, ampicillin for injection (DailyMed set
#   06ca924c-5f3a-4924-90f4-5ba623daaa0e, revised 01/2024), Table 1, for
#   septicemia and meningitis, gestational age > 34 weeks; AAP Clinical
#   Practice Guideline for febrile infants (Pantell et al., Pediatrics
#   2021;148:e2021052228), 150 mg/kg/day divided every 8 hours at 8-21 days.
# - gentamicin: 4 mg/kg every 24 hours at every postnatal age to 28 days, the
#   febrile-infant regimen of the AAP 2021 guideline above (4 mg/kg every 24
#   hours). Term and late-preterm infants only; gestational age is not
#   modelled.
# - cefotaxime: 50 mg/kg every 12 hours in the first week of life and every
#   8 hours at 1-4 weeks - FDA label, cefotaxime for injection (DailyMed set
#   ed23b6bc-32c7-4c50-a53d-313ae78e5623, 2024), which needs no gestational
#   age distinction.
neonatal_drugs:
  ampicillin:
    - {max_postnatal_age_days: 28, mg_per_kg: 50, interval_hours: 8}
  gentamicin:
    - {max_postnatal_age_days: 28, mg_per_kg: 4, interval_hours: 24}
  cefotaxime:
    - {max_postnatal_age_days: 7, mg_per_kg: 50, interval_hours: 12}
    - {max_postnatal_age_days: 28, mg_per_kg: 50, interval_hours: 8}
