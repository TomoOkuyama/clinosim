# Weight-based single doses for patients under 18 (Issue #2857).
#
# ED in-department doses and ED take-home prescriptions written with an adult
# fixed strength ("Acetaminophen 500mg") are re-dosed for a child from the
# patient's weight: dose = min(mg_per_kg x weight, max_mg), rounded. A drug is
# not given below min_age_months. Drugs not listed keep their written dose.
# Sources: Lexicomp Pediatric & Neonatal Dosage Handbook (single-dose mg/kg and
# maximum), AAP Clinical Report "Fever and Antipyretic Use in Children" (2011,
# reaffirmed 2016) for acetaminophen / ibuprofen; FDA labels for age limits.
#
# Fluids (Issue #2977): an IV isotonic crystalloid bolus written as an adult
# volume ("IV normal saline 1000mL") is ml_per_kg x weight for a child, rounded
# to whole mL and never more than the written adult volume. Source: AHA PALS
# 2020 / AAP — isotonic crystalloid bolus 10-20 mL/kg (20 mL/kg for
# dehydration with poor perfusion).
#
# Inpatient (Issue #3004): inpatient medication orders, maintenance fluids and
# discharge prescriptions of a minor are re-dosed from the weight charted at
# admission with the same drug table — never more than the written adult
# dose. A maintenance fluid's hourly rate is the Holliday-Segar rate
# (maintenance_fluid_bands: 4 mL/kg/h for the first 10 kg, 2 mL/kg/h for the
# next 10 kg, 1 mL/kg/h for each further kg; Holliday & Segar, Pediatrics
# 1957;19:823; AAP Clinical Practice Guideline "Maintenance Intravenous
# Fluids in Children", Pediatrics 2018;142:e20183083), never more than the
# written adult rate.
metadata:
  kind: reference
  name: pediatric_dosing
  source: clinosim

adult_age_years: 18

drugs:
  acetaminophen: {mg_per_kg: 15, max_mg: 1000, min_age_months: 0}
  ibuprofen: {mg_per_kg: 10, max_mg: 400, min_age_months: 6}
  ondansetron: {mg_per_kg: 0.15, max_mg: 4, min_age_months: 1}
  ketorolac: {mg_per_kg: 0.5, max_mg: 30, min_age_months: 6}
  metoclopramide: {mg_per_kg: 0.1, max_mg: 10, min_age_months: 12}
  diphenhydramine: {mg_per_kg: 1, max_mg: 50, min_age_months: 24}
  famotidine: {mg_per_kg: 0.5, max_mg: 20, min_age_months: 3}
  prednisone: {mg_per_kg: 1, max_mg: 40, min_age_months: 0}
  prednisolone: {mg_per_kg: 1, max_mg: 40, min_age_months: 0}
  # Oseltamivir: 2 mg/kg twice daily, max 75 mg (タミフル添付文書 幼小児用量;
  # Japanese Society of Pediatrics influenza guidance; CDC weight bands give
  # 30-75 mg). Cetirizine: 0.25 mg/kg, max 10 mg, from 6 months (FDA label;
  # Lexicomp). Epinephrine: 0.01 mg/kg IM for anaphylaxis (AAP Clinical
  # Report, Pediatrics 2017;139:e20164006) and IV in PALS, max 0.5 mg; the
  # written adult dose (0.3 mg IM) caps it further.
  oseltamivir: {mg_per_kg: 2, max_mg: 75, min_age_months: 0}
  cetirizine: {mg_per_kg: 0.25, max_mg: 10, min_age_months: 6}
  epinephrine: {mg_per_kg: 0.01, max_mg: 0.5, min_age_months: 0}

fluids:
  normal_saline: {ml_per_kg: 20}
  lactated_ringer_solution: {ml_per_kg: 20}

# Per-country rules replacing the ones above (Issue #3012). Keys: upper-case
# country code -> drug.
# JP ibuprofen: the ブルフェン package insert doses children from 5 years
# (5-7 y 200-300 mg/day, 8-10 y 300-400 mg/day, 11-15 y 400-600 mg/day, in
# three doses); 4 mg/kg per dose (12 mg/kg/day) falls in those bands at the
# usual weights of each age, and a dose never exceeds the adult 200 mg.
country_overrides:
  JP:
    ibuprofen: {mg_per_kg: 4, max_mg: 200, min_age_months: 60}

maintenance_fluid_bands:
  - {up_to_kg: 10, ml_per_kg_per_h: 4}
  - {up_to_kg: 20, ml_per_kg_per_h: 2}
  - {ml_per_kg_per_h: 1}
