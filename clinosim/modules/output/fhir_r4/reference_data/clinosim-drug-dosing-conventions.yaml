---
# clinosim-drug-dosing-conventions.yaml — JA outpatient / inpatient
# dosing conventions used when the FHIR MedicationRequest Dosage
# carries incomplete timing information.
#
# Four previously-inline Python dicts in
# `clinosim/modules/output/fhir_r4/post_process/populate.py` are
# consolidated here under one row per drug. Each row carries:
#
#   * `freq_implied` — scheduled daily frequency (`qd` / `bid` / `tid`)
#     inferred when the dosage has no `timing.repeat.frequency` at all.
#     Only well-defined conventions appear; genuinely variable schedules
#     are intentionally omitted so the resolver falls back to dummy.
#
#   * `meal_context` — JA outpatient dosing time matching
#     `freq_implied`. Consumed to resolve the
#     MHLW `MedicationUsage_ePrescription` CS code via the
#     `(freq, meal_context) → code` table (which stays in Python; it is
#     a 1:1 CS code mapping, not drug-specific data).
#
#   * `prn_mhlw` — optional. Drugs with no scheduled cadence but a
#     well-defined PRN condition code in MHLW CS. Codes verified against
#     `jpfhir-terminology#2.2606.0`.
#
# A drug may define both `freq_implied` + `meal_context` AND `prn_mhlw`;
# the resolver consults `prn_mhlw` first (PRN beats cadence).

metadata:
  source: >-
    clinosim/modules/output/fhir_r4/post_process/populate.py
    (_DRUG_QD_MEAL_CONTEXT, _DRUG_BID_MEAL_CONTEXT, _DRUG_TID_MEAL_CONTEXT,
     _DRUG_IMPLIED_FREQ_QD/BID/TID, _DRUG_PRN_MHLW_CODE)
    prior to hardcoded-audit Finding 2.
  mhlw_cs_version: jpfhir-terminology#2.2606.0

drugs:
