  プラバスタチン:   {freq_implied: qd, meal_context: 就寝前}
  ピタバスタチン:   {freq_implied: qd, meal_context: 就寝前}
  シンバスタチン:   {freq_implied: qd, meal_context: 就寝前}

  # ============== PPIs (proton pump inhibitors) ==============
  ランソプラゾール: {freq_implied: qd, meal_context: 朝食前}
  オメプラゾール:   {freq_implied: qd, meal_context: 朝食前}
  ラベプラゾール:   {freq_implied: qd, meal_context: 朝食前}
  エソメプラゾール: {freq_implied: qd, meal_context: 朝食前}
  ボノプラザン:     {freq_implied: qd, meal_context: 朝食前}

  # ============== Bisphosphonates ==============
