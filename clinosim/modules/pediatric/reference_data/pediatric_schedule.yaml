# Pediatric encounter schedule (Issue #760 META).
#
# Schema (per encounter entry under `encounters:`):
#   <canonical encounter-type key>:
#     age_min:         <int, inclusive>
#     age_max:         <int, inclusive>
#     visits_per_year: <list[int], sampled uniformly per patient per year>
#     encounter_type:  "outpatient" | "emergency" | "inpatient"
#     disease_id:      <string — reused by engine.py dispatch to identify the visit>
#     visit_reason:    <bilingual {en, ja} dict OR string — human-readable,
#                       emitted as the encounter's chief_complaint. Bilingual
#                       dict lets `clinosim.locale.text.resolve_text` pick the
#                       matching locale so JP cohorts get 日本語 chief_complaint
#                       and the JP template narrative fallback does not leak
#                       English (session 90 narrative review finding).>
#
# Foundation pass (pass 1) ships with `encounters:` intentionally empty —
# the module scaffold is wired in but produces zero events, so cohort
# output is byte-identical to pre-module runs. Pass 2 adds well-child
# and immunization; pass 3+ add pediatric acute and adolescent
# behavioural. See `README.md` for the roadmap.

encounters:
  # Well-child visits per AAP / Bright Futures 2023 periodicity schedule.
  # Ages 0-1 (infants) receive 8 well-child visits per AAP schedule
  # (newborn, 1mo, 2mo, 4mo, 6mo, 9mo, 12mo, 15mo) — cohort emit is
  # slightly narrower (6-8) to allow inter-patient variance and account
  # for late enrollment / catch-up variability.
  well_child_infant:
    age_min: 0
    age_max: 1
    visits_per_year: [6, 7, 8]
    encounter_type: outpatient
    disease_id: well_child_infant
    visit_reason:
      en: "Well-child visit — infant"
      ja: "乳児健診"

  # Ages 2-4 (early childhood): 2-3 visits/yr per AAP (18mo, 24mo, 30mo,
  # 3yr, 4yr — annualized 2-3/yr in this age band).
  well_child_early:
    age_min: 2
    age_max: 4
    visits_per_year: [2, 3]
    encounter_type: outpatient
    disease_id: well_child_early
    visit_reason:
      en: "Well-child visit — early childhood"
      ja: "乳幼児健診 (幼児期)"

  # Ages 5-18 (school-age + adolescent): 1 well-child visit / annual
  # physical per AAP + AAP Bright Futures for older children.
  well_child_school:
    age_min: 5
    age_max: 18
    visits_per_year: [1]
    encounter_type: outpatient
    disease_id: well_child_school
    visit_reason:
      en: "Well-child visit — school-age / adolescent annual"
      ja: "小児・思春期年次健診"

  # ---- Immunization visits (#760 pass 3) ----
  # CDC / AAP recommended childhood immunization schedule (2024). Many
  # vaccines are co-administered AT well-child visits, but a fraction
  # occur as standalone catch-up / school-based / travel-related visits.
  # Modelled conservatively — the counts here represent visits distinct
  # from `well_child_*` entries above (which themselves ARE where the
  # majority of infant vaccinations happen). Standalone counts:
  #
  #   Infant (0-1yo) — 3 visits: catch-up / hospital-based supplement to
  #     the well-child series (Hep B birth dose, RSV/nirsevimab season
  #     visit, catch-up MMR/varicella at 12mo when well-child slot
  #     already-used).
  #   Kindergarten entry (4-6yo) — 1 visit: school-entry boosters
  #     (DTaP, IPV, MMR, varicella).
  #   Adolescent (11-13yo) — 1 visit: Tdap + HPV series + MCV4
  #     (routinely a separate school-nurse or pediatrician visit,
  #     distinct from the age-12 well-child physical).
  immunization_infant:
    age_min: 0
    age_max: 1
    visits_per_year: [2, 3]
    encounter_type: outpatient
    disease_id: immunization_infant
    visit_reason:
      en: "Immunization visit — infant catch-up / hospital-supplement"
      ja: "予防接種 (乳児キャッチアップ / 病院補足)"

  immunization_kindergarten:
    age_min: 4
    age_max: 6
    visits_per_year: [1]
    encounter_type: outpatient
    disease_id: immunization_kindergarten
    visit_reason:
      en: "Immunization visit — kindergarten entry boosters (DTaP / IPV / MMR / varicella)"
      ja: "予防接種 (幼稚園・入園前追加接種: DPT-IPV / MR / 水痘)"

  immunization_adolescent:
    age_min: 11
    age_max: 13
    visits_per_year: [1]
    encounter_type: outpatient
    disease_id: immunization_adolescent
    visit_reason:
      en: "Immunization visit — adolescent bundle (Tdap / HPV / MCV4)"
      ja: "予防接種 (思春期: DPT / HPV / 髄膜炎菌)"

  # ---- Pediatric acute presentations (#760 pass 4) ----
  # Ambulatory-visit-generating pediatric acute illnesses. The
  # `visits_per_year` list approximates a probability distribution — the
  # generator uniformly samples one entry, so `[0, 0, 1]` means 33% chance
  # of one visit that year, 67% chance of zero. Frequencies calibrated to
  # published pediatric primary-care utilization (AAP practice patterns,
  # CDC ambulatory-care data 2019 — pre-COVID baseline). Real-world
  # counts include lots of self-limiting URI that never reach a clinician
  # (parental judgment); these entries represent care-seeking encounters.
  #
  # NOTE: modelled as outpatient visits, not ED / inpatient. Bronchiolitis
  # severe enough to hospitalize is a small minority; the majority of
  # bronchiolitis / otitis / URI care is ambulatory. Follow-up work can
  # add an emergency variant when the ED cohort grows.
  pediatric_bronchiolitis:
    age_min: 0
    age_max: 2
    visits_per_year: [0, 0, 0, 1]
    encounter_type: outpatient
    disease_id: pediatric_bronchiolitis
    visit_reason:
      en: "Acute bronchiolitis — outpatient management"
      ja: "急性細気管支炎 (外来管理)"

  pediatric_otitis_media_early:
    age_min: 0
    age_max: 5
    visits_per_year: [0, 1, 1, 2]
    encounter_type: outpatient
    disease_id: pediatric_otitis_media
    visit_reason:
      en: "Acute otitis media — outpatient antibiotic management"
      ja: "急性中耳炎 (外来抗菌薬治療)"

  pediatric_uri_young:
    age_min: 0
    age_max: 5
    visits_per_year: [1, 2, 2, 3]
    encounter_type: outpatient
    disease_id: pediatric_uri
    visit_reason:
      en: "Upper respiratory infection with fever — outpatient supportive care"
      ja: "発熱を伴う上気道感染 (外来対症療法)"

  pediatric_uri_school:
    age_min: 6
    age_max: 12
    visits_per_year: [0, 1, 1, 2]
    encounter_type: outpatient
    disease_id: pediatric_uri
    visit_reason:
      en: "Upper respiratory infection with fever — school-age outpatient visit"
      ja: "発熱を伴う上気道感染 (学童期外来受診)"

  pediatric_uri_adolescent:
    age_min: 13
    age_max: 18
    visits_per_year: [0, 0, 1]
    encounter_type: outpatient
    disease_id: pediatric_uri
    visit_reason:
      en: "Upper respiratory infection with fever — adolescent outpatient visit"
      ja: "発熱を伴う上気道感染 (思春期外来受診)"

  # ---- Injury (#760 pass 5) ----
  # Ambulatory injury encounters (playground / bicycle / MVA passenger,
  # sports). ED / inpatient injury variants are out of scope for this
  # pass (the adult trauma encounter engine already emits severe MVA
  # etc. — see demographics.yaml disease_incidence). AAP well-child
  # anticipatory-guidance sections list injury as the leading cause of
  # ambulatory care encounters for ages 5-18 outside routine visits.
  pediatric_injury_school:
    age_min: 5
    age_max: 12
    visits_per_year: [0, 0, 1]
    encounter_type: outpatient
    disease_id: pediatric_injury
    visit_reason:
      en: "Minor injury — playground / bicycle fall, outpatient management"
      ja: "軽度外傷 (公園遊具・自転車転倒、外来管理)"

  pediatric_injury_adolescent:
    age_min: 13
    age_max: 18
    visits_per_year: [0, 0, 0, 1]
    encounter_type: outpatient
    disease_id: pediatric_injury
    visit_reason:
      en: "Sports-related injury or minor trauma — adolescent outpatient visit"
      ja: "スポーツ関連外傷・軽度外傷 (思春期外来受診)"

  # ---- Adolescent behavioural health (#760 pass 5) ----
  # AAP Bright Futures 2023 includes annual behavioural / mental health
  # screening for adolescents 12+, with a fraction converting to
  # a dedicated follow-up visit when screening flags anxiety / depression /
  # ADHD. Modelled as low-frequency: ~1 in 4 adolescents per year has
  # a behavioural-health-labelled ambulatory encounter distinct from the
  # annual well-child physical (CDC BRFSS + MEPS ambulatory-care data).
  pediatric_behavioural_adolescent:
    age_min: 12
    age_max: 18
    visits_per_year: [0, 0, 0, 1]
    encounter_type: outpatient
    disease_id: pediatric_behavioural
    visit_reason:
      en: "Adolescent behavioural / mental health follow-up (anxiety / mood / ADHD screening positive)"
      ja: "思春期メンタルヘルスフォローアップ (不安・気分障害・ADHD スクリーニング陽性)"
