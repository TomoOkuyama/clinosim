# AD-55 Base SDOH social-history reference (PR2 2026-06-24).
#
# US Core profiles:
#   - Smoking Status: http://hl7.org/fhir/us/core/StructureDefinition/us-core-smokingstatus
#     LOINC 72166-2 "Tobacco smoking status NHIS"
#     SNOMED CT values per US Core IG (3 simplified tiers)
#   - Alcohol use: LOINC 11331-6 "History of Alcohol use"
#     SNOMED CT values per HL7 social history (3 simplified tiers)
#
# Display strings for SNOMED codes are resolved at FHIR output time via
# clinosim.codes.lookup("snomed-ct", code, lang) — NOT duplicated here.
# All 6 SNOMED codes are registered in codes/data/snomed-ct.yaml with
# `en` + `ja` displays (verified by PR #68 SNOMED CT authority crosswalk).

smoking_status:
  loinc: "72166-2"
  category: "social-history"
  values:
    never:   {snomed: "266919005"}  # Never smoked tobacco
    former:  {snomed: "8517006"}    # Ex-smoker
    current: {snomed: "449868002"}  # Current every day smoker

alcohol_use:
  loinc: "11331-6"
  category: "social-history"
  values:
    none:   {snomed: "105542008"}   # Current non-drinker of alcohol
    social: {snomed: "28127009"}    # Social drinker
    heavy:  {snomed: "86933000"}    # Heavy drinker

# === Issue #938: pediatric age gate for adult social-history observations ===
# Every patient carried an alcohol-* + smoking-* Observation regardless of age,
# so 321 toddlers (0-5) and 553 school-age children (6-12) rendered "非飲酒者"
# and "喫煙歴なし" as documented assessments — a workflow that does not exist
# in real pediatric care.
#
# In real EHRs adult lifestyle-risk documentation starts in adolescence:
#   - USPSTF places alcohol / tobacco use screening at >= 11-13
#   - MHLW pediatric guidance defers formal adult social-history entries to
#     >= 15 (start of 高校 health-checkup lifecycle)
# We use age 15 as the cutoff. Below this age, no alcohol-* / smoking-*
# Observation is emitted (an absent Observation is spec-clean; downstream
# adult-lifestyle-coverage denominators no longer inflate to 100%).
#
# Both codes are gated jointly here (a single "adult social-history age") —
# splitting into per-topic cutoffs is easy if a future graduated policy
# wants smoking at 12 and alcohol at 15.
age_gates:
  # Minimum patient age at which an alcohol-* Observation may be emitted.
  alcohol_min_age: 15
  # Minimum patient age at which a smoking-* Observation may be emitted.
  smoking_min_age: 15
