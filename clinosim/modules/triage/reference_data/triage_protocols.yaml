# Triage protocols(JTAS/ESI + arrival_mode)
# JTAS 1-5 = 日本臨床救急医学会 JTAS 2017
# ESI 1-5 = AHRQ ESI Version 4

metadata:
  kind: reference
  name: triage_protocols
  source: clinosim

triage_systems:
  JTAS:
    levels:
      "1": {name: {en: "Resuscitation", ja: "蘇生"}, target_wait_min: 0}
      "2": {name: {en: "Emergent", ja: "緊急"}, target_wait_min: 15}
      "3": {name: {en: "Urgent", ja: "準緊急"}, target_wait_min: 30}
      "4": {name: {en: "Less Urgent", ja: "低緊急"}, target_wait_min: 60}
      "5": {name: {en: "Non-Urgent", ja: "非緊急"}, target_wait_min: 120}
  ESI:
    levels:
      "1": {name: {en: "Resuscitation"}, target_wait_min: 0}
      "2": {name: {en: "Emergent"}, target_wait_min: 10}
      "3": {name: {en: "Urgent"}, target_wait_min: 30}
      "4": {name: {en: "Semi-Urgent"}, target_wait_min: 60}
      "5": {name: {en: "Non-Urgent"}, target_wait_min: 120}

arrival_modes:
  - walk-in
  - ambulance
  - police
  - helicopter
  - private_vehicle

# severity → triage_level 分布(country-independent)
severity_to_triage_distribution:
  mild:
    "3": 0.15
    "4": 0.55
    "5": 0.30
  moderate:
    "2": 0.15
    "3": 0.60
    "4": 0.25
  severe:
    "1": 0.20
    "2": 0.55
    "3": 0.25

# ESI v4 resource rule (AHRQ ESI Implementation Handbook, decision point C;
# Issue #2864). A draw of level 3-5 becomes the level for the number of
# distinct resource types the ED visit orders: labs (any number) count as one,
# imaging (incl. ECG) as one, IV fluids and IV / IM / nebulized medications
# together as one, procedures as one. JTAS levels 3-5 follow the same rule.
resource_rule:
  # level for 0, 1 and >= 2 resource types
  level_by_count: ["5", "4", "3"]
  # medication routes that are a resource (PO / SL / topical ones are not)
  parenteral_routes: [IV, IVPB, IV push, IV infusion, IM, intramuscular, INH, inhaled, inhalation, NEB, nebulized, nebulizer]
  # procedure-order keywords that are not a resource (simple wound care,
  # splints, slings, cold / heat packs, oxygen)
  non_resource_procedures: [ice pack, heat pack, elastic bandage, splint, sling, cast, dressing, collar, irrigation, oxygen]

# arrival_mode base rate(severity で修正、下記 severity_multipliers 適用)
arrival_mode_base_distribution:
  walk-in: 0.55
  ambulance: 0.35
  private_vehicle: 0.08
  police: 0.01
  helicopter: 0.01

# severity severe → ambulance +30% shift
arrival_mode_severity_multipliers:
  mild:
    walk-in: 1.4
    ambulance: 0.4
    private_vehicle: 1.0
    police: 1.0
    helicopter: 0.0
  moderate:
    walk-in: 1.0
    ambulance: 1.0
    private_vehicle: 1.0
    police: 1.0
    helicopter: 1.0
  severe:
    walk-in: 0.3
    ambulance: 2.0
    private_vehicle: 0.5
    police: 2.0
    helicopter: 5.0
