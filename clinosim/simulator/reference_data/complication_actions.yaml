# What the `actions` a disease YAML declares on a complication do (Issue #3543).
#
# Read by clinosim/simulator/complication_actions.py and applied in the
# inpatient daily loop (simulator/daily_loop.py `_apply_complications`).
#
# Only `icu_transfer`, the antibiotic actions, the airway action and the
# anticoagulation / PPI treatment actions below are executed; every
# other action string of a complication is a clinical note that the loop does
# not act on (that is a known limit, not a statement that the care is absent).
#
#   - `aliases`: one canonical spelling per action. The disease YAMLs are
#     written with the canonical key; an alias is still read as its canonical
#     key (a guard test keeps aliases out of the YAMLs).
#   - `antibiotic_actions`: the executed antibiotic actions. Each maps a
#     complication to the disease protocol whose `drugs.first_line` is its
#     empirical regimen. The regimen is not authored here: it is the first
#     antibiotic entry (catalog class `antibiotic`) of that protocol's
#     first-line block for the stay's country, with the dose, route and source
#     that protocol documents. One agent is ordered: the later entries of a
#     block are alternatives or add-ons (a second first-line drug, atypical
#     coverage), and an entry with a `probability` (an add-on chosen by a draw)
#     is skipped, so the choice is deterministic. The drug-safety gate
#     (allergy, interaction, disease rules) gives an alternative when the agent
#     is ruled out.
#       start_antibiotic                 the infection's own first-line agent
#                                        (pneumonia, urinary tract, skin and
#                                        soft tissue).
#       start_broad_spectrum_antibiotic  an infection of an unknown or mixed
#                                        source (sepsis, peritonitis,
#                                        cholangitis, necrotising infection,
#                                        hospital-acquired pneumonia): the
#                                        empirical broad-spectrum agent of the
#                                        sepsis protocol (first-line, source
#                                        and renal adjustments documented
#                                        there).
#   - `order_hour`: the hour of the onset day the order is written (the onset
#     is stamped at noon).
#   - `no_regimen`: complications that declare an executed antibiotic action
#     but have no regimen in the protocols; they get no order (an abscess or a
#     stump appendicitis needs a source-specific plan the protocols do not
#     carry).
#   - `airway_actions` / the airway aliases: a complication that declares
#     intubation or mechanical ventilation (`intubation`, `mechanical_ventilation`,
#     `intubation_mechanical_ventilation`, a lung-protective ventilation
#     strategy, which only a ventilated patient has) secures the airway at its
#     onset through the same path as the state-driven intubation (ventilator,
#     ICU, NPO diet, the intubation procedure), unless the patient has decided
#     against intubation (Issue #3551) or is already intubated (Issue #3639).
#     `not_executed_airway_actions` are conditional intentions ("consider
#     intubation if severe"), which are not acted on. Non-invasive ventilation
#     is started by `oxygen_course.yaml niv.start_action` (Issue #3705).
#   - `treatment_actions` / `stop_actions` / `not_executed_treatment_actions`
#     (Issue #3864): the executed anticoagulation and acid-suppression actions.
#       start_anticoagulation  a deep vein thrombosis / pulmonary embolism gets
#                              therapeutic anticoagulation: the first agent of
#                              the regimen protocol's `first_line` block (class
#                              `anticoagulant`) that the patient's creatinine
#                              clearance (Cockcroft-Gault) allows by the entry's
#                              `renal_adjustment` ("avoid" moves on to the next
#                              entry) and the drug-safety gate passes. The order
#                              replaces the planned VTE prophylaxis from its time
#                              and the discharge prescription continues the
#                              anticoagulant (`discharge_block`). `blocked_by`
#                              lists the active bleeding complications that rule
#                              it out; a therapeutic anticoagulant already
#                              running is not doubled. When the agent is a
#                              parenteral one (heparin) and the block has an
#                              oral agent after it (Japan: "60mg PO daily (after
#                              5+ days heparin)"), the heparin runs for
#                              `lead_in_days` and the oral agent is ordered with
#                              it, given from the day the lead-in ends.
#       iv_ppi                 gastrointestinal bleeding: the IV high-dose PPI of
#                              the gastrointestinal-bleeding protocol (its first
#                              IV entry; the oral step-down entry is not
#                              ordered), for `course_days` (the regimen text
#                              "x 72h").
#       start_oral_vancomycin  C. difficile colitis: the oral regimen authored
#                              under the action (below), 10 days.
#       hold_anticoagulation   see `stop_actions` below.
#     An action that only considers or conditions the treatment ("start
#     anticoagulation cautiously", "anticoagulation if safe") or changes a
#     running regimen (increase, optimize, intensify) is not executed.
#   - `not_executed_antibiotic_actions`: antibiotic-related actions that are
#     not a first antibiotic order (a change of a running antibiotic, a stop,
#     a course length, a test) and so are not executed.

metadata:
  kind: reference
  name: complication_actions
  source: clinosim

order_hour: 13

aliases:
  start_antibiotics: start_antibiotic
  antibiotics: start_antibiotic
  broad_spectrum_antibiotics: start_broad_spectrum_antibiotic
  broad_spectrum_antibiotic: start_broad_spectrum_antibiotic
  intubation: intubate
  emergent_intubation: intubate
  mechanical_ventilation: intubate
  intubation_mechanical_ventilation: intubate
  intubation_lung_protective_ventilation: intubate
  lung_protective_ventilation: intubate
  lung_protective_ventilation_6ml_kg: intubate
  anticoagulation: start_anticoagulation
  anticoagulation_with_renal_dosing: start_anticoagulation
  anticoagulation_renal_adjusted: start_anticoagulation
  start_oral_vancomycin_125mg_qid: start_oral_vancomycin
  stop_offending_antibiotic_if_possible: stop_offending_antibiotic

airway_actions:
  - intubate

not_executed_airway_actions:
  - consider_intubation_if_severe
  - consider_intubation_if_grade_4


antibiotic_actions:
  start_antibiotic:
    aspiration_pneumonia: aspiration_pneumonia
    urinary_tract_infection: urinary_tract_infection
    surgical_site_infection: cellulitis
    wound_infection: cellulitis
    bacterial_superinfection: bacterial_pneumonia
  start_broad_spectrum_antibiotic:
    hospital_acquired_pneumonia: sepsis
    sepsis: sepsis
    peritonitis: sepsis
    bowel_perforation: sepsis
    cholangitis: sepsis
    necrotizing_fasciitis: sepsis

no_regimen:
  - intra_abdominal_abscess
  - stump_appendicitis

not_executed_antibiotic_actions:
  - add_antibiotic
  - adjust_antibiotic_dose
  - antibiotics_carbapenem
  - antibiotics_if_cellulitis
  - confirm_antibiotic_sensitivity
  - escalate_antibiotic
  - escalate_antibiotics
  - prolonged_antibiotics_4_6_weeks
  - prophylactic_antibiotic_discussion
  - targeted_antibiotic

treatment_actions:
  start_anticoagulation:
    protocol: deep_vein_thrombosis
    block: first_line
    drug_class: anticoagulant
    intent: complication_anticoagulation
    discharge_block: discharge_oral
    lead_in_days: 5
    blocked_by:
      - gi_bleeding
      - bleeding_on_anticoagulation
      - major_bleeding
      - bleeding_complication
      - bleeding_uremic_platelet_dysfunction
  start_oral_vancomycin:
    # The C. difficile regimen (Issue #3896): chosen by country and severity.
    drug_class: antibiotic
    intent: complication_oral_antibiotic
    severity:
      criteria:
        - {lab: WBC, at_least: 15000}
        - {lab: Creatinine, above: 1.5}
    regimen_by_severity:
      non_severe:
        us:
          - {drug_id: vancomycin, dose: "125mg PO QID x10 days", route: PO, duration_days: 10}
        japan:
          - {drug_id: metronidazole, dose: "500mg PO TID x10 days", route: PO, duration_days: 10}
      severe:
        us:
          - {drug_id: vancomycin, dose: "125mg PO QID x10 days", route: PO, duration_days: 10}
        japan:
          - {drug_id: vancomycin, dose: "125mg PO QID x10 days", route: PO, duration_days: 10}
    blocked_by: []
  IV_PPI:
    protocol: gi_bleeding
    block: first_line
    drug_class: ppi
    intent: complication_ppi
    route: IV
    course_days: 3
    first_only: true

# Executed stop actions (Issue #3864): every running drug of `classes` (but
# those of `spared_classes`) gets a `DISCONTINUE:` stop marker at the onset
# order time; the doses charted from it on are cut after the stay, and an
# antibiotic stopped this way is not prescribed at discharge (it is held there
# and logged: `complication_actions.complication_stopped_antibiotics`).
#   hold_anticoagulation       a bleed holds the running anticoagulants, and the
#                              planned VTE prophylaxis (`planned_prophylaxis`).
#   stop_offending_antibiotic  C. difficile colitis: the inciting antibiotic is
#                              stopped. IDSA/SHEA 2017: "Discontinue therapy with
#                              the inciting antibiotic agent(s) as soon as
#                              possible". Every running systemic antibiotic is
#                              taken as inciting, except the nitroimidazole
#                              (metronidazole is itself active against C.
#                              difficile); no replacement is ordered (the
#                              regimen of the underlying infection is not
#                              re-planned).
stop_actions:
  hold_anticoagulation:
    classes: [anticoagulant]
    intent: complication_anticoagulant_hold
    planned_prophylaxis: true
  stop_offending_antibiotic:
    classes: [antibiotic]
    spared_classes: [antibiotic.nitroimidazole]
    intent: complication_antibiotic_stop
    # Issue #3896: a replacement antibiotic for the infection that is still
    # under treatment is ordered only when the protocol authors a lower-CDI-risk
    # alternative as this `drugs` block. No protocol does (a guard test fails
    # the day one does), so none is ordered and the stop marker says so.
    replacement_block: lower_cdi_risk_alternative

# C. difficile infection regimen (Issues #3864, #3896). No disease protocol
# carries one, so it is authored here under `start_oral_vancomycin`, by severity
# (`regimen_by_severity`) and country.
#   Severity (`severity.criteria`): severe when the latest WBC at or before the
#   order is >= 15,000/uL or the latest creatinine is > 1.5 mg/dL, else
#   non-severe; a lab without a result counts as not met. Japanese guideline
#   (Clostridioides difficile infection guideline 2022, Japanese Society of
#   Chemotherapy and Japanese Association for Infectious Diseases; Journal of
#   Japanese Society of Chemotherapy Vol. 71 No. 1), p. 40, Table 1 (severity
#   definitions): WBC >= 15,000 in the IDSA/SHEA 2018 and ACG 2021 columns, serum
#   creatinine > 1.5 mg/dL in the ACG 2021 column (the IDSA/SHEA column states
#   >= 1.5 x baseline, which needs a baseline the simulator does not carry).
#   Japan, p. 46, treatment recommendation Table 1: a non-severe first episode
#   "メトロニダゾールを 1 回 500 mg 1 日 3 回 10 日間経口投与または点滴静注する"
#   (strong recommendation, A); a severe first episode "バンコマイシンを 1 回
#   125 mg 1 日 4 回 10 日間経口投与する" (strong recommendation, A), the
#   fidaxomicin 200 mg twice daily for 10 days being the alternative. Oral
#   metronidazole is the route ordered (the guideline gives IV as an
#   alternative). The guideline's fulminant regimen (shock, hypotension, toxic
#   megacolon, paralytic ileus: vancomycin 500 mg four times daily) is not
#   modelled: the stay carries none of those as a state at the onset.
#   US (IDSA/SHEA 2017 update: "vancomycin 125 mg orally 4 times per day or
#   fidaxomicin 200 mg twice daily for 10 days"; 2021 focused update: fidaxomicin
#   is suggested over standard vancomycin for an initial episode, the vancomycin
#   comparator being "125 mg orally 4 times daily for 10 days"): oral vancomycin
#   for both severities. Fidaxomicin is not in the drug catalog and is not
#   ordered (neither a Japanese YJ code nor an FDA/PMDA dose was added here).
#   Metronidazole is the catalog drug of RxNorm 6922 (RxNav: TTY=IN
#   metronidazole), classes antibiotic.nitroimidazole (so the stop action
#   spares it, and it continues at discharge as the rest of the 10-day course).

not_executed_treatment_actions:
  - anticoagulation_consideration
  - anticoagulation_if_safe
  - avoid_anticoagulation_if_effusion
  - evaluate_anticoagulation_vs_IVC_filter
  - evaluate_bleeding_risk_vs_anticoagulation
  - increase_anticoagulation
  - intensify_anticoagulation
  - optimize_anticoagulation
  - start_anticoagulation_cautiously
