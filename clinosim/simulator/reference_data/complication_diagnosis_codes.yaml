# Which in-hospital complications are a coded diagnosis of the stay (Issue #3673).
#
# `complications_occurred` tokens (the names disease protocols fire, with the
# onset of the event) that name a disease. The inpatient simulator turns each
# one into a dated `clinical_diagnosis.working_diagnoses` entry (source
# `in_hospital_complication`), which the FHIR output emits as a secondary
# encounter-diagnosis Condition with the onset of the complication, so the
# Condition, Encounter.diagnosis and the discharge summary agree with the
# narrated course. A token absent here is an event with no diagnosis code (an
# intubation, a bleeding event, an arrhythmia, a mechanism) and stays a
# narrative-only complication. The delirium tokens are coded by the delirium
# rule (`delirium_derivation.yaml`), not here.
#
# Codes are the internal diagnosis codes the rest of the simulator uses
# (ICD-10-CM granularity); the locale mapping (`locale/<cc>/code_mapping_
# diagnosis.yaml`, `map_diagnosis_code`) turns them into the US ICD-10-CM leaf
# or the JP WHO ICD-10 code at output time. Every code is registered in
# `codes/data/icd-10-cm.yaml` and, after that mapping, `icd-10.yaml` with the
# CMS description and the MHLW Japanese name (Issue #3872 added the codes of
# the tokens below it). Where `death_cause_chain.yaml`
# `immediate_cause_complications` names a token, the code is the same (guard
# test).
#
# Every complication token a disease protocol can fire is classified (guard
# test): coded here (`codes`), a delirium token (coded by the delirium rule), a
# `non_diagnosis` token (an event, a treatment effect or a nonspecific term
# that names no disease: it stays narrative-only), or a `pending` token (a
# disease-like complication whose code is not yet chosen and verified; it stays
# narrative-only until it moves to `codes`; none is pending now).
#
# `distinct_code_categories`: ICD-10 3-character categories whose members are
# different diagnoses, so the first-onset-per-category rule keys on the full
# code (E87: hypokalemia and hyperkalemia are two diagnoses of one category;
# F10: the withdrawal delirium F10.231 is a different diagnosis from the stay's
# F10.23x withdrawal; K86: a pseudocyst K86.3 and a duct disruption K86.89;
# T81: a wound infection T81.4-, a wound dehiscence T81.31XA). A category the
# stay itself carries still blocks a complication of the same category when it
# is not listed (a recurrent subdural hematoma, a stump appendicitis).
metadata:
  kind: reference
  name: complication_diagnosis_codes
  source: clinosim

