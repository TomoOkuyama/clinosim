# When supplemental oxygen is weaned during an inpatient stay (Issue #3469).
#
# Read by clinosim/simulator/oxygen_course.py (`oxygen_course_rules`). The
# oxygen state of a stay (on / off, device, flow) is carried across readings
# and days: oxygen starts at the first room-air SpO2 below the target (92 %,
# 88 % for a COPD exacerbation: simulator/_oxygen_therapy_thresholds.py and
# modules/observation/oxygenation.py), is titrated up only while the SpO2
# recorded on oxygen is still below the target, and is stopped (weaned) only
# when the room-air SpO2 has stayed at or above `target + wean_margin_spo2`
# for `wean_hours`, over at least `wean_min_readings` readings. A later
# reading below the target starts a new course. Before this, each reading
# decided on its own, so the flag flipped on and off between readings.
#
# Source (read in the session that wrote this file):
#   - BTS Guideline for oxygen use in adults in healthcare and emergency
#     settings (O'Driscoll et al., Thorax 2017; 72 Suppl 1: ii1-ii90), summary
#     for hospital use (BTS web appendix 3): "Oxygen should be prescribed to
#     achieve target saturations of 94-98% for most acutely ill patients or
#     88-92% for those at risk of hypercapnic respiratory failure." and
#     "Oxygen therapy should be reduced and eventually discontinued in stable
#     patients with satisfactory oxygen saturation." -> oxygen is stopped only
#     in a stable patient whose saturation is satisfactory, not on one reading.
# The guideline gives no duration or margin: `wean_hours`, `wean_margin_spo2`
# and `wean_min_readings` are clinosim modelling choices (hysteresis so that a
# noisy reading near the target does not toggle oxygen).
metadata:
  kind: reference
  name: oxygen_course
  source: clinosim

wean_hours: 12
wean_margin_spo2: 1.0
wean_min_readings: 2

# Recorded oxygen flows are rounded to this step (Issue #3556): flowmeters are
# set in whole or half litres, so "2.9 L/min" is not a setting. Applied when
# the flow is recorded, after the SpO2 has been computed from the unrounded
# flow. Source status: the step is a clinosim modelling choice (not taken from
# a guideline read in the session that wrote it).
flow_step_lpm: 0.5

# Mechanical ventilation after an intubation (Issue #3535). The stay is
# ventilated from the intubation until the extubation rule below is met, or
# until death. While ventilated the recorded oxygen device is the ventilator
# (no flow: a ventilator has a FiO2, not an oxygen flow), the SpO2 is the
# room-air value raised as if by `equivalent_flow_lpm` of oxygen (the same
# flow-proportional model as other devices, capped at 98 %), and the diet is
# `diet`. The patient is extubated at the start of the day after the first
# day on which `consecutive_days` consecutive end-of-day states had an
# oxygenation impairment below `oxygenation_impairment_below` and a
# consciousness impairment below `consciousness_impairment_below`, at least
# `min_days_after_intubation` days after the intubation day, or after
# `max_days` ventilated days. No discharge happens on a ventilated day.
# After extubation the patient is on `post_extubation_device` at
# `post_extubation_flow_lpm` and oxygen is weaned by the rules above.
#
# Source status: NONE of the values below is taken from a guideline read in
# the session that wrote this block. They are clinosim modelling choices:
# `oxygenation_impairment_below` and `consciousness_impairment_below` are set
# well under the intubation thresholds (AIRWAY_OXYGENATION_MIN 0.6,
# AIRWAY_CONSCIOUSNESS_MIN 0.62 in simulator/_daily_loop_thresholds.py) so
# that an extubated patient no longer meets the airway criteria; the day
# counts and `equivalent_flow_lpm` are plain choices (a ventilated patient is
# oxygenated at least as well as on a 10 L/min mask). Reviewers with a
# weaning guideline at hand should replace them.
ventilation:
  device: ventilator
  equivalent_flow_lpm: 10.0
  diet: NPO
  oxygenation_impairment_below: 0.4
  consciousness_impairment_below: 0.4
  consecutive_days: 1
  min_days_after_intubation: 1
  max_days: 14
  post_extubation_device: nasal_cannula
  post_extubation_flow_lpm: 4.0
