# clinosim LLM Service Configuration — S117 verify + Fix C
#
# vLLM guided_json / structured output variant. Constrains the LLM's
# generated tokens to valid JSON grammar so `template_seed_bundle:
# JSON parse failed` fallback goes to 0 (user goal, S117 mid-verify).
#
# NOTE: this passes response_format via extra_body to vLLM's OpenAI
# compat endpoint. The vLLM provider code must forward `response_format`
# in the /v1/chat/completions payload. If clinosim's vllm.py doesn't
# forward it, we'll need to add that as a small code patch pre-boot.

judgment:
  mode: "template"
  provider: ""

narrative:
  mode: "llm"
  provider: "vllm"
  vllm:
    endpoint: "http://localhost:8000"
    model: "Qwen/Qwen3.8-27B-FP8"
    # Disable Qwen thinking mode (else </think> block breaks JSON parse
    # even when using guided_json — the constraint applies to the whole
    # response, so thinking content violates the schema).
    enable_thinking: false
    seed: 42
    # Boot 12 (2026-09-20) 300→900s. Boot 13 (2026-09-21) 900→1200s.
    # With max_tokens=8000 in `narrative_seed_bundle.yaml`, worst-case
    # discharge_summary decode approaches 500-600s at ~13 tok/s per seq
    # (aggregate 830 tok/s across 64 seqs); 900s covered Boot 12 v2 down
    # to 1 residual template fallback. 1200s adds margin for edge case
    # patients that queue-wait on prefill.
    timeout_seconds: 1200
    # Force valid JSON output at the decode step. vLLM 0.27.1 supports
    # response_format={type: json_object} which triggers xgrammar-based
    # constrained decoding. Zero perplexity impact on prose content
    # inside the JSON string values.
    response_format: {"type": "json_object"}
  model_map:
    small: "Qwen/Qwen3.8-27B-FP8"
    medium: "Qwen/Qwen3.8-27B-FP8"
    large: "Qwen/Qwen3.8-27B-FP8"
  timeout_seconds: 1200
  retry_attempts: 1
  retry_backoff_seconds: 2

prompts:
  registry_path: null

cache:
  enabled: false
